# =============================================================================
# Balance Druid - spec 102 - patch 12.1 (Midnight) - Elune's Chosen, M+.
# =============================================================================
#
# Lists, in the order `main` calls them:
#   main            entry point: plumbing, target guards, form, then delegates
#   heal_support    Mark of the Wild, Thorn Bloom
#   defensives      Barkskin, Bear Form/HotW/Frenzied Regen, root cleanse
#   interrupts      Solar Beam (target/mouseover/focus)
#   dispels         Remove Corruption, Soothe (target and mouseover)
#   trinkets        trinkets + combat potion, tied to the burst window
#   moving_st/aoe   instant-only priority while moving
#   ec_st / aoe     stationary damage priority, 1 / 2+ enemies
#   mouseover_dots  called from `aoe`, spreads DoTs without changing target
#
# Priority:
#   ST   DoTs -> Eclipse -> Incarnation -> Fury of Elune -> free procs
#        -> Starsurge -> Starfire
#   AoE  anti-cap Starfall -> DoTs -> Eclipse -> Incarnation -> Fury of Elune
#        -> free procs -> Starfall -> Starsurge weave -> Starfire
#
# WHY ANY OF IT IS THE WAY IT IS: .agents/rationale/Balance.md
# That file carries every measurement, every rejected alternative and every
# bug this file has already been through. Read it before changing a line -
# most of what looks improvable here was tried and reverted.
#
# REFERENCE BUILD, 4.6.0: the most-used Balance build on WarcraftLogs. It
# replaced Jeannelin's +18 build and moved five nodes:
#   gained  Sundered Firmament, Stellar Amplification, Meteorites
#   lost    Orbit Breaker, Elune's Guidance
# Fluid Form stays, hero tree stays Elune's Chosen, Starweaver is still absent
# so the lines flagged dead for it remain dead.
#
# Losing Elune's Guidance is the change that matters: it shortened the
# Incarnation cooldown, so the charge budget and the useful ttd_incarnation
# both moved. Anything tuned against Incarnation frequency needs re-measuring
# after a build change, not carrying over.
#
# Sundered Firmament is now talented and this file deliberately does NOT gate
# Fury of Elune on it, unlike the raid file. Measured three ways on this build
# and all three lost: the raid's own condition -0.64% AoE-only and -1.42%
# applied to both lists, a bare atmospheric_exposure check -0.79%, and the loss
# holds at 1, 3 and 5 fixed targets. Fury of Elune on cooldown is correct here.
#
# Percentages older than 4.6.0 in .agents/rationale/Balance.md were measured on
# fight_style=DungeonSlice, which Balance does not support - see
# .agents/SIMC_METHODOLOGY.md - and against the previous build. Treat them as
# provisional.
# =============================================================================

version: "4.6.0"
author: Ferraz
patch: "12.1"
spec: 102
name: Balance Druid Ferraz M+
description: |
  Balance Druid Ferraz M+
entry: main

config:
  # ==========================================================================
  # BUILD STAMP — display only. Keep in sync with version:/patch: above.
  # ==========================================================================
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-27 | Patch: 12.1 | Version: 4.6.0"

  # Reference build. The measured numbers assume this exact string.
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CYGADBD3hSPCL9Y9gz68WcKvMAAAAAAAAAAAAAAAAAWoMbNMmZgxsYmZmBDGjZWmZxMzYhlZWGjZGbYYAGbbzMYMbjATAAAAWYmZmBbGzYMAAMzglBA"

  # Wait until the pull is parked before bursting. SimC cannot measure this.
  inc_min_standing_time:
    label: "Incarnation - Min Standing Still (s)"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 10
    default: 2
    description: "Seconds standing still before Incarnation may fire. While you are still repositioning the pull is not parked yet, so the burst waits. 0 disables the check. Raise it if the burst still goes out too early; lower it on fights where you are forced to keep moving."

  auto_burst:
    label: "Auto Burst (no toggle needed)"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Fires Incarnation, trinkets and potion by itself, without the toggle. The TTD sliders still hold them back on trash that is about to die. Turn OFF to go back to driving the burst by the toggle below."

  burst_toggle:
    label: "Burst (Inc + Trinkets + Pot)"
    spell: 102560
    section: "Cooldowns"
    type: toggle
    description: "Manual burst window. Only needed when Auto Burst is OFF: toggle ON to allow Incarnation, trinkets and potion, OFF to hold CDs."

  # All three ride the burst window.
  use_trinket_1:
    label: "Auto Trinket 1 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true

  # Don't spend a long cooldown on trash about to die. Bosses ignore these.
  # Re-measured on the 4.6.0 build, 8 seeds, counting Incarnations PER PULL
  # rather than just total DPS:
  #
  #     15s   -          40% of pulls with none, 0% doubled, 0% boss missed
  #     20s   +0.37%     40%                     0%          0%
  #     25s   +0.61%     40%                     0%          0%
  #     30s   +0.75%     41%                     1%          0%
  #
  # 25 is the last value that gains without reintroducing a double. The 40% of
  # pulls that get no Incarnation at all is not a gate problem and no condition
  # fixes it: 6 casts across 10 pulls is a charge budget, not a decision.
  #
  # This was briefly set to 20 off the same measurement run against the PREVIOUS
  # build, which carried Elune's Guidance. That talent shortened the Incarnation
  # cooldown, so charges came back fast enough to double up on a pull; without
  # it they no longer do, and the useful value moved.
  ttd_incarnation:
    label: "Incarnation TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 25
    description: "Minimum fight time remaining to use Incarnation. Below this the pull dies before the window pays for itself and the charge is better saved for the next one. Past 30 it starts skipping pulls that deserved it."

  ttd_fury_of_elune:
    label: "Fury of Elune TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum fight time remaining to use Fury of Elune"

  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10
    description: "Minimum fight time remaining to use trinkets"

  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use combat potion"

  ttd_starfall:
    label: "Starfall TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 2
    max: 15
    default: 5
    description: "Minimum fight time remaining to use Starfall (avoid wasting AP)"

  # Gear-dependent: worth keeping only above ~22% crit. Current gear is under
  # it, so OFF. Re-test after a big crit change.
  wrath_filler:
    label: "Wrath Filler (ST)"
    section: "Damage"
    type: checkbox
    default: false
    description: "Casts Wrath as filler between Starfire on single target. Test both with an A/B sim against your own gear — the crit/haste ratio decides which wins."

  # DoT spreading and target swapping.
  enable_mouseover_dots:
    label: "Spread DoTs on Mouseover"
    section: "AoE"
    type: checkbox
    default: true
    description: "In AoE, suggests Moonfire/Sunfire on the mouseover unit while enemies near the target are missing the DoT. Spreading the DoTs is the single largest AoE gain. A boss under the mouse is skipped; adds around it are not."

  # Swap off a target that dies before Starfire lands. OFF by default: it can
  # loop if the nearest enemy IS the dying one. See the rationale file.
  swap_off_dying:
    label: "Swap Off a Dying Target"
    section: "AoE"
    type: checkbox
    default: false
    description: "In AoE, switch to the nearest other enemy when the current target will die before a Starfire cast can land. Switches to the NEAREST enemy, not the healthiest — Simia cannot pick by criteria. Off by default: unvalidated by simulation."

  # Plumbing inlined from Simia's _shared.yaml so every piece has a toggle.
  # Inheriting it meant none of this could be switched off.
  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true
    description: "Interact with lootable corpses out of combat."

  # Defined locally so an inherited default cannot change under you.
  engine_auto_combat:
    label: "Auto Combat"
    section: "Engine"
    type: multi_select
    options:
      - label: "Off"
        value: 0
      - label: "Quest Mob"
        value: 1
      - label: "Target in combat"
        value: 2
      - label: "Targeting party"
        value: 3
    default: [1, 2]

  # Travel Form. Every suggestion the rotation makes shifts you out of it, so
  # pausing keeps the form until you drop it yourself.
  engine_pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

  engine_auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]
    description: "When to pick a new enemy automatically, within 40y."

  engine_healthstone:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  engine_auto_brez:
    label: "Rebirth on Mouseover"
    section: "Engine"
    type: checkbox
    default: true
    description: "Battle rez a dead ally while hovering their unit frame. Pools rage first if you are in Bear Form."

  engine_auto_rez:
    label: "Revive on Mouseover (OOC)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Out-of-combat Revive on a dead ally under the mouse."

  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Remove Corruption on the Devour affix debuff (440313), self first. Bypasses the normal dispel-type matching — the affix is removable by any dispel."

  # Inlined from the shared lists so each piece switches on its own.
  # Balance removes poison/curse (Remove Corruption) and enrage (Soothe).
  auto_dispel_self:
    label: "Dispel Self (Poison/Curse)"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Remove Corruption on yourself when you have a dispelable poison or curse. Only fires when you actually have one, so it costs nothing otherwise."

  auto_dispel_party:
    label: "Dispel Party"
    section: "Dispels"
    type: checkbox
    default: false
    description: "Also Remove Corruption on party members. OFF by default: each dispel costs a GCD, and in M+ the healer usually covers it. Turn ON if you are the only one who can."

  auto_purge_enrage:
    label: "Soothe Enrage"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe the current target when it has an enrage effect. ON by default — this is what Simia's shared list did before this file inlined its own plumbing, and it had no switch at all. Turn OFF on a key where the enrage is not worth the global."

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

  # Barkskin's slider is post-mitigation damage, NOT health - 40 here is not
  # 40 on an HP slider.
  barkskin_dmg_pct:
    label: "Barkskin (Incoming Dmg%)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 40

  # Reactive floor, unmeasured like everything defensive here.
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60

  # Lower than Barkskin: Bear Form costs two full GCDs to enter.
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30

  # HotW inside Bear Form: extra Stamina/Ironfur/Frenzied Regen charge. Sole
  # use of the button now — party-heal use was removed to free the CD.
  hotw_bear_defensive:
    label: "HotW in Bear Form (Defensive)"
    section: "Defensives"
    type: checkbox
    default: false
    description: "Shift to Bear as an emergency defensive when Heart of the Wild is ready or already up. Shifting just to shift costs Moonkin uptime for no mitigation, so this only fires when HotW backs it. The Frenzied Regeneration branch above is separate and always active."

  hotw_bear_hp:
    label: "HotW Bear Defensive HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35

  # Thorn Bloom is a heal, not damage.
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 4
    default: 2

  # ==========================================================================
  # HELP
  # ==========================================================================
  # Emergency. The casting guard at the top of main returns before anything
  # else, so a hardcast used to cost you the defensive entirely.
  emergency_hp:
    label: "Emergency HP% (mid-cast)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35
    description: "Health below which defensives and consumables are allowed to fire while you are casting. The rotation normally does nothing at all mid-cast, so without this a hardcast swallows Barkskin, the healthstone and the health potion until it finishes. Set to 0 to go back to that."

  emergency_stop_casting:
    label: "Cut the Cast in an Emergency"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Below the emergency HP, end the current cast so the next global can go to a real defensive. Barkskin and the consumables above do not need this - they are off-GCD and fire without touching the cast - so this only matters for the ones that cost a global, like Bear Form into Frenzied Regeneration. Protected channels are never cut."

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # No Eclipse active — filler switch and AP-floor switch (ec_st/aoe).
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down


  # Burst allowed: auto or manual toggle. Drives Incarnation + both trinkets + potion.
  burst_ok: config.auto_burst|config.burst_toggle

  # A pull is actually underway: in combat, standing still, target is dotted.
  pull_engaged: player.combat&player.standing.time>=config.inc_min_standing_time&(debuff.moonfire.up|debuff.sunfire.up)

  # Incarnation ready and only waiting for you to stop moving. Holds Fury of
  # Elune so the burst does not lose its alignment.
  inc_waiting_to_stand: var.burst_ok&talent.incarnation_chosen_of_elune&cooldown.incarnation_chosen_of_elune.charges>0&var.inc_ttd_ok&!var.cd_active&player.combat&(debuff.moonfire.up|debuff.sunfire.up)

  # Incarnation ready, and aligned with Fury of Elune.
  inc_ready_to_cast: var.burst_ok&talent.incarnation_chosen_of_elune&cooldown.incarnation_chosen_of_elune.charges>0&var.inc_ttd_ok&var.pull_engaged&!var.cd_active&(cooldown.fury_of_elune.remains<2|buff.fury_of_elune.up)

  # Celestial Alignment/Incarnation active — trinkets/potion ride this window.
  cd_active: buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

  # The Bear defensive still wants you in Bear. Mirrors both branches of the
  # Panic Bear Form line, so the exit gate below can never contradict it.
  bear_defensive_active: health.effective.pct<=config.frenzied_regen_hp|(config.hotw_bear_defensive&health.effective.pct<=config.hotw_bear_hp&(cooldown.heart_of_the_wild.ready|buff.heart_of_the_wild.up))

  # === TIME TO DIE (TTD) VARIABLES === (target.boss always ignores TTD)
  inc_ttd_ok: (target.boss|target.time_to_die>=config.ttd_incarnation|fight_remains>=config.ttd_incarnation)
  foe_ttd_ok: (target.boss|target.time_to_die>=config.ttd_fury_of_elune|fight_remains>=config.ttd_fury_of_elune)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)
  starfall_ttd_ok: (target.boss|target.time_to_die>=config.ttd_starfall|fight_remains>=config.ttd_starfall)

lists:
  # Emergency, called from main ABOVE the casting guard. Everything here is
  # off-GCD or an item, so it fires without touching the cast; only the last
  # line ends it.
  emergency:
    - barkskin,name="Barkskin (Emergency)",range_check=none,off_gcd=true,ignore_queue=true,if=health.effective.pct<=config.emergency_hp
    - healthstone,name="Healthstone (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,name="Health Potion (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion
    # Last, so the off-GCD options above get their chance first.
    - stop_casting,name="Cut Cast (Emergency)",if=config.emergency_stop_casting&!player.channeling

  # Solar Beam on target/mouseover/focus. interrupt.*.check = Simia's own
  # kick filters (interruptible, important, in range, not already kicked).
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # Ride along with Incarnation, after Fury of Elune is spent.
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=var.burst_ok&config.use_trinket_1&trinket_1.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    - trinket_2,delay=150,name="Trinket 2",if=var.burst_ok&config.use_trinket_2&trinket_2.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    # fight_remains clause lets an otherwise wasted potion go out at the end.
    - combat_potion,delay=150,name="Combat Potion",if=var.burst_ok&config.use_potion&combat_potion.ready&player.combat&(var.potion_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active|fight_remains<=30)

  # spell_queue, sanity_checks and auto_target_ranged, inlined.
  engine:
    # `&`, not `|` - with `|` this is true on almost every pass.
    - queue_spell,if=!player.casting&!player.channeling

    # --- The five guards, copied verbatim from _shared.yaml sanity_checks.
    # Dropping any of these lets the rotation fire while dead or mounted.
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.engine_pause_travel_form&buff.travel_form.up

    # --- Looting (was special_actions; combat half was melee-only, dropped).
    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5

    # Devour affix. Direct spell-id check: type matching would skip it.
    - remove_corruption,delay=500,cycle=party,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.engine_affix_devour&cycle.debuff.440313.up.any

    # --- Rebirth / Revive on a hovered unit frame.
    - pool_resource,resource=rage,for_next=1,if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&buff.bear_form.up&cooldown.rebirth.ready
    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revive.mouseover,name="Revive (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    # --- Consumables (was auto_heal). No mana potion line: Balance does not
    # run out of mana in a dungeon.
    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    # --- Auto target (was auto_target_ranged), 40y like the shared ranged list.
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

    # Temple of Sethraliss: Storm Blessed is a hard damage immunity, so swap
    # off its holder. 1289229 is the AURA, not the cast id.
    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  # Self first, then party, then Soothe.
  dispels:
    - remove_corruption.player,delay=500,name="Remove Corruption (Self)",if=config.auto_dispel_self&player.dispelable.list
    - remove_corruption,delay=500,cycle=party,name="Remove Corruption (Party)",if=config.auto_dispel_party&cycle.dispelable.list
    # Hovering is the only way to Soothe a mob you are not targeting — see
    # the soothe_mouseover config for why a search line is impossible.
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe (Enrage)",if=config.auto_purge_enrage&target.purgeable.enrage

  # Ahead of interrupts, so survival outranks utility. Unvalidated by sim.
  defensives:
    # Proactive: off-GCD, incoming.mitigated.pct already discounts running defensives.
    - barkskin,range_check=none,name="Barkskin (predicted)",if=incoming.mitigated.pct>=config.barkskin_dmg_pct

    # Shift to Bear as its own step so it does not reshift mid-heal.

    # Two independent reasons to be in Bear, each with its own health gate and
    # its own preconditions. Neither available leaves you in Moonkin.
    - bear_form,name="Panic Bear Form",if=!buff.bear_form.up&((health.effective.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down)|(config.hotw_bear_defensive&health.effective.pct<=config.hotw_bear_hp&(cooldown.heart_of_the_wild.ready|buff.heart_of_the_wild.up)))

    # HotW before the heal so Frenzied Regen lands on the bigger pool. Cast by
    # name AND by the bear morph id - only one resolves per form.
    - heart_of_the_wild,name="HotW (Bear defensive)",range_check=none,ignore_cds_toggle=true,if=config.hotw_bear_defensive&buff.bear_form.up&health.effective.pct<=config.hotw_bear_hp&!buff.heart_of_the_wild.up
    - 1261872,name="HotW (Bear morph)",range_check=none,ignore_cds_toggle=true,if=config.hotw_bear_defensive&buff.bear_form.up&health.effective.pct<=config.hotw_bear_hp&!buff.heart_of_the_wild.up

    - frenzied_regeneration,if=health.effective.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,range_check=none,name="Barkskin (low HP)",if=health.effective.pct<=config.barkskin_hp

    # Root cleanse needs a form CHANGE, so two lines: one line would loop when
    # you are already in the form it suggests.
    - bear_form,name="Root Cleanse (to Bear)",if=debuff_list.freedom.up&!buff.bear_form.up
    - cat_form,name="Root Cleanse (from Bear)",if=debuff_list.freedom.up&buff.bear_form.up

  # Party utility, called before target guards. Unmeasured (not damage).
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    # Heart of the Wild deliberately absent: the whole CD now belongs to the
    # Bear-form defensive in `defensives` instead of double-dipping as a heal.
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold)>=config.thorn_bloom_members&target.valid&target.enemy&!target.dead&target.range<=40

  # Spreads DoTs onto the mouseover unit without changing target. No target
  # cap: Moonfire measured better at 6, 8 and 10 enemies. Never fires on a boss
  # under the mouse - adds around it still get the DoT.
  mouseover_dots:
    - sunfire.mouseover,name="Sunfire Mouseover",if=config.enable_mouseover_dots&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&!mouseover.boss&mouseover.combat&mouseover.range<=40&mouseover.debuff.sunfire.down
    - moonfire.mouseover,name="Moonfire Mouseover",if=config.enable_mouseover_dots&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&!mouseover.boss&mouseover.combat&mouseover.range<=40&mouseover.debuff.moonfire.down

  # Instant casts only, <2 enemies. Unmeasured (SimC never moves).
  moving_st:
    - moonfire,name="Moonfire (Refresh)",if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,name="Sunfire (Refresh)",if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    - starfire,if=buff.ascendant_fires.up
    - wrath,if=buff.ascendant_fires.up&var.eclipse_down
    # Starweaver clause is dead on the recommended string; kept for when it returns.
    - starsurge,name="Starsurge (Proc or AP Dump)",if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,name="Starsurge (AP Dump)",if=astral_power>60
    # Held while the burst is only waiting for you to stand still.
    - fury_of_elune,if=var.foe_ttd_ok&!var.inc_waiting_to_stand
    - moonfire
    - sunfire

  # Instant casts only, 2+ enemies. Unmeasured.
  moving_aoe:
    - sunfire,name="Sunfire (Refresh)",if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    - moonfire,name="Moonfire (Refresh)",if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - starfire,if=buff.ascendant_fires.up
    - starfall,name="Starfall (Proc or AP Dump)",if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,name="Starfall (AP Dump)",if=astral_power>50
    - starsurge,if=buff.starfall.up&(buff.touch_the_cosmos.react|buff.starweavers_warp.up)
    # Held while the burst is only waiting for you to stand still.
    - fury_of_elune,if=var.foe_ttd_ok&!var.inc_waiting_to_stand
    - sunfire
    - moonfire

  # Single target, standing still. DoTs -> Eclipse -> Incarnation -> Fury of
  # Elune -> spend AP -> fillers.
  ec_st:
    # DoTs first — cooldowns ahead of them measured -3.60%, the worst reorder tested.
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable

    # Yields to a ready Incarnation so the burst doesn't land on a window
    # about to be replaced (casting anyway measured -0.33%).
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    - fury_of_elune,if=var.foe_ttd_ok

    # Free procs (Starweaver dead on this string, kept for when it returns).
    - starfall,name="Starfall (Proc or AP Dump)",if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starsurge,name="Starsurge (Proc or AP Dump)",if=buff.starweavers_warp.up|buff.touch_the_cosmos.react

    # AP floor follows the Eclipse (spend early inside, hold near cap
    # outside) — replaced a flat astral_power>60, measured +0.79%.
    - starsurge,name="Starsurge (Eclipse Down)",if=!var.eclipse_down&astral_power>=50
    - starsurge,name="Starsurge (AP Capping)",if=var.eclipse_down&astral_power.deficit<20

    # Crit-heavy gear only. Default OFF.
    - wrath,if=config.wrath_filler&var.eclipse_down&enemies.combat.40y<=1
    - starfire

  # 2+ enemies, standing still. The threshold is 2 because the aoe list already
  # beats ec_st at two targets.
  aoe:
    - starfall,name="Starfall (AP Dump)",if=astral_power>=80&var.starfall_ttd_ok

    - moonfire,if=debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.refreshable
    - call_action_list,name=mouseover_dots

    # Same cooldown block as ec_st.
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    - fury_of_elune,if=var.foe_ttd_ok

    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,name="Starfall (Eclipse Down)",if=!var.eclipse_down&astral_power>=40&var.starfall_ttd_ok
    - starfall,name="Starfall (AP Capping)",if=var.eclipse_down&astral_power.deficit<20&var.starfall_ttd_ok

    # Starsurge weaves only under active Starfall + free proc — never
    # competes with Starfall for AP.
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react)

    # Only ever costs the GCD a filler would have taken.
    - target_enemy,delay=250,name="Swap Off Dying Target",if=config.swap_off_dying&enemies.combat.40y>=2&target.time_to_die<action.starfire.execute_time

    - starfire

  # Entry point: first matching line wins the GCD, everything above the
  # damage lists outranks damage.
  main:
    # Emergency FIRST, above the casting guard below. Only reachable while you
    # are actually casting and actually low, so it costs nothing otherwise.
    - call_action_list,name=emergency,if=player.combat&(player.casting|player.channeling)&health.effective.pct<=config.emergency_hp

    - return,if=player.channeling|player.casting

    # --- Engine plumbing. Must stay at the top. ---
    - call_action_list,name=engine

    - call_action_list,name=heal_support

    # COMBAT WALL - nothing below runs out of combat. player.combat, NOT
    # player.auto_combat, which is a config check and not combat state.
    - return,if=!player.combat

    # --- Target guards ---
    - return,if=!target.valid&!((config.engine_auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(config.engine_auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(config.engine_auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))
    - return,if=!target.valid&config.engine_auto_combat.has(0)
    - return,if=!target.valid|target.dead|!target.attackable

    # Back to Moonkin. Two lines, split on Fluid Form: with it, Starfire shifts
    # you AND deals damage, so the return is a free global.
    - starfire,name="Back to Moonkin (Fluid Form)",if=talent.fluid_form&buff.moonkin_form.down&health.effective.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up&!var.bear_defensive_active
    - moonkin_form,name="Back to Moonkin",if=!talent.fluid_form&buff.moonkin_form.down&health.effective.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up&!var.bear_defensive_active
    # A pre-pull Wrath used to sit here. Removed - the tank decides the pull.

    # --- Survival, then utility, then the burst window ---
    - call_action_list,name=defensives
    # Nothing below may cast while the Bear defensive is holding you in Bear.
    # Every damage spell cancels the form, and Panic Bear Form then pays another
    # global to re-enter it.
    #
    # This sits directly under `defensives` and ABOVE interrupts on purpose.
    # It used to sit under `trinkets`, which left Solar Beam free to cancel the
    # form the shift had just paid for - the fuzzer found that in the current
    # file after the first version of this guard was supposed to have fixed it.
    # Dispels cancel the form the same way. Inside the Bear window survival
    # outranks the kick; the window is short and health-gated.
    - return,if=buff.bear_form.up&var.bear_defensive_active

    - call_action_list,name=interrupts
    - call_action_list,name=dispels
    - call_action_list,name=trinkets

    # Do NOT add player.combat to these calls: casting is what puts you in
    # combat, so requiring it first means the rotation never acts.
    - call_action_list,name=moving_aoe,if=player.moving&enemies.combat.40y>1
    - call_action_list,name=moving_st,if=player.moving&enemies.combat.40y<=1
    - call_action_list,name=ec_st,if=enemies.combat.40y<=1
    - call_action_list,name=aoe,if=enemies.combat.40y>1
