version: 1.1
author: Ferraz
patch: "12.0.5"
spec: 102
name: Ferraz Balance Druid M+ (Elunes)
description: |
  Ferraz Balance Druid M+ (Elunes)
  Talent Tree: CYGA8cL7tpvige+kkmGM9zUPWDAAAAAAAAAAAAAAAAWoMbNjxMDwsYmZmZhBjZZmlZWMzM2YZmlxMjxCGGgx22MDGz2IwEAAAgFzMzMD2MMGDAAzMwA
entry: main

config:
  # -- Defensives --
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30
  # -- Healing --
  enable_hotw:
    label: "HotW Support (Heal Party)"
    section: "Healing"
    type: checkbox
    default: true
  hotw_hp_threshold:
    label: "Party HP% for HotW"
    section: "Healing"
    type: slider
    min: 30
    max: 90
    default: 75

  # -- Cooldowns --
  burst_toggle:
    label: "Burst (Inc + Trinkets + Pot)"
    spell: 102560
    section: "Cooldowns"
    type: toggle
    description: "Toggle ON to allow Incarnation, trinkets and potion. Toggle OFF to hold CDs."

  # -- Trinkets --
  use_trinket_1:
    label: "Auto Trinket 1 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false
  use_trinket_2:
    label: "Auto Trinket 2 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false
  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  # -- Time To Die (TTD) --
  ttd_incarnation:
    label: "Incarnation TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use Incarnation"
  ttd_fury_of_elune:
    label: "Fury of Elune TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum fight time remaining to use Fury of Elune"
  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10
    description: "Minimum fight time remaining to use trinkets"
  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use combat potion"
  ttd_starfall:
    label: "Starfall TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 2
    max: 15
    default: 5
    description: "Minimum fight time remaining to use Starfall (avoid wasting AP)"

variables:
  # True when no Eclipse is active
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down
  # Elune's Chosen hero talent (Boundless Moonlight)
  ec: talent.boundless_moonlight
  # CA/Inc ready and not yet pressed — triggers opener (only when burst is ON)
  # Whirling Stars: Inc has 2 charges, so check charges instead of just CD
  opener: config.burst_toggle&talent.incarnation_chosen_of_elune&cooldown.incarnation_chosen_of_elune.charges>0&!var.cd_active
  # Currently inside CA or Incarnation
  cd_active: buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

  # === TIME TO DIE VARIABLES ===
  # target.boss bypasses TTD — bosses always get full CDs (TTD is unreliable on bosses)
  inc_ttd_ok: (target.boss|target.time_to_die>=config.ttd_incarnation|fight_remains>=config.ttd_incarnation)
  foe_ttd_ok: (target.boss|target.time_to_die>=config.ttd_fury_of_elune|fight_remains>=config.ttd_fury_of_elune)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)
  starfall_ttd_ok: (target.boss|target.time_to_die>=config.ttd_starfall|fight_remains>=config.ttd_starfall)

lists:

  # Solar Beam on target, mouseover, or focus
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # Activate trinkets/potion during burst windows (only when burst toggle is ON)
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=config.burst_toggle&config.use_trinket_1&trinket_1.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&(var.opener|var.cd_active)
    - trinket_2,delay=150,name="Trinket 2",if=config.burst_toggle&config.use_trinket_2&trinket_2.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&(var.opener|var.cd_active)
    - combat_potion,delay=150,name="Combat Potion",if=config.burst_toggle&config.use_potion&combat_potion.ready&player.combat&var.potion_ttd_ok&cooldown.fury_of_elune.remains>0&(var.opener|var.cd_active)

  # Emergency Bear Form for Frenzied Regen, then Barkskin
  defensives:
    - bear_form,if=health.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up
    - frenzied_regeneration,if=health.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,if=health.pct<=config.barkskin_hp
    # Break roots — shift to Cat Form to clear movement-impairing effects
    - cat_form,if=debuff_list.freedom.up&buff.moonkin_form.up
    - starfire, if=!buff.moonkin_form.up

  # Heart of the Wild when party HP is low
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - heart_of_the_wild,if=config.enable_hotw&group.lowest.health.pct<config.hotw_hp_threshold&!buff.heart_of_the_wild.up

  # Movement ST — instant-cast only: DoTs > Starsurge > FoE > filler
  moving_st:
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Dump AP with instant Starsurge; prioritize procs
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    # Fury of Elune — on CD, instant
    - fury_of_elune
    # Last-qresort instant fillers
    - moonfire
    - sunfire

  # Movement AoE — instant-cast only: Starfall > Starsurge > DoTs > FoE > filler
  moving_aoe:
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Moonfire spread (skip 6+ for GCD efficiency)
    - moonfire,if=active_enemies<6&(debuff.moonfire.remains<2|debuff.moonfire.refreshable)
    # Starfall: primary AoE AP dump — spam aggressively (top player refreshes constantly)
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=astral_power>50
    # Starsurge inside Starfall for Star Cascade cleave
    - starsurge,if=buff.starfall.up&(buff.touch_the_cosmos.react|buff.starweavers_warp.up)
    - starsurge,if=buff.starfall.up&astral_power>60
    # FoE on CD
    - fury_of_elune
    - sunfire
    - moonfire,if=active_enemies<6

  # EC Single Target — DoTs > Lunar Eclipse > FoE on CD > Spenders > Inc > Starfire
  # Talents: Lunar Calling (Wrath always→Lunar), Lunation (Arcane spells reduce FoE CD by 1.5s),
  # Ascendant Eclipses (Eclipse entry→instant cast + first 3 spenders +20%),
  # Elune's Guidance (Inc: SS costs -10 AP, SF costs -12 AP)
  ec_st:
    # Maintain DoTs
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Activate Lunar Eclipse directly when charges available (no Wrath needed in 12.0.5)
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready
    # FoE on CD — Lunation passively reduces CD via Arcane casts (~28s effective CD)
    - fury_of_elune,if=var.foe_ttd_ok
    # Spend AP — free procs first (Hail of Stars: free SS/SF grants Solstice for 3s)
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    # Note: free procs (Starweaver/TtC) bypass TTD — never waste a free cast
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    # Activate Inc — only after FoE was cast (FoE on CD = burst sequence complete)
    - incarnation_chosen_of_elune,delay=500,if=config.burst_toggle&var.inc_ttd_ok&!var.cd_active&cooldown.fury_of_elune.remains>0
    # Fillers — Wrath for ST when Eclipse is down, Starfire when Eclipse is up (empowered +50%)
    - wrath,if=var.eclipse_down&active_enemies<=1
    - starfire

  # AoE (2+) — DoT spread > Lunar Eclipse > FoE on CD > Inc > Starfall spam > Starsurge weave > Starfire
  # Talents: Aetherial Kindling (Starfall extends MF/SF by 3s), Star Cascade (40% chance Starfire→free Starsurge),
  # Starweaver (SS 20%→free SF, SF 40%→free SS), Hail of Stars (free spender→Solstice 3s)
  aoe:
    # Spread DoTs — Sunfire first (Sunseeker Mushroom procs from SF damage, generates up to 20 AP)
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    # Activate Lunar Eclipse directly when charges available (no Wrath needed in 12.0.5)
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready
    # FoE on CD — Radiant Moonlight (+50% dmg, -15s CD) + Lunation (Arcane spells reduce CD further)
    - fury_of_elune,if=var.foe_ttd_ok
    # Activate Inc — only after FoE was cast (FoE on CD = burst sequence complete)
    - incarnation_chosen_of_elune,delay=500,if=config.burst_toggle&var.inc_ttd_ok&!var.cd_active&cooldown.fury_of_elune.remains>0
    # Starfall — SPAM aggressively (Aetherial Kindling extends DoTs, Starweaver 40% proc→free SS)
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=(astral_power>50)&var.starfall_ttd_ok
    # Starsurge weaving during Starfall (Star Cascade: 72% of SS during SF for cleave)
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react)
    - starsurge,if=buff.starfall.up&astral_power>60&buff.starlord.stack<3
    - starfire

  # Opener ST — DoTs > FoE > Inc > AP dump (Ascendant Eclipses: first 3 spenders +20%)
  opener_st:
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    # FoE before Inc for AP ramp + Atmospheric Exposure debuff (+6% dmg taken)
    - fury_of_elune,if=var.foe_ttd_ok
    - incarnation_chosen_of_elune,delay=500,if=var.inc_ttd_ok&!var.cd_active&cooldown.fury_of_elune.remains>0
    # Inc grants both Eclipses — Ascendant Eclipses: next cast is instant, first 3 spenders +20%
    # Dump AP aggressively during burst (Elune's Guidance: SS -10 AP, SF -12 AP)
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=active_enemies>1&astral_power>50
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react|astral_power>60
    - starfire

  # Opener AoE (3+) — DoTs > FoE > Inc > Starfall spam + Starsurge weave
  opener_aoe:
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    - fury_of_elune,if=var.foe_ttd_ok
    - incarnation_chosen_of_elune,if=var.inc_ttd_ok&!var.cd_active&cooldown.fury_of_elune.remains>0
    # Ascendant Eclipses: first 3 spenders deal +20% — prioritize Starfall + Starsurge weave
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react|astral_power>50
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react|astral_power>60)
    - starfire

  # Main entry point — routes to sub-lists by priority
  main:
    - return,if=player.channeling|player.casting
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged
    - call_action_list,name=heal_support

    - return,if=!target.valid&!((cfg.auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(cfg.auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(cfg.auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))
    - return,if=!target.valid&cfg.auto_combat.has(0)
    - return,if=!target.valid|target.dead|!target.attackable

    - call_action_list,name=auto_heal
    # Defensives
    - call_action_list,name=defensives
    # Utility
    - call_action_list,name=interrupts
    - call_action_list,name=trinkets
    # Opener when CDs are freshly available
    - call_action_list,name=opener_aoe,if=var.opener&active_enemies>2
    - call_action_list,name=opener_st,if=var.opener&active_enemies<=2
    # Movement — instant-cast only
    - call_action_list,name=moving_aoe,if=player.moving&active_enemies>1
    - call_action_list,name=moving_st,if=player.moving&active_enemies<=1
    # Standard sustained rotation
    - call_action_list,name=ec_st,if=active_enemies<=1
    - call_action_list,name=aoe,if=active_enemies>1
