version: 1.1
author: Ferraz
patch: "12.0.5"
spec: 102
name: Ferraz Balance Druid M+ (Elunes)
description: |
  Ferraz Balance Druid M+ (Elunes)
  Talent Tree:
entry: main

config:
  # -- Defensives --
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30
  # -- Healing --
  enable_hotw:
    label: "HotW Support (Heal Party)"
    section: "Healing"
    type: checkbox
    default: true
  hotw_hp_threshold:
    label: "Party HP% for HotW"
    section: "Healing"
    type: slider
    min: 30
    max: 90
    default: 75
  # -- Trinkets --
  use_trinket_1:
    label: "Auto Trinket 1 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false
  use_trinket_2:
    label: "Auto Trinket 2 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false
  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

variables:
  # True when no Eclipse is active
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down
  # Elune's Chosen hero talent (Boundless Moonlight)
  ec: talent.boundless_moonlight
  # CA/Inc ready and not yet pressed — triggers opener
  opener: (talent.celestial_alignment|talent.incarnation_chosen_of_elune)&cooldown.celestial_alignment.remains=0&!var.cd_active
  # Safe to burn CDs together (FoN far away or CA/Inc aligning)
  cd_window: cooldown.force_of_nature.remains>15|(cooldown.celestial_alignment.remains<44&cooldown.incarnation_chosen_of_elune.remains<44)
  cd_window_narrow: cooldown.force_of_nature.remains>30|((cooldown.celestial_alignment.remains>10|cooldown.incarnation_chosen_of_elune.remains>10)&(cooldown.celestial_alignment.remains<20&cooldown.incarnation_chosen_of_elune.remains<20))
  # Currently inside CA or Incarnation
  cd_active: buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

lists:

  # Solar Beam on target, mouseover, or focus
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # Activate trinkets/potion during burst windows
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&player.combat&(var.opener|var.cd_active)
    - trinket_2,delay=150,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&player.combat&(var.opener|var.cd_active)
    - combat_potion,delay=150,name="Combat Potion",if=config.use_potion&combat_potion.ready&player.combat&(var.opener|var.cd_active)

  # Emergency Bear Form for Frenzied Regen, then Barkskin
  defensives:
    - bear_form,if=health.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up
    - frenzied_regeneration,if=health.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,if=health.pct<=config.barkskin_hp

  # Heart of the Wild when party HP is low
  heal_support:
    - heart_of_the_wild,if=config.enable_hotw&group.lowest.health.pct<config.hotw_hp_threshold&!buff.heart_of_the_wild.up

  # Movement ST — instant-cast only: DoTs > Starsurge > FoE > WM > New Moon > filler
  moving_st:
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Dump AP with instant Starsurge; prioritize procs
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    # Fury of Elune — instant, guard against Atmospheric Exposure overlap
    - fury_of_elune,if=!talent.sundered_firmament|(debuff.atmospheric_exposure.remains<2&buff.eclipse_lunar.remains>5)
    # Wild Mushroom — don't cap charges
    - wild_mushroom,if=cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    # New Moon — instant AP generator
    - new_moon,if=astral_power.deficit>10
    # Last-resort instant fillers
    - moonfire
    - sunfire

  # Movement AoE — instant-cast only: Starfall > Starsurge > DoTs > FoE > WM > filler
  moving_aoe:
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Moonfire spread (skip 6+ for GCD efficiency)
    - moonfire,if=active_enemies<6&(debuff.moonfire.remains<2|debuff.moonfire.refreshable)
    # Starfall: primary AoE AP dump
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=astral_power>50
    # Starsurge inside Starfall for Star Cascade cleave
    - starsurge,if=buff.starfall.up&(buff.touch_the_cosmos.react|buff.starweavers_warp.up)
    - starsurge,if=buff.starfall.up&astral_power>60
    - fury_of_elune,if=!talent.sundered_firmament|debuff.atmospheric_exposure.remains<2
    - wild_mushroom,if=buff.eclipse_lunar.up|buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    - new_moon,if=astral_power.deficit>10
    - sunfire
    - moonfire,if=active_enemies<6

  # EC Single Target — DoTs > Lunar Eclipse > FoE > Spenders > CA/Inc > Moons > WM > Starfire
  ec_st:
    # Maintain DoTs
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Enter Lunar Eclipse (EC never uses Solar)
    - wrath,name="Wrath (Enter Lunar)",if=var.eclipse_down
    # FoE on CD; guard Atmospheric Exposure overlap; dump near fight end
    - fury_of_elune,if=!talent.sundered_firmament|(debuff.atmospheric_exposure.remains<2&(buff.eclipse_lunar.remains>5))|fight_remains<20
    # Spend AP — procs first, then dump at 60+
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starsurge,if=buff.starweavers_warp.up
    - starsurge,if=astral_power>60&active_enemies<=1
    # Activate Inc after FoE; respect Elune's Guidance charge timing
    - incarnation_chosen_of_elune,delay=500,if=!var.cd_active&(!talent.elunes_guidance|cooldown.lunar_eclipse.charges_fractional<1.5)
    # Moon charges — don't cap; wait for Atmospheric Exposure to fade
    - full_moon,if=astral_power.deficit>40&debuff.atmospheric_exposure.remains<action.full_moon.execute_time+0.5
    - half_moon,if=astral_power.deficit>20&debuff.atmospheric_exposure.remains<action.half_moon.execute_time+0.5
    - new_moon,if=astral_power.deficit>10&debuff.atmospheric_exposure.remains<action.new_moon.execute_time+0.5
    # Wild Mushroom — prefer inside Lunar Eclipse; don't cap
    - wild_mushroom,if=buff.eclipse_lunar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    # Starfire is the ONLY filler (no Wrath outside Eclipse entry)
    - starfire

  # AoE (2+) — DoT spread > Lunar Eclipse > FoE > CA/Inc > Starfall > Starsurge > WM > Moons > Starfire
  aoe:
    # Spread DoTs before spending AP
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    # Enter Lunar Eclipse
    - wrath,name="Wrath (Enter Lunar)",if=var.eclipse_down
    # FoE fires BEFORE Inc for AP ramp + Atmospheric Exposure
    - fury_of_elune,if=!talent.sundered_firmament|debuff.atmospheric_exposure.remains<2
    # Activate CA/Inc after FoE; also near fight end
    - incarnation_chosen_of_elune,delay=500,if=!var.cd_active&(var.eclipse_down|fight_remains<20)
    # Starfall — main AoE dump; procs first, then raw AP
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=(astral_power>50)&target.time_to_die>5
    # Starsurge for Star Cascade cleave while Starfall is active
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react)
    - starsurge,if=buff.starfall.up&astral_power>80&buff.starlord.stack<3
    # Wild Mushroom mid-rotation
    - wild_mushroom,if=buff.eclipse_lunar.up|buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    # Moon charges — lower AoE priority than Starfall/Starsurge
    - full_moon,if=astral_power.deficit>40
    - half_moon,if=astral_power.deficit>20
    - new_moon,if=astral_power.deficit>10
    # Solar Eclipse fallback for non-EC builds
    - solar_eclipse,if=var.eclipse_down&!var.ec&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow)
    - starfire

  # Opener ST — DoTs > FoE > CA/Inc > Eclipse > AP dump > Starfire
  opener_st:
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    # FoE before CDs for AP ramp
    - fury_of_elune
    - incarnation_chosen_of_elune,delay=500,if=!var.cd_active
    # Enter Eclipse if Inc didn't grant it
    - wrath,name="Wrath (Enter Lunar)",if=var.eclipse_down
    # Dump AP during burst
    - starfall,if=active_enemies>1&(buff.touch_the_cosmos.react|astral_power>80)
    - starsurge,if=buff.touch_the_cosmos.react|astral_power>80|buff.ascendant_stars.up
    - starfire

  # Opener AoE (3+) — DoTs > FoE > CA/Inc > Eclipse > Starfall/Starsurge dump
  opener_aoe:
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=debuff.moonfire.refreshable
    - fury_of_elune
    - incarnation_chosen_of_elune,if=!var.cd_active
    - wrath,name="Wrath (Enter Lunar)",if=var.eclipse_down
    # Dump Starlord stacks
    - starfall,if=astral_power>50|buff.ascendant_stars.up
    - starsurge,if=buff.starfall.up&buff.ascendant_stars.up
    - starfire,if=buff.ascendant_stars.up

  # Main entry point — routes to sub-lists by priority
  main:
    - return,if=player.channeling|player.casting
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - mark_of_the_wild,if=group.count(cycle.buff.mark_of_the_wild.down.any)>0&!player.combat
    - return,if=auto_combat.player
    # Re-enter Moonkin if HP is safe after Bear emergency
    - moonkin_form,if=buff.moonkin_form.down&health.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up
    # Utility and defensives
    - call_action_list,name=interrupts
    - call_action_list,name=defensives
    - call_action_list,name=heal_support
    - call_action_list,name=trinkets
    # Opener when CDs are freshly available
    - call_action_list,name=opener_aoe,if=var.opener&active_enemies>2
    - call_action_list,name=opener_st,if=var.opener&active_enemies<=2
    # Movement — instant-cast only
    - call_action_list,name=moving_aoe,if=player.moving&active_enemies>1
    - call_action_list,name=moving_st,if=player.moving&active_enemies<=1
    # Standard sustained rotation
    - call_action_list,name=ec_st,if=active_enemies<=1
    - call_action_list,name=aoe,if=active_enemies>1
