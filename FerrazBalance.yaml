version: 3.2
author: Ferraz
patch: "12.0.1"
spec: 102
name: Balance Elunes (Midnight Updated)
description: |
  Balance Druid - Elunes Chosen for Mythic+. Optimized for Patch 12.0.1 (Midnight).
  Supports Wowhead (Aggressive/Elune Focus) / Method.gg (Balanced/Eclipse Control).
  Talent Tree: CYGAOB00+EWim5ji+N0ScDXt8DAAAAAAAAAAAAAAAAWoMbNjxMDwsYmZGLMMMmZZmFzMzsMWmZZMzgFMMAjFzMgxIwEAAAgFzMmZwmhxYAAYmBA

entry: main

# ============================================================
#  CONFIGURATION
# ============================================================
config:

  # --- Rotation Style ---
  rotation_source:
    label: "Rotation Style"
    type: dropdown
    options:
      - { label: "Wowhead (Aggressive DPS)", value: 1 }
      - { label: "Method.gg (Balanced)", value: 2 }
    default: 2

  # --- Astral Power ---
  starfall_aoe_threshold:
    label: "Min enemies for Starfall"
    type: slider
    min: 2
    max: 5
    default: 2
  astral_power_dump_threshold:
    label: "AP to dump (avoid overcap)"
    type: slider
    min: 60
    max: 100
    default: 80

  # --- Cooldowns ---
  incarnation_enemies:
    label: "Min enemies for Incarnation"
    type: slider
    min: 1
    max: 10
    default: 3
  fury_of_elune_enemies:
    label: "Min enemies for Fury of Elune"
    type: slider
    min: 1
    max: 5
    default: 1

  # --- Interrupts ---
  use_solar_beam:
    label: "Auto Solar Beam"
    type: checkbox
    default: true

  # --- Addons for 12.0.1 ---
  use_force_of_nature:
    label: "Auto Force of Nature"
    type: checkbox
    default: true
  use_warrior_of_elune:
    label: "Auto Warrior of Elune"
    type: checkbox
    default: true
  solar_beam_delay:
    label: "Solar Beam Delay (ms)"
    type: slider
    min: 0
    max: 2000
    default: 250

  # --- Defensives ---
  barkskin_threshold:
    label: "HP% for Barkskin"
    type: slider
    min: 20
    max: 80
    default: 50

  # --- Heal Support ---
  enable_heart_of_the_wild:
    label: "Heart of the Wild (heal party)"
    type: checkbox
    default: true
  hotw_party_hp_threshold:
    label: "Party HP% to trigger HotW"
    type: slider
    min: 30
    max: 90
    default: 80

  # --- Utility ---
  use_shadowmeld:
    label: "Shadowmeld (aggro drop)"
    type: checkbox
    default: true
  shadowmeld_threat:
    label: "Threat level for Shadowmeld"
    type: slider
    min: 2
    max: 3
    default: 3
  use_incapacitating_roar:
    label: "Incapacitating Roar (AoE CC)"
    type: checkbox
    default: false

  # --- Movement ---
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    type: dropdown
    options:
      - { label: "Disabled", value: 0 }
      - { label: "Only in combat", value: 1 }
      - { label: "Only out of combat", value: 2 }
      - { label: "Always when moving", value: 3 }
    default: 2
  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    type: slider
    min: 0
    max: 4
    default: 2

  # --- Trinkets ---
  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

# ============================================================
#  VARIABLES
# ============================================================
variables:

# ============================================================
#  ACTION LISTS
# ============================================================
lists:

  # ----------------------------------------------------------
  #  SYSTEM
  # ----------------------------------------------------------

  spell_queue:
    - queue_spell,name="Spell Queue"

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs

  # ----------------------------------------------------------
  #  BUFFS
  # ----------------------------------------------------------

  buff_mark_of_the_wild:
    - mark_of_the_wild,target=player,name="Mark of the Wild",if=!player.combat&group.any(cycle.buff.mark_of_the_wild.down&cycle.alive&cycle.range<=100)

  moonkin_form:
    - moonkin_form,name="Moonkin Form Shift",if=!buff.moonkin_form.up&!mounted.flying&!mounted.ground

  # ----------------------------------------------------------
  #  DOTS (maintain on current target)
  # ----------------------------------------------------------

  dots:
    - sunfire,name="Sunfire ST",if=debuff.sunfire.down|debuff.sunfire.remains<3.6
    - moonfire,name="Moonfire ST",if=debuff.moonfire.down|debuff.moonfire.remains<4.8

  dot_spread:
    - sunfire,name="Sunfire AoE Spread",if=debuff.sunfire.down
    - moonfire,name="Moonfire AoE Spread",if=debuff.moonfire.down

  # ----------------------------------------------------------
  #  COOLDOWNS
  # ----------------------------------------------------------

  cooldowns:
    - force_of_nature,name="Force of Nature",if=config.use_force_of_nature&cooldown.force_of_nature.ready&(!buff.eclipse_lunar.up&!buff.eclipse_solar.up|buff.incarnation_chosen_of_elune.up)
    - incarnation_chosen_of_elune,name="Incarnation",if=active_enemies>=config.incarnation_enemies&!buff.incarnation_chosen_of_elune.up|(target.boss&target.time_to_die>20&!buff.incarnation_chosen_of_elune.up)
    - convoke_the_spirits,name="Convoke the Spirits",if=talent.convoke_the_spirits&astral_power<50&!buff.incarnation_chosen_of_elune.up&!buff.celestial_alignment.up
    - celestial_alignment,name="Celestial Alignment",if=!talent.incarnation_chosen_of_elune&(active_enemies>=config.incarnation_enemies&!buff.celestial_alignment.up|(target.boss&target.time_to_die>20&!buff.celestial_alignment.up))
    - warrior_of_elune,name="Warrior of Elune",if=config.use_warrior_of_elune&!buff.warrior_of_elune.up&(buff.eclipse_lunar.up|cooldown.lunar_eclipse.ready)


  # ----------------------------------------------------------
  #  DEFENSIVES
  # ----------------------------------------------------------

  defensives:
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold&!buff.barkskin.up
    - shadowmeld,name="Shadowmeld",if=config.use_shadowmeld&(target.threat>=config.shadowmeld_threat|player.aggro)&!target.boss

  # ----------------------------------------------------------
  #  HEAL SUPPORT (Heart of the Wild)
  # ----------------------------------------------------------

  heal_support:
    - heart_of_the_wild,name="Heart of the Wild",if=config.enable_heart_of_the_wild&group.lowest.health.pct<config.hotw_party_hp_threshold&!buff.heart_of_the_wild.up&cooldown.heart_of_the_wild.ready
    - regrowth,name="Regrowth Support",target=lowest,if=buff.heart_of_the_wild.up&group.lowest.health.pct<config.hotw_party_hp_threshold

  # ----------------------------------------------------------
  #  INTERRUPTS & UTILITY
  # ----------------------------------------------------------

  interrupts:
    # Auto Swap to find casts nearby
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any
    
    # Primary Interrupts
    - solar_beam,name="Solar Beam",if=interrupt.target.check
    - solar_beam.mouseover,name="Solar Beam (MO)",if=interrupt.mouseover.check
    - solar_beam.focus,name="Solar Beam (Focus)",if=interrupt.focus.check
    
    # AoE & CC
    - incapacitating_roar,name="Roar (AoE)",if=interrupt.stun.aoe.check
    - mighty_bash,name="Mighty Bash",if=interrupt.cc.check
    - soothe,name="Soothe",if=target.purgeable.enrage

  dispel:
    - remove_corruption,name="Remove Corruption",cycle=members,if=cycle.dispelable.curse|cycle.dispelable.poison

  # ----------------------------------------------------------
  #  TRINKETS & MOVEMENT
  # ----------------------------------------------------------

  trinkets:
    - trinket_1,name="Trinket 1",if=config.use_trinkets&trinket_1.ready&(buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up|cooldown.incarnation_chosen_of_elune.remains>20)
    - trinket_2,name="Trinket 2",if=config.use_trinkets&trinket_2.ready&(buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up|cooldown.incarnation_chosen_of_elune.remains>20)

  movement:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - moonkin_form,name="Stay Moonkin (Rooted)",if=player.rooted&buff.bear_form.up
    - stampeding_roar,name="Stampeding Roar",if=moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))&config.stampeding_roar_usage!=0

  # ==========================================================
  #  ROTATIONS
  # ==========================================================

  # ----------------------------------------------------------
  #  WOWHEAD — Aggressive DPS (Single Target)
  # ----------------------------------------------------------

  rotation_st_wowhead:
    - sunfire,name="Sunfire ST (W)",if=debuff.sunfire.down|debuff.sunfire.remains<3.6
    - moonfire,name="Moonfire ST (W)",if=debuff.moonfire.down|debuff.moonfire.remains<4.8
    - fury_of_elune,name="Fury of Elune (W)",if=cooldown.fury_of_elune.ready
    - call_action_list,name=cooldowns
    - lunar_eclipse,name="Active Eclipse (W)",if=cooldown.lunar_eclipse.ready&!buff.eclipse_lunar.up&!buff.eclipse_solar.up&!(buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up)
    - starsurge,name="Starsurge (Burst W)",if=(buff.eclipse_solar.remains>9|buff.eclipse_lunar.remains>9|buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up)&astral_power>=30
    - starsurge,name="Starsurge (Dump W)",if=astral_power>=config.astral_power_dump_threshold
    - starfire,name="Starfire (Eclipse W)",if=buff.eclipse_lunar.up|buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up
    - starfire,name="Starfire (Set Eclipse W)",if=cooldown.lunar_eclipse.remains<3&!buff.eclipse_lunar.up
    - starsurge,name="Starsurge (Filler W)",if=astral_power>=30
    - wrath,name="Wrath Filler (W)"

  # ----------------------------------------------------------
  #  WOWHEAD — Aggressive DPS (AoE)
  # ----------------------------------------------------------

  rotation_aoe_wowhead:
    - sunfire,name="Sunfire AoE (W)",if=debuff.sunfire.down|debuff.sunfire.remains<3.6
    - moonfire,name="Moonfire AoE (W)",if=debuff.moonfire.down|debuff.moonfire.remains<4.8
    - starfall,name="Starfall (Uptime W)",if=!buff.starfall.up&astral_power>=50
    - fury_of_elune,name="Fury of Elune AoE (W)",if=cooldown.fury_of_elune.ready
    - call_action_list,name=cooldowns
    - lunar_eclipse,name="Active Eclipse AoE (W)",if=cooldown.lunar_eclipse.ready&!buff.eclipse_lunar.up
    - starfall,name="Starfall (Dump W)",if=astral_power>=config.astral_power_dump_threshold
    - starfire,name="Starfire AoE (W)",if=buff.eclipse_lunar.up|buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up
    - starfire,name="Starfire (Set Eclipse AoE W)",if=cooldown.lunar_eclipse.remains<3&!buff.eclipse_lunar.up
    - starsurge,name="Starsurge (ST Proc W)",if=buff.starfall.remains>2&astral_power>=config.astral_power_dump_threshold
    - wrath,name="Wrath Filler AoE (W)"

  # ----------------------------------------------------------
  #  METHOD.GG — Balanced (Single Target)
  # ----------------------------------------------------------

  rotation_st_method:
    # Maintain DoTs first
    - sunfire,name="Sunfire ST",if=debuff.sunfire.down|debuff.sunfire.remains<3.6
    - moonfire,name="Moonfire ST",if=debuff.moonfire.down|debuff.moonfire.remains<4.8

    # Fury of Elune - Before Eclipse (Method style)
    - fury_of_elune,name="Fury of Elune",if=cooldown.fury_of_elune.ready&!buff.eclipse_lunar.up&!buff.eclipse_solar.up

    # Cooldowns
    - call_action_list,name=cooldowns

    # Activate Eclipse (Active Button)
    - lunar_eclipse,name="Active Lunar Eclipse",if=cooldown.lunar_eclipse.ready&!buff.eclipse_lunar.up&!buff.eclipse_solar.up&!(buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up)

    # Spenders
    - starsurge,name="Starsurge (Power/Proc)",if=(buff.ascendant_eclipses.up|buff.starweavers_weft.up)&astral_power>=30
    - starsurge,name="Starsurge (Dump)",if=(buff.starlord.stack<3|astral_power>=config.astral_power_dump_threshold)&astral_power>=30
    
    # Filler
    - starfire,name="Starfire (Eclipse)",if=buff.eclipse_lunar.up|buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up
    - starfire,name="Starfire (Set Eclipse)",if=cooldown.lunar_eclipse.remains<3&!buff.eclipse_lunar.up
    - wrath,name="Wrath Filler"

  # ----------------------------------------------------------
  #  METHOD.GG — Balanced (AoE)
  # ----------------------------------------------------------

  rotation_aoe_method:
    # Maintain DoTs
    - sunfire,name="Sunfire AoE",if=debuff.sunfire.down|debuff.sunfire.remains<3.6
    
    # Spreading Moonfire (Tab-Targeting Style)
    - target_enemy,delay=100,name="Search Moonfire Target",if=debuff.moonfire.up&active_dot.moonfire<active_enemies&active_dot.moonfire<8
    - moonfire,name="Moonfire Spread",if=debuff.moonfire.down
    - moonfire,name="Moonfire Maintenance",if=debuff.moonfire.remains<4.8

    # Starfall Uptime
    - starfall,name="Starfall (Uptime)",if=!buff.starfall.up&astral_power>=50

    # Fury of Elune
    - fury_of_elune,name="Fury of Elune AoE",if=cooldown.fury_of_elune.ready&(!buff.eclipse_lunar.up|active_enemies>=5)

    # Cooldowns
    - call_action_list,name=cooldowns

    # Eclipse Button
    - lunar_eclipse,name="Active Lunar Eclipse AoE",if=cooldown.lunar_eclipse.ready&!buff.eclipse_lunar.up

    # Spenders
    - starfall,name="Starfall (Dump/Proc)",if=(buff.ascendant_eclipses.up|buff.starweavers_warp.up|astral_power>=config.astral_power_dump_threshold)&astral_power>=50
    - starsurge,name="Starsurge (ST Proc)",if=buff.starlord.stack<3&astral_power>=30
    
    # Filler
    - starfire,name="Starfire AoE",if=buff.eclipse_lunar.up|buff.incarnation_chosen_of_elune.up|buff.celestial_alignment.up
    - wrath,name="Wrath Filler"

  # ==========================================================
  #  MAIN ENTRY POINT
  # ==========================================================

  main:
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - rebirth.mouseover,name="Rebirth (MO)",if=mouseover.exists&mouseover.dead&mouseover.friendly&mouseover.range<=40
    - call_action_list,name=buff_mark_of_the_wild
    - call_action_list,name=moonkin_form
    - return,if=!player.combat&active_enemies=0
    - return,if=player.channeling
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=interrupts
    - call_action_list,name=dispel
    - call_action_list,name=defensives
    - call_action_list,name=movement,if=player.moving
    - call_action_list,name=trinkets
    - call_action_list,name=heal_support,if=config.enable_heart_of_the_wild
    - call_action_list,name=rotation_aoe_wowhead,if=config.rotation_source=1&active_enemies>=config.starfall_aoe_threshold&buff.moonkin_form.up
    - call_action_list,name=rotation_st_wowhead,if=config.rotation_source=1&buff.moonkin_form.up
    - call_action_list,name=rotation_aoe_method,if=config.rotation_source=2&active_enemies>=config.starfall_aoe_threshold&buff.moonkin_form.up
    - call_action_list,name=rotation_st_method,if=config.rotation_source=2&buff.moonkin_form.up
