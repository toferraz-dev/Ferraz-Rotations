# =============================================================================
# Druid - Balance - 102
# Based on: SimC default APL (midnight branch) + assisted_combat
# =============================================================================

version: 4.0
author: Ferraz
spec: 102
name: Ferraz Balance Druid (Optimized)
entry: main

config:
  # ============================================================
  #  CONFIGURATION
  # ============================================================
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 40
  renewal_hp:
    label: "Renewal HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 50
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30
  regrowth_ooc_hp:
    label: "Regrowth (OOC) HP%"
    section: "Healing"
    type: slider
    min: 0
    max: 100
    default: 70
  enable_hotw:
    label: "HotW Support (Heal Party)"
    section: "Healing"
    type: checkbox
    default: true
  hotw_hp_threshold:
    label: "Party HP% for HotW"
    section: "Healing"
    type: slider
    min: 30
    max: 90
    default: 75
# ============================================================
#  VARIABLES (Synced with Simia _common & rotation_102)
# ============================================================
variables:
  eclipse_up: buff.eclipse_solar.up|buff.eclipse_lunar.up
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down
  ca_soon: cooldown.celestial_alignment.remains<3|cooldown.incarnation_chosen_of_elune.remains<3
  ec: talent.boundless_moonlight
  opener: (talent.celestial_alignment|talent.incarnation_chosen_of_elune)&cooldown.celestial_alignment.remains=0
  cd_window: cooldown.force_of_nature.remains>15|(cooldown.celestial_alignment.remains<44&cooldown.incarnation_chosen_of_elune.remains<44)
  cd_window_narrow: cooldown.force_of_nature.remains>30|((cooldown.celestial_alignment.remains>10|cooldown.incarnation_chosen_of_elune.remains>10)&(cooldown.celestial_alignment.remains<20&cooldown.incarnation_chosen_of_elune.remains<20))
  inc_charge: cooldown.celestial_alignment.charges_fractional<1|cooldown.incarnation_chosen_of_elune.charges_fractional<1

# ============================================================
#  ACTION LISTS
# ============================================================
lists:
  # ----------------------------------------------------------
  #  DEFENSIVES
  # ----------------------------------------------------------
  defensives:
    - bear_form,if=health.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up
    - frenzied_regeneration,if=health.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,if=health.pct<=config.barkskin_hp
    - renewal,if=health.pct<=config.renewal_hp
    - regrowth,if=health.pct<=config.regrowth_ooc_hp&!player.combat

  # ----------------------------------------------------------
  #  INTERRUPTS
  # ----------------------------------------------------------
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # ----------------------------------------------------------
  #  HEAL SUPPORT
  # ----------------------------------------------------------
  heal_support:
    - heart_of_the_wild,if=config.enable_hotw&group.lowest.health.pct<config.hotw_hp_threshold&!buff.heart_of_the_wild.up
    - regrowth,target=lowest,if=buff.heart_of_the_wild.up&group.lowest.health.pct<config.hotw_hp_threshold
    
  # ----------------------------------------------------------
  #  ELUNE'S CHOSEN - SINGLE TARGET
  # ----------------------------------------------------------
  ec_st:
    - celestial_alignment,delay=500,if=buff.ascendant_stars.down&(cooldown.convoke_the_spirits.remains<5|cooldown.solar_eclipse.charges_fractional<1.5|!talent.elunes_guidance)
    - incarnation_chosen_of_elune,delay=500,if=buff.ascendant_stars.down&(cooldown.convoke_the_spirits.remains<5|cooldown.solar_eclipse.charges_fractional<1.5|!talent.elunes_guidance)
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down
    - convoke_the_spirits,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&astral_power<40|(cooldown.celestial_alignment.remains>30&var.eclipse_down)|fight_remains<20
    - lunar_eclipse,if=var.eclipse_down
    - starfall,if=buff.starweavers_warp.react
    - starsurge,if=astral_power>80|!var.eclipse_down|buff.starweavers_weft.react|buff.touch_the_cosmos.react
    - fury_of_elune,if=!talent.sundered_firmament|debuff.atmospheric_exposure.remains<2&(buff.eclipse_solar.remains>5|buff.eclipse_lunar.remains>5)|fight_remains<20
    - force_of_nature
    - full_moon,if=astral_power.deficit>40&debuff.atmospheric_exposure.remains<action.full_moon.execute_time+0.5
    - half_moon,if=astral_power.deficit>20&debuff.atmospheric_exposure.remains<action.half_moon.execute_time+0.5
    - new_moon,if=astral_power.deficit>10&debuff.atmospheric_exposure.remains<action.new_moon.execute_time+0.5
    - wild_mushroom,if=buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    - starfire,if=action.starfire.execute_time<buff.eclipse.remains
    - wrath

  # ----------------------------------------------------------
  #  AOE (2+ targets)
  # ----------------------------------------------------------
  aoe:
    - celestial_alignment,delay=500,if=prev_gcd.1.force_of_nature&!var.ec|var.ec&prev_gcd.1.fury_of_elune&var.eclipse_down|fight_remains<20
    - incarnation_chosen_of_elune,delay=500,if=prev_gcd.1.force_of_nature&!var.ec|var.ec&prev_gcd.1.fury_of_elune&var.eclipse_down|fight_remains<20
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down
    - starfire,if=enemies_around_target>2&talent.dream_surge&var.eclipse_down
    - wrath,if=enemies_around_target=2&talent.dream_surge&var.eclipse_down
    - fury_of_elune,if=var.ec|buff.harmony_of_the_grove.up|cooldown.force_of_nature.remains<gcd.max
    - force_of_nature,if=(var.eclipse_down&!talent.early_spring|talent.early_spring)
    - full_moon,if=astral_power.deficit>40
    - half_moon,if=astral_power.deficit>20
    - new_moon,if=astral_power.deficit>10
    - wild_mushroom,if=buff.eclipse_lunar.up|buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains
    - solar_eclipse,if=var.eclipse_down&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow)
    - lunar_eclipse,if=var.eclipse_down&(enemies_around_target>2&!var.ec|(var.ec&cooldown.celestial_alignment.full_recharge_time>15))
    - convoke_the_spirits,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&astral_power<40
    - starfall,if=(astral_power>80|!var.eclipse_down|buff.touch_the_cosmos.react|!buff.starweavers_weft.react)&target.time_to_die>5
    - starsurge,if=buff.starweavers_weft.react
    - starfire,if=var.ec|var.eclipse_down&enemies_around_target>6|buff.eclipse_lunar.up&(enemies_around_target>2&buff.celestial_alignment.up|enemies_around_target<=2&!buff.celestial_alignment.up)
    - wrath

  # ----------------------------------------------------------
  #  OPENER SEQUENCES
  # ----------------------------------------------------------
  opener_aoe:
    - moonfire,if=debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.refreshable
    - solar_eclipse,if=var.eclipse_down
    - starfall,if=buff.ascendant_stars.up&(var.eclipse_down|buff.touch_the_cosmos.react)
    - starfire,if=buff.ascendant_stars.up
    - fury_of_elune
    - force_of_nature
    - celestial_alignment,delay=500
    - incarnation_chosen_of_elune,delay=500

  opener_st:
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down
    - lunar_eclipse,if=var.eclipse_down
    - starsurge,if=(var.eclipse_down|buff.touch_the_cosmos.react)&talent.convoke_the_spirits
    - fury_of_elune
    - force_of_nature
    - celestial_alignment,delay=500
    - incarnation_chosen_of_elune,delay=500

  # ----------------------------------------------------------
  #  MAIN ENTRY POINT
  # ----------------------------------------------------------
  main:
    - return,if=player.channeling|player.casting|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player
    - moonkin_form,if=buff.moonkin_form.down
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=heal_support
    - run_action_list,name=opener_aoe,if=var.opener&active_enemies>2
    - run_action_list,name=opener_st,if=var.opener&active_enemies<=2
    - run_action_list,name=ec_st,if=active_enemies<=1
    - run_action_list,name=aoe,if=active_enemies>1
