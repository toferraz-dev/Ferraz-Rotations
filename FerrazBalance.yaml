# =============================================================================
# Druid - Balance - 102 — Elune's Chosen
# Meta Source: Icy Veins Midnight Season 1 (updated 17 Mar 2026)
#              Archon.gg Mythic Raid data (Apr 2026)
# Key principles:
#   - Always enter Lunar Eclipse (EC builds do NOT use Solar)
#   - Fury of Elune is 2nd priority after DoTs — never hold it
#   - Convoke inside CA/Inc window, below 40 AP
#   - Starlord: pool 50-80 AP before Eclipse transitions
#   - Starweaver mentions removed (no longer relevant as of 17/03/2026)
# =============================================================================

version: 1.0
author: Ferraz
patch: "12.0.1.6"
spec: 102
name: Ferraz Balance Druid (Elunes)
entry: main

config:
  # ============================================================
  #  DEFENSIVES
  # ============================================================
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30
  # ============================================================
  #  HEALING
  # ============================================================
  enable_hotw:
    label: "HotW Support (Heal Party)"
    section: "Healing"
    type: checkbox
    default: true
  hotw_hp_threshold:
    label: "Party HP% for HotW"
    section: "Healing"
    type: slider
    min: 30
    max: 90
    default: 75
  # ============================================================
  #  TRINKETS
  # ============================================================
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Trinkets"
    type: checkbox
    default: true
  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Trinkets"
    type: checkbox
    default: true

# ============================================================
#  VARIABLES
# ============================================================
variables:
  # Eclipse state
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down
  # Elune's Chosen hero talent active (Boundless Moonlight)
  ec: talent.boundless_moonlight
  # True when about to open (CA/Inc ready, not yet pressed)
  opener: (talent.celestial_alignment|talent.incarnation_chosen_of_elune)&cooldown.celestial_alignment.remains=0
  # Window where burning CDs together is correct
  cd_window: cooldown.force_of_nature.remains>15|(cooldown.celestial_alignment.remains<44&cooldown.incarnation_chosen_of_elune.remains<44)
  cd_window_narrow: cooldown.force_of_nature.remains>30|((cooldown.celestial_alignment.remains>10|cooldown.incarnation_chosen_of_elune.remains>10)&(cooldown.celestial_alignment.remains<20&cooldown.incarnation_chosen_of_elune.remains<20))

# ============================================================
#  ACTION LISTS
# ============================================================
lists:

  # ----------------------------------------------------------
  #  TRINKETS
  # ----------------------------------------------------------
  trinkets:
    - trinket_1,if=config.use_trinket_1&player.combat&trinket_1.ready
    - trinket_2,if=config.use_trinket_2&player.combat&trinket_2.ready

  # ----------------------------------------------------------
  #  DEFENSIVES
  # ----------------------------------------------------------
  defensives:
    - bear_form,if=health.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up
    - frenzied_regeneration,if=health.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,if=health.pct<=config.barkskin_hp

  # ----------------------------------------------------------
  #  HEAL SUPPORT (Heart of the Wild Party Healing)
  # ----------------------------------------------------------
  heal_support:
    - heart_of_the_wild,if=config.enable_hotw&group.lowest.health.pct<config.hotw_hp_threshold&!buff.heart_of_the_wild.up

  # ----------------------------------------------------------
  #  ELUNE'S CHOSEN - SINGLE TARGET
  #
  #  Priority (Icy Veins Midnight S1 - Elune's Chosen ST):
  #  1. Maintain Sunfire + Moonfire
  #  2. Enter Lunar Eclipse
  #  3. Fury of Elune on cooldown (pair with CA when possible)
  #  4. Starsurge: stack Starlord / consume Touch the Cosmos proc
  #  5. CA/Inc: use after Fury of Elune is in flight
  #  6. Convoke: inside CA/Inc if AP < 40
  #  7. Wild Mushroom: don't cap charges
  #  8. New/Half/Full Moon: don't cap charges
  #  9. Starfire: primary filler in Lunar Eclipse
  # 10. Wrath: filler outside Eclipse (up to 5 targets)
  # ----------------------------------------------------------
  ec_st:
    # 1. Maintain DoTs (refresh before they fall off)
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # 2. Enter Eclipse Preference (Lunar Eclipse for Elune's Chosen)
    - lunar_eclipse,if=var.eclipse_down

    # 3. Fury of Elune on cooldown — pair with CA/Inc when possible
    #    Guard: atmospheric_exposure must be down or low, OR we are in fight end
    - fury_of_elune,if=!talent.sundered_firmament|(debuff.atmospheric_exposure.remains<2&(buff.eclipse_lunar.remains>5))|fight_remains<20

    # 4. Starfall over Starsurge based on logs emphasizing massive Starfall usage
    - starfall,if=astral_power>80|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>90

    # 5. CA/Inc after Fury of Elune is casting/done
    - celestial_alignment,delay=500,if=buff.ascendant_stars.down&(!talent.elunes_guidance|cooldown.lunar_eclipse.charges_fractional<1.5)
    - incarnation_chosen_of_elune,delay=500,if=buff.ascendant_stars.down&(!talent.elunes_guidance|cooldown.lunar_eclipse.charges_fractional<1.5)

    # 7. Wild Mushroom: don't let charges cap
    - wild_mushroom,if=buff.eclipse_lunar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains

    # 8. Moon charges: don't cap (generates AP when there's room)
    - full_moon,if=astral_power.deficit>40&debuff.atmospheric_exposure.remains<action.full_moon.execute_time+0.5
    - half_moon,if=astral_power.deficit>20&debuff.atmospheric_exposure.remains<action.half_moon.execute_time+0.5
    - new_moon,if=astral_power.deficit>10&debuff.atmospheric_exposure.remains<action.new_moon.execute_time+0.5

    # 9. Starfire: primary filler in Lunar Eclipse
    - starfire,if=buff.eclipse_lunar.up

    # 10. Wrath: filler outside Eclipse (outside Eclipse it builds AP faster)
    - wrath

  # ----------------------------------------------------------
  #  AOE (2+ targets)
  #
  #  Log analysis (阿揪揪, Algethar S18, Elune's Chosen):
  #  Observed sequence: DoT Spread → Convoke (Lunar Bolts ×20 targets)
  #    → Starfire filler → Starsurge (Star Cascade) → Starfall → Fury of Elune
  #
  #  Icy Veins confirms: cast Convoke BEFORE Starfalls to increase
  #  chance of getting free Starfall from Convoke.
  #  Fury of Elune fires AFTER Starfall/Starsurge dump — not first.
  #
  #  Talents confirmed active: Astral Smolder, Star Cascade (tier)
  # ----------------------------------------------------------
  aoe:
    # CA/Inc: pair after DoTs; fire when CA is ready
    - celestial_alignment,delay=500,if=var.eclipse_down|fight_remains<20
    - incarnation_chosen_of_elune,delay=500,if=var.eclipse_down|fight_remains<20

    # 1. Maintain DoTs — spread to all targets before spending AP
    # Optimization: Only manual Moonfire if we aren't about to Starfall
    - moonfire,if=active_enemies<6&(debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down)
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # 2. Enter Eclipse: EC builds always want Lunar Eclipse
    - lunar_eclipse,if=var.eclipse_down

    # 3. Starfall: main AP dump in AoE (prioritized above Eclipses once AP is high)
    - starfall,if=(astral_power>50|buff.touch_the_cosmos.react)&target.time_to_die>5

    # 6. Fury of Elune: after Starfall/Convoke burst (per log behavior)
    - fury_of_elune

    # 7. Wild Mushroom: don't cap charges
    - wild_mushroom,if=buff.eclipse_lunar.up|buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.celestial_alignment.remains

    # 8. Moon charges
    - full_moon,if=astral_power.deficit>40
    - half_moon,if=astral_power.deficit>20
    - new_moon,if=astral_power.deficit>10

    # 9. Solar Eclipse enter for non-EC fallback
    - solar_eclipse,if=var.eclipse_down&!var.ec&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow)

    # 10. Starfire: filler fallback (Wrath removed per M+ logs)
    - starfire

  # ----------------------------------------------------------
  #  OPENER - ST (Elune's Chosen)
  #
  #  Icy Veins opener sequence:
  #  Pre-cast Starfires at pull → DoTs → Solar Eclipse
  #  → Starsurge ×3 (Ascendant Eclipses stacks) → CA/Inc
  #  → Fury of Elune → Starsurge/Starfall → Starfire filler
  # ----------------------------------------------------------
  opener_st:
    # DoTs first
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # Enter Eclipse (Wrath x2 for Lunar)
    - lunar_eclipse,if=var.eclipse_down

    # Burn 3x Starsurge to stack Ascendant Eclipses (build Starlord)
    - starfall,if=active_enemies>1&(buff.ascendant_stars.up|buff.touch_the_cosmos.react)
    - starsurge,if=buff.ascendant_stars.up|buff.touch_the_cosmos.react

    # CA/Inc after stacks consumed
    - celestial_alignment,delay=500
    - incarnation_chosen_of_elune,delay=500

    # Fury of Elune
    - fury_of_elune

    # AP Dump
    - starfall,if=active_enemies>1&(buff.touch_the_cosmos.react|astral_power>80)
    - starsurge,if=buff.touch_the_cosmos.react|astral_power>80

    # Starfire as primary filler inside CA/Inc
    - starfire

  # ----------------------------------------------------------
  #  OPENER - AOE (Elune's Chosen, 3+ targets)
  #  EC always enters Lunar Eclipse in AoE
  # ----------------------------------------------------------
  opener_aoe:
    - sunfire,if=debuff.sunfire.refreshable
    - moonfire,if=active_enemies<6&debuff.moonfire.refreshable

    # Cooldowns ASAP in AoE
    - incarnation_chosen_of_elune
    - celestial_alignment
    - fury_of_elune

    # Enter Eclipse (Lunar via Wrath)
    - lunar_eclipse,if=var.eclipse_down

    # Dump Starlord stacks
    - starfall,if=astral_power>50|buff.ascendant_stars.up
    - starfire,if=buff.ascendant_stars.up

  # ----------------------------------------------------------
  #  MAIN ENTRY POINT
  # ----------------------------------------------------------
  main:
    - return,if=player.channeling|player.casting
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - mark_of_the_wild,if=group.count(cycle.buff.mark_of_the_wild.down.any)>0&!player.combat
    - return,if=auto_combat.player
    - moonkin_form,if=buff.moonkin_form.down&health.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up
    - call_action_list,name=defensives
    - call_action_list,name=heal_support
    - call_action_list,name=trinkets
    - call_action_list,name=opener_aoe,if=var.opener&active_enemies>2
    - call_action_list,name=opener_st,if=var.opener&active_enemies<=2
    - call_action_list,name=ec_st,if=active_enemies<=1
    - call_action_list,name=aoe,if=active_enemies>1
