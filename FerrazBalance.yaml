version: 4.2
author: Ferraz
patch: "12.0.5"
spec: 102
name: Ferraz Balance Druid M+ (Elunes)
description: |
  Ferraz Balance Druid M+ (Elunes)
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CYGA8cL7tpvige+kkmGM9zUPWDAAAAAAAAAAAAAAAAWoMbNjxMDwsYmZmZhBjZZmlZWMzM2YZmlxMjxCGGgx22MDGz2IwEAAAgFzMzMD2MMGDAAzMwA"

  # === CONFIGURAÇÕES DEFENSIVAS ===
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60

  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30

  # === CONFIGURAÇÕES DE CURA ===
  enable_hotw:
    label: "HotW Support (Heal Party)"
    section: "Healing"
    type: checkbox
    default: true

  hotw_hp_threshold:
    label: "Party HP% for HotW"
    section: "Healing"
    type: slider
    min: 30
    max: 90
    default: 75

  # === CONFIGURAÇÕES DE COOLDOWNS ===
  burst_toggle:
    label: "Burst (Inc + Trinkets + Pot)"
    spell: 102560
    section: "Cooldowns"
    type: toggle
    description: "Toggle ON to allow Incarnation, trinkets and potion. Toggle OFF to hold CDs."

  # === CONFIGURAÇÕES DE BERLOQUES E CONSUMÍVEIS ===
  use_trinket_1:
    label: "Auto Trinket 1 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  # === CONFIGURAÇÕES DE TEMPO PARA MORRER (TTD) ===
  ttd_incarnation:
    label: "Incarnation TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use Incarnation"

  ttd_fury_of_elune:
    label: "Fury of Elune TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum fight time remaining to use Fury of Elune"

  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10
    description: "Minimum fight time remaining to use trinkets"

  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use combat potion"

  ttd_starfall:
    label: "Starfall TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 2
    max: 15
    default: 5
    description: "Minimum fight time remaining to use Starfall (avoid wasting AP)"

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # Verdadeiro quando nenhum Eclipse (Solar ou Lunar) está ativo
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down
  # Talento de Herói Escolhido de Elune (Boundless Moonlight)
  ec: talent.boundless_moonlight
  # Pronto para lançar o Encarnação (aguardando o alinhamento com Fury of Elune)
  inc_ready_to_cast: config.burst_toggle&talent.incarnation_chosen_of_elune&cooldown.incarnation_chosen_of_elune.charges>0&var.inc_ttd_ok&!var.cd_active&(cooldown.fury_of_elune.remains<2|buff.fury_of_elune.up)
  # Ativo quando estiver sob efeito de Celestial Alignment ou Incarnation
  cd_active: buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

  # === VARIÁVEIS DE TEMPO PARA MORRER (TTD) ===
  # O status target.boss ignora as restrições de TTD (Bosses sempre recebem cooldowns cheios)
  inc_ttd_ok: (target.boss|target.time_to_die>=config.ttd_incarnation|fight_remains>=config.ttd_incarnation)
  foe_ttd_ok: (target.boss|target.time_to_die>=config.ttd_fury_of_elune|fight_remains>=config.ttd_fury_of_elune)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)
  starfall_ttd_ok: (target.boss|target.time_to_die>=config.ttd_starfall|fight_remains>=config.ttd_starfall)

lists:
  # Raio Solar (Solar Beam) lançado no alvo principal, mouseover ou foco
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # Ativa berloques e poções durante a janela de burst (somente com a opção Burst ativada)
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=config.burst_toggle&config.use_trinket_1&trinket_1.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    - trinket_2,delay=150,name="Trinket 2",if=config.burst_toggle&config.use_trinket_2&trinket_2.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    - combat_potion,delay=150,name="Combat Potion",if=config.burst_toggle&config.use_potion&combat_potion.ready&player.combat&var.potion_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active

  # Forma de Urso de emergência para Regeneração Frenética se a vida cair muito, além de Pele de Árvore (Barkskin)
  defensives:
    - bear_form,if=health.effective.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up
    - frenzied_regeneration,if=health.effective.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,if=incoming.pct<=config.barkskin_hp
    # Limpeza de raízes: Transforma em Gato para limpar efeitos que impedem o movimento
    - cat_form,if=debuff_list.freedom.up&buff.moonkin_form.up
    - starfire, if=!buff.moonkin_form.up

  # Coração do Selvagem (Heart of the Wild) e Marca do Selvagem fora de combate
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - heart_of_the_wild,if=config.enable_hotw&group.lowest.health.pct<config.hotw_hp_threshold&!buff.heart_of_the_wild.up

  # Rotação ST em Movimento — Apenas lançamentos instantâneos: DoTs -> Starsurge -> Fury of Elune -> Fillers
  moving_st:
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Lança filler instantâneo sob efeito de Ascendant Fires
    - starfire,if=buff.ascendant_fires.up
    - wrath,if=buff.ascendant_fires.up&var.eclipse_down
    # Gasta Poder Astral (AP) com Starsurge instantâneo; prioriza procs ativos
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    # Fury of Elune — instantâneo no tempo de recarga
    - fury_of_elune
    # Habilidades instantâneas de último recurso para movimento
    - moonfire
    - sunfire

  # Rotação AoE em Movimento — Apenas lançamentos instantâneos: Starfall -> Starsurge -> DoTs -> Fury of Elune
  moving_aoe:
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Espalha Fogo Lunar (limita a menos de 6 alvos para eficiência de GCD)
    - moonfire,if=active_enemies<6&(debuff.moonfire.remains<2|debuff.moonfire.refreshable)
    # Lança Fogo Estelar instantâneo com Ascendant Fires
    - starfire,if=buff.ascendant_fires.up
    # Chuva de Estrelas (Starfall): Gasto de AP em área primário — renovado constantemente
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=astral_power>50
    # Lança Starsurge em AoE apenas em procs gratuitos (evita gasto manual de AP)
    - starsurge,if=buff.starfall.up&(buff.touch_the_cosmos.react|buff.starweavers_warp.up)
    - fury_of_elune
    - sunfire
    - moonfire,if=active_enemies<6

  # Rotação ST Escolhido de Elune — DoTs -> Entrada em Lunar Eclipse -> Fury of Elune -> Gasto de AP -> Encarnação -> Fogo Estelar
  ec_st:
    # Mantém Fogo Lunar e Fogo Solar ativos
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    # Ativa Lunar Eclipse diretamente (ignora se estiver prestes a castar o Encarnação)
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    # Ativa o Encarnação — alinhado temporalmente com Fury of Elune
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    # Fury of Elune no CD — Lunation reduz passivamente o CD por lançamentos Arcanos
    - fury_of_elune,if=var.foe_ttd_ok
    # Gasta AP — prioriza procs grátis (como Starweaver ou Touch the Cosmos)
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    # Fillers — Ira (Wrath) se fora de Eclipse, Fogo Estelar (Starfire) durante Eclipse Lunar
    - wrath,if=var.eclipse_down&active_enemies<=1
    - starfire

  # Rotação AoE (2+) — Espalha DoTs -> Lunar Eclipse -> Fury of Elune -> Encarnação -> Spam de Starfall -> Weave de Starsurge -> Fogo Estelar
  aoe:
    # Gasto emergencial de AP — evita estourar o limite de Poder Astral ao iniciar um pull
    - starfall,if=astral_power>=80&var.starfall_ttd_ok
    # Espalha DoTs — Fogo Lunar primeiro (fase de agrupamento) e depois Fogo Solar
    - moonfire,if=active_enemies<6&debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.refreshable
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    - fury_of_elune,if=var.foe_ttd_ok
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=(astral_power>50)&var.starfall_ttd_ok
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react)
    - starfire

  # Ponto de Entrada Principal (main)
  main:
    - return,if=player.channeling|player.casting
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged
    - call_action_list,name=heal_support

    - return,if=!target.valid&!((cfg.auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(cfg.auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(cfg.auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))
    - return,if=!target.valid&cfg.auto_combat.has(0)
    - return,if=!target.valid|target.dead|!target.attackable

    # Garante a Forma de Nexo (Moonkin Form)
    - moonkin_form,if=buff.moonkin_form.down&health.effective.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up

    # Lança Ira (Wrath) antes do início do combate se estiver parado e no alcance
    - wrath,if=!player.combat&!player.moving&target.distance<=40

    - call_action_list,name=auto_heal
    # Defensivos e Interrupções
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=trinkets

    # Rotação sob movimento
    - call_action_list,name=moving_aoe,if=player.moving&active_enemies>1
    - call_action_list,name=moving_st,if=player.moving&active_enemies<=1
    # Rotação padrão parada
    - call_action_list,name=ec_st,if=active_enemies<=1
    - call_action_list,name=aoe,if=active_enemies>1
