# =============================================================================
# Balance Druid — spec 102 — patch 12.1 (Midnight) — Elune's Chosen, M+.
# =============================================================================
#
# LISTS
#   main            plumbing, target guards, form/utility, delegates damage.
#   heal_support    Mark of the Wild, Thorn Bloom.
#   defensives      Barkskin, Bear Form/HotW/Frenzied Regen, root cleanse.
#   interrupts      Solar Beam (target/mouseover/focus).
#   trinkets        trinkets + combat potion, tied to the burst window.
#   mouseover_dots  spreads Moonfire/Sunfire without changing target.
#   moving_st / moving_aoe   instant-only priority while moving.
#   ec_st / aoe     stationary damage priority, <2 / 2+ enemies.
#
# ST: Moonfire/Sunfire uptime -> Eclipse -> Incarnation -> Fury of Elune ->
# free procs -> Starsurge (Eclipse-aware AP floor) -> Wrath/Starfire.
# AoE: anti-cap Starfall -> DoTs (target then mouseover) -> Eclipse ->
# Incarnation -> Fury of Elune -> free procs -> Starfall -> Starsurge
# weaving -> Starfire.
#
# Every ordering claim was measured with SimC 1210-01, fight_style=DungeonSlice
# (the M+ proxy), against the recommended string. Harness: sim/ab_test_balance.py,
# profile sim/Ferraz_balance.simc, table sim/BALANCE_AB_RESULTS.md.
# target_error=0.12-0.15 (~±0.06%), so <0.2% quoted here is noise. DungeonSlice
# is the only fight style that decided anything — Patchwerk-only gains were
# rejected, flagged inline where relevant.
#
# NOT validated: defensives, Heart of the Wild, Thorn Bloom, the two HP
# sliders, both moving_* lists — SimC has no M+ damage-intake model and never
# moves.
#
# Untalented on the recommended string (harmless dead lines, flagged inline):
# Starweaver, Force of Nature, Convoke the Spirits, New/Half/Full Moon, Wild
# Mushroom, Power of Goldrinn, Orbit Breaker.
#
# Carried by the string: Lunar Calling, Lunation, Boundless Moonlight,
# Atmospheric Exposure, The Eternal Moon, Incarnation: Chosen of Elune,
# Whirling Stars, Fury of Elune, Touch the Cosmos, Umbral Embrace, Rattle
# the Stars, Meteorites, Aetherial Kindling, Stellar Amplification, Sundered
# Firmament, Radiant Moonlight.
# =============================================================================

version: 1.0
author: Ferraz
patch: "12.1"
spec: 102
name: Balance Druid Ferraz M+
description: |
  Balance Druid Ferraz M+
entry: main

# =============================================================================
# CONFIG — defensive/healing defaults are unvalidated by simulation.
# =============================================================================
config:
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-13 | Patch: 12.1 | Version: 1.0"

  # Exact string every number here was measured against — changing it
  # invalidates the AP floors and Incarnation alignment.
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CYGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWoMbNMmZgxsMzMzMLMgxMLzsYmZswyMLjxMjNMAYstNzgxsNCMBAAAYhZmZGsZMjxAAwMDWGA"

  # === DEFENSIVE CONFIGURATIONS ===
  # Barkskin: proactive trigger. incoming.mitigated.pct is post-defensives,
  # so NOT comparable to the HP slider below (40 here != 40 there).
  barkskin_dmg_pct:
    label: "Barkskin (Incoming Dmg%)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 40

  # Reactive floor, unmeasured like everything defensive here.
  barkskin_hp:
    label: "Barkskin HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 60

  # Lower than Barkskin: Bear Form costs two full GCDs to enter.
  frenzied_regen_hp:
    label: "Frenzied Regen HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30

  # HotW inside Bear Form: extra Stamina/Ironfur/Frenzied Regen charge. Sole
  # use of the button now — party-heal use was removed to free the CD.
  hotw_bear_defensive:
    label: "HotW in Bear Form (Defensive)"
    section: "Defensives"
    type: checkbox
    default: true
    description: "In the emergency Bear Form window, press Heart of the Wild before Frenzied Regeneration. Stamina lands first, so the heal arrives on a bigger health pool."

  hotw_bear_hp:
    label: "HotW Bear Defensive HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35

  # === RACIAL CONFIGURATIONS ===
  # Thorn Bloom: heal only, not damage — its DPS is 0.13% and costs a GCD.
  # Every damage placement tested measured +0.02% to -0.41% (nothing or worse).
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 4
    default: 2

  # === AOE CONFIGURATIONS ===
  # Largest AoE gain in the file: +2.1% DungeonSlice, +9.8% at 5 targets.
  enable_mouseover_dots:
    label: "Spread DoTs on Mouseover"
    section: "AoE"
    type: checkbox
    default: false
    description: "In AoE, suggests Moonfire/Sunfire on the mouseover unit while enemies near the target are missing the DoT. Spreading the DoTs is the single largest AoE gain."

  # === SINGLE TARGET CONFIGURATIONS ===
  # Gear-dependent: wins on crit-heavy gear (reference: 22.5% crit/21.6%
  # haste, +1.44% to keep it), loses on haste-heavy/crit-light gear
  # (measured: 15.4% crit/31.2% haste, +5.28% to drop it). Default OFF.
  wrath_filler:
    label: "Wrath Filler (ST)"
    section: "Damage"
    type: checkbox
    default: false
    description: "Casts Wrath as filler between Starfire on single target. Test both with an A/B sim against your own gear — the crit/haste ratio decides which wins."

  # === COOLDOWN CONFIGURATIONS ===
  auto_burst:
    label: "Auto Burst (no toggle needed)"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Fires Incarnation, trinkets and potion by itself, without the toggle. The TTD sliders still hold them back on trash that is about to die. Turn OFF to go back to driving the burst by the toggle below."

  burst_toggle:
    label: "Burst (Inc + Trinkets + Pot)"
    spell: 102560
    section: "Cooldowns"
    type: toggle
    description: "Manual burst window. Only needed when Auto Burst is OFF: toggle ON to allow Incarnation, trinkets and potion, OFF to hold CDs."

  # === TRINKET & CONSUMABLE CONFIGURATIONS ===
  # Default ON: off measured -7.4% DungeonSlice, the largest number here.
  use_trinket_1:
    label: "Auto Trinket 1 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2 (Before Incarnation)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true

  # === TIME TO DIE (TTD) CONFIGURATIONS ===
  # Stop a 3min CD being spent on trash that's about to die. Unvalidated —
  # SimC dummies live the whole fight.
  ttd_incarnation:
    label: "Incarnation TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use Incarnation"

  ttd_fury_of_elune:
    label: "Fury of Elune TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum fight time remaining to use Fury of Elune"

  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10
    description: "Minimum fight time remaining to use trinkets"

  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use combat potion"

  ttd_starfall:
    label: "Starfall TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 2
    max: 15
    default: 5
    description: "Minimum fight time remaining to use Starfall (avoid wasting AP)"

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

# =============================================================================
# VARIABLES
# =============================================================================
variables:
  # No Eclipse active — filler switch and AP-floor switch (ec_st/aoe).
  eclipse_down: buff.eclipse_solar.down&buff.eclipse_lunar.down

  # Hero-tree probe, not referenced by any priority line yet.
  ec: talent.boundless_moonlight

  # Burst allowed: auto or manual toggle. Drives Incarnation + both trinkets + potion.
  burst_ok: config.auto_burst|config.burst_toggle

  # Incarnation ready: burst allowed, talented+charge, TTD ok, not already in
  # a burst window, and aligned with Fury of Elune (up or <2s away — skipping
  # this alignment measured -0.47% DungeonSlice).
  inc_ready_to_cast: var.burst_ok&talent.incarnation_chosen_of_elune&cooldown.incarnation_chosen_of_elune.charges>0&var.inc_ttd_ok&!var.cd_active&(cooldown.fury_of_elune.remains<2|buff.fury_of_elune.up)

  # Celestial Alignment/Incarnation active — trinkets/potion ride this window.
  cd_active: buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

  # === TIME TO DIE (TTD) VARIABLES === (target.boss always ignores TTD)
  inc_ttd_ok: (target.boss|target.time_to_die>=config.ttd_incarnation|fight_remains>=config.ttd_incarnation)
  foe_ttd_ok: (target.boss|target.time_to_die>=config.ttd_fury_of_elune|fight_remains>=config.ttd_fury_of_elune)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)
  starfall_ttd_ok: (target.boss|target.time_to_die>=config.ttd_starfall|fight_remains>=config.ttd_starfall)

lists:
  # Solar Beam on target/mouseover/focus. interrupt.*.check = Simia's own
  # kick filters (interruptible, important, in range, not already kicked).
  interrupts:
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

  # Ride along with Incarnation, delayed until Fury of Elune is spent (that's
  # where the real window is — dropping this clause measured -0.23%).
  # Tested alternative (rejected): firing on cooldown regardless of burst is
  # +0.28% but loses a trinket use per fight and gives up the aligned burst.
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=var.burst_ok&config.use_trinket_1&trinket_1.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    - trinket_2,delay=150,name="Trinket 2",if=var.burst_ok&config.use_trinket_2&trinket_2.ready&player.combat&var.trinkets_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active
    # fight_remains<=30 lets a potion that would otherwise be wasted at the end
    # of a fight go out anyway. Measured +0.61% DungeonSlice on its own against
    # this file's current baseline; a pre-pot on top of it measured +0.11%
    # (noise) and made the pair worse than this clause alone, so only the
    # end-of-fight half is here.
    - combat_potion,delay=150,name="Combat Potion",if=var.burst_ok&config.use_potion&combat_potion.ready&player.combat&(var.potion_ttd_ok&cooldown.fury_of_elune.remains>0&var.cd_active|fight_remains<=30)

  # Ahead of interrupts, so survival outranks utility. Unvalidated by sim.
  defensives:
    # Proactive: off-GCD, incoming.mitigated.pct already discounts running defensives.
    - barkskin,range_check=none,name="Barkskin (predicted)",if=incoming.mitigated.pct>=config.barkskin_dmg_pct

    # Reactive: shift to Bear first (own step so it doesn't reshift mid-heal).
    - bear_form,if=health.effective.pct<=config.frenzied_regen_hp&cooldown.frenzied_regeneration.ready&buff.frenzied_regeneration.down&!buff.bear_form.up

    # HotW before the heal so Frenzied Regen lands on the bigger (Stamina)
    # pool. Cast by name AND by the bear morph id (1261872) — only one
    # resolves per form, the other is a no-op. Costs the Moonkin-form
    # empowered-Starfall use of the same button.
    - heart_of_the_wild,name="HotW (Bear defensive)",range_check=none,ignore_cds_toggle=true,if=config.hotw_bear_defensive&buff.bear_form.up&health.effective.pct<=config.hotw_bear_hp&!buff.heart_of_the_wild.up
    - 1261872,name="HotW (Bear morph)",range_check=none,ignore_cds_toggle=true,if=config.hotw_bear_defensive&buff.bear_form.up&health.effective.pct<=config.hotw_bear_hp&!buff.heart_of_the_wild.up

    - frenzied_regeneration,if=health.effective.pct<=config.frenzied_regen_hp&buff.bear_form.up
    - barkskin,range_check=none,name="Barkskin (low HP)",if=health.effective.pct<=config.barkskin_hp
    - cat_form,if=debuff_list.freedom.up&buff.moonkin_form.up
    - starfire, if=!buff.moonkin_form.up

  # Party utility, called before target guards. Unmeasured (not damage).
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    # Heart of the Wild deliberately absent: the whole CD now belongs to the
    # Bear-form defensive in `defensives` instead of double-dipping as a heal.
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold)>=config.thorn_bloom_members&target.valid&target.enemy&!target.dead&target.range<=40

  # Spreads DoTs without changing target: Simia can't cycle enemy targets or
  # read mouseover debuffs directly, so the gate is cluster-based (an enemy
  # near target missing the DoT), 1.5s lockout to avoid double-dotting.
  # Addon-side stand-in for SimC's target_if: +2.1% DungeonSlice, +9.8% at 5.
  mouseover_dots:
    - sunfire.mouseover,name="Sunfire Mouseover",if=config.enable_mouseover_dots&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.range<=40&cluster.debuff.sunfire.count<enemies.around_target&lastcast.sunfire>=1.5
    - moonfire.mouseover,name="Moonfire Mouseover",if=config.enable_mouseover_dots&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.range<=40&active_enemies<6&cluster.debuff.moonfire.count<enemies.around_target&lastcast.moonfire>=1.5

  # Instant casts only, <2 enemies. Unmeasured (SimC never moves).
  moving_st:
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    - starfire,if=buff.ascendant_fires.up
    - wrath,if=buff.ascendant_fires.up&var.eclipse_down
    # Starweaver clause is dead on the recommended string; kept for when it returns.
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react
    - starsurge,if=astral_power>60
    - fury_of_elune
    - moonfire
    - sunfire

  # Instant casts only, 2+ enemies. Unmeasured.
  moving_aoe:
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable
    - moonfire,if=active_enemies<6&(debuff.moonfire.remains<2|debuff.moonfire.refreshable)
    - starfire,if=buff.ascendant_fires.up
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=astral_power>50
    - starsurge,if=buff.starfall.up&(buff.touch_the_cosmos.react|buff.starweavers_warp.up)
    - fury_of_elune
    - sunfire
    - moonfire,if=active_enemies<6

  # Single target, standing still. DoTs -> Eclipse -> Incarnation -> Fury of
  # Elune -> spend AP -> fillers.
  ec_st:
    # DoTs first — cooldowns ahead of them measured -3.60%, the worst reorder tested.
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable

    # Yields to a ready Incarnation so the burst doesn't land on a window
    # about to be replaced (casting anyway measured -0.33%).
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    - fury_of_elune,if=var.foe_ttd_ok

    # Free procs (Starweaver dead on this string, kept for when it returns).
    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starsurge,if=buff.starweavers_warp.up|buff.touch_the_cosmos.react

    # AP floor follows the Eclipse (spend early inside, hold near cap
    # outside) — replaced a flat astral_power>60, measured +0.79%.
    - starsurge,if=!var.eclipse_down&astral_power>=50
    - starsurge,if=var.eclipse_down&astral_power.deficit<20

    # Wrath filler: +DPS on the reference gear (crit-heavy, 22.5% crit /
    # 21.6% haste) — deleting it there measured -1.44% DungeonSlice. On a
    # haste-heavy/crit-light build (measured: 15.4% crit / 31.2% haste) it's
    # the opposite, +5.28% to drop it. Default OFF: no Wrath filler.
    - wrath,if=config.wrath_filler&var.eclipse_down&active_enemies<=1
    - starfire

  # 2+ enemies, standing still. 2-enemy threshold measured: raising to 3
  # costs -1.48% DungeonSlice, 4 costs more.
  aoe:
    - starfall,if=astral_power>=80&var.starfall_ttd_ok

    - moonfire,if=active_enemies<6&debuff.moonfire.refreshable
    - sunfire,if=debuff.sunfire.refreshable
    - call_action_list,name=mouseover_dots

    # Same cooldown block as ec_st.
    - lunar_eclipse,if=var.eclipse_down&cooldown.lunar_eclipse.ready&!var.inc_ready_to_cast
    - incarnation_chosen_of_elune,if=var.inc_ready_to_cast
    - fury_of_elune,if=var.foe_ttd_ok

    - starfall,if=buff.starweavers_weft.up|buff.touch_the_cosmos.react
    - starfall,if=!var.eclipse_down&astral_power>=40&var.starfall_ttd_ok
    - starfall,if=var.eclipse_down&astral_power.deficit<20&var.starfall_ttd_ok

    # Starsurge weaves only under active Starfall + free proc — never
    # competes with Starfall for AP.
    - starsurge,if=buff.starfall.up&(buff.starweavers_warp.up|buff.touch_the_cosmos.react)
    - starfire

  # Entry point: first matching line wins the GCD, everything above the
  # damage lists outranks damage.
  main:
    - return,if=player.channeling|player.casting

    # --- Engine plumbing. Must stay at the top. ---
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged

    - call_action_list,name=heal_support

    # --- Target guards ---
    - return,if=!target.valid&!((cfg.auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(cfg.auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(cfg.auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))
    - return,if=!target.valid&cfg.auto_combat.has(0)
    - return,if=!target.valid|target.dead|!target.attackable

    - moonkin_form,if=buff.moonkin_form.down&health.effective.pct>config.frenzied_regen_hp&!buff.frenzied_regeneration.up
    - wrath,if=!player.combat&!player.moving&target.distance<=40
    - call_action_list,name=auto_heal

    # --- Survival, then utility, then the burst window ---
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=trinkets

    # --- Damage priority: moving first (instant-only), then stationary. ---
    - call_action_list,name=moving_aoe,if=player.moving&active_enemies>1
    - call_action_list,name=moving_st,if=player.moving&active_enemies<=1
    - call_action_list,name=ec_st,if=active_enemies<=1
    - call_action_list,name=aoe,if=active_enemies>1
