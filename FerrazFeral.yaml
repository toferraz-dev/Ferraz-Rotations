version: 2.0
author: Ferraz
patch: "12.0.1"
spec: 103
name: Feral Midnight (Teste Beta)
description: |
  Feral Druid Rotation for Mythic+ — Midnight (12.0.1).
  Optimized for simplified 12.0.1 mechanics (Removed Thrash/Brutal Slash).
  Supports Druid of the Claw & Wildstalker procs.
  Chomp, Ravage, Apex Predator management.
entry: main

config:
  # GAME MODE
  game_mode:
    label: "Game Mode"
    type: dropdown
    options:
      - label: "Mythic+"
        value: 1
      - label: "Leveling"
        value: 2
    default: 1

  # ROTATION STYLE
  rotation_source:
    label: "Rotation Style"
    type: dropdown
    options:
      - label: "Druid of the Claw"
        value: 1
      - label: "Wildstalker"
        value: 2
    default: 1

  # --- Talent Config ---
  use_chomp:
    label: "Auto Chomp"
    type: checkbox
    default: true

  # DEFENSIVES
  barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 95
    default: 55

  survival_instincts_threshold:
    label: "Survival Instincts HP %"
    type: slider
    min: 20
    max: 70
    default: 40

  renewal_threshold:
    label: "Renewal HP %"
    type: slider
    min: 20
    max: 80
    default: 40

  # COOLDOWNS
  use_berserk:
    label: "Auto Berserk/Incarnation"
    type: checkbox
    default: true

  use_convoke:
    label: "Auto Convoke"
    type: checkbox
    default: true

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: false

  use_racials:
    label: "Auto Racials"
    type: checkbox
    default: true

  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  # INTERRUPTS
  use_skull_bash:
    label: "Auto Interrupt"
    type: checkbox
    default: true
  skull_bash_delay:
    label: "Interrupt Delay (ms)"
    type: slider
    min: 0
    max: 2000
    default: 250

  # AOE
  aoe_threshold:
    label: "Min Enemies for AoE"
    type: slider
    min: 2
    max: 5
    default: 3

  # MOVEMENT
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2
  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    type: slider
    min: 0
    max: 4
    default: 2

  # UTILITY
  use_prowl:
    label: "Auto Prowl"
    type: checkbox
    default: true

  use_shadowmeld:
    label: "Auto Shadowmeld"
    type: checkbox
    default: true

variables:
  # FORM
  in_cat_form: buff.cat_form.up

  # RESOURCES — use direct resource names, no variable wrapper
  cp_max: combo_points>=4
  cp_full: combo_points>=5

  # BUFF TRACKING
  has_apex: buff.apex_predators_craving.up
  has_clearcasting: buff.clearcasting_feral.up
  has_sudden_ambush: buff.sudden_ambush.up
  tigers_fury_up: buff.tigers_fury.up
  berserk_up: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  ravage_up: buff.ravage.up
  predatory_swiftness_up: buff.predatory_swiftness.up

  # DOT/BLEED TRACKING
  rip_up: debuff.rip.up
  rip_refreshable: debuff.rip.refreshable|debuff.rip.remains<4.8
  rake_refreshable: debuff.rake.refreshable|debuff.rake.remains<4.2
  moonfire_refreshable: debuff.moonfire.refreshable|debuff.moonfire.remains<4.2

  # SNAPSHOTTING — refresh bleeds when Tiger's Fury is active for better damage
  rip_needs_tf_snapshot: var.tigers_fury_up&debuff.rip.up&!debuff.rip.remains<8
  rake_needs_tf_snapshot: var.tigers_fury_up&var.rake_refreshable

  # DEFENSIVE STATES
  emergency_situation: health.pct<35
  dangerous_situation: health.pct<60

  # COMBAT
  combat_start: player.combat&player.combat.time<3
  can_interrupt: target.casting&!target.casting.interruptible=false

  # ENERGY MANAGEMENT
  # 50+ energy is ideal for max Bite damage, but 25+ is still usable
  energy_for_bite: energy>=25
  energy_for_bite_ideal: energy>=50
  energy_for_tf: energy.deficit>=50

  # MOVEMENT
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  spell_queue:
    - queue_spell

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby

  defensives:
    # Emergency layer
    - survival_instincts,if=var.emergency_situation&!buff.survival_instincts.up
    - renewal,if=var.emergency_situation
    - barkskin,if=var.emergency_situation&!buff.survival_instincts.up
    # Threshold layer
    - survival_instincts,if=health.pct<config.survival_instincts_threshold&!buff.survival_instincts.up
    - barkskin,if=var.dangerous_situation&!buff.barkskin.up
    - renewal,if=health.pct<config.renewal_threshold
    - barkskin,if=health.pct<config.barkskin_threshold&!buff.barkskin.up
    # Predatory Swiftness — free instant Regrowth proc (M+ only below 80%)
    - regrowth,if=var.predatory_swiftness_up&health.pct<80

  cooldowns:
    # Heart of the Wild — major utility/burst CD
    - heart_of_the_wild,if=config.use_heart_of_the_wild&talent.heart_of_the_wild
    # Tiger's Fury — off GCD, use on cooldown when energy is low
    - tigers_fury,if=var.energy_for_tf|buff.tigers_fury.down
    # Berserk / Incarnation — major DPS window, sync with Tiger's Fury
    - berserk,if=config.use_berserk&var.tigers_fury_up
    - incarnation_avatar_of_ashamane,if=config.use_berserk&var.tigers_fury_up&(target.boss|active_enemies>=config.aoe_threshold)
    # Convoke — cast inside Berserk + Tiger's Fury window, at low CPs
    - convoke_the_spirits,if=config.use_convoke&var.berserk_up&var.tigers_fury_up&combo_points<=2
    # Convoke — cast outside of Berserk if using 1-minute Convoke (Ashamane's Guidance)
    - convoke_the_spirits,if=config.use_convoke&talent.ashamanes_guidance&var.tigers_fury_up&combo_points<=2

  racials:
    - shadowmeld,if=config.use_shadowmeld&player.combat&var.berserk_up&combo_points<=2&!buff.sudden_ambush.up
    - blood_fury,if=var.berserk_up
    - berserking,if=var.berserk_up
    - fireblood,if=var.berserk_up
    - ancestral_call,if=var.berserk_up

  interrupts:
    # Interrupts
    - skull_bash,if=interrupt.target.check
    - skull_bash.mouseover,if=interrupt.mouseover.check
    - skull_bash.focus,if=interrupt.focus.check
    # AoE Interrupt
    - incapacitating_roar,if=interrupt.stun.aoe.check
    # CC Interrupt
    - mighty_bash,if=interrupt.cc.check
    - soothe,if=target.purgeable.enrage

  dispels:
    - remove_corruption,cycle=members,if=cycle.dispelable.list&cycle.range>0&cycle.range<=40

  out_of_combat:
    - mark_of_the_wild,if=group.count(cycle.buff.mark_of_the_wild.down.any&cycle.range>0&cycle.range<=40)>0
    - prowl,if=config.use_prowl&!buff.prowl.up&(!player.combat|buff.shadowmeld.up)

  stealth_opener:
    # Rake from stealth = bonus damage via Pouncing Strikes
    - rake,if=buff.prowl.up|buff.shadowmeld.up

  trinkets:
    - trinket_1,if=config.use_trinkets&trinket_1.ready&(var.berserk_up|target.boss|active_enemies>=config.aoe_threshold)
    - trinket_2,if=config.use_trinkets&trinket_2.ready&(var.berserk_up|target.boss|active_enemies>=config.aoe_threshold)

  movement:
    - prowl,if=config.use_prowl&!buff.prowl.up&!player.combat
    - stampeding_roar,if=var.use_stampeding_roar&config.stampeding_roar_usage!=0
    - wild_charge,if=player.moving&range>8&player.combat

  # -------------------------------------------------------------------------------------------------
  # DRUID OF THE CLAW - SINGLE TARGET
  # Based on Icy Veins Midnight 12.0.1 priority
  # -------------------------------------------------------------------------------------------------
  st_rotation:
    # 1. Consume Apex Predator's Craving immediately
    - ferocious_bite,if=var.has_apex
    - ravage,if=var.has_apex&var.ravage_up

    # 2. Tiger's Fury on cooldown
    - tigers_fury,if=var.energy_for_tf|buff.tigers_fury.down

    # 3. Chomp (New 12.0.1 Talent - High priority generator)
    - chomp,if=config.use_chomp&cooldown.chomp.ready&energy>=50

    # 4. Ferocious Bite in Execute Phase (< 25%)
    - ferocious_bite,if=var.cp_full&target.health.pct<25

    # 5. Rip — maintain at all times
    - rip,if=var.cp_max&!var.rip_up&target.health.pct>=25
    - rip,if=var.cp_max&var.rip_refreshable&var.tigers_fury_up&target.health.pct>=25
    - rip,if=var.cp_full&var.rip_refreshable&target.health.pct>=25

    # 6. Ravage — consume procs ASAP
    - ravage,if=var.ravage_up&var.cp_max&var.energy_for_bite

    # 7. Ferocious Bite — spend CPs when Rip is healthy (ideal: 50+ energy)
    - ferocious_bite,if=var.cp_max&var.energy_for_bite_ideal&var.rip_up
    - ferocious_bite,if=var.cp_full&var.energy_for_bite&var.rip_up

    # 8. Rake — maintain with 100% uptime
    - rake,if=var.has_sudden_ambush&var.rake_refreshable
    - rake,if=var.rake_refreshable&target.health.pct>=25
    - rake,if=!debuff.rake.up&target.health.pct<25

    # 9. Frantic Frenzy / Feral Frenzy — on cooldown at low CPs
    - frantic_frenzy,if=talent.frantic_frenzy&combo_points<=2&var.tigers_fury_up
    - feral_frenzy,if=!talent.frantic_frenzy&combo_points<=2&var.tigers_fury_up

    # 10. Shred with Sudden Ambush
    - shred,if=var.has_sudden_ambush

    # 11. Moonfire (Lunar Inspiration)
    - moonfire,if=talent.lunar_inspiration&var.moonfire_refreshable

    # 12. Shred — filler generator
    - shred

  # -------------------------------------------------------------------------------------------------
  # DRUID OF THE CLAW - AOE (3+ targets)
  # Based on Icy Veins Midnight 12.0.1 priority
  # -------------------------------------------------------------------------------------------------
  aoe_rotation:
    # 1. Consume Apex Predator's Craving immediately
    - ferocious_bite,if=var.has_apex
    - ravage,if=var.has_apex&var.ravage_up

    # 2. Tiger's Fury on cooldown
    - tigers_fury,if=var.energy_for_tf|buff.tigers_fury.down

    # 3. Chomp (New 12.0.1 Talent)
    - chomp,if=config.use_chomp&cooldown.chomp.ready&energy>=50

    # 4. Primal Wrath — main AoE finisher
    - primal_wrath,if=var.cp_max&debuff.rip.down
    - primal_wrath,if=var.cp_max&var.rip_refreshable

    # 5. Ravage / Ferocious Bite — cleave with Rampant Ferocity
    - ravage,if=var.ravage_up&var.cp_max&var.energy_for_bite
    - ferocious_bite,if=var.cp_max&var.energy_for_bite&debuff.rip.up
    - ferocious_bite,if=var.cp_full&var.energy_for_bite

    # 6. Frantic Frenzy / Feral Frenzy
    - frantic_frenzy,if=talent.frantic_frenzy&combo_points<=2
    - feral_frenzy,if=!talent.frantic_frenzy&combo_points<=2

    # 7. Rake — cycle targets
    - rake,cycle=enemies,if=var.rake_refreshable

    # 8. Moonfire — cycle targets (up to 4)
    - moonfire,cycle=enemies,if=talent.lunar_inspiration&var.moonfire_refreshable&active_enemies<=4

    # 9. Swipe — filler AoE builder
    - swipe

  main:
    - return,if=player.channeling
    - return,if=buff.convoke_the_spirits.up
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - rebirth.mouseover,if=mouseover.exists&mouseover.dead&mouseover.friendly&mouseover.range<=40
    - cat_form,if=!buff.cat_form.up&!mounted.flying&!mounted.ground
    - call_action_list,name=out_of_combat,if=!player.combat&!mounted.flying&!mounted.ground
    - return,if=mounted.flying|mounted.ground

    # Stop here if out of combat with no enemy target
    - return,if=!player.combat&!target.enemy
    - return,if=target.enemy&target.dead

    # Leveling mode: pull with Moonfire at range
    - moonfire,if=config.game_mode=2&!player.combat&target.enemy&target.alive&range>8

    # Only use defensives and auto-heals in combat (prevent auto-potion/Renewal from fall damage out of combat)
    - call_action_list,name=defensives,if=player.combat
    - call_action_list,name=auto_target,if=player.combat
    - call_action_list,name=auto_heal,if=player.combat
    - call_action_list,name=interrupts
    - call_action_list,name=dispels

    # Stealth opener: Rake from stealth only if close enough
    - call_action_list,name=stealth_opener,if=target.enemy&(buff.prowl.up|buff.shadowmeld.up)&range<=8

    # Prevent popping cooldowns, Tiger's Fury, and attacking completely if we are out of combat and not in melee range yet
    - return,if=!player.combat&range>8

    # Cooldowns and burst
    - call_action_list,name=cooldowns,if=player.combat
    - call_action_list,name=racials,if=config.use_racials&player.combat
    - call_action_list,name=trinkets,if=player.combat

    # Movement
    - call_action_list,name=movement,if=player.moving

    # Core rotation dispatch
    - call_action_list,name=aoe_rotation,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=st_rotation,if=active_enemies<config.aoe_threshold
