version: 2.1
author: Ferraz
patch: "12.0.1.6"
spec: 103
name: Ferraz Feral Druid M+ (Claw)
description: |
  Feral Druid Rotation for Mythic+ — Midnight (12.0.1).
  Druid of the Claw — optimized from elite M+ logs (Turbogronil).
  Frantic Frenzy in AoE, aggressive Ravage usage, Convoke synergy.
entry: main

config:

  # --- Talent Config ---
  use_chomp:
    label: "Auto Chomp"
    section: "General"
    type: checkbox
    default: true

  # DEFENSIVES
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 95
    default: 55

  survival_instincts_threshold:
    label: "Survival Instincts HP %"
    section: "Defensives"
    type: slider
    min: 20
    max: 70
    default: 40

  renewal_threshold:
    label: "Renewal HP %"
    section: "Defensives"
    type: slider
    min: 20
    max: 80
    default: 40

  # COOLDOWNS
  use_berserk:
    label: "Auto Berserk/Incarnation"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_convoke:
    label: "Auto Convoke"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Cooldowns"
    type: checkbox
    default: false

  use_racials:
    label: "Auto Racials"
    section: "Cooldowns"
    type: checkbox
    default: true

  # TRINKETS
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false


  # INTERRUPTS
  use_skull_bash:
    label: "Auto Interrupt"
    section: "Interrupts"
    type: checkbox
    default: true
  skull_bash_delay:
    label: "Interrupt Delay (ms)"
    section: "Interrupts"
    type: slider
    min: 0
    max: 2000
    default: 250

  # AOE
  aoe_threshold:
    label: "Min Enemies for AoE"
    section: "Damage"
    type: slider
    min: 2
    max: 5
    default: 3

  # MOVEMENT
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2
  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # UTILITY
  use_prowl:
    label: "Auto Prowl"
    section: "Utility"
    type: checkbox
    default: true

  use_shadowmeld:
    label: "Auto Shadowmeld"
    section: "Utility"
    type: checkbox
    default: true

variables:
  # RESOURCES — use direct resource names, no variable wrapper
  cp_max: combo_points>=4
  cp_full: combo_points>=5

  # BUFF TRACKING
  has_apex: buff.apex_predators_craving.up
  has_sudden_ambush: buff.sudden_ambush.up
  tigers_fury_up: buff.tigers_fury.up
  berserk_up: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  ravage_up: buff.ravage.up
  predatory_swiftness_up: buff.predatory_swiftness.up

  # DOT/BLEED TRACKING
  rip_up: debuff.rip.up
  rip_refreshable: debuff.rip.refreshable|debuff.rip.remains<4.8
  rake_refreshable: debuff.rake.refreshable|debuff.rake.remains<4.2
  moonfire_refreshable: debuff.moonfire.refreshable|debuff.moonfire.remains<4.2

  # DEFENSIVE STATES
  emergency_situation: health.pct<35
  dangerous_situation: health.pct<60

  # ENERGY MANAGEMENT
  # 50+ energy is ideal for max Bite damage, but 25+ is still usable
  energy_for_bite: energy>=25
  energy_for_bite_ideal: energy>=50
  energy_for_tf: energy.deficit>=50

  # MOVEMENT
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  defensives:
    - survival_instincts,name="Survival Instincts (Panic)",if=var.emergency_situation&!buff.survival_instincts.up
    - renewal,name="Renewal (Panic)",if=var.emergency_situation
    - barkskin,name="Barkskin (Panic)",if=var.emergency_situation&!buff.survival_instincts.up
    - survival_instincts,name="Survival Instincts",if=health.pct<config.survival_instincts_threshold&!buff.survival_instincts.up
    - barkskin,name="Barkskin (Defensive)",if=var.dangerous_situation&!buff.barkskin.up
    - renewal,name="Renewal",if=health.pct<config.renewal_threshold
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold&!buff.barkskin.up
    - regrowth,name="Regrowth (Proc)",if=var.predatory_swiftness_up&health.pct<90

  cooldowns:
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&talent.heart_of_the_wild
    - tigers_fury,name="Tiger's Fury",if=var.energy_for_tf|buff.tigers_fury.down
    # Trinkets & Potion — fire before burst, synced with Tiger's Fury
    - trinket_1,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&var.tigers_fury_up
    - trinket_2,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&var.tigers_fury_up
    - combat_potion,name="Potion",if=config.use_potion&combat_potion.ready&var.tigers_fury_up&(var.berserk_up|target.boss)
    - berserk,name="Berserk",if=config.use_berserk&var.tigers_fury_up
    - incarnation_avatar_of_ashamane,name="Incarnation",if=config.use_berserk&var.tigers_fury_up&(target.boss|active_enemies>=config.aoe_threshold)
    - convoke_the_spirits,name="Convoke (Berserk)",if=config.use_convoke&var.berserk_up&var.tigers_fury_up&combo_points<=3
    - convoke_the_spirits,name="Convoke (TF Only)",if=config.use_convoke&var.tigers_fury_up&!var.berserk_up&combo_points<=3

  racials:
    - shadowmeld,name="Shadowmeld (Prowl Proc)",if=config.use_shadowmeld&player.combat&var.berserk_up&combo_points<=2&!buff.sudden_ambush.up
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=config.use_shadowmeld&player.combat&(target.threat>=3|player.aggro)&!target.boss
    - blood_fury,name="Blood Fury",if=var.berserk_up
    - berserking,name="Berserking",if=var.berserk_up
    - fireblood,name="Fireblood",if=var.berserk_up
    - ancestral_call,name="Ancestral Call",if=var.berserk_up

  interrupts:
    # Auto Swap
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any

    # Interrupts
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check

    # CC & Utility
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - mighty_bash,name="Mighty Bash",if=interrupt.cc.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=buff.mark_of_the_wild.down.any
    - prowl,name="Prowl (OOC)",if=config.use_prowl&!buff.prowl.up&(!player.combat|buff.shadowmeld.up)

  stealth_opener:
    - rake,name="Rake Opener",if=buff.prowl.up|buff.shadowmeld.up

  movement:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - cat_form,name="Stay Cat (Rooted)",if=player.rooted&buff.bear_form.up
    - prowl,name="Prowl (Movement)",if=config.use_prowl&!buff.prowl.up&!player.combat
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0
    - wild_charge,name="Wild Charge",if=player.moving&range>8&player.combat

  # -------------------------------------------------------------------------------------------------
  # DRUID OF THE CLAW - SINGLE TARGET
  # Based on elite M+ log analysis (Turbogronil) + Icy Veins 12.0.1
  # -------------------------------------------------------------------------------------------------
  st_rotation:
    # Apex procs — consume immediately
    - ravage,name="Ravage (Apex Proc) ST",if=var.has_apex&var.ravage_up
    - ferocious_bite,name="Bite (Apex Proc) ST",if=var.has_apex
    - tigers_fury,name="Tiger's Fury ST",if=var.energy_for_tf|buff.tigers_fury.down
    - chomp,name="Chomp ST",if=config.use_chomp&cooldown.chomp.ready&energy>=50
    # Execute below 25%
    - ferocious_bite,name="Bite (Execute) ST",if=var.cp_full&target.health.pct<25
    # Rip management
    - rip,name="Rip Apply ST",if=var.cp_max&!var.rip_up&target.health.pct>=25
    - rip,name="Rip Snapshot ST",if=var.cp_max&var.rip_refreshable&var.tigers_fury_up&target.health.pct>=25
    - rip,name="Rip Refresh ST",if=var.cp_full&var.rip_refreshable&target.health.pct>=25
    # Ravage finisher — elite players use Ravage aggressively as a finisher
    - ravage,name="Ravage ST",if=var.ravage_up&var.cp_max&var.energy_for_bite
    # Ferocious Bite dumps
    - ferocious_bite,name="Bite (Dump Ideal) ST",if=var.cp_max&var.energy_for_bite_ideal&var.rip_up
    - ferocious_bite,name="Bite (Dump) ST",if=var.cp_full&var.energy_for_bite&var.rip_up
    # Frantic Frenzy — use BEFORE builders when low CP, higher priority than Rake
    - frantic_frenzy,name="Frantic Frenzy ST",if=talent.frantic_frenzy&combo_points<=3&var.tigers_fury_up
    - feral_frenzy,name="Feral Frenzy ST",if=!talent.frantic_frenzy&combo_points<=3&var.tigers_fury_up
    # Rake management
    - rake,name="Rake (Ambush Proc) ST",if=var.has_sudden_ambush&var.rake_refreshable
    - rake,name="Rake Refresh ST",if=var.rake_refreshable&target.health.pct>=25
    - rake,name="Rake Execute ST",if=!debuff.rake.up&target.health.pct<25
    # Builders
    - shred,name="Shred (Ambush Proc) ST",if=var.has_sudden_ambush
    - moonfire,name="Moonfire ST",if=talent.lunar_inspiration&var.moonfire_refreshable
    - shred,name="Shred Filler ST"

  # -------------------------------------------------------------------------------------------------
  # DRUID OF THE CLAW - AOE (3+ targets)
  # Based on elite M+ log analysis (Turbogronil) + Icy Veins 12.0.1
  # Priority: TF → PW → FF → Ravage/Apex → PW again → Rake spread → Swipe
  # -------------------------------------------------------------------------------------------------
  aoe_rotation:
    - tigers_fury,name="Tiger's Fury AoE",if=var.energy_for_tf|buff.tigers_fury.down

    # Primal Wrath — apply/refresh Rip on all targets
    - primal_wrath,name="Primal Wrath (Bleed)",if=var.cp_max&debuff.rip.refreshable
    - primal_wrath,name="Primal Wrath (Dump)",if=var.cp_full&active_enemies>=4

    # Frantic Frenzy — elite players use FF immediately after PW in AoE
    - frantic_frenzy,name="Frantic Frenzy AoE",if=talent.frantic_frenzy&combo_points<=3&var.tigers_fury_up
    - feral_frenzy,name="Feral Frenzy AoE",if=!talent.frantic_frenzy&combo_points<=3&var.tigers_fury_up

    # Ravage — elite players use Ravage aggressively in AoE (110 total casts in log)
    - ravage,name="Ravage (Apex AoE)",if=var.has_apex&var.ravage_up
    - ravage,name="Ravage (AoE Finisher)",if=var.ravage_up&var.cp_max&var.energy_for_bite

    # Apex Ferocious Bite — consume procs
    - ferocious_bite,name="Bite (Apex Proc AoE)",if=var.has_apex

    # Ferocious Bite cleave during Berserk (high CP generation)
    - ferocious_bite,name="Bite (Berserk Cleave)",if=var.berserk_up&var.cp_full&var.energy_for_bite

    # Smart Rake Spreading (Tab Targeting)
    - target_enemy,delay=200,name="Search Rake Target",if=debuff.rake.up&!var.rake_refreshable&active_dot.rake<active_enemies&active_dot.rake<6
    - rake,name="Rake (Spread)",if=var.rake_refreshable

    - swipe,name="Swipe AoE Builder"

  main:
    - return,if=player.channeling|player.casting|player.casting.remains>0|player.channeling.remains>0|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    return,if=player.combat
    # Only use defensives and auto-heals in combat (prevent auto-potion/Renewal from fall damage out of combat)
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=stealth_opener,if=target.enemy&(buff.prowl.up|buff.shadowmeld.up)&range<=8
    - return,if=!player.combat&range>8
    - call_action_list,name=cooldowns
    - call_action_list,name=racials,if=config.use_racials
    - call_action_list,name=movement,if=player.moving
    - call_action_list,name=aoe_rotation,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=st_rotation,if=active_enemies<config.aoe_threshold
