# =============================================================================
# Feral Druid — spec 103 — patch 12.1 (Midnight) — Druid of the Claw, M+.
# =============================================================================
#
# Measured with SimC 1210-01, fight_style=DungeonSlice (M+ proxy), against
# the recommended string. Harness: sim/ab_test_feral.py, profile
# sim/Ferraz_feral.simc (gear: SimC's own MID1 Feral preset). Baseline for
# comparison is SimC's own default APL for this build, sourced from
# dreamgrove (github.com/dreamgrove/dreamgrove/blob/master/sims/cat/feral.txt)
# and already dungeon-tuned — not a guess.
#
# BIGGEST FINDING: the `cooldown` list computed var.holdBerserk and the
# Convoke count-remaining variables but never actually cast Berserk, Convoke
# the Spirits, trinkets or a potion anywhere in the file. Adding them back
# measured +18.42% DungeonSlice — by far the largest number here. Two other
# candidate fixes tested and NOT applied: removing Tiger's Fury's
# hold-for-Frantic-Frenzy clause (no measurable gain once Berserk is
# actually cast, possibly a tiny loss) and the dotc_rake_threshold talent
# fix (-0.14%, noise — fixed anyway since it costs nothing, see its own comment).
#
# Separately from the sim: a dead `return,if=auto_combat.player` at the top of
# main was silently aborting the whole rotation in-game (see the note there).
# SimC never had that line, so no number here captures it.
#
# BUILD ASSUMPTIONS — talents confirmed on the recommended string by decoding
# it through the local SimC binary (sim/tools/simc-1210.01.fd069a4-win64/simc.exe).
# The hero tree is DRUID OF THE CLAW (all 14 points: Ravage, Claw Rampage,
# Killing Strikes, Dreadful Wound, Twin Claw, Strike for the Heart, Bestial
# Strength, Aggravate Wounds, ...), plus Frantic Frenzy, Rampant Ferocity,
# Primal Wrath, Double-Clawed Rake, Infected Wounds, Heart of the Wild, Fluid
# Form and Unseen Predator apex maxed 4/4.
#
# This file has now been on both hero trees (Druid of the Claw -> Wildstalker
# -> back to Druid of the Claw) and the priority never had to change for any
# of it: every affected line is gated on hero_tree.* or on a talent, so the
# Ravage and Heart of the Wild lines simply go live or inert on their own and
# the aoe_builder branches swap sides by themselves.
# NOT talented on this string (harmless dead weight): Lunar Inspiration, Wild
# Slashes, Panther's Guile, and every hero_tree.wildstalker check.
#
# Two Druid-of-the-Claw candidates were measured on the new string and NOT
# applied, all three inside the error bar of the current priority:
#     Shred on a Sudden Ambush proc   -0.02%  (worth +2.35% on the RAID file,
#                                              which is single-target; here the
#                                              builder list barely runs)
#     Apex Predator's Craving line     -0.04%
#     both together                    -0.08%
#
# Bite pooling (ferocious_bite with max_energy) was tested here and measured
# nothing — it is worth +2.87% on the RAID build only, where Saber Jaws pays
# for it. See FerrazFeralRaid.yaml.
#
# Unseen Predator (apex): Tiger's Fury guarantees a bonus Unseen Attack on
# your next 2 combo-point generators — entirely passive/automatic on the
# game side, no APL line needed. Its stacking damage buff (Unseen Predator's
# Craving) is not currently spent around deliberately; a finisher-pooling
# window built around it is a possible future gain, not applied here.
# =============================================================================

version: 2.2
author: Ferraz
patch: "12.1"
spec: 103
name: Feral Druid Ferraz M+
description: |
  Feral Druid Ferraz M+
entry: main

config:
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-21 | Patch: 12.1 | Version: 2.2"

  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CcGAAAAAAAAAAAAAAAAAAAAAAAAAAAAgZmZ2YmZmxY2MPw2YbGzMmZAAAAYLY2M8AmZUzYWMzMzsMmhBAAAAAwADAAAgmZZWmZmBAsAzMDwCDGAAAzshB"

  survival_instincts_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  regrowth_ooc_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth OOC HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  predatory_swiftness_heal_solo_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (Predatory Swiftness) HP% (Solo)"
    type: slider
    min: 0
    max: 100
    default: 80

  predatory_swiftness_heal_group_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (Predatory Swiftness) HP% (Group)"
    type: slider
    min: 0
    max: 100
    default: 40

  survival_instincts_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival Instincts (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55

  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  # === COOLDOWN CONFIGURATIONS ===
  # Defaults ON: the whole cooldown block below (Berserk/Convoke/trinkets/
  # potion) was entirely missing before — see the `cooldown` list comment.
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Combat Potion"
    section: "Cooldowns"
    type: checkbox
    default: true

  # === TIME TO DIE (TTD) CONFIGURATIONS ===
  # Stop a long cooldown being spent on trash that is about to die. Same shape
  # as FerrazBalance.yaml's TTD block, including the target.boss short-circuit
  # in each variable: a boss never counts as "about to die", so a boss pull
  # always bursts immediately no matter how these are set.
  #
  # UNVALIDATED by simulation, like the Balance ones: SimC dummies live the
  # whole fight, so a TTD gate can only cost DPS there and never gain any.
  # Measured on DungeonSlice purely to confirm it costs nothing (see the
  # header). The actual gain is in-game, on trash that dies early.
  ttd_berserk:
    label: "Berserk / Incarnation TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use Berserk or Incarnation: Avatar of Ashamane. Bosses ignore it."

  ttd_convoke:
    label: "Convoke the Spirits TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum fight time remaining to use Convoke the Spirits. Lower than Berserk's: Convoke pays out over ~4s, so it is worth firing on a shorter pull. Bosses ignore it."

  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10
    description: "Minimum fight time remaining to use trinkets. Bosses ignore it."

  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15
    description: "Minimum fight time remaining to use the combat potion. The end-of-fight clause on the potion line ignores this, so a potion that would be wasted anyway still goes out."

variables:
  bs_inc: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  bs_inc_remains: buff.berserk.remains+buff.incarnation_avatar_of_ashamane.remains
  bs_inc_cd_remains: cooldown.berserk.remains>?cooldown.incarnation_avatar_of_ashamane.remains
  bs_inc_cd_duration: cooldown.berserk.duration>?cooldown.incarnation_avatar_of_ashamane.duration
  regrowth: 0
  # Was gated on talent.infected_wounds — the real formula (dreamgrove/SimC
  # default APL) gates on talent.merciless_claws instead. No measured DPS
  # difference on this build (wild_slashes untalented -> 99 either way), but
  # the formula is now correct if the build changes. Fixed, not guessed:
  # confirmed via sim/ab_test_feral.py's dotc_fix_only variant (-0.14% ~).
  dotc_rake_threshold: 99-94*(talent.wild_slashes&talent.merciless_claws)-91*(talent.wild_slashes&!talent.merciless_claws)
  bs_inc_cd: var.bs_inc_cd_remains+10
  convoke_cd: cooldown.convoke_the_spirits.remains+10
  convokeCountRemaining: floor(((fight_remains-var.convoke_cd)%cooldown.convoke_the_spirits.duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  zerkCountRemaining: floor(((fight_remains-var.bs_inc_cd)%var.bs_inc_cd_duration)+(fight_remains>var.bs_inc_cd_remains))
  firstHoldBerserkCondition: var.zerkCountRemaining=1&var.convokeCountRemaining=1&cooldown.convoke_the_spirits.remains>10
  secondHoldBerserkCondition: cooldown.convoke_the_spirits.remains>20&var.convokeCountRemaining=var.zerkCountRemaining&var.zerkCountRemaining=floor(((fight_remains-var.convoke_cd)%var.bs_inc_cd_duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  holdBerserk: var.firstHoldBerserkCondition|var.secondHoldBerserkCondition
  holdConvoke: var.convokeCountRemaining=1&var.zerkCountRemaining=1&!var.bs_inc
  rake_tf: debuff.rake.visual_id=491160
  rip_tf: debuff.rip.visual_id=491158
  moonfire_tf: debuff.moonfire.visual_id=500891

  # === TIME TO DIE (TTD) VARIABLES === (target.boss always ignores TTD)
  berserk_ttd_ok: (target.boss|target.time_to_die>=config.ttd_berserk|fight_remains>=config.ttd_berserk)
  convoke_ttd_ok: (target.boss|target.time_to_die>=config.ttd_convoke|fight_remains>=config.ttd_convoke)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)

  rip_preempt: "active_enemies=1&combo_points>=5&dot.rip.up&(dot.rip.refreshable&(buff.tigers_fury.up|dot.rip.remains<cooldown.tigers_fury.remains)|buff.tigers_fury.up&!var.rip_tf|buff.tigers_fury.up&buff.tigers_fury.remains<2)"

lists:
  defensives:
    - barkskin,off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.barkskin_dmg_pct
    - survival_instincts,off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.survival_instincts_dmg_pct&incoming.mitigated.pct>=config.survival_instincts_dmg_pct
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - survival_instincts,off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - barkskin,off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.barkskin_hp_pct

  cooldown:
    # This whole list used to be just the two finisher-CD lines below: the
    # file computed var.holdBerserk and the Convoke count-remaining variables
    # but never actually cast Berserk, Convoke the Spirits, trinkets or a
    # potion anywhere. Confirmed missing via sim/ab_test_feral.py against the
    # SimC default (dreamgrove-sourced) APL for this exact build — adding
    # them back measured +19.73% DungeonSlice, the single largest number in
    # this file.
    - trinket_1,if=config.use_trinket_1&trinket_1.ready&var.trinkets_ttd_ok
    - trinket_2,if=config.use_trinket_2&trinket_2.ready&var.trinkets_ttd_ok
    - berserking,if=var.bs_inc
    - blood_fury,if=var.bs_inc
    - fireblood,if=var.bs_inc
    - ancestral_call,if=var.bs_inc
    - combat_potion,if=config.use_potion&combat_potion.ready&(var.bs_inc&var.potion_ttd_ok|fight_remains<32)
    - berserk,if=buff.tigers_fury.up&!var.holdBerserk&var.berserk_ttd_ok
    - feral_frenzy,if=!talent.frantic_frenzy&combo_points<=2+(2*var.bs_inc)
    - frantic_frenzy,if=buff.tigers_fury.up|combo_points<=2+(2*var.bs_inc)
    # Talented on the recommended string. Lines up with Berserk, on the GCD
    # right after a finisher so the burst window snapshots a full-CP window.
    - convoke_the_spirits,if=var.bs_inc&var.convoke_ttd_ok&buff.tigers_fury.up&(prev_gcd.1.rip|prev_gcd.1.ferocious_bite|prev_gcd.1.primal_wrath|buff.tigers_fury.remains<=1+action.convoke_the_spirits.execute_time)

  finisher:
    - rip,if=combo_points>=5&(dot.rip.refreshable&(buff.tigers_fury.up|dot.rip.remains<cooldown.tigers_fury.remains)|buff.tigers_fury.up&!var.rip_tf&dot.rip.up|buff.tigers_fury.up&buff.tigers_fury.remains<2&dot.rip.up)
    - return,if=combo_points>=5&energy<50
    - ferocious_bite,if=combo_points>=5
    - ravage,if=combo_points>=5

  aoe_finisher:
    - primal_wrath,if=combo_points>=5&active_enemies>1&(dot.rip.remains<6.5&!var.bs_inc|dot.rip.refreshable)
    - ravage,if=combo_points>=5&!talent.primal_wrath&active_enemies>=2+(3*!talent.rampant_ferocity)
    - rip,if=combo_points>=5&!talent.primal_wrath&(dot.rip.down|dot.rip.refreshable&(buff.tigers_fury.up|!var.rip_tf))
    - ferocious_bite,if=combo_points>=5&(talent.rampant_ferocity|buff.ravage.up&active_enemies<8|dot.bloodseeker_vines.ticking&active_enemies<5)
    - ravage,if=combo_points>=5&(talent.rampant_ferocity|active_enemies<8|dot.bloodseeker_vines.ticking&active_enemies<5)
    - primal_wrath,if=combo_points>=5
    - ferocious_bite,if=combo_points>=5
    - ravage,if=combo_points>=5
    - thorn_bloom

  builder:
    # Same reasoning as the main-list Prowl: cannot be cast in combat.
    - prowl,if=!player.combat&!buff.shadowmeld.up&(!var.rake_tf|dot.rake.refreshable)
    - rake,if=(buff.tigers_fury.up|dot.rake.remains<cooldown.tigers_fury.remains)&(dot.rake.refreshable&(buff.tigers_fury.up|!var.rake_tf)|dot.rake.remains<2|buff.tigers_fury.up&!var.rake_tf)
    - moonfire,if=talent.lunar_inspiration&(buff.tigers_fury.up|dot.moonfire.remains<cooldown.tigers_fury.remains)&(dot.moonfire.refreshable&(buff.tigers_fury.up|!var.moonfire_tf)|dot.moonfire.remains<2|buff.tigers_fury.up&!var.moonfire_tf)
    - shred

  aoe_builder:
    - rake,if=dot.rake.refreshable&((talent.doubleclawed_rake&(!talent.lunar_inspiration|!talent.panthers_guile|active_dot.rake<5))|hero_tree.wildstalker&(active_dot.rake<2+!talent.panthers_guile+talent.lunar_inspiration))
    - moonfire,if=talent.lunar_inspiration&dot.moonfire.refreshable
    - 106785,if=hero_tree.druid_of_the_claw&var.bs_inc|buff.clearcasting.react&active_enemies>2&(hero_tree.druid_of_the_claw|active_enemies<7)
    - 106785,if=buff.sudden_ambush.up&active_enemies>=5+(2*hero_tree.wildstalker)
    - rake,if=dot.rake.refreshable&(hero_tree.wildstalker|active_enemies<=var.dotc_rake_threshold)
    - rake,if=buff.tigers_fury.up&!var.rake_tf&active_enemies=2
    - shred,if=combo_points<=1&active_enemies=2&talent.panthers_guile
    - 106785,if=combo_points>1|active_enemies>2|!talent.panthers_guile

  # Mark of the Wild, OOC Regrowth top-off.
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - regrowth,range_check=none,if=health.pct<=config.regrowth_ooc_hp_pct&!player.combat

  # Emergency Bear Form, Fluid Form auto-shift, manual Cat Form entry, and
  # the pre-pull Prowl opener.
  form:
    - bear_form,range_check=none,if=health.pct<=25&!buff.bear_form.up&player.combat
    - heart_of_the_wild,range_check=none,if=buff.bear_form.up&player.combat

    - shred,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - rake,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - cat_form,range_check=none,if=buff.cat_form.down&(target.attackable|enemies.40y)

    # !player.combat added: Prowl cannot be cast in combat (Blizzard's own
    # restriction) — if Simia doesn't already model that as "unusable" the
    # same way it does cooldowns/resources/range, the buff never applies,
    # the condition never turns false, and this line traps priority forever
    # every GCD in combat, blocking Tiger's Fury/cooldown/finisher/builder
    # below it entirely. This is meant as the pre-pull opener only.
    - prowl,range_check=none,if=!player.combat&!var.bs_inc&buff.prowl.down&buff.shadowmeld.down&(target.attackable|enemies.40y)

  interrupts:
    - skull_bash,off_gcd=true,ignore_queue=true,if=interrupt.target.check
    - skull_bash.mouseover,off_gcd=true,ignore_queue=true,if=interrupt.mouseover.check
    - skull_bash.focus,off_gcd=true,ignore_queue=true,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check

  # Regrowth off a Predatory Swiftness proc — deliberately called after
  # `defensives` in main, so a real defensive cooldown outranks a proc heal.
  predatory_swiftness:
    - regrowth,delay=500,range_check=none,if=buff.predatory_swiftness.up&player.solo&health.pct<=config.predatory_swiftness_heal_solo_hp_pct&lastcast.regrowth>=2
    - regrowth,delay=500,range_check=none,if=buff.predatory_swiftness.up&player.group&health.pct<=config.predatory_swiftness_heal_group_hp_pct&lastcast.regrowth>=2

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - call_action_list,name=heal_support
    - call_action_list,name=form
    - call_action_list,name=interrupts

    - call_action_list,name=auto_heal

    # NOTE: there used to be a `return,if=auto_combat.player` here. That
    # expression does not exist (it is player.auto_combat reversed), so it
    # never evaluated true and the line was dead — which is the only reason
    # the rotation worked. "Fixing" the spelling made it live, and since
    # player.auto_combat is a config-based check that reads true in normal
    # use, it aborted main before defensives/cooldowns/finishers: nothing
    # below this point ever fired. Removed entirely rather than re-spelled.
    # Do not add it back.

    - call_action_list,name=defensives
    - call_action_list,name=predatory_swiftness

    # "auto_combat.target" doesn't exist as an expression (confirmed against
    # expression-catalog.json) — reversed/invalid, same bug class as
    # auto_combat.player found elsewhere. This gate's clear intent is a
    # target-validity guard before the DPS lines below, matching the pattern
    # Balance/Guardian use ahead of their own damage lists.
    - return,if=!target.valid|target.dead|!target.attackable

    - rake,range_check=none,if=buff.prowl.up&target.in_melee
    - return,if=buff.prowl.up

    - tigers_fury,off_gcd=true,ignore_queue=true,if=(var.bs_inc_cd_remains<=1|var.bs_inc_cd_remains>10)&(cooldown.frantic_frenzy.remains<buff.tigers_fury.duration-1.5|cooldown.frantic_frenzy.remains>22|!talent.frantic_frenzy|active_enemies=1)

    - chomp,if=buff.chomp_enabler.up

    - call_action_list,name=cooldown

    - ferocious_bite,if=buff.apex_predators_craving.up&!var.rip_preempt
    - ravage,if=buff.apex_predators_craving.up&!var.rip_preempt

    - call_action_list,name=finisher,if=active_enemies=1
    - call_action_list,name=aoe_finisher,if=active_enemies>=2
    - call_action_list,name=builder,if=active_enemies=1&combo_points<=4
    - call_action_list,name=aoe_builder,if=active_enemies>1&combo_points<=4
    - regrowth,range_check=none,if=buff.predatory_swiftness.up&var.regrowth
    - tigers_fury,off_gcd=true,ignore_queue=true