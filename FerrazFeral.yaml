version: 4.2
author: Ferraz
patch: "12.0.5"
spec: 103
name: Ferraz Feral Druid M+ (Claw)
description: |
  Ferraz Feral Druid M+ (Claw)
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CcGA8cL7tpvige+kkmGM9zUPWDAAAAAgZMzmZmZmxY2M2GbzMzMmZAAAAYJY2M8AmZUzYWMzMzsMmxMAAAAAAGYAAAA0MLz2MzMgALgZGgFGMAAAmZDD"

  # === CONFIGURAÇÕES DE COOLDOWNS ===
  burst_toggle:
    label: "Burst (Berserk + Convoke + Potion)"
    spell: 106951
    section: "Cooldowns"
    type: toggle
    description: "Toggle ON to allow Berserk, Convoke and potion. Toggle OFF to hold CDs."

  use_racials:
    label: "Auto Racials"
    section: "Cooldowns"
    type: checkbox
    default: true

  # === CONFIGURAÇÕES DE BERLOQUES E CONSUMÍVEIS ===
  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  # === CONFIGURAÇÕES DEFENSIVAS ===
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 95
    default: 55

  survival_instincts_threshold:
    label: "Survival Instincts HP %"
    section: "Defensives"
    type: slider
    min: 20
    max: 70
    default: 40

  regrowth_threshold:
    label: "Regrowth (Proc) HP %"
    section: "Defensives"
    type: slider
    min: 20
    max: 95
    default: 70

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 80
    default: 55

  # === CONFIGURAÇÕES DE DANO ===
  aoe_threshold:
    label: "Min Enemies for AoE"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 3

  # === CONFIGURAÇÕES DE MOVIMENTAÇÃO ===
  use_wild_charge:
    label: "Auto Wild Charge"
    section: "Movement"
    type: checkbox
    default: false

  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # === CONFIGURAÇÕES DE UTILITÁRIOS ===
  use_prowl:
    label: "Auto Prowl"
    section: "Utility"
    type: checkbox
    default: true

  use_shadowmeld:
    label: "Auto Shadowmeld"
    section: "Utility"
    type: checkbox
    default: true

  use_mark_of_the_wild:
    label: "Auto Mark of the Wild"
    section: "Utility"
    type: checkbox
    default: true

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # Limites de Pontos de Combo (CP)
  cp_max: combo_points>=4
  cp_full: combo_points>=5

  # Rastreamento de buffs e procs ativos
  has_apex: buff.apex_predators_craving.up
  has_sudden_ambush: buff.sudden_ambush.up
  tigers_fury_up: buff.tigers_fury.up
  berserk_up: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  ravage_up: buff.ravage.up
  predatory_swiftness_up: buff.predatory_swiftness.up

  # Rastreamento do estado dos DoTs/sangramentos
  rip_up: debuff.rip.up
  rip_refreshable: debuff.rip.refreshable|cluster.debuff.rip.lowest<4
  rake_refreshable: debuff.rake.refreshable|cluster.debuff.rake.lowest<4

  # Bandeira para Bearweave: Entra em Urso se precisar de Regeneração Frenética
  needs_bearweave_heal: health.effective.pct<config.frenzied_regen_threshold&!buff.frenzied_regeneration.up&cooldown.frenzied_regeneration.ready

  # Limite de Energia: 50+ ideal para maximizar o dano do Ferocious Bite
  energy_for_bite: energy>=50
  energy_for_tf: energy.deficit>=50

  # Condições para o Rugido Estampido com base na interface
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Sequência Defensiva: Instintos de Sobrevivência -> Pele de Árvore -> Forma de Urso com Regeneração Frenética -> Regrowth
  defensives:
    - survival_instincts,name="Survival Instincts",if=incoming.pct<config.survival_instincts_threshold
    - barkskin,name="Barkskin",if=incoming.pct<config.barkskin_threshold
    # Transição defensiva para Forma de Urso se precisar de cura (Frenzied Regen)
    - bear_form,name="Bear Form (Defensive)",if=var.needs_bearweave_heal&!buff.bear_form.up
    - heart_of_the_wild,name="Heart of the Wild",if=buff.bear_form.up&health.effective.pct<config.frenzied_regen_threshold
    - frenzied_regeneration,name="Frenzied Regen",if=buff.bear_form.up&health.effective.pct<config.frenzied_regen_threshold
    # Nota: O talento Forma Fluida (Fluid Form) retorna automaticamente para Gato ao lançar Shred
    - shred,name="Fluid Cat Return",if=buff.bear_form.up&!var.needs_bearweave_heal
    - cat_form,name="Cat Form Fallback",if=buff.bear_form.up&!var.needs_bearweave_heal
    # Regrowth lançado apenas se houver o proc instantâneo (Predatory Swiftness) e vida baixa
    - regrowth,name="Regrowth (Proc)",if=var.predatory_swiftness_up&health.effective.pct<config.regrowth_threshold

  # Cooldowns Ofensivos Principais: Tiger's Fury -> Poção -> Berserk -> Feral Frenzy -> Convoke
  cooldowns:
    - tigers_fury,name="Tiger's Fury",if=var.energy_for_tf|buff.tigers_fury.down|config.burst_toggle
    # Poção de Combate: Ativada durante o Berserk ou abertura de combate
    - combat_potion,name="Potion",if=config.burst_toggle&config.use_potion&combat_potion.ready
    - berserk,name="Berserk",if=config.burst_toggle
    # Fúria Frenética (Frantic/Feral Frenzy) pós-Berserk
    - frantic_frenzy,name="Frantic Frenzy"
    # Convocar os Espíritos (Convoke) alinhado com Berserk e Tiger's Fury
    - convoke_the_spirits,name="Convoke (Berserk)",if=config.burst_toggle

  # Cooldowns raciais ofensivos e utilitários de DPS
  racials:
    - shadowmeld,name="Shadowmeld (Post-Convoke)",if=config.use_shadowmeld&player.combat&var.berserk_up&buff.convoke_the_spirits.down&cooldown.convoke_the_spirits.remains>115&combo_points<=2&!buff.sudden_ambush.up
    - shadowmeld,name="Shadowmeld (Prowl Proc)",if=config.use_shadowmeld&player.combat&var.berserk_up&combo_points<=2&!buff.sudden_ambush.up
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=config.use_shadowmeld&player.combat&(target.threat>=3|player.aggro)&!target.boss
    - blood_fury,name="Blood Fury",if=config.burst_toggle&var.berserk_up
    - berserking,name="Berserking",if=config.burst_toggle&var.berserk_up
    - fireblood,name="Fireblood",if=config.burst_toggle&var.berserk_up
    - ancestral_call,name="Ancestral Call",if=config.burst_toggle&var.berserk_up
    - thorn_bloom,name="Thorn Bloom (AoE)",if=config.burst_toggle&var.berserk_up&active_enemies>=config.aoe_threshold

  # Interrupções, Controle de Área (CC) e Remoção de Enfurecer (Soothe)
  interrupts:
    # Alterna automaticamente para o inimigo mais próximo que esteja castando para chutar
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.8y.any
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check
    # Controles em área e remoção de enfurecer
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - mighty_bash,name="Mighty Bash",if=interrupt.cc.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Fora de combate: Garante Marca do Selvagem ativa e entra em Espreitar (Prowl)
  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - prowl,name="Prowl (OOC)",if=config.use_prowl&!buff.prowl.up&(!player.combat|buff.shadowmeld.up)

  # Abertura sob Stealth (Espreitar/Shadowmeld) — Tiger's Fury primeiro para snapshotting do Rake
  stealth_opener:
    - tigers_fury,name="TF Opener",if=(buff.prowl.up|buff.shadowmeld.up)&(energy.deficit>=50|buff.tigers_fury.down)
    - rake,name="Rake Opener",if=buff.prowl.up|buff.shadowmeld.up

  # Movimentação e Utilidades de Mobilidade
  movement:
    - wild_charge,name="Wild Charge",if=config.use_wild_charge&target.enemy&range>8&range<=25
    # Limpeza de lentidões/raízes: Transição para Urso e retorno automático para Gato via Shred
    - bear_form,name="Shapeshift Clear (Root)",if=player.rooted&!buff.bear_form.up
    - shred,name="Fluid Cat Return (Root)",if=player.rooted&buff.bear_form.up
    - prowl,name="Prowl (Movement)",if=config.use_prowl&!buff.prowl.up&!player.combat
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  # Limpeza de efeitos de movimento no grupo
  utility:
    - bear_form,name="Shapeshift Clear (Snare)",if=debuff_list.freedom.up&!buff.bear_form.up
    - shred,name="Fluid Cat Return (Snare)",if=debuff_list.freedom.up&buff.bear_form.up

  # Rotação Single Target (ST) — Procs de Apex -> Tiger's Fury -> Mordida Feroz (Bite) na fase de execução -> Manutenção de Rip -> Gasto de AP/Energy -> Rake e Shred
  st_rotation:
    # Proc de Apex Predator's Craving: Ravage ou Ferocious Bite grátis com qualquer CP
    - ravage,name="Ravage (Apex Proc) ST",if=var.has_apex&var.ravage_up
    - ferocious_bite,name="Bite (Apex Proc) ST",if=var.has_apex
    - tigers_fury,name="Tiger's Fury ST",if=var.energy_for_tf|buff.tigers_fury.down
    # Mordida Feroz na fase de execução (vida < 25%) com 50+ de Energia
    - ferocious_bite,name="Bite (Execute) ST",if=var.cp_full&var.energy_for_bite&target.health.effective.pct<25
    # Rasgar (Rip): Aplica se ausente, faz snapshot com Tiger's Fury ou atualiza com CP máximo
    - rip,name="Rip Apply ST",if=var.cp_max&!var.rip_up
    - rip,name="Rip Snapshot ST",if=var.cp_max&var.rip_refreshable&var.tigers_fury_up
    - rip,name="Rip Refresh ST",if=var.cp_full&var.rip_refreshable
    # Lança Arrasar (Ravage) com pontos de combo cheios e energia suficiente
    - ravage,name="Ravage ST",if=var.ravage_up&var.cp_max&var.energy_for_bite
    # Mordida Feroz comum: Aguarda 50+ de energia para garantir dano dobrado
    - ferocious_bite,name="Bite (Dump) ST",if=var.cp_max&var.energy_for_bite&var.rip_up
    # Estraçalhar (Rake): Lança com prioridade se sob proc de Sudden Ambush
    - rake,name="Rake (Ambush Proc) ST",if=var.has_sudden_ambush&var.rake_refreshable
    - rake,name="Rake Refresh ST",if=var.rake_refreshable
    # Despedaçar (Shred): Lança empoderado por Sudden Ambush, senão usa como filler
    - shred,name="Shred (Ambush Proc) ST",if=var.has_sudden_ambush
    - shred,name="Shred Filler ST"

  # Rotação AoE (3+) — Tiger's Fury -> Ira Primal (Primal Wrath) -> Procs de Apex -> Mordida Feroz -> Rake -> Patada (Swipe)
  aoe_rotation:
    - tigers_fury,name="Tiger's Fury AoE",if=var.energy_for_tf|buff.tigers_fury.down
    # Ira Primal (Primal Wrath): Sempre com pontos de combo cheios, ou acima de 4 CPs para renovar sangramentos
    - primal_wrath,name="Primal Wrath (Full CP)",if=var.cp_full
    - primal_wrath,name="Primal Wrath (Bleed Refresh)",if=var.cp_max&debuff.rip.refreshable
    # Procs de Apex em área
    - ravage,name="Ravage (Apex AoE)",if=var.has_apex&var.ravage_up
    - ravage,name="Ravage (AoE Finisher)",if=var.ravage_up&var.cp_max&var.energy_for_bite
    - ferocious_bite,name="Bite (Apex Proc AoE)",if=var.has_apex
    - ferocious_bite,name="Bite (Berserk Cleave)",if=var.berserk_up&var.cp_full&var.energy_for_bite
    # Espalha Rake nos alvos que estão sem o sangramento, e depois usa Patada (Swipe) como filler
    - rake,name="Rake",if=var.rake_refreshable
    - swipe,name="Swipe AoE Builder"

  # Rotação Principal (main)
  main:
    # Evita interrupção de canalizações ativos ou durante a execução de Convoke
    - return,if=player.channeling|player.casting|player.casting.remains>0|player.channeling.remains>0|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=!player.combat
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    # Abertura sob furtividade se estiver ao alcance físico
    - call_action_list,name=stealth_opener,if=target.enemy&(buff.prowl.up|buff.shadowmeld.up)&range<=8
    - return,if=!player.combat&range>8
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=racials,if=config.use_racials
    - call_action_list,name=movement,if=player.moving
    # Rotação dividida entre AoE ou Single Target de acordo com o número configurado de inimigos
    - call_action_list,name=aoe_rotation,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=st_rotation
