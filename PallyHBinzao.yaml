version: 1.4
author: Ferraz
spec: 65
name: Paladin Holy Binzão - Elite Log
description: |
  Herald of the Sun (Log Rockcandy Optimization).
  High Aggression: Light of Dawn dominance and Fast Infusion consumption.
entry: main

# ============================================================
#  CONFIGURATION
# ============================================================
config:
  lay_on_hands_threshold:
    label: "Lay on Hands HP %"
    type: slider
    min: 10
    max: 35
    default: 25
  divine_protection_threshold:
    label: "Divine Protection HP %"
    type: slider
    min: 30
    max: 60
    default: 45
  blessing_of_sacrifice_threshold:
    label: "Blessing of Sacrifice HP %"
    type: slider
    min: 20
    max: 50
    default: 35
  divine_shield_threshold:
    label: "Divine Shield HP %"
    type: slider
    min: 10
    max: 30
    default: 15
  blessing_of_protection_threshold:
    label: "BoP HP % (DPS/Heals Only)"
    type: slider
    min: 5
    max: 25
    default: 15
  avenging_wrath_members:
    label: "Avenging Wrath Members (<80%)"
    type: slider
    min: 1
    max: 5
    default: 2
  aura_mastery_members:
    label: "Aura Mastery Members (<70%)"
    type: slider
    min: 2
    max: 10
    default: 2
  divine_toll_members:
    label: "Divine Toll Members (<90%)"
    type: slider
    min: 1
    max: 10
    default: 2
  light_of_dawn_members:
    label: "Light of Dawn Min Members"
    type: slider
    min: 1
    max: 5
    default: 1
  word_of_glory_threshold:
    label: "Word of Glory HP %"
    type: slider
    min: 50
    max: 95
    default: 85
  holy_shock_healing_threshold:
    label: "Holy Shock HP %"
    type: slider
    min: 70
    max: 100
    default: 98
  flash_of_light_threshold:
    label: "Flash of Light HP %"
    type: slider
    min: 30
    max: 85
    default: 75
  holy_light_threshold:
    label: "Holy Light HP %"
    type: slider
    min: 50
    max: 98
    default: 95
  mouseover_enabled:
    label: "Enable Mouseover Healing"
    type: checkbox
    default: true
  auto_beacon_of_savior:
    label: "Auto Beacon of the Savior"
    type: checkbox
    default: true
  auto_cleanse:
    label: "Auto Cleanse Debuffs"
    type: checkbox
    default: true
  trinket_usage:
    label: "Trinket Usage (0:Off, 1:OnCD, 2:Burst, 3:Emerg)"
    type: slider
    min: 0
    max: 3
    default: 1

# ============================================================
#  VARIABLES
# ============================================================
variables:
  hp_capped: holy_power>=5
  hp_spendable: holy_power>=3|buff.divine_purpose.up
  hp_deficit_ok: holy_power.deficit>=1
  infusion_of_light: buff.infusion_of_light.up
  avenging_wrath_active: buff.avenging_wrath.up|buff.avenging_crusader.up
  beacon_of_virtue_active: buff.beacon_of_virtue.up
  
  holy_shock_ready: cooldown.holy_shock.charges>=1
  needs_member_healing: group.lowest.health.effective.pct<config.word_of_glory_threshold
  group_needs_healing: group.any(cycle.health.effective.pct<95)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly
  
  # Herald of the Sun Tracking
  dawnlight_active: buff.dawnlight.up
  sun_sear_active: buff.sun_sear.up
  suns_avatar_up: buff.suns_avatar.up

# ============================================================
#  ACTION LISTS
# ============================================================
lists:

  out_of_combat:
  
    - call_action_list,name=buffs
    - redemption,cycle=members,if=cycle.dead
    - holy_shock,cycle=members,if=cycle.health.effective.pct<98&var.holy_shock_ready

  virtue_window:
    - word_of_glory,cycle=members,if=var.hp_spendable&cycle.health.effective.pct<85
    - eternal_flame,cycle=members,if=var.hp_spendable&cycle.health.effective.pct<85
    - holy_shock,cycle=members,if=cycle.health.effective.pct<config.holy_shock_healing_threshold&var.holy_shock_ready
    - flash_of_light,cycle=members,if=var.infusion_of_light&cycle.health.effective.pct<config.flash_of_light_threshold


  buffs:
    - devotion_aura,if=buff.devotion_aura.down.any
    - beacon_of_the_savior,if=config.auto_beacon_of_savior&buff.beacon_of_the_savior.down
    - beacon_of_light,cycle=tanks,if=!talent.beacon_of_virtue.enabled&group.count(cycle.buff.beacon_of_light.up)=0
    - beacon_of_faith,cycle=dps,if=talent.beacon_of_faith.enabled&group.count(cycle.buff.beacon_of_faith.up)=0

  dispels:
    - cleanse,cycle=members,if=config.auto_cleanse&cycle.dispelable.list

  interrupts:
    - hammer_of_justice,if=interrupt.stun.target.check
    - blinding_light,if=interrupt.stun.aoe.check

  defensives:
    - divine_shield,interrupt=true,if=health.pct<config.divine_shield_threshold
    - lay_on_hands,cycle=members,if=cycle.health.effective.pct<config.lay_on_hands_threshold
    - blessing_of_protection,cycle=dps,if=cycle.health.effective.pct<config.blessing_of_protection_threshold&cycle.buff.blessing_of_protection.down
    - blessing_of_protection,cycle=healers,if=cycle.health.effective.pct<config.blessing_of_protection_threshold&cycle.buff.blessing_of_protection.down
    - divine_protection,if=health.pct<config.divine_protection_threshold
    - blessing_of_sacrifice,cycle=tanks,if=cycle.health.effective.pct<config.blessing_of_sacrifice_threshold&health.pct>40
    - fireblood,if=player.dispelable.list|health.pct<50
    - will_to_survive,if=player.stunned

  major_cooldowns:
    - avenging_wrath,if=var.group_needs_healing
    - aura_mastery,if=group.count(cycle.health.effective.pct<config.aura_mastery_members)>=2
    - divine_toll,if=var.group_needs_healing&holy_power<=2
    - beacon_of_virtue,if=var.group_needs_healing&var.hp_spendable
    - holy_prism,if=cooldown.holy_prism.ready&!var.dawnlight_active&var.hp_deficit_ok

  racials:
    - fireblood,if=var.avenging_wrath_active
    - trinket_1,if=trinket_1.ready&config.trinket_usage!=0
    - trinket_2,if=trinket_2.ready&config.trinket_usage!=0

  # ----------------------------------------------------------
  #  ROTATIONS (AGGRESSIVE LOO MODE)
  # ----------------------------------------------------------
  spenders:
    # 1. Main Spender: Dominant Light of Dawn (Always use if 1+ members injured)
    - light_of_dawn,if=var.hp_capped
    - light_of_dawn,if=var.hp_spendable&(group.count(cycle.health.effective.pct<95)>=config.light_of_dawn_members|var.dawnlight_active|var.sun_sear_active)
    
    # 2. Single Target: Backup
    - word_of_glory,cycle=members,if=var.hp_spendable&cycle.health.effective.pct<config.word_of_glory_threshold
    - eternal_flame,cycle=tanks,if=var.hp_spendable&!cycle.buff.eternal_flame.up

  generators:
    # HIGH PRIORITY: Infusion Consumables (Holy Light / Flash of Light)
    - holy_light,cycle=members,if=var.infusion_of_light&cycle.health.effective.pct<config.holy_light_threshold
    - flash_of_light,cycle=members,if=var.infusion_of_light&cycle.health.effective.pct<config.flash_of_light_threshold
    
    # CORE: Holy Shock
    - holy_shock,cycle=members,if=var.holy_shock_ready&cycle.health.effective.pct<config.holy_shock_healing_threshold
    - holy_prism,if=cooldown.holy_prism.ready&var.hp_deficit_ok
    
    # FILLERS: Dps for procs
    - judgment,if=holy_power.deficit>=1
    - hammer_of_wrath,if=target.attackable&holy_power.deficit>=1
    - flash_of_light,cycle=members,if=cycle.health.effective.pct<50

  moving:
    - holy_shock,cycle=members,if=var.holy_shock_ready&cycle.health.effective.pct<90
    - word_of_glory,cycle=members,if=var.hp_spendable&cycle.health.effective.pct<85
    - judgment,if=target.attackable&holy_power.deficit>=1
    - hammer_of_wrath,if=target.attackable

  member_healing:
    - holy_light,cycle=members,if=var.infusion_of_light&cycle.health.effective.pct<config.holy_light_threshold
    - word_of_glory,cycle=members,if=var.hp_spendable&cycle.health.effective.pct<config.word_of_glory_threshold
    - holy_shock,cycle=members,if=var.holy_shock_ready&cycle.health.effective.pct<config.holy_shock_healing_threshold

  mouseover_friendly:
    - lay_on_hands.mouseover,if=mouseover.health.effective.pct<config.lay_on_hands_threshold
    - word_of_glory.mouseover,if=mouseover.health.effective.pct<config.word_of_glory_threshold&var.hp_spendable
    - holy_shock.mouseover,if=mouseover.health.effective.pct<config.holy_shock_healing_threshold&var.holy_shock_ready

  # ----------------------------------------------------------
  #  MAIN ENTRY POINT
  # ----------------------------------------------------------
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat,if=!player.combat
    - return,if=auto_combat.player
    - return,if=player.channeling
    - call_action_list,name=defensives
    - call_action_list,name=major_cooldowns
    - call_action_list,name=auto_heal
    - call_action_list,name=dispels
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    
    - call_action_list,name=virtue_window,if=var.beacon_of_virtue_active
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=mouseover_friendly,if=config.mouseover_enabled&var.mo_friendly_valid&!player.casting
    
    - call_action_list,name=spenders
    - call_action_list,name=generators
    - call_action_list,name=member_healing,if=var.needs_member_healing
