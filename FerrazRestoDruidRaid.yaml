version: 1.1
author: Ferraz
patch: "12.0.1.6"
spec: 105
name: Restoration Druid Raid
description: |
  Restoration Druid - Keeper of the Grove for Raid.
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55


  ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  tree_of_life_threshold:
    label: "Tree of Life HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  tree_of_life_members:
    label: "Tree of Life - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     REFORESTATION & TREE FORM
  # =================================================================================================
  reforestation_emergency_hp:
    label: "Tree Proc - Emergency HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  reforestation_emergency_members:
    label: "Tree Proc - Min Members"
    type: slider
    min: 1
    max: 10
    default: 3

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 20
    default: 5

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 100
    default: 75

  # Removido o target manual para Symbiosis/Lifebloom
  # =================================================================================================
  #     HEALING TOGGLES & AUTOMATION
  # =================================================================================================
  spread_rejuvs:
    label: "Spread Rejuvs"
    type: toggle
    spell: 774
    description: "Ativa/Desativa o espalhamento automático de Rejuvenescimento"

  abundance_regrowth_stacks:
    label: "Abundance Stacks for Regrowth"
    type: slider
    min: 5
    max: 20
    default: 10

  # =================================================================================================
  #     DAMAGE & REGEN
  # =================================================================================================
  force_dps:
    label: "Force DPS (Ignore Group HP)"
    type: checkbox
    default: false

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60


  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  auto_dispel:
    label: "Auto Dispel"
    type: checkbox
    default: true

  # =================================================================================================
  #     TARGETING
  # =================================================================================================
  symbiotic_target:
    label: "Symbiosis Target"
    type: dropdown
    options:
      - label: "Manual"
        value: 1
    default: 1

  lifebloom_target:
    label: "Lifebloom Target"
    type: dropdown
    options:
      - label: "Auto Tanks"
        value: 0
      - label: "Tank 1"
        value: 1
      - label: "Tank 2"
        value: 2
    default: 0
    show_override: true
    
variables:
  is_tree_form: buff.incarnation_tree_of_life.up|buff.reforestation.up
  group_needs_healing: group.any(cycle.health.effective.pct<85)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40
  reforestation_ready: buff.reforestation.stack=3
  emergency_for_tree: group.count(cycle.health.effective.pct<config.reforestation_emergency_hp)>=config.reforestation_emergency_members

lists:
  interrupts:
    # Auto Swap to Soothe Enrage
    - target_enemy,delay=100,name="Search Enrage",if=!player.channeling&!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=!player.channeling&target.purgeable.enrage    

  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=buff.mark_of_the_wild.down.any
    
    # Lifebloom OOC Maintenance (like M+)
    - lifebloom,name="OOC LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&(cycle.buff.lifebloom.remains<=3|cycle.buff.lifebloom.stack<3)
    - lifebloom,target=tank1,name="OOC LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="OOC LB Tank 1",if=config.lifebloom_target=1&(tank1.buff.lifebloom.stack<3|tank1.buff.lifebloom.remains<=3)
    - lifebloom,target=tank2,name="OOC LB Tank 2",if=config.lifebloom_target=2&(tank2.buff.lifebloom.stack<3|tank2.buff.lifebloom.remains<=3)
    
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat
    
  defensives:
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold

  racials:
    - shadowmeld,name="Shadowmeld",if=target.threat>=3&!player.casting&!player.channeling

  cooldowns:
    - incarnation_tree_of_life,name="Tree of Life",if=talent.incarnation_tree_of_life&!var.is_tree_form&group.count(cycle.health.effective.pct<config.tree_of_life_threshold)>=config.tree_of_life_members
    - tranquility,name="Tranquility",if=!player.channeling&group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&talent.heart_of_the_wild

  trinkets:
    - trinket_1,name="Trinket 1",if=config.use_trinkets&trinket_1.ready
    - trinket_2,name="Trinket 2",if=config.use_trinkets&trinket_2.ready

  tree_of_life_rotation:
    - rejuvenation,name="Tree Rejuv Spread",cycle=members,if=group.count(cycle.buff.rejuvenation.up)<10&cycle.buff.rejuvenation.down
    - swiftmend,name="Tree Swiftmend",cycle=members,if=group.count(cycle.buff.rejuvenation.up)>=10&!buff.soul_of_the_forest.up&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)
    - rejuvenation,name="Tree Empowered Rejuv",cycle=members,if=buff.soul_of_the_forest.up&!prev_gcd.rejuvenation
    - wild_growth,name="Tree Wild Growth",if=buff.soul_of_the_forest.up&prev_gcd.rejuvenation
    - regrowth,name="Tree Regrowth Filler",cycle=members,if=buff.abundance.stack>=8&cycle.health.effective.pct<80

  active_healing:
    - swiftmend,name="Swiftmend ST",cycle=members,if=(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&(!var.reforestation_ready|var.emergency_for_tree)
    - wild_growth,name="Wild Growth AoE",if=group.count(cycle.health.effective.pct<99)>=2
    - rejuvenation,name="Sotf Rejuvenation",cycle=members,if=buff.soul_of_the_forest.up&cycle.buff.rejuvenation.down
    - lifebloom,name="LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&(cycle.buff.lifebloom.remains<=3|cycle.buff.lifebloom.stack<3)
    - lifebloom,target=tank1,name="LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1",if=config.lifebloom_target=1&(tank1.buff.lifebloom.remains<=3|tank1.buff.lifebloom.stack<3)
    - lifebloom,target=tank2,name="LB Tank 2",if=config.lifebloom_target=2&(tank2.buff.lifebloom.remains<=3|tank2.buff.lifebloom.stack<3)
    - regrowth,name="NS Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.regrowth_threshold
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&cycle.health.effective.pct<95
    - rejuvenation,name="Spread Rejuvenation",cycle=members,if=config.spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<12
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<95
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,name="Regrowth Filler",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<config.regrowth_threshold
    
  utility:
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold

  ranged_dps:
    - starsurge,name="Starsurge",if=talent.starsurge&mana.pct>20
    - wrath,name="Instant Wrath Proc",if=buff.clearcasting.up|buff.natures_grace.up|buff.expansive_growth.up
    - starfire,name="Starfire",if=target.area_enemies>=3|buff.eclipse_solar.up
    - moonfire,name="Moonfire ST",if=debuff.moonfire.refreshable
    - sunfire,name="Sunfire AoE",if=debuff.sunfire.refreshable
    - wrath,name="Wrath Mana Filler",if=mana.pct<99

  moving:
    - lifebloom,name="LB Auto Maintain (Moving)",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&(cycle.buff.lifebloom.remains<=4.5|cycle.buff.lifebloom.stack<3)
    - lifebloom,target=tank1,name="LB Auto Initial (Moving)",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1 (Moving)",if=config.lifebloom_target=1&(tank1.buff.lifebloom.remains<=4.5|tank1.buff.lifebloom.stack<3)
    - lifebloom,target=tank2,name="LB Tank 2 (Moving)",if=config.lifebloom_target=2&(tank2.buff.lifebloom.remains<=4.5|tank2.buff.lifebloom.stack<3)
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - wrath,name="Wrath (Moving Tree)",if=var.is_tree_form

  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO)",if=buff.natures_swiftness.up
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5
    - regrowth.mouseover,name="Panic Regrowth (MO)"
    
  main:
    - return,if=player.channeling|player.casting|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=trinkets
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&!player.casting&!player.channeling    
    - call_action_list,name=tree_of_life_rotation,if=var.is_tree_form
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing,if=!config.force_dps
    - call_action_list,name=ranged_dps,if=target.exists&target.alive&!target.friendly&!var.group_needs_healing&mana.pct>90
