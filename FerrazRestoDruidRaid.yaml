  # === COOLDOWN CONFIGURATIONS ===
  # Channel guard shape. Two readings of the same Simia forum advice, and this
  # switch lets you settle it in one key instead of by argument.
  #
  #   ON  (forum's wording, literally)
  #       return,if=(channeling|casting)&!var.protected_channel
  #       Returns during ANY cast or channel EXCEPT Convoke and Tranquility.
  #       The rotation keeps evaluating through those two.
  #
  #   OFF (what the file did before)
  #       return,if=(channeling|casting)
  #       Returns during every cast and channel, no exception.
  #
  # The forum reply was `return,if=player.channeling&!var.sm_channeling` with
  # sm_channeling keyed on 115175, and said to change the id. 115175 is
  # Soothing Mist — a spell a Mistweaver channels WHILE doing other things, so
  # the `!` there is an exception that keeps the rotation alive through it.
  #
  # Which way that cuts here depends on something not yet observed: whether
  # player.casting.spell_id is populated during a CHANNEL at all. In the WoW
  # API that is UnitChannelInfo, a different call from UnitCastingInfo. If the
  # field is empty mid-channel then var.protected_channel is false forever,
  # this collapses to the OFF behaviour and the switch does nothing either way.
  # If it IS populated, ON stops protecting exactly Convoke and Tranquility.
  #
  # A snapshot taken DURING a Convoke settles it: look at the PLAYER section
  # for casting.spell_id.
  forum_channel_guard:
    label: "Channel Guard - Forum Variant"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "ON: keep the rotation running through your own Convoke and Tranquility, blocking it during every other cast and channel. OFF: block during every cast and channel with no exception. If your channels get clipped, try the other setting."

