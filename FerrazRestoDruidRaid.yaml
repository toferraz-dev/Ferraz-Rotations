version: 1.2
author: Ferraz
patch: "12.0.1.6"
spec: 105
name: Restoration Druid Raid
description: |
  Restoration Druid - Keeper of the Grove for Raid.
  Optimized rotation based on Mythic raid analysis (Convoke + Tree of Life ramp cycle).
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 55

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 5

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 8

  ns_threshold:
    label: "Nature's Swiftness HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 65

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 20
    default: 3

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 75

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 80

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 80

  # =================================================================================================
  #     HEALING TOGGLES & AUTOMATION
  # =================================================================================================
  spread_rejuvs:
    label: "Spread Rejuvs"
    section: "Healing"
    type: toggle
    spell: 774
    description: "Ativa/Desativa o espalhamento automático de Rejuvenescimento"

  abundance_regrowth_stacks:
    label: "Abundance Stacks for Regrowth"
    section: "Healing"
    type: slider
    min: 5
    max: 20
    default: 8

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  # =================================================================================================
  #     TARGETING
  # =================================================================================================
  symbiotic_target:
    label: "Symbiosis Target"
    section: "Targeting"
    type: dropdown
    options:
      - label: "Manual"
        value: 1
    default: 1

  lifebloom_target:
    label: "Lifebloom Target"
    section: "Targeting"
    type: dropdown
    options:
      - label: "Auto Tanks"
        value: 0
      - label: "Tank 1"
        value: 1
      - label: "Tank 2"
        value: 2
    default: 0
    show_override: true
    
variables:
  is_tree_form: buff.incarnation_tree_of_life.up
  group_needs_healing: group.any(cycle.health.effective.pct<85)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40

lists:
  interrupts:
    # Auto Swap to Soothe Enrage
    - target_enemy,delay=100,name="Search Enrage",if=!player.channeling&!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=!player.channeling&target.purgeable.enrage    

  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=nonne,if=buff.mark_of_the_wild.down.any
    
    # Lifebloom OOC Maintenance
    - lifebloom,name="OOC LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=3
    - lifebloom,target=tank1,name="OOC LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="OOC LB Tank 1",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=3
    - lifebloom,target=tank2,name="OOC LB Tank 2",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=3
    
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat
    
  defensives:
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold

  racials:
    # Thorn Bloom (Haranir): AoE heal+damage, 3min CD — use as mini healing cooldown when raid is hurt
    - thorn_bloom,name="Thorn Bloom"#,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - shadowmeld,name="Shadowmeld",if=target.threat>=3

  cooldowns:
    # Innervate: use early for mana-heavy ramp phases
    - innervate,name="Innervate (Ramp)",if=mana.pct<config.innervate_threshold

    # Nature's Swiftness: emergency single-target save
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1

    # Convoke the Spirits: primary burst cooldown (~13% healing contribution)
    - convoke_the_spirits,name="Convoke the Spirits",if=talent.convoke_the_spirits&!player.channeling&!player.moving&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members

    # Tranquility: last resort big heal
    - tranquility,name="Tranquility",if=!player.channeling&group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving

  tree_of_life_rotation:
    # Tree of Life: prioritize Rejuv spreading, then SotF combo, then Regrowth spam
    # Step 1: Spread Rejuvs to build Abundance + Mastery stacking
    - rejuvenation,name="Tree Rejuv Spread",cycle=members,if=group.count(cycle.buff.rejuvenation.up)<10&cycle.buff.rejuvenation.down
    
    # Step 2: Swiftmend for Soul of the Forest proc
    - swiftmend,name="Tree Swiftmend SotF",cycle=members,if=!buff.soul_of_the_forest.up&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold
    
    # Step 3: SotF-empowered Wild Growth (highest priority when SotF is active)
    - wild_growth,name="Tree SotF Wild Growth",if=buff.soul_of_the_forest.up&group.count(cycle.health.effective.pct<99)>=2
    
    # Step 4: SotF-empowered Rejuv if Wild Growth not needed
    - rejuvenation,name="Tree SotF Rejuv",cycle=members,if=buff.soul_of_the_forest.up&cycle.buff.rejuvenation.down
    
    # Step 5: Regrowth spam (instant in Tree Form) - primary filler during Tree
    - regrowth,name="Tree Regrowth Spam",cycle=members,if=cycle.health.effective.pct<90
    
    # Step 6: Wild Growth on cooldown if damaged members
    - wild_growth,name="Tree Wild Growth",if=group.count(cycle.health.effective.pct<99)>=2
    
    # Step 7: Continue spreading Rejuvs as filler
    - rejuvenation,name="Tree Rejuv Filler",cycle=members,if=cycle.buff.rejuvenation.down

  active_healing:
    # Priority 1: Swiftmend for emergency + SotF proc generation (83% efficiency target)
    - swiftmend,name="Swiftmend SotF",cycle=members,if=(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold

    # Priority 2: SotF-empowered Wild Growth (core combo: Swiftmend → Wild Growth)
    - wild_growth,name="SotF Wild Growth",if=buff.soul_of_the_forest.up&group.count(cycle.health.effective.pct<99)>=2

    # Priority 3: SotF-empowered Rejuvenation (if WG not needed)
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=buff.soul_of_the_forest.up&cycle.buff.rejuvenation.down

    # Priority 4: Wild Growth on cooldown when raid is damaged (5.7% healing from Improved WG)
    - wild_growth,name="Wild Growth AoE",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members

    # Priority 5: Lifebloom maintenance (aim for 100% uptime for Clearcasting procs)
    - lifebloom,name="LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=3
    - lifebloom,target=tank1,name="LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=3
    - lifebloom,target=tank2,name="LB Tank 2",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=3

    # Priority 6: Instant Regrowth (Nature's Swiftness or Tree Form)
    - regrowth.mouseover,name="Regrowth (MO) Instant",if=var.mo_friendly_valid&(buff.natures_swiftness.up|var.is_tree_form)
    - regrowth,name="NS/Tree Regrowth",cycle=members,if=(buff.natures_swiftness.up|var.is_tree_form)&cycle.health.effective.pct<config.regrowth_threshold

    # Priority 7: Clearcasting Regrowth (free, no mana cost)
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&cycle.health.effective.pct<95

    # Priority 8: Spread Rejuvenation (builds Abundance avg ~9.6 stacks, Mastery, Power of the Archdruid)
    - rejuvenation,name="Spread Rejuvenation",cycle=members,if=config.spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<12

    # Priority 9: Abundance-powered Regrowth (at ~8+ stacks, Regrowth becomes very efficient)
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<95&!player.moving

    # Priority 10: Rejuvenation on injured targets without HoTs
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold

    # Priority 11: Regrowth as hard-cast filler when Abundance is high
    - regrowth,name="Regrowth Filler",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<config.regrowth_threshold&!player.moving
    
  utility:
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold

  ranged_dps:
    - starsurge,name="Starsurge",if=talent.starsurge&mana.pct>20
    - wrath,name="Instant Wrath Proc",if=buff.clearcasting.up|buff.natures_grace.up
    - starfire,name="Starfire",if=active_enemies>=3|buff.eclipse_solar.up
    - moonfire,name="Moonfire ST",if=debuff.moonfire.refreshable
    - sunfire,name="Sunfire AoE",if=debuff.sunfire.refreshable
    - wrath,name="Wrath Mana Filler"

  moving:
    # Convoke is usable while moving
    - convoke_the_spirits,name="Convoke (Moving)",if=talent.convoke_the_spirits&!player.channeling&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members

    - lifebloom,name="LB Auto Maintain (Moving)",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=4.5
    - lifebloom,target=tank1,name="LB Auto Initial (Moving)",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1 (Moving)",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=4.5
    - lifebloom,target=tank2,name="LB Tank 2 (Moving)",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=4.5
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - wrath,name="Wrath (Moving Tree)",if=var.is_tree_form

  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO) Instant",if=buff.natures_swiftness.up|var.is_tree_form
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5

  main:
    - return,if=player.channeling|player.casting|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=cooldowns
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&!player.casting&!player.channeling    
    - call_action_list,name=tree_of_life_rotation,if=var.is_tree_form
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing
    - call_action_list,name=ranged_dps,if=target.exists&target.alive&!target.friendly&!var.group_needs_healing&mana.pct>85
