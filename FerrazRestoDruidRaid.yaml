version: 1.1
author: Ferraz
patch: "12.0.1"
spec: 105
name: Restoration Druid Raid
description: |
  Restoration Druid - Keeper of the Grove for Raid.
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55


  ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  tree_of_life_threshold:
    label: "Tree of Life HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  tree_of_life_members:
    label: "Tree of Life - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     REFORESTATION & TREE FORM
  # =================================================================================================
  reforestation_emergency_hp:
    label: "Tree Proc - Emergency HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  reforestation_emergency_members:
    label: "Tree Proc - Min Members"
    type: slider
    min: 1
    max: 10
    default: 3

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 20
    default: 5

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 100
    default: 75

  # Removido o target manual para Symbiosis/Lifebloom
  # =================================================================================================
  #     HEALING TOGGLES & AUTOMATION
  # =================================================================================================
  spread_rejuvs:
    label: "Spread Rejuvs"
    type: toggle
    spell: 774
    description: "Ativa/Desativa o espalhamento automático de Rejuvenescimento"

  abundance_regrowth_stacks:
    label: "Abundance Stacks for Regrowth"
    type: slider
    min: 5
    max: 20
    default: 10

  # =================================================================================================
  #     DAMAGE & REGEN
  # =================================================================================================
  force_dps:
    label: "Force DPS (Ignore Group HP)"
    type: checkbox
    default: false

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60

  use_dispell:
    label: "Enable Dispell"
    type: checkbox
    default: true

  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  # =================================================================================================
  #     TARGETING
  # =================================================================================================
  symbiotic_target:
    label: "Symbiosis Target"
    type: dropdown
    options:
      - label: "Manual"
        value: 1
    default: 1

  lifebloom_target:
    label: "Lifebloom Target"
    type: dropdown
    options:
      - label: "Tank 1"
        value: 1
      - label: "Tank 2"
        value: 2
    default: 1
    show_override: true
    
variables:
  is_tree_form: buff.incarnation_tree_of_life.up|buff.reforestation.up
  group_needs_healing: group.any(cycle.health.effective.pct<85)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40
  reforestation_ready: buff.reforestation_tracker.stack=3
  emergency_for_tree: group.count(cycle.health.effective.pct<config.reforestation_emergency_hp)>=config.reforestation_emergency_members

lists:
  spell_queue:
    - queue_spell,name="Spell Queue",if=!buff.cat_form.up&!buff.bear_form.up

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby
  
  interrupts:
    # Auto Swap to Soothe Enrage
    - target_enemy,delay=100,name="Search Enrage",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage    
  
  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",if=buff.mark_of_the_wild.down
    
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    
  defensives:
    - natures_cure,name="Nature's Cure",cycle=members,if=config.use_dispell&cycle.dispelable.list&cycle.range>=0&cycle.range<=40
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.effective.pct<config.ironbark_threshold&cycle.buff.ironbark.down&cycle.range>=0&cycle.range<=40
    - barkskin,name="Barkskin",if=health.effective.pct<config.barkskin_threshold

  racials:
    - shadowmeld,name="Shadowmeld",if=target.threat>=3&!player.casting

  cooldowns:
    - incarnation_tree_of_life,name="Tree of Life",if=talent.incarnation_tree_of_life&!var.is_tree_form&group.count(cycle.health.effective.pct<config.tree_of_life_threshold)>=config.tree_of_life_members
    - tranquility,name="Tranquility",if=group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&talent.heart_of_the_wild

  trinkets:
    - trinket_1,name="Trinket 1",if=config.use_trinkets&trinket_1.ready
    - trinket_2,name="Trinket 2",if=config.use_trinkets&trinket_2.ready

  tree_of_life_rotation:
    # 1. Rejuv 10 targets (no matter health)
    - rejuvenation,name="Tree Rejuv Spread",cycle=members,if=group.count(cycle.buff.rejuvenation.up)<10&cycle.buff.rejuvenation.down&cycle.range<=40
    # 2. Swiftmend for proc buff (Soul of the Forest usually)
    - swiftmend,name="Tree Swiftmend",cycle=members,if=group.count(cycle.buff.rejuvenation.up)>=10&!buff.soul_of_the_forest.up&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range<=40
    # 3. Rejuv 1 time for empowered rejuv and 2 stacks of abundance
    - rejuvenation,name="Tree Empowered Rejuv",cycle=members,if=buff.soul_of_the_forest.up&!prev_gcd.rejuvenation&cycle.range<=40
    # 4. Wild Growth
    - wild_growth,name="Tree Wild Growth",if=buff.soul_of_the_forest.up&prev_gcd.rejuvenation
    # 5. Regrowths as needed (locked behind 8+ Abundance to save mana)
    - regrowth,name="Tree Regrowth Filler",cycle=members,if=buff.abundance.stack>=8&cycle.health.effective.pct<80&cycle.range<=40

  active_healing:
    # Lifebloom Focus Logic
    - lifebloom,target=tank1,name="LB Tank 1",if=config.lifebloom_target=1&(tank1.buff.lifebloom.remains<=4.5|tank1.buff.lifebloom.stack<3)&tank1.range<=40
    - lifebloom,target=tank2,name="LB Tank 2",if=config.lifebloom_target=2&(tank2.buff.lifebloom.remains<=4.5|tank2.buff.lifebloom.stack<3)&tank2.range<=40

    - regrowth,name="NS Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.regrowth_threshold&cycle.range>=0&cycle.range<=40
    
    # Reforestation Lock: Don't cast 4th Swiftmend unless emergency
    - swiftmend,name="Swiftmend",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range>=0&cycle.range<=40&(!var.reforestation_ready|var.emergency_for_tree)
    
    - wild_growth,name="Wild Growth",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&cycle.health.effective.pct<95&cycle.range>=0&cycle.range<=40
    
    # Abundance / Spread Rejuv Logic
    - rejuvenation,name="Spread Rejuvenation",cycle=members,if=config.spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<12&cycle.range<=40
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<95&cycle.range<=40
    
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold&cycle.range>=0&cycle.range<=40
    - regrowth,name="Regrowth Filler",cycle=members,if=buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<config.regrowth_threshold&cycle.range>=0&cycle.range<=40
    
  utility:
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold

  ranged_dps:
    - starsurge,name="Starsurge",if=talent.starsurge&mana.pct>20
    - starfire,name="Starfire",if=target.area_enemies>=3|buff.eclipse_solar.up
    - moonfire,name="Moonfire ST",if=debuff.moonfire.refreshable
    - sunfire,name="Sunfire AoE",if=debuff.sunfire.refreshable

  moving:
    - lifebloom,target=tank1,name="LB Tank 1 (Moving)",if=config.lifebloom_target=1&(tank1.buff.lifebloom.remains<=4.5|tank1.buff.lifebloom.stack<3)&tank1.range<=40
    - lifebloom,target=tank2,name="LB Tank 2 (Moving)",if=config.lifebloom_target=2&(tank2.buff.lifebloom.remains<=4.5|tank2.buff.lifebloom.stack<3)&tank2.range<=40
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold&cycle.range>=0&cycle.range<=40

  mouseover_healing_emergency:
    - natures_cure.mouseover,name="Cure (MO)",if=config.use_dispell&mouseover.dispelable.list&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Regrowth (MO)",if=buff.natures_swiftness.up&mouseover.range>=0&mouseover.range<=40
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)&mouseover.range>=0&mouseover.range<=40
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Panic Regrowth (MO)",if=mouseover.range>=0&mouseover.range<=40
    
  main:
    - return,if=player.channeling
    - return,if=buff.tranquility.up
    - return,if=buff.convoke_the_spirits.up
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - call_action_list,name=out_of_combat
    - return,if=!player.combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=trinkets
    - call_action_list,name=tree_of_life_rotation,if=var.is_tree_form
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&(mouseover.health.effective.pct<config.mouseover_emergency_hp|mouseover.dispelable.list)&!player.casting&!player.channeling
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing,if=!config.force_dps
    - call_action_list,name=ranged_dps,if=target.exists&target.alive&!target.friendly&!var.group_needs_healing&mana.pct>90
