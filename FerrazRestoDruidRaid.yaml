version: 1.2
author: Ferraz
patch: "12.0.1.6"
spec: 105
name: Ferraz Restoration Druid Raid (Grove)
description: |
  Restoration Druid - Keeper of the Grove for Raid.
  Optimized rotation based on Mythic raid analysis (Ský - Crown of the Cosmos).
  Key patterns: NS+Trinket+Convoke macro, Regrowth-dominant Tree windows, Germination spread.
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 55

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 75

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 3

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 70

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 5

  ns_threshold:
    label: "Nature's Swiftness HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 75

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 20
    default: 2

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 95

  # =================================================================================================
  #     HEALING TOGGLES & AUTOMATION
  # =================================================================================================
  spread_rejuvs:
    label: "Spread Rejuvs"
    section: "Healing"
    type: toggle
    spell: 774
    description: "Ativa/Desativa o espalhamento automático de Rejuvenescimento"

  rejuv_spread_cap:
    label: "Rejuv Spread Cap"
    section: "Healing"
    type: slider
    min: 5
    max: 20
    default: 15

  abundance_regrowth_stacks:
    label: "Abundance Stacks for Regrowth"
    section: "Healing"
    type: slider
    min: 3
    max: 20
    default: 4

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  # =================================================================================================
  #     TRINKETS & POTIONS
  # =================================================================================================
  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  # =================================================================================================
  #     TARGETING
  # =================================================================================================

  lifebloom_target:
    label: "Lifebloom Target"
    section: "Targeting"
    type: dropdown
    options:
      - label: "Auto Tanks"
        value: 0
      - label: "Tank 1"
        value: 1
      - label: "Tank 2"
        value: 2
    default: 0
    show_override: true

  heal_priority:
    label: "Heal Priority Targets"
    section: "Targeting"
    type: unit_select
    max: 20

variables:
  is_tree_form: buff.incarnation_tree_of_life.up
  group_needs_healing: group.any(cycle.health.effective.pct<95)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40
  has_heal_filter: config.heal_priority>0

lists:
  interrupts:
    # Auto Swap to Soothe Enrage
    - target_enemy,delay=100,name="Search Enrage",if=!player.channeling&!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=!player.channeling&target.purgeable.enrage

  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=buff.mark_of_the_wild.down.any

    # Lifebloom OOC Maintenance
    - lifebloom,name="OOC LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=3
    - lifebloom,target=tank1,name="OOC LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="OOC LB Tank 1",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=3
    - lifebloom,target=tank2,name="OOC LB Tank 2",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=3

    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat

  defensives:
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold

  racials:
    # Thorn Bloom (Haranir): AoE heal+damage, 3min CD — use as mini healing cooldown when raid is hurt
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - shadowmeld,name="Shadowmeld",if=target.threat>=3

  cooldowns:
    # Innervate: use early for mana-heavy ramp phases
    - innervate,name="Innervate (Ramp)",if=player.combat&mana.pct<config.innervate_threshold

    # Nature's Swiftness: emergency single-target save (standalone, when Convoke is on CD)
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1&!spell.convoke_the_spirits.ready

    # --- NS + Trinket + Convoke MACRO (log-backed: 0.0s gap) ---
    # Step 1: NS fires immediately before Convoke for Regrowth buff during channel
    - natures_swiftness,name="NS (Pre-Convoke)",if=talent.convoke_the_spirits&spell.convoke_the_spirits.ready&!player.channeling&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members
    # Step 2: Trinkets fire right before Convoke
    - trinket_1,if=config.use_trinket_1&trinket_1.ready&spell.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    - trinket_2,if=config.use_trinket_2&trinket_2.ready&spell.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    - combat_potion,if=combat_potion.ready&config.use_potion&spell.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    # Step 3: Convoke fires immediately after NS+Trinkets
    - convoke_the_spirits,global_delay=500,name="Convoke the Spirits",if=talent.convoke_the_spirits&!player.channeling&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members

    # Trinkets (standalone, when Convoke is on CD)
    - trinket_1,if=config.use_trinket_1&trinket_1.ready&!spell.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    - trinket_2,if=config.use_trinket_2&trinket_2.ready&!spell.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members

    # Tranquility: last resort big heal
    - tranquility,global_delay=500,name="Tranquility",if=!player.channeling&group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving

  tree_of_life_rotation:
    # Tree of Life (Reforestation proc, ~10s window)
    # Log-backed pattern: Regrowth spam is dominant (5-7 casts per window)

    # Step 1: Wild Growth on cooldown (highest HPS in Tree)
    - wild_growth,name="Tree Wild Growth",if=group.count(cycle.health.effective.pct<99)>=2

    # Step 2: Swiftmend for emergency + SotF proc
    - swiftmend,name="Tree Swiftmend (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold
    - swiftmend,name="Tree Swiftmend",cycle=members,if=!var.has_heal_filter&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold

    # Step 3: Regrowth spam (instant in Tree Form) — PRIMARY action (log: 5-7 casts per 10s window)
    - regrowth,name="Tree Regrowth Spam (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&cycle.health.effective.pct<95
    - regrowth,name="Tree Regrowth Spam",cycle=members,if=!var.has_heal_filter&cycle.health.effective.pct<95

    # Step 4: Rejuv spread as filler during Tree
    - rejuvenation,name="Tree Rejuv Spread (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&cycle.buff.rejuvenation.down
    - rejuvenation,name="Tree Rejuv Spread",cycle=members,if=!var.has_heal_filter&cycle.buff.rejuvenation.down

    # Step 5: Regrowth on ANY injured target (Tree makes it instant + enhanced)
    - regrowth,name="Tree Regrowth Filler (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&cycle.health.effective.pct<100&!player.moving
    - regrowth,name="Tree Regrowth Filler",cycle=members,if=!var.has_heal_filter&cycle.health.effective.pct<100&!player.moving

  active_healing:
    # Priority 1: Swiftmend for emergency heal (log: 95% on tank, pure emergency tool)
    - swiftmend,name="Swiftmend (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold
    - swiftmend,name="Swiftmend",cycle=members,if=!var.has_heal_filter&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.health.effective.pct<config.swiftmend_threshold

    # Priority 2: SotF-empowered Wild Growth (if SotF proc is active)
    - wild_growth,name="SotF Wild Growth",if=buff.soul_of_the_forest.up&group.count(cycle.health.effective.pct<99)>=2

    # Priority 3: SotF-empowered Rejuvenation (if WG not needed)
    - rejuvenation,name="SotF Rejuvenation (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&buff.soul_of_the_forest.up&cycle.buff.rejuvenation.down
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=!var.has_heal_filter&buff.soul_of_the_forest.up&cycle.buff.rejuvenation.down

    # Priority 4: Wild Growth on cooldown when raid is damaged (18.9% healing contribution)
    - wild_growth,name="Wild Growth AoE",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members

    # Priority 5: Lifebloom maintenance (log: near-perfect uptime, only 1 drop in 8.5min)
    - lifebloom,name="LB Auto Maintain",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=3
    - lifebloom,target=tank1,name="LB Auto Initial",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=3
    - lifebloom,target=tank2,name="LB Tank 2",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=3

    # Priority 6: Instant Regrowth (Nature's Swiftness or Tree Form)
    - regrowth,name="NS/Tree Regrowth (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&(buff.natures_swiftness.up|var.is_tree_form)&cycle.health.effective.pct<config.regrowth_threshold
    - regrowth,name="NS/Tree Regrowth",cycle=members,if=!var.has_heal_filter&(buff.natures_swiftness.up|var.is_tree_form)&cycle.health.effective.pct<config.regrowth_threshold

    # Priority 7: Clearcasting Regrowth (free, no mana cost)
    - regrowth,name="Clearcasting Regrowth (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&buff.clearcasting.up&cycle.health.effective.pct<95
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=!var.has_heal_filter&buff.clearcasting.up&cycle.health.effective.pct<95

    # Priority 8: Spread Rejuvenation (log: 14.5 CPM, aggressive spreading)
    - rejuvenation,name="Spread Rejuvenation (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&config.spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<config.rejuv_spread_cap
    - rejuvenation,name="Spread Rejuvenation",cycle=members,if=!var.has_heal_filter&config.spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<config.rejuv_spread_cap

    # Priority 10: Abundance-powered Regrowth (log: dominant cast at 20.4 CPM)
    - regrowth,name="Abundance Regrowth (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<95&!player.moving
    - regrowth,name="Abundance Regrowth",cycle=members,if=!var.has_heal_filter&buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<95&!player.moving

    # Priority 11: Rejuvenation on injured targets without HoTs
    - rejuvenation,name="Rejuvenation Filler (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=!var.has_heal_filter&cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold

    # Priority 12: Regrowth as hard-cast filler when Abundance is high
    - regrowth,name="Regrowth Filler (Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<config.regrowth_threshold&!player.moving
    - regrowth,name="Regrowth Filler",cycle=members,if=!var.has_heal_filter&buff.abundance.stack>=config.abundance_regrowth_stacks&cycle.health.effective.pct<config.regrowth_threshold&!player.moving

  utility:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - cat_form,name="Stay Cat (Rooted)",if=player.rooted&buff.bear_form.up

  ranged_dps:
    - moonfire,name="Moonfire ST",if=debuff.moonfire.refreshable
    - wrath,name="Wrath Filler"

  moving:
    # Convoke is usable while moving
    - natures_swiftness,name="NS (Pre-Convoke Moving)",if=talent.convoke_the_spirits&spell.convoke_the_spirits.ready&!player.channeling&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members
    - convoke_the_spirits,global_delay=500,name="Convoke (Moving)",if=talent.convoke_the_spirits&!player.channeling&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members

    - lifebloom,name="LB Auto Maintain (Moving)",cycle=tanks,if=config.lifebloom_target=0&cycle.buff.lifebloom.up&cycle.buff.lifebloom.remains<=4.5
    - lifebloom,target=tank1,name="LB Auto Initial (Moving)",if=config.lifebloom_target=0&!tank1.buff.lifebloom.up&!tank2.buff.lifebloom.up
    - lifebloom,target=tank1,name="LB Tank 1 (Moving)",if=config.lifebloom_target=1&tank1.buff.lifebloom.remains<=4.5
    - lifebloom,target=tank2,name="LB Tank 2 (Moving)",if=config.lifebloom_target=2&tank2.buff.lifebloom.remains<=4.5
    - rejuvenation,name="Rejuvenation (Moving Filtered)",cycle=config.heal_priority,if=var.has_heal_filter&cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=!var.has_heal_filter&cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.rejuvenation_threshold
    - wrath,name="Wrath (Moving Tree)",if=var.is_tree_form

  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO) Instant",if=buff.natures_swiftness.up|var.is_tree_form
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5

  main:
    - return,if=player.channeling|player.casting|player.casting.remains>0|player.channeling.remains>0|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&!player.casting&!player.channeling
    - call_action_list,name=tree_of_life_rotation,if=var.is_tree_form
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing
    - call_action_list,name=ranged_dps,if=target.exists&target.alive&!target.friendly&!var.group_needs_healing&mana.pct>95
