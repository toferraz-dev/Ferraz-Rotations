# =============================================================================
# Restoration Druid Ferraz Raid - spec 105 - patch 12.1.
# =============================================================================
#
# Lists (entry point: main):
#   engine                  interrupts              out_of_combat           defensives
#   racials                 cooldowns               active_healing          utility
#   catweave_st             catweave_aoe            catweave                ranged_dps
#   bearweave               moving                  mouseover_healing_emergency  main
#
# WHY ANY OF IT IS THE WAY IT IS: .agents/rationale/RestoDruidRaid.md
# That file carries every measurement, every rejected alternative and every
# bug this file has already been through. Read it before changing a line -
# most of what looks improvable here was tried and reverted.
# =============================================================================

version: "1.14.1"
author: Ferraz
patch: "12.1"
spec: 105
name: Restoration Druid Ferraz Raid
description: |
  Restoration Druid Ferraz Raid
entry: main

# CONFIG — thresholds below are untested defaults, tune to your team.

config:
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-27 | Patch: 12.1 | Version: 1.14.1"

  # String the talent.X checks below assume.
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CkGADBD3hSPCL9Y9gz68WcKvMMjxMLzMjZmxsNMYmNjFmBAAAAAAAAAAbDa2YMNzY4BMLzMzMDDzAAAAAAAAAAIAAgZbmlmtZ2sxYmZYmBGNDAwMDADA"

  # === DEFENSIVE CONFIGURATIONS ===
  raid_barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 65

  raid_frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 40

  raid_ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  raid_ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  # === COOLDOWN CONFIGURATIONS ===
  raid_convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 5

  raid_tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  raid_tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 5

  raid_manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: false

  # === AOE / GROUP HEALING CONFIGURATIONS ===
  raid_use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  raid_mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  # Cancels a heal mid-cast if the target got topped off by someone else.
  raid_cancel_overheal_pct:
    label: "Cancel Cast If Target HP % >="
    section: "Healing"
    type: slider
    min: 90
    max: 100
    default: 98

  raid_wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  raid_wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 5
    default: 2

  # === SINGLE TARGET (ST) HEALING CONFIGURATIONS ===
  raid_lifebloom_threshold:
    label: "Lifebloom HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 55

  raid_regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  raid_rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 95

  # === DAMAGE & CATWEAVING CONFIGURATIONS ===
  raid_catweave_group_hp:
    label: "Exit Cat - Group HP %"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 85

  raid_catweave_injured_max:
    label: "Exit Cat - Max Injured"
    section: "Damage"
    type: slider
    min: 0
    max: 5
    default: 1

  raid_aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 3

  raid_use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true

  raid_melee_dps:
    label: "Melee DPS (Cat/Bear)"
    section: "Damage"
    type: checkbox
    default: true

  raid_ranged_dps:
    label: "Ranged DPS (Sun/Moon/Wrath)"
    section: "Damage"
    type: checkbox
    default: true

  # === UTILITY CONFIGURATIONS ===
  # Season 2: flat 25% mana restore, so use early and often (guide: ~75%).
  raid_innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 75

  # === RACIAL CONFIGURATIONS ===
  raid_thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  raid_thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 5
    default: 1

  # === TRINKET & CONSUMABLE CONFIGURATIONS ===
  raid_use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  raid_use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  raid_use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  raid_use_mark_of_the_wild:
    label: "Auto Mark of the Wild"
    section: "Utility"
    type: checkbox
    default: true

  raid_force_spread:
    label: "Force HoT Spread"
    section: "Utility"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

  # Inlined from Simia's _shared.yaml instead of inherited.
  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  # Travel Form. Every suggestion the rotation makes shifts you out of it, so
  # pausing keeps the form until you drop it yourself.
  engine_pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

  engine_auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  engine_healthstone:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  engine_mana_potion:
    label: "Mana Potion Mana%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40
    description: "Healers are the one spec that actually runs dry — this line exists here and not in the DPS files."

  engine_auto_brez:
    label: "Rebirth on Mouseover"
    section: "Engine"
    type: checkbox
    default: true

  engine_auto_rez:
    label: "Revive on Mouseover (OOC)"
    section: "Engine"
    type: checkbox
    default: true

  # Nature's Cure removes MAGIC, curse and poison.
  auto_dispel_group:
    label: "Nature's Cure (Group)"
    section: "Dispels"
    type: checkbox
    default: true

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Engine"
    type: checkbox
    default: true

  # Emergency. The casting guard at the top of main returns before anything
  # else, so a hardcast used to cost you the defensive entirely.
  emergency_hp:
    label: "Emergency HP% (mid-cast)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35
    description: "Health below which defensives and consumables are allowed to fire while you are casting. The rotation normally does nothing at all mid-cast, so without this a hardcast swallows Barkskin, the healthstone and the health potion until it finishes. Set to 0 to go back to that."

  emergency_stop_casting:
    label: "Cut the Cast in an Emergency"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Below the emergency HP, end the current cast so the next global can go to a real defensive. Barkskin and the consumables above do not need this - they are off-GCD and fire without touching the cast - so this only matters for the ones that cost a global, like Bear Form into Frenzied Regeneration. Tranquility and Convoke are never cut."

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

# VARIABLES.

variables:
  # The channelled ids this spec can actually produce, confirmed against
  # client 69404:
  protected_channel: player.casting.spell_id=740|player.casting.spell_id=323764|player.casting.spell_id=391528
  group_healthy: group.count(cycle.health.effective.pct<config.raid_catweave_group_hp)<config.raid_catweave_injured_max
  can_catweave: var.group_healthy&player.combat
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  has_soul: buff.soul_of_the_forest.up

# LISTS.

lists:
  # Emergency, called from main ABOVE the casting guard. Everything here is
  # off-GCD or an item, so it fires without touching the cast; only the last
  # line ends it, and never on a protected channel.
  emergency:
    - barkskin,name="Barkskin (Emergency)",range_check=none,off_gcd=true,ignore_queue=true,if=health.effective.pct<=config.emergency_hp
    - healthstone,name="Healthstone (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,name="Health Potion (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion
    # Last, so the off-GCD options above get their chance first.
    - stop_casting,name="Cut Cast (Emergency)",if=config.emergency_stop_casting&!var.protected_channel

  # Everything spell_queue / sanity_checks / auto.
  engine:
    # `&`, not `|`. With `|` the condition is true .
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.engine_pause_travel_form&buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5

    # Nature's Cure: cycle=members (the healer form), not cycle=party.
    - natures_cure,delay=500,cycle=members,name="Nature's Cure",if=config.auto_dispel_group&cycle.dispelable.list
    - natures_cure,delay=500,cycle=members,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.engine_affix_devour&cycle.debuff.440313.up.any

    - pool_resource,resource=rage,for_next=1,if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&buff.bear_form.up&cooldown.rebirth.ready
    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revive.mouseover,name="Revive (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion
    - mana_potion,delay=250,if=mana_potion.ready&mana.pct<=config.engine_mana_potion

    # player.combat on all three: as a healer you are constantly out of combat
    # while the group is in it, and without it this fired every 200ms forever.
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

    # --- Temple of Sethraliss, Adderis and Aspix .
    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  # Soothe (enrage purge) + AoE CC assist.
  interrupts:
    # REMOVED:
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.8y.any
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    # Hovering is the only way to Soothe a mob you are not targeting — see
    # the soothe_mouseover config for why a search line is impossible.
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Mark of the Wild, plus post-combat.
  out_of_combat:
    # config.raid_use_mark_of_the_wild was defined but no line read it, so the
    # checkbox did nothing at all. Wired up here.
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=config.raid_use_mark_of_the_wild&(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    # NO Symbiotic Relationship. Removed at request.

    - lifebloom,name="OOC Lifebloom",cycle=members,if=(player.inraid|player.indungeon)&!talent.everbloom&cycle.health.effective.pct<config.raid_lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up|tank2.buff.lifebloom.up)&!player.combat
    - lifebloom,name="OOC Lifebloom (Tank)",cycle=tanks,if=(player.inraid|player.indungeon)&!talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)&!player.combat
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=(player.inraid|player.indungeon)&cycle.health.effective.pct<config.raid_rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.raid_regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat

  # Ironbark -> Barkskin -> Bear Form + Frenzied Regen.
  defensives:
    - ironbark,name="Ironbark (Tank)",cycle=tanks,if=config.raid_ironbark_target=1&cycle.health.pct<config.raid_ironbark_threshold&cycle.buff.ironbark.down
    - ironbark,name="Ironbark (Members)",cycle=members,if=config.raid_ironbark_target=2&cycle.health.pct<config.raid_ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=incoming.pct>=config.raid_barkskin_threshold
    - bear_form,name="Panic Bear",if=health.effective.pct<config.raid_frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if=health.effective.pct<config.raid_frenzied_regen_threshold&buff.bear_form.up

  # Shadowmeld aggro drop, Thorn Bloom group heal.
  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.raid_thorn_bloom_threshold)>=config.raid_thorn_bloom_members&target.in_melee

  # NS -> trinkets/potion -> Convoke (needs Abundance up, caster form) -> NS
  # Regrowth -> Tranquility -> self Swiftmend (Archdruid) -> reactive
  # Swiftmend -> Clearcasting Regrowth.
  cooldowns:
    # CONVOKE IS FORM-DEPENDENT.
    - rejuvenation,name="Shift Out For Convoke",cycle=members,if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold)>=config.raid_convoke_members&(buff.cat_form.up|buff.bear_form.up)
    - natures_swiftness,name="NS (Pre-Convoke)",range_check=none,if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold)>=config.raid_convoke_members&!buff.cat_form.up&!buff.bear_form.up&!buff.moonkin_form.up&buff.abundance.up
    - trinket_1,name="Trinket 1",if=config.raid_use_trinket_1&trinket_1.ready&buff.natures_swiftness.up
    - trinket_2,name="Trinket 2",if=config.raid_use_trinket_2&trinket_2.ready&buff.natures_swiftness.up
    - combat_potion,name="Combat Potion",if=combat_potion.ready&config.raid_use_potion&buff.natures_swiftness.up
    - convoke_the_spirits,global_delay=750,name="Convoke (Heal)",if=buff.natures_swiftness.up&!buff.cat_form.up&!buff.bear_form.up&!buff.moonkin_form.up&buff.abundance.up
    - regrowth,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up
    - tranquility,global_delay=750,name="Tranquility",if=!config.raid_manual_tranquility&group.count(cycle.health.effective.pct<config.raid_tranquility_threshold)>=config.raid_tranquility_members&!player.moving
    # Power of the Archdruid loop: Swiftmend on CD, spreads Rejuv to 3 targets.
    - swiftmend.player,name="Self Swiftmend (Archdruid)",range_check=none,if=talent.power_of_the_archdruid&player.combat&cooldown.swiftmend.ready&(buff.rejuvenation.up|buff.regrowth.up|buff.wild_growth.up)
    - swiftmend,name="Swiftmend for SotF/Treants",cycle=members,if=player.combat&cycle.health.effective.pct<config.raid_swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)
    # NO `|pred.cycle.buff.regrowth.down` branch.
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=player.combat&buff.clearcasting.up&cycle.health.effective.pct<99

  # SotF consumption -> self Efflorescence/Lifebloom(Everbloom)/Rejuvenation
  # (Photosynthesis) loop -> tank Lifebloom fallback -> forced spread ->
  # Abundance window: cheap, crit-heavy Regrowth, spent before Wild Growth.
  active_healing:
    # Self-target fallback (bare health, not cycle.*) so solo content still
    # gets reactive healing. Runs first so it's never starved.
    - rejuvenation.player,name="Emergency Self Rejuvenation",range_check=none,if=buff.rejuvenation.down&health.effective.pct<config.raid_rejuvenation_threshold
    - regrowth.player,name="Emergency Self Regrowth",range_check=none,if=health.effective.pct<config.raid_regrowth_threshold

    - wild_growth,name="SotF Wild Growth",range_check=none,if=var.has_soul&group.count(cycle.health.effective.pct<config.raid_wild_growth_threshold)>=config.raid_wild_growth_members
    - regrowth,name="SotF Regrowth",cycle=members,if=var.has_soul&cycle.health.effective.pct<config.raid_regrowth_threshold
    - rejuvenation,name="SotF Germination",cycle=members,if=var.has_soul&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=var.has_soul&cycle.buff.rejuvenation.remains<1.5

    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.raid_thorn_bloom_threshold)>=config.raid_thorn_bloom_members&target.in_melee

    # Everbloom self loop: auto-stacks to 3, cleaves 40% to 6 allies. Falls
    # through to tank Lifebloom below if untalented.
    - efflorescence,name="Efflorescence (Self)",range_check=none,if=talent.efflorescence&cooldown.efflorescence.ready
    # after=300 debounces Everbloom's own restack tick; remains<4.5 refreshes
    # before falling off so it keeps its built-up stacks.
    - lifebloom.player,name="Self Lifebloom (Everbloom)",range_check=none,after=300,if=talent.everbloom&(buff.lifebloom.down|buff.lifebloom.remains<4.5)
    - rejuvenation.player,name="Self Rejuvenation (Photosynthesis)",range_check=none,if=talent.photosynthesis&player.combat&buff.rejuvenation.down

    # Tank Lifebloom only when untalented — with Everbloom, the self line
    # above owns the single charge; fighting it over it ping-pongs forever.
    - lifebloom,name="Lifebloom",cycle=members,if=!talent.everbloom&cycle.health.effective.pct<config.raid_lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up|tank2.buff.lifebloom.up)
    - lifebloom,name="Lifebloom (Tank)",cycle=tanks,if=!talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)

    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.raid_force_spread&(buff.wild_growth.down|group.count(cycle.buff.wild_growth.down)>=1)
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.raid_force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.remains<1.5)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.raid_force_spread&talent.germination&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down&cycle.health.effective.pct<config.raid_rejuvenation_threshold

    # Abundance window: cheap/crit Regrowth, spend before Wild Growth.
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.up&cycle.health.effective.pct<config.raid_regrowth_threshold

    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.raid_wild_growth_threshold)>=config.raid_wild_growth_members
    - rejuvenation,name="Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.raid_rejuvenation_threshold
    - rejuvenation,name="Germination",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)&cycle.health.effective.pct<config.raid_rejuvenation_threshold
    - regrowth,name="Regrowth",cycle=members,if=cycle.health.effective.pct<config.raid_regrowth_threshold

  # Root cleanse (Bear/Cat shift), Innervate.
  utility:
    - bear_form,name="Shapeshift Clear",if=player.rooted&!buff.bear_form.up&!player.stunned
    - cat_form,name="Shapeshift Toggle",if=player.rooted&buff.bear_form.up&!player.stunned
    # innervate.player, not bare innervate. Without.
    - innervate.player,name="Innervate",off_gcd=true,ignore_queue=true,range_check=none,if=mana.pct<config.raid_innervate_threshold

  # Cat Form single-target DPS.
  catweave_st:
    - heart_of_the_wild,name="HotW Cat ST",if=config.raid_use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite ST",if=combo_points>=5
    - rake,name="Rake ST",if=debuff.rake.refreshable
    - shred,name="Shred ST"

  # Cat Form AoE DPS.
  catweave_aoe:
    - heart_of_the_wild,name="HotW Cat AoE",if=config.raid_use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite AoE",if=combo_points>=5
    - rake,name="Rake AoE",if=debuff.rake.refreshable
    - swipe,name="Swipe AoE",if=talent.swipe
    - shred,name="Shred AoE",if=!talent.swipe

  # Entry into physical DPS (Fluid Form auto-shift or manual), then hands off
  # to catweave_st/catweave_aoe.
  catweave:
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<4&(buff.cat_form.up|talent.fluid_form)&(!target.in_melee|!var.group_healthy)
    - rake,name="Fluid Rake",if=talent.fluid_form&!buff.cat_form.up&debuff.rake.refreshable
    - shred,name="Fluid Shred",if=talent.fluid_form&!buff.cat_form.up
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up
    - return,if=!buff.cat_form.up
    - call_action_list,name=catweave_aoe,if=enemies.combat.8y>=config.raid_aoe_threshold
    - call_action_list,name=catweave_st,if=enemies.combat.8y<config.raid_aoe_threshold

  # Ranged DoT maintenance in caster form while group is healthy.
  ranged_dps:
    - starsurge,name="Starsurge",if=buff.moonkin_form.up
    - sunfire,name="Sunfire Aoe Dot",if=debuff.sunfire.refreshable
    - moonfire,name="Moonfire ST Refresh",if=debuff.moonfire.refreshable
    - starfire,name="Starfire AoE",if=enemies.combat.40y>=3
    - wrath,name="Wrath"

  # Bear Form bleed maintenance before handing off to catweave.
  bearweave:
    - thrash,name="Thrash (BearmForm Bleed)",if=debuff.thrash.remains<3&talent.fluid_form
    - mangle,name="Mangle (BearForm)",if=talent.fluid_form
    - call_action_list,name=catweave

  # Convoke if ready and safe, otherwise instant HoTs only.
  moving:
    - natures_swiftness,name="NS (Pre-Convoke Moving)",if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold)>=config.raid_convoke_members&!buff.cat_form.up&!buff.bear_form.up&!buff.moonkin_form.up&buff.abundance.up
    - convoke_the_spirits,global_delay=750,name="Convoke (Moving)",if=group.count(cycle.health.effective.pct<config.raid_convoke_threshold)>=config.raid_convoke_members&!buff.cat_form.up&!buff.bear_form.up&!buff.moonkin_form.up&buff.abundance.up
    - lifebloom.player,name="Self Lifebloom (Moving)",range_check=none,after=300,if=talent.everbloom&(buff.lifebloom.down|buff.lifebloom.remains<4.5)
    - lifebloom,name="Lifebloom (Moving)",cycle=members,if=!talent.everbloom&cycle.health.effective.pct<config.raid_lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up|tank2.buff.lifebloom.up)
    - lifebloom,name="Lifebloom Tank (Moving)",cycle=tanks,if=!talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)
    # config.raid_rejuvenation_threshold, not a literal 95.
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.raid_rejuvenation_threshold

  # Unit-frame mouseover heals, HP-gated from main. No mouseover.buff.*
  # expression exists, so usability is left to the engine's own check.
  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO) Instant",if=buff.natures_swiftness.up
    - swiftmend.mouseover,name="Swiftmend (MO)"
    - rejuvenation.mouseover,name="Rejuvenation (MO)"
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving

  # Entry point. First matching line wins the GCD: defensives -> cooldowns ->
  # emergency -> active healing outrank DPS weaving.
  main:
    # `player.channeling`, bare. This is what every.
    # Emergency FIRST, above the casting guard below. Only reachable while you
    # are actually casting and actually low, so it costs nothing otherwise.
    - call_action_list,name=emergency,if=player.combat&(player.casting|player.channeling)&health.effective.pct<=config.emergency_hp

    - return,if=player.channeling|player.casting|var.protected_channel

    # --- Engine plumbing. Must stay at the top. ---
    - call_action_list,name=engine
    - call_action_list,name=out_of_combat

    # NOTE: a `return,if=!player.auto_combat` used .

    # Cancels a heal mid-cast if the target got topped off by another source.
    - stop_casting,name="Cancel Overheal",casting_check=any,if=casting_target.health.pct>=config.raid_cancel_overheal_pct

    # --- Survival, then utility, then the healing cooldown window ---
    - call_action_list,name=interrupts
    - call_action_list,name=defensives
    - call_action_list,name=racials
    - call_action_list,name=utility
    - call_action_list,name=cooldowns

    - call_action_list,name=mouseover_healing_emergency,if=config.raid_use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.raid_mouseover_emergency_hp
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing

    # --- DPS weaving. Only while the group is topped and healthy. ---
    - call_action_list,name=ranged_dps,if=config.raid_ranged_dps&var.can_catweave&target.exists&target.alive&!target.friendly&((config.raid_melee_dps&!target.in_melee)|!config.raid_melee_dps)
    - call_action_list,name=bearweave,if=config.raid_melee_dps&var.can_catweave&target.exists&target.alive&!target.friendly&target.in_melee&enemies.combat.8y>=2
    - call_action_list,name=catweave,if=config.raid_melee_dps&var.can_catweave&target.exists&target.alive&!target.friendly&target.in_melee
