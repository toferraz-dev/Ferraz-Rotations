version: 1.0
author: Ferraz
patch: "12.0.1"
spec: 105
name: Restoration Druid Raid (Testing)
description: |
  Restoration Druid - Keeper of the Grove for Raid.
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55


  ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  tree_of_life_threshold:
    label: "Tree of Life HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  tree_of_life_members:
    label: "Tree of Life - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 20
    default: 5

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 100
    default: 75

  # Removido o target manual para Symbiosis/Lifebloom
  # =================================================================================================
  #     DAMAGE & CATWEAVING
  # =================================================================================================
  catweave_group_hp:
    label: "Enter Cat - Group HP %"
    type: slider
    min: 25
    max: 99
    default: 90

  catweave_injured_max:
    label: "Exit Cat - Max Injured"
    type: slider
    min: 0
    max: 20
    default: 3

  aoe_threshold:
    label: "AoE - Min Enemies"
    type: slider
    min: 2
    max: 5
    default: 3

  force_dps:
    label: "Force DPS (Ignore Group HP)"
    type: checkbox
    default: false

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60

  use_dispell:
    label: "Enable Dispell"
    type: checkbox
    default: true

  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  # =================================================================================================
  #     TARGETING
  # =================================================================================================
  symbiotic_unit_select:
    label: "Symbiotic Target (Raid Member)"
    type: unit_select
    role_filter: tanks # Allows picking any member
    max_selections: 1

variables:
  group_healthy: group.count(cycle.health.pct<config.catweave_group_hp)<config.catweave_injured_max
  can_catweave: (var.group_healthy|config.force_dps)
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40

lists:
  spell_queue:
    - queue_spell,if=!buff.cat_form.up&!buff.bear_form.up

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby
  
  interrupts:
    - soothe,if=target.purgeable.enrage    
  
  out_of_combat:
    - mark_of_the_wild,if=buff.mark_of_the_wild.down
    - symbiotic_relationship,cycle=config.symbiotic_unit_select,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up&cycle.range<=40&!player.casting
    - rejuvenation,cycle=members,if=cycle.health.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    - regrowth,cycle=members,if=cycle.health.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    
  defensives:
    - natures_cure,cycle=members,if=config.use_dispell&cycle.dispelable.list&cycle.range>=0&cycle.range<=40
    - ironbark,cycle=members,if=cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down&cycle.range>=0&cycle.range<=40
    - barkskin,if=health.pct<config.barkskin_threshold

  racials:
    - shadowmeld,if=target.threat>=3&!player.casting

  cooldowns:
    - incarnation_tree_of_life,if=talent.incarnation_tree_of_life&!buff.incarnation_tree_of_life.up&group.count(cycle.health.pct<config.tree_of_life_threshold)>=config.tree_of_life_members
    - tranquility,if=group.count(cycle.health.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    - natures_swiftness,if=group.count(cycle.health.pct<config.ns_threshold)>=1
    - heart_of_the_wild,if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up

  trinkets:
    - trinket_1,if=config.use_trinkets&trinket_1.ready
    - trinket_2,if=config.use_trinkets&trinket_2.ready
    
  active_healing:
    - lifebloom,cycle=tanks,if=(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=4.5)&cycle.range>=0&cycle.range<=40
    - regrowth,cycle=members,if=buff.natures_swiftness.up&cycle.health.pct<config.regrowth_threshold&cycle.range>=0&cycle.range<=40
    - swiftmend,cycle=members,if=cycle.health.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range>=0&cycle.range<=40
    - wild_growth,if=group.count(cycle.health.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - regrowth,cycle=members,if=buff.clearcasting.up&cycle.health.pct<95&cycle.range>=0&cycle.range<=40
    - rejuvenation,cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.pct<config.rejuvenation_threshold&cycle.range>=0&cycle.range<=40&!var.can_catweave    
    - regrowth,cycle=members,if=cycle.health.pct<config.regrowth_threshold&cycle.range>=0&cycle.range<=40&!var.can_catweave
    
  utility:
    - rebirth.mouseover,if=mouseover.exists&mouseover.dead&mouseover.friendly&mouseover.range<=40
    - innervate,if=mana.pct<config.innervate_threshold

  catweave_st:
    - rip,if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,if=combo_points>=5&target.range<=8
    - rake,if=debuff.rake.refreshable&target.range<=8
    - shred,if=target.range<=8

  catweave_aoe:
    - target_enemy,if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,if=combo_points>=5&target.range<=8
    - rake,if=debuff.rake.refreshable&target.range<=8
    - shred,if=target.range<=8

  catweave:
    - rejuvenation,cycle=members,if=cycle.buff.rejuvenation.remains<4&(buff.cat_form.up|talent.fluid_form)&(target.range>8|!var.group_healthy)
    - moonfire,if=debuff.moonfire.remains<2&debuff.moonfire.refreshable&!buff.cat_form.up
    - wrath,if=mana.pct>=70&!buff.cat_form.up&target.range>9
    
    # Fluid Form: we MUST cast rake or shred to shift BEFORE accessing catweave_aoe/st
    - rake,if=talent.fluid_form&!buff.cat_form.up&debuff.rake.refreshable
    - shred,if=talent.fluid_form&!buff.cat_form.up&target.range<=8
    
    # Explicit shift fallback (for AoE when Shred is bypassed or without Fluid Form)
    - cat_form,if=!buff.cat_form.up&target.range<=8
    - return,if=!buff.cat_form.up
    
    - call_action_list,name=catweave_aoe,if=enemies.combat.8y>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=enemies.combat.8y<config.aoe_threshold

  moving:
    - lifebloom,cycle=tanks,if=(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=4.5)&cycle.range>=0&cycle.range<=40
    - rejuvenation,cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.pct<config.rejuvenation_threshold&cycle.range>=0&cycle.range<=40&!var.can_catweave

  mouseover_healing_emergency:
    - natures_cure.mouseover,if=config.use_dispell&mouseover.dispelable.list&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,if=buff.natures_swiftness.up&mouseover.range>=0&mouseover.range<=40
    - swiftmend.mouseover,if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)&mouseover.range>=0&mouseover.range<=40
    - rejuvenation.mouseover,if=mouseover.buff.remains(rejuvenation)<1.5&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,if=mouseover.range>=0&mouseover.range<=40
    
  main:
    - return,if=player.channeling
    - return,if=buff.tranquility.up
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - call_action_list,name=out_of_combat
    - return,if=!player.combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=interrupts
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=trinkets
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&(mouseover.health.pct<config.mouseover_emergency_hp|mouseover.dispelable.list)&!player.casting&!player.channeling
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing,if=!config.force_dps
    - call_action_list,name=catweave,if=var.can_catweave&target.exists&target.alive&!target.friendly
