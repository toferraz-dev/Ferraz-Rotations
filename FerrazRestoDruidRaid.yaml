
version: "21.0.0"
author: Ferraz
patch: "12.1"
spec: 105
name: Restoration Druid Ferraz Raid
description: |
  Restoration Druid Ferraz Raid
entry: main

config:
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-10-21 | Patch: 12.1 | Version: 21.0.0"

  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CkGAAAAAAAAAAAAAAAAAAAAAAYMmZZmZMzMmthZwsZsNmBAAAAAAAAAALGa2MjpZGgZZmZmZYYGAAAAAGAAAAAAAwsNzSz2Mb2YMzMYGY0MAAzMAMA"

  raid_use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  raid_mouseover_emergency_hp:
    label: "MO Emergency HP % (effective)"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  raid_wild_growth_threshold:
    label: "Wild Growth HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  raid_wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 20
    default: 2

  raid_lifebloom_threshold:
    label: "Lifebloom HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_lifebloom_target:
    label: "Lifebloom Target"
    section: "Healing"
    type: dropdown
    options:
      - label: "Tank"
        value: 2
      - label: "Self"
        value: 1
    default: 1

  disable_natures_swiftness:
    label: "Disable Nature's Swiftness"
    section: "Healing"
    type: toggle
    spell: 132158
    description: "Ephemeral, hotkeyable toggle. OFF (default) = Nature's Swiftness stays on. Hit the bound key to suppress it for the rest of the session/pull; state resets to OFF (enabled) on reload."

  raid_natures_swiftness_threshold:
    label: "Nature's Swiftness HP % (effective)"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 70

  raid_regrowth_threshold:
    label: "Regrowth HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  raid_rejuvenation_threshold:
    label: "Rejuvenation HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 80

  raid_convoke_threshold:
    label: "Convoke HP % (effective)"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 4

  raid_tranquility_threshold:
    label: "Tranquility HP % (effective)"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  raid_tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 20
    default: 4

  raid_manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: false

  raid_barkskin_threshold:
    label: "Barkskin - Predicted HP % Remaining"
    section: "Defensives"
    type: slider
    min: 10
    max: 100
    default: 40
    description: "Use Barkskin when your current effective health minus the biggest predicted incoming hit (health.effective.pct-incoming.pct) would put you at or below this HP%. Example: at 90% HP with a hit predicted to take 30%, that's 60% projected."

  raid_frenzied_regen_threshold:
    label: "Frenzied Regen HP % (effective)"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 40

  raid_ironbark_threshold:
    label: "Ironbark HP % (effective)"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  raid_ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  root_cleanse:
    label: "Break Roots by Shapeshifting"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Shift form to break a root, using the real player.rooted self-state (not stun, not fear - there is no equivalent snare check). line_cd caps it at one attempt every 8 seconds."

  auto_dispel_group:
    label: "Nature's Cure (Group)"
    section: "Dispels"
    type: checkbox
    default: true

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

  raid_dps_group_hp:
    label: "DPS - Group HP % (effective)"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 70
    description: "Stop ranged DPS and go back to pure healing when this many group members (below) drop under this health."

  raid_dps_injured_max:
    label: "DPS - Max Injured"
    section: "Damage"
    type: slider
    min: 0
    max: 5
    default: 2

  raid_ranged_dps:
    label: "Ranged DPS (Sun/Moon/Wrath)"
    section: "Damage"
    type: checkbox
    default: true

  raid_innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 75

  raid_use_mark_of_the_wild:
    label: "Auto Mark of the Wild"
    section: "Utility"
    type: checkbox
    default: true

  raid_thorn_bloom_threshold:
    label: "Thorn Bloom HP % (effective)"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  raid_thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 20
    default: 3

  raid_use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: true

  raid_use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: true

  raid_use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true

  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  engine_pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

  engine_auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  engine_healthstone:
    label: "Healthstone HP% (real HP)"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP% (real HP)"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  engine_mana_potion:
    label: "Mana Potion Mana%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40
    description: "Healers are the one spec that actually runs dry — this line exists here and not in the DPS files."

  engine_auto_brez:
    label: "Rebirth on Mouseover"
    section: "Engine"
    type: checkbox
    default: true

  engine_auto_rez:
    label: "Revitalize on Mouseover (OOC)"
    section: "Engine"
    type: checkbox
    default: true

  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Engine"
    type: checkbox
    default: true

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  protected_channel: player.casting.spell_id=740|player.casting.spell_id=323764|player.casting.spell_id=391528
  group_healthy: group.count(cycle.health.effective.pct<config.raid_dps_group_hp)<config.raid_dps_injured_max
  can_dps: var.group_healthy&player.combat
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  has_soul: buff.soul_of_the_forest.up

lists:
  emergency:
    - barkskin,name="Barkskin (Emergency)",range_check=none,off_gcd=true,ignore_queue=true,if=health.effective.pct<=config.raid_barkskin_threshold
    - healthstone,name="Healthstone (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,name="Health Potion (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

  engine:
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.engine_pause_travel_form&buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5

    - natures_cure,delay=500,cycle=members,name="Nature's Cure",if=(config.auto_dispel_group&cycle.dispelable.list)&cycle.range<=40

    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revitalize,name="Revitalize (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    - mana_potion,delay=250,if=mana_potion.ready&mana.pct<=config.engine_mana_potion

    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.engine_auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  interrupts:
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.8y.any
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  out_of_combat:
    - lifebloom,cycle=members,name="OOC Self Lifebloom (Everbloom)",range_check=none,if=cycle.is_player&config.raid_lifebloom_target=1&talent.everbloom&!player.combat&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)
    - lifebloom,name="OOC Lifebloom (Tank, Everbloom)",cycle=tanks,cycle_order=health.pct,if=config.raid_lifebloom_target=2&talent.everbloom&!player.combat&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)&cycle.range<=40
    - rejuvenation,name="OOC Rejuvenation",cycle=members,cycle_order=health.pct,if=(cycle.health.effective.pct<config.raid_rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat)&cycle.range<=40
    - regrowth,name="OOC Regrowth",cycle=members,cycle_order=health.pct,if=(cycle.health.effective.pct<config.raid_regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat)&cycle.range<=40
    - call_action_list,name=abundance_maintenance

  defensives:
    - ironbark,name="Ironbark (Tank)",cycle=tanks,cycle_order=health.pct,if=(config.raid_ironbark_target=1&cycle.health.effective.pct<config.raid_ironbark_threshold&cycle.buff.ironbark.down)&cycle.range<=40
    - ironbark,name="Ironbark (Members)",cycle=members,cycle_order=health.pct,if=(config.raid_ironbark_target=2&cycle.health.effective.pct<config.raid_ironbark_threshold&cycle.buff.ironbark.down)&cycle.range<=40
    - bear_form,name="Panic Bear",if=health.effective.pct<config.raid_frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready&!buff.incarnation_tree_of_life.up
    - frenzied_regeneration,name="Frenzied Regen",if=buff.bear_form.up&health.effective.pct<config.raid_frenzied_regen_threshold

  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=target.threat>=3&!player.casting
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.raid_thorn_bloom_threshold&cycle.range<=40)>=config.raid_thorn_bloom_members

  cooldowns:
    - natures_swiftness,name="Nature Swiftness",off_gcd=true,ignore_queue=true,delay=150,range_check=none,if=!config.disable_natures_swiftness&group.count(cycle.health.effective.pct<config.raid_natures_swiftness_threshold&cycle.range<=40)>=1
    - rejuvenation,name="Shift Out For Convoke",cycle=members,cycle_order=health.pct,if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold&cycle.range<=40)>=config.raid_convoke_members&buff.bear_form.up
    - natures_swiftness,name="NS (Pre-Convoke)",range_check=none,if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold&cycle.range<=40)>=config.raid_convoke_members&!buff.bear_form.up&!buff.moonkin_form.up
    - trinket_1,name="Trinket 1",if=config.raid_use_trinket_1&trinket_1.ready&buff.natures_swiftness.up
    - trinket_2,name="Trinket 2",if=config.raid_use_trinket_2&trinket_2.ready&buff.natures_swiftness.up
    - combat_potion,name="Combat Potion",if=combat_potion.ready&config.raid_use_potion&buff.natures_swiftness.up
    - convoke_the_spirits,global_delay=750,name="Convoke (Heal)",if=buff.natures_swiftness.up&!buff.bear_form.up&!buff.moonkin_form.up
    - regrowth,name="Nature Swift Regrowth",cycle=members,cycle_order=health.pct,if=(buff.natures_swiftness.up)&cycle.range<=40
    - tranquility,global_delay=750,name="Tranquility",if=!config.raid_manual_tranquility&group.count(cycle.health.effective.pct<config.raid_tranquility_threshold&cycle.range<=40)>=config.raid_tranquility_members&!player.moving
    - swiftmend,name="Swiftmend (Proactive Spread)",cycle=members,cycle_order=health.pct,if=(cooldown.swiftmend.ready&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up))&cycle.range<=40

  abundance_maintenance:
    - rejuvenation,name="Abundance Filler (Rejuv)",cycle=members,cycle_order=health.pct,if=!buff.abundance.up&cycle.buff.rejuvenation.refreshable&cycle.range<=40
    - rejuvenation,name="Abundance Filler (Germination)",cycle=members,cycle_order=health.pct,if=!buff.abundance.up&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.range<=40
    - rejuvenation,name="Abundance Filler (Rejuv Maintenance)",cycle=members,cycle_order=health.pct,if=buff.abundance.up&buff.abundance.remains<5&cycle.buff.rejuvenation.remains<5&cycle.range<=40
    - rejuvenation,name="Abundance Filler (Germination Maintenance)",cycle=members,cycle_order=health.pct,if=talent.germination&buff.abundance.up&buff.abundance.remains<5&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.remains<5&cycle.range<=40

  active_healing:
    - rejuvenation,cycle=members,name="Self Rejuvenation Maintenance",range_check=none,if=cycle.is_player&player.combat&cycle.buff.rejuvenation.remains<1.5
    - rejuvenation,cycle=members,name="Self Germination Maintenance",range_check=none,if=cycle.is_player&talent.germination&player.combat&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)

    - wild_growth,name="Wild Growth (Tree of Life Proc)",range_check=none,if=buff.incarnation_tree_of_life.up&group.count(cycle.health.effective.pct<config.raid_wild_growth_threshold&cycle.range<=40)>=1
    - regrowth,name="Regrowth (Tree of Life, Instant)",cycle=members,cycle_order=health.pct,if=(buff.incarnation_tree_of_life.up&cycle.health.effective.pct<config.raid_regrowth_threshold)&cycle.range<=40

    - regrowth,name="SotF Regrowth",cycle=members,cycle_order=health.pct,if=(var.has_soul&cycle.health.effective.pct<config.raid_regrowth_threshold)&cycle.range<=40

    - rejuvenation,name="SotF Germination",cycle=members,cycle_order=buff.rejuvenation.remains,if=(var.has_soul&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5))&cycle.range<=40
    - rejuvenation,name="SotF Rejuvenation",cycle=members,cycle_order=buff.rejuvenation.remains,if=(var.has_soul&cycle.buff.rejuvenation.remains<1.5)&cycle.range<=40

    - lifebloom,cycle=members,name="Self Lifebloom (Everbloom)",range_check=none,after=300,if=cycle.is_player&config.raid_lifebloom_target=1&talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)
    - lifebloom,name="Lifebloom (Tank, Everbloom)",cycle=tanks,cycle_order=health.pct,if=config.raid_lifebloom_target=2&talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)&cycle.range<=40

    - regrowth,name="Abundance Regrowth",cycle=members,cycle_order=health.pct,if=(buff.abundance.up&cycle.health.effective.pct<config.raid_regrowth_threshold)&cycle.range<=40

    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.raid_wild_growth_threshold&cycle.range<=40)>=config.raid_wild_growth_members
    - regrowth,name="Clearcasting Regrowth",cycle=members,cycle_order=health.pct,if=(player.combat&buff.clearcasting.up&cycle.health.effective.pct<99)&cycle.range<=40

    - rejuvenation,name="Rejuvenation",cycle=members,cycle_order=buff.rejuvenation.remains,if=(cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.raid_rejuvenation_threshold&!(buff.abundance.up&buff.abundance.remains>3))&cycle.range<=40
    - rejuvenation,name="Germination",cycle=members,cycle_order=health.pct,if=(talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)&cycle.health.effective.pct<config.raid_rejuvenation_threshold&!(buff.abundance.up&buff.abundance.remains>3))&cycle.range<=40

    - regrowth,name="Regrowth",cycle=members,cycle_order=health.pct,if=(cycle.health.effective.pct<config.raid_regrowth_threshold)&cycle.range<=40
  utility:
    - innervate,name="Innervate",off_gcd=true,ignore_queue=true,range_check=none,if=mana.pct<config.raid_innervate_threshold
  ranged_dps:
    - starsurge,name="Starsurge",if=cooldown.starsurge.ready
    - sunfire,name="Sunfire Refresh",if=talent.sunfire&debuff.sunfire.refreshable
    - moonfire,name="Moonfire Refresh",if=debuff.moonfire.refreshable
    - starfire,name="Starfire Filler"
  moving:
    - natures_swiftness,name="NS (Pre-Convoke Moving)",if=cooldown.convoke_the_spirits.ready&group.count(cycle.health.effective.pct<config.raid_convoke_threshold&cycle.range<=40)>=config.raid_convoke_members&!buff.bear_form.up&!buff.moonkin_form.up
    - convoke_the_spirits,global_delay=750,name="Convoke (Moving)",if=group.count(cycle.health.effective.pct<config.raid_convoke_threshold&cycle.range<=40)>=config.raid_convoke_members&!buff.bear_form.up&!buff.moonkin_form.up
    - lifebloom,cycle=members,name="Self Lifebloom (Everbloom, Moving)",range_check=none,if=cycle.is_player&config.raid_lifebloom_target=1&talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<4.5)
    - lifebloom,name="Lifebloom (Tank, Everbloom, Moving)",cycle=tanks,cycle_order=health.pct,if=config.raid_lifebloom_target=2&talent.everbloom&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)&cycle.range<=40
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,cycle_order=health.pct,if=(cycle.buff.rejuvenation.down&cycle.health.effective.pct<config.raid_rejuvenation_threshold&!(buff.abundance.up&buff.abundance.remains>3))&cycle.range<=40
  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO) Instant",if=buff.natures_swiftness.up
    - swiftmend.mouseover,name="Swiftmend (MO)"
    - rejuvenation.mouseover,name="Rejuvenation (MO)"
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving
  main:
    - bear_form,name="Root Cleanse (to Bear)",if=config.root_cleanse&player.rooted&!buff.bear_form.up&!buff.incarnation_tree_of_life.up
    - cancel_form,name="Root Cleanse (from Bear)",if=config.root_cleanse&player.rooted&buff.bear_form.up&!buff.incarnation_tree_of_life.up

    - call_action_list,name=emergency,if=player.combat&(player.casting|player.channeling)

    - return,if=player.channeling|player.casting|var.protected_channel

    - mark_of_the_wild,name="Mark of the Wild (low prio)",range_check=none,if=config.raid_use_mark_of_the_wild&(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=15

    - call_action_list,name=engine
    - call_action_list,name=out_of_combat

    - call_action_list,name=interrupts,if=player.combat
    - call_action_list,name=defensives,if=player.combat
    - call_action_list,name=racials,if=player.combat
    - call_action_list,name=utility,if=player.combat
    - call_action_list,name=cooldowns,if=player.combat

