version: 1.0
author: Ferraz
patch: "12.0.1"
spec: 105
name: Restoration Druid Unified (Test)
description: |
  Unified Druid Restoration rotation for Mythic+ and Raid.
  Choose your mode in the configuration.
entry: main

config:
  rotation_mode:
    label: "--- ROTATION MODE ---"
    type: dropdown
    options:
      - label: "Mythic+ (Wildstalker/Catweave)"
        value: 1 
      - label: "Raid (Keeper of the Grove)"
        value: 2 
    default: 1

  # =================================================================================================
  #     MYTHIC+ CONFIGURATION
  # =================================================================================================
  mplus_config_header:
    label: ">>>> [ MYTHIC+ ] Configuration <<<<"
    type: dropdown
    options:
      - label: "Settings focused on DPS & M+ Utility"
        value: 1
    default: 1

  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  mplus_barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  mplus_frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    type: slider
    min: 25
    max: 99
    default: 40

  mplus_ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================
  mplus_convoke_threshold:
    label: "Convoke HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  mplus_convoke_members:
    label: "Convoke - Min Members"
    type: slider
    min: 1
    max: 5
    default: 3

  mplus_tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  mplus_tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 5
    default: 3

  mplus_ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  mplus_use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mplus_mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  mplus_wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  mplus_wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 5
    default: 3

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  mplus_swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  mplus_regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  mplus_rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 99
    default: 90

  # =================================================================================================
  #     DAMAGE & CATWEAVING
  # =================================================================================================
  mplus_catweave_group_hp:
    label: "Enter Cat - Group HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  mplus_catweave_injured_max:
    label: "Exit Cat - Max Injured"
    type: slider
    min: 0
    max: 5
    default: 2

  mplus_aoe_threshold:
    label: "AoE - Min Enemies"
    type: slider
    min: 2
    max: 5
    default: 3

  mplus_force_dps:
    label: "Force DPS (Ignore Group HP)"
    type: checkbox
    default: false

  mplus_use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  mplus_innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60

  mplus_use_dispell:
    label: "Enable Dispell"
    type: checkbox
    default: true

  mplus_use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true


  # =================================================================================================
  #     RAID CONFIGURATION
  # =================================================================================================
  raid_config_header:
    label: ">>>> [ RAID ] Configuration <<<<"
    type: dropdown
    options:
      - label: "Settings focused on Group Healing & Care"
        value: 1
    default: 1

  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  raid_barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55


  raid_ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================

  raid_tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  raid_tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  raid_tree_of_life_threshold:
    label: "Tree of Life HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_tree_of_life_members:
    label: "Tree of Life - Min Members"
    type: slider
    min: 1
    max: 20
    default: 8

  raid_ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     REFORESTATION & TREE FORM
  # =================================================================================================
  raid_reforestation_emergency_hp:
    label: "Tree Proc - Emergency HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  raid_reforestation_emergency_members:
    label: "Tree Proc - Min Members"
    type: slider
    min: 1
    max: 10
    default: 3

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  raid_use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  raid_mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  raid_wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  raid_wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 20
    default: 5

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  raid_swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  raid_regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  raid_rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 100
    default: 75

  # Removido o target manual para Symbiosis/Lifebloom
  # =================================================================================================
  #     HEALING TOGGLES & AUTOMATION
  # =================================================================================================
  raid_spread_rejuvs:
    label: "Spread Rejuvenations"
    type: checkbox
    default: true

  raid_abundance_regrowth_stacks:
    label: "Abundance Stacks for Regrowth"
    type: slider
    min: 5
    max: 20
    default: 10

  # =================================================================================================
  #     DAMAGE & REGEN
  # =================================================================================================
  raid_force_dps:
    label: "Force DPS (Ignore Group HP)"
    type: checkbox
    default: false

  raid_use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  raid_innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60

  raid_use_dispell:
    label: "Enable Dispell"
    type: checkbox
    default: true

  raid_use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  # =================================================================================================
  #     TARGETING
  # =================================================================================================
  raid_symbiotic_target:
    label: "Symbiosis Target"
    type: dropdown
    options:
      - label: "Manual"
        value: 1
    default: 1

  raid_lifebloom_target:
    label: "Lifebloom Target"
    type: dropdown
    options:
      - label: "Tank 1"
        value: 1
      - label: "Tank 2"
        value: 2
    default: 1


variables:
  mplus_group_healthy: group.count(cycle.health.pct<config.mplus_catweave_group_hp)<config.mplus_catweave_injured_max
  mplus_can_catweave: (var.mplus_group_healthy|config.mplus_force_dps)&player.combat
  mplus_mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40

  raid_is_tree_form: buff.incarnation_tree_of_life.up|buff.reforestation.up
  raid_group_needs_healing: group.any(cycle.health.pct<85)
  raid_mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40
  raid_reforestation_ready: buff.reforestation_tracker.stack=3
  raid_emergency_for_tree: group.count(cycle.health.pct<config.raid_reforestation_emergency_hp)>=config.raid_reforestation_emergency_members


lists:
  mplus_spell_queue:
    - queue_spell,name="Spell Queue",if=!buff.cat_form.up&!buff.bear_form.up

  mplus_sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby
  
  mplus_interrupts:
    # Auto Swap Search
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any
    
    # AoE Interrupt
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage    
  
  mplus_out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",if=group.count(cycle.buff.mark_of_the_wild.down.any&cycle.range>=0&cycle.range<=40)>0
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up&cycle.range>=0&cycle.range<=40&!player.casting
    
    # Lifebloom OOC Maintenance
    - lifebloom,name="OOC Lifebloom Tank",cycle=tanks,if=talent.everbloom.rank>=1&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)&cycle.range>=0&cycle.range<=40
    - lifebloom,name="OOC Lifebloom Tank",cycle=tanks,if=!talent.everbloom.enabled&cycle.buff.lifebloom.down&cycle.range>=0&cycle.range<=40
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.pct<config.mplus_rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat&cycle.range>=0&cycle.range<=40
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.pct<config.mplus_regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat&cycle.range>=0&cycle.range<=40
    
    
  mplus_defensives:
    - natures_cure,name="Nature's Cure",cycle=members,if=config.mplus_use_dispell&cycle.dispelable.list&cycle.range>=0&cycle.range<=40
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.mplus_ironbark_threshold&cycle.buff.ironbark.down&cycle.range>=0&cycle.range<=40
    - barkskin,name="Barkskin",if=health.pct<config.mplus_barkskin_threshold
    - bear_form,name="Panic Bear",if=health.pct<config.mplus_frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if=health.pct<config.mplus_frenzied_regen_threshold&buff.bear_form.up

  mplus_racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting

  mplus_cooldowns:
    - convoke_the_spirits,name="Convoke (Heal)",if=group.count(cycle.health.pct<config.mplus_convoke_threshold)>=config.mplus_convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,name="Tranquility",if=group.count(cycle.health.pct<config.mplus_tranquility_threshold)>=config.mplus_tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.pct<config.mplus_ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.mplus_use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up

  mplus_trinkets:
    - trinket_1,name="Trinket 1",if=config.mplus_use_trinkets&trinket_1.ready
    - trinket_2,name="Trinket 2",if=config.mplus_use_trinkets&trinket_2.ready

  mplus_active_healing:
    # Nature's Swiftness follow-up: instant Regrowth on lowest
    - lifebloom,name="Lifebloom Tank",cycle=tanks,if=talent.everbloom.rank>=1&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)&cycle.range>=0&cycle.range<=40
    - lifebloom,name="Lifebloom Tank",cycle=tanks,if=!talent.everbloom.enabled&cycle.buff.lifebloom.down&cycle.range>=0&cycle.range<=40
    - regrowth,name="NS Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.pct<config.mplus_regrowth_threshold&cycle.range>=0&cycle.range<=40
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.pct<config.mplus_rejuvenation_threshold&cycle.range>=0&cycle.range<=40    
    - swiftmend,name="Swiftmend",cycle=members,if=cycle.health.pct<config.mplus_swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range>=0&cycle.range<=40
    - wild_growth,name="Wild Growth",if=group.count(cycle.health.pct<config.mplus_wild_growth_threshold)>=config.mplus_wild_growth_members
    - regrowth,name="Regrowth Filler",cycle=members,if=cycle.health.pct<config.mplus_regrowth_threshold&cycle.range>=0&cycle.range<=40
    
  mplus_utility:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - cat_form,name="Stay Cat (Rooted)",if=player.rooted&buff.bear_form.up
    - rebirth.mouseover,name="Rebirth (MO)",if=mouseover.exists&mouseover.dead&mouseover.friendly&mouseover.range<=40
    - innervate,name="Innervate",if=mana.pct<config.mplus_innervate_threshold

  mplus_catweave_st:
    - heart_of_the_wild,name="HotW Cat ST",if=config.mplus_use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,name="Bite ST",if=combo_points>=5&target.range<=8
    - rake,name="Rake ST",if=debuff.rake.refreshable&target.range<=8
    - shred,name="Shred ST",if=target.range<=8

  mplus_catweave_aoe:
    - heart_of_the_wild,name="HotW Cat AoE",if=config.mplus_use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,name="Bite AoE",if=combo_points>=5&target.range<=8
    - rake,name="Rake AoE",if=debuff.rake.refreshable&target.range<=8
    - swipe,name="Swipe AoE",if=target.range<=8

  mplus_catweave:
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<4&(buff.cat_form.up|talent.fluid_form)&(target.range>8|!var.mplus_group_healthy)
    - moonfire,name="Cat Moonfire",if=debuff.moonfire.remains<2&debuff.moonfire.refreshable&!buff.cat_form.up
    - wrath,name="Cat Wrath (Mana Save)",if=mana.pct>=70&!buff.cat_form.up&target.range>9
    
    # Fluid Form: we MUST cast rake or shred to shift BEFORE accessing catweave_aoe/st
    - rake,name="Fluid Rake",if=talent.fluid_form&!buff.cat_form.up&debuff.rake.refreshable
    - shred,name="Fluid Shred",if=talent.fluid_form&!buff.cat_form.up&target.range<=8
    
    # Explicit shift fallback (for AoE when Shred is bypassed or without Fluid Form)
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up&target.range<=8
    - return,if=!buff.cat_form.up
    
    - call_action_list,name=mplus_catweave_aoe,if=enemies.combat.8y>=config.mplus_aoe_threshold
    - call_action_list,name=mplus_catweave_st,if=enemies.combat.8y<config.mplus_aoe_threshold

  mplus_moving:
    - convoke_the_spirits,name="Convoke (Moving)",if=group.count(cycle.health.pct<config.mplus_convoke_threshold)>=config.mplus_convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - lifebloom,name="Lifebloom (Moving)",cycle=tanks,if=player.combat&cycle.buff.lifebloom.down&cycle.range>=0&cycle.range<=40
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.pct<95&cycle.range>=0&cycle.range<=40

  mplus_mouseover_healing_emergency:
    - natures_cure.mouseover,name="Cure (MO)",if=config.mplus_use_dispell&mouseover.dispelable.list&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Regrowth (MO)",if=buff.natures_swiftness.up&mouseover.range>=0&mouseover.range<=40
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)&mouseover.range>=0&mouseover.range<=40
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Panic Regrowth (MO)",if=mouseover.range>=0&mouseover.range<=40
    
  mplus_main:
    - return,if=player.channeling
    - return,if=buff.tranquility.up
    - return,if=buff.convoke_the_spirits.up
    - call_action_list,name=mplus_sanity_checks
    - call_action_list,name=mplus_spell_queue
    - call_action_list,name=mplus_out_of_combat
    - return,if=!player.combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=mplus_interrupts
    - call_action_list,name=mplus_racials
    - call_action_list,name=mplus_defensives
    - call_action_list,name=mplus_utility
    - call_action_list,name=mplus_cooldowns
    - call_action_list,name=mplus_trinkets
    - call_action_list,name=mplus_mouseover_healing_emergency,if=config.mplus_use_mouseover&var.mplus_mo_friendly_valid&(mouseover.health.pct<config.mplus_mouseover_emergency_hp|mouseover.dispelable.list)&!player.casting&!player.channeling
    - call_action_list,name=mplus_moving,if=player.moving
    - call_action_list,name=mplus_active_healing,if=!config.mplus_force_dps
    - call_action_list,name=mplus_catweave,if=var.mplus_can_catweave&target.exists&target.alive&!target.friendly

  raid_spell_queue:
    - queue_spell,name="Spell Queue",if=!buff.cat_form.up&!buff.bear_form.up

  raid_sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby
  
  raid_interrupts:
    # Auto Swap to Soothe Enrage
    - target_enemy,delay=100,name="Search Enrage",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage    
  
  raid_out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",if=buff.mark_of_the_wild.down
    
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.pct<config.raid_rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.pct<config.raid_regrowth_threshold&cycle.buff.rejuvenation.remains<1.5&cycle.range>=0&cycle.range<=40&!player.combat
    
  raid_defensives:
    - natures_cure,name="Nature's Cure",cycle=members,if=config.raid_use_dispell&cycle.dispelable.list&cycle.range>=0&cycle.range<=40
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.raid_ironbark_threshold&cycle.buff.ironbark.down&cycle.range>=0&cycle.range<=40
    - barkskin,name="Barkskin",if=health.pct<config.raid_barkskin_threshold

  raid_racials:
    - shadowmeld,name="Shadowmeld",if=target.threat>=3&!player.casting

  raid_cooldowns:
    - incarnation_tree_of_life,name="Tree of Life",if=talent.incarnation_tree_of_life&!var.raid_is_tree_form&group.count(cycle.health.pct<config.raid_tree_of_life_threshold)>=config.raid_tree_of_life_members
    - tranquility,name="Tranquility",if=group.count(cycle.health.pct<config.raid_tranquility_threshold)>=config.raid_tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.pct<config.raid_ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.raid_use_heart_of_the_wild&talent.heart_of_the_wild

  raid_trinkets:
    - trinket_1,name="Trinket 1",if=config.raid_use_trinkets&trinket_1.ready
    - trinket_2,name="Trinket 2",if=config.raid_use_trinkets&trinket_2.ready

  raid_tree_of_life_rotation:
    # 1. Rejuv 10 targets (no matter health)
    - rejuvenation,name="Tree Rejuv Spread",cycle=members,if=group.count(cycle.buff.rejuvenation.up)<10&cycle.buff.rejuvenation.down&cycle.range<=40
    # 2. Swiftmend for proc buff (Soul of the Forest usually)
    - swiftmend,name="Tree Swiftmend",cycle=members,if=group.count(cycle.buff.rejuvenation.up)>=10&!buff.soul_of_the_forest.up&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range<=40
    # 3. Rejuv 1 time for empowered rejuv and 2 stacks of abundance
    - rejuvenation,name="Tree Empowered Rejuv",cycle=members,if=buff.soul_of_the_forest.up&!prev_gcd.rejuvenation&cycle.range<=40
    # 4. Wild Growth
    - wild_growth,name="Tree Wild Growth",if=buff.soul_of_the_forest.up&prev_gcd.rejuvenation
    # 5. Regrowths as needed (locked behind 8+ Abundance to save mana)
    - regrowth,name="Tree Regrowth Filler",cycle=members,if=buff.abundance.stack>=8&cycle.health.pct<80&cycle.range<=40

  raid_active_healing:
    # Lifebloom Focus Logic
    - lifebloom,target=tank1,name="LB Tank 1",if=config.raid_lifebloom_target=1&(tank1.buff.lifebloom.remains<=4.5|tank1.buff.lifebloom.stack<3)&tank1.range<=40
    - lifebloom,target=tank2,name="LB Tank 2",if=config.raid_lifebloom_target=2&(tank2.buff.lifebloom.remains<=4.5|tank2.buff.lifebloom.stack<3)&tank2.range<=40

    - regrowth,name="NS Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.pct<config.raid_regrowth_threshold&cycle.range>=0&cycle.range<=40
    
    # Reforestation Lock: Don't cast 4th Swiftmend unless emergency
    - swiftmend,name="Swiftmend",cycle=members,if=cycle.health.pct<config.raid_swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)&cycle.range>=0&cycle.range<=40&(!var.raid_reforestation_ready|var.raid_emergency_for_tree)
    
    - wild_growth,name="Wild Growth",if=group.count(cycle.health.pct<config.raid_wild_growth_threshold)>=config.raid_wild_growth_members
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&cycle.health.pct<95&cycle.range>=0&cycle.range<=40
    
    # Abundance / Spread Rejuv Logic
    - rejuvenation,name="Spread Rejuvenation",cycle=members,if=config.raid_spread_rejuvs&cycle.buff.rejuvenation.down&group.count(cycle.buff.rejuvenation.up)<12&cycle.range<=40
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.stack>=config.raid_abundance_regrowth_stacks&cycle.health.pct<95&cycle.range<=40
    
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.pct<config.raid_rejuvenation_threshold&cycle.range>=0&cycle.range<=40
    - regrowth,name="Regrowth Filler",cycle=members,if=buff.abundance.stack>=config.raid_abundance_regrowth_stacks&cycle.health.pct<config.raid_regrowth_threshold&cycle.range>=0&cycle.range<=40
    
  raid_utility:
    - innervate,name="Innervate",if=mana.pct<config.raid_innervate_threshold

  raid_ranged_dps:
    - starsurge,name="Starsurge",if=talent.starsurge&mana.pct>20
    - starfire,name="Starfire",if=target.area_enemies>=3|buff.eclipse_solar.up
    - moonfire,name="Moonfire ST",if=debuff.moonfire.refreshable
    - sunfire,name="Sunfire AoE",if=debuff.sunfire.refreshable

  raid_moving:
    - lifebloom,target=tank1,name="LB Tank 1 (Moving)",if=config.raid_lifebloom_target=1&(tank1.buff.lifebloom.remains<=4.5|tank1.buff.lifebloom.stack<3)&tank1.range<=40
    - lifebloom,target=tank2,name="LB Tank 2 (Moving)",if=config.raid_lifebloom_target=2&(tank2.buff.lifebloom.remains<=4.5|tank2.buff.lifebloom.stack<3)&tank2.range<=40
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.pct<config.raid_rejuvenation_threshold&cycle.range>=0&cycle.range<=40

  raid_mouseover_healing_emergency:
    - natures_cure.mouseover,name="Cure (MO)",if=config.raid_use_dispell&mouseover.dispelable.list&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Regrowth (MO)",if=buff.natures_swiftness.up&mouseover.range>=0&mouseover.range<=40
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)&mouseover.range>=0&mouseover.range<=40
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5&mouseover.range>=0&mouseover.range<=40
    - regrowth.mouseover,name="Panic Regrowth (MO)",if=mouseover.range>=0&mouseover.range<=40
    
  raid_main:
    - return,if=player.channeling
    - return,if=buff.tranquility.up
    - return,if=buff.convoke_the_spirits.up
    - call_action_list,name=raid_sanity_checks
    - call_action_list,name=raid_spell_queue
    - call_action_list,name=raid_out_of_combat
    - return,if=!player.combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=raid_interrupts
    - call_action_list,name=raid_racials
    - call_action_list,name=raid_defensives
    - call_action_list,name=raid_utility
    - call_action_list,name=raid_cooldowns
    - call_action_list,name=raid_trinkets
    - call_action_list,name=raid_tree_of_life_rotation,if=var.raid_is_tree_form
    - call_action_list,name=raid_mouseover_healing_emergency,if=config.raid_use_mouseover&var.raid_mo_friendly_valid&(mouseover.health.pct<config.raid_mouseover_emergency_hp|mouseover.dispelable.list)&!player.casting&!player.channeling
    - call_action_list,name=raid_moving,if=player.moving
    - call_action_list,name=raid_active_healing,if=!config.raid_force_dps
    - call_action_list,name=raid_ranged_dps,if=target.exists&target.alive&!target.friendly&!var.raid_group_needs_healing&mana.pct>90

main:
  - call_action_list,name=mplus_main,if=config.rotation_mode=1
  - call_action_list,name=raid_main,if=config.rotation_mode=2
