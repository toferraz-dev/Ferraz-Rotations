version: 4.0
author: Ferraz
patch: "12.0.1"
spec: 105
name: Restoration Druid Mythic+
description: |
  Restoration Druid - Wildstalker for Mythic+.
  Talent Tree: CkGA8cL7tpvige+kkmGM9zUPWPMmxYGzMjZb4BYmZhZx2MAAAAAAAAAAYbQzmhpZGzYMLMzMzyMwAAAAAAAYMAAEAAwsN2aWMsxYGYmZB0MAAzMAA
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    type: slider
    min: 25
    max: 99
    default: 40

  ironbark_threshold:
    label: "Ironbark HP %"
    type: slider
    min: 25
    max: 99
    default: 55

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================
  convoke_threshold:
    label: "Convoke HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  convoke_members:
    label: "Convoke - Min Members"
    type: slider
    min: 1
    max: 5
    default: 3

  tranquility_threshold:
    label: "Tranquility HP %"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    type: slider
    min: 1
    max: 5
    default: 3

  ns_threshold:
    label: "Nature's Swiftness HP %"
    type: slider
    min: 25
    max: 99
    default: 45

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  wild_growth_threshold:
    label: "Wild Growth HP %"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    type: slider
    min: 1
    max: 5
    default: 2

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    type: slider
    min: 25
    max: 99
    default: 70

  regrowth_threshold:
    label: "Regrowth HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    type: slider
    min: 25
    max: 99
    default: 90

  # =================================================================================================
  #     DAMAGE & CATWEAVING
  # =================================================================================================
  catweave_group_hp:
    label: "Enter Cat - Group HP %"
    type: slider
    min: 25
    max: 99
    default: 80

  catweave_injured_max:
    label: "Exit Cat - Max Injured"
    type: slider
    min: 0
    max: 5
    default: 2

  aoe_threshold:
    label: "AoE - Min Enemies"
    type: slider
    min: 2
    max: 5
    default: 3

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    type: slider
    min: 25
    max: 99
    default: 60

  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

  auto_dispel:
    label: "Auto Dispel"
    type: checkbox
    default: true

  force_dps:
    label: "Force DPS"
    spell: 768
    type: toggle
    description: "Forcing the DPS while forgetting that it's a healer role."

  force_spread:
    label: "Force HoT Spread"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

variables:
  is_tree_form: buff.incarnation_tree_of_life.up
  group_healthy: group.count(cycle.health.effective.pct<config.catweave_group_hp)<config.catweave_injured_max
  can_catweave: (var.group_healthy|config.force_dps)&player.combat&!var.is_tree_form
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40

lists:
  spell_queue:
    - queue_spell,name="Spell Queue",if=!buff.cat_form.up&!buff.bear_form.up&!player.casting

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby
  
  interrupts:
    # Auto Swap Search
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any
    
    # AoE Interrupt
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage    

  dispel:
    - natures_cure,name="Nature's Cure",cycle=members,if=config.auto_dispel&cycle.dispelable.list&cycle.range>0&cycle.range<=40
    
  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",if=group.count(cycle.buff.mark_of_the_wild.down.any)>0
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up&!player.casting
    
    # Lifebloom OOC Maintenance
    - lifebloom,name="OOC Lifebloom Tank",cycle=tanks,if=talent.everbloom.rank>=1&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)
    - lifebloom,name="OOC Lifebloom Tank",cycle=tanks,if=!talent.everbloom.enabled&cycle.buff.lifebloom.down
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat
    
    
  defensives:
    - ironbark,name="Ironbark",cycle=members,if=cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold
    - bear_form,name="Panic Bear",if=health.pct<config.frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if=health.pct<config.frenzied_regen_threshold&buff.bear_form.up

  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting

  cooldowns:
    - convoke_the_spirits,name="Convoke (Heal)",if=group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,name="Tranquility",if=group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up

  trinkets:
    - trinket_1,name="Trinket 1",if=config.use_trinkets&trinket_1.ready
    - trinket_2,name="Trinket 2",if=config.use_trinkets&trinket_2.ready

  active_healing:
    # Nature's Swiftness follow-up: instant Regrowth on lowest
    - lifebloom,name="Lifebloom Tank",cycle=tanks,if=talent.everbloom.rank>=1&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)
    - lifebloom,name="Lifebloom Tank",cycle=tanks,if=!talent.everbloom.enabled&cycle.buff.lifebloom.down
    - regrowth,name="NS Regrowth",cycle=members,if=buff.natures_swiftness.up
    
    # Prioritize Swiftmend if group needs healing to trigger Soul of the Forest for Wild Growth
    - swiftmend,name="Swiftmend setup",cycle=members,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up)

    # Forced Ramp / Spread (Ignores HP thresholds if toggle is ON)
    - wild_growth,name="Forced Wild Growth",if=config.force_spread&(buff.wild_growth.down|group.any(cycle.buff.wild_growth.down))
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.remains<1.5)

    # Wild Growth (Buffed by 2pc Set)
    - wild_growth,name="Wild Growth",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    
    # Emergency & Single Target Filler
    - swiftmend,name="Swiftmend Emergency",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)
    - rejuvenation,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,name="Regrowth Filler",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold
    
  utility:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - cat_form,name="Stay Cat (Rooted)",if=player.rooted&buff.bear_form.up
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold

  catweave_st:
    - heart_of_the_wild,name="HotW Cat ST",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,name="Bite ST",if=combo_points>=5&target.range<=8
    - rake,name="Rake ST",if=debuff.rake.refreshable&target.range<=8
    - shred,name="Shred ST",if=target.range<=8

  catweave_aoe:
    - heart_of_the_wild,name="HotW Cat AoE",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable&target.range<=8
    - ferocious_bite,name="Bite AoE",if=combo_points>=5&target.range<=8
    - rake,name="Rake AoE",if=debuff.rake.refreshable&target.range<=8
    - swipe,name="Swipe AoE",if=target.range<=8

  catweave:
    - moonfire,name="Moonfire Ranged",if=debuff.moonfire.refreshable&!buff.cat_form.up 
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<4&(buff.cat_form.up|talent.fluid_form)&(target.range>8|!var.group_healthy)
    
    # Fluid Form: we MUST cast rake or shred to shift BEFORE accessing catweave_aoe/st
    - rake,name="Fluid Rake",if=talent.fluid_form&!buff.cat_form.up&debuff.rake.refreshable
    - shred,name="Fluid Shred",if=talent.fluid_form&!buff.cat_form.up&target.range<=8
    
    # Explicit shift fallback (for AoE when Shred is bypassed or without Fluid Form)
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up&target.range<=8
    - return,if=!buff.cat_form.up
    
    - call_action_list,name=catweave_aoe,if=enemies.combat.8y>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=enemies.combat.8y<config.aoe_threshold

  ranged_dps:
    - starsurge,name="Starsurge",if=talent.starsurge
    - sunfire,name="Sunfire Ranged",if=talent.starsurge&debuff.sunfire.refreshable
    - wrath,name="Wrath Ranged"
    
  moving:
    - convoke_the_spirits,name="Convoke (Moving)",if=group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - lifebloom,name="Lifebloom (Moving)",cycle=tanks,if=player.combat&cycle.buff.lifebloom.down
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<95

  mouseover_healing_emergency:
    - regrowth.mouseover,name="Regrowth (MO)",if=buff.natures_swiftness.up
    - swiftmend.mouseover,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)
    - rejuvenation.mouseover,name="Rejuv (MO)",if=mouseover.buff.remains(rejuvenation)<1.5
    - regrowth.mouseover,name="Panic Regrowth (MO)"
    
  main:
    - return,if=player.channeling|player.casting|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - call_action_list,name=out_of_combat
    - return,if=!player.combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=interrupts
    - call_action_list,name=dispel
    - call_action_list,name=racials
    - call_action_list,name=defensives
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=trinkets
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.pct<config.mouseover_emergency_hp&!player.casting&!player.channeling
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing,if=!config.force_dps
    - call_action_list,name=catweave,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range<=8
    - call_action_list,name=ranged_dps,if=target.exists&target.alive&!target.friendly&target.range<=40&var.is_tree_form