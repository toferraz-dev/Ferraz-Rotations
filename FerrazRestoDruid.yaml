version: 4.1
author: Ferraz
patch: "12.0.5"
spec: 105
name: Ferraz Restoration Druid M+ (Wildstalker)
description: |
  Ferraz Restoration Druid M+ (Wildstalker)
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text        # aliases: copy, copytext, copy-text
    label: "Recommended Talent String"
    text: "CkGA8cL7tpvige+kkmGM9zUPWPMmZbMjZmxsN8AMzswsYbGAAAAAAAAAAsNoZzw0MjhxsYmZmxMMGAAAAAAAMAAEAAwsNzWzyML2YmZeAMzsAaGAgZGAGA"

  # -- Defensives --
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 65

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 40

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  # -- Major Cooldowns --
  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 70

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  manual_convoke:
    label: "Manual Convoke (Auto-Off)"
    section: "Cooldowns"
    type: toggle
    spell: 391528
    default: true
    description: "Toggle to disable auto NS+Convoke."

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Toggle to disable automatic Tranquility usage."

  # -- Healing AoE & Group --
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 95

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 5
    default: 2

  # -- Healing Single Target --
  natures_swiftness_threshold:
    label: "Nature's Swiftness HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 45

  lifebloom_threshold:
    label: "Lifebloom HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 70

  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 70

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100

  # -- Damage & Catweaving --
  catweave_group_hp:
    label: "Exit Cat - Group HP %"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 85

  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 3

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true

  # -- Movement --
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # -- Utility --
  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  # -- Racials --
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 5
    default: 1

  # -- Trinkets --
  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  force_spread:
    label: "Force HoT Spread"
    section: "Utility"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # True when the group's lowest member is above the catweave HP threshold
  group_healthy: group.lowest.health.effective.pct>=config.catweave_group_hp
  # Safe to enter Cat Form for DPS (group healthy)
  can_catweave: var.group_healthy&player.combat
  # Player is currently in a DPS shapeshift form
  in_dps_form: buff.cat_form.up|buff.bear_form.up
  # Valid mouseover healing target
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  # Soul of the Forest proc is active
  has_soul: buff.soul_of_the_forest.up
  # Stampeding Roar conditions based on config
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Auto-swap to enraged/interruptible target; AoE CC; Soothe
  interrupts:
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # OOC: Mark, Symbiotic, remove DPS via Rejuv cast, pre-spread Lifebloom/Rejuv/Regrowth
  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up
    # Cast Rejuv to exit DPS Form (forces caster form)
    - rejuvenation,name="Rejuvenation - Remove DPSForm",cycle=members,if=buff.cat_form.up|buff.bear_form.up
    # Lifebloom pre-combat maintenance (Everbloom auto-stacks to 3)
    - lifebloom,name="OOC Lifebloom",cycle=members,if=cycle.health.effective.pct<config.lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up)
    - lifebloom,name="OOC Lifebloom (Tank)",cycle=tanks,if=(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<3)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5
    # Forced HoT ramp when toggle is ON (ignores HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(buff.wild_growth.down|group.any(cycle.buff.wild_growth.down))
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.remains<1.5)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down
    # Abundance Filler: Maintain at least 5 stacks of Abundance during downtime
    - rejuvenation,name="Abundance Filler (Rejuv)",cycle=members,if=buff.abundance.stack<6&cycle.buff.rejuvenation.remains<1.5
    - rejuvenation,name="Abundance Filler (Germination)",cycle=members,if=buff.abundance.stack<6&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)

  # Ironbark on tanks/members > Barkskin > Emergency Bear Form + Frenzied Regen
  defensives:
    - barkskin,name="Barkskin",if=health.effective.pct<config.barkskin_threshold
    - ironbark,name="Ironbark (Tank)",cycle=tanks,if=config.ironbark_target=1&cycle.health.effective.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - ironbark,name="Ironbark (Members)",cycle=members,if=config.ironbark_target=2&cycle.health.effective.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - bear_form,name="Panic Bear",if=health.effective.pct<config.frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if=health.effective.pct<config.frenzied_regen_threshold&buff.bear_form.up

  # Shadowmeld aggro drop; Berserking haste during emergency; AoE CC racials; Darkflight
  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting
    - berserking,name="Berserking (Haste CD)",if=buff.natures_swiftness.up
    - war_stomp,name="War Stomp (AoE CC)",if=interrupt.stun.aoe.check
    - bull_rush,name="Bull Rush (AoE CC)",if=interrupt.stun.aoe.check
    - haymaker,name="Haymaker (Interrupt/Knockback)",if=interrupt.target.check
    - darkflight,name="Darkflight (Movement)",if=player.moving&!buff.dash.up&!buff.stampeding_roar.up

  # NS > Trinkets/Potion (pre-Convoke) > Convoke > NS Regrowth > Tranquility > Swiftmend > Clearcasting
  cooldowns:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up
    - natures_swiftness,global_delay=300,name="Nature Swiftness",range_check=none,cycle=members,if=cycle.health.effective.pct<config.natures_swiftness_threshold
    - regrowth,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.natures_swiftness_threshold
    - rejuvenation,name="Reju Out Cat For Convoke",if=(!config.manual_convoke&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&(buff.cat_form.up|buff.bear_form.up)
    - trinket_1,delay=150,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&(!config.manual_convoke&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - trinket_2,delay=150,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&(!config.manual_convoke&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - combat_potion,delay=150,name="Combat Potion",if=combat_potion.ready&config.use_potion&(!config.manual_convoke&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - convoke_the_spirits,global_delay=500,name="Convoke (Heal)",if=(!config.manual_convoke&group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,global_delay=500,name="Tranquility",if=!config.manual_tranquility&group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    # Swiftmend for SotF proc (requires existing HoT on target)
    - swiftmend,name="Swiftmend for SotF/Treants",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&(cycle.buff.regrowth.down|cycle.health.effective.pct<99)

  # Active healing: SotF consumption > Lifebloom > Forced spread > Core healing
  active_healing:
    # Consume Soul of the Forest with Regrowth or Rejuvenation
    - regrowth,name="Regrowth Emergency",cycle=members,if=cycle.health.effective.pct<35
    - regrowth,name="SotF Regrowth",cycle=members,if=var.has_soul&cycle.health.effective.pct<config.regrowth_threshold
    - rejuvenation,name="SotF Germination",cycle=members,if=var.has_soul&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=var.has_soul&cycle.buff.rejuvenation.remains<1.5

    # Lifebloom maintenance (Everbloom auto-stacks to 3)
    - lifebloom,name="Lifebloom",cycle=members,if=cycle.health.effective.pct<config.lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up)
    - lifebloom,name="Lifebloom (Tank)",cycle=tanks,if=(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<3)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)

    # Forced HoT ramp when toggle is ON (ignores HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(buff.wild_growth.down|group.any(cycle.buff.wild_growth.down))
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.remains<1.5)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down

    # Core healing: Wild Growth > Rejuv > Germination > Regrowth > Thorn Bloom
    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - rejuvenation,name="Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,name="Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold)>=config.thorn_bloom_members&target.range<=8

    # Abundance Filler: Maintain at least 5 stacks of Abundance during downtime
    - rejuvenation,name="Abundance Filler (Rejuv)",cycle=members,if=buff.abundance.stack<6&cycle.buff.rejuvenation.remains<1.5
    - rejuvenation,name="Abundance Filler (Germination)",cycle=members,if=buff.abundance.stack<6&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)

  # Shapeshift to clear roots; Innervate self; Stampeding Roar
  utility:
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  # Catweave ST: Rip > Bite > Rake > Shred
  catweave_st:
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite ST",if=combo_points>=5
    - rake,name="Rake ST",if=debuff.rake.refreshable
    - shred,name="Shred ST"

  # Catweave AoE: target swap for bleed spread > Rip > Bite > Rake > Swipe/Shred
  catweave_aoe:
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite AoE",if=combo_points>=5
    - rake,name="Rake AoE",if=debuff.rake.refreshable
    - shred,name="Shred AoE"

  # Catweave entry: emergency Rejuv > Fluid Form shift > manual shift > HotW > route to ST/AoE
  catweave:
    # Refresh Rejuv on injured members before fully committing to Cat
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=(buff.bear_form.up|buff.cat_form.up)&(target.range>8|!var.group_healthy)

    # Fluid Form: cast Rake/Shred to auto-shift into Cat Form
    - rake,name="Fluid Rake",if=!buff.cat_form.up
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up
    - return,if=!buff.cat_form.up

    - heart_of_the_wild,name="HotW Cat",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - call_action_list,name=catweave_aoe,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=active_enemies<config.aoe_threshold

  # Ranged DoT maintenance while in caster form
  ranged_dps:
    - moonfire,name="Moonfire ST Refresh",if=debuff.moonfire.refreshable

  # Bearweave: Thrash/Mangle via Fluid Form, then fall into catweave
  bearweave:
    - thrash,name="Thrash (BearmForm Bleed)"
    - mangle,name="Mangle (BearForm)",if=!buff.bear_form.up&(dot.thrash.remains<=8|dot.thrash.stack<3)
    - call_action_list,name=catweave

  # Movement healing: instant-cast HoTs only
  moving:
    - lifebloom,name="Lifebloom (Moving)",cycle=members,if=cycle.health.effective.pct<config.lifebloom_threshold&cycle.buff.lifebloom.down&(group.count(cycle.buff.lifebloom.up)=0|tank1.buff.lifebloom.up)
    - lifebloom,name="Lifebloom Tank (Moving)",cycle=tanks,if=(cycle.buff.lifebloom.down|cycle.buff.lifebloom.remains<3)&(cycle.buff.lifebloom.up|group.count(cycle.buff.lifebloom.up)=0)
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination (Moving)",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.remains<1.5)&cycle.health.effective.pct<config.rejuvenation_threshold

  # Mouseover emergency: NS Regrowth > Swiftmend > Rejuv > hardcast Regrowth
  mouseover_healing_emergency:
    - swiftmend.mouseover,name="Swiftmend (MO)",if=mouseover.buff.remains(rejuvenation)>1|mouseover.buff.remains(regrowth)>1|mouseover.buff.remains(wild_growth)>1
    - rejuvenation.mouseover,name="Rejuvenation (MO)",if=mouseover.buff.remains(rejuvenation)<=1.5
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving

  auto_rez:
    - revitalize.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat
    - rebirth.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  spell_queue:
    - queue_spell, if=!player.casting|!player.channeling

  sanity_checks:
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - interact_target,delay=350,if=config.lootnearby&target.lootable&target.range<=5&!player.combat
    - interact_target,delay=350,if=config.lootnearby&loot_nearby&!player.combat
    - interact_mouseover,delay=350,if=config.lootnearby&mouseover.lootable&mouseover.range<=5&!player.combat
    - natures_cure,delay=500,cycle=members,if=cycle.dispelable.list
    - call_action_list,name=auto_rez,if=config.auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  main:
    # Skip if casting/channeling or during Tranquility/Convoke
    - return,if=player.channeling|player.casting|player.casting.remains>0|player.channeling.remains>0|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat,if=!player.combat
    - call_action_list,name=auto_target_ranged
    - call_action_list,name=auto_heal,if=!var.in_dps_form|!var.group_healthy
    - return,if=auto_combat.player
    - call_action_list,name=defensives,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=utility
    - call_action_list,name=racials
    - call_action_list,name=cooldowns,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=interrupts
    # Mouseover emergency healing on low-HP friendly unit frames
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&(!var.in_dps_form|!var.group_healthy)
    - call_action_list,name=moving,if=player.moving&(!var.in_dps_form|!var.group_healthy)
    # Active healing (skipped while in DPS form if group is healthy)
    - call_action_list,name=active_healing,if=!var.in_dps_form|!var.group_healthy
    # DPS weaving when group is healthy and target is valid in range
    - call_action_list,name=ranged_dps,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range>8
    - call_action_list,name=bearweave,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range<=8