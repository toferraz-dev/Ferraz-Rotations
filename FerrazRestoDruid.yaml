# =============================================================================
# Restoration Druid — spec 105 — patch 12.1 (Midnight) — Wildstalker, M+.
# =============================================================================
#
# Build decoded through the local SimC binary. The pieces that shape the
# priority: Everbloom 4/4, Efflorescence, LIFETREADING (Efflorescence follows
# your Lifebloom target on its own), Photosynthesis, Power of the Archdruid,
# Soul of the Forest, Germination, Abundance, Grove Guardians, Verdancy,
# Intensity, Nature's Bounty, Omen of Clarity and Overgrowth (new in 12.1:
# Nature's Swiftness makes the next Regrowth also apply Lifebloom, Rejuvenation
# and Wild Growth to that target).
# NOT talented: Cenarion Ward, Nourish, Verdant Infusion, Flourish, Incarnation:
# Tree of Life, Flash of Clarity.
#
# THE HEALING HALF IS NOT SimC-VALIDATED. SimC has no usable healing model, so
# every healing change here is guide theorycraft (method.gg Restoration Druid,
# Midnight 12.1), not measurement.
#
# THE DAMAGE HALF IS. Harness sim/ab_test_resto_dps.py, profile
# sim/Ferraz_resto_mplus.simc, 3 targets. Gear is SimC's MID1 Balance preset
# (there is no Restoration one), so absolute DPS is meaningless and only the
# deltas mean anything. The current weaving priority wins every comparison:
#
#     current (bearweave -> catweave, HotW, Convoke)   38107 DPS
#     without the Bear opener                          31964   -16.12%
#     without Heart of the Wild                        35280    -7.42%
#     without offensive Convoke                        35097    -7.90%
#     caster only, never shifting                      20278   -46.79%
#     AoE list at 2 targets instead of 3               37978    -0.34%
#     AoE list at 4 targets                            38036    noise
#
# So: the Bear opener earns its place, both cooldowns earn theirs, and the
# 3-target AoE threshold is already the right cut. Nothing in the damage half
# needed changing.
#
# Read those numbers as "which weaving shape does more damage", never as "this
# heals better" — SimC never lets the group take damage, so it never charges
# you for the globals a form swap costs.
# =============================================================================
version: 1.8
author: Ferraz
patch: "12.1"
spec: 105
name: Restoration Druid Ferraz M+
description: |
  Restoration Druid Ferraz M+
entry: main

predictions:
  8936:  { name: "Regrowth", buff: 8936 }
  48438: { name: "Wild Growth", buff: 48438 }

config:
  # ==========================================================================
  # BUILD STAMP — display only. Keep in sync with version:/patch: above.
  # ==========================================================================
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-22 | Patch: 12.1 | Version: 1.8"

  # ==========================================================================
  # RECOMMENDED BUILD — the string the talent.X gates below assume.
  # ==========================================================================
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CkGAAAAAAAAAAAAAAAAAAAAAAMMmZZMjZmxsN8AMzsMjNbzAAAAAAAAAAglBNbGmmZMDmFzMzMLzwDMDAAAAAAAGAAAAAMbzs1sNziNGzMwMLgmBAYmBgB"

  # ==========================================================================
  # HEALING — the core thresholds. Every one of these is judgement:
  #   SimC has no healing model, so none of it is measured.
  # ==========================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  # Everbloom 4/4 + Lifetreading decide this, and 1.6 flips the default to the
  # tank on three independent grounds:
  #   - Lifetreading grows Efflorescence under the Lifebloom target. In a
  #     dungeon the melee cluster stands on the tank, so that is where a
  #     ground-anchored heal is worth the most.
  #   - Everbloom cleaves 40% of Lifebloom's healing to six allies, and it
  #     cleaves FROM the holder — again, better centred on the pile.
  #   - The reference M+ log keeps Lifebloom on one partner for 101 of 111
  #     applications, never on the caster.
  # method.gg's M+ page says tank; its general page says yourself. Set to Self
  # if you are the one taking the damage.
  lifebloom_target:
    label: "Lifebloom Target"
    section: "Healing"
    type: dropdown
    options:
      - label: "Tank (puddle sits in the melee cluster)"
        value: 2
      - label: "Self"
        value: 1
    default: 2

  # Out-of-combat healing floor. The OOC lines used to run on the in-combat
  # thresholds, and rejuvenation_threshold defaults to 100 — so anyone at 99.9%
  # qualified and the rotation healed full-health people between pulls. Heal out
  # of combat only when somebody genuinely needs it.
  ooc_heal_hp_pct:
    label: "OOC Heal Below HP%"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 85
    description: "Out of combat, only heal group members under this health. Set to 100 to go back to topping everyone off."

  # Padding Abundance before a pull is real value, but the list has no natural
  # stopping point: Rejuvenation expires in ~15s, so out of combat it recasts
  # forever and drains mana while you stand still. OFF by default — turn it on
  # if you want a pre-pull ramp and are willing to pay for it.
  ooc_abundance:
    label: "Pad Abundance Out of Combat"
    section: "Healing"
    type: checkbox
    default: false
    description: "Keep casting Rejuvenation between pulls until 5 are up, so the Abundance window is ready at the pull. Costs mana while you stand around."

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 95

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 4
    default: 2

  natures_swiftness_threshold:
    label: "Nature's Swiftness HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 60

  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 80

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100

  # ==========================================================================
  # HEALING COOLDOWNS — Convoke, Tranquility and their gates.
  # ==========================================================================
  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 85

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 4
    default: 2

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 75

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 4
    default: 2

  manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Toggle to disable automatic Tranquility usage."

  # ==========================================================================
  # DEFENSIVES — personal and Ironbark.
  # ==========================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 85

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 80

  ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  # ==========================================================================
  # DISPELS — Nature's Cure removes MAGIC, curse and poison.
  # ==========================================================================
  # Nature's Cure removes MAGIC, curse and poison. It had no toggle before —
  # the line was hardcoded into sanity_checks.
  auto_dispel:
    label: "Nature's Cure (Group)"
    section: "Dispels"
    type: checkbox
    default: true

  affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Dispels"
    type: checkbox
    default: true

  # ==========================================================================
  # DAMAGE & WEAVING — the only half of this file SimC can measure.
  #   See the header for the numbers.
  # ==========================================================================
  catweave_group_hp:
    label: "Exit Cat - Group HP %"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 95

  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 3

  # The file had NO way to stop weaving. On a fight where you must never leave
  # caster form, or while learning a key, these are the switches.
  melee_dps:
    label: "Melee DPS (Cat/Bear)"
    section: "Damage"
    type: checkbox
    default: true

  ranged_dps:
    label: "Ranged DPS (Sun/Moon/Wrath)"
    section: "Damage"
    type: checkbox
    default: true

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true

  # ==========================================================================
  # MOVEMENT — Stampeding Roar.
  # ==========================================================================
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # ==========================================================================
  # UTILITY — Innervate, Symbiotic Relationship, HoT spread toggle.
  # ==========================================================================
  auto_prowl:
    label: "Auto Prowl (Stealth)"
    section: "Utility"
    type: checkbox
    default: true

  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  force_spread:
    label: "Force HoT Spread"
    section: "Utility"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

  # ==========================================================================
  # RACIALS — Thorn Bloom is a heal, not damage.
  # ==========================================================================
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 4
    default: 1

  # ==========================================================================
  # TRINKETS & CONSUMABLES — tied to the Convoke window.
  # ==========================================================================
  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true

  # ==========================================================================
  # ENGINE — plumbing this file owns instead of inheriting.
  # ==========================================================================
  # Everything the file used to inherit. auto_heal and auto_target_ranged were
  # the last two shared lists; 5.2 inlines both, so this rotation now owns all
  # of its plumbing.
  loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  auto_rez:
    label: "Auto Rez / Rebirth (Mouseover)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Revive out of combat, Rebirth in combat, on the ally under your mouse."

  healthstone_pct:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  health_potion_pct:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  # A healer is the one spec that actually runs dry. The shared auto_heal list
  # has no mana potion line at all.
  mana_potion_pct:
    label: "Mana Potion Mana%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 30

  # ==========================================================================
  # HELP
  # ==========================================================================
  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # True if the lowest health group member is healthy enough for Catweaving
  group_healthy: group.lowest.health.effective.pct>=config.catweave_group_hp
  # Safe to enter Cat Form for DPS (group healthy and in combat)
  can_catweave: var.group_healthy&player.combat
  # Player is currently in a DPS form (Cat or Bear)
  in_dps_form: buff.cat_form.up|buff.bear_form.up
  # Friendly and valid mouseover target
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  # Soul of the Forest proc is active
  has_soul: buff.soul_of_the_forest.up
  # Stampeding Roar conditions based on the interface
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Interrupts and Dispel: Automatic Soothe and AoE CCs
  interrupts:
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    # REMOVED: a target_enemy "Search Soothe" line gated on
    # enemies.combat.any(cycle.purgeable.enrage). No predicate form `.any(EXPR)`
    # exists for enemies — group.count(EXPR) is the only one and it iterates
    # ALLIES. The line was dead, so Soothe below only fired when you already
    # had the enraged mob targeted. Not fixable: target_enemy is "nearest
    # enemy" with no filter.
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Out of Combat: Mark of the Wild, Symbiotic Relationship, and healing prep (Lifebloom on tanks, Rejuv, etc.)
  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    # Symbiotic Relationship. Out of combat only — the spell refuses to cast in
    # combat, which is why it must never appear in an in-combat list.
    #
    # THE BOND PRODUCES NO TRACKABLE AURA. Checked against a 26-minute M+ log:
    # the bond heal (474760) fires on both partners 2935 times, and there is
    # NOT ONE applybuff event for Symbiotic on either of them. So
    # buff.symbiotic_relationship never registers, .down stays true forever,
    # and any condition built on it re-casts every pass. That is the "casting
    # it nonstop" bug, and it survived two attempts to fix it with buff gates.
    #
    # The buff checks are kept in case they resolve in-game where the log shows
    # nothing, but lastcast is what actually bounds it: at worst the bond is
    # re-established once a minute, out of combat, which costs one global.
    #
    # No target chooser: in a 5-man there is only ever tank1.
    - symbiotic_relationship,cycle=tanks,range_check=none,name="Symbiotic (Tank)",if=talent.symbiotic_relationship&buff.symbiotic_relationship.down&buff.474760.down&lastcast.symbiotic_relationship>=60
    # Shift back to caster form after weaving, by casting something. The
    # !buff.prowl.up guard is what stops an infinite loop with the Auto Stealth
    # line at the bottom of this list: Prowl IS Cat Form, so without it the
    # sequence was prowl -> buff.cat_form.up -> this Rejuvenation -> the cast
    # drops you out of form and breaks stealth -> Auto Stealth prowls again ->
    # forever, burning mana the whole time. Both toggles ship ON, so it ran
    # any time you stood still.
    # cycle=members with no HP gate is deliberate here: the point is leaving
    # the form, and the Rejuvenation is the vehicle. It fires at most once per
    # shift now, not on a loop.
    - rejuvenation,name="Rejuvenation - Remove DPSForm",cycle=members,if=(buff.cat_form.up|buff.bear_form.up)&!buff.prowl.up
    # Pre-combat Lifebloom maintenance on tanks
    - lifebloom,name="OOC Lifebloom (Tank)",cycle=tanks,if=cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.ooc_heal_hp_pct&cycle.buff.rejuvenation.refreshable
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.ooc_heal_hp_pct&pred.cycle.buff.regrowth.refreshable
    # Forces HoT spread if the toggle is active (ignores normal HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(pred.buff.wild_growth.down|group.count(pred.cycle.buff.wild_growth.down)>=1)
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.refreshable)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down
    # Abundance padding, now behind a toggle. This call had NO condition at
    # all: out of combat it re-cast Rejuvenation forever as the HoT expired,
    # which is the "burning mana for nothing while standing around" bug.
    - call_action_list,name=abundance_maintenance,if=config.ooc_abundance
    # Auto Stealth when all healing is done
    - prowl,name="Auto Stealth",if=config.auto_prowl&!buff.prowl.up&!buff.travel_form.up&!buff.bear_form.up

  # Mitigations and Emergency Defensives: Ironbark on Tanks/Members -> Barkskin -> Bear Form + Frenzied Regen
  defensives:
    - barkskin,name="Barkskin",off_gcd=true,ignore_queue=true,if=health.pct<config.barkskin_threshold|incoming.pct>=30
    - ironbark,name="Ironbark (Tank)",off_gcd=true,ignore_queue=true,cycle=tanks,if=config.ironbark_target=1&(cycle.health.effective.pct<config.ironbark_threshold|cycle.incoming.pct>40)&cycle.buff.ironbark.down
    - ironbark,name="Ironbark (Members)",off_gcd=true,ignore_queue=true,cycle=members,if=config.ironbark_target=2&(cycle.health.effective.pct<config.ironbark_threshold|cycle.incoming.pct>40)&cycle.buff.ironbark.down
    - bear_form,name="Panic Bear",if= health.pct<config.frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if= health.pct<config.frenzied_regen_threshold&buff.bear_form.up

  # Racial Abilities and Specific Mobility
  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting
    - berserking,name="Berserking (Haste CD)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - war_stomp,name="War Stomp (AoE CC)",if=interrupt.stun.aoe.check
    - bull_rush,name="Bull Rush (AoE CC)",if=interrupt.stun.aoe.check
    - haymaker,name="Haymaker (Interrupt/Knockback)",if=interrupt.target.check
    - darkflight,name="Darkflight (Movement)",if=player.moving&!buff.dash.up&!buff.stampeding_roar.up

  # Main Healing Cooldown Alignment: NS -> Trinkets/Potion -> Convoke -> NS Regrowth -> Tranquility -> Swiftmend
  cooldowns:
    # NO Mark of the Wild here. It used to be the first line of this list,
    # which runs in combat — so a missing buff outranked Nature's Swiftness,
    # Convoke, Tranquility and Swiftmend. It is allowed in combat, but it
    # belongs at the bottom: see the call in `main`, below active_healing.
    # NO Symbiotic Relationship line here. It used to sit in this list, which
    # runs IN COMBAT — and the spell can only be cast out of combat. The cast
    # failed, the bond buff never applied, the condition never cleared, and the
    # line took the GCD every single pass. That is the "casting it nonstop"
    # bug. It lives in `out_of_combat` only.
    - natures_swiftness,name="Nature Swiftness",off_gcd=true,ignore_queue=true,delay=150,range_check=none,if=group.count(cycle.health.effective.pct<config.natures_swiftness_threshold)>=1
    # Overgrowth (new in 12.1) rides this line for free: with Nature's
    # Swiftness up, this Regrowth also applies Lifebloom, Rejuvenation and Wild
    # Growth to the same target. No extra line needed.
    - regrowth,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.natures_swiftness_threshold
    - rejuvenation,name="Reju Out Cat For Convoke",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&(buff.cat_form.up|buff.bear_form.up)
    - trinket_1,delay=150,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - trinket_2,delay=150,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - combat_potion,delay=150,name="Combat Potion",if=combat_potion.ready&config.use_potion&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - convoke_the_spirits,global_delay=500,name="Convoke (Heal)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,global_delay=500,name="Tranquility",if=!config.manual_tranquility&group.count(cycle.health.effective.pct<config.tranquility_threshold&!cycle.tank)>=config.tranquility_members&!player.moving
    # NEW in 5.0 — Power of the Archdruid: Swiftmend on cooldown spreads three
    # Rejuvenations, which is what gets Abundance to 5 stacks fast. Self-cast so
    # it never waits for someone to be hurt. Grove Guardians also makes every
    # Swiftmend summon a treant.
    - swiftmend.player,name="Self Swiftmend (Archdruid)",range_check=none,if=talent.power_of_the_archdruid&player.combat&cooldown.swiftmend.ready&(buff.rejuvenation.up|buff.regrowth.up|buff.wild_growth.up)
    # Swiftmend to obtain Soul of the Forest buff (requires active HoT on target)
    - swiftmend,name="Swiftmend for SotF/Treants",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|pred.cycle.buff.regrowth.up|pred.cycle.buff.wild_growth.up)

  # Sequential Active Healing: SotF consumption -> Lifebloom maintenance -> AoE and ST heals
  active_healing:
    # Treant usage and Clearcasting synergized with Wild Synthesis
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&(pred.cycle.buff.regrowth.down|cycle.health.effective.pct<99)

    - regrowth,name="Regrowth Emergency",cycle=members,if=cycle.health.effective.pct<50

    # Soul of the Forest is spent on REJUVENATION first. This is a priority
    # change in 5.0: the old order burned the proc on Regrowth. method.gg is
    # explicit that the proc belongs on Rejuvenation, and with Power of the
    # Archdruid in the build a SotF Rejuv is what feeds the Swiftmend spread.
    # Regrowth keeps the proc only as a fallback when nobody needs a HoT.
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=var.has_soul&cycle.buff.rejuvenation.refreshable
    - rejuvenation,name="SotF Germination",cycle=members,if=var.has_soul&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)
    - regrowth,name="SotF Regrowth",cycle=members,if=var.has_soul&cycle.health.effective.pct<config.regrowth_threshold

    # Efflorescence is NOT CAST on this build. Lifetreading (1217941) carries
    # `replace="Efflorescence" (id=145205)` in its own spell data and reads
    # "Efflorescence healing increased by 25%, and it now automatically grows
    # beneath your Lifebloom target's feet." It REPLACES the button: with
    # Lifetreading talented there is nothing to cast, and the puddle follows
    # whoever holds your Lifebloom. The reference M+ log confirms it — 452
    # automatic placements of the Lifetreading version (1232285) and zero casts
    # of 145205 across 26 minutes.
    #
    # The line is kept, gated on !talent.lifetreading, so a build that drops
    # Lifetreading still places the puddle by hand. On THIS build it is inert.
    #
    # Consequence worth knowing: Lifetreading makes lifebloom_target decide
    # where your Efflorescence sits. That is why the default is the tank.
    - efflorescence,name="Efflorescence (no Lifetreading)",range_check=none,if=talent.efflorescence&!talent.lifetreading&!totem.efflorescence.up

    # NEW in 5.0 — Everbloom self loop. after=300 debounces Everbloom's own
    # restack tick; refreshing under 4.5s keeps the stacks it has built.
    - lifebloom.player,name="Self Lifebloom (Everbloom)",range_check=none,after=300,if=config.lifebloom_target=1&talent.everbloom&(buff.lifebloom.down|buff.lifebloom.remains<4.5)
    - lifebloom,name="Lifebloom (Tank)",cycle=tanks,if=config.lifebloom_target=2&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)

    # NEW in 5.0 — Photosynthesis wants a Rejuvenation on yourself.
    - rejuvenation.player,name="Self Rejuvenation (Photosynthesis)",range_check=none,if=talent.photosynthesis&player.combat&buff.rejuvenation.down

    # Forces HoT spread if the toggle is active (ignores normal HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(pred.buff.wild_growth.down|group.count(pred.cycle.buff.wild_growth.down)>=1)
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.refreshable)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down

    # Spend the Abundance window. Regrowth at -60% cost and +60% crit is the
    # entire payoff of keeping 5 Rejuvenations up; without this line the file
    # built the buff and never cashed it. FerrazRestoDruidRaid.yaml already
    # had this and the M+ file did not.
    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.up&cycle.health.effective.pct<config.regrowth_threshold

    # Core periodic and direct healing logic
    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold&!cycle.tank)>=config.wild_growth_members
    - rejuvenation,name="Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.refreshable&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,name="Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold&!cycle.tank)>=config.thorn_bloom_members&target.in_melee

  # Utilities, Mobility, and Mana Recovery
  utility:
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - innervate,name="Innervate",off_gcd=true,ignore_queue=true,delay=150,range_check=none,if=mana.pct<config.innervate_threshold&fight_remains>15
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  # ABUNDANCE CHANGED IN 12.1 and this list was still written for the old one.
  # From the game's own spell data (207383 / 207640):
  #   "While you have at least 5 Rejuvenations active, Regrowth's cost is
  #    reduced by 60% and critical chance is increased by 60%."
  #   Buff 207640: Stacks: 1 maximum, duration 30s.
  # It no longer stacks per Rejuvenation — it is a binary threshold. The old
  # gate here read `buff.abundance.stack<5`, and since the buff caps at ONE
  # stack that comparison is true even while the buff is up. The filler could
  # never stop, in combat or out. It now gates on !buff.abundance.up, so it
  # pads until the threshold is met and then goes quiet.
  abundance_maintenance:
    - rejuvenation,name="Abundance Filler (Rejuv)",cycle=members,if=!buff.abundance.up&cycle.buff.rejuvenation.refreshable
    - rejuvenation,name="Abundance Filler (Germination)",cycle=members,if=!buff.abundance.up&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)

  # Cat Form DPS Rotation (Single Target)
  catweave_st:
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite ST",if=combo_points>=5
    - rake,name="Rake ST",if=debuff.rake.refreshable
    - shred,name="Shred ST"

  # Cat Form DPS Rotation (AoE)
  # Until 5.1 this list was byte-identical to catweave_st — it filled with
  # Shred, a single-target builder, at every target count. Swipe IS talented on
  # this build and is the Cat AoE builder. Measured on sim/ab_test_resto_dps.py:
  #     3 targets   37994 -> 38501   +1.33%
  #     5 targets   44390 -> 51431  +15.86%
  # Numeric id 106785, not the name: "swipe" also matches the Bear version
  # (213764), the same reason FerrazFeral.yaml and FerrazGuardianElune.yaml use
  # ids for it. Shred stays underneath as the low-target fallback.
  catweave_aoe:
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite AoE",if=combo_points>=5
    - rake,name="Rake AoE",if=debuff.rake.refreshable
    - 106785,name="Swipe AoE"
    - shred,name="Shred AoE"

  # Catweaving Transition and Entry (Physical DPS)
  catweave:
    # Refresh Rejuv on injured members before fully committing to Cat
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=(buff.bear_form.up|buff.cat_form.up)&(!target.in_melee|!var.group_healthy)

    # Fluid Form: Casts Rake/Shred to automatically shapeshift
    - rake,name="Fluid Rake",if=!buff.cat_form.up
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up
    - return,if=!buff.cat_form.up

    - heart_of_the_wild,name="HotW Cat",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - convoke_the_spirits,name="Convoke (Offensive)",if=buff.cat_form.up&cooldown.convoke_the_spirits.ready&target.time_to_die>10
    - call_action_list,name=catweave_aoe,if=enemies.combat.8y>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=enemies.combat.8y<config.aoe_threshold

  # Caster-form damage. LOG-DRIVEN: the reference M+ log has this druid doing
  # 100% of his damage from caster form — 5 Cat Form casts in 26 minutes and no
  # Rake/Shred/Rip at all — at 8.4 damage casts per minute. His two biggest
  # damage casts, Starsurge (57) and Starfire (27), were missing from this list
  # entirely; it only had Sunfire, Moonfire and Wrath. Both are castable by
  # Restoration (verified against the game's spell data).
  # Starsurge first: it is the Astral Power spender and the hardest hitter.
  ranged_dps:
    - sunfire,name="Sunfire AoE Refresh",if=debuff.sunfire.refreshable
    - moonfire,name="Moonfire ST Refresh",if=debuff.moonfire.refreshable
    - starsurge,name="Starsurge",if=astral_power>=40
    - starfire,name="Starfire",if=enemies.combat.40y>=2
    - wrath,name="Wrath Filler"

  # Defensive rotation and debuffs in Bear Form (Bearweave)
  bearweave:
    - thrash,name="Thrash (BearmForm Bleed)",if=dot.thrash.stack<3|dot.thrash.remains<=8
    - mangle,name="Mangle (BearForm)",if=!buff.bear_form.up&(dot.thrash.remains<=8|dot.thrash.stack<3)
    - call_action_list,name=catweave

  # Healing on the Move: Instant spells only (HoTs and Lifebloom)
  moving:
    - lifebloom,name="Lifebloom Tank (Moving)",cycle=tanks,if=cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.refreshable&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination (Moving)",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.health.effective.pct<config.rejuvenation_threshold
    - call_action_list,name=abundance_maintenance,if=!var.can_catweave

  # Emergency Mouseover Healing on unit frames
  mouseover_healing_emergency:
    - swiftmend.mouseover,name="Swiftmend (MO)",if=mouseover.buff.rejuvenation.remains>1|mouseover.buff.regrowth.remains>1|mouseover.buff.wild_growth.remains>1
    - rejuvenation.mouseover,name="Rejuvenation (MO)",if=mouseover.buff.rejuvenation.remains<=1.5
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving

  auto_rez:
    - revive.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat
    - rebirth.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  spell_queue:
    - queue_spell,delay=500,if=!player.casting&!player.channeling

  # This file has always defined its OWN spell_queue and sanity_checks rather
  # than inheriting Simia's, which is why the shared auto_dispel/auto_brez/
  # auto_combat_potion chain never applied here. Two lists were still coming
  # from _shared.yaml — auto_heal and auto_target_ranged — and 5.2 inlines
  # those too, so nothing in this rotation is inherited any more.
  sanity_checks:
    # The five guards. `mounted` and `travel_form` were both missing from this
    # local copy; without them the rotation fires while mounted or flying.
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=buff.travel_form.up

    - interact_target,delay=350,if=config.loot_nearby&target.lootable&target.range<=5&!player.combat
    - interact_target,delay=350,if=config.loot_nearby&loot_nearby&!player.combat
    - interact_mouseover,delay=350,if=config.loot_nearby&mouseover.lootable&mouseover.range<=5&!player.combat

    # Nature's Cure removes MAGIC, curse and poison — the healer dispel. It had
    # no toggle before; dispelling is your job, so it defaults ON.
    - natures_cure,delay=500,cycle=members,name="Nature's Cure",if=config.auto_dispel&cycle.dispelable.list
    # Devouring Rift (Devour affix) bypasses dispel-type matching, so it needs
    # its own line keyed on the debuff id. player_first: clear yourself first.
    - natures_cure,delay=500,cycle=members,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.affix_devour&cycle.debuff.440313.up.any

    - call_action_list,name=auto_rez,if=config.auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe

    # Inlined from _shared.yaml auto_heal. The shared list has no mana potion
    # line; a healer is the one spec that actually runs dry, so it is added.
    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.healthstone_pct
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.health_potion_pct
    - mana_potion,delay=250,if=mana_potion.ready&mana.pct<=config.mana_potion_pct

    # Inlined from _shared.yaml auto_target_ranged (40y — you cast from range
    # even while weaving).
    - target_enemy,delay=200,off_gcd=true,if=config.auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

  # Main Rotation (main) with combat priorities
  main:
    # Aborts if channeling crucial abilities (Tranquility/Convoke)
    - return,if=(player.channeling&player.casting.spell_id=740)|(player.channeling&(player.casting.spell_id=323764|player.casting.spell_id=391528))|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat,if=!player.combat
    # NOTE: a `return,if=auto_combat.player` used to sit here. That expression
    # does not exist (player.auto_combat reversed), so it never fired and the
    # line was dead — the only reason the rotation worked. Re-spelling it made
    # it live and aborted everything below. Removed. Do not add it back.
    - call_action_list,name=defensives,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=utility
    - call_action_list,name=racials
    - call_action_list,name=cooldowns,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=interrupts
    # Emergency Mouseover Healing on unit frames
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&(!var.in_dps_form|!var.group_healthy)
    - call_action_list,name=moving,if=player.moving&(!var.in_dps_form|!var.group_healthy)
    # Sequential Active Healing: SotF consumption -> Lifebloom maintenance -> AoE and ST heals
    - call_action_list,name=active_healing,if=!var.in_dps_form|!var.group_healthy
    # Mark of the Wild, in combat, at the bottom of the priority. Everything
    # that heals outranks it; it outranks the DPS weaving. So a dropped buff is
    # reapplied on a global that would otherwise have been damage, never on one
    # that would have been a heal.
    - mark_of_the_wild,range_check=none,name="Mark of the Wild (low prio)",if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10

    # DPS weaving when the group is healthy
    - call_action_list,name=ranged_dps,if=config.ranged_dps&var.can_catweave&target.exists&target.alive&!target.friendly&!target.in_melee
    - call_action_list,name=bearweave,if=config.melee_dps&var.can_catweave&target.exists&target.alive&!target.friendly&target.in_melee
    # Downtime Filler: Pad Abundance if there is no valid enemy to attack
    - call_action_list,name=abundance_maintenance,if=!target.exists|target.friendly|target.range>40
