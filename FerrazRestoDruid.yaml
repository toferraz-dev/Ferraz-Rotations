version: 4.3
author: Ferraz
patch: "12.0.7"
spec: 105
name: Ferraz Restoration Druid M+ (Wildstalker)
description: |
  Ferraz Restoration Druid M+ (Wildstalker)
entry: main

predictions:
  774:   { name: "Rejuvenation", buff: 774 }
  8936:  { name: "Regrowth", buff: 8936 }
  33763: { name: "Lifebloom", buff: 33763 }
  48438: { name: "Wild Growth", buff: 48438 }

config:
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CkGA8cL7tpvige+kkmGM9zUPWPMmZZMjZmxsN8AMzswsYbGAAAAAAAAAAsMoZbGmmZMwsYmZmZZGegBAAAAgBAYGAACAAY2mZrZZmNbMzMwMzGoZAAmZAYA"

  # === DEFENSIVE CONFIGURATIONS ===
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 85

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 80

  ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  # === COOLDOWN CONFIGURATIONS ===
  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 85

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 75

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Toggle to disable automatic Tranquility usage."

  # === AOE / GROUP HEALING CONFIGURATIONS ===
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  abundance_min_stacks:
    label: "Abundance Stacks (Pad)"
    section: "Healing"
    type: slider
    min: 1
    max: 10
    default: 6

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 95

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 5
    default: 2

  # === SINGLE TARGET (ST) HEALING CONFIGURATIONS ===
  natures_swiftness_threshold:
    label: "Nature's Swiftness HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 60


  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 80

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100

  # === DAMAGE & CATWEAVING CONFIGURATIONS ===
  catweave_group_hp:
    label: "Exit Cat - Group HP %"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 95

  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 3

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true

  # === MOVEMENT CONFIGURATIONS ===
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # === UTILITY CONFIGURATIONS ===
  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  # === RACIAL CONFIGURATIONS ===
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 5
    default: 1

  # === TRINKET & CONSUMABLE CONFIGURATIONS ===
  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  force_spread:
    label: "Force HoT Spread"
    section: "Utility"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # True if the lowest health group member is healthy enough for Catweaving
  group_healthy: group.lowest.health.effective.pct>=config.catweave_group_hp
  # Safe to enter Cat Form for DPS (group healthy and in combat)
  can_catweave: var.group_healthy&player.combat
  # Player is currently in a DPS form (Cat or Bear)
  in_dps_form: buff.cat_form.up|buff.bear_form.up
  # Friendly and valid mouseover target
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  # Soul of the Forest proc is active
  has_soul: buff.soul_of_the_forest.up
  # Stampeding Roar conditions based on the interface
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Interrupts and Dispel: Automatic Soothe and AoE CCs
  interrupts:
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Out of Combat: Mark of the Wild, Symbiotic Relationship, and healing prep (Lifebloom on tanks, Rejuv, etc.)
  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up
    # Casts Rejuvenation to exit combat forms if necessary
    - rejuvenation,name="Rejuvenation - Remove DPSForm",cycle=members,if=buff.cat_form.up|buff.bear_form.up
    # Pre-combat Lifebloom maintenance on tanks
    - lifebloom,name="OOC Lifebloom (Tank)",cycle=tanks,if=pred.cycle.buff.lifebloom.down|pred.cycle.buff.lifebloom.refreshable
    - rejuvenation,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&pred.cycle.buff.rejuvenation.refreshable
    - regrowth,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&pred.cycle.buff.regrowth.refreshable
    # Forces HoT spread if the toggle is active (ignores normal HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(pred.buff.wild_growth.down|group.any(pred.cycle.buff.wild_growth.down))
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(pred.cycle.buff.rejuvenation.down|pred.cycle.buff.rejuvenation.refreshable)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&pred.cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down
    # Abundance Maintenance: Keeps 6 Abundance stacks on the group
    - call_action_list,name=abundance_maintenance

  # Mitigations and Emergency Defensives: Ironbark on Tanks/Members -> Barkskin -> Bear Form + Frenzied Regen
  defensives:
    - barkskin,name="Barkskin",off_gcd=true,ignore_queue=true,if=health.pct<config.barkskin_threshold|incoming.pct>=30
    - ironbark,name="Ironbark (Tank)",off_gcd=true,ignore_queue=true,cycle=tanks,if=config.ironbark_target=1&(cycle.health.effective.pct<config.ironbark_threshold|cycle.incoming.pct>40)&cycle.buff.ironbark.down
    - ironbark,name="Ironbark (Members)",off_gcd=true,ignore_queue=true,cycle=members,if=config.ironbark_target=2&(cycle.health.effective.pct<config.ironbark_threshold|cycle.incoming.pct>40)&cycle.buff.ironbark.down
    - bear_form,name="Panic Bear",if= health.pct<config.frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if= health.pct<config.frenzied_regen_threshold&buff.bear_form.up

  # Racial Abilities and Specific Mobility
  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting
    - berserking,name="Berserking (Haste CD)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - war_stomp,name="War Stomp (AoE CC)",if=interrupt.stun.aoe.check
    - bull_rush,name="Bull Rush (AoE CC)",if=interrupt.stun.aoe.check
    - haymaker,name="Haymaker (Interrupt/Knockback)",if=interrupt.target.check
    - darkflight,name="Darkflight (Movement)",if=player.moving&!buff.dash.up&!buff.stampeding_roar.up

  # Main Healing Cooldown Alignment: NS -> Trinkets/Potion -> Convoke -> NS Regrowth -> Tranquility -> Swiftmend
  cooldowns:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up
    - natures_swiftness.player,name="Nature Swiftness",off_gcd=true,ignore_queue=true,range_check=none,if=group.count(cycle.health.effective.pct<config.natures_swiftness_threshold)>=1
    - regrowth,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.natures_swiftness_threshold
    - rejuvenation,name="Reju Out Cat For Convoke",if=(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&(buff.cat_form.up|buff.bear_form.up)
    - trinket_1,delay=150,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - trinket_2,delay=150,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - combat_potion,delay=150,name="Combat Potion",if=combat_potion.ready&config.use_potion&(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - convoke_the_spirits,global_delay=500,name="Convoke (Heal)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,global_delay=500,name="Tranquility",if=!config.manual_tranquility&group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    # Swiftmend to obtain Soul of the Forest buff (requires active HoT on target)
    - swiftmend,name="Swiftmend for SotF/Treants",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(pred.cycle.buff.rejuvenation.up|pred.cycle.buff.regrowth.up|pred.cycle.buff.wild_growth.up)

  # Sequential Active Healing: SotF consumption -> Lifebloom maintenance -> AoE and ST heals
  active_healing:
    # Treant usage and Clearcasting synergized with Wild Synthesis
    - regrowth,name="Clearcasting Regrowth",cycle=members,if=buff.clearcasting.up&(pred.cycle.buff.regrowth.down|cycle.health.effective.pct<99)

    # Consumes the Soul of the Forest proc
    - regrowth,name="Regrowth Emergency",cycle=members,if=cycle.health.effective.pct<65
    - regrowth,name="SotF Regrowth",cycle=members,if=var.has_soul&cycle.health.effective.pct<config.regrowth_threshold
    - rejuvenation,name="SotF Germination",cycle=members,if=var.has_soul&talent.germination&pred.cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)
    - rejuvenation,name="SotF Rejuvenation",cycle=members,if=var.has_soul&pred.cycle.buff.rejuvenation.refreshable

    # Lifebloom on tanks
    - lifebloom,name="Lifebloom (Tank)",cycle=tanks,if=pred.cycle.buff.lifebloom.down|pred.cycle.buff.lifebloom.refreshable

    # Forces HoT spread if the toggle is active (ignores normal HP thresholds)
    - wild_growth,name="Forced Wild Growth",range_check=none,if=config.force_spread&(pred.buff.wild_growth.down|group.any(pred.cycle.buff.wild_growth.down))
    - rejuvenation,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(pred.cycle.buff.rejuvenation.down|pred.cycle.buff.rejuvenation.refreshable)
    - rejuvenation,name="Forced Germination",cycle=members,if=config.force_spread&pred.cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.down

    # Core periodic and direct healing logic
    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - rejuvenation,name="Rejuvenation",cycle=members,if=pred.cycle.buff.rejuvenation.refreshable&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination",cycle=members,if=talent.germination&pred.cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,name="Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold)>=config.thorn_bloom_members&target.range<=8

  # Utilities, Mobility, and Mana Recovery
  utility:
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - innervate.player,name="Innervate",range_check=none,if=mana.pct<config.innervate_threshold
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  abundance_maintenance:
    - rejuvenation,name="Abundance Filler (Rejuv)",cycle=members,if=buff.abundance.stack<config.abundance_min_stacks&pred.cycle.buff.rejuvenation.refreshable
    - rejuvenation,name="Abundance Filler (Germination)",cycle=members,if=buff.abundance.stack<config.abundance_min_stacks&talent.germination&pred.cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)

  # Cat Form DPS Rotation (Single Target)
  catweave_st:
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite ST",if=combo_points>=5
    - rake,name="Rake ST",if=debuff.rake.refreshable
    - shred,name="Shred ST"

  # Cat Form DPS Rotation (AoE)
  catweave_aoe:
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite AoE",if=combo_points>=5
    - rake,name="Rake AoE",if=debuff.rake.refreshable
    - shred,name="Shred AoE"

  # Catweaving Transition and Entry (Physical DPS)
  catweave:
    # Priority DoTs (Mantém os DoTs principais do log rolando)
    - sunfire,name="Sunfire (Cat Transition)",if=debuff.sunfire.refreshable
    - moonfire,name="Moonfire (Cat Transition)",if=debuff.moonfire.refreshable

    # Refresh Rejuv on injured members before fully committing to Cat
    - rejuvenation,name="Cat Rejuvenation",cycle=members,if=(buff.bear_form.up|buff.cat_form.up)&(target.range>8|!var.group_healthy)

    # Fluid Form: Casts Rake/Shred to automatically shapeshift
    - rake,name="Fluid Rake",if=!buff.cat_form.up
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up
    - return,if=!buff.cat_form.up

    - heart_of_the_wild,name="HotW Cat",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - convoke_the_spirits,name="Convoke (Offensive)",if=buff.cat_form.up&cooldown.convoke_the_spirits.ready&target.time_to_die>10
    - call_action_list,name=catweave_aoe,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=active_enemies<config.aoe_threshold

  # Ranged DoT maintenance in caster form
  ranged_dps:
    - sunfire,name="Sunfire AoE Refresh",if=debuff.sunfire.refreshable
    - moonfire,name="Moonfire ST Refresh",if=debuff.moonfire.refreshable
    - wrath,name="Wrath Filler"

  # Defensive rotation and debuffs in Bear Form (Bearweave)
  bearweave:
    - thrash,name="Thrash (BearmForm Bleed)"
    - mangle,name="Mangle (BearForm)",if=!buff.bear_form.up&(dot.thrash.remains<=8|dot.thrash.stack<3)
    - call_action_list,name=catweave

  # Healing on the Move: Instant spells only (HoTs and Lifebloom)
  moving:
    - lifebloom,name="Lifebloom Tank (Moving)",cycle=tanks,if=pred.cycle.buff.lifebloom.down|pred.cycle.buff.lifebloom.refreshable
    - rejuvenation,name="Rejuvenation (Moving)",cycle=members,if=pred.cycle.buff.rejuvenation.refreshable&cycle.health.effective.pct<config.rejuvenation_threshold
    - rejuvenation,name="Germination (Moving)",cycle=members,if=talent.germination&pred.cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.health.effective.pct<config.rejuvenation_threshold
    - call_action_list,name=abundance_maintenance,if=!var.can_catweave

  # Emergency Mouseover Healing on unit frames
  mouseover_healing_emergency:
    - swiftmend.mouseover,name="Swiftmend (MO)",if=mouseover.buff.remains(rejuvenation)>1|mouseover.buff.remains(regrowth)>1|mouseover.buff.remains(wild_growth)>1
    - rejuvenation.mouseover,name="Rejuvenation (MO)",if=mouseover.buff.remains(rejuvenation)<=1.5
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving

  auto_rez:
    - revitalize.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat
    - rebirth.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  spell_queue:
    - queue_spell,delay=500

  sanity_checks:
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - interact_target,delay=350,if=config.lootnearby&target.lootable&target.range<=5&!player.combat
    - interact_target,delay=350,if=config.lootnearby&loot_nearby&!player.combat
    - interact_mouseover,delay=350,if=config.lootnearby&mouseover.lootable&mouseover.range<=5&!player.combat
    - natures_cure,delay=500,cycle=members,if=cycle.dispelable.list
    - call_action_list,name=auto_rez,if=config.auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  # Main Rotation (main) with combat priorities
  main:
    # Aborts if channeling crucial abilities (Tranquility/Convoke)
    - return,if=player.channeling.tranquility|player.channeling.convoke_the_spirits|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat,if=!player.combat
    - call_action_list,name=auto_target_ranged
    - call_action_list,name=auto_heal,if=!var.in_dps_form|!var.group_healthy
    - return,if=auto_combat.player
    - call_action_list,name=defensives,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=utility
    - call_action_list,name=racials
    - call_action_list,name=cooldowns,if=!var.in_dps_form|!var.group_healthy
    - call_action_list,name=interrupts
    # Emergency Mouseover Healing on unit frames
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&(!var.in_dps_form|!var.group_healthy)
    - call_action_list,name=moving,if=player.moving&(!var.in_dps_form|!var.group_healthy)
    # Sequential Active Healing: SotF consumption -> Lifebloom maintenance -> AoE and ST heals
    - call_action_list,name=active_healing,if=!var.in_dps_form|!var.group_healthy
    # DPS weaving when the group is healthy
    - call_action_list,name=ranged_dps,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range>8
    - call_action_list,name=bearweave,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range<=8
    # Downtime Filler: Pad Abundance if there is no valid enemy to attack
    - call_action_list,name=abundance_maintenance,if=!target.exists|target.friendly|target.range>40