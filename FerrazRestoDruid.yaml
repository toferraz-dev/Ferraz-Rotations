version: 4.0
author: Ferraz
patch: "12.0.1.6"
spec: 105
name: Ferraz Restoration Druid Mythic+ (Wildstalker)
description: |
  Restoration Druid - Wildstalker for Mythic+.
  Talent Tree: CkGA8cL7tpvige+kkmGM9zUPWPMmZZMjZmxsN8AjZswsYbGAAAAAAAAAAsNoZzw0MjZmxsYmZGLzgZAAAAAAAwAWWGLYamZZAAMbzs1sNziNGz8AYmZB0MAAzMAMA
entry: main

config:
  # =================================================================================================
  #     DEFENSIVE & SURVIVAL
  # =================================================================================================
  barkskin_threshold:
    label: "Barkskin HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 65

  frenzied_regen_threshold:
    label: "Frenzied Regen HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 40

  ironbark_threshold:
    label: "Ironbark HP %"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 60

  ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  # =================================================================================================
  #     MAJOR COOLDOWNS
  # =================================================================================================
  convoke_threshold:
    label: "Convoke HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  tranquility_threshold:
    label: "Tranquility HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 65

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 5
    default: 3

  ns_threshold:
    label: "Nature's Swiftness HP %"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 60

  # =================================================================================================
  #     HEALING - AOE & GROUP
  # =================================================================================================
  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 80

  wild_growth_threshold:
    label: "Wild Growth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 5
    default: 2

  # =================================================================================================
  #     HEALING - SINGLE TARGET
  # =================================================================================================
  swiftmend_threshold:
    label: "Swiftmend HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 70

  lifebloom_swap_threshold:
    label: "Lifebloom Swap HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 65

  regrowth_threshold:
    label: "Regrowth HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  rejuvenation_threshold:
    label: "Rejuvenation HP %"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 95

  # =================================================================================================
  #     DAMAGE & CATWEAVING
  # =================================================================================================
  catweave_group_hp:
    label: "Enter Cat - Group HP %"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 85

  catweave_injured_max:
    label: "Exit Cat - Max Injured"
    section: "Damage"
    type: slider
    min: 0
    max: 5
    default: 1

  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 2
    max: 5
    default: 3

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true

  # =================================================================================================
  #     UTILITY & ITEMS
  # =================================================================================================
  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 60

  # =================================================================================================
  #     RACIAL ABILITIES
  # =================================================================================================
  thorn_bloom_threshold:
    label: "Thorn Bloom HP %"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 5
    default: 1

  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: false

  use_mark_of_the_wild:
    label: "Auto Mark of the Wild"
    section: "Utility"
    type: checkbox
    default: true

  force_dps:
    label: "Force DPS"
    spell: 768
    section: "Utility"
    type: toggle
    description: "Forcing the DPS while forgetting that it's a healer role."

  force_spread:
    label: "Force HoT Spread"
    section: "Utility"
    type: toggle
    spell: 774
    description: "Forces Rejuvenation / Wild Growth spread regardless of HP"

variables:
  is_tree_form: buff.incarnation_tree_of_life.up
  group_healthy: group.count(cycle.health.effective.pct<config.catweave_group_hp)<config.catweave_injured_max
  can_catweave: (var.group_healthy|config.force_dps)&player.combat&!var.is_tree_form
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range>0&mouseover.range<=40
  mo_attacker_valid: mouseover.exists&mouseover.alive&!mouseover.friendly&mouseover.range>0&mouseover.range<=40

lists:
  interrupts:
    # Auto Swap Search
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any

    # AoE Interrupt
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",if=config.use_mark_of_the_wild&group.count(cycle.buff.mark_of_the_wild.down.any)>0
    - symbiotic_relationship,name="Symbiotic Tank",cycle=tanks,if=!buff.symbiotic_relationship.up&!cycle.buff.symbiotic_relationship.up&!player.casting

    # Lifebloom OOC Maintenance
    - lifebloom,delay=150,name="OOC Lifebloom Tank",cycle=tanks,if=cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5
    - rejuvenation,delay=150,name="OOC Rejuvenation",cycle=members,if=cycle.health.effective.pct<config.rejuvenation_threshold&cycle.buff.rejuvenation.remains<1.5&!player.combat
    - regrowth,delay=150,name="OOC Regrowth",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold&cycle.buff.regrowth.remains<1.5&!player.combat


  defensives:
    - ironbark,name="Ironbark (Tank)",cycle=tanks,if=config.ironbark_target=1&cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - ironbark,name="Ironbark (Members)",cycle=members,if=config.ironbark_target=2&cycle.health.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold
    - bear_form,name="Panic Bear",if=health.pct<config.frenzied_regen_threshold&!buff.bear_form.up&cooldown.frenzied_regeneration.ready
    - frenzied_regeneration,name="Frenzied Regen",if=health.pct<config.frenzied_regen_threshold&buff.bear_form.up

  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=player.combat&player.aggro&!player.casting
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold)>=config.thorn_bloom_members

  cooldowns:
    - trinket_1,if=config.use_trinket_1&trinket_1.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    - trinket_2,if=config.use_trinket_2&trinket_2.ready&group.count(cycle.health.effective.pct<=config.convoke_threshold)>=config.convoke_members
    - convoke_the_spirits,delay=300,name="Convoke (Heal)",if=group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - tranquility,delay=300,name="Tranquility",if=group.count(cycle.health.effective.pct<config.tranquility_threshold)>=config.tranquility_members&!player.moving
    - natures_swiftness,name="Nature's Swiftness",if=group.count(cycle.health.effective.pct<config.ns_threshold)>=1
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up

  active_healing:
    # Emergency & Single Target Filler
    - swiftmend,delay=150,name="Swiftmend Emergency",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|cycle.buff.regrowth.up|cycle.buff.wild_growth.up)
    - regrowth,delay=150,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.regrowth_threshold

    # Lifebloom Tank Baseline
    - lifebloom,delay=150,name="Lifebloom Tank",cycle=tanks,if=cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=3

    # Forced Ramp / Spread (Ignores HP thresholds if toggle is ON)
    - wild_growth,delay=150,name="Forced Wild Growth",if=config.force_spread&(buff.wild_growth.down|group.any(cycle.buff.wild_growth.down))
    - rejuvenation,delay=150,name="Forced Rejuvenation",cycle=members,if=config.force_spread&(cycle.buff.rejuvenation.down|cycle.buff.rejuvenation.remains<1.5)

    # Wild Growth (Buffed by 2pc Set)
    - wild_growth,delay=150,name="Wild Growth",if=group.count(cycle.health.effective.pct<config.wild_growth_threshold)>=config.wild_growth_members
    - rejuvenation,delay=150,name="Rejuvenation Filler",cycle=members,if=cycle.buff.rejuvenation.remains<1.5&cycle.health.effective.pct<config.rejuvenation_threshold
    - regrowth,delay=150,name="Regrowth Filler",cycle=members,if=cycle.health.effective.pct<config.regrowth_threshold

  utility:
    - bear_form,name="Stay Bear (Rooted)",if=player.rooted&!buff.bear_form.up
    - cat_form,name="Stay Cat (Rooted)",if=player.rooted&buff.bear_form.up
    - innervate,name="Innervate",if=mana.pct<config.innervate_threshold

  catweave_st:
    - heart_of_the_wild,name="HotW Cat ST",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - rip,delay=150,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,delay=150,name="Bite ST",if=combo_points>=5
    - rake,delay=150,name="Rake ST",if=debuff.rake.refreshable
    - shred,delay=150,name="Shred ST"

  catweave_aoe:
    - heart_of_the_wild,name="HotW Cat AoE",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,delay=150,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,delay=150,name="Bite AoE",if=combo_points>=5
    - rake,delay=150,name="Rake AoE",if=debuff.rake.refreshable
    - swipe,delay=150,name="Swipe AoE",if=talent.swipe
    - shred,delay=150,name="Shred AoE",if=!talent.swipe

  catweave:
    - rejuvenation,delay=150,name="Cat Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.remains<4&(buff.cat_form.up|talent.fluid_form)&(target.range>8|!var.group_healthy)

    # Fluid Form: we MUST cast rake or shred to shift BEFORE accessing catweave_aoe/st
    - rake,delay=150,name="Fluid Rake",if=talent.fluid_form&!buff.cat_form.up&debuff.rake.refreshable
    - shred,delay=150,name="Fluid Shred",if=talent.fluid_form&!buff.cat_form.up

    # Explicit shift fallback (for AoE when Shred is bypassed or without Fluid Form)
    - cat_form,name="Manual Cat Shift",if=!buff.cat_form.up
    - return,if=!buff.cat_form.up

    - call_action_list,name=catweave_aoe,if=active_enemies>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=active_enemies<config.aoe_threshold

  ranged_dps:
    - sunfire,delay=150,name="Sunfire Aoe Dot",if=debuff.sunfire.refreshable
    - moonfire,delay=150,name="Moonfire ST Refresh",if=debuff.moonfire.refreshable

  bearweave:
    - thrash,delay=150,name="Thrash (BearmForm Bleed)",if=debuff.thrash.remains<3&talent.fluid_form
    - mangle,delay=150,name="Mangle (BearForm)",if=talent.fluid_form
    - call_action_list,name=catweave

  moving:
    - convoke_the_spirits,delay=300,name="Convoke (Moving)",if=group.count(cycle.health.effective.pct<config.convoke_threshold)>=config.convoke_members&!buff.cat_form.up&!buff.bear_form.up
    - lifebloom,delay=150,name="Lifebloom Swap (Moving)",cycle=members,if=player.combat&cycle.health.effective.pct<config.lifebloom_swap_threshold&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)
    - lifebloom,delay=150,name="Lifebloom Tank (Moving)",cycle=tanks,if=player.combat&(cycle.buff.lifebloom.stack<3|cycle.buff.lifebloom.remains<=5)
    - rejuvenation,delay=150,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.down&cycle.health.effective.pct<95
    - wrath,delay=150,name="Wrath (Moving)",if=var.is_tree_form&target.exists&!target.friendly

  mouseover_healing_emergency:
    - regrowth.mouseover,delay=150,name="Regrowth (MO) Instant",if=buff.natures_swiftness.up|var.is_tree_form
    - swiftmend.mouseover,delay=150,name="Swiftmend (MO)",if=(mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up|mouseover.buff.wild_growth.up)
    - regrowth.mouseover,delay=150,name="Regrowth (MO) Cast",if=!player.moving
    - rejuvenation.mouseover,delay=150,name="Rejuvenation (MO)",if=mouseover.buff.remains(rejuvenation)<1.5

  main:
    - return,if=player.channeling|player.casting|buff.tranquility.up|buff.convoke_the_spirits.up
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player
    - call_action_list,name=interrupts
    - call_action_list,name=defensives
    - call_action_list,name=racials
    - call_action_list,name=utility
    - call_action_list,name=cooldowns
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.pct<config.mouseover_emergency_hp&!player.casting&!player.channeling
    - call_action_list,name=moving,if=player.moving
    - call_action_list,name=active_healing,if=!config.force_dps
    - call_action_list,name=ranged_dps,if=var.can_catweave&target.exists&target.alive&!target.friendly
    - call_action_list,name=bearweave,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range<=8&active_enemies>=2
    - call_action_list,name=catweave,if=var.can_catweave&target.exists&target.alive&!target.friendly&target.range<=8



