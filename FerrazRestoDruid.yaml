version: "21.0.0"
author: Ferraz
patch: "12.1"
spec: 105
name: Restoration Druid Ferraz M+
description: |
  Restoration Druid Ferraz M+
entry: main

predictions:
  8936:  { name: "Regrowth", buff: 8936 }
  48438: { name: "Wild Growth", buff: 48438 }

config:

  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-10-06 | Patch: 12.1 | Version: 21.0.0"


  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CkGADBD3hSPCL9Y9gz68WcKvMMMmZZMjZmxsNmBmNmNbzAAAAAAAAAAgNDNbzw0MDwsYmZGLGeADAAAAgBAYGw22YBTzMLDAgZbmtmtZ2sxMzMDzMbgmBAzMzMAMA"


  use_mouseover:
    label: "MO Healing (Emergency)"
    section: "Healing"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP % (effective)"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 75

  lifebloom_target:
    label: "Lifebloom Target"
    section: "Healing"
    type: dropdown
    options:
      - label: "Tank"
        value: 2
      - label: "Self"
        value: 1
    default: 2

  ooc_heal_hp_pct:
    label: "OOC Heal Below HP% (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100
    description: "Out of combat, only heal group members under this health. Set to 100 to go back to topping everyone off."

  wild_growth_threshold:
    label: "Wild Growth HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 90

  wild_growth_members:
    label: "Wild Growth - Min Members"
    section: "Healing"
    type: slider
    min: 1
    max: 4
    default: 2

  disable_natures_swiftness:
    label: "Disable Nature's Swiftness"
    section: "Healing"
    type: toggle
    spell: 132158
    description: "Ephemeral, hotkeyable toggle. OFF (default) = Nature's Swiftness stays on. Hit the bound key to suppress it for the rest of the session/pull; state resets to OFF (enabled) on reload."

  force_dps:
    label: "Force DPS Only (Panic Button)"
    section: "Healing"
    type: toggle
    spell: 197626
    description: "Ephemeral, hotkeyable toggle. OFF (default) = normal healing. Hit the bound key to suppress ALL proactive healing (Wild Growth, Rejuvenation, Lifebloom, Regrowth, Abundance upkeep, healing cooldowns) and go pure ranged DPS. Critical-HP emergency safety net (Barkskin/healthstone/potion) still fires underneath regardless. State resets to OFF on reload."

  natures_swiftness_threshold:
    label: "Nature's Swiftness HP % (effective)"
    section: "Healing"
    type: slider
    min: 10
    max: 99
    default: 70

  regrowth_emergency_threshold:
    label: "Regrowth Emergency HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 90
    default: 60
    description: "Emergency Regrowth on anyone below this health."

  swiftmend_threshold:
    label: "Swiftmend HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 85

  regrowth_threshold:
    label: "Regrowth HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90

  rejuvenation_threshold:
    label: "Rejuvenation HP % (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100

  rejuvenation_threshold_tank:
    label: "Rejuvenation HP % Tank (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 100
    default: 100

  regrowth_threshold_tank:
    label: "Regrowth HP % Tank (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 95

  wild_growth_threshold_tank:
    label: "Wild Growth HP % Tank (effective)"
    section: "Healing"
    type: slider
    min: 25
    max: 99
    default: 90


  convoke_threshold:
    label: "Convoke HP % (effective)"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 75

  convoke_members:
    label: "Convoke - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 4
    default: 3

  tranquility_threshold:
    label: "Tranquility HP % (effective)"
    section: "Cooldowns"
    type: slider
    min: 25
    max: 99
    default: 70

  tranquility_members:
    label: "Tranquility - Min Members"
    section: "Cooldowns"
    type: slider
    min: 1
    max: 4
    default: 3

  manual_tranquility:
    label: "Manual Tranquility"
    section: "Cooldowns"
    type: checkbox
    default: false
    description: "Toggle to disable automatic Tranquility usage."


  barkskin_incoming_pct:
    label: "Barkskin Incoming Damage %"
    section: "Defensives"
    type: slider
    min: 10
    max: 100
    default: 40
    description: "Use Barkskin when the biggest predicted incoming hit is at least this much of your effective health, even at full HP."

  ironbark_threshold:
    label: "Ironbark HP % (effective)"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 75
    description: "Use Ironbark when the target is below this health. HP% only - no incoming-damage form exists for a unit other than the player, so unlike Barkskin, Ironbark cannot react before the hit lands."

  frenzied_regen_threshold:
    label: "Frenzied Regen HP % (effective)"
    section: "Defensives"
    type: slider
    min: 25
    max: 99
    default: 35


  ironbark_target:
    label: "Ironbark Target"
    section: "Defensives"
    type: dropdown
    options:
      - label: "Tanks Only"
        value: 1
      - label: "All Members"
        value: 2
    default: 1

  emergency_hp:
    label: "Emergency HP% (mid-cast, effective)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 30
    description: "Health below which defensives and consumables are allowed to fire while you are casting. The rotation normally does nothing at all mid-cast, so without this a hardcast swallows Barkskin, the healthstone and the health potion until it finishes. Set to 0 to go back to that."

  emergency_stop_casting:
    label: "Cut the Cast in an Emergency"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Below the emergency HP, end the current cast so the next global can go to a real defensive. Barkskin and the consumables above do not need this - they are off-GCD and fire without touching the cast - so this only matters for the ones that cost a global, like Bear Form into Frenzied Regeneration. Tranquility and Convoke are never cut."

  root_cleanse:
    label: "Break Roots by Shapeshifting"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Shift form to break a root, using the real player.rooted self-state (not stun, not fear - there is no equivalent snare check). line_cd caps it at one attempt every 8 seconds."


  auto_dispel:
    label: "Nature's Cure (Group)"
    section: "Dispels"
    type: checkbox
    default: true

  affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Dispels"
    type: checkbox
    default: true

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."


  catweave_group_hp:
    label: "Exit Cat - Group HP % (effective)"
    section: "Damage"
    type: slider
    min: 25
    max: 99
    default: 85
    description: "The dial between HPS and DPS, and there is no correct value — three reference druids sit at three different points. Reads group.lowest, the MOST hurt member, so it is strict by nature. ~95 plays like Crohot (5% damage casts, 163k HPS, the highest healing of the three). ~85 is the middle. ~75 plays like Kireya (29% damage casts, 19.4k DPS, double the others, at the lowest HPS). Move it after a key, not before one."

  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "Damage"
    type: slider
    min: 1
    max: 5
    default: 2

  melee_dps:
    label: "Melee DPS (Cat/Bear)"
    section: "Damage"
    type: checkbox
    default: false

  convoke_dps:
    label: "Convoke as DPS Cooldown"
    section: "Damage"
    type: checkbox
    default: false
    description: "Cast Convoke the Spirits offensively in Cat Form when it is off cooldown, instead of holding it strictly for the healing version (Convoke (Heal) below, in Cooldowns). Turn ON to also spend it on DPS - default OFF, Convoke stays a heal-only cooldown."

  ranged_dps:
    label: "Ranged DPS (Sun/Moon/Wrath)"
    section: "Damage"
    type: checkbox
    default: true

  use_heart_of_the_wild:
    label: "Auto Heart of the Wild"
    section: "Damage"
    type: checkbox
    default: true


  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 0

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2


  auto_prowl:
    label: "Auto Prowl (Stealth)"
    section: "Utility"
    type: checkbox
    default: true

  innervate_threshold:
    label: "Innervate Mana %"
    section: "Utility"
    type: slider
    min: 25
    max: 99
    default: 75


  thorn_bloom_threshold:
    label: "Thorn Bloom HP % (effective)"
    section: "Racials"
    type: slider
    min: 25
    max: 99
    default: 75

  thorn_bloom_members:
    label: "Thorn Bloom - Min Members"
    section: "Racials"
    type: slider
    min: 1
    max: 4
    default: 2


  use_trinket_1:
    label: "Auto Trinket 1 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2 (Before Convoke)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true


  loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

  auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  auto_rez:
    label: "Auto Revitalize / Rebirth (Mouseover)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Revitalize out of combat, Rebirth in combat, on the ally under your mouse."

  healthstone_pct:
    label: "Healthstone HP% (real HP)"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  health_potion_pct:
    label: "Health Potion HP% (real HP)"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  mana_potion_pct:
    label: "Mana Potion Mana%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 30


  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  protected_channel: player.casting.spell_id=740|player.casting.spell_id=323764|player.casting.spell_id=391528
  group_healthy: group.lowest.health.effective.pct>=config.catweave_group_hp
  can_catweave: (var.group_healthy|config.force_dps)&player.combat
  in_dps_form: buff.cat_form.up|buff.bear_form.up
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.unitframe
  has_soul: buff.soul_of_the_forest.up
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

  druid_shapeshift_root: player.rooted

lists:
  emergency:
    - barkskin,name="Barkskin (Emergency)",range_check=none,off_gcd=true,ignore_queue=true,if=health.effective.pct<=config.emergency_hp
    - healthstone,name="Healthstone (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=healthstone.ready&health.pct<=config.healthstone_pct
    - health_potion,name="Health Potion (Emergency)",off_gcd=true,ignore_queue=true,delay=250,if=health_potion.ready&health.pct<=config.health_potion_pct
    - stop_casting,name="Cut Cast (Emergency)",if=config.emergency_stop_casting&!var.protected_channel

  interrupts:
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - symbiotic_relationship,cycle=tanks,if=cycle.buff.symbiotic_relationship.down.any
    - lifebloom,name="OOC Lifebloom (Tank)",cycle=tanks,if=(player.inraid|player.indungeon)&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)
    - 774,name="OOC Rejuvenation",cycle=members,if=(player.inraid|player.indungeon)&cycle.health.effective.pct<config.ooc_heal_hp_pct&cycle.buff.rejuvenation.refreshable
    - regrowth,name="OOC Regrowth",cycle=members,if=(player.inraid|player.indungeon)&cycle.health.effective.pct<config.ooc_heal_hp_pct&pred.cycle.buff.regrowth.refreshable
    - call_action_list,name=abundance_maintenance
    - prowl,name="Auto Stealth",if=config.auto_prowl&!buff.prowl.up&!buff.travel_form.up&!buff.bear_form.up&!buff.incarnation_tree_of_life.up

  defensives:
    - barkskin,name="Barkskin",off_gcd=true,ignore_queue=true,if=incoming.pct>=config.barkskin_incoming_pct
    - 102342,name="Ironbark (Tank)",off_gcd=true,ignore_queue=true,cycle=tanks,if=config.ironbark_target=1&cycle.health.effective.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - 102342,name="Ironbark (Members)",off_gcd=true,ignore_queue=true,cycle=members,if=config.ironbark_target=2&cycle.health.effective.pct<config.ironbark_threshold&cycle.buff.ironbark.down
    - bear_form,name="Panic Bear",if=health.effective.pct<config.frenzied_regen_threshold&!buff.bear_form.up&(cooldown.frenzied_regeneration.ready|cooldown.heart_of_the_wild.ready)&!buff.incarnation_tree_of_life.up
    - heart_of_the_wild,name="HotW Bear (Panic)",if=buff.bear_form.up&health.effective.pct<config.frenzied_regen_threshold&cooldown.heart_of_the_wild.ready
    - frenzied_regeneration,name="Frenzied Regen",if=buff.bear_form.up&health.effective.pct<config.frenzied_regen_threshold

  racials:
    - shadowmeld,name="Shadowmeld (Aggro Drop)",if=target.threat>=3&!player.casting
    - berserking,name="Berserking (Haste CD)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - war_stomp,name="War Stomp (AoE CC)",if=interrupt.stun.aoe.check
    - bull_rush,name="Bull Rush (AoE CC)",if=interrupt.stun.aoe.check
    - haymaker,name="Haymaker (Interrupt/Knockback)",if=interrupt.target.check
    - darkflight,name="Darkflight (Movement)",if=player.moving&!buff.dash.up&!buff.stampeding_roar.up

  cooldowns:
    - natures_swiftness,name="Nature Swiftness",off_gcd=true,delay=150,range_check=none,if=!config.disable_natures_swiftness&group.count(cycle.health.effective.pct<config.natures_swiftness_threshold)>=1
    - regrowth,name="Nature Swift Regrowth",cycle=members,if=buff.natures_swiftness.up&cycle.health.effective.pct<config.natures_swiftness_threshold
    - 774,name="Reju Out Cat For Convoke",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&(buff.cat_form.up|buff.bear_form.up)
    - trinket_1,delay=150,name="Trinket 1",if=config.use_trinket_1&trinket_1.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - trinket_2,delay=150,name="Trinket 2",if=config.use_trinket_2&trinket_2.ready&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - combat_potion,delay=150,name="Combat Potion",if=combat_potion.ready&config.use_potion&(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up
    - convoke_the_spirits,global_delay=1000,name="Convoke (Heal)",if=(group.count(cycle.health.effective.pct<config.convoke_threshold&!cycle.tank)>=config.convoke_members)&!buff.cat_form.up&!buff.bear_form.up&!buff.moonkin_form.up
    - tranquility,global_delay=1000,name="Tranquility",if=!config.manual_tranquility&group.count(cycle.health.effective.pct<config.tranquility_threshold&!cycle.tank)>=config.tranquility_members&!player.moving
    - swiftmend.player,name="Self Swiftmend (Archdruid)",range_check=none,if=talent.power_of_the_archdruid&player.combat&cooldown.swiftmend.ready&!buff.abundance.up&(buff.rejuvenation.up|buff.regrowth.up|buff.wild_growth.up)
    - swiftmend,name="Swiftmend for SotF/Treants",cycle=members,if=cycle.health.effective.pct<config.swiftmend_threshold&(cycle.buff.rejuvenation.up|pred.cycle.buff.regrowth.up|pred.cycle.buff.wild_growth.up)

  active_healing:
    - wild_growth,name="Wild Growth",range_check=none,if=group.count(cycle.health.effective.pct<config.wild_growth_threshold&!cycle.tank)>=config.wild_growth_members
    - wild_growth,name="Wild Growth (Tank)",range_check=none,if=group.count(cycle.tank&cycle.health.effective.pct<config.wild_growth_threshold_tank)>=1

    - regrowth,name="Clearcasting Regrowth",cycle=members,if=player.combat&buff.clearcasting.up&cycle.health.effective.pct<99

    - regrowth,name="Regrowth Emergency",cycle=members,if=cycle.health.effective.pct<config.regrowth_emergency_threshold

    - 774,name="SotF Rejuvenation",cycle=members,if=var.has_soul&cycle.buff.rejuvenation.refreshable
    - 774,name="SotF Germination",cycle=members,if=var.has_soul&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)
    - regrowth,name="SotF Regrowth",cycle=members,if=var.has_soul&cycle.health.effective.pct<config.regrowth_threshold

    - efflorescence,name="Efflorescence (no Lifetreading)",range_check=none,if=talent.efflorescence&!talent.lifetreading&!totem.efflorescence.up

    - lifebloom.player,name="Self Lifebloom (Everbloom)",range_check=none,after=300,if=config.lifebloom_target=1&talent.everbloom&(buff.lifebloom.down|buff.lifebloom.remains<4.5)
    - lifebloom,name="Lifebloom (Tank)",cycle=tanks,if=config.lifebloom_target=2&(cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable)

    - 774.player,name="Self Rejuvenation (Photosynthesis)",range_check=none,if=talent.photosynthesis&player.combat&buff.rejuvenation.down

    - regrowth,name="Abundance Regrowth",cycle=members,if=buff.abundance.up&cycle.health.effective.pct<config.regrowth_threshold

    - 774,name="Rejuvenation",cycle=members,if=cycle.buff.rejuvenation.refreshable&(cycle.tank&cycle.health.effective.pct<config.rejuvenation_threshold_tank|!cycle.tank&cycle.health.effective.pct<config.rejuvenation_threshold)
    - 774,name="Germination",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&(cycle.tank&cycle.health.effective.pct<config.rejuvenation_threshold_tank|!cycle.tank&cycle.health.effective.pct<config.rejuvenation_threshold)
    - regrowth,name="Regrowth",cycle=members,if=(cycle.tank&cycle.health.effective.pct<config.regrowth_threshold_tank|!cycle.tank&cycle.health.effective.pct<config.regrowth_threshold)
    - thorn_bloom,name="Thorn Bloom",if=group.count(cycle.health.effective.pct<config.thorn_bloom_threshold&!cycle.tank)>=config.thorn_bloom_members

  utility:
    - innervate.player,name="Innervate",off_gcd=true,delay=150,range_check=none,if=talent.innervate&mana.pct<config.innervate_threshold&fight_remains>15
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  abundance_maintenance:
    - 774,name="Abundance Filler (Rejuv)",cycle=members,if=!buff.abundance.up&cycle.buff.rejuvenation.refreshable
    - 774,name="Abundance Filler (Germination)",cycle=members,if=!buff.abundance.up&talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)
    - 774,name="Abundance Filler (Rejuv Maintenance)",cycle=members,if=buff.abundance.up&buff.abundance.remains<5&cycle.buff.rejuvenation.remains<5
    - 774,name="Abundance Filler (Germination Maintenance)",cycle=members,if=talent.germination&buff.abundance.up&buff.abundance.remains<5&cycle.buff.rejuvenation.up&cycle.buff.rejuvenation_germination.remains<5

  catweave_st:
    - rip,name="Rip ST",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite ST",if=combo_points>=5
    - 1822,name="Rake ST",if=debuff.rake.refreshable
    - shred,name="Shred ST"

  catweave_aoe:
    - target_enemy,name="Search Bleed Target",if=combo_points>=5&!debuff.rip.refreshable&active_dot.rip<enemies.combat.8y
    - rip,name="Rip AoE",if=combo_points>=5&debuff.rip.refreshable
    - ferocious_bite,name="Bite AoE",if=combo_points>=5
    - 1822,name="Rake AoE",if=debuff.rake.refreshable
    - 106785,name="Swipe AoE",if=talent.swipe
    - shred,name="Shred AoE"

  catweave:
    - sunfire,name="Sunfire Refresh (Pre-Shift)",if=talent.sunfire&debuff.sunfire.refreshable&!buff.cat_form.up
    - moonfire,name="Moonfire Refresh (Pre-Shift)",if=debuff.moonfire.refreshable&!buff.cat_form.up
    - 1822,name="Fluid Rake",if=!buff.cat_form.up&!buff.incarnation_tree_of_life.up
    - cat_form,name="Manual Cat Shift",if=!talent.fluid_form&!buff.cat_form.up&!buff.incarnation_tree_of_life.up
    - return,if=!buff.cat_form.up

    - heart_of_the_wild,name="HotW Cat",if=config.use_heart_of_the_wild&talent.heart_of_the_wild&buff.cat_form.up
    - convoke_the_spirits,global_delay=150,name="Convoke (Offensive)",if=config.convoke_dps&buff.cat_form.up&cooldown.convoke_the_spirits.ready&target.time_to_die>10
    - call_action_list,name=catweave_aoe,if=enemies.combat.8y>=config.aoe_threshold
    - call_action_list,name=catweave_st,if=enemies.combat.8y<config.aoe_threshold

  ranged_dps:
    - starsurge,name="Starsurge",if=cooldown.starsurge.ready
    - sunfire,name="Sunfire Refresh",if=talent.sunfire&debuff.sunfire.refreshable
    - moonfire,name="Moonfire Refresh",if=debuff.moonfire.refreshable
    - starfire,name="Starfire Filler"

  moving:
    - lifebloom,name="Lifebloom Tank (Moving)",cycle=tanks,if=cycle.buff.lifebloom.down|cycle.buff.lifebloom.refreshable
    - 774,name="Rejuvenation (Moving)",cycle=members,if=cycle.buff.rejuvenation.refreshable&cycle.health.effective.pct<config.rejuvenation_threshold
    - 774,name="Germination (Moving)",cycle=members,if=talent.germination&cycle.buff.rejuvenation.up&(cycle.buff.rejuvenation_germination.down|cycle.buff.rejuvenation_germination.refreshable)&cycle.health.effective.pct<config.rejuvenation_threshold
    - call_action_list,name=abundance_maintenance,if=!var.can_catweave

  avatar_sethraliss:
    - 774.mouseover,name="Avatar Rejuvenation",range_check=mouseover,if=mouseover.buff.rejuvenation.refreshable
    - swiftmend.mouseover,name="Avatar Swiftmend",range_check=mouseover,if=mouseover.buff.rejuvenation.up|mouseover.buff.regrowth.up
    - regrowth.mouseover,name="Avatar Regrowth",range_check=mouseover,if=!player.moving

  mouseover_healing_emergency:
    - swiftmend.mouseover,name="Swiftmend (MO)",if=mouseover.buff.rejuvenation.remains>1|mouseover.buff.regrowth.remains>1|mouseover.buff.wild_growth.remains>1
    - 774.mouseover,name="Rejuvenation (MO)",if=mouseover.buff.rejuvenation.remains<=1.5
    - regrowth.mouseover,name="Regrowth (MO) Cast",if=!player.moving

  auto_rez:
    - revitalize,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat
    - rebirth.mouseover,if=mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat

  engine:
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.pause_travel_form&buff.travel_form.up

    - interact_target,delay=350,if=config.loot_nearby&target.lootable&target.range<=5&!player.combat
    - interact_target,delay=350,if=config.loot_nearby&loot_nearby&!player.combat
    - interact_mouseover,delay=350,if=config.loot_nearby&mouseover.lootable&mouseover.range<=5&!player.combat

    - natures_cure,delay=500,cycle=members,name="Nature's Cure",if=config.auto_dispel&cycle.dispelable.list
    - natures_cure,delay=500,cycle=members,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.affix_devour&cycle.debuff.440313.up.any

    - call_action_list,name=auto_rez,if=config.auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.healthstone_pct
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.health_potion_pct
    - mana_potion,delay=250,if=mana_potion.ready&mana.pct<=config.mana_potion_pct

    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=player.combat&config.auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  main:
    - bear_form,name="Root Cleanse (to Bear)",line_cd=8,if=config.root_cleanse&var.druid_shapeshift_root&!buff.bear_form.up&!buff.incarnation_tree_of_life.up
    - cancel_form,name="Root Cleanse (from Bear)",line_cd=8,if=config.root_cleanse&var.druid_shapeshift_root&buff.bear_form.up&!buff.incarnation_tree_of_life.up

    - call_action_list,name=emergency,if=player.combat&(player.casting|player.channeling)&health.effective.pct<=config.emergency_hp

    - return,if=player.channeling|player.casting|var.protected_channel
    - call_action_list,name=engine
    - call_action_list,name=out_of_combat,if=!player.combat

    - call_action_list,name=defensives,if=(!var.in_dps_form|!var.group_healthy)&!config.force_dps
    - call_action_list,name=utility
    - call_action_list,name=racials
    - call_action_list,name=cooldowns,if=(!var.in_dps_form|!var.group_healthy)&!config.force_dps
    - call_action_list,name=interrupts
    - call_action_list,name=avatar_sethraliss,if=mouseover.npcid=133392&mouseover.friendly&mouseover.debuff.1301199.down&mouseover.health.pct<100
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<config.mouseover_emergency_hp&(!var.in_dps_form|!var.group_healthy|config.force_dps)
    - call_action_list,name=moving,if=player.moving&(!var.in_dps_form|!var.group_healthy)&!config.force_dps
    - call_action_list,name=active_healing,if=(!var.in_dps_form|!var.group_healthy)&!config.force_dps
    - call_action_list,name=abundance_maintenance,if=player.combat&!config.force_dps

    - mark_of_the_wild,range_check=none,name="Mark of the Wild (low prio)",if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10


    - call_action_list,name=ranged_dps,if=config.ranged_dps&var.can_catweave&target.exists&target.alive&!target.friendly
    - call_action_list,name=catweave,if=config.melee_dps&var.can_catweave&target.exists&target.alive&!target.friendly&target.in_melee&!buff.incarnation_tree_of_life.up
