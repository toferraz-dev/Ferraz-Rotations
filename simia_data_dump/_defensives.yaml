# Dangerous debuffs on the player requiring defensive response
#
# Each entry has a list of tags. Tags are arbitrary strings used to filter
# which debuffs to react to via SimC expressions:
#   dangerous_debuff.up                    - player has ANY listed debuff
#   dangerous_debuff.down                  - player has NONE
#   dangerous_debuff.remains               - max remaining seconds
#   dangerous_debuff.count                 - count of active matches
#   dangerous_debuff.<tag>.up              - filtered by tag
#   dangerous_debuff.<tag1>.<tag2>.remains - multi-tag AND
#
# Examples:
#   tags: [physical, dot]                  -> dangerous_debuff.physical
#   tags: [magic]                          -> dangerous_debuff.magic.up
#   tags: [bleed, heavy]                   -> dangerous_debuff.bleed.heavy.up (multi-tag AND)

