version: 1

# Dangerous casts requiring defensive response
#
# Each entry has a list of tags. Tags are arbitrary strings used to filter
# which defensives to trigger via SimC expressions:
#   nameplate.casting            - matches ANY dangerous spell being cast
#   nameplate.casting.<tag>      - matches only spells with that tag
#
# Reserved tag:
#   targeting_me  - always enforced: spell must be targeting the player
#
# Examples:
#   tags: [aoe]                       -> nameplate.casting.aoe
#   tags: [targeting_me, dk_ams]      -> nameplate.casting.dk_ams (requires targeting)
#   tags: [tank_only]                 -> nameplate.casting.tank_only
#   tags: [magic, aoe]               -> nameplate.casting.magic.aoe (multi-tag AND)

