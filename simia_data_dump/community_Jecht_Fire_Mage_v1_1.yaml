version: 1.1
author: Jecht
class: Mage
spec: 63
name: Jecht Fire Mage v1.1
description: |
  v1.1:
  - OOC added : Arcane intellect + Blazing barrier.
  - Utility : Remove Curse.
  - => Recommend : add this macro for meteor in Kb : /cast [nochanneling] Single-Button Assistant. (WASD play)
  - Try anti hardcasting system
  - SimC APL
  - Management Fireblast system

entry: main

# ============================================================================
# CONFIG
# ============================================================================
config:
  hero_tree:
    label: "Hero Talent Tree"
    section: "Build"
    type: dropdown
    default: 0
    options:
      - label: "Auto-detect"
        value: 0
      - label: "Sunfury"
        value: 1
      - label: "Frostfire"
        value: 2


  combustion_sync:
    label: "Sync Meteor with Combustion"
    section: "Cooldowns"
    type: checkbox
    default: true


  combustion_wait_meteor_s:
    label: "Combustion wait for Meteor (sec)"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 8
    default: 3


  blazing_barrier_hp_pct:
    label: "Blazing Barrier HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 50


  greater_invis_hp_pct:
    label: "Greater Invisibility HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35


  ice_block_hp_pct:
    label: "Ice Block HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 20


  flamestrike_targets_sunfury:
    label: "FS Targets (Sunfury)"
    section: "AoE"
    type: slider
    min: 2
    max: 8
    default: 4


  flamestrike_targets:
    label: "FS Targets"
    section: "AoE"
    type: slider
    min: 2
    max: 10
    default: 3


  cleave_targets:
    label: "Cleave Threshold (treat as cleave if >= X enemies)"
    section: "AoE"
    type: slider
    min: 2
    max: 10
    default: 2


  heavy_aoe_targets:
    label: "Heavy AoE Threshold (use Flamestrike more aggressively if >= X enemies)"
    section: "AoE"
    type: slider
    min: 3
    max: 10
    default: 5


  flamestrike_targets_frostfire:
    label: "FS Targets (Frostfire)"
    section: "AoE"
    type: slider
    min: 2
    max: 8
    default: 4


  scorch_execute_hp_pct:
    label: "Scorch Execute HP%"
    section: "Rotation"
    type: slider
    min: 0
    max: 100
    default: 30


  enable_remove_curse:
    label: "Enable Remove Curse"
    section: "Utility"
    type: checkbox
    default: true


# ============================================================================
# VARIABLES
# ============================================================================
variables:
  enemies_40y: "enemies.combat.40y"
  is_cleave: "var.enemies_40y>=config.cleave_targets"
  is_heavy_aoe: "var.enemies_40y>=config.heavy_aoe_targets"
  flamestrike_ok: "var.enemies_40y>=config.flamestrike_targets"

  aoe_enemies: "enemies.combat.40y"

  # Hero tree detection
  is_sunfury: "(config.hero_tree=1)|(config.hero_tree=0&talent.spellfire_spheres)"
  is_frostfire: "(config.hero_tree=2)|(config.hero_tree=0&talent.frostfire_bolt)"

  # Convenience
  cleave: "active_enemies>=2"
  aoe_sf: "active_enemies>=config.flamestrike_targets_sunfury"
  aoe_ff: "active_enemies>=config.flamestrike_targets_frostfire"
  execute: "target.health.pct<=(config.scorch_execute_hp_pct)"

  # SimC-style timing
  cast_remains_time: "0.2"
  pooling_time: "10*gcd.max"

  # Combustion precast time (used for better oGCD timing)
  combustion_precast_time: "(action.scorch.cast_time*!buff.pyroclasm.up*var.execute)+(action.fireball.cast_time*!buff.pyroclasm.up*!var.execute)+(action.pyroblast.cast_time*buff.pyroclasm.up)-var.cast_remains_time"

  # Flamestrike thresholds (SimC uses different thresholds depending on build)
  ff_combustion_flamestrike: "config.flamestrike_targets_frostfire+(999*!talent.fuel_the_fire)"
  ff_filler_flamestrike: "config.flamestrike_targets_frostfire+(999*!talent.fuel_the_fire)"
  sf_combustion_flamestrike: "config.flamestrike_targets_sunfury+(999*!talent.fuel_the_fire)"
  sf_filler_flamestrike: "config.flamestrike_targets_sunfury+(999*!talent.fuel_the_fire)"

  # Delay Combustion to stack buffs unless it costs a Combustion cast (SimC logic)
  combustion_delay: "10+(8*talent.firestarter)-(10*(expected_combat_length<60)+10*(expected_combat_length<30))-10*(((expected_combat_length%%60)>=25)&((expected_combat_length%%60)<=40))"

  # Trinket detection (SimC categories)
  steroid_trinket_equipped: "equipped.nevermelting_ice_crystal|equipped.lily_of_the_eternal_weave|equipped.sunblood_amethyst|equipped.astral_gladiators_badge_of_ferocity|equipped.arazs_ritual_forge|equipped.freightrunners_flask|equipped.emberwing_feather|equipped.vaelgors_final_stare|equipped.galactic_gladiators_badge_of_ferocity|equipped.ever_collapsing_void_fissure|equipped.signet_of_the_priory|equipped.incorporeal_essencegorger|equipped.sealed_chaos_urn"
  steroid_20s: "equipped.signet_of_the_priory|equipped.incorporeal_essencegorger|equipped.sealed_chaos_urn"
  steroid_15s: "equipped.lily_of_the_eternal_weave|equipped.sunblood_amethyst|equipped.astral_gladiators_badge_of_ferocity|equipped.arazs_ritual_forge|equipped.freightrunners_flask|equipped.emberwing_feather|equipped.vaelgors_final_stare|equipped.galactic_gladiators_badge_of_ferocity"
  steroid_10s: "equipped.ever_collapsing_void_fissure"
  steroid_12s: "equipped.nevermelting_ice_crystal"
  nonsteroid_trinket_equipped: "equipped.mereldars_toll|equipped.perfidious_projector|equipped.chaotic_nethergate|equipped.wraps_of_cosmic_madness|equipped.astalors_anguish_agitator"

  has_fired_up: "talent.fired_up"

# ============================================================================
# LISTS
# ============================================================================
lists:

  # ==================================================================
  # SANITY CHECKS — keep structure identical, but don't block while casting
  # ==================================================================
  sanity_checks:
    # Cancel accidental hard casts
    - stop_casting,if=action.pyroblast.executing&buff.hot_streak.down&buff.pyroclasm.down
    - stop_casting,if=action.flamestrike.executing&buff.hot_streak.down
    - call_action_list,name=emergency

  # ==================================================================
  # SPELL QUEUE — queue Hot Streak spenders during hardcasts
  # ==================================================================
  spell_queue:
    - queue_spell,spell=flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&((var.is_frostfire&var.aoe_ff)|(var.is_sunfury&var.aoe_sf))&buff.hot_streak.up&(player.casting|player.channeling)
    - queue_spell,spell=pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up&(player.casting|player.channeling))

    # Queue Combustion at the end of the current hardcast (addon limitation: can't press true oGCD while casting).
    - queue_spell,spell=combustion,if=cooldown.combustion.ready&player.combat&target.valid&target.time_to_die>12&(player.casting&player.casting.remains<=var.cast_remains_time|player.channeling&player.channeling.remains<=var.cast_remains_time)

  # ==================================================================
  # EMERGENCY — instant defensives, callable anywhere
  # ==================================================================
  emergency:
    - ice_block,range_check=none,interrupt=true,if=health.pct<=config.ice_block_hp_pct
    - greater_invisibility,range_check=none,interrupt=true,if=health.pct<=config.greater_invis_hp_pct&cooldown.ice_block.down

  # ==================================================================
  # DEFENSIVES — full defensive chain
  # ==================================================================
  defensives:
    # Remove Curse
    - remove_curse,unit=player,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party1,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party2,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party3,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party4,if=config.enable_remove_curse&debuff.curse.up

    - ice_block,range_check=none,if=health.pct<=config.ice_block_hp_pct
    - greater_invisibility,range_check=none,if=health.pct<=config.greater_invis_hp_pct&cooldown.ice_block.down

    # Proactive Barrier
    - blazing_barrier,range_check=none,if=buff.blazing_barrier.down&player.combat

    # Dangerous cast detection
    - blazing_barrier,range_check=none,if=defensives.ready&buff.blazing_barrier.down
    - greater_invisibility,range_check=none,if=defensives.ready&buff.blazing_barrier.up&buff.combustion.down
    - blazing_barrier,range_check=none,if=defensives.ready.aoe&buff.blazing_barrier.down

    # Reactive HP thresholds
    - blazing_barrier,range_check=none,if=health.pct<=config.blazing_barrier_hp_pct&buff.blazing_barrier.down
    - greater_invisibility,range_check=none,if=health.pct<=config.greater_invis_hp_pct&buff.combustion.down
    - ice_block,range_check=none,if=health.pct<=config.ice_block_hp_pct

  # ==================================================================
  # MOVEMENT — WASD-friendly: only instant / mobile casts
  # ==================================================================
  movement:
    - call_action_list,name=emergency

    # Spend Hot Streak first while moving
    - flamestrike,if=var.flamestrike_ok&buff.hot_streak.up,ignore_movement=true
    - pyroblast,if=!var.flamestrike_ok&buff.hot_streak.up,ignore_movement=true

    # Keep Fire Blast logic while moving
    - fire_blast,use_off_gcd=1,use_while_casting=1,interrupt=true,ignore_movement=true,if=state.rotation&(buff.heating_up.up&buff.hot_streak.down)

    # Moving filler: Scorch replaces Fireball
    - scorch,ignore_movement=true
    - return

  fireblast:

    # Convert Heating Up -> Hot Streak (works while hardcasting)
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(buff.heating_up.up&buff.hot_streak.down&gcd.remains<gcd.max)

    # Pooling window: if Combustion is soon, prefer to keep charges for it (avoid over-spending)
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(cooldown.combustion.remains>8&buff.hot_streak.down&cooldown.fire_blast.charges_fractional>=2.9)

    # During Combustion, keep chain going
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(buff.combustion.up&buff.hot_streak.down&cooldown.fire_blast.charges_fractional>=1.2&gcd.remains<gcd.max)

  trinkets:
    # Steroid trinkets during Combustion
    - trinket_1,if=trinket_1.sync&(buff.combustion.remains>6|fight_remains<20)
    - trinket_2,if=trinket_2.sync&(buff.combustion.remains>6|fight_remains<20)

    # End-of-fight steroid dumps by duration bucket
    - trinket_1,if=trinket_1.sync&fight_remains<21&var.steroid_20s
    - trinket_2,if=trinket_2.sync&fight_remains<21&var.steroid_20s
    - trinket_1,if=trinket_1.sync&fight_remains<16&var.steroid_15s
    - trinket_2,if=trinket_2.sync&fight_remains<16&var.steroid_15s
    - trinket_1,if=trinket_1.sync&fight_remains<13&(var.steroid_12s|var.steroid_10s)
    - trinket_2,if=trinket_2.sync&fight_remains<13&(var.steroid_12s|var.steroid_10s)

    # Non-steroid trinkets outside Combustion
    - trinket_1,if=trinket_1.sync&var.nonsteroid_trinket_equipped&((buff.combustion.down&cooldown.combustion.remains>20)|!var.steroid_trinket_equipped)
    - trinket_2,if=trinket_2.sync&var.nonsteroid_trinket_equipped&((buff.combustion.down&cooldown.combustion.remains>20)|!var.steroid_trinket_equipped)

  # ==================================================================
  # CDS — potion / racials / items / external buffs
  # ==================================================================
  cds:
    - call_action_list,name=emergency

    - mirror_image,range_check=none,if=cooldown.mirror_image.ready


    # If we can, make Meteor land during Combustion.
    # Engine can't truly oGCD while casting, so we *queue* Combustion right after this Meteor window.
    - meteor,range_check=none,if=config.combustion_sync&cooldown.meteor.ready&cooldown.combustion.ready&(cooldown.meteor.ready&(buff.bloodlust.up|(active_enemies>=4)))

    # Combustion: optionally wait a tiny window for Meteor if it's almost ready.
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&target.valid&target.time_to_die>12&(!config.combustion_sync|cooldown.meteor.remains>config.combustion_wait_meteor_s)

    # Meteor on CD when not syncing or when Combustion is far.
    - meteor,range_check=none,if=cooldown.meteor.ready&(!config.combustion_sync|buff.combustion.up|cooldown.combustion.remains>15)

  ff_combustion:
    # Start Combustion at end of a cast / just before Meteor lands
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&target.valid&target.time_to_die>12

    # Precast into Combustion: prioritize Pyroclasm if available
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.ff_combustion_flamestrike&(buff.pyroclasm.up&!buff.hot_streak.up&buff.combustion.down)
    - pyroblast,if=!var.flamestrike_ok&buff.pyroclasm.up&!buff.hot_streak.up&buff.combustion.down
    - frostfire_bolt,if=talent.frostfire_bolt&buff.combustion.down

    # Meteor: end of Combustion for Burnout, otherwise ensure it lands inside
    - meteor,if=(talent.burnout&buff.combustion.remains<8)|(!talent.burnout&buff.combustion.remains>2)

    # Spend Hot Streak
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.ff_combustion_flamestrike&(buff.hot_streak.up)
    - pyroblast,if=!var.flamestrike_ok&buff.hot_streak.up

    # Make sure Pyroclasm finishes before Combustion ends
    - flamestrike,if=buff.hot_streak.up&var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.ff_combustion_flamestrike&(buff.pyroclasm.up&cast_time<buff.combustion.remains)
    - pyroblast,if=buff.pyroclasm.up&cast_time<buff.combustion.remains

    # Mobility/execute inside Combustion
    - scorch,if=var.execute
    - frostfire_bolt,if=talent.frostfire_bolt

    - call_action_list,name=fireblast

  # ==================================================================
  # FROSTFIRE FILLER
  # ==================================================================
  ff_filler:
    # Meteor on CD starting from first Combustion
    - meteor,if=time>=(var.combustion_delay-gcd.max)

    # During Firestarter, only use Pyroblast as spender even for AoE
    - pyroblast,if=!var.flamestrike_ok&buff.hot_streak.up&talent.firestarter&time<var.combustion_delay

    # Hold Hot Streak if Combustion is soon (unless intentionally delayed)
    # Hold Hot Streak if Combustion is soon (unless intentionally delayed)
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.ff_filler_flamestrike&(buff.hot_streak.up&(cooldown.combustion.remains>=5|time<var.combustion_delay))
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up&(cooldown.combustion.remains>=5|time<var.combustion_delay))

    # Pyroclasm: spend at 2 stacks, otherwise hold if it will last into Combustion
    - flamestrike,if=buff.hot_streak.up&var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.ff_filler_flamestrike&(buff.pyroclasm.up&((cooldown.combustion.remains>12)|buff.pyroclasm.stack=2))
    - pyroblast,if=buff.pyroclasm.up&((cooldown.combustion.remains>12)|buff.pyroclasm.stack=2)

    - scorch,if=var.execute
    - frostfire_bolt,if=talent.frostfire_bolt

    - call_action_list,name=fireblast

  # ==================================================================
  # SUNFURY COMBUSTION (default)
  # ==================================================================
  sf_combustion:
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&target.valid&target.time_to_die>12

    # Precast Meteor into Combustion with BL in AoE (non Sunfury Execution)
    - meteor,if=buff.bloodlust.up&buff.combustion.down&(talent.blast_zone|active_enemies>=4)&!talent.sunfury_execution

    # Precast Pyroclasm into Combustion
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.sf_combustion_flamestrike&(buff.combustion.down&!buff.hot_streak.up&buff.pyroclasm.up)
    - pyroblast,if=!var.flamestrike_ok&buff.combustion.down&!buff.hot_streak.up&buff.pyroclasm.up

    # Scorch for guaranteed crit timing in Combustion
    - scorch,if=var.execute

    # If precasting Meteor into Combustion, fit a Fireball unless BL
    - fireball,if=buff.combustion.down&(!prev_gcd.1.meteor|buff.bloodlust.down)

    # Meteor timing for Burnout
    - meteor,if=(talent.burnout&buff.combustion.remains<8|!talent.burnout&buff.combustion.remains>2)|buff.combustion.remains>2&active_enemies>=4

    # Spend Hot Streaks: Pyroblast ST, Flamestrike AoE
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.sf_combustion_flamestrike&(buff.hot_streak.up)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up)

    # Ensure Pyroclasm finishes before Combustion ends
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.sf_combustion_flamestrike&(buff.pyroclasm.up&!buff.hot_streak.up&cast_time<buff.combustion.remains)
    - pyroblast,if=!var.flamestrike_ok&buff.pyroclasm.up&!buff.hot_streak.up&cast_time<buff.combustion.remains

    - scorch,if=var.execute
    - fireball

    # Fire Blast usage: avoid when hardcasting Flamestrike in AoE; prioritize Pyroclasm on 2 stacks
    - call_action_list,name=fireblast,if=state.rotation&(!talent.pyroclasm|(buff.pyroclasm.stack<2|action.pyroblast.executing&action.pyroblast.execute_remains>0.2&buff.pyroclasm.stack=2|cooldown.fire_blast.charges_fractional>=2|buff.combustion.remains<action.pyroblast.cast_time)&(active_enemies<var.sf_combustion_flamestrike|buff.pyroclasm.down|!action.flamestrike.executing))

  # ==================================================================
  # SUNFURY FILLER
  # ==================================================================
  sf_filler:
    # In AoE, outside BL, Meteor into a hardcast as a precast for Combustion
    - meteor,if=active_enemies>=4&time>var.combustion_delay&cooldown.combustion.remains<=gcd.max+var.combustion_precast_time&buff.bloodlust.down

    # During Firestarter, only Pyroblast as spender (even AoE)
    - pyroblast,if=!var.flamestrike_ok&buff.hot_streak.up&talent.firestarter&time<var.combustion_delay

    # Spend Hot Streaks (Hyperthermia counts as "react")
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.sf_filler_flamestrike&(buff.hot_streak.up|buff.hyperthermia.up)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|buff.hyperthermia.up)

    # Pyroclasm usage
    - flamestrike,if=buff.hot_streak.up&var.flamestrike_ok&talent.fuel_the_fire&active_enemies>=var.sf_filler_flamestrike&buff.pyroclasm.up&((cooldown.combustion.remains>=12|time<var.combustion_delay&(talent.firestarter|time>(var.combustion_delay-action.flamestrike.cast_time)))|buff.pyroclasm.stack=2)
    - pyroblast,if=buff.pyroclasm.up&(cooldown.combustion.remains>=12|time<var.combustion_delay&(talent.firestarter|time>(var.combustion_delay-action.pyroblast.cast_time)))|buff.pyroclasm.stack=2

    # Meteor usage with Blast Zone / Sunfury Execution
    - meteor,if=(!talent.blast_zone&talent.sunfury_execution&cooldown.combustion.remains<12&buff.pyroclasm.stack<2)|(talent.blast_zone&time>var.combustion_delay)

    # Scorch execute / Heat Shimmer proc
    - scorch,if=var.execute

    - scorch,if=player.moving|moving,ignore_movement=true
    - fireball,if=!(player.moving|moving)

    - call_action_list,name=fireblast

  # ==================================================================
  # MAIN — entry point (cloned structure)
  # ==================================================================
  main:
    - call_action_list,name=dispel_curse
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    # Fire Blast is an oGCD that must be usable while hardcasting (snapshot shows Heating Up during Fireball casts)

    # Hard stops
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=buff.travel_form.up

    # OOC utility (looting / targeting)
    - interact_target,if=!player.combat&target.lootable&target.range<=5
    - interact_target,if=!player.combat&loot_nearby
    - interact_mouseover,if=!player.combat&mouseover.lootable&mouseover.range<=5
    - call_action_list,name=auto_target

    # Precombat safe buff
    - arcane_intellect,range_check=none,if=buff.arcane_intellect.down
    - blazing_barrier,range_check=none,if=buff.blazing_barrier.down

    # Combat gate — do not pull unless auto-combat allows it
    - return,if=!player.combat&config.auto_combat.has(0)
    - return,if=!player.combat&!((config.auto_combat.has(1)&target.quest_mob&target.enemy)|(config.auto_combat.has(2)&target.combat&target.enemy)|(config.auto_combat.has(3)&player.auto_attacking&target.enemy))

    # ============================================================
    # FIRE BLAST (oGCD) — ONLY when rotation toggle is ON
    # ============================================================
    - call_action_list,name=fireblast,if=state.rotation&player.combat

    # Precombat offensive (only if gate passed)
    - mirror_image,range_check=none,if=!player.combat&cooldown.mirror_image.ready

    # Defensives
    - call_action_list,name=defensives

    # Interrupts (same structure)
    - counterspell,if=config.interrupt_target&(config.interrupt_all&target.casting.interruptible|interrupts.target.ready)&target.casting.elapsed>=0.2&(target.casting.remains<1|target.channeling)
    - counterspell.mouseover,if=config.interrupt_mouseover&(config.interrupt_all&mouseover.casting.interruptible|interrupts.mouseover.ready)&mouseover.casting.elapsed>=0.2&(mouseover.casting.remains<1|mouseover.channeling)
    - counterspell.focus,if=config.interrupt_focus&(config.interrupt_all&focus.casting.interruptible|interrupts.focus.ready)&focus.casting.elapsed>=0.2&(focus.casting.remains<1|focus.channeling)

    # Utility
    - spellsteal,if=target.has_stealable&target.enemy
    - remove_curse,cycle=party,if=config.enable_remove_curse&cycle.dispelable.curse

    # In-combat target reacquisition
    - target_enemy,if=player.combat&!target.valid&enemies.combat.40y>=1
    - target_enemy,if=player.combat&target.dead&enemies.combat.40y>=1
    - return,if=!target.valid

    # Movement: use Scorch instead of Fireball while moving
    - call_action_list,name=movement,if=(player.moving|moving)&target.valid

    # Movement: use Scorch instead of Fireball while moving

    # Movement

    # CDs / potion / racials / trinkets
    - call_action_list,name=cds
    - call_action_list,name=trinkets

    # Combustion logic: delayed on pull by combustion_delay unless ready later
    - run_action_list,name=ff_combustion,if=talent.frostfire_bolt&(time>=var.combustion_delay)&(buff.combustion.up|cooldown.combustion.ready)
    - run_action_list,name=sf_combustion,if=!talent.frostfire_bolt&(time>=var.combustion_delay)&(buff.combustion.up|cooldown.combustion.ready)

    # Filler
    - run_action_list,name=ff_filler,if=talent.frostfire_bolt
    - run_action_list,name=sf_filler