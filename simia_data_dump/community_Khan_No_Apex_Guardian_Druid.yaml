version: "1.0.7"
author: Khan
spec: 104
name: Khan No Apex Guardian Druid
patch: "12.0.5"
description: "High uptime with extra sauce See Discord for details- No Apex"
entry: main

config:
  starfall_combo:
    type: toggle
    label: "Starfall Combo"
    description: "Auto Stampeding Roar + HotW Moonkin combo on big pulls"
    spell: 77764

  barkskin_hp_pct:
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 70

  barkskin_on_cd:
    label: "Barkskin on Cooldown"
    type: checkbox
    default: true

  frenzied_regeneration_hp_pct:
    label: "Frenzied Regeneration HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  frenzied_regen_proactive:
    label: "Frenzied Regen (Proactive Shield)"
    type: checkbox
    default: true

  survival_instincts_hp_pct:
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  travel_form_mode:
    label: "Auto Travel Form"
    type: checkbox
    default: true

  MO_moonfire:
    label: "Moonfire on MO"
    type: checkbox
    default: true

  allow_pull_with_mo:
    label: "Pull with MO"
    type: checkbox
    default: true

variables:

lists:
  defensives:
    - survival_instincts,range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - frenzied_regeneration,range_check=none,if=health.pct<=config.frenzied_regeneration_hp_pct&buff.frenzied_regeneration.down
    - barkskin,range_check=none,if=config.barkskin_on_cd&buff.bear_form.up&player.combat&target.enemy
    - barkskin,range_check=none,if=!config.barkskin_on_cd&buff.bear_form.up&player.combat&target.enemy&health.pct<=config.barkskin_hp_pct

  cooldowns:
    - convoke_the_spirits
    - berserk,if=!cooldown.heart_of_the_wild.up&(talent.heart_of_the_wild.enabled)|!talent.ravage.enabled|!talent.heart_of_the_wild.enabled
    - incarnation_guardian_of_ursoc,if=debuff.thrash.stack>=2
    - sundering_roar,if=talent.sundering_roar&debuff.thrash.stack>=5
    - wild_guardian,if=(buff.ravage.up&talent.ravage.enabled)|!talent.ravage.enabled
    - blood_fury
    - berserking
    - fireblood
    - ancestral_call

  starfall:
    - stampeding_roar,range_check=none,if=cooldown.heart_of_the_wild.ready
    - moonkin_form,range_check=none,if=!buff.moonkin_form.up&cooldown.heart_of_the_wild.ready
    - heart_of_the_wild,range_check=none,if=buff.moonkin_form.up
    - bear_form,range_check=none,if=!buff.bear_form.up&buff.stampeding_roar.remains>=3

  bear:
    - bear_form,range_check=none,if=!buff.bear_form.up
    - lunar_beam,if=player.standing.time>=1
    - thrash
    - ironfur,use_off_gcd=1,if=rage>=50
    - frenzied_regeneration,range_check=none,if=config.frenzied_regen_proactive&talent.natural_resilience&buff.frenzied_regeneration.down&cooldown.thrash.remains>1&(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)
    - mangle,if=talent.soul_of_the_forest.enabled
    - moonfire,delay=400

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - mark_of_the_wild,delay=400,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - travel_form,after=200,range_check=none,if=config.travel_form_mode&!player.combat&player.inopenworld&mount_usable&buff.travel_form.down&!target.quest_mob&!target.dummy
    - call_action_list,name=starfall,if=config.starfall_combo&talent.heart_of_the_wild.enabled&!buff.heart_of_the_wild.up
    - bear_form,range_check=none,if=buff.bear_form.down&(target.attackable|enemies.40y)
    - moonfire.mouseover,delay=400,if=config.MO_moonfire&config.allow_pull_with_mo&mouseover.enemy&mouseover.alive&mouseover.debuff.moonfire.down
    - return,if=auto_combat.player
    - bear_form,delay=400,range_check=none,if=buff.bear_form.down&(target.attackable|enemies.40y)
    - call_action_list,name=defensives
    - skull_bash,if=interrupt.target.check
    - skull_bash.mouseover,if=interrupt.mouseover.check
    - skull_bash.focus,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check
    - call_action_list,name=auto_heal
    - return,if=auto_combat.target
    - call_action_list,name=cooldowns
    - call_action_list,name=bear,if=buff.bear_form.up
