version: 1.464
author: Jecht
class: Mage
spec: 63
name: Jecht Fire Mage v1.464
description: Fire Mage 12.1 M+ and raid
 
entry: main

# ============================================================================
# CONFIG
# ============================================================================
config:
  recommendations_macro:
    label: "In Keybind > edit macro : Meteor at target location :"
    section: "Macro"
    type: copy_text
    text: "/cast [nochanneling] Single-Button Assistant"

  recommended_talents M+:
    section: "Talents M+"
    type: copy_text
    label: "Recommended Talent String M+"
    text: "C8DAche08tHz49KSVf7iKFnyuNzwYZmZmFMzIzMzMAAAGAwMz0sstNDAwmZmx2MzMzYDAAAAALmZmZAAgZMmZmZMzsNAMzQYMgZYMA"

  recommended_talents Raid:
    section: "Talents Raid"
    type: copy_text
    label: "Recommended Talent String Raid"
    text: "C8DAAAAAAAAAAAAAAAAAAAAAAYGGLzMzswMzIzMzAAAwAAmZmmlttZAA2MzM2mZmZGLAAAAAYxMjZAAgZMmZmZMzsMAMzQGjBMDjB"

  hero_tree:
    label: "Hero Talent Tree"
    section: "Build"
    type: dropdown
    default: 0
    options:
      - label: "Auto-detect"
        value: 0
      - label: "Sunfury"
        value: 1
      - label: "Frostfire"
        value: 2

  combustion_sync:
    label: "Sync Meteor with Combustion"
    section: "Cooldowns"
    type: checkbox
    default: true

  combustion_wait_meteor_s:
    label: "Combustion wait for Meteor (sec)"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 8
    default: 4

  meteor_macro_delay:
    label: "Meteor Macro Offset (ms)"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 2000
    default: 500

  spell_queue_window:
    label: "Spell Queue Window (ms) - match addon's Cast/Channel Overlap"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 1000
    default: 400

  enable_mirror_image:
    label: "Enable Mirror Image"
    section: "Cooldowns"
    type: checkbox
    default: false

  enable_racials:
    label: "Enable Offensive Racials"
    section: "Cooldowns"
    type: checkbox
    default: true

  racials_sync_combustion:
    label: "Sync Racials with Combustion"
    section: "Cooldowns"
    type: checkbox
    default: true

  enable_trinkets:
    label: "Enable Trinket On-Use"
    section: "Cooldowns"
    type: checkbox
    default: true

  blazing_barrier_hp_pct:
    label: "Blazing Barrier HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 50

  blazing_barrier_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Blazing Barrier (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  ice_block_hp_pct:
    label: "Ice Block HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 20

  ice_block_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Ice Block (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 65

  enable_remove_curse:
    label: "Enable Remove Curse"
    section: "Utility"
    type: checkbox
    default: false

  enable_spellsteal:
    label: "Enable Spellsteal"
    section: "Utility"
    type: checkbox
    default: false

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  flamestrike_threshold: "3"
  # enemies.around_target measures enemies clustered near the CURRENT TARGET (8y from its center by default,
  # which lines up with Flamestrike's own radius) - not just "in combat somewhere within 40y of me" like
  # enemies.combat.40y did. That old metric could say "AoE is fine" even when the other combat-flagged
  # enemies were nowhere near where Flamestrike actually lands (centered on target).
  flamestrike_ok: "enemies.around_target>=var.flamestrike_threshold"

  # Known long-standing bug: a hard-cast Flamestrike (Pyroclasm) queued straight into ANOTHER Hot Streak
  # Flamestrike (the Double Pyroblast setup) does not correctly trigger the double-crit -> fresh Hot Streak
  # chain. Cross-spell chaining (e.g. hard-cast Flamestrike into a Hot Streak Pyroblast, or vice versa) is fine -
  # only the exact same spell back-to-back is affected. This detects "currently mid-cast of a Flamestrike" so
  # the queue can fall back to Pyroblast instead in that one specific case.
  flamestrike_chain_bugged: "player.casting.spell_id=1254851"
  flamestrike_will_fire: "var.flamestrike_ok&talent.fuel_the_fire&!var.flamestrike_chain_bugged"
  
  is_sunfury: "(config.hero_tree=1)|(config.hero_tree=0&talent.spellfire_spheres)"
  is_frostfire: "(config.hero_tree=2)|(config.hero_tree=0&talent.frostfire_bolt)"
  
  execute: "target.health.pct<=30"

  # Pyroclasm has 2 charges (stacks) as of 12.1. If we're mid-cast of a Pyroblast/Flamestrike that was
  # itself triggered by Pyroclasm, that cast is about to consume one charge on landing, but buff.pyroclasm.stack
  # won't decrement until the cast actually resolves. queue_spell evaluates the NEXT spell while still mid-cast,
  # so relying on .up/.remains>0 alone lets it queue a second Pyroclasm-gated cast off a charge that's about to be gone.
  # This subtracts the charge the current cast is about to spend before checking if any remain.
  # NOTE: action.SPELL.executing is not a valid expression in this engine - detect the in-flight cast via its
  # spell_id instead (Pyroblast=11366, Flamestrike=1254851 - confirmed via live snapshot SPELLS section;
  # the classic ID 2120 no longer matches in-game and silently never triggered this guard).
  pyroclasm_stacks_after_current_cast: "buff.pyroclasm.stack-((player.casting.spell_id=11366|player.casting.spell_id=1254851)*1)"
  # Cross-check stack against the buff's own up/down flag as a redundant guard: both must agree the proc is
  # actually still there before we hardcast off it.
  pyroclasm_ready: "var.pyroclasm_stacks_after_current_cast>=1&buff.pyroclasm.up"
  
  # meteor_macro_delay and spell_queue_window are configured in milliseconds (integer slider - the addon's
  # slider only offers whole-number steps, and a 0-1 or 0-2 SECOND range left only 0/1/2 as selectable values,
  # not the sub-second precision this needs). Everything they're compared against (player.casting.remains,
  # cooldown.X.remains, gcd.max, etc.) is in SECONDS, so convert once here and use the seconds versions everywhere.
  meteor_macro_delay_s: "config.meteor_macro_delay/1000"
  spell_queue_window_s: "config.spell_queue_window/1000"

  # How close to the end of the current cast we lock in the NEXT queued spell's decision. This must match
  # (or be slightly above) your addon's own "Cast Overlap"/"Channel Overlap" setting (Behavior panel), since
  # that's when the addon actually presses the button. If our window is smaller than the addon's overlap,
  # the addon presses based on a not-yet-final read of the game state, causing flip-flopping recommendations
  # right at the cast boundary (visible as rapid action-switching in your addon's log).
  cast_remains_time: "var.spell_queue_window_s"
  combustion_delay: "10+(8*talent.firestarter)-(10*(expected_combat_length<60))"

  # Seconds since Meteor was last cast (0 = just cast, grows until it's ready again).
  meteor_elapsed: "cooldown.meteor.duration-cooldown.meteor.remains"
  # Combustion is only allowed once Meteor has actually been cast (cooldown.meteor.down),
  # and only while that Meteor cast is still "fresh" (within combustion_wait_meteor_s seconds).
  # Once that window closes, Combustion is locked out again until Meteor is relaunched.
  meteor_synced: "!config.combustion_sync|(cooldown.meteor.down&var.meteor_elapsed<=config.combustion_wait_meteor_s)"

  # When Combustion is off cooldown and Meteor is the ONLY thing blocking it (not synced yet), losing time here
  # costs a whole Combustion window over a long fight. In that specific state, Meteor should jump ahead of
  # Hot Streak/Pyroclasm spenders instead of waiting its normal turn - a Hot Streak proc can safely wait one
  # extra GCD, Combustion uptime can't.
  meteor_priority_boost: "config.combustion_sync&cooldown.combustion.ready&!var.meteor_synced&cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid"

# ============================================================================
# LISTS
# ============================================================================
lists:
  sanity_checks:
    - stop_casting,if=player.combat&player.casting.spell_id=11366&buff.hot_streak.down&buff.hyperthermia.down&buff.pyroclasm.down
    - stop_casting,if=player.combat&player.casting.spell_id=1254851&buff.hot_streak.down&buff.hyperthermia.down&!buff.pyroclasm.up
    - call_action_list,name=emergency

  spell_queue:
    - queue_spell,spell=flamestrike,if=var.flamestrike_will_fire&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)&(player.casting&player.casting.remains<=var.cast_remains_time|player.channeling&player.channeling.remains<=var.cast_remains_time)
    - queue_spell,spell=pyroblast,if=!var.flamestrike_will_fire&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)&(player.casting&player.casting.remains<=var.cast_remains_time|player.channeling&player.channeling.remains<=var.cast_remains_time)
    - queue_spell,spell=combustion,if=cooldown.combustion.ready&player.combat&target.valid&var.meteor_synced&(player.casting&player.casting.remains<=var.cast_remains_time|player.channeling&player.channeling.remains<=var.cast_remains_time)

  emergency:
    - ice_block,range_check=none,interrupt=true,if=health.pct<=config.ice_block_hp_pct

  defensives:
    - remove_curse,unit=player,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party1,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party2,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party3,if=config.enable_remove_curse&debuff.curse.up
    - remove_curse,unit=party4,if=config.enable_remove_curse&debuff.curse.up
    - ice_block,range_check=none,if=health.pct<=config.ice_block_hp_pct
    - blazing_barrier,range_check=none,if=buff.blazing_barrier.down&player.combat
    - blazing_barrier,range_check=none,if=incoming.mitigated.pct>=config.blazing_barrier_dmg_pct
    - ice_block,range_check=none,if=incoming.mitigated.pct>=config.ice_block_dmg_pct

  movement:
    - call_action_list,name=emergency
    - meteor,range_check=none,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&(buff.hot_streak.up|buff.hyperthermia.up),ignore_movement=true
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|buff.hyperthermia.up),ignore_movement=true
    - fire_blast,use_off_gcd=1,use_while_casting=1,interrupt=true,ignore_movement=true,if=state.rotation&(buff.heating_up.up&buff.hot_streak.down&gcd.remains<gcd.max)
    - scorch,ignore_movement=true
    - return

  fireblast:
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(buff.heating_up.up&buff.hot_streak.down&gcd.remains<gcd.max)
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(player.casting.spell_id=11366|player.casting.spell_id=1254851)&(buff.hyperthermia.up|buff.pyroclasm.up)&buff.hot_streak.down
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(cooldown.combustion.remains>8&buff.hot_streak.down&cooldown.fire_blast.charges_fractional>=2.9)
    - fire_blast,ignore_movement=true,use_off_gcd=1,use_while_casting=1,interrupt=true,if=state.rotation&(buff.combustion.up&buff.hot_streak.down&cooldown.fire_blast.charges_fractional>=1.2&gcd.remains<gcd.max)

  cds:
    - call_action_list,name=emergency
    - mirror_image,range_check=none,if=config.enable_mirror_image&cooldown.mirror_image.ready
    - call_action_list,name=racials
    - meteor,range_check=none,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&target.valid&var.meteor_synced

  racials:
    - blood_fury,range_check=none,use_off_gcd=1,if=config.enable_racials&player.combat&cooldown.blood_fury.ready&(!config.racials_sync_combustion|buff.combustion.up)
    - berserking,range_check=none,use_off_gcd=1,if=config.enable_racials&player.combat&cooldown.berserking.ready&(!config.racials_sync_combustion|buff.combustion.up)
    - fireblood,range_check=none,use_off_gcd=1,if=config.enable_racials&player.combat&cooldown.fireblood.ready&(!config.racials_sync_combustion|buff.combustion.up)
    - ancestral_call,range_check=none,use_off_gcd=1,if=config.enable_racials&player.combat&cooldown.ancestral_call.ready&(!config.racials_sync_combustion|buff.combustion.up)

  ff_combustion:
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&var.meteor_synced
    - meteor,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&(buff.hot_streak.up|var.pyroclasm_ready)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|var.pyroclasm_ready)
    - call_action_list,name=fireblast
    - scorch,if=buff.hot_streak.down

  ff_filler:
    - meteor,if=var.meteor_priority_boost
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)
    - scorch,if=buff.heat_shimmer.up|var.execute
    - meteor,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - frostfire_bolt,if=talent.frostfire_bolt
    - call_action_list,name=fireblast

  sf_combustion:
    - combustion,range_check=none,if=cooldown.combustion.ready&player.combat&var.meteor_synced
    - meteor,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&(buff.hot_streak.up|var.pyroclasm_ready)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|var.pyroclasm_ready)
    - call_action_list,name=fireblast
    - scorch,if=buff.hot_streak.down
    - fireball,if=buff.combustion.down&buff.hot_streak.down

  sf_filler:
    - meteor,if=var.meteor_priority_boost
    - flamestrike,if=var.flamestrike_ok&talent.fuel_the_fire&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)
    - pyroblast,if=!var.flamestrike_ok&(buff.hot_streak.up|buff.hyperthermia.up|var.pyroclasm_ready)
    - scorch,if=buff.heat_shimmer.up|var.execute
    - meteor,if=cooldown.meteor.remains<=var.meteor_macro_delay_s&target.valid
    - fireball
    - call_action_list,name=fireblast

  main:
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - call_action_list,name=auto_target_ranged,if=player.combat
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=buff.travel_form.up
    - interact_target,if=!player.combat&target.lootable&target.range<=5
    - interact_target,if=!player.combat&loot_nearby
    - interact_mouseover,if=!player.combat&mouseover.lootable&mouseover.range<=5
    - arcane_intellect,range_check=none,if=(buff.arcane_intellect.down|action.arcane_intellect.overlayed)&lastcast.arcane_intellect>=10
    - blazing_barrier,range_check=none,if=buff.blazing_barrier.down
    - return,if=!player.combat&config.auto_combat.has(0)
    - call_action_list,name=fireblast,if=state.rotation&player.combat
    - mirror_image,range_check=none,if=config.enable_mirror_image&!player.combat&cooldown.mirror_image.ready
    # Interrupts
    - counterspell,if=interrupt.target.check
    - counterspell.mouseover,if=interrupt.mouseover.check
    - counterspell.focus,if=interrupt.focus.check
    # CC Interrupt
    - dragons_breath,if=interrupt.cc.check
    # AoE Interrupt
    - supernova,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check
    - call_action_list,name=auto_heal
    - call_action_list,name=defensives
    - spellsteal,if=config.enable_spellsteal&target.has_stealable&target.enemy
    - remove_curse,cycle=party,if=config.enable_remove_curse&cycle.dispelable.curse
    - target_enemy,if=player.combat&!target.valid&enemies.combat.40y>=1
    - target_enemy,if=player.combat&target.dead&enemies.combat.40y>=1
    - return,if=!target.valid
    - trinket_1,if=config.enable_trinkets&trinket_1.sync
    - trinket_2,if=config.enable_trinkets&trinket_2.sync
    - call_action_list,name=movement,if=(player.moving|moving)&target.valid
    - call_action_list,name=cds
    - call_action_list,name=ff_combustion,if=var.is_frostfire&(buff.combustion.up|(cooldown.combustion.ready&var.meteor_synced))
    - call_action_list,name=sf_combustion,if=var.is_sunfury&(buff.combustion.up|(cooldown.combustion.ready&var.meteor_synced))
    - run_action_list,name=ff_filler,if=var.is_frostfire
    - run_action_list,name=sf_filler
