version: 1

# Tagged enemy casts - merged from old _interrupts.yaml + _defensives.yaml (defendmsives section)
#
# Each entry defines a spell that enemies cast, with tags controlling how it can be reacted to.
#
# Tags:
#   kickable     - Can be interrupted with a kick (respects notInterruptible flag)
#   stunnable    - Can be stopped with a stun (bypasses notInterruptible)
#   channel      - Only react if the spell is being channeled
#   aoe          - AoE damage spell
#   avoid        - Positional mechanic (dodge/move out)
#   frontal      - Frontal cone attack
#   tank         - Tank-targeted hit (use with physical/magical/mixed)
#   purge        - Enemy buff that can be purged (Magic)
#   enrage       - Enemy buff that can be soothed (Enrage)
#   important    - High-priority ability
#   los          - Line-of-sight to avoid
#   meld         - Droppable with Shadowmeld (channels) — also droppable with Feign Death
#   freedom      - Needs freedom/root break
#   physical, magical, mixed - Damage type
#   nonphys      - Non-physical damage (shadow/arcane/etc.); treated as magical for DR — alias for non_phys used in _aura.yaml
#   zephyr       - AoE spell mitigated by Zephyr & Feint
#   stopcasting  - Marks a spell that locks a school on hit; use incoming_cast.stopcasting.up to trigger stop_casting
#   blockable    - Physical hit that can be blocked; use incoming_cast.blockable.up to fire Shield Block / active-block cooldowns
#   reflectable  - Can be deflected with Spell Reflection; incoming_cast.reflectable filters for the reflection reactive window (<0.3s remaining)
#   trash        - Applies the 1.20 trash-mob affix multiplier to damage prediction (bosses use 1.15)
#   show_on_me   - Cast bar notification shown only when the player is the cast's target (single-target spells like Polymorph/Hex)
#   show_all     - Cast bar notification shown regardless of target (AoE spells the whole group must react to)
#
# Per-cast fields (not tags — plain keys on the entry, alongside `damage` / `dr_type`):
#   interrupt_after: N    - seconds; shared kick aliases won't kick until casting.elapsed>=N
#   interrupt_remains: N  - seconds; shared kick aliases only kick once casting.remains<=N
#     Both default to 0 = no gate and AND on top of config.interrupt_pct, so they only ever
#     make the gate stricter. Combine them to kick inside a window.
#     `interrupt_remains: 99` is the idiom for "kick on sight" - no cast runs 99s, so the
#     clause never restricts. Use it for a cast held notInterruptible until a mechanic
#     clears: notInterruptible already blocks the kick, so this documents that no extra
#     wait is wanted once it opens up. They replace the old min50 tag: percent
#     scaled badly with cast length (Death Bolt 1278893 is a 10.0s cast, so min50 meant
#     "wait until 5.0s have elapsed" — 5 seconds of dead air).
#     interrupt_remains has a HARD FLOOR of 0.3s — ShouldCastWithTag drops kickable casts
#     with <0.3s left before the alias is consulted, so anything lower never fires.
#     NEVER set either on a channel: the kick aliases kick channels on sight and these
#     gates would suppress that.
# Expressions (right-to-left parsing):
#   [unit.]incoming_cast.[filter.]<tags>.<property>
#   Unit prefix: target., focus., mouseover.  (none = scan all)
#   Filter: player, cycle, 5y, 8y, 10y, 15y, 40y
#   Properties: up, down, ready (alias for up), remains, count
#
# Examples:
#   target.incoming_cast.kickable.ready          - Target has interruptible cast
#   target.incoming_cast.stunnable.ready         - Target has stunnable cast (ignores notInterruptible)
#   target.incoming_cast.kickable.channel.ready  - Target channeling a kickable spell
#   incoming_cast.10y.kickable.count             - Count of enemies casting kickable spells within 10y
#   incoming_cast.aoe.up                         - Any enemy casting an AoE spell
#   incoming_cast.player.magic.up                - Enemy casting magic spell at player

