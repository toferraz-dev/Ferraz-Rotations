# Trinket definitions
# Unlisted trinkets will check for burst buffs by default (player.burst.active)
#
# Options:
# - if: condition that must be true to use trinket
# - check_burst: false = skip burst buff check (default: true for unlisted trinkets)
# - disabled: true = never use this trinket
# - pre_burst: true = "trick trinket". While equipped and about to come off CD
#     (cooldown <= 10s) AND its trinket_buff is NOT active, the rotation engine
#     holds every spell the user has toggled as a cooldown so this trinket
#     fires first. Releases when cooldown > 10s again or the trinket buff comes
#     up. Requires trinket_buff to know when the burst window opened.
# - trinket_buff: <spell_id> = the buff the trinket puts up. Used by pre_burst
#     as the "burst window active" signal — once this buff is on the player,
#     the CD hold releases and the rotation unleashes cooldowns.
# - no_move: true = never suggest this trinket while the player is moving.
#     Trinket-only gate for cast-time trinkets (e.g. Puzzle Box) that would
#     fizzle mid-move. Does NOT interact with pre_burst or the CD hold — the
#     two flags are independent. If both are set, pre_burst keeps holding CDs
#     while no_move keeps the trinket off the suggestion until you stop.
#
# Usage in rotation:
#   trinket_1,if=trinket1.sync    # Uses _trinkets.yaml logic + burst check
#   trinket_1,if=trinket1.usable  # Simple CD check (ignores _trinkets.yaml)
trinkets:
  # This trinket activates when we have certain stacks, at higher stacks means more stats.
  242396:
    name: "Unyielding Netherprism"
    if: buff.latent_energy.stack>=2
    check_burst: true

  # Tank trinket, one side is armor other is critical, we want to stay in crtiical, so use when we have inner resilience buff to flip
  219309:
    name: "Tome of Light's Devotion"
    if: buff.inner_resilience.up

  # Trick trinket with two independent flags:
  #   pre_burst: while cooldown <= 10s and the Int buff (383781) is not active,
  #     the rotation holds every spell the user has toggled as CD so the Puzzle
  #     Box stays the opener. Releases when cd > 10s or the buff comes up.
  #   no_move: blocks the trinket suggestion while moving (cast-time fizzle).
  # The two are independent: moving + ready trinket still holds CDs via
  # pre_burst — the trinket just waits for you to stand still to actually fire.
  193701:
    name: "Algethar Puzzle Box"
    pre_burst: true
    trinket_buff: 383781
    no_move: true

  # trinket_buff also feeds the trinket_1/2.has_buff and .buff.remains expressions,
  # so a rotation can align a cooldown with the tail of the trinket's window.
  # The buff's display NAME is routinely unrelated to the item's, so it cannot be
  # resolved by name search -- Light Company Guidon's buff is "Charge!". Confirm a
  # candidate id against the DBC mirrors: SpellName + a sane SpellDuration (5-30s)
  # + a SpellCooldown matching the trinket's. 1259633 = Charge!, 15s, 90s CD.
  249344:
    name: "Light Company Guidon"
    trinket_buff: 1259633
    check_burst: true

  # Passive procs are deliberately NOT given a trinket_buff. trinket_N.buff.remains exists to
  # align a cooldown with the tail of a window you chose to open; a proc is not a decision,
  # and chasing its tail would fire the gate on the RNG rather than on the burst.
  # Resolved anyway, should that ever be wanted (equip spell -> SpellEffect.EffectTriggerSpell):
  #   249343 Gaze of the Alnseer       -> 1266686 "Alnsight" 12s        (driver 1256896)
  #   270174 Idol of the Howling Nexus -> 1295649 "Bolstering Gale" 12s (driver 1295643)

  # Damage trinkets - custom conditions, skip burst check
  0:
    name: "Skarmorak Shard"
    if: active_enemies>=3
    check_burst: false

  # Defensive trinkets - use when low HP, skip burst check
  1:
    name: "Nerubian Pheromone Secreter"
    if: player.hp<=50
    check_burst: false

