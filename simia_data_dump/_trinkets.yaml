  # === Midnight Season 2 (WoW season 17) — ON-USE trinkets ===
  # Item set: KeystoneLoot data/{dungeons,raids,items}.lua, slotId 13, build 12.1.0 (69299).
  # Buff id = the ItemEffect TriggerType 0 spell, which for an on-use trinket IS the buff.
  # Method verified on 249344 Light Company Guidon -> 1259633 'Charge!' 15s/90s == tooltip.
  #
  # Only on-use trinkets are wired: `trinket_N.buff.remains` exists to align a cooldown with
  # the tail of a window you chose to open. Passive procs are not a decision, so they are
  # deliberately absent. Each entry below was asserted against Spell.Description_lang —
  # the tooltip must actually grant a stat ('increasing your Haste', 'gaining ... secondary
  # stat') for '$d', where $d is the SpellDuration printed in the comment.
  273796:
    name: "Vile Vial of Volatile Venom"
    trinket_buff: 1293316           # 15s / 120s cd — Altar of Fangs
    check_burst: true
  273797:
    name: "Tattered Amani War Banner"
    trinket_buff: 1293326           # 15s / 90s cd — Altar of Fangs
    check_burst: true
