# =============================================================================
# Monk Windwalker - SpecID 269
# SimC APL Conversion
# Source: D:\Simc\simc\ActionPriorityLists\default\monk_windwalker.simc
# =============================================================================
#
# IMPORTANT: Spell ID collisions — "Heart of the Jade Serpent" resolves to 7+
# rows in SpellName.csv, so name-based buff lookup is ambiguous. The Conduit of
# the Celestials buffs must use numeric IDs (verified from SimC midnight branch,
# sc_monk.cpp talent.conduit_of_the_celestials.*_buff):
#   Heart of the Jade Serpent (base CDR):       443421  → buff.443421
#   Heart of the Jade Serpent Unity Within:     443616  → buff.443616
#     (celestial variant active during/after Unity Within consumption)
#   Heart of the Jade Serpent Yu'lon's Avatar:  1238904 → buff.1238904
#     (Yu'lon's Avatar talent variant)
#
# SimC → YAML conversion notes:
# - `combo_strike` (per-spell) → `buff.combo_strikes_SPELL.down` where SPELL is the action
# - `prev.X` → `prev_gcd.1.X` (our system only supports prev_gcd.N form)
# - `time` → `combat.time`
# - `fight_style.patchwerk|fight_style.castingpatchwerk` → `var.patchwerk` (player.inraid)
# - `fight_style.dungeonroute` → `(player.indungeon|player.inmythicplus)`
# - `fight_style.dungeonslice` → `player.indungeon`
# - Trinket *property* conditions stripped (has_use_buff, cooldown.remains, .is.X)
# - `pet.xuen_the_white_tiger.active` → `buff.invoke_xuen_the_white_tiger.up`
# - `target_if=` dropped, single-target form kept (target sync still applies)
# - `cooldown.whirling_dragon.remains` (SimC typo) → `cooldown.whirling_dragon_punch.remains`
#
# Spell ID collision — "Zenith Stomp" resolves to 3 rows in SpellName.csv:
#   1272694 (talent/rank), 1272696 (castable spell, keybind=73), 1291484 (buff)
# Name-based resolution picks the first row (1272694), which is non-castable,
# so `- zenith_stomp,if=...` silently drops out of the rotation. Use numeric IDs:
#   Cast Zenith Stomp:    1272696  → action 1272696
#   Zenith Stomp buff:    1291484  → buff.1291484
# (Same pattern used for Heart of the Jade Serpent buffs above.)
#
# UNRESOLVED: `buff.unbroken_rhythm` (MID2 WW 4pc, sc_monk.cpp:6455 —
# sets->set(MONK_WINDWALKER,MID2,B4)->effectN(1).trigger()). Two rows share the
# name: 1296624 and 1297033; no DB2 table locally to tell the set spell from the
# aura, so the bare name is used. If the 4pc lines never fire in a live snapshot,
# pin the id.

# Conversion notes - apply throughout this file:
#   (trinket property conditions unsupported — line dropped)

version: 3
spec: 269
entry: main

spell_overrides:
  zenith_stomp: "buff.combo_strikes_zenith_stomp.down"

config:
  fortifying_brew_hp_pct:
    section: "Defensive HP Percentage"
    label: "Fortifying Brew HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  fortifying_brew_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Fortifying Brew (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  vivify_hp_pct:
    label: "Vivify (Vivacious Vivification) HP%"
    type: slider
    min: 0
    max: 100
    default: 75

  touch_of_karma_hp_pct:
    section: "Defensive HP Percentage"
    label: "Touch of Karma HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  touch_of_karma_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Touch of Karma (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # SimC: variable,name=patchwerk,value=fight_style.patchwerk|fight_style.castingpatchwerk
  patchwerk: "player.inraid"

  # SimC: variable,name=has_external_pi,value=cooldown.invoke_power_infusion_0.duration>0
  # (sim-option only — Power Infusion availability is detected via PI buff at runtime)
  has_external_pi: "0"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - fortifying_brew,range_check=none,if=incoming.mitigated.pct>=config.fortifying_brew_dmg_pct
    - touch_of_karma,range_check=none,if=incoming.mitigated.pct>=config.touch_of_karma_dmg_pct

    # --- HP Percentage: react when already low ---
    - fortifying_brew,range_check=none,if=health.pct<=config.fortifying_brew_hp_pct
    - vivify,range_check=none,if=health.pct<=config.vivify_hp_pct&buff.vivacious_vivification.up
    - touch_of_karma,if=health.pct<=config.touch_of_karma_hp_pct

  # ===========================================================================
  # Opener (combat.time<2)
  # ===========================================================================
  opener:
    # tiger_palm,if=combo_strike&chi<4
    - tiger_palm,if=buff.combo_strikes_tiger_palm.down&chi<4

    # use_item,name=algethar_puzzle_box,if=target.time_to_die>25&(cooldown.invoke_xuen_the_white_tiger.remains<2|talent.flurry_strikes&cooldown.zenith.up)|fight_remains<25
    - use_item,name=algethar_puzzle_box,if=target.time_to_die>25&(cooldown.invoke_xuen_the_white_tiger.remains<2|talent.flurry_strikes&cooldown.zenith.up)|fight_remains<25

  # ===========================================================================
  # Racials (Good)
  # ===========================================================================
  racials:
    # berserking,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20
    - berserking,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20

    # ancestral_call,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20
    - ancestral_call,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20

    # blood_fury,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20
    - blood_fury,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20

    # fireblood,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20
    - fireblood,if=buff.invoke_xuen_the_white_tiger.remains>15|!talent.invoke_xuen_the_white_tiger&buff.zenith.remains>14|fight_remains<20

  # ===========================================================================
  # Trinkets
  # ===========================================================================
  trinket:
    # use_item,slot=main_hand
    # (main_hand activation not currently emitted — handled by weapon enchants)

    # use_item,name=algethar_puzzle_box,if=fight_remains>5&(!buff.zenith.up&!talent.flurry_strikes&(target.time_to_die>35&fight_style.dungeonroute|target.time_to_die>25)&(cooldown.potion.remains>30|fight_remains<45|fight_remains>80)&(cooldown.invoke_xuen_the_white_tiger.remains<2|talent.flurry_strikes&cooldown.zenith.up)|fight_remains<25|talent.flurry_strikes&(target.time_to_die>35&fight_style.dungeonroute|target.time_to_die>25)&!buff.zenith.up|fight_style.dungeonslice&(time<5&chi>3|active_enemies>3&target.time_to_die>15))
    - use_item,name=algethar_puzzle_box,if=fight_remains>5&(!buff.zenith.up&!talent.flurry_strikes&(target.time_to_die>35&(player.indungeon|player.inmythicplus)|target.time_to_die>25)&(cooldown.invoke_xuen_the_white_tiger.remains<2|talent.flurry_strikes&cooldown.zenith.up)|fight_remains<25|talent.flurry_strikes&(target.time_to_die>35&(player.indungeon|player.inmythicplus)|target.time_to_die>25)&!buff.zenith.up|player.indungeon&(combat.time<5&chi>3|active_enemies>3&target.time_to_die>15))

    # Generic trinket fallbacks (replaces use_item,slot=trinketN with stripped trinket property conditions)
    # use_item,slot=trinket1,if=trinket.1.has_use_buff&!trinket.2.has_use_buff&(pet.xuen_the_white_tiger.active&talent.invoke_xuen_the_white_tiger|talent.flurry_strikes&buff.zenith.remains>14)
    # use_item,slot=trinket2,if=trinket.2.has_use_buff&!trinket.1.has_use_buff&(pet.xuen_the_white_tiger.active&talent.invoke_xuen_the_white_tiger|talent.flurry_strikes&buff.zenith.remains>14)
    # use_item,slot=trinket1,if=trinket.1.has_use_buff&trinket.2.has_use_buff&(pet.xuen_the_white_tiger.active&talent.invoke_xuen_the_white_tiger|talent.flurry_strikes&buff.zenith.remains>14)
    # use_item,slot=trinket2,if=trinket.1.has_use_buff&trinket.2.has_use_buff&(cooldown.invoke_xuen_the_white_tiger.remains>30&(buff.zenith.up|(cooldown.strike_of_the_windlord.remains<2&talent.strike_of_the_windlord|cooldown.whirling_dragon_punch.remains<2&talent.whirling_dragon_punch))|talent.flurry_strikes&buff.zenith.remains>10)
    - trinket_1,if=trinket_1.sync&(buff.invoke_xuen_the_white_tiger.up|talent.flurry_strikes&buff.zenith.remains>14)
    - trinket_2,if=trinket_2.sync&(buff.invoke_xuen_the_white_tiger.up|talent.flurry_strikes&buff.zenith.remains>14)
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # ===========================================================================
  # Celestial Conduit Burst Windows (big_coc)
  # ===========================================================================
  big_coc:
    # invoke_xuen_the_white_tiger,target_if=max:target.time_to_die,if=(target.time_to_die>35&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&((cooldown.zenith.up|buff.zenith.remains>13)&!buff.heart_of_the_jade_serpent.up)&(!fight_style.dungeonslice|active_enemies>1|time<100)&(chi>2|chi>1&energy<40)
    - invoke_xuen_the_white_tiger,if=(target.time_to_die>35&(player.indungeon|player.inmythicplus)|target.time_to_die>25&!(player.indungeon|player.inmythicplus))&((cooldown.zenith.up|buff.zenith.remains>13)&!buff.443421.up)&(!player.indungeon|active_enemies>1|combat.time<100)&(chi>2|chi>1&energy<40)

    # invoke_xuen_the_white_tiger,target_if=max:target.time_to_die,if=(target.time_to_die>35&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&(trinket.1.is.algethar_puzzle_box&trinket.1.cooldown.remains>100|trinket.2.is.algethar_puzzle_box&trinket.2.cooldown.remains>100)&(!fight_style.dungeonslice|active_enemies>1|time<100)

    # invoke_xuen_the_white_tiger,target_if=max:target.time_to_die,if=fight_style.dungeonslice&target.time_to_die>15&active_enemies>4|fight_remains<=25
    - invoke_xuen_the_white_tiger,if=player.indungeon&target.time_to_die>15&active_enemies>4|fight_remains<=25

    # zenith_stomp,target_if=max:target.time_to_die,if=combo_strike&prev.celestial_conduit&chi<5
    - zenith_stomp,if=buff.combo_strikes_zenith_stomp.down&prev_gcd.1.celestial_conduit&chi<5

    # zenith_stomp,target_if=max:target.time_to_die,if=combo_strike&(chi<2|buff.zenith.remains<2)
    - zenith_stomp,if=buff.combo_strikes_zenith_stomp.down&(chi<2|buff.zenith.remains<2)

    # tiger_palm,,target_if=max:target.time_to_die,if=buff.zenith.up&!buff.heart_of_the_jade_serpent.remains&!buff.heart_of_the_jade_serpent_yulons_avatar.remains&active_enemies=1&!talent.harmonic_combo&chi<2&combo_strike
    - tiger_palm,if=buff.combo_strikes_tiger_palm.down&buff.zenith.up&!buff.443421.remains&!buff.1238904.remains&active_enemies=1&!talent.harmonic_combo&chi<2

    # celestial_conduit,target_if=max:target.time_to_die,if=buff.zenith.up&!buff.heart_of_the_jade_serpent.remains&!buff.heart_of_the_jade_serpent_yulons_avatar.remains&(!buff.whirling_dragon_punch.up|cooldown.whirling_dragon_punch.remains|cooldown.strike_of_the_windlord.remains&talent.strike_of_the_windlord)|fight_remains<4|active_enemies>1+1*talent.drinking_horn_cover&(fight_style.dungeonslice|buff.bloodlust.up),cancel_if=(!cooldown.rising_sun_kick.remains|!cooldown.fists_of_fury.remains|!buff.heart_of_the_jade_serpent.up)&(!talent.zenith_stomp|!buff.bloodlust.up|buff.zenith_stomp.stack=0|chi>4)
    - celestial_conduit,if=buff.zenith.up&!buff.443421.remains&!buff.1238904.remains&(!buff.whirling_dragon_punch.up|cooldown.whirling_dragon_punch.remains|cooldown.strike_of_the_windlord.remains&talent.strike_of_the_windlord)|fight_remains<4|active_enemies>1+1*talent.drinking_horn_cover&buff.bloodlust.up

    # whirling_dragon_punch,if=buff.power_infusion.up&(!buff.heart_of_the_jade_serpent_unity_within.up|buff.heart_of_the_jade_serpent_unity_within.remains<2)
    - whirling_dragon_punch,if=buff.power_infusion.up&(!buff.443616.up|buff.443616.remains<2)

  # ===========================================================================
  # Zenith Usage
  # ===========================================================================
  zenith:
    # zenith,target_if=max:target.time_to_die,if=buff.invoke_xuen_the_white_tiger.remains>10&(!buff.zenith.up|talent.flurry_strikes)
    - zenith,if=buff.invoke_xuen_the_white_tiger.remains>10&(!buff.zenith.up|talent.flurry_strikes)

    # zenith,target_if=max:target.time_to_die,if=(buff.bloodlust.remains>10|cooldown.potion.remains>250&variable.patchwerk)&(active_enemies>2|cooldown.rising_sun_kick.remains|buff.rushing_wind_kick.up)&(!buff.zenith.up|!cooldown.fists_of_fury.remains&!buff.heart_of_the_jade_serpent.up&!buff.heart_of_the_jade_serpent_unity_within.up)
    # cooldown.potion.remains not supported — that branch dropped
    - zenith,if=(buff.bloodlust.remains>10|buff.heroism.remains>10)&(active_enemies>2|cooldown.rising_sun_kick.remains|buff.rushing_wind_kick.up)&(!buff.zenith.up|!cooldown.fists_of_fury.remains&!buff.443421.up&!buff.443616.up)

    # zenith,target_if=max:target.time_to_die,if=(target.time_to_die>30&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&(buff.bloodlust.up&cooldown.celestial_conduit.remains&(cooldown.rising_sun_kick.remains|active_enemies>2)&!buff.zenith.up&talent.celestial_conduit)
    - zenith,if=(target.time_to_die>30&(player.indungeon|player.inmythicplus)|target.time_to_die>25&!(player.indungeon|player.inmythicplus))&((buff.bloodlust.up|buff.heroism.up)&cooldown.celestial_conduit.remains&(cooldown.rising_sun_kick.remains|active_enemies>2)&!buff.zenith.up&talent.celestial_conduit)

    # zenith,target_if=max:target.time_to_die,if=(target.time_to_die>30&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&(talent.flurry_strikes&(buff.bloodlust.up|cooldown.potion.remains>295))&!buff.zenith.up&(buff.bloodlust.remains>30|talent.spiritual_focus)
    - zenith,if=(target.time_to_die>30&(player.indungeon|player.inmythicplus)|target.time_to_die>25&!(player.indungeon|player.inmythicplus))&talent.flurry_strikes&(buff.bloodlust.up|buff.heroism.up)&!buff.zenith.up&((buff.bloodlust.remains>30|buff.heroism.remains>30)|talent.spiritual_focus)

    # zenith,target_if=max:target.time_to_die,if=time>250&cooldown.potion.remains>295&(!trinket.1.has_use_buff&!trinket.2.has_use_buff|trinket.1.has_use_buff&trinket.1.cooldown.remains>30|trinket.2.has_use_buff&trinket.2.cooldown.remains>30)&(fight_remains>120|fight_remains<50&fight_remains>cooldown.zenith.full_recharge_time)
    - zenith,if=combat.time>250&(fight_remains>120|fight_remains<50&fight_remains>cooldown.zenith.full_recharge_time)

    # zenith,target_if=max:target.time_to_die,if=(target.time_to_die>30&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&talent.flurry_strikes&!trinket.1.has_use_buff&!trinket.2.has_use_buff&cooldown.rising_sun_kick.remains&cooldown.fists_of_fury.remains<5&(cooldown.whirling_dragon_punch.remains<10|cooldown.strike_of_the_windlord.remains<10)&cooldown.zenith.full_recharge_time<40&!fight_style.dungeonslice&!buff.zenith.up
    - zenith,if=(target.time_to_die>30&(player.indungeon|player.inmythicplus)|target.time_to_die>25&!(player.indungeon|player.inmythicplus))&talent.flurry_strikes&cooldown.rising_sun_kick.remains&cooldown.fists_of_fury.remains<5&(cooldown.whirling_dragon_punch.remains<10|cooldown.strike_of_the_windlord.remains<10)&cooldown.zenith.full_recharge_time<40&!player.indungeon&!buff.zenith.up

    # zenith,target_if=max:target.time_to_die,if=(target.time_to_die>30&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&(!buff.bloodlust.up&(trinket.1.is.algethar_puzzle_box&trinket.1.cooldown.remains>100|trinket.2.is.algethar_puzzle_box&trinket.2.cooldown.remains>100)&(cooldown.rising_sun_kick.remains|active_enemies>2|talent.drinking_horn_cover&chi<2))&!buff.zenith.up
    # (trinket .is. conditions unsupported — line dropped)

    # zenith,target_if=max:target.time_to_die,if=(variable.patchwerk|fight_style.dungeonroute&target.time_to_die>27+5*talent.drinking_horn_cover)&talent.flurry_strikes&(buff.tigereye_brew_1.stack>19-2*talent.echo_technique|buff.tigereye_brew_1.stack>11&talent.spiritual_focus-2*talent.echo_technique)&(target.time_to_die>30&fight_style.dungeonroute|target.time_to_die>25&!fight_style.dungeonroute)&(cooldown.rising_sun_kick.remains|active_enemies>1)&(!trinket.1.has_use_buff&!trinket.2.has_use_buff|trinket.1.has_use_buff&(trinket.1.cooldown.remains>40|trinket.1.cooldown.remains>30&talent.spiritual_focus)|trinket.2.has_use_buff&(trinket.2.cooldown.remains>40|trinket.2.cooldown.remains>30&talent.spiritual_focus))&(talent.strike_of_the_windlord&cooldown.strike_of_the_windlord.remains<15-5*talent.revolving_whirl&talent.drinking_horn_cover|talent.whirling_dragon_punch&cooldown.whirling_dragon_punch.remains<15-7*talent.revolving_whirl&talent.drinking_horn_cover|talent.strike_of_the_windlord&cooldown.strike_of_the_windlord.remains<10|talent.whirling_dragon_punch&cooldown.whirling_dragon_punch.remains<10)&cooldown.fists_of_fury.remains<9+4*talent.spiritual_focus
    - zenith,if=(var.patchwerk|(player.indungeon|player.inmythicplus)&target.time_to_die>27+5*talent.drinking_horn_cover)&talent.flurry_strikes&(buff.1261703.stack>19-2*talent.echo_technique|buff.1261703.stack>11&talent.spiritual_focus-2*talent.echo_technique)&(target.time_to_die>30&(player.indungeon|player.inmythicplus)|target.time_to_die>25&!(player.indungeon|player.inmythicplus))&(cooldown.rising_sun_kick.remains|active_enemies>1)&(talent.strike_of_the_windlord&cooldown.strike_of_the_windlord.remains<15-5*talent.revolving_whirl&talent.drinking_horn_cover|talent.whirling_dragon_punch&cooldown.whirling_dragon_punch.remains<15-7*talent.revolving_whirl&talent.drinking_horn_cover|talent.strike_of_the_windlord&cooldown.strike_of_the_windlord.remains<10|talent.whirling_dragon_punch&cooldown.whirling_dragon_punch.remains<10)&cooldown.fists_of_fury.remains<9+4*talent.spiritual_focus

    # zenith,target_if=max:target.time_to_die,if=(cooldown.rising_sun_kick.remains|active_enemies>2)&fight_style.dungeonslice&time>130&time<150&active_enemies>1&talent.flurry_strikes&!buff.zenith.up
    - zenith,if=(cooldown.rising_sun_kick.remains|active_enemies>2)&player.indungeon&combat.time>130&combat.time<150&active_enemies>1&talent.flurry_strikes&!buff.zenith.up

    # zenith,target_if=max:target.time_to_die,if=fight_style.dungeonslice&target.time_to_die>15&active_enemies>4&(talent.flurry_strikes|talent.celestial_conduit&talent.restore_balance&cooldown.invoke_xuen_the_white_tiger.remains<cooldown.zenith.full_recharge_time)&!variable.patchwerk&!buff.zenith.up
