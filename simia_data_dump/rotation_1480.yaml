# =============================================================================
# Demon Hunter Devourer - Spec ID 1480
# =============================================================================
# Enemy count: using devourer_enemies (range.reap.target * enemies_around_target)
# void_metamorphosis (ID=1225789) max stacks: 50 base, 35 with Soul Glutton (-15)
#   → threshold = 50 - 15 * talent.soul_glutton
#   NOTE: SimC uses buff.void_metamorphosis_stack internally; WoW spell name is void_metamorphosis
#
# IMPORTANT: Spell ID collisions — "Voidfall" resolves to 5+ rows in SpellName.csv,
# so name-based buff lookup is ambiguous. Aldrachi Reaver buffs must use numeric IDs:
#   Voidfall Building:  1256301  → buff.1256301.stack
#   Voidfall Spending:  1256302  → buff.1256302.up / buff.1256302.stack

name: "Devourer"
author: "Simia"
spec: 1480
version: 3
entry: main
movement_allowed: true

config:
  blur_hp_pct:
    label: "Blur HP%"
    type: slider
    min: 0
    max: 100
    default: 30
  darkness_hp_pct:
    label: "Darkness HP%"
    type: slider
    min: 0
    max: 100
    default: 65

spell_overrides:
  metamorphosis: "target.exists&target.range<=25"
  collapsing_star: "!player.moving"
  void_ray: "!player.moving"

variables:
  # variable,name=melee_vs,op=set,value=!talent.voidfall&talent.the_hunt&!apex.1
  # apex.1 = talent.midnight.rank>=1 (Devourer apex talent)
  # variable,name=should_use_star,op=set,value=(active_enemies>1|apex.1|buff.dark_matter.up|talent.star_fragments)&!variable.melee_vs,if=talent.collapsing_star
  # !melee_vs = talent.voidfall|!talent.the_hunt|talent.midnight.rank>=1
  devourer_enemies: "range.reap.target*enemies_around_target"
  should_use_star: "talent.collapsing_star&(var.devourer_enemies>1|talent.midnight.rank>=1|buff.dark_matter.up|talent.star_fragments)&(talent.voidfall|!talent.the_hunt|talent.midnight.rank>=1)"
  # variable,name=ray_after_reap,op=set,value=fury+4*action.reap.souls_consumed+10*talent.scythes_embrace>=100
  # action.reap.souls_consumed not supported — stripped (treated as 0)
  ray_after_reap: "fury+10*talent.scythes_embrace>=100"
  # variable,name=wont_overcap_cstar,op=set,value=(buff.collapsing_star.stack+action.reap.souls_consumed)<=buff.collapsing_star_stacking.max_stack|!variable.should_use_star
  # action.reap.souls_consumed not supported (stripped), buff.collapsing_star_stacking.max_stack not supported (hardcoded 30)
  wont_overcap_cstar: "buff.collapsing_star.stack<=30|!var.should_use_star"

lists:
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged

    # Combat Check
    - return,if=auto_combat.player

    # blur,if=health.pct<=config.blur_hp_pct
    - blur,range_check=none,if=health.pct<=config.blur_hp_pct
    # darkness,if=health.pct<=config.darkness_hp_pct
    - darkness,range_check=none,if=health.pct<=config.darkness_hp_pct

    # Interrupts
    - disrupt,if=interrupt.target.check
    - disrupt.mouseover,if=interrupt.mouseover.check
    - disrupt.focus,if=interrupt.focus.check
    # CC Interrupt
    - imprison,if=interrupt.cc.check
    # AoE Interrupt
    - void_nova,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # call_action_list,name=math_for_wizards
    # (converted to variables section — should_use_star)

    # call_action_list,name=illicit_doping
    # Trinkets — all SimC trinket property conditions stripped, using sync
    # use_item,slot=trinket1,if=trinket.1.has_use_buff&...
    - trinket_1,if=trinket_1.sync
    # use_item,slot=trinket2,if=trinket.2.has_use_buff&...
    - trinket_2,if=trinket_2.sync

    # Custom: one_button_assistant shows reap/cull/eradicate → press when not casting/channeling
    - one_button_assist_lookup,delay=200,if=(one_button_assistant.reap|one_button_assistant.cull|one_button_assistant.eradicate)&!player.casting&!player.channeling
    # Custom: one_button_assistant shows reap/cull/eradicate & cast almost done → interrupt cast (not channels)
    - one_button_assist_lookup,delay=200,interrupt=true,if=(one_button_assistant.reap|one_button_assistant.cull|one_button_assistant.eradicate)&player.casting&!player.channeling&casting.remains<=0.1

    # Custom: after consume, soul fragments take a moment to update — if we had >=2 before, consume pushed us to >=4, force reaps
    - call_action_list,name=reaps,if=prev_gcd.1.consume&buff.soul_fragments.stack>=2
    # Custom: eradicate immediately after void_ray cast
    - eradicate,ignore_cooldown=true,ignore_usable=true,if=talent.eradicate&lastcast.void_ray<=3
    - return,if=talent.eradicate&lastcast.void_ray<=3

    # void_ray,if=talent.eradicate&active_enemies>1&!buff.eradicate.up&talent.voidsurge
    - void_ray,if=talent.eradicate&var.devourer_enemies>1&!buff.eradicate.up&talent.voidsurge

    # voidblade,if=buff.void_metamorphosis_stack.at_max_stacks&talent.devourers_bite&talent.voidsurge
    # at_max_stacks not supported — max=50 base, 35 with Soul Glutton (talent reduces by 15)
    - voidblade,if=buff.void_metamorphosis.stack>=50-15*talent.soul_glutton&talent.devourers_bite&talent.voidsurge

    # the_hunt,if=buff.void_metamorphosis_stack.at_max_stacks&talent.devourers_bite&talent.voidsurge
    # at_max_stacks not supported — max=50 base, 35 with Soul Glutton
    - the_hunt,if=buff.void_metamorphosis.stack>=50-15*talent.soul_glutton&talent.devourers_bite&talent.voidsurge
    
    # metamorphosis,if=buff.eradicate.up|!talent.eradicate|active_enemies=1|talent.voidfall
    - metamorphosis,global_delay=100,range_check=none,if=(buff.eradicate.up|!talent.eradicate|var.devourer_enemies<=1|talent.voidfall)&buff.1217607.down

    # call_action_list,name=reaps,if=talent.moment_of_craving&action.reap.souls_consumed>=4&buff.metamorphosis.up&!talent.voidfall&cooldown.void_ray.remains<=gcd.max&variable.wont_overcap_cstar
    # action.reap.souls_consumed not supported — stripped; wont_overcap_cstar → var.wont_overcap_cstar
    - call_action_list,name=reaps,if=talent.moment_of_craving&buff.moment_of_craving.up&buff.metamorphosis.up&!talent.voidfall&cooldown.void_ray.remains<=gcd.max&var.wont_overcap_cstar

    # void_ray,if=!buff.eradicate.up|active_enemies=1
    - void_ray,if=!buff.eradicate.up|var.devourer_enemies<=1

    # pierce_the_veil,if=buff.moment_of_craving.up&variable.should_use_star&buff.collapsing_star.stack>=30&talent.devourers_bite
    - pierce_the_veil,if=buff.moment_of_craving.up&var.should_use_star&buff.collapsing_star.stack>=30&talent.devourers_bite

    # collapsing_star,if=variable.should_use_star
    - collapsing_star,global_delay=100,if=cooldown.void_ray.remains>=1

    # call_action_list,name=reaps,if=buff.eradicate.up&active_enemies>1&action.reap.souls_consumed>=4+6*buff.moment_of_craving.up
    # action.reap.souls_consumed not supported — stripped
    - call_action_list,name=reaps,if=buff.eradicate.up&var.devourer_enemies>1

    # call_action_list,name=melee_combo
    - call_action_list,name=melee_combo

    # call_action_list,name=reaps,if=!buff.metamorphosis.up&buff.moment_of_craving.up&talent.voidfall&(buff.voidfall_building.react<2|variable.ray_after_reap)
    - call_action_list,name=reaps,if=!buff.metamorphosis.up&buff.moment_of_craving.up&talent.voidfall&(buff.1256301.react<2|var.ray_after_reap)

    # call_action_list,name=reaps,if=buff.voidfall_spending.stack>=3&prev_gcd.1.void_ray|buff.voidfall_spending.react>=3
    - call_action_list,name=reaps,if=buff.1256302.stack>=3&prev_gcd.1.void_ray|buff.1256302.react>=3

    # call_action_list,name=reaps,if=buff.metamorphosis.up&variable.should_use_star&(buff.collapsing_star.stack+action.reap.souls_consumed)>=30&variable.wont_overcap_cstar&void_metamorphosis_base_drain_ps>35
    # action.reap.souls_consumed not supported (stripped), void_metamorphosis_base_drain_ps not supported (stripped)
    - call_action_list,name=reaps,if=buff.metamorphosis.up&var.should_use_star&buff.collapsing_star.stack>=30&var.wont_overcap_cstar

    # call_action_list,name=reaps,if=talent.voidsurge&active_enemies=1&!buff.metamorphosis.up&variable.ray_after_reap
    - call_action_list,name=reaps,if=talent.voidsurge&var.devourer_enemies<=1&!buff.metamorphosis.up&var.ray_after_reap

    # call_action_list,name=reaps,if=!talent.voidfall&(buff.metamorphosis.up&(active_enemies=1|buff.eradicate.up|!talent.eradicate)|buff.moment_of_craving.up|!talent.moment_of_craving&action.reap.souls_consumed>=4)&variable.wont_overcap_cstar
    # action.reap.souls_consumed not supported — stripped
    - call_action_list,name=reaps,if=!talent.voidfall&(buff.metamorphosis.up&(var.devourer_enemies<=1|buff.eradicate.up|!talent.eradicate)|buff.moment_of_craving.up|!talent.moment_of_craving)&var.wont_overcap_cstar

    # soul_immolation,if=active_dot.soul_immolation=0&!buff.metamorphosis.up
    - soul_immolation,if=active_dot.soul_immolation=0&!buff.metamorphosis.up

    # Railguard: at 4+ souls, halt if any hero variant is 0-0.5s away from ready. The `remains>0` check also filters the sticky-resolution bug where unresolved names return 0 — if no variant resolves, we don't railguard and devour proceeds normally.
    - return,if=buff.soul_fragments.stack>=4&cooldown.1245453.remains<=1.75&buff.1217607.up

    # devour
    - devour

    # consume
    - consume,if=lastcast.void_ray>=action.void_ray.execute_time+1

  melee_combo:
    # vengeful_retreat,if=buff.voidstep.up&(buff.collapsing_star.stack<30|cooldown.voidblade.up|cooldown.predators_wake.up|buff.collapsing_star.stack<=38)
    - vengeful_retreat,if=buff.voidstep.up&(buff.collapsing_star.stack<30|cooldown.voidblade.up|cooldown.predators_wake.up|buff.collapsing_star.stack<=38)

    # hungering_slash,if=active_enemies>1
    - hungering_slash,if=var.devourer_enemies>1

    # reapers_toll,if=buff.voidsurge_reapers_toll.up|active_enemies>1
    # TODO: voidsurge_reapers_toll has no in-game buff (verified via WCL logs — neither 1246160/1246161/452443 appear as applybuff events on Devourer DH). SimC tracks it as a placeholder template. Dropped the proc guard; reapers_toll fires on target count alone.
    - reapers_toll,if=var.devourer_enemies>1

    # the_hunt,if=!talent.voidsurge&!talent.devourers_bite|talent.devourers_bite&!talent.voidsurge&buff.metamorphosis.up
    - the_hunt,if=!talent.voidsurge&!talent.devourers_bite|talent.devourers_bite&!talent.voidsurge&buff.metamorphosis.up

    # pierce_the_veil,if=buff.voidsurge_pierce_the_veil.up|talent.duty_eternal&active_enemies=1|talent.devourers_bite|talent.hungering_slash&active_enemies>1
    # TODO: voidsurge_pierce_the_veil has no in-game buff. See note on reapers_toll above.
    - pierce_the_veil,if=talent.duty_eternal&var.devourer_enemies<=1|talent.devourers_bite|talent.hungering_slash&var.devourer_enemies>1
    # predators_wake
    - predators_wake

    # voidblade,if=(talent.duty_eternal&active_enemies=1|talent.hungering_slash&active_enemies>1)&!talent.devourers_bite|talent.devourers_bite&!talent.voidsurge&buff.metamorphosis.up
    - voidblade,if=(talent.duty_eternal&var.devourer_enemies<=1|talent.hungering_slash&var.devourer_enemies>1)&!talent.devourers_bite|talent.devourers_bite&!talent.voidsurge&buff.metamorphosis.up

  reaps:
    # eradicate
    - eradicate

    # cull
    - cull

    # reap
    - reap
