# =============================================================================
# Mage Fire - Spec ID 63
# =============================================================================

# Conversion notes - apply throughout this file:
#   time-action.scorch.last_used -> lastcast.scorch

version: 3
spec: 63
entry: main

config:
  blazing_barrier_hp_pct:
    section: "Defensive HP Percentage"
    label: "Blazing Barrier HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  blazing_barrier_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Blazing Barrier (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  ice_block_hp_pct:
    section: "Defensive HP Percentage"
    label: "Ice Block HP%"
    type: slider
    min: 0
    max: 100
    default: 20

  ice_block_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Ice Block (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 75
variables:
  # variable,name=cast_remains_time,value=0.2
  cast_remains_time: 0.2
  # local helper: SimC's scorch_execute.active pseudo-state
  scorch_execute: target.health.pct<30&talent.scorch
  hs_predicted: buff.hot_streak.up|(buff.heating_up.up&lastcast.fire_blast<0.5)
  # variable,name=flamestriking,op=reset,default=1
  flamestriking: 1
  # variable,name=flamestriking_active,op=set,value=variable.flamestriking&(time>variable.combustion_delay|talent.firestarter&buff.pyroclasm.up&buff.hot_streak.react=0)
  flamestriking_active: "var.flamestriking&(combat.time>var.combustion_delay|talent.firestarter&buff.pyroclasm.up&!buff.hot_streak.up)"
  # variable,name=combustion_precast_time,value=(action.scorch.cast_time*!buff.pyroclasm.up*scorch_execute.active)+(action.fireball.cast_time*!buff.pyroclasm.up*!scorch_execute.active)+(action.pyroblast.cast_time*buff.pyroclasm.up)-variable.cast_remains_time
  combustion_precast_time: "(action.scorch.cast_time*!buff.pyroclasm.up*var.scorch_execute)+(action.fireball.cast_time*!buff.pyroclasm.up*!var.scorch_execute)+(action.pyroblast.cast_time*buff.pyroclasm.up)-var.cast_remains_time"
  # variable,name=ff_combustion_flamestrike,op=set,if=!talent.spellfire_spheres,value=3+(999*!talent.fuel_the_fire+999*!variable.flamestriking_active)
  ff_combustion_flamestrike: "!talent.spellfire_spheres*(3+(999*!talent.fuel_the_fire+999*!var.flamestriking_active))+talent.spellfire_spheres*999"
  # variable,name=ff_filler_flamestrike,op=set,if=!talent.spellfire_spheres,value=3+(999*!talent.fuel_the_fire+999*!variable.flamestriking_active)
  ff_filler_flamestrike: "!talent.spellfire_spheres*(3+(999*!talent.fuel_the_fire+999*!var.flamestriking_active))+talent.spellfire_spheres*999"
  # variable,name=sf_combustion_flamestrike,op=set,if=talent.spellfire_spheres,value=3+(999*!talent.fuel_the_fire+999*!variable.flamestriking_active)
  sf_combustion_flamestrike: "talent.spellfire_spheres*(3+(999*!talent.fuel_the_fire+999*!var.flamestriking_active))+!talent.spellfire_spheres*999"
  # variable,name=sf_filler_flamestrike,op=set,if=talent.spellfire_spheres,value=3+(999*!talent.fuel_the_fire+999*!variable.flamestriking_active)
  sf_filler_flamestrike: "talent.spellfire_spheres*(3+(999*!talent.fuel_the_fire+999*!var.flamestriking_active))+!talent.spellfire_spheres*999"
  # variable,name=combustion_delay,value=(18*talent.firestarter)-(10*(expected_combat_length<60)+10*(expected_combat_length<30))-10*(((expected_combat_length%%60)>=25)&((expected_combat_length%%60)<=40))
  # expected_combat_length not supported — simplified (assume a long fight)
  combustion_delay: "18*talent.firestarter"
  # The precombat steroid_trinket_equipped / nonsteroid_trinket_equipped variables only gate the
  # generic `use_items` line, which becomes trinket_1/trinket_2 sync here — not converted.

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - blazing_barrier,range_check=none,if=incoming.mitigated.pct>=config.blazing_barrier_dmg_pct
    - ice_block,range_check=none,if=incoming.mitigated.pct>=config.ice_block_dmg_pct

    # --- HP Percentage: react when already low ---
    - blazing_barrier,range_check=none,if=health.pct<=config.blazing_barrier_hp_pct
    - ice_block,range_check=none,if=health.pct<=config.ice_block_hp_pct

  cds:
    # variable,name=combustion_precast_time,value=(action.scorch.cast_time*!buff.pyroclasm.up*scorch_execute.active)+(action.fireball.cast_time*!buff.pyroclasm.up*!scorch_execute.active)+(action.pyroblast.cast_time*buff.pyroclasm.up)-variable.cast_remains_time
    # handled in the variables: section

    # potion,if=time>=(8*(talent.firestarter&talent.spellfire_spheres))|buff.combustion.remains>6|fight_remains<35

    # use_item,name=vile_vial_of_volatile_venom,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=vile_vial_of_volatile_venom,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=stormbound_emblem_of_dazar,if=time>=variable.combustion_delay&cooldown.combustion.remains<2&buff.combustion.down&(buff.bloodlust.down|gcd.max>0.76&!equipped.hex_lords_dooming_idol&(!equipped.vile_vial_of_volatile_venom|trinket.1.is.vile_vial_of_volatile_venom&trinket.1.cooldown.remains>20|trinket.2.is.vile_vial_of_volatile_venom&trinket.2.cooldown.remains>20))|fight_remains<25
    # trinket.N.is / trinket.N.cooldown.remains are unsupported trinket properties — that inner
    # clause is dropped, leaving the bloodlust-down check
    - use_item,name=stormbound_emblem_of_dazar,if=combat.time>=var.combustion_delay&cooldown.combustion.remains<2&buff.combustion.down&(buff.bloodlust.down|gcd.max>0.76&!equipped.hex_lords_dooming_idol)|fight_remains<25
    # use_item,name=sethraliss_defiled_relic,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=sethraliss_defiled_relic,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=hex_lords_dooming_idol,if=buff.combustion.remains>6|fight_remains<30
    - use_item,name=hex_lords_dooming_idol,if=buff.combustion.remains>6|fight_remains<30
    # use_item,name=vaelgors_final_stare,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=vaelgors_final_stare,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=emberwing_feather,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=emberwing_feather,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=venomous_gladiators_badge_of_ferocity,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=venomous_gladiators_badge_of_ferocity,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=galactic_gladiators_badge_of_ferocity,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=galactic_gladiators_badge_of_ferocity,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=ever_collapsing_void_fissure,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=ever_collapsing_void_fissure,if=buff.combustion.remains>6|fight_remains<20
    # use_item,name=freightrunners_flask,if=buff.combustion.remains>6|fight_remains<20
    - use_item,name=freightrunners_flask,if=buff.combustion.remains>6|fight_remains<20

    # use_items,if=variable.nonsteroid_trinket_equipped&(time>variable.combustion_delay&cooldown.combustion.remains>20|time<=variable.combustion_delay&(variable.combustion_delay>=18|!variable.steroid_trinket_equipped))&buff.combustion.down&buff.hyperthermia.down
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # ancestral_call,if=buff.combustion.remains>6|fight_remains<20
    - ancestral_call,if=buff.combustion.remains>6|fight_remains<20
    # berserking,if=buff.combustion.remains>6|fight_remains<20
    - berserking,if=buff.combustion.remains>6|fight_remains<20
    # blood_fury,if=buff.combustion.remains>6|fight_remains<20
    - blood_fury,if=buff.combustion.remains>6|fight_remains<20
    # fireblood,if=buff.combustion.remains>6|fight_remains<10
    - fireblood,if=buff.combustion.remains>6|fight_remains<10

    # invoke_external_buff,name=power_infusion,if=buff.power_infusion.down&(buff.combustion.remains>6|fight_remains<25)

  # ============================================================================
  # FIREBLAST
  # ============================================================================
  fireblast:
    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&cooldown.fire_blast.charges_fractional>=2.9&talent.firestarter
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown.fire_blast.charges_fractional>=2.9&talent.firestarter

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&!buff.hot_streak.react&(buff.combustion.up|buff.hyperthermia.up)&(hot_streak_spells_in_flight+buff.heating_up.react=1)&gcd.remains<gcd.max
    # hot_streak_spells_in_flight has no engine equivalent — approximated with var.hs_predicted
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=!buff.hot_streak.up&(buff.combustion.up|buff.hyperthermia.up)&buff.heating_up.up&!var.hs_predicted&gcd.remains<gcd.max

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&!buff.hot_streak.react&action.pyroblast.executing&buff.pyroclasm.up&gcd.remains<gcd.max
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=!buff.hot_streak.up&player.casting.pyroblast&buff.pyroclasm.up&gcd.remains<gcd.max

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&!buff.hot_streak.react&(action.fireball.executing&action.fireball.execute_remains>0.1|buff.pyroclasm.react&action.pyroblast.executing&action.pyroblast.execute_remains>0.1|action.flamestrike.executing&action.flamestrike.execute_remains>0.1)&(!scorch_execute.active|!talent.scorch)&buff.heating_up.react&(hot_streak_spells_in_flight+buff.heating_up.react=1)&gcd.remains<gcd.max
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=!buff.hot_streak.up&(player.casting.fireball&player.casting.remains>0.1|buff.pyroclasm.up&player.casting.pyroblast&player.casting.remains>0.1|player.casting.flamestrike&player.casting.remains>0.1)&(!var.scorch_execute|!talent.scorch)&buff.heating_up.up&!var.hs_predicted&gcd.remains<gcd.max

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&!buff.hot_streak.react&scorch_execute.active&(hot_streak_spells_in_flight+buff.heating_up.react=0)&(action.scorch.executing&buff.heat_shimmer.down|action.pyroblast.executing&buff.pyroclasm.up&set_bonus.midnight_season_2_2pc)&gcd.remains<gcd.max
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=!buff.hot_streak.up&var.scorch_execute&buff.heating_up.down&!var.hs_predicted&(player.casting.scorch&buff.heat_shimmer.down|player.casting.pyroblast&buff.pyroclasm.up&set_bonus.midnight_season_2_2pc)&gcd.remains<gcd.max

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&!buff.hot_streak.react&time<variable.combustion_delay&(talent.firestarter|action.fireball.executing&action.fireball.execute_remains>0.1|buff.pyroclasm.react&action.pyroblast.executing&action.pyroblast.execute_remains>0.1)&(hot_streak_spells_in_flight+buff.heating_up.react=1)&gcd.remains<gcd.max&cooldown.combustion.ready
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=!buff.hot_streak.up&combat.time<var.combustion_delay&(talent.firestarter|player.casting.fireball&player.casting.remains>0.1|buff.pyroclasm.up&player.casting.pyroblast&player.casting.remains>0.1)&buff.heating_up.up&!var.hs_predicted&gcd.remains<gcd.max&cooldown.combustion.ready

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=cooldown_react&(time>=variable.combustion_delay&(cooldown.combustion.remains<=variable.combustion_precast_time))&buff.combustion.down&talent.spontaneous_combustion&(action.scorch.executing|action.fireball.executing|action.pyroblast.executing|action.flamestrike.executing)
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=(combat.time>=var.combustion_delay&(cooldown.combustion.remains<=var.combustion_precast_time))&buff.combustion.down&talent.spontaneous_combustion&(player.casting.scorch|player.casting.fireball|player.casting.pyroblast|player.casting.flamestrike)

    # fire_blast,use_off_gcd=1,use_while_casting=1,if=fight_remains<1
    - fire_blast,use_off_gcd=1,use_while_casting=1,if=fight_remains<1

  # ============================================================================
  # FROSTFIRE COMBUSTION
  # ============================================================================
  ff_combustion:
    # combustion,use_off_gcd=1,use_while_casting=1,if=buff.combustion.down&action.fireball.executing&(action.fireball.execute_remains<variable.cast_remains_time)|action.meteor.in_flight&(action.meteor.in_flight_remains<0.3)|action.pyroblast.executing&(action.pyroblast.execute_remains<variable.cast_remains_time)|prev_gcd.1.meteor
    # action.X.in_flight / in_flight_remains not supported — that branch folds into prev_gcd.1.meteor
    - combustion,use_off_gcd=1,use_while_casting=1,if=buff.combustion.down&player.casting.fireball&player.casting.remains<var.cast_remains_time|player.casting.pyroblast&player.casting.remains<var.cast_remains_time|prev_gcd.1.meteor

    # flamestrike,if=buff.pyroclasm.up&!buff.hot_streak.react&buff.combustion.down&active_enemies>=variable.ff_combustion_flamestrike
    - flamestrike,if=buff.pyroclasm.up&!buff.hot_streak.up&buff.combustion.down&enemies_around_target>=var.ff_combustion_flamestrike
    # pyroblast,if=buff.pyroclasm.up&!buff.hot_streak.react&buff.combustion.down
    - pyroblast,if=buff.pyroclasm.up&!buff.hot_streak.up&buff.combustion.down
    # fireball,if=buff.combustion.down
    - fireball,if=buff.combustion.down

    # meteor,if=talent.burnout&buff.combustion.remains<8|!talent.burnout&buff.combustion.remains>2
    - meteor,if=talent.burnout&buff.combustion.remains<8|!talent.burnout&buff.combustion.remains>2

    # flamestrike,if=buff.hot_streak.react&active_enemies>=variable.ff_combustion_flamestrike
    - flamestrike,if=buff.hot_streak.up&enemies_around_target>=var.ff_combustion_flamestrike
    # pyroblast,if=buff.hot_streak.react
    - pyroblast,if=buff.hot_streak.up

    # flamestrike,if=buff.pyroclasm.up&cast_time<buff.combustion.remains&active_enemies>=(variable.ff_filler_flamestrike-1)
    - flamestrike,if=buff.pyroclasm.up&action.flamestrike.cast_time<buff.combustion.remains&enemies_around_target>=(var.ff_filler_flamestrike-1)
    # pyroblast,if=buff.pyroclasm.up&cast_time<buff.combustion.remains
    - pyroblast,if=buff.pyroclasm.up&action.pyroblast.cast_time<buff.combustion.remains
    # scorch,if=buff.heat_shimmer.react|talent.scald&scorch_execute.active&buff.frostfire_empowerment.down
    - scorch,if=buff.heat_shimmer.up|talent.scald&var.scorch_execute&buff.frostfire_empowerment.down
    # fireball
    - fireball
    # call_action_list,name=fireblast,if=!talent.pyroclasm|(buff.pyroclasm.stack<2|action.pyroblast.executing&action.pyroblast.execute_remains>0.2&buff.pyroclasm.stack=2|cooldown.fire_blast.charges_fractional>=2.9|buff.combustion.remains<action.pyroblast.cast_time)&(active_enemies<variable.sf_combustion_flamestrike|buff.pyroclasm.down|!action.flamestrike.executing)
    - call_action_list,name=fireblast,if=!talent.pyroclasm|(buff.pyroclasm.stack<2|player.casting.pyroblast&player.casting.remains>0.2&buff.pyroclasm.stack=2|cooldown.fire_blast.charges_fractional>=2.9|buff.combustion.remains<action.pyroblast.cast_time)&(enemies_around_target<var.sf_combustion_flamestrike|buff.pyroclasm.down|!player.casting.flamestrike)

  # ============================================================================
  # FROSTFIRE FILLER
  # ============================================================================
  ff_filler:
    # meteor,if=time>=(variable.combustion_delay-gcd.max)
    - meteor,if=combat.time>=(var.combustion_delay-gcd.max)

    # flamestrike,if=(buff.hot_streak.react&(cooldown.combustion.remains>=5|time<variable.combustion_delay))&active_enemies>=variable.ff_filler_flamestrike
    - flamestrike,if=(buff.hot_streak.up&(cooldown.combustion.remains>=5|combat.time<var.combustion_delay))&enemies_around_target>=var.ff_filler_flamestrike
    # pyroblast,if=buff.hot_streak.react&(cooldown.combustion.remains>=(5-5*buff.pyroclasm.up)|time<variable.combustion_delay)
    - pyroblast,if=buff.hot_streak.up&(cooldown.combustion.remains>=(5-5*buff.pyroclasm.up)|combat.time<var.combustion_delay)

    # flamestrike,if=(buff.pyroclasm.up&cooldown.combustion.remains>12|buff.pyroclasm.stack=2)&active_enemies>=variable.ff_filler_flamestrike
    - flamestrike,if=(buff.pyroclasm.up&cooldown.combustion.remains>12|buff.pyroclasm.stack=2)&enemies_around_target>=var.ff_filler_flamestrike
    # pyroblast,if=buff.pyroclasm.up&cooldown.combustion.remains>12|buff.pyroclasm.stack=2
    - pyroblast,if=buff.pyroclasm.up&cooldown.combustion.remains>12|buff.pyroclasm.stack=2
    # scorch,if=buff.heat_shimmer.react
    - scorch,if=buff.heat_shimmer.up
    # fireball
    - fireball
    # call_action_list,name=fireblast
    - call_action_list,name=fireblast

  # ============================================================================
  # SUNFURY COMBUSTION
  # ============================================================================
  sf_combustion:
    # combustion,use_off_gcd=1,use_while_casting=1,if=action.scorch.executing&(action.scorch.execute_remains<variable.cast_remains_time)|action.fireball.executing&(action.fireball.execute_remains<variable.cast_remains_time)|action.pyroblast.executing&(action.pyroblast.execute_remains<variable.cast_remains_time)&!cooldown.meteor.ready|action.flamestrike.executing&(action.flamestrike.execute_remains<variable.cast_remains_time)|action.meteor.in_flight&action.meteor.in_flight_remains<0.3&(action.pyroblast.executing|action.flamestrike.executing|buff.pyroclasm.down)
    # action.X.in_flight / in_flight_remains not supported — that branch uses prev_gcd.1.meteor
    - combustion,use_off_gcd=1,use_while_casting=1,if=player.casting.scorch&player.casting.remains<var.cast_remains_time|player.casting.fireball&player.casting.remains<var.cast_remains_time|player.casting.pyroblast&player.casting.remains<var.cast_remains_time&!cooldown.meteor.ready|player.casting.flamestrike&player.casting.remains<var.cast_remains_time|prev_gcd.1.meteor&(player.casting.pyroblast|player.casting.flamestrike|buff.pyroclasm.down)

    # flamestrike,if=buff.combustion.down&buff.hot_streak.react&active_enemies>=variable.sf_combustion_flamestrike
    - flamestrike,if=buff.combustion.down&buff.hot_streak.up&enemies_around_target>=var.sf_combustion_flamestrike
    # pyroblast,if=buff.combustion.down&buff.hot_streak.react
    - pyroblast,if=buff.combustion.down&buff.hot_streak.up

    # meteor,if=buff.combustion.down&talent.sunfury_execution
    - meteor,if=buff.combustion.down&talent.sunfury_execution
    # flamestrike,if=active_enemies>=variable.sf_combustion_flamestrike&(buff.combustion.down&!buff.hot_streak.react&buff.pyroclasm.up)
    - flamestrike,if=enemies_around_target>=var.sf_combustion_flamestrike&(buff.combustion.down&!buff.hot_streak.up&buff.pyroclasm.up)
    # pyroblast,if=buff.combustion.down&!buff.hot_streak.react&buff.pyroclasm.up
    - pyroblast,if=buff.combustion.down&!buff.hot_streak.up&buff.pyroclasm.up
    # scorch,if=buff.combustion.down&(scorch_execute.active|active_enemies>=4)
    - scorch,if=buff.combustion.down&(var.scorch_execute|enemies_around_target>=4)
    # fireball,if=buff.combustion.down&(!prev_gcd.1.meteor|buff.bloodlust.down)
    - fireball,if=buff.combustion.down&(!prev_gcd.1.meteor|buff.bloodlust.down)

    # meteor,if=buff.combustion.remains>2
    - meteor,if=buff.combustion.remains>2

    # flamestrike,if=(buff.hot_streak.react|prev_gcd.1.scorch&buff.heating_up.react&time-action.scorch.last_used<0.2)&active_enemies>=variable.sf_combustion_flamestrike
    - flamestrike,if=(buff.hot_streak.up|prev_gcd.1.scorch&buff.heating_up.up&lastcast.scorch<0.2)&enemies_around_target>=var.sf_combustion_flamestrike
    # pyroblast,if=buff.hot_streak.react|prev_gcd.1.scorch&buff.heating_up.react&time-action.scorch.last_used<0.2
    - pyroblast,if=buff.hot_streak.up|prev_gcd.1.scorch&buff.heating_up.up&lastcast.scorch<0.2

    # flamestrike,if=buff.pyroclasm.react&cast_time<buff.combustion.remains&active_enemies>=variable.sf_combustion_flamestrike
    - flamestrike,if=buff.pyroclasm.up&action.flamestrike.cast_time<buff.combustion.remains&enemies_around_target>=var.sf_combustion_flamestrike
    # pyroblast,if=buff.pyroclasm.react&cast_time<buff.combustion.remains
    - pyroblast,if=buff.pyroclasm.up&action.pyroblast.cast_time<buff.combustion.remains
    # scorch
    - scorch

    # call_action_list,name=fireblast,if=!talent.pyroclasm|(buff.pyroclasm.stack<2|action.pyroblast.executing&action.pyroblast.execute_remains>0.2&buff.pyroclasm.stack=2|cooldown.fire_blast.charges_fractional>=2.9|buff.combustion.remains<action.pyroblast.cast_time)&(active_enemies<variable.sf_combustion_flamestrike|buff.pyroclasm.down|!action.flamestrike.executing)
    - call_action_list,name=fireblast,if=!talent.pyroclasm|(buff.pyroclasm.stack<2|player.casting.pyroblast&player.casting.remains>0.2&buff.pyroclasm.stack=2|cooldown.fire_blast.charges_fractional>=2.9|buff.combustion.remains<action.pyroblast.cast_time)&(enemies_around_target<var.sf_combustion_flamestrike|buff.pyroclasm.down|!player.casting.flamestrike)

  # ============================================================================
  # SUNFURY FILLER
  # ============================================================================
  sf_filler:
    # meteor,if=talent.blast_zone&time>variable.combustion_delay
    - meteor,if=talent.blast_zone&combat.time>var.combustion_delay

    # flamestrike,if=(buff.hot_streak.react|prev_gcd.1.scorch&buff.heating_up.react&time-action.scorch.last_used<0.2|buff.hyperthermia.up)&active_enemies>=variable.sf_filler_flamestrike
    - flamestrike,if=(buff.hot_streak.up|prev_gcd.1.scorch&buff.heating_up.up&lastcast.scorch<0.2|buff.hyperthermia.up)&enemies_around_target>=var.sf_filler_flamestrike
    # pyroblast,if=buff.hot_streak.react|prev_gcd.1.scorch&buff.heating_up.react&time-action.scorch.last_used<0.2|buff.hyperthermia.up
    - pyroblast,if=buff.hot_streak.up|prev_gcd.1.scorch&buff.heating_up.up&lastcast.scorch<0.2|buff.hyperthermia.up

    # flamestrike,if=buff.pyroclasm.up&active_enemies>=variable.sf_filler_flamestrike
    - flamestrike,if=buff.pyroclasm.up&enemies_around_target>=var.sf_filler_flamestrike
    # pyroblast,if=buff.pyroclasm.up
    - pyroblast,if=buff.pyroclasm.up

    # scorch,if=talent.scald&scorch_execute.active|buff.heat_shimmer.react&(firestarter.active|prev_gcd.1.pyroblast|prev_gcd.1.flamestrike)
    # firestarter.active -> talent.firestarter&target.health.pct>=90
    - scorch,if=talent.scald&var.scorch_execute|buff.heat_shimmer.up&((talent.firestarter&target.health.pct>=90)|prev_gcd.1.pyroblast|prev_gcd.1.flamestrike)
    # fireball
    - fireball
    # call_action_list,name=fireblast
    - call_action_list,name=fireblast

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - arcane_intellect,range_check=none,if=(buff.arcane_intellect.down|action.arcane_intellect.overlayed)&lastcast.arcane_intellect>=10

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - counterspell,if=interrupt.target.check
    - counterspell.mouseover,if=interrupt.mouseover.check
    - counterspell.focus,if=interrupt.focus.check
    # CC Interrupt
    - dragons_breath,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target
    # call_action_list,name=cds
    - call_action_list,name=cds

    # variable,name=flamestriking_active / ff_combustion_flamestrike / ff_filler_flamestrike /
    # sf_combustion_flamestrike / sf_filler_flamestrike — SimC variable action lines, now
    # expressions in the variables: section

    # run_action_list,name=ff_combustion,if=talent.frostfire_bolt&((time>=variable.combustion_delay)&(cooldown.combustion.remains<=variable.combustion_precast_time|buff.combustion.up|cooldown.combustion.ready))
    - run_action_list,name=ff_combustion,if=talent.frostfire_bolt&((combat.time>=var.combustion_delay)&(cooldown.combustion.remains<=var.combustion_precast_time|buff.combustion.up|cooldown.combustion.ready))
    # run_action_list,name=sf_combustion,if=!talent.frostfire_bolt&((time>=variable.combustion_delay)&(cooldown.combustion.remains<=variable.combustion_precast_time+gcd.max*(talent.sunfury_execution&cooldown.meteor.remains<gcd.max)|buff.combustion.up|cooldown.combustion.ready))
    - run_action_list,name=sf_combustion,if=!talent.frostfire_bolt&((combat.time>=var.combustion_delay)&(cooldown.combustion.remains<=var.combustion_precast_time+gcd.max*(talent.sunfury_execution&cooldown.meteor.remains<gcd.max)|buff.combustion.up|cooldown.combustion.ready))
    # run_action_list,name=ff_filler,if=talent.frostfire_bolt
    - run_action_list,name=ff_filler,if=talent.frostfire_bolt
    # run_action_list,name=sf_filler
    - run_action_list,name=sf_filler
