# Shadow Priest Rotation
# Spec ID: 258
version: 3
spec: 258
entry: main

config:
  desperate_prayer_hp:
    label: "Desperate Prayer HP"
    type: slider
    min: 20
    max: 90
    default: 75

  angelic_feather_moving:
    label: "Angelic Feather"
    type: checkbox
    default: true

  pi_target:
    type: unit_select
    label: "PI Target (Party)"
    max: 1               # Max selections (0 = unlimited)
    filter: all           # Role filter: all (default), tanks, healers, dps
    show_override: true   # Show in overlay right-click menu

  dispersion_hp:
    label: "Dispersion HP"
    type: slider
    min: 10
    max: 80
    default: 30

  vampiric_embrace_hp:
    label: "Vampiric Embrace HP"
    type: slider
    min: 0
    max: 100
    default: 100

  power_word_shield_hp:
    label: "Power Word: Shield HP"
    type: slider
    min: 0
    max: 100
    default: 60

variables:
  # variable,name=dots_up,op=set,value=active_dot.vampiric_touch=active_enemies&active_dot.shadow_word_pain>=active_dot.vampiric_touch,if=active_enemies<3
  # AoE: variable,name=dots_up,op=set,value=(active_dot.vampiric_touch+8*(action.shadow_crash.in_flight&action.shadow_crash.enabled))>=variable.max_vts|!variable.is_vt_possible
  # action.X.in_flight not supported — AoE version simplified; ST version uses active_enemies match
  dots_up: "(enemies_around_target<3)*(active_dot.vampiric_touch=enemies_around_target&active_dot.shadow_word_pain>=active_dot.vampiric_touch)+(enemies_around_target>=3)*((active_dot.vampiric_touch>=(enemies_around_target>?12)|target.time_to_die<18)&active_dot.shadow_word_pain>=active_dot.vampiric_touch)"
  # variable,name=holding_crash,op=set,value=raid_event.adds.in<15
  # raid_event not supported — always 0
  holding_crash: "0"
  # variable,name=max_vts,op=set,default=12,value=spell_targets.vampiric_touch>?12
  max_vts: "enemies_around_target>?12"
  # variable,name=is_vt_possible,op=set,value=1,target_if=max:(target.time_to_die*dot.vampiric_touch.refreshable),if=target.time_to_die>=18
  # target_if/cycling not supported — approximated with current target
  is_vt_possible: "target.time_to_die>=18"
  # variable,name=manual_vts_applied,op=set,value=(active_dot.vampiric_touch+8*!variable.holding_crash)>=variable.max_vts|!variable.is_vt_possible
  # holding_crash=0, so 8*!0=8
  manual_vts_applied: "(active_dot.vampiric_touch+8)>=var.max_vts|!var.is_vt_possible"

lists:
  racials:
    # fireblood,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=8
    - fireblood,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=8
    # berserking,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=12
    - berserking,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=12
    # blood_fury,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=15
    - blood_fury,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=15
    # ancestral_call,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=15
    - ancestral_call,if=((buff.voidform.up|!talent.voidform)&buff.power_infusion.up)|fight_remains<=15

  trinkets:
    # use_item,name=galactic_gladiators_badge_of_ferocity,if=(buff.voidform.up|buff.power_infusion.remains>=10|(talent.voidform&cooldown.voidform.remains>10))|fight_remains<20
    - use_item,name=galactic_gladiators_badge_of_ferocity,if=(buff.voidform.up|buff.power_infusion.remains>=10|(talent.voidform&cooldown.voidform.remains>10))|fight_remains<20
    # use_items,if=(buff.voidform.up|buff.power_infusion.remains>=10|equipped.neural_synapse_enhancer&buff.entropic_rift.up)|fight_remains<20
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  archon:
    # Interrupt Mind Flay for higher priority spells
    # halo
    - halo,interrupt=true,casting_check=mind_flay,range_check=none
    # voidform,if=active_dot.shadow_word_pain>=active_dot.vampiric_touch
    - voidform,interrupt=true,casting_check=mind_flay,if=active_dot.shadow_word_pain>=active_dot.vampiric_touch
    # power_infusion,if=(buff.voidform.up|!talent.voidform)&!buff.power_infusion.up
    - power_infusion,cycle=party,interrupt=true,casting_check=mind_flay,range_check=none,if=config.pi_target&config.pi_target.has(cycle.name)&(buff.voidform.up|!talent.voidform)
    - power_infusion,cycle=party,interrupt=true,casting_check=mind_flay,range_check=none,if=config.pi_target&(buff.voidform.up|!talent.voidform)
    - power_infusion,interrupt=true,casting_check=mind_flay,range_check=none,if=!config.pi_target&(buff.voidform.up|!talent.voidform)&!buff.power_infusion.up
    # shadow_word_death,target_if=max:(target.health.pct<=20)*100+dot.shadow_word_madness.ticking,if=priest.force_devour_matter&talent.devour_matter
    # priest.force_devour_matter not supported - commented out
    # shadow_word_madness,target_if=max:target.time_to_die*(dot.shadow_word_madness.remains<=gcd.max|variable.dr_force_prio|!talent.distorted_reality&variable.me_force_prio),if=active_dot.shadow_word_madness<=1&dot.shadow_word_madness.remains<=gcd.max|insanity.deficit<=35|buff.mind_devourer.react|!raid_event.adds.exists&target.time_to_die<=10|buff.entropic_rift.up&action.shadow_word_madness.cost>0
    # target_if dropped; raid_event not supported (removed); action.cost not supported (removed); entropic_rift only for voidweaver
    - shadow_word_madness,interrupt=true,casting_check=mind_flay,if=active_dot.shadow_word_madness<=1&dot.shadow_word_madness.remains<=gcd.max|insanity.deficit<=35|buff.mind_devourer.react|target.time_to_die<=10
    # void_volley
    - void_volley,interrupt=true,casting_check=mind_flay
    # tentacle_slam,target_if=min:dot.vampiric_touch.remains,if=dot.vampiric_touch.refreshable|cooldown.tentacle_slam.full_recharge_time<=gcd.max*2
    - tentacle_slam,delay=200,interrupt=true,casting_check=mind_flay,if=dot.vampiric_touch.refreshable&lastcast.tentacle_slam>=3
    - tentacle_slam,delay=200,interrupt=true,casting_check=mind_flay,if=cooldown.tentacle_slam.full_recharge_time<=gcd.max*2&lastcast.tentacle_slam>=3
    - vampiric_touch,interrupt=true,casting_check=mind_flay,if=dot.vampiric_touch.refreshable&lastcast.tentacle_slam>=3
    # shadow_word_pain,target_if=max:(refreshable*100000+target.time_to_die+dot.vampiric_touch.ticking*10000),if=talent.invoked_nightmare&refreshable&target.time_to_die>12&dot.vampiric_touch.ticking
    # target_if dropped
    - shadow_word_pain,interrupt=true,casting_check=mind_flay,if=dot.shadow_word_pain.refreshable&talent.invoked_nightmare&target.time_to_die>12&dot.vampiric_touch.ticking
    # mind_blast,target_if=max:dot.shadow_word_madness.remains,if=(!buff.mind_devourer.react|!talent.mind_devourer)
    # target_if dropped
    - mind_blast,interrupt=true,casting_check=mind_flay,if=!buff.mind_devourer.react|!talent.mind_devourer
    # mind_flay_insanity,target_if=max:dot.shadow_word_madness.remains
    # target_if dropped
    - mind_flay_insanity,interrupt=true,casting_check=mind_flay
    # shadow_word_death,target_if=min:target.health.pct,if=(pet.mindbender.active|pet.voidwraith.active|pet.shadowfiend.active)&talent.inescapable_torment|target.health.pct<(20+15*talent.deathspeaker)&talent.shadowfiend&talent.idol_of_yshaarj
    # target_if dropped
    - shadow_word_death,interrupt=true,casting_check=mind_flay,if=(pet.mindbender.active|pet.voidwraith.active|pet.shadowfiend.active)&talent.inescapable_torment|target.health.pct<(20+15*talent.deathspeaker)&talent.shadowfiend&talent.idol_of_yshaarj
    # shadow_word_death,target_if=min:target.health.pct,if=(target.health.pct<(20+15*talent.deathspeaker))
    - shadow_word_death,interrupt=true,casting_check=mind_flay,if=target.health.pct<(20+15*talent.deathspeaker)
    # shadow_word_death,target_if=target.health.pct<20
    - shadow_word_death,interrupt=true,casting_check=mind_flay,if=target.health.pct<20

