    # shadow_word_madness,target_if=max:target.time_to_die*(dot.shadow_word_madness.remains<=gcd.max|variable.dr_force_prio|!talent.distorted_reality&variable.me_force_prio),if=active_dot.shadow_word_madness<=1&dot.shadow_word_madness.remains<=gcd.max|insanity.deficit<=35|buff.mind_devourer.react|!raid_event.adds.exists&target.time_to_die<=10|buff.entropic_rift.up&action.shadow_word_madness.cost>0
    # target_if dropped; raid_event not supported (removed); action.cost not supported (removed)
    - shadow_word_madness,if=active_dot.shadow_word_madness<=1&dot.shadow_word_madness.remains<=gcd.max|insanity.deficit<=35|buff.mind_devourer.react|target.time_to_die<=10|buff.entropic_rift.up
    # void_volley
    - void_volley
    # void_blast,target_if=max:(dot.shadow_word_madness.remains*1000+target.time_to_die)
    # target_if dropped
    - void_blast
    # tentacle_slam,target_if=min:dot.vampiric_touch.remains,if=dot.vampiric_touch.refreshable|cooldown.tentacle_slam.full_recharge_time<=gcd.max*2
    - tentacle_slam,delay=200,if=dot.vampiric_touch.refreshable&lastcast.tentacle_slam>=3
    - tentacle_slam,delay=200,if=cooldown.tentacle_slam.full_recharge_time<=gcd.max*2&lastcast.tentacle_slam>=3
    - vampiric_touch,if=dot.vampiric_touch.refreshable&lastcast.tentacle_slam>=3
    # void_torrent,target_if=max:(dot.shadow_word_madness.remains*1000+target.time_to_die),if=!variable.holding_tentacle_slam&variable.dots_up
    # target_if dropped; holding_tentacle_slam=0 (raid_event not supported), simplified
    - void_torrent,if=var.dots_up
    # shadow_word_pain,target_if=max:(refreshable*100000+target.time_to_die+dot.vampiric_touch.ticking*10000),if=talent.invoked_nightmare&refreshable&target.time_to_die>12&dot.vampiric_touch.ticking
    # target_if dropped
    - shadow_word_pain,if=dot.shadow_word_pain.refreshable&talent.invoked_nightmare&target.time_to_die>12&dot.vampiric_touch.ticking
    # mind_blast,target_if=max:dot.shadow_word_madness.remains,if=(!buff.mind_devourer.react|!talent.mind_devourer)
    # target_if dropped
    - mind_blast,if=!buff.mind_devourer.react|!talent.mind_devourer
    # mind_flay_insanity,target_if=max:dot.shadow_word_madness.remains
    # target_if dropped
    - mind_flay_insanity
    # shadow_word_madness,target_if=max:dot.shadow_word_madness.remains,if=dot.shadow_word_madness.pmultiplier<1&dot.shadow_word_madness.ticking
    # dot.shadow_word_madness.pmultiplier not supported - commented out
    # - shadow_word_madness,if=dot.shadow_word_madness.ticking
    # tentacle_slam,target_if=min:dot.vampiric_touch.remains,if=(talent.void_apparitions|talent.maddening_tentacles)&(raid_event.adds.in>30|raid_event.adds.in>5&cooldown.tentacle_slam.full_recharge_time<=gcd.max*2)
    # target_if dropped; raid_event not supported (removed)
    - tentacle_slam,delay=200,if=(talent.void_apparitions|talent.maddening_tentacles)&lastcast.tentacle_slam>=3
    # vampiric_touch,target_if=max:(refreshable*10000+target.time_to_die),if=refreshable&target.time_to_die>12
    # target_if dropped
    - vampiric_touch,if=dot.vampiric_touch.refreshable&target.time_to_die>12
    # shadow_word_death,target_if=min:target.health.pct,if=(pet.mindbender.active|pet.voidwraith.active|pet.shadowfiend.active)&talent.inescapable_torment|target.health.pct<(20+15*talent.deathspeaker)&talent.shadowfiend&talent.idol_of_yshaarj
    # target_if dropped
    - shadow_word_death,if=(pet.mindbender.active|pet.voidwraith.active|pet.shadowfiend.active)&talent.inescapable_torment|target.health.pct<(20+15*talent.deathspeaker)&talent.shadowfiend&talent.idol_of_yshaarj
    # shadow_word_death,target_if=min:target.health.pct,if=(target.health.pct<(20+15*talent.deathspeaker))
    - shadow_word_death,if=target.health.pct<(20+15*talent.deathspeaker)
    # mind_flay,target_if=max:dot.shadow_word_madness.remains,chain=1,interrupt_immediate=1,interrupt_if=ticks>=2,interrupt_global=1
    - mind_flay
    # Use Tentacle Slam while moving as a low-priority action
    # tentacle_slam,if=raid_event.adds.in>20
    # raid_event not supported - removed condition
    - tentacle_slam,delay=200,if=lastcast.tentacle_slam>=3
    # shadow_word_death,target_if=target.health.pct<20
    - shadow_word_death,if=target.health.pct<20
    # shadow_word_death,target_if=max:dot.shadow_word_madness.remains
    - shadow_word_death
    # shadow_word_pain,target_if=min:remains
    - shadow_word_pain

  # Original: actions.aoe=call_action_list,name=aoe_variables
  # SimC aoe list ONLY calls aoe_variables (variable setting). Our variables: section handles this
  # automatically since expressions are re-evaluated each reference. No actions needed here.

  # --------------------------------------------------------------------------
  # Heal for Twist of Fate (Archon only — requires talent.lightburst)
  # --------------------------------------------------------------------------
  heal_for_tof:
    # holy_nova,if=talent.lightburst
    - holy_nova,range_check=none

  # Original: actions.precombat
  precombat:
    # shadowform,if=!buff.shadowform.up
    - shadowform,range_check=none,if=!buff.shadowform.up
    # variable,name=trinket_1_buffs,value=(trinket.1.has_buff.intellect|trinket.1.has_buff.mastery|trinket.1.has_buff.versatility|trinket.1.has_buff.haste|trinket.1.has_buff.crit|trinket.1.is.signet_of_the_priory)&(trinket.1.cooldown.duration>=20)
    # variable,name=trinket_1_buffs - commented out (trinket conditions)
    # variable,name=trinket_2_buffs,value=(trinket.2.has_buff.intellect|trinket.2.has_buff.mastery|trinket.2.has_buff.versatility|trinket.2.has_buff.haste|trinket.2.has_buff.crit|trinket.2.is.signet_of_the_priory)&(trinket.2.cooldown.duration>=20)
    # variable,name=trinket_2_buffs - commented out (trinket conditions)
    # arcane_torrent
    - arcane_torrent
    # tentacle_slam
    - tentacle_slam

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - power_word_fortitude,range_check=none,if=(buff.power_word_fortitude.down|action.power_word_fortitude.overlayed)&lastcast.power_word_fortitude>=10

    - shadowform,range_check=none,if=!buff.shadowform.up

    - angelic_feather.player,range_check=none,if=config.angelic_feather_moving&player.moving.time>1&buff.angelic_feather.down

    - silence,if=interrupt.target.check
    - silence.mouseover,if=interrupt.mouseover.check
    - silence.focus,if=interrupt.focus.check
    # AoE Interrupt
    - psychic_scream,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Combat Check
    - return,if=auto_combat.player

    # desperate_prayer,if=health.pct<=75
    - desperate_prayer,range_check=none,if=health.pct<=config.desperate_prayer_hp
    # dispersion (emergency)
    - dispersion,range_check=none,if=health.pct<=config.dispersion_hp
    # vampiric_embrace (maintain buff / emergency)
    - vampiric_embrace,range_check=none,if=buff.vampiric_embrace.down&health.pct<=config.vampiric_embrace_hp
    # power_word_shield (self)
    - power_word_shield,range_check=none,if=health.pct<=config.power_word_shield_hp

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    - call_action_list,name=trinkets
    - call_action_list,name=racials
    # call_action_list,name=aoe,if=active_enemies>2
    # SimC aoe list only sets variables — our variables: section handles this automatically
    - call_action_list,name=archon,if=talent.halo
    - call_action_list,name=voidweaver,if=talent.void_torrent
