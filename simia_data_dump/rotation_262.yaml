# =============================================================================
# Shaman Elemental - Spec ID 262
# =============================================================================

version: 3
spec: 262
entry: main

movement_allowed: buff.spiritwalkers_grace.up

config:
  astral_shift_hp_pct:
    section: "Defensive HP Percentage"
    label: "Astral Shift HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  astral_shift_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Astral Shift (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  healing_surge_OOC_hp_pct:
    label: "Healing Surge OOC HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  ghost_wolf_mode:
    label: "Auto Ghost Wolf"
    type: dropdown
    options:
      - "Off"
      - "Out of Combat"
      - "OOC + Far Target"
    default: 1

variables:

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - astral_shift,range_check=none,if=incoming.mitigated.pct>=config.astral_shift_dmg_pct

    # --- HP Percentage: react when already low ---
    - ancestral_protection,range_check=none,if=health.pct<=config.astral_shift_hp_pct
    - astral_shift,range_check=none,if=health.pct<=config.astral_shift_hp_pct

  aoe:
    # --- 3+ TARGET ROTATION ---
    # stormkeeper,if=cooldown.ascendance.remains>10|cooldown.ascendance.remains<gcd|fight_remains<20
    - stormkeeper,if=cooldown.ascendance.remains>10|cooldown.ascendance.remains<gcd|fight_remains<20
    # ancestral_swiftness
    - ancestral_swiftness
    # flame_shock,if=!buff.master_of_the_elements.up&((dot.flame_shock.refreshable&cooldown.ascendance.remains>5)|(buff.fire_elemental.up&buff.fire_elemental.remains<2))&talent.master_of_the_elements&talent.inferno_arc&spell_targets.chain_lightning=3
    - flame_shock,if=!buff.master_of_the_elements.up&((dot.flame_shock.refreshable&cooldown.ascendance.remains>5)|(buff.fire_elemental.up&buff.fire_elemental.remains<2))&talent.master_of_the_elements&talent.inferno_arc&enemies_around_target=3
    # voltaic_blaze,if=!buff.master_of_the_elements.up&((dot.flame_shock.refreshable&cooldown.ascendance.remains>5)|(buff.fire_elemental.up&buff.fire_elemental.remains<2)|talent.purging_flames)
    - voltaic_blaze,if=!buff.master_of_the_elements.up&((dot.flame_shock.refreshable&cooldown.ascendance.remains>5)|(buff.fire_elemental.up&buff.fire_elemental.remains<2)|talent.purging_flames)
    # ascendance,if=cooldown.stormkeeper.remains>15|fight_remains<20
    - ascendance,if=cooldown.stormkeeper.remains>15|fight_remains<20
    # elemental_blast,target_if=min:debuff.lightning_rod.remains,if=buff.tempest.stack<2&(buff.elemental_blast_critical_strike.up+buff.elemental_blast_haste.up+buff.elemental_blast_mastery.up=0)&talent.tempest
    - elemental_blast,if=buff.tempest.stack<2&(buff.elemental_blast_critical_strike.up+buff.elemental_blast_haste.up+buff.elemental_blast_mastery.up=0)&talent.tempest
    # earthquake,if=buff.tempest.stack<2&lightning_rod<active_enemies&(spell_targets.chain_lightning>=3+talent.elemental_blast)&(buff.elemental_blast_critical_strike.up+buff.elemental_blast_haste.up+buff.elemental_blast_mastery.up>0|!talent.elemental_blast)&talent.tempest
    - earthquake,if=buff.tempest.stack<2&active_dot.lightning_rod<enemies_around_target&(enemies_around_target>=3+talent.elemental_blast)&(buff.elemental_blast_critical_strike.up+buff.elemental_blast_haste.up+buff.elemental_blast_mastery.up>0|!talent.elemental_blast)&talent.tempest
    # earthquake,if=buff.call_of_the_ancestors.up|(spell_targets.chain_lightning>=3+3*talent.elemental_blast)&talent.call_of_the_ancestors
    # call_of_the_ancestors buff = spell 447244 (sc_shaman.cpp:12649); 10 rows share the display name
    - earthquake,if=buff.447244.up|(enemies_around_target>=3+3*talent.elemental_blast)&talent.call_of_the_ancestors
    # elemental_blast,target_if=min:debuff.lightning_rod.remains,if=buff.tempest.stack<2&(spell_targets.chain_lightning<=3+2*talent.call_of_the_ancestors)&!buff.call_of_the_ancestors.up
    - elemental_blast,if=buff.tempest.stack<2&(enemies_around_target<=3+2*talent.call_of_the_ancestors)&!buff.447244.up
    # lava_burst,if=buff.purging_flames.up&(buff.lava_surge.up&buff.flowing_elements.stack<2|cooldown.voltaic_blaze.remains<2)
    - lava_burst,if=buff.purging_flames.up&(buff.lava_surge.up&buff.flowing_elements.stack<2|cooldown.voltaic_blaze.remains<2)
    # lava_burst,if=(buff.tempest.up|!talent.purging_flames&talent.call_of_the_ancestors)&buff.lava_surge.up&talent.master_of_the_elements&spell_targets.chain_lightning=3
    - lava_burst,if=(buff.tempest.up|!talent.purging_flames&talent.call_of_the_ancestors)&buff.lava_surge.up&talent.master_of_the_elements&enemies_around_target=3
    # tempest,target_if=min:debuff.lightning_rod.remains,if=buff.master_of_the_elements.up
    - tempest,if=buff.master_of_the_elements.up
    # tempest,target_if=min:debuff.lightning_rod.remains,if=buff.stormkeeper.stack<4&buff.tempest.stack=2
    - tempest,if=buff.stormkeeper.stack<4&buff.tempest.stack=2
    # chain_lightning,if=buff.stormkeeper.up&maelstrom.deficit>(spell_targets.chain_lightning>?5)*(2+(spell_targets.chain_lightning>?5)+2)
    - chain_lightning,if=buff.stormkeeper.up&maelstrom.deficit>(enemies_around_target>?5)*(2+(enemies_around_target>?5)+2)
    # earthquake,if=!talent.elemental_blast&maelstrom.deficit<15+(buff.stormkeeper.up*(spell_targets.chain_lightning>?5)*(2+(spell_targets.chain_lightning>?5)))
    - earthquake,if=!talent.elemental_blast&maelstrom.deficit<15+(buff.stormkeeper.up*(enemies_around_target>?5)*(2+(enemies_around_target>?5)))
    # elemental_blast,if=talent.tempest
    - elemental_blast,if=talent.tempest
    # tempest,target_if=min:debuff.lightning_rod.remains
    - tempest
    # chain_lightning
    - chain_lightning
    # flame_shock,moving=1
    - flame_shock,moving=1
    # voltaic_blaze,moving=1
    - voltaic_blaze,moving=1
    # frost_shock,moving=1
    - frost_shock,moving=1

  single_target:
    # --- 1 and 2 TARGET ROTATION ---
    # stormkeeper,if=cooldown.ascendance.remains>10|cooldown.ascendance.remains<gcd|fight_remains<20
    - stormkeeper,if=cooldown.ascendance.remains>10|cooldown.ascendance.remains<gcd|fight_remains<20
    # ancestral_swiftness
    - ancestral_swiftness
    # flame_shock,if=!buff.master_of_the_elements.up&dot.flame_shock.refreshable&cooldown.ascendance.remains>5
    - flame_shock,if=!buff.master_of_the_elements.up&dot.flame_shock.refreshable&cooldown.ascendance.remains>5
    # flame_shock,target_if=min:dot.flame_shock.remains,if=!buff.master_of_the_elements.up&!buff.ascendance.up&buff.fire_elemental.up&buff.fire_elemental.remains<6*active_enemies-4
    - flame_shock,if=!buff.master_of_the_elements.up&!buff.ascendance.up&buff.fire_elemental.up&buff.fire_elemental.remains<6*enemies_around_target-4
    # voltaic_blaze,if=!buff.master_of_the_elements.up&(dot.flame_shock.refreshable&cooldown.ascendance.remains>5|talent.purging_flames&spell_targets.chain_lightning=2)
    - voltaic_blaze,if=!buff.master_of_the_elements.up&(dot.flame_shock.refreshable&cooldown.ascendance.remains>5|talent.purging_flames&enemies_around_target=2)
    # ascendance,if=cooldown.stormkeeper.remains>15|fight_remains<20
    - ascendance,if=cooldown.stormkeeper.remains>15|fight_remains<20
    # earthquake,if=buff.flowing_elements.up&buff.overcharge_tier.up&buff.call_of_the_ancestors.stack>=3&spell_targets.chain_lightning=2
    - earthquake,if=buff.flowing_elements.up&buff.1300222.up&buff.447244.stack>=3&enemies_around_target=2
    # elemental_blast,if=buff.flowing_elements.up&buff.overcharge_tier.up
    # overcharge_tier is a SimC-internal label = spell 1300222 (sc_shaman.cpp:12831)
    - elemental_blast,if=buff.flowing_elements.up&buff.1300222.up
    # earthquake,if=buff.flowing_elements.up&buff.overcharge_tier.up&buff.call_of_the_ancestors.up&spell_targets.chain_lightning=2
    - earthquake,if=buff.flowing_elements.up&buff.1300222.up&buff.447244.up&enemies_around_target=2
    # earth_shock,if=buff.flowing_elements.up&buff.overcharge_tier.up
    - earth_shock,if=buff.flowing_elements.up&buff.1300222.up
    # lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&cooldown.lava_burst.charges_fractional>1.8&((!buff.storm_elemental.up|buff.wind_gust.stack=4)+talent.call_of_the_ancestors>=spell_targets.chain_lightning)
    - lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&cooldown.lava_burst.charges_fractional>1.8&((!buff.storm_elemental.up|buff.wind_gust.stack=4)+talent.call_of_the_ancestors>=enemies_around_target)
    # lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&(maelstrom>52-5*talent.eye_of_the_storm*(1+talent.elemental_blast)+30*talent.elemental_blast)
    - lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&(maelstrom>52-5*talent.eye_of_the_storm*(1+talent.elemental_blast)+30*talent.elemental_blast)
    # lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&(maelstrom>52-5*talent.eye_of_the_storm)&buff.call_of_the_ancestors.stack>=3&spell_targets.chain_lightning=2
    - lava_burst,if=talent.master_of_the_elements&!buff.master_of_the_elements.up&maelstrom.deficit>15&(maelstrom>52-5*talent.eye_of_the_storm)&buff.447244.stack>=3&enemies_around_target=2
    # lava_burst,if=!talent.master_of_the_elements&maelstrom.deficit>15&(!buff.storm_elemental.up|buff.wind_gust.stack=4)&((cooldown.lava_burst.charges_fractional>1.8|!buff.call_of_the_ancestors.up)&(talent.molten_wrath|talent.purging_flames)|buff.lava_surge.up)
    - lava_burst,if=!talent.master_of_the_elements&maelstrom.deficit>15&(!buff.storm_elemental.up|buff.wind_gust.stack=4)&((cooldown.lava_burst.charges_fractional>1.8|!buff.447244.up)&(talent.molten_wrath|talent.purging_flames)|buff.lava_surge.up)
    # lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.flowing_elements.up
    - lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.flowing_elements.up
    # lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.power_of_the_maelstrom.stack=2
    - lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.power_of_the_maelstrom.stack=2
    # lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.purging_flames.up&cooldown.voltaic_blaze.remains<2&active_dot.flame_shock=2
    - lava_burst,if=!buff.master_of_the_elements.up&maelstrom.deficit>15&buff.purging_flames.up&cooldown.voltaic_blaze.remains<2&active_dot.flame_shock=2
    # tempest,if=buff.master_of_the_elements.up|!talent.master_of_the_elements
    - tempest,if=buff.master_of_the_elements.up|!talent.master_of_the_elements
    # lightning_bolt,if=buff.stormkeeper.up&buff.master_of_the_elements.up&talent.tempest
    - lightning_bolt,if=buff.stormkeeper.up&buff.master_of_the_elements.up&talent.tempest
    # earthquake,if=buff.call_of_the_ancestors.stack>=3&(buff.master_of_the_elements.up|!talent.master_of_the_elements|maelstrom.deficit<15)&spell_targets.chain_lightning=2
    - earthquake,if=buff.447244.stack>=3&(buff.master_of_the_elements.up|!talent.master_of_the_elements|maelstrom.deficit<15)&enemies_around_target=2
    # elemental_blast,target_if=min:debuff.lightning_rod.remains,if=buff.master_of_the_elements.up|maelstrom.deficit<15
    - elemental_blast,if=buff.master_of_the_elements.up|maelstrom.deficit<15
    # earthquake,if=(buff.master_of_the_elements.up|!talent.master_of_the_elements|maelstrom.deficit<15)&buff.call_of_the_ancestors.up&!talent.elemental_blast&spell_targets.chain_lightning=2
    - earthquake,if=(buff.master_of_the_elements.up|!talent.master_of_the_elements|maelstrom.deficit<15)&buff.447244.up&!talent.elemental_blast&enemies_around_target=2
    # earth_shock,target_if=min:debuff.lightning_rod.remains,if=buff.master_of_the_elements.up|maelstrom.deficit<15
    - earth_shock,if=buff.master_of_the_elements.up|maelstrom.deficit<15
    # flame_shock,target_if=min:dot.flame_shock.remains,if=buff.master_of_the_elements.up&dot.flame_shock.refreshable
    - flame_shock,if=buff.master_of_the_elements.up&dot.flame_shock.refreshable
    # voltaic_blaze,if=talent.crackling_fury&!buff.ascendance.up
    - voltaic_blaze,if=talent.crackling_fury&!buff.ascendance.up
    # tempest
    - tempest
    # chain_lightning,if=spell_targets.chain_lightning=2
    - chain_lightning,if=enemies_around_target=2
    # lightning_bolt
    - lightning_bolt
    # flame_shock,moving=1
    - flame_shock,moving=1
    # voltaic_blaze,moving=1
    - voltaic_blaze,moving=1
    # frost_shock,moving=1
    - frost_shock,moving=1

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - skyfury,range_check=none,if=(buff.skyfury.down.any|action.skyfury.overlayed)&lastcast.skyfury>=10
    - lightning_shield,range_check=none,if=buff.lightning_shield.down
    - flametongue_weapon,range_check=none,if=mainhand.enchant.remains<600
    - thunderstrike_ward,range_check=none,if=buff.thunderstrike_ward.down
    - healing_surge,range_check=none,if=health.pct<=config.healing_surge_OOC_hp_pct&!player.combat

    # Auto Ghost Wolf - Out of Combat
    - ghost_wolf,range_check=none,if=(config.ghost_wolf_mode=1|config.ghost_wolf_mode=2)&!player.combat&player.moving.time>1&buff.ghost_wolf.down

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    - wind_shear,if=interrupt.target.check
    - wind_shear.mouseover,if=interrupt.mouseover.check
    - wind_shear.focus,if=interrupt.focus.check
    # AoE Interrupt
    - capacitor_totem.player,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # Auto Ghost Wolf - Far Target (in combat)
    - ghost_wolf,range_check=none,if=config.ghost_wolf_mode=2&target.range>40&player.moving.time>1&buff.ghost_wolf.down

    # spiritwalkers_grace,moving=1,if=movement.distance>6
    - spiritwalkers_grace,if=player.moving.time>1
    # wind_shear
    # (already handled above in interrupts section)
    # blood_fury
    - blood_fury
    # berserking
    - berserking
    # fireblood
    - fireblood
    # ancestral_call
    - ancestral_call

    # use_item,name=stormbound_emblem_of_dazar,if=cooldown.ascendance.ready&(cooldown.stormkeeper.remains>15|cooldown.stormkeeper.remains<2)|fight_remains<23
    - use_item,name=stormbound_emblem_of_dazar,if=cooldown.ascendance.ready&(cooldown.stormkeeper.remains>15|cooldown.stormkeeper.remains<2)|fight_remains<23
    # use_item,name=hex_lords_dooming_idol,if=cooldown.ascendance.ready&cooldown.stormkeeper.remains>15|fight_remains<23
    - use_item,name=hex_lords_dooming_idol,if=cooldown.ascendance.ready&cooldown.stormkeeper.remains>15|fight_remains<23
    # use_item,slot=trinket1,use_off_gcd=1,if=!variable.trinket_1_special&variable.trinket_1_buffs&(cooldown.ascendance.remains>trinket.1.cooldown.duration-5|cooldown.ascendance.ready&cooldown.stormkeeper.remains>15|fight_remains<21)
    # use_item,slot=trinket2,use_off_gcd=1,if=!variable.trinket_2_special&variable.trinket_2_buffs&(cooldown.ascendance.remains>trinket.2.cooldown.duration-5|cooldown.ascendance.ready&cooldown.stormkeeper.remains>15|fight_remains<21)
    # use_item,slot=main_hand,use_off_gcd=1
    # use_item,slot=trinket1,use_off_gcd=1,if=!variable.trinket_1_special&!variable.trinket_1_buffs&(cooldown.ascendance.remains>20|trinket.2.cooldown.remains>20)
    # use_item,slot=trinket2,use_off_gcd=1,if=!variable.trinket_2_special&!variable.trinket_2_buffs&(cooldown.ascendance.remains>20|trinket.1.cooldown.remains>20)
    # trinket property math NOT supported; using generic sync
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync
    # lightning_shield,if=buff.lightning_shield.down
    # (already handled above in precombat/buffs section)
    # natures_swiftness
    - natures_swiftness
    # invoke_external_buff,name=power_infusion — not supported, removed
    # potion,if=buff.bloodlust.up|cooldown.ascendance.ready&cooldown.stormkeeper.remains>15|fight_remains<31 — not supported, removed
    # run_action_list,name=aoe,if=spell_targets.chain_lightning>=3
    - run_action_list,name=aoe,if=enemies_around_target>=3
    # run_action_list,name=single_target
    - run_action_list,name=single_target
