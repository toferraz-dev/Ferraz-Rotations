# ============================================================================
# Dispel List - Exception rules for specific debuffs
# ============================================================================
# By default, ALL dispellable debuffs are dispelled automatically.
# This list defines EXCEPTIONS to that default behavior.
#
# Format: debuff_spell_id -> rule
# Rules:
#   false              - Block: Never dispel this debuff
#   "expression"       - Condition: Only dispel if expression evaluates true
#
# Expression can use spell NAME or numeric ID:
#   "cycle.debuff.mystic_vapors.elapsed>=3"  # By spell name
#   "cycle.debuff.387564.elapsed>=3"         # By spell ID
#
# Examples:
#   389179: false                             # Block - never dispel this
#   387564: "cycle.debuff.387564.elapsed>=3"  # Condition - wait 3 seconds

dispel_list:

  # Example entries:
  # 389179: false                             # Block this debuff entirely
  # 387564: "cycle.debuff.387564.elapsed>=3"  # Wait 3s before dispelling
  438618: "cycle.debuff.438618.stacks>=2"
  387564: "cycle.debuff.387564.elapsed>=3"  # Mystic Vapors
  473713: "cycle.debuff.473713.remains<=3"  # Kinetic Explosive Gel
  429493: "cycle.debuff.429493.remains<=4"  # Unstable Corruption
  320788: "cycle.debuff.320788.remains<=3"  # Frozen Binds
  443436: "cycle.debuff.443436.elapsed>=4"
  443437: "cycle.debuff.443437.elapsed>=4"
  261440: "cycle.debuff.261440.elapsed>=4"
  388777: "cycle.debuff.388777.stacks>=5&cycle.debuff.388777.remains<=2"
  323347: "cycle.debuff.323347.stacks>=8"
  322410: "cycle.debuff.322410.remains<=7&cycle.debuff.322410.stacks>=3"
  374352: "cycle.debuff.374352.remains<=5"
  319898: "cycle.debuff.319898.stacks>=2"
  319070: "cycle.debuff.319070.stacks>=2"
  330700: "cycle.debuff.330700.stacks>=2"
  271564: "cycle.debuff.271564.stacks>=3"
  326092: "cycle.debuff.326092.stacks>=3"
  269301: "cycle.debuff.269301.stacks>=3"
  374389: "cycle.debuff.374389.stacks>=3"
  377510: "cycle.debuff.377510.stacks>=4"
  417807: "cycle.debuff.417807.stacks>=5"
  225908: "cycle.debuff.225908.stacks>=10"
  404141: "cycle.debuff.403912.up"  # Linked to 404141
  424889: "nameplates.casting.424888"  # Linked to 424889
  448561: "cycle.debuff.448561.elapsed>=1.5"
  1235060: "cycle.debuff.1235060.stacks>=10"  # Anima Tainted Armor
  1233865: "cycle.health.pct<=15" # Absorb Null Corona
  1233887: "cycle.health.pct<=15" # Null Corona (variant)
  218164: "cycle.debuff.218164.stacks>=8"
  1262930: "cycle.debuff.1262930.stacks>=8"
  1258459: "cycle.debuff.1258459.stacks>=8"
  1282244: "cycle.debuff.1282244.stacks>=6" #important Bleed. dont want to waist on 1 stack
  

