# Dispel Data Configuration
# =========================
# This file defines dispel capabilities by spec, and filtering rules for debuffs.
#
# Sections:
# - dispel_specs: Maps spec ID to friendly dispel spell (removing debuffs from allies)
# - offensive_dispels: Maps spec ID to offensive dispel spell (removing buffs from enemies)
# - dispel_list: Filtering rules for specific debuffs (block, allow, or conditional)

# ============================================================================
# Friendly Dispels - Removing debuffs from allies
