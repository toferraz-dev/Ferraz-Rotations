
# =============================================================================
# Fury Warrior - Spec ID 72
# =============================================================================
# Whirlwind needs a delay after a sucess cast.

# Conversion notes - apply throughout this file:
#   Removed raid_event - not supported

version: 3
spec: 72

config:
  impending_victory_hp_pct:
    label: "Impending Victory"
    type: slider
    min: 0
    max: 100
    default: 65
  enraged_regeneration_hp_pct:
    label: "Enraged Regeneration"
    type: slider
    min: 0
    max: 100
    default: 40
  rallying_cry_hp_pct:
    label: "Rallying Cry"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # Original: active_enemies=1&(raid_event.adds.in>15|!raid_event.adds.exists)
  st_planning: active_enemies=1

  # Original: active_enemies>=2&(!raid_event.adds.exists|raid_event.adds.exists&raid_event.adds.remains>5)
  adds_remain: active_enemies>=2

  # Original: (talent.massacre.enabled&target.health.pct<35)|target.health.pct<20
  execute_phase: (talent.massacre&target.health.pct<35)|target.health.pct<20

  # Original: buff.recklessness.down&buff.recklessness.down&rage<80&buff.sudden_death.down&!cooldown.bladestorm.ready&(!cooldown.execute.ready|!variable.execute_phase)
  # Note: SimC APL has buff.recklessness.down duplicated (likely intended buff.avatar.down for second)
  on_gcd_racials: buff.recklessness.down&buff.recklessness.down&rage<80&buff.sudden_death.down&!cooldown.bladestorm.ready&(!cooldown.execute.ready|!var.execute_phase)

lists:
  # ==========================================================================
  # TRINKETS - Commented out per conversion guide (trinket properties not supported)
  # ==========================================================================
  # Original trinket logic from SimC:
  # actions.trinkets=use_item,name=algethar_puzzle_box,if=cooldown.recklessness.remains<2
  # actions.trinkets+=/use_item,slot=trinket1,if=variable.trinket_1_buffs&(variable.trinket_priority=1|!variable.trinket_2_buffs|!trinket.2.has_cooldown)&(buff.recklessness.up)
  # actions.trinkets+=/use_item,slot=trinket2,if=variable.trinket_2_buffs&(variable.trinket_priority=2|!variable.trinket_1_buffs|!trinket.1.has_cooldown)&(buff.recklessness.up)
  # actions.trinkets+=/use_item,slot=trinket1,if=!variable.trinket_1_buffs&(variable.damage_trinket_priority=1|!variable.trinket_2_buffs|!trinket.2.has_cooldown)
  # actions.trinkets+=/use_item,slot=trinket2,if=!variable.trinket_2_buffs&(variable.damage_trinket_priority=2|!variable.trinket_1_buffs|!trinket.1.has_cooldown)
  trinkets:
    # use_item,name=algethar_puzzle_box,if=cooldown.recklessness.remains<2
    - use_item,name=algethar_puzzle_box,if=cooldown.recklessness.remains<2
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # ==========================================================================
  # SLAYER (Single Target)
  # ==========================================================================
  slayer:
    # actions.slayer=/recklessness
    - recklessness
    # actions.slayer+=/rampage,if=buff.enrage.remains<gcd
    - rampage,if=buff.enrage.remains<gcd
    # actions.slayer+=/rampage,if=buff.recklessness.up&rage>=100
    - rampage,if=buff.recklessness.up&rage>=100
    # actions.slayer+=/rampage,if=buff.recklessness.up&cooldown.bladestorm.ready
    - rampage,if=buff.recklessness.up&cooldown.bladestorm.ready
    # actions.slayer+=/bladestorm,if=buff.recklessness.up|target.time_to_die<=5
    - bladestorm,if=buff.recklessness.up|target.time_to_die<=5
    # actions.slayer+=/execute,if=buff.recklessness.up&buff.sudden_death.up
    - execute,if=buff.recklessness.up&buff.sudden_death.up
    # actions.slayer+=/rampage,if=buff.recklessness.up&!buff.hack_and_slash.up
    - rampage,if=buff.recklessness.up&!buff.hack_and_slash.up
    # actions.slayer+=/crushing_blow
    - crushing_blow
    # actions.slayer+=/odyns_fury,if=buff.recklessness.up
    - odyns_fury,if=buff.recklessness.up
    # actions.slayer+=/execute,if=buff.recklessness.up
    - execute,if=buff.recklessness.up
    # actions.slayer+=/bloodbath
    - bloodbath
    # actions.slayer+=/odyns_fury,if=buff.recklessness.up
    - odyns_fury,if=buff.recklessness.up
    # actions.slayer+=/rampage,if=rage>100
    - rampage,if=rage>100
    # actions.slayer+=/execute
    - execute
    # actions.slayer+=/execute,if=buff.sudden_death.up
    - execute,if=buff.sudden_death.up
    # actions.slayer+=/odyns_fury
    - odyns_fury
    # actions.slayer+=/execute
    - execute
    # actions.slayer+=/raging_blow
    - raging_blow
    # actions.slayer+=/rampage
    - rampage
    # actions.slayer+=/bloodthirst
    - bloodthirst
    # actions.slayer+=/whirlwind
    - whirlwind
    # actions.slayer+=/storm_bolt,if=buff.bladestorm.up
    # storm_bolt during bladestorm - not useful in our system

  # ==========================================================================
  # SLAYER (AoE)
  # ==========================================================================
  slayer_aoe:
    # actions.slayer_aoe=/whirlwind,if=talent.improved_whirlwind&buff.whirlwind.stack=0
    - whirlwind,if=talent.improved_whirlwind&buff.whirlwind.stack=0&(!prev_gcd.1.whirlwind|lastcast.whirlwind>gcd*1.2)
    # actions.slayer_aoe+=/recklessness
    - recklessness
    # actions.slayer_aoe+=/avatar
    - avatar
    # actions.slayer_aoe+=/rampage
    - rampage
    # actions.slayer_aoe+=/bladestorm,if=buff.recklessness.up|target.time_to_die<=5
    - bladestorm,if=buff.recklessness.up|target.time_to_die<=5
    # actions.slayer_aoe+=/execute,if=buff.sudden_death.up
    - execute,if=buff.sudden_death.up
    # actions.slayer_aoe+=/odyns_fury
    - odyns_fury
    # actions.slayer_aoe+=/crushing_blow
    - crushing_blow
    # actions.slayer_aoe+=/bloodbath
    - bloodbath
    # actions.slayer_aoe+=/execute
    - execute
    # actions.slayer_aoe+=/raging_blow
    - raging_blow
    # actions.slayer_aoe+=/bloodthirst
    - bloodthirst
    # actions.slayer_aoe+=/whirlwind
    - whirlwind
    # actions.slayer_aoe+=/storm_bolt,if=buff.bladestorm.up
    # storm_bolt during bladestorm - not useful in our system

  # ==========================================================================
  # THANE (Single Target)
  # ==========================================================================
  thane:
    # actions.thane=/recklessness
    - recklessness
    # actions.thane+=/avatar
    - avatar
    # actions.thane+=/rampage,if=buff.enrage.remains<gcd|rage>=100
    - rampage,if=buff.enrage.remains<gcd|rage>=100
    # actions.thane+=/bloodbath,if=buff.recklessness.up&buff.fury_mid2_4pc_crit.stack<2
    # buff.fury_mid2_4pc_crit is a synthetic SimC buff with no spell data (sc_warrior.cpp:8555,
    # make_buff with no spell) — no in-game aura to read, so the term is dropped (assumed true).
    - bloodbath,if=buff.recklessness.up
    # actions.thane+=/thunder_blast,if=buff.thunder_blast.stack=2|buff.avatar.remains<2|buff.thunder_blast.remains<2
    - thunder_blast,if=buff.thunder_blast.stack=2|buff.avatar.remains<2|buff.thunder_blast.remains<2
    # actions.thane+=/crushing_blow,if=buff.hack_and_slash.up
    - crushing_blow,if=buff.hack_and_slash.up
    # actions.thane+=/bloodbath
    - bloodbath
    # actions.thane+=/rampage,if=buff.recklessness.up
    - rampage,if=buff.recklessness.up
    # actions.thane+=/thunder_blast,if=buff.avatar.up
    - thunder_blast,if=buff.avatar.up
    # actions.thane+=/crushing_blow
    - crushing_blow
    # actions.thane+=/raging_blow,if=buff.hack_and_slash.up
    - raging_blow,if=buff.hack_and_slash.up
    # actions.thane+=/thunder_blast
    - thunder_blast
    # actions.thane+=/rampage
    - rampage
    # actions.thane+=/bloodthirst
    - bloodthirst
    # actions.thane+=/execute,if=talent.deep_wounds
    - execute,if=talent.deep_wounds
    # actions.thane+=/raging_blow
    - raging_blow
    # actions.thane+=/odyns_fury
    - odyns_fury
    # actions.thane+=/thunder_clap,if=buff.avatar.up&!talent.wrath_and_fury
    - thunder_clap,if=buff.avatar.up&!talent.wrath_and_fury
    # actions.thane+=/execute
    - execute
    # actions.thane+=/thunder_clap
    - thunder_clap

  # ==========================================================================
  # THANE (AoE)
  # ==========================================================================
  thane_aoe:
    # actions.thane_aoe=/odyns_fury
    - odyns_fury
    # actions.thane_aoe+=/recklessness
    - recklessness
    # actions.thane_aoe+=/avatar
    - avatar
    # actions.thane_aoe+=/rampage,if=!buff.enrage.up
    - rampage,if=!buff.enrage.up
    # actions.thane_aoe+=/thunder_blast
    - thunder_blast
    # actions.thane_aoe+=/thunder_blast,if=buff.thunder_blast.stack=2
    - thunder_blast,if=buff.thunder_blast.stack=2
    # actions.thane_aoe+=/thunder_blast,if=buff.avatar.up
    - thunder_blast,if=buff.avatar.up
    # actions.thane_aoe+=/thunder_clap,if=talent.improved_whirlwind&buff.whirlwind.stack=0|(buff.avatar.up&active_enemies>6)
    - thunder_clap,if=talent.improved_whirlwind&buff.whirlwind.stack=0|(buff.avatar.up&active_enemies>6)
    # actions.thane_aoe+=/rampage,if=buff.enrage.remains<gcd|rage>=100
    - rampage,if=buff.enrage.remains<gcd|rage>=100
    # actions.thane_aoe+=/bloodbath
    - bloodbath
    # actions.thane_aoe+=/crushing_blow,if=buff.hack_and_slash.up
    - crushing_blow,if=buff.hack_and_slash.up
    # actions.thane_aoe+=/rampage,if=buff.recklessness.up
    - rampage,if=buff.recklessness.up
    # actions.thane_aoe+=/thunder_clap,if=buff.avatar.up
    - thunder_clap,if=buff.avatar.up
    # actions.thane_aoe+=/crushing_blow
    - crushing_blow
    # actions.thane_aoe+=/bloodthirst
    - bloodthirst
    # actions.thane_aoe+=/thunder_blast
    - thunder_blast
    # actions.thane_aoe+=/raging_blow,if=buff.hack_and_slash.up
    - raging_blow,if=buff.hack_and_slash.up
    # actions.thane_aoe+=/execute
    - execute
    # actions.thane_aoe+=/rampage
    - rampage
    # actions.thane_aoe+=/thunder_clap
    - thunder_clap
    # actions.thane_aoe+=/raging_blow
    - raging_blow
    # actions.thane_aoe+=/whirlwind
    - whirlwind

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # Shared lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Shattering Throw — deals up to 500% increased damage to absorb shields
        # Shattering Throw — deals up to 500% increased damage to absorb shields
    - shattering_throw,if=target.absorb>0
    - wrecking_throw,if=target.absorb>0

    - battle_shout,range_check=none,if=(!buff.battle_shout.up.any|buff.battle_shout.remains.any<60|action.battle_shout.overlayed)&lastcast.battle_shout>=10
    # actions.precombat+=/berserker_stance,toggle=on
    - berserker_stance,range_check=none,if=!buff.berserker_stance.up

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - enraged_regeneration,range_check=none,if=health.pct<=config.enraged_regeneration_hp_pct
    - rallying_cry,range_check=none,if=health.pct<=config.rallying_cry_hp_pct
    - impending_victory,if=health.effective.pct<=config.impending_victory_hp_pct
    - spell_reflection,range_check=none,if=incoming_cast.player.reflectable.up|incoming_cast.aoe.reflectable.up

    # Interrupts
    - pummel,if=interrupt.target.check
    - pummel.mouseover,if=interrupt.mouseover.check
    - pummel.focus,if=interrupt.focus.check
    # CC Interrupt
    - storm_bolt,if=interrupt.cc.check
    # AoE Interrupt
    - shockwave,if=interrupt.stun.aoe.check
    - intimidating_shout,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # actions+=/charge,if=time<=0.5|movement.distance>5
    # movement.distance not supported - using target.range for gap closing
    - charge,if=target.range>8&player.combat.time<=0.5

    # heroic_leap,if=(raid_event.movement.distance>25&raid_event.movement.in>45)

    # Original: potion,if=target.time_to_die>300|buff.recklessness.up|target.time_to_die<25
    # potion - not supported

    # Trinkets
    - call_action_list,name=trinkets

    # Racials
    # actions+=/lights_judgment,if=variable.on_gcd_racials
    - lights_judgment,if=var.on_gcd_racials
    # actions+=/bag_of_tricks,if=variable.on_gcd_racials
    - bag_of_tricks,if=var.on_gcd_racials
    # actions+=/berserking,if=buff.recklessness.up
    - berserking,if=buff.recklessness.up
    # actions+=/blood_fury
    - blood_fury
    # actions+=/fireblood
    - fireblood
    # actions+=/ancestral_call
    - ancestral_call

    # External buffs not supported

    # Hero tree routing
    # actions+=/run_action_list,name=slayer,if=talent.slayers_dominance&active_enemies=1
    - run_action_list,name=slayer,if=talent.slayers_dominance&active_enemies=1
    # actions+=/run_action_list,name=slayer_aoe,if=talent.slayers_dominance&active_enemies>1
    - run_action_list,name=slayer_aoe,if=talent.slayers_dominance&active_enemies>1
    # actions+=/run_action_list,name=thane,if=talent.lightning_strikes&active_enemies=1
    - run_action_list,name=thane,if=active_enemies=1
    # actions+=/run_action_list,name=thane_aoe,if=talent.lightning_strikes&active_enemies>1
    - run_action_list,name=thane_aoe,if=active_enemies>1
