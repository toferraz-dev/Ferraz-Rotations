# =============================================================================
# Mage Frost - Spec ID 64
# =============================================================================

version: 3
spec: 64
entry: main

config:
  ice_barrier_hp_pct:
    section: "Defensive HP Percentage"
    label: "Ice Barrier HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  ice_barrier_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Ice Barrier (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  ice_block_hp_pct:
    section: "Defensive HP Percentage"
    label: "Ice Block HP%"
    type: slider
    min: 0
    max: 100
    default: 20

  ice_block_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Ice Block (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 75

variables:
  # variable,name=ff_trinket_timing,value=talent.frostfire_bolt&(fight_remains<15|!equipped.vaelgors_final_stare|prev_gcd.1.comet_storm)
  ff_trinket_timing: "talent.frostfire_bolt&(fight_remains<15|!equipped.vaelgors_final_stare|prev_gcd.1.comet_storm)"
  # variable,name=ss_trinket_timing,value=talent.splinterstorm&(time=0|fight_remains<15|prev_gcd.1.frozen_orb|cooldown.ray_of_frost.charges>=1&debuff.freezing.react<6&!buff.fingers_of_frost.react&(icicles<3|time-action.potion.last_used<25))
  # Stripped: icicles, action.potion.last_used (not supported)
  ss_trinket_timing: "talent.splinterstorm&(combat.time=0|fight_remains<15|prev_gcd.1.frozen_orb|cooldown.ray_of_frost.charges>=1&debuff.freezing.react<6&!buff.fingers_of_frost.react)"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - ice_barrier,range_check=none,if=incoming.mitigated.pct>=config.ice_barrier_dmg_pct
    - ice_block,range_check=none,if=incoming.mitigated.pct>=config.ice_block_dmg_pct

    # --- HP Percentage: react when already low ---
    - ice_barrier,range_check=none,if=health.pct<=config.ice_barrier_hp_pct
    - ice_block,range_check=none,if=health.pct<=config.ice_block_hp_pct

  # ============================================================================
  # CDS - Items, Racials, Openers, End-Of-Fight
  # ============================================================================
  cds:
    # use_item,name=nevermelting_ice_crystal,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - use_item,name=nevermelting_ice_crystal,if=var.ff_trinket_timing|var.ss_trinket_timing
    # use_item,name=freightrunners_flask,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - use_item,name=freightrunners_flask,if=var.ff_trinket_timing|var.ss_trinket_timing
    # use_item,name=vaelgors_final_stare,if=(variable.ff_trinket_timing|variable.ss_trinket_timing)&(stat.haste_rating>stat.crit_rating|stat.versatility_rating>stat.crit_rating)
    # Stripped: stat.* conditions (not supported)
    - use_item,name=vaelgors_final_stare,if=var.ff_trinket_timing|var.ss_trinket_timing
    # potion,if=variable.ff_trinket_timing|variable.ss_trinket_timing|fight_remains<35
    # potion — not supported
    # use_item,name=vaelgors_final_stare,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - use_item,name=vaelgors_final_stare,if=var.ff_trinket_timing|var.ss_trinket_timing

    # blood_fury,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - blood_fury,if=var.ff_trinket_timing|var.ss_trinket_timing
    # berserking,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - berserking,if=var.ff_trinket_timing|var.ss_trinket_timing
    # fireblood,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - fireblood,if=var.ff_trinket_timing|var.ss_trinket_timing
    # ancestral_call,if=variable.ff_trinket_timing|variable.ss_trinket_timing
    - ancestral_call,if=var.ff_trinket_timing|var.ss_trinket_timing

    # Frostfire Opener
    # flurry,if=active_enemies>=3&talent.wintertide&talent.frostfire_bolt&!variable.target_swapping,line_cd=9999
    - flurry,if=enemies_around_target>=3&talent.wintertide&talent.frostfire_bolt,line_cd=9999
    # ray_of_frost,if=talent.frostfire_bolt&!variable.target_swapping,line_cd=9999
    - ray_of_frost,if=talent.frostfire_bolt,line_cd=9999

    # Spellslinger Opener
    # flurry,if=active_enemies>=4&talent.wintertide&talent.splinterstorm&!variable.target_swapping,line_cd=9999
    - flurry,if=enemies_around_target>=4&talent.wintertide&talent.splinterstorm,line_cd=9999
    # frozen_orb,if=active_enemies>=4&talent.splinterstorm,line_cd=9999
    - frozen_orb,if=enemies_around_target>=4&talent.splinterstorm,line_cd=9999
    # ray_of_frost,if=talent.splinterstorm&!variable.target_swapping,line_cd=9999
    - ray_of_frost,if=talent.splinterstorm,line_cd=9999

    # End-Of-Fight
    # ray_of_frost,if=!variable.target_swapping&fight_remains<12
    - ray_of_frost,if=fight_remains<12

    # invoke_external_buff,name=power_infusion,if=buff.power_infusion.down

  # ============================================================================
  # FROSTFIRE AOE (3+ targets)
  # ============================================================================
  ff_aoe:
    # flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    # frozen_orb
    - frozen_orb
    # comet_storm
    - comet_storm
    # glacial_spike
    - glacial_spike
    # blizzard,if=active_enemies>=6|active_enemies>=4&talent.freezing_rain|talent.freezing_winds
    - blizzard,if=enemies_around_target>=6|enemies_around_target>=4&talent.freezing_rain|talent.freezing_winds
    # ice_lance,if=buff.fingers_of_frost.react
    - ice_lance,if=buff.fingers_of_frost.react
    # ice_lance,if=debuff.freezing.stack>=10
    - ice_lance,if=debuff.freezing.stack>=10
    # flurry,if=cooldown_react
    - flurry
    # ray_of_frost,if=!buff.frostfire_empowerment.react
    - ray_of_frost,if=!buff.frostfire_empowerment.react
    # frostbolt
    - frostbolt
    # call_action_list,name=movement
    - call_action_list,name=movement

  # ============================================================================
  # FROSTFIRE ST
  # ============================================================================
  ff_st:
    # flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    # frozen_orb
    - frozen_orb
    # comet_storm
    - comet_storm
    # glacial_spike
    - glacial_spike
    # ice_lance,if=buff.fingers_of_frost.react
    - ice_lance,if=buff.fingers_of_frost.react
    # ice_lance,if=debuff.freezing.stack>=10
    - ice_lance,if=debuff.freezing.stack>=10
    # flurry,if=cooldown_react
    - flurry
    # ray_of_frost
    - ray_of_frost
    # frostbolt
    - frostbolt
    # call_action_list,name=movement
    - call_action_list,name=movement

  # ============================================================================
  # MOVEMENT
  # ============================================================================
  movement:
    # any_blink,if=movement.distance>5
    # blizzard,if=buff.freezing_rain.up
    - blizzard,if=buff.freezing_rain.up
    # ice_nova,if=talent.cone_of_frost
    - ice_nova,if=talent.cone_of_frost
    # cone_of_cold,if=talent.cone_of_frost
    - cone_of_cold,if=talent.cone_of_frost
    # ice_lance
    - ice_lance

  # ============================================================================
  # SPELLSLINGER AOE (4+ targets)
  # ============================================================================
  ss_aoe:
    # comet_storm
    - comet_storm
    # blizzard,if=buff.freezing_rain.up
    - blizzard,if=buff.freezing_rain.up
    # flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    # ice_lance,if=buff.fingers_of_frost.react=2
    - ice_lance,if=buff.fingers_of_frost.react=2
    # frozen_orb
    - frozen_orb
    # glacial_spike
    - glacial_spike
    # ice_lance,if=buff.fingers_of_frost.react
    - ice_lance,if=buff.fingers_of_frost.react
    # ice_lance,if=debuff.freezing.react>=6
    - ice_lance,if=debuff.freezing.react>=6
    # ice_nova,if=talent.cone_of_frost
    - ice_nova,if=talent.cone_of_frost
    # cone_of_cold,if=talent.cone_of_frost
    - cone_of_cold,if=talent.cone_of_frost
    # blizzard,if=talent.freezing_winds
    - blizzard,if=talent.freezing_winds
    # ray_of_frost,if=icicles<3|time-action.potion.last_used<25
    # Removed: icicles and action.potion.last_used not supported
    - ray_of_frost
    # flurry,if=cooldown_react
    - flurry
    # frostbolt
    - frostbolt
    # call_action_list,name=movement
    - call_action_list,name=movement

  # ============================================================================
  # SPELLSLINGER ST
  # ============================================================================
  ss_st:
    # comet_storm
    - comet_storm
    # flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    - flurry,if=buff.brain_freeze.react&buff.thermal_void.down
    # ice_lance,if=buff.fingers_of_frost.react=2
    - ice_lance,if=buff.fingers_of_frost.react=2
    # frozen_orb
    - frozen_orb
    # glacial_spike
    - glacial_spike
    # ice_lance,if=buff.fingers_of_frost.react
    - ice_lance,if=buff.fingers_of_frost.react
    # ice_lance,if=debuff.freezing.react>=6
    - ice_lance,if=debuff.freezing.react>=6
    # ray_of_frost,if=icicles<3|time-action.potion.last_used<25
    # Removed: icicles and action.potion.last_used not supported
    - ray_of_frost
    # flurry,if=cooldown_react
    - flurry
    # frostbolt
    - frostbolt
    # call_action_list,name=movement
    - call_action_list,name=movement

  # ============================================================================
  # MAIN
  # ============================================================================
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # arcane_intellect
    - arcane_intellect,range_check=none,if=(buff.arcane_intellect.down|action.arcane_intellect.overlayed)&lastcast.arcane_intellect>=10
    # summon_water_elemental
    - summon_water_elemental,range_check=none,if=!pet.alive

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - counterspell,if=interrupt.target.check
    - counterspell.mouseover,if=interrupt.mouseover.check
    - counterspell.focus,if=interrupt.focus.check
    # CC Interrupt
    - dragons_breath,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # CDs (items, racials, opener, end-of-fight)
    # call_action_list,name=cds
    - call_action_list,name=cds

    # run_action_list,name=ff_aoe,if=talent.frostfire_bolt&active_enemies>=3
    - run_action_list,name=ff_aoe,if=talent.frostfire_bolt&enemies_around_target>=3
    # run_action_list,name=ff_st,if=talent.frostfire_bolt
    - run_action_list,name=ff_st,if=talent.frostfire_bolt
    # run_action_list,name=ss_aoe,if=active_enemies>=4
    - run_action_list,name=ss_aoe,if=enemies_around_target>=4
    # run_action_list,name=ss_st
    - run_action_list,name=ss_st
