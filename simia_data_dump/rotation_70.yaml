# =============================================================================
# Paladin Retribution - SpecID 70
# SimC APL Conversion
# =============================================================================

version: 3
spec: 70
entry: main

config:
  wog_solo_hp_pct:
    section: "Defensive HP Percentage"
    label: "Word of Glory HP% (Solo)"
    type: slider
    default: 70
    min: 0
    max: 100
  wog_group_hp_pct:
    section: "Defensive HP Percentage"
    label: "Word of Glory HP% (Group)"
    type: slider
    default: 30
    min: 0
    max: 100
  loh_usage:
    section: "Defensive HP Percentage"
    label: "Lay on Hands HP%"
    type: slider
    default: 30
    min: 0
    max: 100
  lay_on_hands_party_hp:
    section: "Defensive HP Percentage"
    label: "LoH Party HP%"
    type: slider
    min: 0
    max: 100
    default: 20
  lay_on_hands_party_target:
    label: "LoH Party Target"
    type: multi_select
    options:
      - "Tanks"
      - "Healers"
      - "DPS"
    default: []
  blessing_of_sacrifice_party_hp:
    section: "Defensive HP Percentage"
    label: "BoS Party HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  blessing_of_sacrifice_self_hp:
    section: "Defensive HP Percentage"
    label: "BoS Min Self HP%"
    type: slider
    min: 0
    max: 100
    default: 60
  blessing_of_sacrifice_party_target:
    label: "BoS Party Target"
    type: multi_select
    options:
      - "Tanks"
      - "Healers"
      - "DPS"
    default: []
  bop_usage:
    section: "Defensive HP Percentage"
    label: "Blessing of Protection HP%"
    type: slider
    default: 30
    min: 0
    max: 100
  ds_usage:
    section: "Defensive HP Percentage"
    label: "Divine Shield HP%"
    type: slider
    default: 30
    min: 0
    max: 100
  divine_shield_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Divine Shield (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 75
  dp_usage:
    section: "Defensive HP Percentage"
    label: "Divine Protection HP%"
    type: slider
    default: 70
    min: 0
    max: 100
  divine_protection_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Divine Protection (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

# Hold Wake of Ashes / Divine Toll to align with ES (60s) and AW (60s).
# Allow if the long CD is ready now (=0, we'll cast it this GCD) OR is >=10s away.
# Hold if it's coming in <10s (so the 30s WoA/Toll drift to sync).
# Skip AW gate if radiant_glory (AW comes free from WoA/Toll).
# Two leading OR escapes that always permit the cast (bypassing the ES gate):
#  1. Dungeon sync window: AW is ~one of the spell's own CDs away (dungeon-only).
#     WoA CD = 30s. Divine Toll CD = 30s with Light's Guidance, 60s with Dawnlight.
#  2. Execution Sentence ticking on any mob — dump into the ES window.
# Divine Toll also holds while a normal (5-HP) Hammer of Light window is up so HoL is taken first
# (top-5 Templar logs: WoA->HoL->Toll every cycle). A free HoL (cost 0) does not gate Toll.
spell_overrides:
  wake_of_ashes: "(player.indungeon&cooldown_bypass.avenging_wrath.remains<=30&cooldown_bypass.avenging_wrath.remains>27)|active_dot.execution_sentence>0|((!talent.execution_sentence|cooldown_bypass.execution_sentence.remains=0|cooldown_bypass.execution_sentence.remains>=10)&(talent.radiant_glory|cooldown_bypass.avenging_wrath.remains=0|cooldown_bypass.avenging_wrath.remains>=10))"
  divine_toll: "((player.indungeon&((talent.lights_guidance&cooldown_bypass.avenging_wrath.remains<=30&cooldown_bypass.avenging_wrath.remains>27)|(!talent.lights_guidance&cooldown_bypass.avenging_wrath.remains<=60&cooldown_bypass.avenging_wrath.remains>57)))|active_dot.execution_sentence>0|((!talent.execution_sentence|cooldown_bypass.execution_sentence.remains=0|cooldown_bypass.execution_sentence.remains>=10)&(talent.radiant_glory|cooldown_bypass.avenging_wrath.remains=0|cooldown_bypass.avenging_wrath.remains>=10)))&(!buff.hammer_of_light.up|buff.433732.up)"

variables:
  # variable,name=ds_castable,value=(active_enemies>=2|buff.divine_arbiter_verdict.up)&!buff.empyrean_legacy.up&!buff.divine_arbiter_divine_storm.up
  # "Divine Arbiter" = 7 spells, so ids are mandatory. Which buff lands depends on the spender:
  #   Final Verdict -> 1306161, Divine Storm -> 1306162, Hammer of Light -> 1310461 (unused).
  # The in-game default Cooldown Manager tracks the wrong id for this.
  ds_castable: (active_enemies>=2|buff.1306161.up)&!buff.empyrean_legacy.up&!buff.1306162.up

  # variable,name=pre_es_wake,op=reset,default=0
  # Sim-profile switch (section 2.17): assigned ONLY by that precombat reset, never from an
  # in-combat condition, so it is 0 for us. Declared here so the lines that read it stay
  # verbatim with upstream instead of being collapsed by hand.
  pre_es_wake: "0"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - divine_protection,range_check=none,if=buff.divine_shield.down&incoming.mitigated.pct>=config.divine_protection_dmg_pct
    - divine_shield,range_check=none,if=player.debuff.forbearance.down&incoming.mitigated.pct>=config.divine_shield_dmg_pct

    # --- HP Percentage: react when already low ---
    - divine_protection,if=buff.divine_shield.down&health.pct<=config.dp_usage
    - word_of_glory,if=health.pct<=30&incoming.mitigated.pct>=30
    - word_of_glory,if=player.solo&health.pct<=config.wog_solo_hp_pct
    - word_of_glory,if=player.group&health.pct<=config.wog_group_hp_pct
    - lay_on_hands,if=player.debuff.forbearance.down&health.pct<=config.loh_usage
    # LoH Party - cast on party members by role (multi_select: 0=Tanks, 1=Healers, 2=DPS)
    - lay_on_hands,delay=500,cycle=party,if=config.lay_on_hands_party_target.has(0)&cycle.tank&cycle.health.pct<=config.lay_on_hands_party_hp
    - lay_on_hands,delay=500,cycle=party,if=config.lay_on_hands_party_target.has(1)&cycle.healer&cycle.health.pct<=config.lay_on_hands_party_hp
    - lay_on_hands,delay=500,cycle=party,if=config.lay_on_hands_party_target.has(2)&cycle.dps&cycle.health.pct<=config.lay_on_hands_party_hp
    # BoS Party - redirects 30% of their damage to us, so gate on our own HP (multi_select: 0=Tanks, 1=Healers, 2=DPS)
    - blessing_of_sacrifice,delay=500,cycle=party,if=config.blessing_of_sacrifice_party_target.has(0)&cycle.tank&cycle.health.effective.pct<=config.blessing_of_sacrifice_party_hp&health.pct>=config.blessing_of_sacrifice_self_hp
    - blessing_of_sacrifice,delay=500,cycle=party,if=config.blessing_of_sacrifice_party_target.has(1)&cycle.healer&cycle.health.effective.pct<=config.blessing_of_sacrifice_party_hp&health.pct>=config.blessing_of_sacrifice_self_hp
    - blessing_of_sacrifice,delay=500,cycle=party,if=config.blessing_of_sacrifice_party_target.has(2)&cycle.dps&cycle.health.effective.pct<=config.blessing_of_sacrifice_party_hp&health.pct>=config.blessing_of_sacrifice_self_hp
    - blessing_of_protection,if=player.debuff.forbearance.down&health.pct<=config.bop_usage
    # M+ threat drop: an enemy is tanking-on us (nameplates.threat.max>=2) while in combat in a key with a tank present
    - blessing_of_protection,if=combat>=1&nameplates.threat.max>=2&player.inmythicplus&group.tanks.count>=1&player.debuff.forbearance.down
    - divine_shield,if=player.debuff.forbearance.down&health.pct<=config.ds_usage

  cooldowns:
    # custom: force Wake of Ashes / Divine Toll in two cases:
    #  1. Dungeon CD-hold desync fix (dungeon-only) — press when AW is ~one of the spell's
    #     own CDs away so it recharges right as AW comes up. Window = (CD-3, CD].
    #     WoA = 30s. Divine Toll = 30s with Light's Guidance, 60s with Dawnlight.
    #  2. Execution Sentence ticking on any mob — always dump these into the ES window.
    # ES-after-wings must come FIRST: right after AW cast, cooldown.avenging_wrath.remains=60,
    # which lands inside the no-Light's-Guidance Divine Toll window (57,60] and would otherwise
    # fire Toll before ES. With ES first, AW > ES > Toll/WoA; the WoA/Toll lines then fire next
    # GCD via active_dot.execution_sentence>0 (AW still ~58.5s out, still inside the window).
    # custom: execution sentece should be used imeditially after wings
    - execution_sentence,if=lastcast.avenging_wrath<=5
    - wake_of_ashes,if=(player.indungeon&cooldown.avenging_wrath.remains<=30&cooldown.avenging_wrath.remains>27)|active_dot.execution_sentence>0
    - divine_toll,if=(player.indungeon&((talent.lights_guidance&cooldown.avenging_wrath.remains<=30&cooldown.avenging_wrath.remains>27)|(!talent.lights_guidance&cooldown.avenging_wrath.remains<=60&cooldown.avenging_wrath.remains>57)))|active_dot.execution_sentence>0
    # - potion,if=buff.avenging_wrath.up|debuff.execution_sentence.up|fight_remains<30
    # lights_judgment,if=!raid_event.adds.exists|raid_event.adds.in>75|raid_event.adds.up
    - lights_judgment
    # fireblood,if=buff.avenging_wrath.up|talent.radiant_glory&cooldown.wake_of_ashes.remains=0&(!talent.holy_flames|dot.expurgation.ticking)
    - fireblood,if=buff.avenging_wrath.up|talent.radiant_glory&cooldown.wake_of_ashes.remains=0&(!talent.holy_flames|dot.expurgation.ticking)
    # execution_sentence,if=(cooldown.avenging_wrath.remains>15|talent.radiant_glory)&(target.time_to_die>10)&(cooldown.wake_of_ashes.remains<gcd|variable.pre_es_wake=1)&(!talent.holy_flames|dot.expurgation.ticking)&(!talent.crusade|buff.avenging_wrath.stack>=7|variable.pre_es_wake=0)
    - execution_sentence,if=(cooldown.avenging_wrath.remains>15|talent.radiant_glory)&(target.time_to_die>10)&(cooldown.wake_of_ashes.remains<gcd|var.pre_es_wake=1)&(!talent.holy_flames|dot.expurgation.ticking)&(!talent.crusade|buff.avenging_wrath.stack>=7|var.pre_es_wake=0)
    # avenging_wrath,if=(!raid_event.adds.up|target.time_to_die>10)&(!talent.holy_flames|dot.expurgation.ticking)&(!equipped.algethar_puzzle_box|trinket.1.is.algethar_puzzle_box&trinket.1.cooldown.remains>5|trinket.2.is.algethar_puzzle_box&trinket.2.cooldown.remains>5)
    - avenging_wrath,if=(!talent.holy_flames|dot.expurgation.ticking)

  finishers:
    # hammer_of_light,if=!buff.hammer_of_light_free.up|buff.hammer_of_light_free.up&(buff.undisputed_ruling.remains<gcd*1.5&(talent.radiant_glory|cooldown.avenging_wrath.remains>4)|buff.avenging_wrath.up&(buff.avenging_wrath.remains<gcd*2|cooldown.wake_of_ashes.remains=0)|buff.hammer_of_light_free.remains<gcd*2|target.time_to_die<gcd*2)
    # buff.hammer_of_light_free -> 433732 ("Light's Deliverance"); the SimC label is not a WoW name.
    # NOT action.427453.cost=0: cost also reads 0 under Divine Purpose, which frees every Holy Power
    # spender, so it would fire this hold-for-a-window branch in a case SimC treats as "not free".
    - hammer_of_light,if=!buff.433732.up|buff.433732.up&(buff.undisputed_ruling.remains<gcd*1.5&(talent.radiant_glory|cooldown.avenging_wrath.remains>4)|buff.avenging_wrath.up&(buff.avenging_wrath.remains<gcd*2|cooldown.wake_of_ashes.remains=0)|buff.433732.remains<gcd*2|target.time_to_die<gcd*2)
    # - hammer_of_light,ignore_cooldown=1,if=!buff.hammer_of_light_free.up|buff.hammer_of_light_free.up&(buff.undisputed_ruling.remains<gcd*1.5&(talent.radiant_glory|cooldown.avenging_wrath.remains>4)|buff.avenging_wrath.up&(buff.avenging_wrath.remains<gcd*2|cooldown.wake_of_ashes.remains=0)|buff.hammer_of_light_free.remains<gcd*2|target.time_to_die<gcd*2)
    # divine_storm,if=variable.ds_castable
    - divine_storm,if=var.ds_castable
    # templars_verdict
    - templars_verdict
    # local addition: Final Verdict is the talented replacement for Templar's Verdict and is
    # not an upstream APL action; it mirrors the templars_verdict line above (upstream dropped
    # the hammer_of_light gate from that line, so this one drops it too).
    - final_verdict

  generators:
    # call_action_list,name=finishers,if=holy_power=5&cooldown.wake_of_ashes.remains|buff.hammer_of_light_free.remains<gcd*2
    - call_action_list,name=finishers,if=holy_power=5&cooldown.wake_of_ashes.remains|buff.433732.remains<gcd*2
    # wake_of_ashes,if=(cooldown.avenging_wrath.remains>6|talent.radiant_glory)&(!talent.execution_sentence|cooldown.execution_sentence.remains>4|target.time_to_die<10|variable.pre_es_wake=1)&(!raid_event.adds.exists|raid_event.adds.in>10|raid_event.adds.up)
    - wake_of_ashes,if=(cooldown.avenging_wrath.remains>6|talent.radiant_glory)&(!talent.execution_sentence|cooldown.execution_sentence.remains>4|target.time_to_die<10|var.pre_es_wake=1)
    # divine_toll,if=(!raid_event.adds.exists|raid_event.adds.in>10|raid_event.adds.up)&(cooldown.avenging_wrath.remains>15|talent.radiant_glory|fight_remains<8)
    - divine_toll,if=(cooldown.avenging_wrath.remains>15|talent.radiant_glory|fight_remains<8)
    # - divine_toll,ignore_cooldown=1,if=(cooldown.avenging_wrath.remains>15|talent.radiant_glory|fight_remains<8)
    # blade_of_justice,if=(buff.art_of_war.stack=2|buff.righteous_cause.stack=2)&(!talent.walk_into_light|!buff.avenging_wrath.up)
    - blade_of_justice,if=(buff.art_of_war.stack=2|buff.righteous_cause.stack=2)&(!talent.walk_into_light|!buff.avenging_wrath.up)
    # hammer_of_wrath,if=talent.walk_into_light&cooldown.hammer_of_wrath.charges=2
    - hammer_of_wrath,if=talent.walk_into_light&cooldown.hammer_of_wrath.charges=2
    - call_action_list,name=finishers
    - hammer_of_wrath,if=talent.walk_into_light
    - blade_of_justice
    - hammer_of_wrath
    - judgment
    - templar_strike
    - templar_slash
    - crusader_strike
    - arcane_torrent

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - retribution_aura,if=!player.buff.retribution_aura.up.any

    # Combat Check
    - return,if=auto_combat.player

    # Interrupts
    - rebuke,if=interrupt.target.check
    - rebuke.mouseover,if=interrupt.mouseover.check
    - rebuke.focus,if=interrupt.focus.check
    # CC Interrupt
    - hammer_of_justice,if=interrupt.cc.check
    # AoE Interrupt
    - blinding_light,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal
    - call_action_list,name=defensives

    # Target Check
    - return,if=auto_combat.target

    # use_item,name=algethar_puzzle_box,if=(cooldown.avenging_wrath.remains=0&!talent.radiant_glory|(!talent.execution_sentence&cooldown.wake_of_ashes.remains=0|cooldown.execution_sentence.remains=0)&talent.radiant_glory)
    - use_item,name=algethar_puzzle_box,if=(cooldown.avenging_wrath.remains=0&!talent.radiant_glory|(!talent.execution_sentence&cooldown.wake_of_ashes.remains=0|cooldown.execution_sentence.remains=0)&talent.radiant_glory)
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

      # Executed every time the actor is available.
    - call_action_list,name=cooldowns
    - call_action_list,name=generators