# =============================================================================
# Blood Death Knight - Spec ID 250
# =============================================================================

version: 3
spec: 250

spell_overrides:
  # Sync Reaper's Mark with Dancing Rune Weapon — hold if DRW is coming up within 40s
  reapers_mark: "cooldown_bypass.dancing_rune_weapon.remains>=25"
  # Don't cast Blood Boil until all mobs around the target are pulled into my 8y radius
  blood_boil: "enemies.8y>=1&enemies.8y>=enemies_around_target|enemies_around_target>=3"
  # Dont't cast Death and Decay while moving
  death_and_decay: "!moving&standing.time>=0.5"

config:
  ds_emergency_hp_pct:
    section: "Defensive HP Percentage"
    label: "Death Strike Emergency"
    type: slider
    min: 0
    max: 90
    default: 50

  ds_deficit:
    label: "Death Strike Deficit"
    type: slider
    min: 0
    max: 100
    default: 35

  ds_smart:
    label: "Death Strike Smart"
    type: slider
    min: 0
    max: 100
    default: 35

  vampiric_blood_hp_pct:
    section: "Defensive HP Percentage"
    label: "Vampiric Blood"
    type: slider
    min: 0
    max: 100
    default: 75

  icebound_fortitude_hp_pct:
    section: "Defensive HP Percentage"
    label: "Icebound Fortitude"
    type: slider
    min: 0
    max: 100
    default: 50

  vampiric_blood_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Vampiric Blood (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 45

  icebound_fortitude_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Icebound Fortitude (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55

variables:

lists:
  variables:

  deathbringer:
    # death_strike,if=(runic_power.deficit<20|(runic_power.deficit<26&buff.dancing_rune_weapon.up))
    - death_strike,if=(runic_power.deficit<20|(runic_power.deficit<26&buff.dancing_rune_weapon.up))&config.ds_deficit>=runic_power.deficit
    # death_and_decay,if=!buff.death_and_decay.up
    - death_and_decay.player,range_check=mob_count_8y,if=!buff.death_and_decay.up
    # reapers_mark
    - reapers_mark
    # marrowrend,if=buff.exterminate.up
    - marrowrend,if=buff.exterminate.up
    # deaths_caress,if=(!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6)&rune<4
    - deaths_caress,if=(!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6)&rune<4
    # marrowrend,if=!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6
    - marrowrend,if=!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6
    # death_strike
    - death_strike,if=config.ds_deficit>=runic_power.deficit
    # blood_boil
    - blood_boil
    # consumption,empower_to=1,if=!buff.dancing_rune_weapon.up
    - consumption,empower_to=1,if=!buff.dancing_rune_weapon.up
    # heart_strike
    - heart_strike
    # consumption,empower_to=1
    - consumption,empower_to=1
    # arcane_torrent,if=runic_power.deficit>20
    - arcane_torrent,if=runic_power.deficit>20

  high_prio_actions:
    # raise_dead,use_off_gcd=1
    - raise_dead,use_off_gcd=1
    # death_strike,if=buff.coagulopathy.up&buff.coagulopathy.remains<=gcd
    - death_strike,if=buff.coagulopathy.up&buff.coagulopathy.remains<=gcd
    # dancing_rune_weapon,if=!buff.exterminate.up&!debuff.reapers_mark.up&!buff.dancing_rune_weapon.up&(fight_remains>95|fight_remains<25|time>300)
    - dancing_rune_weapon,if=!buff.exterminate.up&!debuff.reapers_mark.up&!buff.dancing_rune_weapon.up&(fight_remains>95|fight_remains<25|combat.time>300)
    # custom
    - marrowrend,if=!buff.bone_shield.up|buff.bone_shield.remains<3|buff.bone_shield.stack<6

  san_gift:
    # heart_strike,if=buff.essence_of_the_blood_queen.remains<1.5&buff.essence_of_the_blood_queen.remains
    - heart_strike,if=buff.essence_of_the_blood_queen.remains<1.5&buff.essence_of_the_blood_queen.remains
    # death_strike,if=runic_power.deficit<36
    - death_strike,if=runic_power.deficit<36&config.ds_deficit>=runic_power.deficit
    # blood_boil,if=!drw.bp_ticking
    - blood_boil,if=buff.dancing_rune_weapon.up&lastcast.dancing_rune_weapon<=2
    # any_dnd,if=buff.crimson_scourge.remains
    - death_and_decay.player,range_check=mob_count_8y,if=buff.crimson_scourge.up
    # heart_strike,if=buff.essence_of_the_blood_queen.stack<7
    - heart_strike,if=buff.essence_of_the_blood_queen.stack<7
    # death_strike
    - death_strike,if=config.ds_deficit>=runic_power.deficit
    # blood_boil,if=buff.boiling_point.up&!buff.boiling_point_echo.up
    # TODO: echo has no real buff; no way to track "last cast consumed Boiling Point" (filler blood_boils would poison lastcast). Dropped the echo guard — may double-cast if Boiling Point reprocs within 3s. Revisit if engine gains a "last consuming cast" primitive.
    - blood_boil,if=buff.boiling_point.up
    # heart_strike
    - heart_strike
    # blood_boil
    - blood_boil

  sanlayn:
    # deaths_caress,if=!buff.bone_shield.up|buff.bone_shield.remains<1.5|buff.bone_shield.stack<=1
    - deaths_caress,if=!buff.bone_shield.up|buff.bone_shield.remains<1.5|buff.bone_shield.stack<=1
    # blood_boil,if=dot.blood_plague.remains<3
    - blood_boil,if=dot.blood_plague.remains<3
    # heart_strike,if=(buff.essence_of_the_blood_queen.remains<1.5&buff.essence_of_the_blood_queen.remains&buff.vampiric_strike.remains)
    - heart_strike,if=(buff.essence_of_the_blood_queen.remains<1.5&buff.essence_of_the_blood_queen.remains&buff.vampiric_strike.remains)
    # death_strike,if=runic_power.deficit<20
    - death_strike,if=runic_power.deficit<20&config.ds_deficit>=runic_power.deficit
    # deaths_caress,if=buff.bone_shield.stack<6
    - deaths_caress,if=buff.bone_shield.stack<6
    # marrowrend,if=buff.bone_shield.stack<6
    - marrowrend,if=buff.bone_shield.stack<6
    # any_dnd,if=buff.crimson_scourge.remains
    - death_and_decay.player,range_check=mob_count_8y,if=buff.crimson_scourge.up
    # heart_strike,if=buff.vampiric_strike.up
    - heart_strike,if=buff.vampiric_strike.up
    # death_strike
    - death_strike,if=config.ds_deficit>=runic_power.deficit
    # blood_boil,if=buff.boiling_point.up&!buff.boiling_point_echo.up
    # TODO: echo has no real buff; no way to track "last cast consumed Boiling Point" (filler blood_boils would poison lastcast). Dropped the echo guard — may double-cast if Boiling Point reprocs within 3s. Revisit if engine gains a "last consuming cast" primitive.
    - blood_boil,if=buff.boiling_point.up
    # consumption,empower_to=1
    - consumption,empower_to=1
    # heart_strike,if=rune>=2
    - heart_strike,if=rune>=2
    # blood_boil
    - blood_boil
    # heart_strike
    - heart_strike

  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - vampiric_blood,range_check=none,if=incoming.mitigated.pct>=config.vampiric_blood_dmg_pct
    - icebound_fortitude,range_check=none,if=incoming.mitigated.pct>=config.icebound_fortitude_dmg_pct

    # --- HP Percentage: react when already low ---
    - vampiric_blood,if=health.effective.pct<=config.vampiric_blood_hp_pct
    - icebound_fortitude,if=health.pct<=config.icebound_fortitude_hp_pct
    - death_strike,if=health.effective.pct<=config.ds_emergency_hp_pct|(health.effective.pct<=90&buff.coagulating_blood.stack>=config.ds_smart)

  main:
    # - consumption,range_check=none,ignore_usable=true,ignore_cooldown=true,ignore_queue=true,interrupt=true,casting_check=consumption
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Combat Check
    - return,if=auto_combat.player

    # Interrupts
    - mind_freeze,if=interrupt.target.check
    - mind_freeze.mouseover,if=interrupt.mouseover.check
    - mind_freeze.focus,if=interrupt.focus.check
    # CC Interrupt
    - asphyxiate,if=interrupt.cc.check
    # AoE Interrupt
    - blinding_sleet,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt — grab aggro when not tanking (dungeon/M+ only, never raid)
    - dark_command,name="Taunt",if=target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - dark_command.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target


    # blood_boil aggro maintance
    - blood_boil,if=target.debuff.blood_plague.remains<3&buff.bone_shield.up&cooldown.blood_boil.charges_fractional>=1.8

    # use_items,use_off_gcd=1
    # use_item,name=light_company_guidon,use_off_gcd=1,if=cooldown.dancing_rune_weapon.remains>78|fight_remains<15
    - use_item,name=light_company_guidon,if=cooldown.dancing_rune_weapon.remains>78|fight_remains<15
    # use_item,name=algethar_puzzle_box,if=fight_remains>122|cooldown.dancing_rune_weapon.remains>78|fight_remains<25
    - use_item,name=algethar_puzzle_box,if=fight_remains>122|cooldown.dancing_rune_weapon.remains>78|fight_remains<25
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync
    # fireblood,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<8
    - fireblood,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<8
    # blood_fury,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<12
    - blood_fury,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<12
    # berserking,if=cooldown.dancing_rune_weapon.remains>78|fight_remains<=15
    - berserking,if=cooldown.dancing_rune_weapon.remains>78|fight_remains<=15
    # ancestral_call,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<15
    - ancestral_call,if=fight_remains>120|cooldown.dancing_rune_weapon.remains>78|fight_remains<15
    # potion,if=cooldown.dancing_rune_weapon.remains>78|fight_remains<=30
    # potion not supported
    # vampiric_blood,if=!buff.vampiric_blood.up
    # Kept in defensives with HP check instead
    - call_action_list,name=defensives
    # call_action_list,name=high_prio_actions
    - call_action_list,name=high_prio_actions
    # run_action_list,name=deathbringer,if=hero_tree.deathbringer
    - run_action_list,name=deathbringer,if=hero_tree.deathbringer
    # run_action_list,name=san_gift,if=hero_tree.sanlayn&buff.gift_of_the_sanlayn.up
    - run_action_list,name=san_gift,if=hero_tree.sanlayn&buff.gift_of_the_sanlayn.up
    # run_action_list,name=sanlayn,if=hero_tree.sanlayn
    - run_action_list,name=sanlayn,if=hero_tree.sanlayn
