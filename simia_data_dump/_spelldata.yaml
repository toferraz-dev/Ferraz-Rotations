version: 1

# Major cooldown/burst buffs - checked by player.burst.active
# Also used for trinket sync when sync: true
# Returns true if ANY of these expressions evaluate to true
burst_buffs:
  # Death Knight
  - buff.dancing_rune_weapon.remains>=5
  - buff.pillar_of_frost.remains>=5
  - buff.breath_of_sindragosa.remains>=5
  - pet.buff.dark_transformation.remains>=5
  - player.buff.dark_transformation.remains>=5

  # Priest
  - buff.voidform.remains>=5
  - buff.power_infusion.remains>=5&cooldown.power_infusion.remains>60

  # Warrior
  - buff.avatar.remains>=5
  - debuff.colossus_smash.remains>=5
  - buff.recklessness.remains>=5

  # Demon Hunter
  - buff.metamorphosis.remains>=5
  - buff.1217607.remains>=5

  # Rogue
  - buff.adrenaline_rush.remains>=5
  - buff.shadow_blades.up&buff.shadow_dance.up

  # Hunter
  - buff.bestial_wrath.remains>=5
  - buff.trueshot.remains>=5
  - buff.aspect_of_the_eagle.remains>=5

  # Druid
  - buff.berserk.remains>=5
  - buff.incarnation_chosen_of_elune.remains>=5
  - buff.incarnation_guardian_of_ursoc.remains>=5
  - buff.incarnation_avatar_of_ashamane.remains>=5

  # Evoker
  - buff.dragonrage.remains>=5
  - buff.ebon_might.remains>=5

  # Mage
  - buff.combustion.remains>=5
  - buff.arcane_surge.remains>=5
  - talent.ray_of_frost&cooldown.ray_of_frost.remains<gcd.max

  # Monk
  - buff.invoke_niuzao_the_black_ox.remains>=5
  - buff.zenith.remains>=5
  - buff.courage_of_the_white_tiger.remains>=5

  # Paladin
  - buff.avenging_wrath.remains>=5
  - buff.crusade.remains>=5

  # Warlock
  - buff.demonic_tyrant.remains>=5

  # Shaman
  - buff.ascendance.remains>=5
  - buff.stormkeeper.remains>=5

# Known defensive buff auras - checked on target via defensives.* expressions
# Used for burst hold logic, target-swap decisions, and PvP awareness.
#
# Tags:
#   immunity   - Full damage immunity (hold everything)
#   major      - Major defensive CD (consider holding burst)
#   minor      - Minor/short defensive (may not warrant holding)
#   physical   - Reduces physical damage
#   magic      - Reduces magic damage
#   healing    - Healing/absorb based defensive
#   parry      - Parry/dodge based (melee beware)
#   pvp        - PvP-specific defensive (e.g., trinkets, racials)
defensive_buffs:
