# NPC Data Configuration
# Per-NPC flags for target validation and crowd control decisions
#
# Flags:
#   BypassCombat: true - NPC always bypasses combat checks (treated as valid target)
#   ShouldStun: true - NPC should be stunned when possible
#   ShouldSlow: true - NPC should be slowed when possible
#   IgnoreCount: true - NPC excluded from AOE/mob count; target.valid returns false (blocks damage), interrupt/stun still work
#
# SimC conditions:
#   target.npcid - NPC ID from GUID (0 if player/pet)
#   target.bypass_combat - true if BypassCombat flag set
#   target.should_stun - true if ShouldStun flag set
#   target.should_slow - true if ShouldSlow flag set
#   target.ignore_count - true if IgnoreCount flag set
#   target.valid - comprehensive target validation (returns false for IgnoreCount mobs)
#   player.boss_fight - true if Boss1-5 unit frame exists

