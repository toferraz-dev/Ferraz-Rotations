# Global Spell Morph Database
# Maps base spell -> morph variants
# Source: SimulationCraft Midnight (sc_*.cpp in D:\Simc\simc\engine\class_modules)
#
# Format: base_spell: variant (or base_spell: [variant1, variant2])
# When a rotation line references a base spell, all variants are checked for usability.
# The first usable variant is used (allowing WoW's morph system to work transparently).
#
# Per-rotation morphs: section can override or extend these entries.
#
# AUDIT 2026-05-15: removed buff-gated XOR pairs (separate SimC actions, separate
# spellbook entries, both keybinds usable simultaneously — see simia_client/CLAUDE.md
# "Shared Cooldown + Mutually Exclusive Ready"). Kept only:
#   1. set_replacement_action calls (DK, Warrior)
#   2. Inline execute()/cost()/impact() override on the base action
#   3. Talent-time create_action() redirects (variant fully replaces base in spellbook)

