# =============================================================================
# Demon Hunter - Havoc - 577
# =============================================================================
#
# IMPORTANT: Spell ID collisions — "Inertia" resolves to 2 rows in SpellName.csv,
# so name-based buff lookup is ambiguous. The Inertia talent buffs must use numeric IDs:
#   Inertia Trigger:  1215159  → buff.1215159.up / buff.1215159.remains
#     (hidden "armed" aura applied by The Hunt / Vengeful Retreat,
#      consumed by the next Fel Rush / Felblade; in SimC source this is
#      modeled as buff.inertia_trigger with spell_data_t::nil(), but
#      Blizzard ships a real in-game aura with spell ID 1215159)
#   Inertia (damage buff):  427641  → buff.427641.up / buff.427641.remains
#     (the real 10s-capped damage buff granted when the trigger is consumed)
#   Thrill of the Fight (damage):  442695  → buff.442695.up
#     (SpellName.csv has 4 rows named "Thrill of the Fight"; use the numeric ID)
#
# In-game auras share names, which is why name resolution cannot be used —
# we route through numeric IDs exclusively.

version: 3
spec: 577
entry: main

config:
  blur_hp_pct:
    section: "Defensive HP Percentage"
    label: "Blur HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  darkness_hp_pct:
    section: "Defensive HP Percentage"
    label: "Darkness HP%"
    type: slider
    min: 0
    max: 100
    default: 35

  blur_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Blur (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  felblade_range_check:
    label: "Felblade Range Check"
    type: checkbox
    default: true

# Felblade / Fel Devastation range gate — when enabled, only cast when target is in range
spell_overrides:
  felblade: "!config.felblade_range_check|target.range<=20"
  fel_devastation: "!config.felblade_range_check|target.range<=20"

variables:
  # variable,name=fury_gen_per_sec,op=set,value=2%(attack_haste*2.6)*0.81*((talent.demonsurge&buff.metamorphosis.up)*3+9.5)+buff.immolation_aura.stack*4+buff.tactical_retreat.up*8+buff.student_of_suffering.up*2.5
  # attack_haste (SimC: 1/(1+haste_pct/100)) not supported — substituted as (100+haste)/130
  fury_gen_per_sec: "(100+haste)/130*0.81*((talent.demonsurge&buff.metamorphosis.up)*3+9.5)+buff.immolation_aura.stack*4+buff.tactical_retreat.up*8+buff.student_of_suffering.up*2.5"

  # variable,name=double_on_use,value=variable.trinket1_steroids&trinket.1.cooldown.remains>20|variable.trinket1_steroids&trinket.1.cooldown.remains>20|!variable.trinket1_steroids&!variable.trinket2_steroids
  # All trinket property expressions not supported (trinket1_steroids=trinket2_steroids=0) — simplifies to 1
  double_on_use: "1"

  # variable,name=use_blade_dance,op=set,value=active_enemies>=3-talent.trail_of_ruin|talent.first_blood|talent.screaming_brutality&(talent.burning_blades|talent.soulscar)
  use_blade_dance: "active_enemies>=3-talent.trail_of_ruin|talent.first_blood|talent.screaming_brutality&(talent.burning_blades|talent.soulscar)"

  # variable,name=pool_glaive_tempest,op=set,value=talent.glaive_tempest&active_enemies>=3
  pool_glaive_tempest: "talent.glaive_tempest&active_enemies>=3"

  # variable,name=inertia_consumer_soon,op=set,value=talent.inertia&(cooldown.the_hunt.remains<=3.5|cooldown.eye_beam.remains<=0.5&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available|cooldown.vengeful_retreat.remains<=1|buff.inertia_trigger.remains<gcd.max)
  inertia_consumer_soon: "talent.inertia&(cooldown.the_hunt.remains<=3.5|cooldown.eye_beam.remains<=0.5&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available|cooldown.vengeful_retreat.remains<=1|buff.1215159.remains<gcd.max)"

  # variable,name=inertia_consumer_soon_rush,op=set,value=talent.inertia&(cooldown.the_hunt.remains<=gcd.max+0.5|cooldown.eye_beam.remains<=0.5&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available|cooldown.vengeful_retreat.remains<=1.5|buff.inertia_trigger.remains<gcd.max)
  inertia_consumer_soon_rush: "talent.inertia&(cooldown.the_hunt.remains<=gcd.max+0.5|cooldown.eye_beam.remains<=0.5&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available|cooldown.vengeful_retreat.remains<=1.5|buff.1215159.remains<gcd.max)"

  # variable,name=inertia_ready,op=set,value=talent.inertia&buff.inertia_trigger.up&!debuff.essence_break.up&(!buff.inertia.up|buff.inertia.remains<gcd.max|variable.inertia_consumer_soon|variable.inertia_consumer_soon_rush)
  inertia_ready: "talent.inertia&buff.1215159.up&!debuff.essence_break.up&(!buff.427641.up|buff.427641.remains<gcd.max|var.inertia_consumer_soon|var.inertia_consumer_soon_rush)"

  # variable,name=eb_aligned,op=set,value=!talent.inertia&(!talent.initiative|cooldown.vengeful_retreat.remains>=3|buff.initiative.up|buff.metamorphosis.up&cooldown.vengeful_retreat.remains>buff.metamorphosis.remains)|talent.inertia&(buff.inertia.up|cooldown.vengeful_retreat.remains>=3&(cooldown.the_hunt.remains>=3|!talent.the_hunt)&!buff.inertia_trigger.up|cooldown.metamorphosis.remains<=5)
  eb_aligned: "!talent.inertia&(!talent.initiative|cooldown.vengeful_retreat.remains>=3|buff.initiative.up|buff.metamorphosis.up&cooldown.vengeful_retreat.remains>buff.metamorphosis.remains)|talent.inertia&(buff.427641.up|cooldown.vengeful_retreat.remains>=3&(cooldown.the_hunt.remains>=3|!talent.the_hunt)&!buff.1215159.up|cooldown.metamorphosis.remains<=5)"

  # variable,name=bd_not_blocking,op=set,value=cooldown.blade_dance.remains>=gcd.max|!variable.use_blade_dance
  bd_not_blocking: "cooldown.blade_dance.remains>=gcd.max|!var.use_blade_dance"

  # variable,name=tg_spender,op=set,value=talent.furious_throws&talent.soulscar
  tg_spender: "talent.furious_throws&talent.soulscar"

  # variable,name=cs_machine,op=set,value=talent.relentless_onslaught&talent.chaos_theory
  cs_machine: "talent.relentless_onslaught&talent.chaos_theory"

  # variable,name=use_filler,op=set,value=cooldown.felblade.remains>=gcd.max&cooldown.immolation_aura.remains>=gcd.max&cooldown.eye_beam.remains>=gcd.max&variable.bd_not_blocking&(fury.deficit>variable.fury_gen_per_sec*gcd.max)
  use_filler: "cooldown.felblade.remains>=gcd.max&cooldown.immolation_aura.remains>=gcd.max&cooldown.eye_beam.remains>=gcd.max&var.bd_not_blocking&(fury.deficit>var.fury_gen_per_sec*gcd.max)"

  # cycling_variable,name=pull_remains,op=max,value=target.time_to_die — cycling_variable not supported, approximated with fight_remains
  pull_remains: "fight_remains"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - blur,range_check=none,if=incoming.pct>=config.blur_dmg_pct

    # --- HP Percentage: react when already low ---
    # blur — use when below HP threshold
    - blur,if=health.pct<=config.blur_hp_pct

    # darkness — AoE defensive at low HP
    - darkness,range_check=none,if=health.pct<=config.darkness_hp_pct

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    # disrupt
    - disrupt,if=interrupt.target.check
    - disrupt.mouseover,if=interrupt.mouseover.check
    - disrupt.focus,if=interrupt.focus.check
    # CC Interrupt
    - imprison,if=interrupt.cc.check
    # AoE Interrupt
    - chaos_nova,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # auto_attack — deleted
    # pick_up_fragment,type=all,use_off_gcd=1,if=fury<=40 — not supported, deleted
    # retarget_auto_attack lines — deleted (auto attack management)

    # Original target_if: target_if=max:target.health
    # death_sweep,if=buff.eternal_hunt.up&!debuff.reavers_mark.up&buff.rending_strike.up&buff.glaive_flurry.up&time<10
    - death_sweep,if=buff.eternal_hunt.up&!debuff.reavers_mark.up&buff.rending_strike.up&buff.glaive_flurry.up&combat.time<10

    # Original target_if: target_if=max:target.health
    # annihilation,target_if=max:target.health,if=buff.rending_strike.up&buff.glaive_flurry.down&time<10
    - annihilation,if=buff.rending_strike.up&buff.glaive_flurry.down&combat.time<10

    # Original target_if: target_if=max:target.health — variable.rg_ds=2 always false (rg_ds starts 0, never incremented)
    # chaos_strike,target_if=max:target.health,if=buff.rending_strike.up&buff.glaive_flurry.up&(variable.rg_ds=2|active_enemies>1)&time>10&!debuff.reavers_mark.up
    - chaos_strike,if=buff.rending_strike.up&buff.glaive_flurry.up&active_enemies>1&combat.time>10&!debuff.reavers_mark.up

    # Original target_if: target_if=max:target.health — variable.rg_ds=2 always false
    # annihilation,target_if=max:target.health,if=buff.rending_strike.up&buff.glaive_flurry.up&(variable.rg_ds=2|active_enemies>1|!debuff.reavers_mark.up)&!debuff.reavers_mark.up
    - annihilation,if=buff.rending_strike.up&buff.glaive_flurry.up&(active_enemies>1|!debuff.reavers_mark.up)&!debuff.reavers_mark.up

    # Original target_if: target_if=max:debuff.reavers_mark.remains — variable.rg_ds=2 always false
    # chaos_strike,target_if=max:debuff.reavers_mark.remains,if=buff.rending_strike.up&buff.glaive_flurry.up&(variable.rg_ds=2|active_enemies>1)&time>10&debuff.reavers_mark.remains
    - chaos_strike,if=buff.rending_strike.up&buff.glaive_flurry.up&active_enemies>1&combat.time>10&debuff.reavers_mark.remains>0

    # Original target_if: target_if=max:debuff.reavers_mark.remains — variable.rg_ds=2 always false
    # annihilation,target_if=max:debuff.reavers_mark.remains,if=buff.rending_strike.up&buff.glaive_flurry.up&(variable.rg_ds=2|active_enemies>1)&debuff.reavers_mark.remains
    - annihilation,if=buff.rending_strike.up&buff.glaive_flurry.up&active_enemies>1&debuff.reavers_mark.remains>0

    # Original target_if: target_if=max:debuff.reavers_mark.remains — rg_ds=0: (rg_ds=0|rg_ds=1&cd.up|rg_ds=2&cd.remains) always true; pull_remains=fight_remains: always true
    # reavers_glaive,target_if=max:debuff.reavers_mark.remains,if=!buff.inertia_trigger.up&buff.glaive_flurry.down&buff.rending_strike.down&(variable.rg_ds=0|variable.rg_ds=1&cooldown.blade_dance.up|variable.rg_ds=2&cooldown.blade_dance.remains)&active_enemies<3&debuff.essence_break.down&(buff.metamorphosis.remains>2|cooldown.eye_beam.remains<10|fight_remains<10)&(variable.pull_remains>=10|fight_remains<=10)|fight_remains<=10
    - reavers_glaive,if=!buff.1215159.up&buff.glaive_flurry.down&buff.rending_strike.down&active_enemies<3&debuff.essence_break.down&(buff.metamorphosis.remains>2|cooldown.eye_beam.remains<10|fight_remains<10)|fight_remains<=10

    # Original target_if: target_if=max:debuff.reavers_mark.remains — variable.rg_inc dropped (self-referential stateful var)
    # reavers_glaive,target_if=max:debuff.reavers_mark.remains,if=buff.glaive_flurry.down&buff.rending_strike.down&(buff.thrill_of_the_fight_damage.up|!prev_gcd.1.death_sweep|!variable.rg_inc)&active_enemies>=2&(variable.pull_remains>=10|fight_remains<10)
    - reavers_glaive,if=buff.glaive_flurry.down&buff.rending_strike.down&(buff.442695.up|!prev_gcd.1.death_sweep)&active_enemies>=2

    # vengeful_retreat,use_off_gcd=1,if=talent.initiative&!buff.inner_demon.up&buff.metamorphosis.up&(cooldown.metamorphosis.ready|cooldown.metamorphosis.remains<=gcd.remains)&(!talent.chaotic_transformation|cooldown.eye_beam.remains&cooldown.blade_dance.remains&buff.metamorphosis.up)&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available&gcd.remains<=0.3
    - vengeful_retreat,if=talent.initiative&!buff.inner_demon.up&buff.metamorphosis.up&(cooldown.metamorphosis.ready|cooldown.metamorphosis.remains<=gcd.remains)&(!talent.chaotic_transformation|cooldown.eye_beam.remains>0&cooldown.blade_dance.remains>0&buff.metamorphosis.up)&!action.annihilation.demonsurge_available&!action.death_sweep.demonsurge_available&gcd.remains<=0.3

    # immolation_aura,if=!debuff.essence_break.up&!buff.metamorphosis.up&talent.demonic_intensity&cooldown.metamorphosis.remains<5&talent.a_fire_inside&(talent.burning_wound|active_enemies>1)
    - immolation_aura,if=!debuff.essence_break.up&!buff.metamorphosis.up&talent.demonic_intensity&cooldown.metamorphosis.remains<5&talent.a_fire_inside&(talent.burning_wound|active_enemies>1)

    # call_action_list,name=cooldown
    - call_action_list,name=cooldown

    # immolation_aura,if=active_enemies>2&talent.ragefire&debuff.essence_break.down&(buff.metamorphosis.down|buff.metamorphosis.remains>5)
    - immolation_aura,if=active_enemies>2&talent.ragefire&debuff.essence_break.down&(buff.metamorphosis.down|buff.metamorphosis.remains>5)

    # immolation_aura,if=active_enemies>2&talent.ragefire&raid_event.adds.up&... — raid_event line, deleted

    # immolation_aura,if=talent.a_fire_inside&(charges=2|full_recharge_time<gcd.max*2)&variable.bd_not_blocking&!debuff.essence_break.up&(raid_event.adds.in>full_recharge_time|active_enemies>desired_targets)
    # raid_event not supported — simplified to active_enemies>1; bare charges/full_recharge_time expanded to spell context
    - immolation_aura,if=talent.a_fire_inside&(cooldown.immolation_aura.charges=2|cooldown.immolation_aura.full_recharge_time<gcd.max*2)&var.bd_not_blocking&!debuff.essence_break.up&active_enemies>1

    # immolation_aura,if=(active_enemies>(1-talent.burning_wound+buff.metamorphosis.up))&variable.bd_not_blocking&(raid_event.adds.in>full_recharge_time|active_enemies>desired_targets)
    # raid_event not supported — simplified to active_enemies>1
    - immolation_aura,if=(active_enemies>(1-talent.burning_wound+buff.metamorphosis.up))&var.bd_not_blocking&active_enemies>1

    # felblade,if=variable.inertia_ready&(variable.inertia_consumer_soon|buff.metamorphosis.remains>5&buff.cycle_of_hatred.stack<4&cooldown.eye_beam.remains>5)&active_enemies<=2
    - felblade,if=var.inertia_ready&(var.inertia_consumer_soon|buff.metamorphosis.remains>5&buff.cycle_of_hatred.stack<4&cooldown.eye_beam.remains>5)&active_enemies<=2
    # fel_rush,if=variable.inertia_ready&(variable.inertia_consumer_soon_rush|buff.metamorphosis.remains>5&buff.cycle_of_hatred.stack<4&cooldown.eye_beam.remains>5)&(active_enemies>2|cooldown.felblade.remains)
    - fel_rush,range_check=none,if=var.inertia_ready&(var.inertia_consumer_soon_rush|buff.metamorphosis.remains>5&buff.cycle_of_hatred.stack<4&cooldown.eye_beam.remains>5)&(active_enemies>2|cooldown.felblade.remains>0)

    # vengeful_retreat,if=talent.inertia&!buff.inertia_trigger.up&cooldown.metamorphosis.remains>=5&((cooldown.eye_beam.remains<=gcd.max*2|cooldown.blade_dance.remains<=7&(!talent.cycle_of_hatred|buff.cycle_of_hatred.stack<3)&((cooldown.eye_beam.remains>=15-buff.cycle_of_hatred.stack*2.5)|buff.metamorphosis.remains>=5))&gcd.remains<=0.3&time>5|fight_remains<10)
    - vengeful_retreat,if=talent.inertia&!buff.1215159.up&cooldown.metamorphosis.remains>=5&((cooldown.eye_beam.remains<=gcd.max*2|cooldown.blade_dance.remains<=7&(!talent.cycle_of_hatred|buff.cycle_of_hatred.stack<3)&((cooldown.eye_beam.remains>=15-buff.cycle_of_hatred.stack*2.5)|buff.metamorphosis.remains>=5))&gcd.remains<=0.3&combat.time>5|fight_remains<10)

    # vengeful_retreat,use_off_gcd=1,if=talent.initiative&!talent.inertia&((cooldown.eye_beam.remains<=gcd.remains|(cooldown.blade_dance.remains<=3&(cooldown.eye_beam.remains>=15-buff.cycle_of_hatred.stack*2.5)|buff.metamorphosis.remains>=5)&(!talent.cycle_of_hatred|buff.cycle_of_hatred.stack<4))&!buff.initiative.up&gcd.remains<=0.3&time>5|fight_remains<10)
    - vengeful_retreat,if=talent.initiative&!talent.inertia&((cooldown.eye_beam.remains<=gcd.remains|(cooldown.blade_dance.remains<=3&(cooldown.eye_beam.remains>=15-buff.cycle_of_hatred.stack*2.5)|buff.metamorphosis.remains>=5)&(!talent.cycle_of_hatred|buff.cycle_of_hatred.stack<4))&!buff.initiative.up&gcd.remains<=0.3&combat.time>5|fight_remains<10)

    # run_action_list,name=meta,if=buff.metamorphosis.up
    - run_action_list,name=meta,if=buff.metamorphosis.up

    # fel_rush,if=talent.inertia&buff.inertia_trigger.up&variable.inertia_consumer_soon&(active_enemies>2|cooldown.felblade.remains>3|cooldown.eye_beam.up)
    - fel_rush,range_check=none,if=talent.inertia&buff.1215159.up&var.inertia_consumer_soon&(active_enemies>2|cooldown.felblade.remains>3|cooldown.eye_beam.up)

    # immolation_aura,if=fight_remains<15&(variable.use_blade_dance&cooldown.blade_dance.remains|!variable.use_blade_dance)&talent.ragefire
    - immolation_aura,if=fight_remains<15&(var.use_blade_dance&cooldown.blade_dance.remains>0|!var.use_blade_dance)&talent.ragefire

    # eye_beam,if=(variable.use_blade_dance&cooldown.blade_dance.remains<7|raid_event.adds.up|!variable.use_blade_dance)&(active_enemies>desired_targets*2|raid_event.adds.in>30-buff.cycle_of_hatred.stack*2.5|fight_style.dungeonroute&!raid_event.adds.in<=30-buff.cycle_of_hatred.stack*2.5)&(variable.eb_aligned|active_enemies>=5)&!buff.inner_demon.up&(!talent.eternal_hunt|cooldown.the_hunt.remains>5|hero_tree.felscarred&cooldown.metamorphosis.remains<=5|cooldown.metamorphosis.remains>=30)|fight_remains<10
    # raid_event/fight_style/desired_targets not supported — adds timing gate dropped
    - eye_beam,if=(var.use_blade_dance&cooldown.blade_dance.remains<7|!var.use_blade_dance)&(var.eb_aligned|active_enemies>=5)&!buff.inner_demon.up&(!talent.eternal_hunt|cooldown.the_hunt.remains>5|hero_tree.felscarred&cooldown.metamorphosis.remains<=5|cooldown.metamorphosis.remains>=30)|fight_remains<10

    # blade_dance,if=variable.use_blade_dance&(!talent.demonic|cooldown.eye_beam.remains>=gcd.max*2|active_enemies>=5|debuff.essence_break.up)&(!variable.pool_glaive_tempest|fury>=60)
    - blade_dance,if=var.use_blade_dance&(!talent.demonic|cooldown.eye_beam.remains>=gcd.max*2|active_enemies>=5|debuff.essence_break.up)&(!var.pool_glaive_tempest|fury>=60)

    # chaos_strike,if=debuff.essence_break.up
    - chaos_strike,if=debuff.essence_break.up

    # felblade,if=!buff.inertia_trigger.up&(fury.deficit>=15+variable.fury_gen_per_sec*0.5)&(!buff.out_of_range.up|!buff.inertia.up)&(cooldown.blade_dance.remains>=0.5|!variable.use_blade_dance|fury<40|cooldown.eye_beam.remains<gcd.max*2)
    # buff.out_of_range not supported — dropped
    - felblade,if=!buff.1215159.up&(fury.deficit>=15+var.fury_gen_per_sec*0.5)&(cooldown.blade_dance.remains>=0.5|!var.use_blade_dance|fury<40|cooldown.eye_beam.remains<gcd.max*2)
    # immolation_aura,if=active_enemies>desired_targets&(active_enemies>=desired_targets+raid_event.adds.count|raid_event.adds.in>full_recharge_time)
    # desired_targets=1, raid_event not supported — simplified
    - immolation_aura,if=active_enemies>1

    # immolation_aura,if=(raid_event.adds.in>full_recharge_time)&fury.deficit>20+variable.fury_gen_per_sec*gcd.max
    # raid_event not supported — gate removed
    - immolation_aura,if=fury.deficit>20+var.fury_gen_per_sec*gcd.max

    # throw_glaive,if=talent.soulscar&(!talent.screaming_brutality|charges=2|full_recharge_time<cooldown.blade_dance.remains)&(!talent.furious_throws|variable.bd_not_blocking&(cooldown.eye_beam.remains>gcd.max*4|fury.deficit<variable.fury_gen_per_sec*gcd.max|talent.blind_fury))&!debuff.essence_break.up
