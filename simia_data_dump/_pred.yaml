version: 1

# Cast-based buff/debuff predictions
#
# When the player casts a spell listed here and the cast reaches >= 1% completion,
# pred.buff.X.up (or pred.debuff.X.up) returns true immediately — before the aura
# actually appears. The prediction holds for 0.1s after the cast completes, then
# falls back to the real aura state.
#
# Format:  cast_id: { name: "SpellName", buff: buff_id }
#       or cast_id: { name: "SpellName", debuff: debuff_id }
#
# Usage in rotation: !pred.buff.rite_of_sanctification.up

