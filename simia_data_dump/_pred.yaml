version: 1

# Cast-based buff/debuff predictions
#
# While the player is casting a spell listed here, pred.buff.X.up (or
# pred.debuff.X.up) returns true — before the aura actually appears. The hold is
# armed every tick (UpdatePredTracking) and lasts until cast end + ping + 0.25s,
# then falls back to the real aura state. A cancelled cast drops it immediately.
#
# Format:  cast_id: { name: "SpellName", buff: buff_id }
#       or cast_id: { name: "SpellName", debuff: debuff_id }
#
# Usage in rotation: !pred.buff.rite_of_sanctification.up

predictions:
  433568: { name: "Rite of Sanctification", buff: 433550 }
  315584: { name: "Instant Poison", buff: 315584 }
  8679:   { name: "Wound Poison", buff: 8679 }
  3408:   { name: "Crippling Poison", buff: 3408 }
  5761:   { name: "Numbing Poison", buff: 5761 }
  381637: { name: "Atrophic Poison", buff: 381637 }
  2823:   { name: "Deadly Poison", buff: 2823 }
  381664: { name: "Amplifying Poison", buff: 381664 }
  124682: { name: "Enveloping Mist", buff: 124682 }
  395160: { name: "Bombardments", debuff: 434473 }
  395152: { name: "Ebon Might", buff: 395296 }
  19434:  { name: "Aimed Shot", buff: 260242 }   # Precise Shots (4 rows share the name)

# ----------------------------------------------------------------------------
# Cast-based resource predictions
#
# The rotation picks the next spell up to the queue-window (cast_overlap, 0.2s)
# BEFORE the current cast ends, and the power read then lags cast-completion by
# roughly one ping. During that window a bare `soul_shards<4` still sees the
# pre-cast value, so a Demonology filler re-suggests Shadow Bolt when the shard
# it is about to grant already puts the player at 4.
#
# Listing a cast here adds its grant to every read of that resource
# (bare / .deficit / .pct / .time_to_max) for the queue window plus one ping,
# and drops it the moment the real value rises. Clamped at max, so it can never
# read above the cap.
#
# ONLY cast-time spells belong here. An instant's grant lands well inside its
# own GCD, so nothing is ever stale — adding one would just double-count.
#
# Format:  cast_id: { name: "SpellName", power: <simc resource>, amount: N }
#          optional  spec: [specId, ...]   # omit = all specs
#
# `spec:` is required whenever a shared spell id energizes for only some specs:
# 686 Shadow Bolt grants a shard for Demonology (SimC energize_type ON_CAST,
# `if ( demonology() )`, sc_warlock_actions.cpp) and nothing for Affliction.
energize:
  686:    { name: "Shadow Bolt",   power: soul_shards, amount: 1, spec: [266] }
  264178: { name: "Demonbolt",    power: soul_shards, amount: 2, spec: [266] }
  434506: { name: "Infernal Bolt", power: soul_shards, amount: 3, spec: [266] }
