# =============================================================================
# Rogue Subtlety - Spec ID 261
# =============================================================================

version: 3
spec: 261
entry: main

config:
  crimson_vial_hp_pct:
    section: "Defensive HP Percentage"
    label: "Crimson Vial HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  poison_mh:
    label: "Poison MH"
    type: dropdown
    options:
      - "Numbing"
      - "Crippling"
      - "None"
      - "Atrophic"
    default: 0

  poison_oh:
    label: "Poison OH"
    type: dropdown
    options:
      - "Instant"
      - "Wound"
      - "None"
    default: 0

  vanish_enabled:
    label: "Auto Vanish"
    type: checkbox
    default: false

  stealth_mode:
    label: "Stealth Mode"
    type: dropdown
    options:
      - "Enemy Around"
      - "Always"
      - "Never"
    default: 0

  shadowmeld_usage:
    label: "Shadowmeld Usage"
    type: dropdown
    options:
      - "Disabled"
      - "M+ Only"
      - "Dungeon & Raid"
      - "Boss Only"
    default: 2

variables:
  shadowmeld_allowed: "(config.shadowmeld_usage=1&player.inmythicplus)|(config.shadowmeld_usage=2&(player.indungeon|player.inraid))|(config.shadowmeld_usage=3&target.classification>=5)"

  # variable,name=stealth,value=buff.shadow_dance.up|buff.stealth.up|buff.vanish.up
  stealth: "buff.shadow_dance.up|buff.stealth.up|buff.vanish.up"
  # variable,name=targets,value=spell_targets.shuriken_storm
  targets: active_enemies
  # variable,name=racial_sync,value=(buff.shadow_blades.up&buff.shadow_dance.up)|fight_remains<20
  racial_sync: "(buff.shadow_blades.up&buff.shadow_dance.up)|fight_remains<20"
  # variable,name=shd_cp,value=buff.slice_and_dice.up&combo_points<=2&talent.deathstalkers_mark|combo_points>=6&(!talent.deathstalkers_mark|variable.targets>=5)
  shd_cp: "buff.slice_and_dice.up&combo_points<=2&talent.deathstalkers_mark|combo_points>=6&(!talent.deathstalkers_mark|var.targets>=5)"
  # variable,name=trinket_sync_slot,value=1,if=trinket.1.has_use_buff&(!trinket.2.has_use_buff|trinket.1.cooldown.duration>=trinket.2.cooldown.duration)
  # variable,name=trinket_sync_slot,value=2,if=trinket.2.has_use_buff&(!trinket.1.has_use_buff|trinket.2.cooldown.duration>trinket.1.cooldown.duration)
  # trinket.N.has_use_buff and trinket.N.cooldown.duration are not supported — variable dropped, generic trinket_1.sync / trinket_2.sync used instead

lists:
  defensives:
    # --- Prediction Damage: (no self-mitigation defensives in this spec) ---

    # --- HP Percentage: react when already low ---
    - crimson_vial,range_check=none,if=health.pct<=config.crimson_vial_hp_pct

  # Race Cooldowns
  race:
    # blood_fury,if=variable.racial_sync
    - blood_fury,if=var.racial_sync
    # berserking,if=variable.racial_sync
    - berserking,if=var.racial_sync
    # fireblood,if=variable.racial_sync
    - fireblood,if=var.racial_sync
    # ancestral_call,if=variable.racial_sync
    - ancestral_call,if=var.racial_sync
    # invoke_external_buff,name=power_infusion,if=variable.racial_sync — not supported, removed

  # Cooldowns
  cd:
    # potion,if=buff.shadow_blades.up|fight_remains<30 — potion not supported, removed

    # Cooldowns: Delay the last Shadow Blades to line up with puzzle box if its equipped.
    # shadow_blades,if=variable.shd_cp&cooldown.shadow_dance.charges_fractional>=1+0.8*talent.deathstalkers_mark&cooldown.secret_technique.ready&(fight_remains>90|!equipped.algethar_puzzle_box|trinket.1.proc.mastery.up|trinket.2.proc.mastery.up)|(fight_remains<=20|target.time_to_die.remains<=20)
    # trinket.X.proc.mastery.up not supported — stripped from OR; target.time_to_die.remains is a SimC typo — using target.time_to_die
    - shadow_blades,if=var.shd_cp&cooldown.shadow_dance.charges_fractional>=1+0.8*talent.deathstalkers_mark&cooldown.secret_technique.ready&(fight_remains>90|!equipped.algethar_puzzle_box)|(fight_remains<=20|target.time_to_die<=20)

    # shadow_dance,if=!variable.stealth&variable.shd_cp&energy>=30&((cooldown.secret_technique.ready|buff.darkest_night.up)&(cooldown.shadow_blades.remains>=30-cooldown.secret_technique.duration)|(buff.shadow_blades.up&cooldown.secret_technique.duration>=18))|(fight_remains<=10|target.time_to_die-remains<=9)
    # target.time_to_die-remains is a SimC typo — using target.time_to_die
    - shadow_dance,if=!var.stealth&var.shd_cp&energy>=30&((cooldown.secret_technique.ready|buff.darkest_night.up)&(cooldown.shadow_blades.remains>=30-cooldown.secret_technique.duration)|(buff.shadow_blades.up&cooldown.secret_technique.duration>=18))|(fight_remains<=10|target.time_to_die<=9)

    # Have the second Shadow Dance in Shadow Blades line up with the end of Shadow Blades instead of back-to-back for trickster.
    # shadow_dance,if=buff.shadow_blades.up&talent.unseen_blade&buff.shadow_blades.remains<=buff.shadow_dance.duration+1
    - shadow_dance,if=buff.shadow_blades.up&talent.unseen_blade&buff.shadow_blades.remains<=buff.shadow_dance.duration+1

    # Used for when Shadow Blades is ready but holding for Algethar Puzzlebox trinket at the end of pull
    # shadow_dance,if=equipped.algethar_puzzle_box&talent.unseen_blade&!variable.stealth&variable.shd_cp&energy>=30&((cooldown.secret_technique.ready|buff.darkest_night.up)&(trinket.algethar_puzzle_box.cooldown.remains>=39-30*cooldown.shadow_blades.up))
    # trinket.<name>.cooldown.remains is not supported — entire line skipped

    # vanish,if=!variable.stealth&energy>=50&!buff.subterfuge.up&combo_points<=2
    - vanish,if=config.vanish_enabled&!var.stealth&energy>=50&!buff.subterfuge.up&combo_points<=2

    # shadowmeld,if=energy>=50&!variable.stealth&combo_points.deficit>=2
    - shadowmeld,if=var.shadowmeld_allowed&energy>=50&!var.stealth&combo_points.deficit>=2

  # Builder (combo point generators)
  build:
    # shuriken_storm,if=prev.shadow_dance&buff.premeditation.up&talent.danse_macabre
    - shuriken_storm,if=prev_gcd.1.shadow_dance&buff.premeditation.up&talent.danse_macabre
    # shadowstrike,if=!debuff.deathstalkers_mark.up&talent.deathstalkers_mark&!buff.darkest_night.up|variable.targets<=3|variable.priority_rotation
    # priority_rotation is a SimC sim option — dropped
    - shadowstrike,if=!debuff.deathstalkers_mark.up&talent.deathstalkers_mark&!buff.darkest_night.up|var.targets<=3
    # shuriken_storm,if=variable.targets>1
    - shuriken_storm,if=var.targets>1
    # goremaws_bite,if=combo_points.deficit>=3
    - goremaws_bite,if=combo_points.deficit>=3
    # gloomblade,if=variable.targets<2&!variable.stealth
    - gloomblade,if=var.targets<2&!var.stealth
    # backstab,if=variable.targets<2&!variable.stealth
    - backstab,if=var.targets<2&!var.stealth

  # Finishers (combo point spenders)
  finish:
    # eviscerate,if=buff.darkest_night.up
    - eviscerate,if=buff.darkest_night.up
    # secret_technique,if=buff.shadow_dance.up|(cooldown.secret_technique.duration<18|cooldown.shadow_dance.remains>=10)&!cooldown.shadow_dance.ready
    - secret_technique,if=buff.shadow_dance.up|(cooldown.secret_technique.duration<18|cooldown.shadow_dance.remains>=10)&!cooldown.shadow_dance.ready
    # coup_de_grace,if=cooldown.secret_technique.remains>=3|buff.shadow_dance.up
    - coup_de_grace,if=cooldown.secret_technique.remains>=3|buff.shadow_dance.up
    # black_powder,if=variable.targets>=3
    - black_powder,if=var.targets>=3
    # Pool some Shadow Technique Stacks before entering Shadow Dance by not finishing right before.
    # eviscerate,if=cooldown.secret_technique.remains>=3&talent.unseen_blade|buff.shadow_dance.up|buff.shadow_blades.up|debuff.deathstalkers_mark.stack>1|debuff.deathstalkers_mark.stack=1&buff.shadow_techniques.stack>=5
    - eviscerate,if=cooldown.secret_technique.remains>=3&talent.unseen_blade|buff.shadow_dance.up|buff.shadow_blades.up|debuff.deathstalkers_mark.stack>1|debuff.deathstalkers_mark.stack=1&buff.shadow_techniques.stack>=5

  # Filler racials
  fill:
    # arcane_torrent,if=energy.deficit>=15+energy.regen
    - arcane_torrent,if=energy.deficit>=15+energy.regen
    # arcane_pulse
    - arcane_pulse
    # lights_judgment
    - lights_judgment
    # bag_of_tricks
    - bag_of_tricks

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Restealth based on config
    - stealth,range_check=mob_count_40y,if=config.stealth_mode=0&!buff.stealth.up
    - stealth,range_check=none,if=config.stealth_mode=1&!buff.stealth.up

    # Poisons
    - numbing_poison,range_check=none,if=config.poison_mh=0&pred.buff.numbing_poison.remains<120&!player.combat
    - instant_poison,range_check=none,if=config.poison_oh=0&pred.buff.instant_poison.remains<120&!player.combat
    - wound_poison,range_check=none,if=config.poison_oh=1&pred.buff.wound_poison.remains<120&!player.combat
    - crippling_poison,range_check=none,if=config.poison_mh=1&pred.buff.crippling_poison.remains<120&!player.combat
    - atrophic_poison,range_check=none,if=config.poison_mh=3&pred.buff.atrophic_poison.remains<120&!player.combat

    # Combat Check
    - return,if=auto_combat.player

    - call_action_list,name=auto_heal
    - call_action_list,name=defensives

    # Interrupts
    - kick,if=interrupt.target.check
    - kick.mouseover,if=interrupt.mouseover.check
    - kick.focus,if=interrupt.focus.check
    # CC Interrupt
    - kidney_shot,if=interrupt.cc.check
    - blind,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Target Check
    - return,if=auto_combat.target

    # call_action_list,name=race
    - call_action_list,name=race

    # Trinkets and Items (actions.item)
    # use_item,name=algethar_puzzle_box,if=cooldown.shadow_blades.ready&cooldown.secret_technique.remains<=2&combo_points>=6
    - use_item,name=algethar_puzzle_box,if=cooldown.shadow_blades.ready&cooldown.secret_technique.remains<=2&combo_points>=6
    # use_items,slots=trinket1,if=(variable.trinket_sync_slot=1&(buff.shadow_blades.up|fight_remains<=20)|(variable.trinket_sync_slot=2&(!trinket.2.cooldown.ready&cooldown.shadow_blades.remains>20))|!variable.trinket_sync_slot)
    # use_items,slots=trinket2,if=(variable.trinket_sync_slot=2&(buff.shadow_blades.up|fight_remains<=20)|(variable.trinket_sync_slot=1&(!trinket.1.cooldown.ready&cooldown.shadow_blades.remains>20))|!variable.trinket_sync_slot)
    # variable.trinket_sync_slot relies on trinket.X.has_use_buff (not supported) — converted to generic sync fallback
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # call_action_list,name=cds
    - call_action_list,name=cd

    # shadowstrike,if=talent.ancient_arts_3&variable.targets<=2&(buff.darkest_night.up|(talent.unseen_blade&buff.supercharge_1.up))&buff.shadow_techniques.stack>=5&!buff.ancient_arts.up
    # talent.ancient_arts_3 → talent.ancient_arts.rank>=3; buff.supercharge_1.up → combo_points.charged>=1 (Supercharger talent state)
    - shadowstrike,if=talent.ancient_arts.rank>=3&var.targets<=2&(buff.darkest_night.up|(talent.unseen_blade&combo_points.charged>=1))&buff.shadow_techniques.stack>=5&!buff.ancient_arts.up

    # shuriken_storm,if=talent.ancient_arts_3&variable.targets>=3&(buff.supercharge_1.up)&buff.shadow_techniques.stack>=5&!buff.ancient_arts.up&!cooldown.secret_technique.ready
    # talent.ancient_arts_3 → talent.ancient_arts.rank>=3; buff.supercharge_1.up → combo_points.charged>=1 (Supercharger talent state)
    - shuriken_storm,if=talent.ancient_arts.rank>=3&var.targets>=3&combo_points.charged>=1&buff.shadow_techniques.stack>=5&!buff.ancient_arts.up&!cooldown.secret_technique.ready

    # call_action_list,name=finish,if=combo_points>=cp_max_spend-!buff.darkest_night.up
    # cp_max_spend not supported — split into two lines using combo_points.max
    - call_action_list,name=finish,if=buff.darkest_night.up&combo_points>=combo_points.max
    - call_action_list,name=finish,if=!buff.darkest_night.up&combo_points>=combo_points.max-1

    # call_action_list,name=build,if=variable.stealth|energy>60
    - call_action_list,name=build,if=var.stealth|energy>60

    # call_action_list,name=fill,if=!variable.stealth
    - call_action_list,name=fill,if=!var.stealth
