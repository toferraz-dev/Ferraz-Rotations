# =============================================================================
# Rogue Assassination - Spec ID 259
# =============================================================================

version: 3
spec: 259
entry: main

variables:
  # variable,name=single_target,value=spell_targets.fan_of_knives=1
  single_target: spell_targets.fan_of_knives=1

  # variable,name=base_trinket_condition,value=dot.rupture.ticking&cooldown.deathmark.remains<2|dot.deathmark.ticking|fight_remains<=22
  # trinket conditions — kept for reference but trinkets use sync
  base_trinket_condition: dot.rupture.ticking&cooldown.deathmark.remains<2|dot.deathmark.ticking|fight_remains<=22

  # variable,name=trinket_sync_slot — trinket properties not supported, removed
  # variable,name=trinket_sync_slot,value=1,if=trinket.1.has_use_buff&(!trinket.2.has_use_buff|trinket.1.cooldown.duration>=trinket.2.cooldown.duration)&!trinket.2.is.treacherous_transmitter|trinket.1.is.treacherous_transmitter|trinket.1.is.house_of_cards
  # variable,name=trinket_sync_slot,value=2,if=trinket.2.has_use_buff&(!trinket.1.has_use_buff|trinket.2.cooldown.duration>trinket.1.cooldown.duration)&!trinket.1.is.treacherous_transmitter|trinket.2.is.treacherous_transmitter|trinket.2.is.house_of_cards

config:
  crimson_vial_hp_pct:
    section: "Defensive HP Percentage"
    label: "Crimson Vial HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  poison_mh:
    label: "Poison MH"
    type: dropdown
    options:
      - "Numbing"
      - "Crippling"
      - "None"
      - "Atrophic"
    default: 0

  poison_oh:
    label: "Poison OH"
    type: dropdown
    options:
      - "Instant"
      - "Wound"
      - "None"
    default: 0

  vanish_enabled:
    label: "Auto Vanish"
    type: checkbox
    default: false

  stealth_mode:
    label: "Stealth Mode"
    type: dropdown
    options:
      - "Enemy Around"
      - "Always"
      - "Never"
    default: 0

lists:
  defensives:
    # --- Prediction Damage: (no self-mitigation defensives in this spec) ---

    # --- HP Percentage: react when already low ---
    - crimson_vial,range_check=none,if=health.pct<=config.crimson_vial_hp_pct

  trinkets:
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # Cooldowns
  cds:
    # deathmark,if=dot.garrote.ticking&dot.rupture.ticking&cooldown.kingsbane.remains<=2&buff.envenom.remains>2&(target.time_to_die>10|fight_remains<20)
    - deathmark,if=dot.garrote.ticking&dot.rupture.ticking&cooldown.kingsbane.remains<=2&buff.envenom.remains>2&(target.time_to_die>10|fight_remains<20)
    # call_action_list,name=items
    - call_action_list,name=items
    # call_action_list,name=misc_cds
    - call_action_list,name=misc_cds
    # kingsbane,if=dot.garrote.ticking&dot.rupture.ticking&(dot.deathmark.ticking|cooldown.deathmark.remains>52)&buff.envenom.up&(target.time_to_die>10|fight_remains<20)
    - kingsbane,if=dot.garrote.ticking&dot.rupture.ticking&(dot.deathmark.ticking|cooldown.deathmark.remains>52)&buff.envenom.up&(target.time_to_die>10|fight_remains<20)
    # call_action_list,name=vanish,if=!stealthed.rogue
    # stealthed.rogue not supported — using !buff.stealth.up
    - call_action_list,name=vanish,if=!buff.stealth.up

  # DoT maintenance
  core_dot:
    # garrote,if=(buff.improved_garrote.up|stealthed.rogue)&(pmultiplier<=1|remains<=14+6*talent.razor_wire+4*!variable.single_target)
    # stealthed.rogue and pmultiplier not supported — simplified
    - garrote,if=buff.improved_garrote.up&(refreshable|remains<=14+6*talent.razor_wire+4*!var.single_target)
    # garrote,if=(buff.improved_garrote.up|stealthed.rogue)&(dot.deathmark.ticking&cooldown.vanish.remains>115&dot.garrote.remains<22)
    - garrote,if=buff.improved_garrote.up&(dot.deathmark.ticking&cooldown.vanish.remains>115&dot.garrote.remains<22)
    # garrote,if=combo_points.deficit>=1&(pmultiplier<=1|!variable.single_target)&refreshable&target.time_to_die-remains>12
    # pmultiplier not supported — removed
    - garrote,if=combo_points.deficit>=1&refreshable&target.time_to_die-remains>12
    # garrote,cycle_targets=1,if=!talent.crimson_tempest&combo_points.deficit>=1&(pmultiplier<=1|!variable.single_target)&refreshable&target.time_to_die-remains>12
    # cycle_targets and pmultiplier not supported — removed
    # Original target_if: cycle_targets=1
    - garrote,if=!talent.crimson_tempest&combo_points.deficit>=1&refreshable&target.time_to_die-remains>12
    # rupture,if=combo_points>=5&refreshable&target.time_to_die-remains>12&(!buff.darkest_night.up|!dot.rupture.ticking)
    - rupture,if=combo_points>=5&refreshable&target.time_to_die-remains>12&(!buff.darkest_night.up|!dot.rupture.ticking)
    # rupture,cycle_targets=1,if=!talent.crimson_tempest&combo_points>=5&refreshable&target.time_to_die-remains>12&(!buff.darkest_night.up|!dot.rupture.ticking)
    # cycle_targets not supported — removed
    # Original target_if: cycle_targets=1
    - rupture,if=!talent.crimson_tempest&combo_points>=5&refreshable&target.time_to_die-remains>12&(!buff.darkest_night.up|!dot.rupture.ticking)

  # Generators
  generate:
    # crimson_tempest,target_if=max:dot.rupture.remains,if=!variable.single_target&(active_dot.garrote<spell_targets.fan_of_knives|active_dot.rupture<spell_targets.fan_of_knives)&(dot.rupture.remains>5|energy.regen_combined>40)
    # Original target_if: max:dot.rupture.remains — dropped; energy.regen_combined not supported, using energy.regen
    - crimson_tempest,if=!var.single_target&(active_dot.garrote<spell_targets.fan_of_knives|active_dot.rupture<spell_targets.fan_of_knives)&(dot.rupture.remains>5|energy.regen>40)
    # shiv,if=buff.darkest_night.up&combo_points.deficit=1&spell_targets.fan_of_knives<=3&talent.toxic_stiletto
    - shiv,if=buff.darkest_night.up&combo_points.deficit=1&spell_targets.fan_of_knives<=3&talent.toxic_stiletto
    # fan_of_knives,if=spell_targets.fan_of_knives>1+talent.blindside
    - fan_of_knives,if=spell_targets.fan_of_knives>1+talent.blindside
    # buff.unshakeable_drive collides in SpellName.csv (1248774/1248775) — kept by name (deterministic resolve); TODO verify correct stack-tracking ID
    # ambush,if=spell_targets.fan_of_knives<=1+talent.blindside&(buff.unshakeable_drive.stack>2|buff.bloodlust.up|!talent.deathstalkers_mark|talent.blindside)
    - ambush,if=spell_targets.fan_of_knives<=1+talent.blindside&(buff.unshakeable_drive.stack>2|buff.bloodlust.up|!talent.deathstalkers_mark|talent.blindside)
    # mutilate,if=spell_targets.fan_of_knives<=1+talent.blindside&(buff.unshakeable_drive.stack>2|buff.bloodlust.up|!talent.deathstalkers_mark|talent.blindside)
    - mutilate,if=spell_targets.fan_of_knives<=1+talent.blindside&(buff.unshakeable_drive.stack>2|buff.bloodlust.up|!talent.deathstalkers_mark|talent.blindside)
    # fan_of_knives,if=spell_targets.fan_of_knives<=1+talent.blindside&!talent.blindside&(buff.unshakeable_drive.stack<3&!buff.bloodlust.up&talent.deathstalkers_mark)
    - fan_of_knives,if=spell_targets.fan_of_knives<=1+talent.blindside&!talent.blindside&(buff.unshakeable_drive.stack<3&!buff.bloodlust.up&talent.deathstalkers_mark)
    # shiv,if=spell_targets.fan_of_knives<=1&talent.toxic_stiletto&(buff.unshakeable_drive.stack<3&!buff.bloodlust.up&talent.deathstalkers_mark)
    - shiv,if=spell_targets.fan_of_knives<=1&talent.toxic_stiletto&(buff.unshakeable_drive.stack<3&!buff.bloodlust.up&talent.deathstalkers_mark)

  # Trinket items
  items:
    # use_item,name=astral_gladiators_badge_of_ferocity,use_off_gcd=1,if=dot.kingsbane.ticking|dot.deathmark.ticking|(cooldown.kingsbane.remains>60|cooldown.deathmark.remains>60)
    - use_item,name=astral_gladiators_badge_of_ferocity,if=dot.kingsbane.ticking|dot.deathmark.ticking|(cooldown.kingsbane.remains>60|cooldown.deathmark.remains>60)
    # use_item,name=algethar_puzzle_box,use_off_gcd=1,if=variable.base_trinket_condition&buff.envenom.up
    - use_item,name=algethar_puzzle_box,if=var.base_trinket_condition&buff.envenom.up
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # Misc cooldowns
  misc_cds:
    # potion,if=dot.rupture.ticking&(buff.bloodlust.react|fight_remains<30|debuff.deathmark.up)
    # potion not supported — removed
    # blood_fury,use_off_gcd=1,if=debuff.deathmark.up
    - blood_fury,if=debuff.deathmark.up
    # berserking,use_off_gcd=1,if=debuff.deathmark.up
    - berserking,if=debuff.deathmark.up
    # fireblood,use_off_gcd=1,if=debuff.deathmark.up
    - fireblood,if=debuff.deathmark.up
    # ancestral_call,use_off_gcd=1,if=debuff.deathmark.up
    - ancestral_call,if=debuff.deathmark.up

  # Spend combo points
  spend:
    # cancel_buff,name=envenom,if=buff.implacable_tracker.stack>4&(!talent.rapid_injection|spell_targets.fan_of_knives>=5)
    # cancel_buff NOT supported — skipped
    # cancel_buff,name=envenom,if=buff.implacable_tracker.stack>3&talent.rapid_injection&debuff.deathstalkers_mark.stack=1
    # cancel_buff NOT supported — skipped
    # envenom,if=buff.implacable_tracker.stack<4
    - envenom,if=buff.1265389.stack<4
    # envenom,if=energy.pct>70|fight_remains<15
    - envenom,if=energy.pct>70|fight_remains<15

  # Vanish
  vanish:
    # vanish,if=variable.single_target&talent.improved_garrote&dot.garrote.pmultiplier<=1&(dot.deathmark.ticking|cooldown.deathmark.remains>target.time_to_die-10)&!raid_event.adds.in<=30
    # pmultiplier and raid_event not supported — removed
    - vanish,if=config.vanish_enabled&var.single_target&talent.improved_garrote&(dot.deathmark.ticking|cooldown.deathmark.remains>target.time_to_die-10)
    # vanish,if=!variable.single_target&talent.improved_garrote&dot.garrote.pmultiplier<=1&(raid_event.adds.remains>=10|!raid_event.adds.in<=30)
    # pmultiplier and raid_event not supported — removed
    - vanish,if=config.vanish_enabled&!var.single_target&talent.improved_garrote

  # Main entry point
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Restealth based on config
    - stealth,range_check=mob_count_40y,if=config.stealth_mode=0&!buff.stealth.up
    - stealth,range_check=none,if=config.stealth_mode=1&!buff.stealth.up

    # Poisons
    - numbing_poison,range_check=none,if=config.poison_mh=0&pred.buff.numbing_poison.remains<120&!player.combat
    - instant_poison,range_check=none,if=config.poison_oh=0&pred.buff.instant_poison.remains<120&!player.combat
    - wound_poison,range_check=none,if=config.poison_oh=1&pred.buff.wound_poison.remains<120&!player.combat
    - crippling_poison,range_check=none,if=config.poison_mh=1&pred.buff.crippling_poison.remains<120&!player.combat
    - atrophic_poison,range_check=none,if=config.poison_mh=3&pred.buff.atrophic_poison.remains<120&!player.combat

    # Combat Check
    - return,if=auto_combat.player

    - call_action_list,name=auto_heal
    - call_action_list,name=defensives

    # Interrupts
    - kick,if=interrupt.target.check
    - kick.mouseover,if=interrupt.mouseover.check
    - kick.focus,if=interrupt.focus.check
    # CC Interrupt
    - cheap_shot,if=interrupt.cc.check
    - kidney_shot,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Target Check
    - return,if=auto_combat.target

    # thistle_tea,if=energy.pct<50&fight_remains<10
    - thistle_tea,if=energy.pct<50&fight_remains<10
    # ambush,if=stealthed.rogue&variable.single_target&talent.blindside&talent.improved_ambush&!talent.shrouded_suffocation
    # stealthed.rogue not supported — using buff.stealth.up
    - ambush,if=buff.stealth.up&var.single_target&talent.blindside&talent.improved_ambush&!talent.shrouded_suffocation
    # Cooldowns
    - call_action_list,name=cds,if=state.cds
    # Maintain dots
    - call_action_list,name=core_dot
    # call_action_list,name=generate,if=!buff.darkest_night.up&combo_points<5|buff.darkest_night.up&combo_points.deficit>0
    - call_action_list,name=generate,if=!buff.darkest_night.up&combo_points<5|buff.darkest_night.up&combo_points.deficit>0
    # call_action_list,name=spend,if=!buff.darkest_night.up&combo_points>=5|buff.darkest_night.up&combo_points.deficit=0
    - call_action_list,name=spend,if=!buff.darkest_night.up&combo_points>=5|buff.darkest_night.up&combo_points.deficit=0

    # Trinkets
    - call_action_list,name=trinkets

    # Racials as fallback
    - arcane_torrent,if=energy.deficit>=15+energy.regen
    - arcane_pulse
    - lights_judgment
    - bag_of_tricks
