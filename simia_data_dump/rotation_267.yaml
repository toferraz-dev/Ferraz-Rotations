# =============================================================================
# Warlock Destruction - Spec ID 267
# =============================================================================

morphs:
  immolate: wither

version: 3
spec: 267
entry: main

config:
  dark_pact_hp_pct:
    section: "Defensive HP Percentage"
    label: "Dark Pact HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  unending_resolve_hp_pct:
    section: "Defensive HP Percentage"
    label: "Unending Resolve HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  dark_pact_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Dark Pact (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40
  unending_resolve_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Unending Resolve (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # variable,name=infernal_active,op=set,value=pet.infernal.active|(cooldown.summon_infernal.duration-cooldown.summon_infernal.remains)<20
  infernal_active: "pet.infernal.active|(cooldown.summon_infernal.duration-cooldown.summon_infernal.remains)<20"
  # variable,name=ritual_length,value=buff.diabolic_ritual_mother_of_chaos.remains+buff.diabolic_ritual_overlord.remains+buff.diabolic_ritual_pit_lord.remains,default=0,op=set
  ritual_length: "buff.diabolic_ritual_mother_of_chaos.remains+buff.diabolic_ritual_overlord.remains+buff.diabolic_ritual_pit_lord.remains"
  # trinket_1_will_lose_cast / trinket_2_will_lose_cast NOT supported - dropped (uses trinket property math)

lists:
  # ==========================================================================
  # DEFENSIVES
  # ==========================================================================
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - dark_pact,range_check=none,if=incoming.pct>=config.dark_pact_dmg_pct
    - unending_resolve,range_check=none,if=incoming.pct>=config.unending_resolve_dmg_pct&incoming.mitigated.pct>=config.unending_resolve_dmg_pct

    # --- HP Percentage: react when already low ---
    - dark_pact,range_check=none,if=health.pct<=config.dark_pact_hp_pct
    - unending_resolve,range_check=none,if=health.pct<=config.unending_resolve_hp_pct

  # ==========================================================================
  # AOE - Diabolist (2+ targets with Diabolic Ritual talent)
  # ==========================================================================
  aoe_dia:
    # summon_infernal
    - summon_infernal
    # chaos_bolt,if=talent.diabolic_ritual&(demonic_art|(variable.ritual_length<action.chaos_bolt.execute_time))&target.health.pct>20&active_enemies<=4
    - chaos_bolt,if=talent.diabolic_ritual&(demonic_art|(var.ritual_length<action.chaos_bolt.execute_time))&target.health.pct>20&enemies_around_target<=4
    # rain_of_fire,if=((soul_shard>=(3.5-0.1*(active_dot.immolate)))|buff.alythesss_ire.up)&active_enemies>=4
    - rain_of_fire,if=((soul_shard>=(3.5-0.1*(active_dot.immolate)))|buff.alythesss_ire.up)&enemies_around_target>=4
    # conflagrate,target_if=max:(dot.immolate.remains-99*debuff.havoc.remains),if=dot_refreshable_count.immolate>0&!dot.immolate.refreshable
    # target_if dropped: max:(dot.immolate.remains-99*debuff.havoc.remains)
    - conflagrate,if=dot_refreshable_count.immolate>0&!dot.immolate.refreshable
    # shadowburn,target_if=min:(time_to_die+999*debuff.havoc.remains),if=(active_enemies<=(3+buff.fiendish_cruelty.up))|(talent.conflagration_of_chaos&active_enemies<=(6-talent.destructive_rapidity+buff.fiendish_cruelty.up))
    # target_if dropped
    - shadowburn,if=(enemies_around_target<=(3+buff.fiendish_cruelty.up))|(talent.conflagration_of_chaos&enemies_around_target<=(6-talent.destructive_rapidity+buff.fiendish_cruelty.up))
    # ruination
    - ruination
    # cataclysm,if=raid_event.adds.in>15|talent.lake_of_fire
    # raid_event removed
    - cataclysm,if=talent.lake_of_fire
    # havoc,target_if=min:((-target.time_to_die)<?-15)+dot.immolate.remains+99*(self.target=target),if=(!cooldown.summon_infernal.up|!talent.summon_infernal)&target.time_to_die>8|time<5
    # target_if dropped; time → combat.time
    - havoc,if=(!cooldown.summon_infernal.up|!talent.summon_infernal)&target.time_to_die>8|combat.time<5
    # infernal_bolt,if=soul_shard<3
    - infernal_bolt,if=soul_shard<3
    # chaos_bolt,if=active_enemies<=3&variable.ritual_length>4
    - chaos_bolt,if=enemies_around_target<=3&var.ritual_length>4
    # soul_fire,target_if=min:(dot.immolate.remains+100*debuff.havoc.remains),if=soul_shard<4&(talent.avatar_of_destruction&active_enemies<=10|active_enemies<=5)
    # target_if dropped
    - soul_fire,if=soul_shard<4&(talent.avatar_of_destruction&enemies_around_target<=10|enemies_around_target<=5)
    # immolate,target_if=min:dot.immolate.remains+99*debuff.havoc.remains,if=dot.immolate.refreshable&(!talent.cataclysm.enabled|cooldown.cataclysm.remains>dot.immolate.remains)&active_dot.immolate<=5&!talent.cataclysm&target.time_to_die>18
    # target_if dropped; talent.X.enabled → talent.X
    - immolate,if=dot.immolate.refreshable&(!talent.cataclysm|cooldown.cataclysm.remains>dot.immolate.remains)&active_dot.immolate<=5&!talent.cataclysm&target.time_to_die>18
    # conflagrate,target_if=max:(dot.immolate.remains-99*debuff.havoc.remains),if=buff.backdraft.stack<2|!talent.backdraft
    # target_if dropped
    - conflagrate,if=buff.backdraft.stack<2|!talent.backdraft
    # incinerate
    - incinerate

  # ==========================================================================
  # AOE - Hellcaller (2+ targets with Wither talent)
  # ==========================================================================
  aoe_hc:
    # summon_infernal
    - summon_infernal
    # malevolence
    - malevolence
    # rain_of_fire,if=(soul_shard>=(4.0-0.1*(active_dot.wither)))&active_enemies>=(5-talent.destructive_rapidity)
    - rain_of_fire,if=(soul_shard>=(4.0-0.1*(active_dot.wither)))&enemies_around_target>=(5-talent.destructive_rapidity)
    # conflagrate,target_if=max:(dot.wither.remains-99*debuff.havoc.remains),if=dot_refreshable_count.wither>0&!dot.wither.refreshable
    # target_if dropped
    - conflagrate,if=dot_refreshable_count.wither>0&!dot.wither.refreshable
    # shadowburn,target_if=min:(time_to_die+999*debuff.havoc.remains),if=buff.fiendish_cruelty.up|(talent.conflagration_of_chaos&((active_enemies<=5&talent.destructive_rapidity)|(active_enemies<=6&!talent.destructive_rapidity)))
    # target_if dropped
    - shadowburn,if=buff.fiendish_cruelty.up|(talent.conflagration_of_chaos&((enemies_around_target<=5&talent.destructive_rapidity)|(enemies_around_target<=6&!talent.destructive_rapidity)))
    # cataclysm,if=raid_event.adds.in>15
    # raid_event removed
    - cataclysm
    # havoc,target_if=min:((-target.time_to_die)<?-15)+dot.wither.remains+99*(self.target=target),if=(!cooldown.summon_infernal.up|!talent.summon_infernal)&target.time_to_die>8&(cooldown.malevolence.remains>15|!talent.malevolence)|time<5
    # target_if dropped; time → combat.time
    - havoc,if=(!cooldown.summon_infernal.up|!talent.summon_infernal)&target.time_to_die>8&(cooldown.malevolence.remains>15|!talent.malevolence)|combat.time<5
    # rain_of_fire,if=active_enemies>=(5-talent.destructive_rapidity)
    - rain_of_fire,if=enemies_around_target>=(5-talent.destructive_rapidity)
    # chaos_bolt,if=active_enemies<=(4-talent.destructive_rapidity)
    - chaos_bolt,if=enemies_around_target<=(4-talent.destructive_rapidity)
    # soul_fire,target_if=min:(dot.wither.remains+100*debuff.havoc.remains),if=soul_shard<4&(active_enemies<=8|talent.avatar_of_destruction)
    # target_if dropped
    - soul_fire,if=soul_shard<4&(enemies_around_target<=8|talent.avatar_of_destruction)
    # wither,target_if=min:dot.wither.remains+99*debuff.havoc.remains,if=dot.wither.refreshable&(!talent.cataclysm.enabled|cooldown.cataclysm.remains>dot.wither.remains)&active_dot.wither<=active_enemies&target.time_to_die>8
    # target_if dropped; talent.X.enabled → talent.X
    - wither,if=dot.wither.refreshable&(!talent.cataclysm|cooldown.cataclysm.remains>dot.wither.remains)&active_dot.wither<=enemies_around_target&target.time_to_die>8
    # incinerate,if=talent.fire_and_brimstone&buff.backdraft.up
    - incinerate,if=talent.fire_and_brimstone&buff.backdraft.up
    # conflagrate,target_if=max:(dot.wither.remains-99*debuff.havoc.remains),if=buff.backdraft.stack<2|!talent.backdraft
    # target_if dropped
    - conflagrate,if=buff.backdraft.stack<2|!talent.backdraft
    # incinerate
    - incinerate

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # Shared lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Summon Pet (precombat: summon_pet; grimoire_of_sacrifice)
    - summon_imp,range_check=none,if=!pet.exists
    - grimoire_of_sacrifice,range_check=none,if=talent.grimoire_of_sacrifice&pet.exists

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - spell_lock,if=interrupt.target.check
    - spell_lock.mouseover,if=interrupt.mouseover.check
    - spell_lock.focus,if=interrupt.focus.check
    # Stun Interrupt
    - axe_toss,if=interrupt.stun.target.check
    - axe_toss.mouseover,if=interrupt.stun.mouseover.check
    - axe_toss.focus,if=interrupt.stun.focus.check
    # AoE Interrupt
    - shadowfury,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # Racials (ogcd list — potion and invoke_external_buff dropped; cooldown.X.remains_expected NOT supported, simplified)
    # berserking,if=variable.infernal_active|!talent.summon_infernal|(fight_remains<(cooldown.summon_infernal.remains_expected+cooldown.berserking.duration)&(fight_remains>cooldown.berserking.duration))|fight_remains<cooldown.summon_infernal.remains_expected
    - berserking,if=var.infernal_active|!talent.summon_infernal
    # blood_fury,if=variable.infernal_active|!talent.summon_infernal|(fight_remains<cooldown.summon_infernal.remains_expected+10+cooldown.blood_fury.duration&fight_remains>cooldown.blood_fury.duration)|fight_remains<cooldown.summon_infernal.remains
    - blood_fury,if=var.infernal_active|!talent.summon_infernal
    # fireblood,if=variable.infernal_active|!talent.summon_infernal|(fight_remains<cooldown.summon_infernal.remains_expected+10+cooldown.fireblood.duration&fight_remains>cooldown.fireblood.duration)|fight_remains<cooldown.summon_infernal.remains_expected
    - fireblood,if=var.infernal_active|!talent.summon_infernal
    # ancestral_call,if=variable.infernal_active|!talent.summon_infernal|(fight_remains<(cooldown.summon_infernal.remains_expected+cooldown.berserking.duration)&(fight_remains>cooldown.berserking.duration))|fight_remains<cooldown.summon_infernal.remains_expected
    - ancestral_call,if=var.infernal_active|!talent.summon_infernal

    # Trinkets (SimC complex sync math NOT supported — uses trinket properties; replaced with generic sync)
    # use_item,slot=trinket1,if=(variable.infernal_active|!talent.summon_infernal|variable.trinket_1_will_lose_cast)&...
    # use_item,slot=trinket2,if=(variable.infernal_active|!talent.summon_infernal|variable.trinket_2_will_lose_cast)&...
    # use_item,use_off_gcd=1,slot=main_hand
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # AoE - Hellcaller
    # call_action_list,name=aoe_hc,if=active_enemies>=2&talent.wither
    - call_action_list,name=aoe_hc,if=enemies_around_target>=2&talent.wither
    # AoE - Diabolist
    # call_action_list,name=aoe_dia,if=active_enemies>=2&talent.diabolic_ritual
    - call_action_list,name=aoe_dia,if=enemies_around_target>=2&talent.diabolic_ritual

    # --- Single Target Rotation ---
    # soul_fire,if=soul_shard<=4
    - soul_fire,if=soul_shard<=4
    # chaos_bolt,if=talent.diabolic_ritual&(demonic_art|(variable.ritual_length<action.chaos_bolt.execute_time))&target.health.pct>20
    - chaos_bolt,if=talent.diabolic_ritual&(demonic_art|(var.ritual_length<action.chaos_bolt.execute_time))&target.health.pct>20
    # conflagrate,if=soul_shard<=4.2&buff.backdraft.stack<1
    - conflagrate,if=soul_shard<=4.2&buff.backdraft.stack<1
    # summon_infernal
    - summon_infernal
    # malevolence
    - malevolence
    # incinerate,if=buff.chaotic_inferno_buff.up&soul_shard<=4.6
    # chaotic_inferno_buff resolves to spell ID 1244860 (use numeric ID due to name resolution)
    - incinerate,if=buff.1244860.up&soul_shard<=4.6
    # shadowburn,if=((!demonic_art&(variable.ritual_length>2|talent.wither))|target.health.pct<=20)&(buff.fiendish_cruelty.up|talent.conflagration_of_chaos)&(!talent.wither|soul_shard>=4|buff.malevolence.up|pet.infernal.active|fight_remains<=15)
    - shadowburn,if=((!demonic_art&(var.ritual_length>2|talent.wither))|target.health.pct<=20)&(buff.fiendish_cruelty.up|talent.conflagration_of_chaos)&(!talent.wither|soul_shard>=4|buff.malevolence.up|pet.infernal.active|fight_remains<=15)
    # wither,if=(((dot.wither.remains-5*(action.chaos_bolt.in_flight&talent.internal_combustion))<dot.wither.duration*0.3)|refreshable|(dot.wither.remains-action.chaos_bolt.execute_time)<5&talent.internal_combustion&action.chaos_bolt.usable)&(!talent.soul_fire|cooldown.soul_fire.remains+action.soul_fire.cast_time>(dot.wither.remains-5*talent.internal_combustion))&(!talent.cataclysm|(cooldown.cataclysm.remains+action.cataclysm.cast_time)>dot.wither.remains)&target.time_to_die>8
    # action.chaos_bolt.in_flight NOT supported - removed; bare refreshable → dot.wither.refreshable; action.chaos_bolt.usable → usable.chaos_bolt
    - wither,if=(dot.wither.remains<dot.wither.duration*0.3|dot.wither.refreshable|(dot.wither.remains-action.chaos_bolt.execute_time)<5&talent.internal_combustion&usable.chaos_bolt)&(!talent.soul_fire|cooldown.soul_fire.remains+action.soul_fire.cast_time>(dot.wither.remains-5*talent.internal_combustion))&(!talent.cataclysm|(cooldown.cataclysm.remains+action.cataclysm.cast_time)>dot.wither.remains)&target.time_to_die>8
    # immolate,if=(((dot.immolate.remains-5*(action.chaos_bolt.in_flight&talent.internal_combustion))<dot.immolate.duration*0.3)|refreshable|(dot.immolate.remains-action.chaos_bolt.execute_time)<5&talent.internal_combustion&action.chaos_bolt.usable)&(!talent.soul_fire|cooldown.soul_fire.remains+action.soul_fire.cast_time>(dot.immolate.remains-5*talent.internal_combustion))&(!talent.cataclysm|cooldown.cataclysm.remains>dot.immolate.remains)&target.time_to_die>8
    # action.chaos_bolt.in_flight NOT supported - removed; bare refreshable → dot.immolate.refreshable; action.chaos_bolt.usable → usable.chaos_bolt
    - immolate,if=(dot.immolate.remains<dot.immolate.duration*0.3|dot.immolate.refreshable|(dot.immolate.remains-action.chaos_bolt.execute_time)<5&talent.internal_combustion&usable.chaos_bolt)&(!talent.soul_fire|cooldown.soul_fire.remains+action.soul_fire.cast_time>(dot.immolate.remains-5*talent.internal_combustion))&(!talent.cataclysm|cooldown.cataclysm.remains>dot.immolate.remains)&target.time_to_die>8
    # ruination
    - ruination
    # cataclysm,if=talent.lake_of_fire
    - cataclysm,if=talent.lake_of_fire
    # chaos_bolt,if=(talent.wither&(soul_shard>=4|buff.malevolence.up|pet.infernal.active|fight_remains<=15))|(talent.diabolic_ritual&variable.ritual_length>4)
    - chaos_bolt,if=(talent.wither&(soul_shard>=4|buff.malevolence.up|pet.infernal.active|fight_remains<=15))|(talent.diabolic_ritual&var.ritual_length>4)
    # infernal_bolt,if=soul_shard<=3
    - infernal_bolt,if=soul_shard<=3
    # incinerate
    - incinerate
