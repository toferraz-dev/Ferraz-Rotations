version: 1

# Tagged auras - merged from old _spelldata.yaml (defensive_buffs) + _defensives.yaml (dangerous_debuffs)
#
# Two sections: buffs (on friendly units) and debuffs (on any unit)
#
# Buff expressions:
#   [unit.]buff_list[.<tag>].up|down|remains|count
#   Units: (none)=player, target., focus., mouseover., cycle.
#
# Debuff expressions:
#   [unit.]debuff_list[.<tag>].up|down|remains|count
#   Units: (none)=player, target., focus., mouseover., cycle.
#
# Examples:
#   buff_list.immunity.up              - Player has an immunity buff
#   target.buff_list.defensive, major.up          - Target has a defensive, major defensive buff
#   debuff_list.magic.up               - Player has a magic dangerous debuff
#   debuff_list.physical.heavy.up      - Player has a heavy physical debuff (AND match)
#   cycle.debuff_list.remains>5        - Cycle target's debuff remaining time
#
# Defensive mitigation fields (buffs only) — feed `incoming.mitigated.pct/.amount`:
#   dr:      fractional damage reduction in [0,1]. 1.0 = immunity. Stacks
#            multiplicatively with other active dr buffs (self + external).
#   dr_type: magic | physical  (omit = all schools). Scopes which incoming hits
#            the dr applies to. An untagged (unknown-school) hit only receives
#            all-school dr — school-specific dr is skipped (never overstates).
#   Values sourced from not_even_close (acornellier/not_even_close) + retail.
#   Pure-absorb shields (PW:S, Ice Barrier, Celestial Brew, Shield of Vengeance,
#   Dark Pact, ...) and pure health/heal CDs (Last Stand, Rallying Cry, Guardian
#   Spirit, ...) carry NO dr — their value is already in player.absorb /
#   player.health, so adding dr here would double-count.

