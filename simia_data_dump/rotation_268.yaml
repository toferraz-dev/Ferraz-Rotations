# =============================================================================
# Monk Brewmaster - SpecID 268
# =============================================================================
# 450521 Harmony Collect (Brewmaster and Mistweaver)
# 450769 Harmony Buff after using thunder focus tea (Mistweaver)
# 450711 Harmonny Buff (Brewmaster)

# ICON
# small: 5041801
# medium: 5041800
# large: 5041790

version: 3
spec: 268
entry: main

config:
  fortifying_brew_hp_pct:
    section: "Defensive HP Percentage"
    label: "Fortifying Brew HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  fortifying_brew_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Fortifying Brew (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  expel_harm_hp_pct:
    label: "Expel Harm HP%"
    type: slider
    min: 0
    max: 100
    default: 30

  purifying_brew_stagger_pc:
    section: "Defensive HP Percentage"
    label: "Purifying Brew Stagger%"
    type: slider
    min: 0
    max: 100
    default: 30

  purifying_brew_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Purifying Brew (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  celestial_brew_hp_pct:
    section: "Defensive HP Percentage"
    label: "Celestial Brew HP%"
    type: slider
    min: 0
    max: 100
    default: 95

  celestial_brew_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Celestial Brew (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  vivify_hp_pct:
    label: "Vivify (Vivacious Vivification) HP%"
    type: slider
    min: 0
    max: 100
    default: 75

variables:

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - purifying_brew,delay=300,range_check=none,if=incoming.mitigated.pct>=config.purifying_brew_dmg_pct&stagger.pct>=config.purifying_brew_stagger_pc
    - celestial_brew,range_check=none,if=incoming.mitigated.pct>=config.celestial_brew_dmg_pct
    - fortifying_brew,range_check=none,if=incoming.mitigated.pct>=config.fortifying_brew_dmg_pct

    # --- HP Percentage: react when already low ---
    - fortifying_brew,range_check=none,if=health.pct<=config.fortifying_brew_hp_pct
    - purifying_brew,delay=300,range_check=none,if=stagger.pct>=config.purifying_brew_stagger_pc
    - purifying_brew,delay=300,range_check=none,if=stagger.pct>=50
    - celestial_brew,range_check=none,if=health.pct<=config.celestial_brew_hp_pct
    - vivify,range_check=none,if=health.effective.pct<=config.vivify_hp_pct&buff.vivacious_vivification.up

  race_actions:
    - blood_fury
    - berserking
    - arcane_torrent
    - lights_judgment
    - fireblood
    - ancestral_call
    - bag_of_tricks

  # ==========================================================================
  # Master of Harmony
  # ==========================================================================
  master_of_harmony:
    # black_ox_brew,if=cooldown.celestial_brew.charges_fractional<1
    - black_ox_brew,if=cooldown.celestial_brew.charges_fractional<1
    # celestial_brew,if=buff.aspect_of_harmony_spender.up&!buff.empty_barrel.up
    - celestial_brew,if=buff.450711.up&!buff.empty_barrel.up&buff.celestial_brew.remains<2
    - celestial_infusion,if=buff.450711.up&!buff.empty_barrel.up&buff.celestial_infusion.remains<2
    # keg_smash,if=buff.aspect_of_harmony_spender.up&buff.empty_barrel.up
    - keg_smash,if=buff.450711.up&buff.empty_barrel.up
    # blackout_kick,if=talent.blackout_combo.enabled&!buff.blackout_combo.up
    - blackout_kick,if=talent.blackout_combo.enabled&!buff.blackout_combo.up
    # celestial_brew,if=!(apex.3&buff.empty_barrel.up)&buff.aspect_of_harmony_accumulator.value>0.95*health.max&cooldown.celestial_brew.charges_fractional>1.9
    # local addition: celestial_infusion is the same button under Aspect of Harmony.
    - celestial_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.aspect_of_harmony_accumulator.value>0.95*health.max&cooldown.celestial_brew.charges_fractional>1.9
    - celestial_infusion,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.aspect_of_harmony_accumulator.value>0.95*health.max&cooldown.celestial_brew.charges_fractional>1.9
    # celestial_brew,if=!(apex.3&buff.empty_barrel.up)&target.time_to_die<15&buff.aspect_of_harmony_accumulator.value>0.2*health.max
    - celestial_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&target.time_to_die<15&buff.aspect_of_harmony_accumulator.value>0.2*health.max
    - celestial_infusion,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&target.time_to_die<15&buff.aspect_of_harmony_accumulator.value>0.2*health.max
    # purifying_brew,if=!(apex.1&buff.empty_barrel.up)
    - purifying_brew,if=!(talent.bring_me_another.rank>=1&buff.empty_barrel.up)
    # fortifying_brew,if=!(apex.3&buff.empty_barrel.up)
    - fortifying_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)
    # chi_burst
    - chi_burst
    # invoke_niuzao
    - invoke_niuzao_the_black_ox
    - invoke_niuzao
    # tiger_palm,if=buff.blackout_combo.up&cooldown.blackout_kick.remains<1.3
    - tiger_palm,if=buff.blackout_combo.up&cooldown.blackout_kick.remains<1.3
    # exploding_keg,if=cooldown.keg_smash.charges_fractional<1
    - exploding_keg.player,if=cooldown.keg_smash.charges_fractional<1
    # empty_the_cellar,if=cooldown.celestial_brew.remains>15
    - empty_the_cellar,if=cooldown.celestial_brew.remains>15
    # breath_of_fire,if=cooldown.blackout_kick.remains>1.5&buff.blackout_combo.up
    - breath_of_fire,if=cooldown.blackout_kick.remains>1.5&buff.blackout_combo.up
    # tiger_palm,if=buff.blackout_combo.up
    - tiger_palm,if=buff.blackout_combo.up
    # breath_of_fire
    - breath_of_fire
    # keg_smash
    - keg_smash
    # empty_the_cellar
    - empty_the_cellar
    # rushing_jade_wind
    - rushing_jade_wind
    # celestial_brew,if=!(apex.3&buff.empty_barrel.up)
    # local addition: celestial_infusion is the same button under Aspect of Harmony.
    - celestial_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)
    - celestial_infusion,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)
    # blackout_kick
    - blackout_kick
    # tiger_palm,if=energy>50-energy.regen*2
    - tiger_palm,if=energy>50-energy.regen*2
    # expel_harm
    - expel_harm

  # ==========================================================================
  # Shado-Pan
  # ==========================================================================
  shado_pan:
    # breath_of_fire,if=talent.salsalabims_strength.enabled&buff.invoke_niuzao_the_black_ox.up
    - breath_of_fire,if=talent.salsalabims_strength.enabled&buff.invoke_niuzao_the_black_ox.up
    # keg_smash,if=talent.salsalabims_strength.enabled&buff.invoke_niuzao_the_black_ox.up
    - keg_smash,if=talent.salsalabims_strength.enabled&buff.invoke_niuzao_the_black_ox.up
    # purifying_brew,if=!(apex.1&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    - purifying_brew,if=!(talent.bring_me_another.rank>=1&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    # black_ox_brew,if=!(apex.1&buff.empty_barrel.up)&cooldown.celestial_brew.charges_fractional<0.25&buff.invoke_niuzao_the_black_ox.up
    - black_ox_brew,if=!(talent.bring_me_another.rank>=1&buff.empty_barrel.up)&cooldown.celestial_brew.charges_fractional<0.25&buff.invoke_niuzao_the_black_ox.up
    # celestial_brew,if=!(apex.3&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    # local addition: celestial_infusion is the same button under Aspect of Harmony.
    - celestial_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    - celestial_infusion,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    # exploding_keg,if=buff.invoke_niuzao_the_black_ox.up
    - exploding_keg.player,if=buff.invoke_niuzao_the_black_ox.up
    # fortifying_brew,if=!(apex.3&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    - fortifying_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.invoke_niuzao_the_black_ox.up
    # blackout_kick,if=talent.blackout_combo.enabled&!buff.blackout_combo.up
    - blackout_kick,if=talent.blackout_combo.enabled&!buff.blackout_combo.up
    # purifying_brew,if=!(apex.1&buff.empty_barrel.up)
    - purifying_brew,if=!(talent.bring_me_another.rank>=1&buff.empty_barrel.up)
    # invoke_niuzao
    - invoke_niuzao_the_black_ox
    - invoke_niuzao
    # tiger_palm,if=buff.blackout_combo.up&cooldown.blackout_kick.remains<1.3
    - tiger_palm,if=buff.blackout_combo.up&cooldown.blackout_kick.remains<1.3
    # empty_the_cellar,if=buff.empty_the_cellar.remains<1.5
    - empty_the_cellar,if=buff.empty_the_cellar.remains<1.5
    # tiger_palm,if=buff.blackout_combo.up
    - tiger_palm,if=buff.blackout_combo.up
    # breath_of_fire
    - breath_of_fire
    # keg_smash
    - keg_smash
    # exploding_keg
    - exploding_keg.player
    # celestial_brew,if=!(apex.3&buff.empty_barrel.up)
    - celestial_brew,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.celestial_brew.remains<2
    - celestial_infusion,if=!(talent.bring_me_another.rank>=4&buff.empty_barrel.up)&buff.celestial_infusion.remains<2
    # empty_the_cellar
    - empty_the_cellar
    # chi_burst
    - chi_burst
    # rushing_jade_wind
    - rushing_jade_wind
    # blackout_kick
    - blackout_kick
    # tiger_palm,if=energy>65-energy.regen
    - tiger_palm,if=energy>65-energy.regen
    # expel_harm
    - expel_harm

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - spear_hand_strike,if=interrupt.target.check
    - spear_hand_strike.mouseover,if=interrupt.mouseover.check
    - spear_hand_strike.focus,if=interrupt.focus.check
    # CC Interrupt
    - paralysis,if=interrupt.cc.check
    # AoE Interrupt
    - leg_sweep,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt — grab aggro when not tanking (dungeon/M+ only, never raid)
    - provoke,name="Taunt",if=target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - provoke.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    - call_action_list,name=race_actions

    - touch_of_death

    # run_action_list,name=master_of_harmony,if=hero_tree.master_of_harmony
    - run_action_list,name=master_of_harmony,if=hero_tree.master_of_harmony
    # run_action_list,name=shado_pan,if=hero_tree.shadopan
    - run_action_list,name=shado_pan,if=hero_tree.shado_pan

