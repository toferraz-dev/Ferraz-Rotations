# =============================================================================
# Evoker Augmentation - Spec ID 1473
# =============================================================================

# Conversion notes - apply throughout this file:
#   max_stack not supported -> 1+talent.375722 (see above)

version: 3
spec: 1473
entry: main

config:
  obsidian_scales_hp_pct:
    section: "Defensive HP Percentage"
    label: "Obsidian Scales HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  obsidian_scales_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Obsidian Scales (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 45

  emerald_blossom_hp_pct:
    section: "Defensive HP Percentage"
    label: "Emerald Blossom HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  living_flame_hp_pct:
    section: "Defensive HP Percentage"
    label: "Living Flame HP%"
    type: slider
    min: 0
    max: 100
    default: 30

  attunement_choice:
    label: "Attunement"
    type: dropdown
    options:
      - "Bronze Speed"
      - "Black Def"
    default: 0

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - obsidian_scales,range_check=none,if=incoming.mitigated.pct>=config.obsidian_scales_dmg_pct

    # --- HP Percentage: react when already low ---
    - obsidian_scales,range_check=none,if=health.pct<=config.obsidian_scales_hp_pct
    - emerald_blossom.player,range_check=none,if=health.pct<=config.emerald_blossom_hp_pct
    - living_flame,range_check=none,if=health.pct<=config.living_flame_hp_pct

  # Upstream folded the `fb` sub-list back into `default` — the two Fire Breath lines are
  # now inline there, gated on cooldown.upheaval instead of talent.leaping_flames.

  # ==========================================================================
  # Filler sub-list
  # ==========================================================================
  filler:
    # living_flame,if=(buff.ancient_flame.up|mana>=200000|!talent.dream_of_spring|variable.spam_heal=0)&(talent.pupil_of_alexstrasza&active_enemies>1|!talent.echoing_strike&!variable.azure_st_filler|talent.chrono_flame&variable.azure_st_filler<2)|buff.leaping_flames.up
    # variable.spam_heal=0 always true (default=0), simplifies first OR group to always true
    - living_flame,if=(talent.pupil_of_alexstrasza&enemies_around_target>1|!talent.echoing_strike|talent.chrono_flame)|buff.leaping_flames.up
    # azure_strike
    - azure_strike

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - sense_power,range_check=none,if=buff.sense_power.down
    - bronze_attunement,range_check=none,if=buff.bronze_attunement.down&config.attunement_choice=0
    - black_attunement,range_check=none,if=buff.black_attunement.down&config.attunement_choice=1

    - blistering_scales,range_check=none,if=group.count(cycle.range<=40)=1&buff.blistering_scales.down

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - quell,if=interrupt.target.check
    - quell.mouseover,if=interrupt.mouseover.check
    - quell.focus,if=interrupt.focus.check
    # AoE Interrupt
    - tail_swipe,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # Trinkets
    # use_item,name=vaelgors_final_stare,if=evoker.shifting_buffs>=2|evoker.shifting_buffs>=1&(cooldown.fire_breath.remains<=7|cooldown.upheaval.remains<=7)|cooldown.fire_breath.up&cooldown.upheaval.up
    # evoker.shifting_buffs NOT supported — both OR branches that use it are stripped, which
    # leaves only the third; kept unconditional (a superset) rather than narrowing to it
    - use_item,name=vaelgors_final_stare
    # use_item,name=bestinslots,use_off_gcd=1,if=buff.ebon_might_self.up&(!variable.trinket_1_buffs|trinket.1.cooldown.duration<=20|trinket.1.cooldown.remains>=10)&(!variable.trinket_2_buffs|trinket.2.cooldown.duration<=20|trinket.2.cooldown.remains>=10)
    # ebon_might_self → ebon_might; trinket properties NOT supported — stripped; use_off_gcd dropped
    - use_item,name=bestinslots,if=buff.ebon_might.up
    # azure_strike,if=cooldown.item_cd_1141.up&(variable.trinket_1_ogcd_cast&trinket.1.cooldown.up&(variable.damage_trinket_priority=1|trinket.2.cooldown.remains)|variable.trinket_2_ogcd_cast&trinket.2.cooldown.up&(variable.damage_trinket_priority=2|trinket.1.cooldown.remains))
    # Not converted: every term is a trinket property or SimC's internal item-cooldown category.
    # It is a filler cast to open a GCD for an off-GCD trinket; the sync lines below cover that.
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # cancel_buff,name=tip_the_scales,if=cooldown.fire_breath.remains>0&talent.temporal_burst&talent.time_skip&!talent.interwoven_threads

    # hover,use_off_gcd=1,if=gcd.remains>=0.5&(!raid_event.movement.exists|raid_event.movement.in<=6)
    # Not emitted: raid_event.* is unsupported, and stripping it leaves only gcd.remains>=0.5, which
    # would re-cast Hover on every spare off-GCD window. Same call as rotation_1467, which emits a
    # hover line only where a real non-raid_event branch survives (talent.slipstream).

    # --- Ebon Might ---
    # ebon_might,if=(((buff.ebon_might_self.remains-cast_time)<=buff.ebon_might_self.duration*variable.ebon_might_pandemic_threshold)&(active_enemies>0|raid_event.adds.in<=3)|talent.doubletime&variable.crit_fish>=1)&(variable.eons_remains>0|!talent.doubletime|buff.ebon_might_self.up)
    # buff.ebon_might_self -> buff.ebon_might; cast_time bare -> action.ebon_might.cast_time;
    # reduces to cooldown.breath_of_eons.remains (its setif condition is variable.enforce_timings,
    # a precombat op=reset default=0 sim toggle). These two lines are a deliberate local rewrite of
    # the upstream pandemic condition and do not consume it.
    - ebon_might,if=group.count(cycle.range<=40)>=1&(buff.ebon_might.remains<=buff.ebon_might.duration*0.3|buff.ebon_might.down)
    - ebon_might,if=group.count(cycle.range<=40)=0&(buff.ebon_might.remains<=buff.ebon_might.duration*0.3|buff.ebon_might.down)

    # --- Prescience (early - opener) ---
    # prescience,target_if=min:(debuff.prescience.remains-200*(target.role.attack|target.role.spell|target.role.dps)+50*target.spec.augmentation),if=debuff.prescience.remains<gcd.max*2&time<=8
    # target role/spec conditions not supported; time -> combat.time
    - prescience,if=combat.time<=8

    # potion,if=variable.eons_remains<=0|cooldown.breath_of_eons.remains>=90|fight_remains<=30&!fight_style.dungeonroute

    # fury_of_the_aspects,if=talent.time_convergence&!buff.time_convergence_intellect.up&(essence>=2|buff.essence_burst.react)&variable.eons_remains>=8
    # Never auto-cast: Lust/Hero is a group-wide call.

    # tip_the_scales,if=(!cooldown.breath_of_eons.up|!cooldown.allied_virtual_cd_time.up&variable.enforce_timings=1)&(cooldown.fire_breath.up|talent.temporal_burst&cooldown.fire_breath.remains>gcd.max*2)
    # enforce_timings is a precombat op=reset default=0 sim toggle, so the added OR branch is
    # always false and the condition reduces to !cooldown.breath_of_eons.up
    - tip_the_scales,if=!cooldown.breath_of_eons.up&(cooldown.fire_breath.up|talent.temporal_burst&cooldown.fire_breath.remains>gcd.max*2)

    # deep_breath,cancel_if=gcd.remains<=0
    - deep_breath

    # breath_of_eons,if=target.time_to_die>=20&(!variable.enforce_timings)|variable.enforce_timings&cooldown.allied_virtual_cd_time.up,cancel_if=gcd.remains<=0
    # this reduces to target.time_to_die>=20 (the old evoker.allied_cds_up branch is gone upstream)
    - breath_of_eons,if=target.time_to_die>=20

    # eruption,if=talent.afterimage&buff.essence_burst.at_max_stacks
    # max_stack not supported. Game reports 1; talent 375722 Essence Attunement adds 1.
    - eruption,if=talent.afterimage&buff.essence_burst.stack>=1+talent.375722

    # fire_breath,target_if=target.time_to_die>duration+0.2,empower_to=1,if=buff.ebon_might_self.up&cooldown.upheaval.up
    # target_if folded into if=; buff.ebon_might_self → buff.ebon_might; bare duration → action.fire_breath.execute_time
    - fire_breath,empower_to=1,if=target.time_to_die>action.fire_breath.execute_time+0.2&buff.ebon_might.up&cooldown.upheaval.up
    # fire_breath,target_if=target.time_to_die>duration+0.2,empower_to=3,if=buff.ebon_might_self.up&!cooldown.upheaval.up
    - fire_breath,empower_to=3,if=target.time_to_die>action.fire_breath.execute_time+0.2&buff.ebon_might.up&!cooldown.upheaval.up

    # upheaval,target_if=target.time_to_die>duration+0.2,empower_to=1,if=buff.ebon_might_self.up&buff.magnified_fate.remains<=duration
    # target_if folded into if=; duration bare -> action.upheaval.execute_time; buff.ebon_might_self -> buff.ebon_might
    - upheaval,empower_to=1,if=buff.ebon_might.up&target.time_to_die>action.upheaval.execute_time+0.2&buff.magnified_fate.remains<=action.upheaval.execute_time

    # --- Prescience (main rotation) ---
    # prescience,target_if=min:(debuff.prescience.remains-200*(target.role.attack|target.role.spell|target.role.dps)+50*target.spec.augmentation),if=debuff.prescience.remains<gcd.max*2&(!talent.anachronism|buff.essence_burst.stack<buff.essence_burst.max_stack)|cooldown.time_skip.up&talent.time_skip
    # debuff.prescience is on an ally, not the enemy target, so the remains gate is dropped
    - prescience,if=(!talent.anachronism|buff.essence_burst.stack<1+talent.375722)|cooldown.time_skip.up&talent.time_skip

    # time_skip,if=!talent.chronoboon&cooldown.breath_of_eons.remains>=15|cooldown.tip_the_scales.remains>=6&!buff.tip_the_scales.up
    - time_skip,if=!talent.chronoboon&cooldown.breath_of_eons.remains>=15|cooldown.tip_the_scales.remains>=6&!buff.tip_the_scales.up

    # emerald_blossom,if=talent.dream_of_spring&buff.essence_burst.react&(variable.spam_heal=2|variable.spam_heal=1&!buff.ancient_flame.up&talent.ancient_flame)&(buff.ebon_might_self.up|essence.deficit=0|buff.essence_burst.stack=buff.essence_burst.max_stack&cooldown.ebon_might.remains>4)
    # var.spam_heal is 0, so this can never fire — kept faithful rather than deleted.
    - emerald_blossom,if=talent.dream_of_spring&buff.essence_burst.up&(var.spam_heal=2|var.spam_heal=1&!buff.ancient_flame.up&talent.ancient_flame)&(buff.ebon_might.up|essence.deficit=0|buff.essence_burst.stack=1+talent.375722&cooldown.ebon_might.remains>4)

    # eruption,target_if=max:debuff.bombardments.remains,if=buff.ebon_might_self.remains>execute_time
    # execute_time bare -> action.eruption.execute_time; buff.ebon_might_self -> buff.ebon_might
    - eruption,if=buff.ebon_might.remains>action.eruption.execute_time

    # run_action_list,name=filler
    - run_action_list,name=filler
