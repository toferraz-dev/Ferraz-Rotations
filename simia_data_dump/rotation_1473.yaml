# =============================================================================
# Evoker Augmentation - Spec ID 1473
# =============================================================================

version: 3
spec: 1473
entry: main

config:
  obsidian_scales_hp_pct:
    section: "Defensive HP Percentage"
    label: "Obsidian Scales HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  obsidian_scales_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Obsidian Scales (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 45

  emerald_blossom_hp_pct:
    section: "Defensive HP Percentage"
    label: "Emerald Blossom HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  living_flame_hp_pct:
    section: "Defensive HP Percentage"
    label: "Living Flame HP%"
    type: slider
    min: 0
    max: 100
    default: 30

  attunement_choice:
    label: "Attunement"
    type: dropdown
    options:
      - "Bronze Speed"
      - "Black Def"
    default: 0

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - obsidian_scales,range_check=none,if=incoming.pct>=config.obsidian_scales_dmg_pct

    # --- HP Percentage: react when already low ---
    - obsidian_scales,range_check=none,if=health.pct<=config.obsidian_scales_hp_pct
    - emerald_blossom.player,range_check=none,if=health.pct<=config.emerald_blossom_hp_pct
    - living_flame,range_check=none,if=health.pct<=config.living_flame_hp_pct

  # ==========================================================================
  # Fire Breath sub-list (empower stages by talent/time_to_die)
  # ==========================================================================
  fb:
    # Original: fire_breath,empower_to=1,target_if=target.time_to_die>16,if=buff.ebon_might_self.remains>duration&talent.molten_embers
    # target_if dropped; buff.ebon_might_self → buff.ebon_might; duration bare → action.fire_breath.execute_time
    - fire_breath,empower_to=1,if=target.time_to_die>16&buff.ebon_might.remains>action.fire_breath.execute_time&talent.molten_embers
    # Original: fire_breath,empower_to=2,target_if=target.time_to_die>12,if=buff.ebon_might_self.remains>duration
    - fire_breath,empower_to=2,if=target.time_to_die>12&buff.ebon_might.remains>action.fire_breath.execute_time
    # Original: fire_breath,empower_to=3,target_if=target.time_to_die>8,if=buff.ebon_might_self.remains>duration
    - fire_breath,empower_to=3,if=target.time_to_die>8&buff.ebon_might.remains>action.fire_breath.execute_time
    # Original: fire_breath,empower_to=4,target_if=target.time_to_die>4,if=talent.font_of_magic&buff.ebon_might_self.remains>duration
    - fire_breath,empower_to=4,if=target.time_to_die>4&talent.font_of_magic&buff.ebon_might.remains>action.fire_breath.execute_time

  # ==========================================================================
  # Filler sub-list
  # ==========================================================================
  filler:
    # Original: living_flame,if=(buff.ancient_flame.up|mana>=200000|!talent.dream_of_spring|variable.spam_heal=0)&(talent.pupil_of_alexstrasza&enemies_around_target>1|!talent.echoing_strike|talent.chrono_flame)|buff.leaping_flames.up
    # variable.spam_heal=0 always true (default=0), simplifies first OR group to always true
    - living_flame,if=(talent.pupil_of_alexstrasza&enemies_around_target>1|!talent.echoing_strike|talent.chrono_flame)|buff.leaping_flames.up
    # Original: azure_strike
    - azure_strike

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - sense_power,range_check=none,if=buff.sense_power.down
    - bronze_attunement,range_check=none,if=buff.bronze_attunement.down&config.attunement_choice=0
    - black_attunement,range_check=none,if=buff.black_attunement.down&config.attunement_choice=1

    - blistering_scales,range_check=none,if=group.count(cycle.range<=40)=1&buff.blistering_scales.down

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - quell,if=interrupt.target.check
    - quell.mouseover,if=interrupt.mouseover.check
    - quell.focus,if=interrupt.focus.check
    # AoE Interrupt
    - tail_swipe,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # Trinkets
    # use_item,name=vaelgors_final_stare,if=evoker.shifting_buffs>=2|evoker.shifting_buffs>=1&(cooldown.fire_breath.remains<=7|cooldown.upheaval.remains<=7)
    # evoker.shifting_buffs NOT supported — stripped condition, keeping named trinket
    - use_item,name=vaelgors_final_stare
    # use_item,name=bestinslots,use_off_gcd=1,if=buff.ebon_might_self.up&(!variable.trinket_1_buffs|trinket.1.cooldown.duration<=20|trinket.1.cooldown.remains>=10)&(!variable.trinket_2_buffs|trinket.2.cooldown.duration<=20|trinket.2.cooldown.remains>=10)
    # ebon_might_self → ebon_might; trinket properties NOT supported — stripped; use_off_gcd dropped
    - use_item,name=bestinslots,if=buff.ebon_might.up
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # Original: cancel_buff,name=tip_the_scales,if=cooldown.upheaval.remains>0&(talent.energy_cycles|talent.temporal_burst)
    # cancel_buff NOT supported - skipped

    # --- Ebon Might ---
    # Original: ebon_might,if=((buff.ebon_might_self.remains-cast_time)<=buff.ebon_might_self.duration*variable.ebon_might_pandemic_threshold)&(enemies_around_target>0|raid_event.adds.in<=3)&(buff.ebon_might_self.value<=0.05|(buff.ebon_might_self.remains-cast_time)<=buff.ebon_might_self.duration*0.3)
    # buff.ebon_might_self → buff.ebon_might; cast_time bare → action.ebon_might.cast_time; raid_event removed; buff.value not supported
    - ebon_might,if=group.count(cycle.range<=40)>=1&(buff.ebon_might.remains<=buff.ebon_might.duration*0.3|buff.ebon_might.down)
    - ebon_might,if=group.count(cycle.range<=40)=0&(buff.ebon_might.remains<=buff.ebon_might.duration*0.3|buff.ebon_might.down)

    # --- Prescience (early - opener) ---
    # Original: prescience,target_if=min:(debuff.prescience.remains-200*(target.role.attack|target.role.spell|target.role.dps)+50*target.spec.augmentation),if=debuff.prescience.remains<gcd.max*2&time<=8
    # target_if dropped; target role/spec conditions not supported; time → combat.time
    - prescience,if=combat.time<=8

    # Original: potion,if=... → potion NOT supported

    # Original: fury_of_the_aspects,if=talent.time_convergence&!buff.time_convergence_intellect.up&(essence>=2|buff.essence_burst.react)&variable.eons_remains>=8
    # variable.eons_remains → cooldown.breath_of_eons.remains (simplified, enforce_timings=0 by default)

    # Original: tip_the_scales,if=!cooldown.breath_of_eons.up&(buff.duplicate.up|!talent.energy_cycles)&(action.upheaval.usable_in<action.fire_breath.usable_in|!talent.molten_embers)|talent.energy_cycles&(...)
    # action.X.usable_in NOT supported; simplified
    - tip_the_scales,if=!cooldown.breath_of_eons.up

    # Original: deep_breath,cancel_if=gcd.remains<=0
    # cancel_if NOT supported
    - deep_breath

    # Original: breath_of_eons,if=target.time_to_die>=20&!variable.enforce_timings|variable.enforce_timings&(evoker.allied_cds_up>0|cooldown.allied_virtual_cd_time.up),cancel_if=gcd.remains<=0
    # cooldown.allied_virtual_cd_time NOT supported; cancel_if NOT supported; evoker.allied_cds_up aliased via group.buff.361022.count
    - breath_of_eons,if=target.time_to_die>=20|evoker.allied_cds_up>0

    # --- Fire Breath sub-list ---
    # Original: call_action_list,name=fb,if=(raid_event.adds.remains>6|raid_event.adds.in>20|evoker.allied_cds_up>0|!raid_event.adds.exists)&(!cooldown.breath_of_eons.up|!talent.temporal_burst)&(!buff.tip_the_scales.up|!talent.molten_embers)
    # raid_event removed; evoker.allied_cds_up removed
    - call_action_list,name=fb,if=(!cooldown.breath_of_eons.up|!talent.temporal_burst)&(!buff.tip_the_scales.up|!talent.molten_embers)

    # Original: upheaval,target_if=target.time_to_die>duration+0.2,empower_to=1,if=buff.ebon_might_self.remains>duration&(raid_event conditions...)
    # target_if dropped; duration bare → action.upheaval.execute_time; raid_event removed
    - upheaval,empower_to=1,if=buff.ebon_might.remains>action.upheaval.execute_time&target.time_to_die>action.upheaval.execute_time

    # --- Prescience (main rotation) ---
    # Original: prescience,target_if=min:(...),if=debuff.prescience.remains<gcd.max*2&(!talent.anachronism|buff.essence_burst.stack<buff.essence_burst.max_stack)
    # target_if dropped; buff.essence_burst.max_stack NOT supported; debuff.prescience on enemy not meaningful
    - prescience

    # Original: time_skip,if=!talent.chronoboon|cooldown.tip_the_scales.remains>=6&!buff.tip_the_scales.up
    - time_skip,if=!talent.chronoboon|cooldown.tip_the_scales.remains>=6&!buff.tip_the_scales.up

    # Original: emerald_blossom,if=talent.dream_of_spring&buff.essence_burst.react&(variable.spam_heal=2|variable.spam_heal=1&!buff.ancient_flame.up&talent.ancient_flame)&(...)
    # variable.spam_heal defaults to 0 - this would never fire; kept as comment
    # - emerald_blossom,if=talent.dream_of_spring&buff.essence_burst.react&(buff.ebon_might.up|essence.deficit=0)

    # Original: eruption,target_if=min:debuff.bombardments.remains,if=buff.ebon_might_self.remains>execute_time|essence.deficit=0|buff.essence_burst.stack=buff.essence_burst.max_stack&cooldown.ebon_might.remains>4
    # target_if dropped; execute_time bare → action.eruption.execute_time; buff.essence_burst.max_stack NOT supported → hardcoded 2
    - eruption,if=buff.ebon_might.remains>action.eruption.execute_time|essence.deficit=0|buff.essence_burst.stack>=2&cooldown.ebon_might.remains>4

    # Original: run_action_list,name=filler
    - run_action_list,name=filler
