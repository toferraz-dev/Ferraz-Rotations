version: 1.21
author: jecht
spec: 257
name: Jecht PriestHoly v1.2.1
description: |
  v1.2.1:
  - OOC heal added Disc-style (Fortitude + PoM + top-off heals).
  - Angelic Feather combat-only
  - Serenity priority enforced before Flash Heal/Benediction.

entry: main
movement_allowed: true
morphs:
  flash_heal: benediction
  flash_heal_focus: benediction_focus
config:
  dps_only_if_all_above_hp:
    label: DPS only if ALL members above HP %
    type: slider
    min: 50
    max: 100
    default: 90
  fade_hp_trigger:
    label: "Fade if SELF HP % below (combat only)"
    type: slider
    min: 50
    max: 100
    default: 95
  serenity_2charges_hp:
    label: Serenity (2 charges) use if target HP % below
    type: slider
    min: 10
    max: 100
    default: 88
  serenity_1charge_hp:
    label: Serenity (1 charge) use if target HP % below
    type: slider
    min: 10
    max: 100
    default: 75
  serenity_mouseover_hp:
    label: Mouseover Serenity until HP %
    type: slider
    min: 10
    max: 100
    default: 80
  fh_emergency_hp:
    label: Flash Heal Emergency HP %
    type: slider
    min: 5
    max: 95
    default: 30
  fh_sustain_hp:
    label: Flash Heal Sustain HP %
    type: slider
    min: 20
    max: 98
    default: 85
  surge_consume_hp:
    label: 'Surge of Light: consume until HP %'
    type: slider
    min: 50
    max: 100
    default: 98
  fh_mouseover_hp:
    label: Mouseover Flash Heal until HP %
    type: slider
    min: 10
    max: 100
    default: 92
  poh_hp:
    label: Prayer of Healing HP %
    type: slider
    min: 20
    max: 98
    default: 80
  poh_count:
    label: Prayer of Healing Count
    type: slider
    min: 0
    max: 12
    default: 3
  halo_hp:
    label: Halo HP %
    type: slider
    min: 20
    max: 98
    default: 78
  halo_count:
    label: Halo Count
    type: slider
    min: 0
    max: 12
    default: 4
  hymn_hp:
    label: Divine Hymn HP %
    type: slider
    min: 20
    max: 98
    default: 75
  hymn_count:
    label: Divine Hymn Count
    type: slider
    min: 0
    max: 12
    default: 6
  apoth_hp:
    label: Apotheosis HP %
    type: slider
    min: 20
    max: 98
    default: 70
  apoth_count:
    label: Apotheosis Count
    type: slider
    min: 0
    max: 12
    default: 4
  apoth_require_serenity_cd:
    label: Apotheosis only if Serenity on cooldown
    type: checkbox
    default: false
  guardian_spirit_hp:
    label: Guardian Spirit HP %
    type: slider
    min: 5
    max: 70
    default: 30
  guardian_spirit_target:
    label: Guardian Spirit targets
    type: dropdown
    options:
    - label: Tanks only
      value: 1
    - label: Healers only
      value: 2
    - label: DPS only
      value: 3
    - label: Everyone
      value: 4
    default: 1
  dp_self_hp:
    label: Desperate Prayer (self) HP %
    type: slider
    min: 5
    max: 90
    default: 30
  auto_dispel:
    label: Auto Dispel (Magic)
    type: checkbox
    default: true
  auto_interrupt:
    label: Auto Interrupt (Chastise)
    type: checkbox
    default: true
  auto_psychic_scream_interrupt:
    label: Auto CC Interrupt (Psychic Scream 7y)
    type: checkbox
    default: true
  psychic_scream_min_enemies:
    label: 'Psychic Scream: min enemies (0-12)'
    type: slider
    min: 0
    max: 12
    default: 2
  psychic_scream_min_casters:
    label: 'Psychic Scream: min casters (0-12)'
    type: slider
    min: 0
    max: 12
    default: 2
  mouseover_enabled:
    label: Enable Mouseover
    type: checkbox
    default: true
  auto_target:
    label: Auto Target Enemies
    type: checkbox
    default: true
  angelic_feather_usage:
    label: Angelic Feather Usage
    type: dropdown
    options:
    - label: Disabled
      value: 0
    - label: Only in combat
      value: 1
    - label: Only out of combat
      value: 2
    - label: Always when moving
      value: 3
    default: 2
  angelic_feather_movement_time:
    label: Feather after moving
    type: slider
    min: 0
    max: 4
    default: 0
  trinket_usage:
    label: Trinket Usage
    type: dropdown
    options:
    - label: On Cooldown
      value: 1
    - label: With Apotheosis
      value: 2
    - label: When group damaged
      value: 3
    - label: Manual Only
      value: 0
    default: 1
  ooc_topoff_hp:
    label: OOC Top-off HP % (Flash Heal)
    type: slider
    min: 50
    max: 100
    default: 90
  ooc_serenity_hp:
    label: OOC Serenity HP %
    type: slider
    min: 20
    max: 100
    default: 70
variables:
  apoth_simple_needed: group.count(cycle.health.pct<config.fh_emergency_hp)>=2|group.count(cycle.health.pct<config.serenity_1charge_hp)>=3
  apotheosis_window: buff.apotheosis.up
  use_feather: (moving.time>0)&(moving.time>=config.angelic_feather_movement_time)&buff.angelic_feather.down&((config.angelic_feather_usage=1&player.combat)|(config.angelic_feather_usage=2&!player.combat)|(config.angelic_feather_usage=3))
  player_can_cast: '!player.casting&!player.channeling&!player.stunned&!player.silenced&!player.incapacitated'
  in_fight: player.combat|(active_enemies>0)|(target.exists&!target.dead&!target.friendly)
  all_above_dps_hp: group.count(cycle.health.pct<config.dps_only_if_all_above_hp)=0
  in_spirit_of_redemption: buff.spirit_of_redemption.up|buff.27827.up
  pom_ready: cooldown.prayer_of_mending.ready
  serenity_ready: cooldown.holy_word_serenity.ready
  apoth_ready: cooldown.apotheosis.ready
  gs_ready: cooldown.guardian_spirit.ready
  poh_ready: cooldown.prayer_of_healing.ready
  halo_ready: cooldown.halo.ready
  hymn_ready: cooldown.divine_hymn.ready
  chastise_ready: cooldown.holy_word_chastise.ready
  fade_ready: cooldown.fade.ready
  tank_has_pom: tanks.buff.prayer_of_mending.up
  serenity_charges_2: charges.holy_word_serenity=2|cooldown.holy_word_serenity.charges=2
  serenity_charges_1plus: charges.holy_word_serenity>=1|cooldown.holy_word_serenity.charges>=1
  surge_of_light: buff.surge_of_light.up|buff.114255.up
  surge_heal_needed: "(buff.surge_of_light.up|buff.114255.up)&group.count(cycle.health.pct<config.surge_consume_hp)>=1"
  any_serenity_needed: group.count(cycle.health.pct<config.serenity_1charge_hp)>=1
  any_emergency: group.count(cycle.health.pct<config.fh_emergency_hp)>=1
  any_sustain: group.count(cycle.health.pct<config.fh_sustain_hp)>=1
  poh_needed: config.poh_count>0&group.count(cycle.health.pct<config.poh_hp)>=config.poh_count
  halo_needed: config.halo_count>0&group.count(cycle.health.pct<config.halo_hp)>=config.halo_count
  hymn_needed: config.hymn_count>0&group.count(cycle.health.pct<config.hymn_hp)>=config.hymn_count
  apoth_needed: config.apoth_count>0&group.count(cycle.health.pct<config.apoth_hp)>=config.apoth_count
  mo_friendly_valid: mouseover.exists&mouseover.alive&mouseover.friendly&mouseover.range<=40
  out_of_combat:
  - power_word_fortitude.player,if=!buff.power_word_fortitude.up&!buff.21562.up
  - prayer_of_mending,cycle=tanks,if=(cycle.range>0&cycle.range<=40)
  - prayer_of_mending,cycle=members,if=!tanks.buff.prayer_of_mending.up&(cycle.range>0&cycle.range<=40)
  - angelic_feather,if=var.use_feather&config.angelic_feather_usage!=0
lists:
  out_of_combat:
  - power_word_fortitude.player,if=!buff.power_word_fortitude.up&!buff.21562.up
  - prayer_of_mending,cycle=tanks,if=var.pom_ready&(cycle.range>0&cycle.range<=40)&!cycle.buff.prayer_of_mending.up
  - prayer_of_mending,cycle=members,if=var.pom_ready&(cycle.range>0&cycle.range<=40)&!cycle.buff.prayer_of_mending.up
  - holy_word_serenity,cycle=members,range_check=none,if=var.serenity_ready&(cycle.range=0|cycle.range<=40)&cycle.health.pct<config.ooc_serenity_hp
  - flash_heal,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&cycle.health.pct<config.ooc_topoff_hp
  sanity_checks_combat:
  - return,if=mounted
  - return,if=state.blocked_inputs
  - return,if=config.require_rotation_toggle_for_combat&!state.rotation
  - return,if=player.dead&!var.in_spirit_of_redemption
  auto_target:
  - target_enemy,if=config.auto_target&var.in_fight&(!target.exists|target.dead|target.friendly)
  - target_enemy,if=config.auto_target&var.in_fight&target.exists&target.valid&!target.combat&player.combat
  - target_enemy,if=config.auto_target&var.in_fight&!target.valid&active_enemies>0
  auto_fade:
  - fade,range_check=none,if=state.rotation&player.combat&var.fade_ready&health.pct<config.fade_hp_trigger&!prev_gcd.1.fade&!prev_gcd.2.fade
  interrupts:
  - holy_word_chastise,if=config.auto_interrupt&var.chastise_ready&target.casting.interruptible
  dispel:
  - purify,cycle=members,if=config.auto_dispel&cycle.dispelable.magic&(cycle.range=0|cycle.range<=40)&!prev_gcd.1.purify&!prev_gcd.2.purify
  - purify.player,if=config.auto_dispel&player.dispelable.magic&!prev_gcd.1.purify&!prev_gcd.2.purify
  defensive:
  - desperate_prayer.player,if=var.in_fight&health.pct<config.dp_self_hp
  movement:
  - angelic_feather,if=var.in_fight&var.use_feather&config.angelic_feather_usage!=0
  trinkets:
  - trinket_1,if=var.in_fight&trinket_1.ready&config.trinket_usage=1
  - trinket_2,if=var.in_fight&trinket_2.ready&config.trinket_usage=1
  - trinket_1,if=var.in_fight&trinket_1.ready&config.trinket_usage=2&buff.apotheosis.up
  - trinket_2,if=var.in_fight&trinket_2.ready&config.trinket_usage=2&buff.apotheosis.up
  pom_combat:
  - prayer_of_mending,cycle=tanks,range_check=none,if=var.in_fight&var.pom_ready&!prev_gcd.1.prayer_of_mending
  guardian_spirit:
  - guardian_spirit,cycle=tanks,if=var.in_fight&var.gs_ready&config.guardian_spirit_target=1&cycle.health.pct<config.guardian_spirit_hp&(cycle.range=0|cycle.range<=40)
  - guardian_spirit,cycle=healers,if=var.in_fight&var.gs_ready&config.guardian_spirit_target=2&cycle.health.pct<config.guardian_spirit_hp&(cycle.range=0|cycle.range<=40)
  - guardian_spirit,cycle=dps,if=var.in_fight&var.gs_ready&config.guardian_spirit_target=3&cycle.health.pct<config.guardian_spirit_hp&(cycle.range=0|cycle.range<=40)
  - guardian_spirit,cycle=members,if=var.in_fight&var.gs_ready&config.guardian_spirit_target=4&cycle.health.pct<config.guardian_spirit_hp&(cycle.range=0|cycle.range<=40)
  apotheosis:
  - apotheosis,if=var.in_fight&var.apoth_ready&var.apoth_needed&var.player_can_cast&!prev_gcd.1.apotheosis&(!config.apoth_require_serenity_cd|!var.serenity_ready)
  aoe_heals:
  - divine_hymn,if=var.in_fight&var.hymn_ready&var.hymn_needed&var.player_can_cast&!prev_gcd.1.divine_hymn
  - halo,if=var.in_fight&var.halo_ready&var.halo_needed&var.player_can_cast&!prev_gcd.1.halo
  - prayer_of_healing,range_check=none,if=var.in_fight&var.poh_ready&var.poh_needed&var.player_can_cast&!prev_gcd.1.prayer_of_healing
  single_heals:
  - holy_word_serenity,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&var.serenity_ready&var.serenity_charges_2&cycle.health.pct<config.serenity_2charges_hp&!prev_gcd.1.holy_word_serenity
  - holy_word_serenity,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&var.serenity_ready&var.serenity_charges_1plus&cycle.health.pct<config.serenity_1charge_hp
  - flash_heal,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&var.surge_of_light&cycle.health.pct<config.surge_consume_hp
  - flash_heal,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&cycle.health.pct<config.fh_emergency_hp&!prev_gcd.1.flash_heal
  - flash_heal,cycle=members,range_check=none,if=(cycle.range=0|cycle.range<=40)&cycle.health.pct<config.fh_sustain_hp
  mouseover_friendly:
  - purify.mouseover,if=(mouseover.range=0|mouseover.range<=40)&config.auto_dispel&mouseover.dispelable.magic&var.mo_friendly_valid
  - holy_word_serenity.mouseover,range_check=none,if=(mouseover.range=0|mouseover.range<=40)&var.serenity_ready&mouseover.health.pct<config.serenity_mouseover_hp&var.mo_friendly_valid
  - flash_heal.mouseover,range_check=none,if=(mouseover.range=0|mouseover.range<=40)&mouseover.health.pct<config.fh_mouseover_hp&var.mo_friendly_valid
  dps_rotation:
  - holy_fire,if=var.in_fight&target.exists&!target.dead&!target.friendly&(target.range=0|target.range<=40)
  - smite,if=var.in_fight&target.exists&!target.dead&!target.friendly&(target.range=0|target.range<=40)
  - holy_nova,if=var.in_fight&target.exists&!target.dead&!target.friendly&active_enemies>=3&(target.range=0|target.range<=12)
  main:
  - return,if=!state.rotation
  - call_action_list,name=out_of_combat,if=!player.combat
  - return,if=!player.combat
  - call_action_list,name=sanity_checks_combat,if=player.combat
  - call_action_list,name=auto_target,if=var.in_fight
  - call_action_list,name=auto_fade,if=var.in_fight
  - return,if=player.channeling
  - call_action_list,name=interrupts
  - call_action_list,name=dispel
  - call_action_list,name=defensive
  - call_action_list,name=movement
  - call_action_list,name=trinkets
  - call_action_list,name=pom_combat
  - call_action_list,name=guardian_spirit
  - call_action_list,name=apotheosis
  - call_action_list,name=aoe_heals,if=var.hymn_needed|var.halo_needed|var.poh_needed
  - call_action_list,name=mouseover_friendly,if=config.mouseover_enabled&var.mo_friendly_valid&var.player_can_cast
  - call_action_list,name=single_heals,if=var.any_serenity_needed|var.any_emergency|var.any_sustain|var.surge_heal_needed
  - call_action_list,name=dps_rotation,if=var.in_fight&var.all_above_dps_hp&!(var.apoth_needed|var.hymn_needed|var.halo_needed|var.poh_needed|var.any_serenity_needed|var.any_emergency|var.any_sustain|var.surge_heal_needed)
