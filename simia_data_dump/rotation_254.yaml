# =============================================================================
# Hunter Marksmanship - Spec ID 254
# =============================================================================

# Conversion notes - apply throughout this file:
#   Dead: set_bonus.* always evaluates 0 (no tier_sets: section exists anywhere), so this whole

version: 3
spec: 254
entry: main

config:
  exhilaration_hp_pct:
    section: "Defensive HP Percentage"
    label: "Exhilaration HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  survival_of_the_fittest_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival of the Fittest HP%"
    type: slider
    min: 0
    max: 100
    default: 50
  survival_of_the_fittest_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival of the Fittest (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # variable,name=trueshot_ready,value=!talent.bullseye|(fight_remains>cooldown.trueshot.duration+10|buff.bullseye.stack=buff.bullseye.max_stack)&(cooldown.explosive_shot.remains>=15|cooldown.explosive_shot.ready)|fight_remains<25|time<10
  # buff.bullseye.max_stack NOT supported - hardcoded to 30; bare time -> combat.time
  # variable,name=trueshot_ready,op=setif,condition=fight_style.dungeonroute,value_else=variable.trueshot_ready,value=raid_event.pull.remains>30|raid_event.pull.in>60|talent.calling_the_shots
  # No-op for us: the setif condition is fight_style.dungeonroute (=0), so it always takes
  # value_else, which is trueshot_ready itself. The definition above therefore stands unchanged.
  trueshot_ready: "!talent.bullseye|(fight_remains>cooldown.trueshot.duration+10|buff.bullseye.stack>=30)&(cooldown.explosive_shot.remains>=15|cooldown.explosive_shot.ready)|fight_remains<25|combat.time<10"
  # Predict precise_shots: already up, OR aimed_shot just cast and no arcane_shot sent since
  precise_shots_predicted: "buff.precise_shots.up|(lastcast.aimed_shot<0.5&lastcast.arcane_shot>lastcast.aimed_shot)"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - survival_of_the_fittest,range_check=none,if=incoming.mitigated.pct>=config.survival_of_the_fittest_dmg_pct

    # --- HP Percentage: react when already low ---
    - exhilaration,range_check=none,if=health.pct<=config.exhilaration_hp_pct
    - survival_of_the_fittest,range_check=none,if=health.pct<=config.survival_of_the_fittest_hp_pct

  # ==========================================================================
  # Cooldowns
  # ==========================================================================
  cds:
    # invoke_external_buff,name=power_infusion,if=buff.trueshot.remains>12|fight_remains<13

    # berserking,if=buff.trueshot.up|fight_remains<13
    - berserking,if=buff.trueshot.up|fight_remains<13
    # blood_fury,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - blood_fury,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    # ancestral_call,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - ancestral_call,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    # fireblood,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<9
    - fireblood,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<9
    # lights_judgment,if=buff.trueshot.down
    - lights_judgment,if=buff.trueshot.down
    # potion,if=buff.trueshot.up&(buff.bloodlust.up|fight_remains<120-30*talent.calling_the_shots)|fight_remains<31
    # Bullseye's crit devalues Potion of Recklessness in execute. Additionally, a mid-fight pot means that prepotting Luster before Trueshot becomes higher value than pre-potting before combat begins. Therefore, Pot of Recklessness on pull, but during execute, Luster pot around 10s before Trueshot to maximize its benefit.
    # potion,name=liquid_luster_2,if=potion.potion_of_recklessness&buff.bullseye.up&cooldown.trueshot.remains<10&(fight_style.dungeonroute|cooldown.explosive_shot.remains>=25|cooldown.explosive_shot.remains<10)|fight_remains<31

  # ==========================================================================
  # Dark Ranger ST
  # ==========================================================================
  # var.precise_shots_predicted is a local stand-in for buff.precise_shots.up (see variables:).
  # max_prio_damage is a hunter sim-profile option (sc_hunter.cpp:1052, default TRUE), not a target
  # property — converted as the constant 1. fight_style.* is unsupported and reads 0. So
  # (!max_prio_damage|!fight_style.dungeonroute[|...]) = (0|1) = 1 and a bare &max_prio_damage = &1:
  # every occurrence collapses to true and is dropped.
  drst:
    # actions.drst=black_arrow,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - black_arrow,if=var.precise_shots_predicted
    # actions.drst+=/explosive_shot,target_if=min:dot.explosive_shot.remains,if=set_bonus.mid2_4pc&active_enemies>1&(!max_prio_damage|!fight_style.dungeonroute)&(!talent.tactical_reload|!buff.lock_and_load.up)
    # line is unreachable. Its (!max_prio_damage|!fight_style.dungeonroute) group is TRUE for us
    # (max_prio_damage=1, fight_style.*=0). The unconditional explosive_shot below covers it.
    # In DRoute, prioritize Rapid Fire over Explosive Shot to maximize the RF CDR from Explo, but never let the 2nd free Explo from Unstable Trigger lapse.
    # actions.drst+=/explosive_shot,if=(!talent.tactical_reload|!buff.lock_and_load.up)&(!cooldown.rapid_fire.ready|buff.unstable_trigger.up|!fight_style.dungeonroute)
    - explosive_shot,if=!talent.tactical_reload|!buff.lock_and_load.up
    # actions.drst+=/volley
    - volley
    # actions.drst+=/aimed_shot,if=buff.trueshot.up&buff.precise_shots.down&cooldown.black_arrow.ready|full_recharge_time<gcd+cast_time
    - aimed_shot,if=buff.trueshot.up&buff.precise_shots.down&cooldown.black_arrow.ready|cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    # actions.drst+=/trueshot,if=variable.trueshot_ready
    - trueshot,if=var.trueshot_ready
    # actions.drst+=/rapid_fire
    - rapid_fire
    # actions.drst+=/wailing_arrow
    - wailing_arrow
    # actions.drst+=/multishot,target_if=max:debuff.spotters_mark.down,if=buff.precise_shots.up&active_enemies>1&talent.aspect_of_the_hydra&(!fight_style.dungeonroute|active_enemies>2)
    # (!fight_style.dungeonroute|active_enemies>2) is TRUE for us (fight_style.*=0), so the group is dropped
    # and the gate is enemies>1 -- matching upstream's own note above the line: "Multi-Shot as a PS
    # spender on 2T with Hydra talented. In DRoute, do it on 3 or more targets."
    - multishot,if=var.precise_shots_predicted&enemies_around_target>1&talent.aspect_of_the_hydra
    # actions.drst+=/arcane_shot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - arcane_shot,if=var.precise_shots_predicted
    # actions.drst+=/aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage
    - aimed_shot
    # actions.drst+=/black_arrow
    - black_arrow
    # actions.drst+=/steady_shot
    - steady_shot

  # ==========================================================================
  # Dark Ranger AOE (3+ targets)
  # ==========================================================================
  draoe:
    # actions.draoe+=/explosive_shot,target_if=min:dot.explosive_shot.remains,if=set_bonus.mid2_4pc&(!max_prio_damage|!fight_style.dungeonroute)&(!talent.tactical_reload|!buff.lock_and_load.up)
    # line is unreachable. Its (!max_prio_damage|!fight_style.dungeonroute) group is TRUE for us
    # (max_prio_damage=1, fight_style.*=0). The unconditional explosive_shot below covers it.
    # actions.draoe+=/explosive_shot,if=(!talent.tactical_reload|!buff.lock_and_load.up)&(!cooldown.rapid_fire.ready|buff.unstable_trigger.up|!fight_style.dungeonroute)
    - explosive_shot,if=!talent.tactical_reload|!buff.lock_and_load.up
    # actions.draoe+=/volley
    - volley
    # actions.draoe+=/aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage,if=buff.trick_shots.remains>cast_time&full_recharge_time<gcd+cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time&cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    # actions.draoe+=/black_arrow,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - black_arrow,if=var.precise_shots_predicted
    # actions.draoe+=/multishot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.trick_shots.down
    - multishot,if=buff.trick_shots.down
    # actions.draoe+=/trueshot,if=variable.trueshot_ready
    - trueshot,if=var.trueshot_ready
    # actions.draoe+=/rapid_fire,if=buff.trick_shots.remains>execute_time
    - rapid_fire,if=buff.trick_shots.remains>action.rapid_fire.execute_time
    # actions.draoe+=/wailing_arrow,if=!cooldown.black_arrow.ready
    - wailing_arrow,if=!cooldown.black_arrow.ready
    # actions.draoe+=/multishot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - multishot,if=var.precise_shots_predicted
    # actions.draoe+=/aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage,if=buff.trick_shots.remains>cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    # actions.draoe+=/black_arrow
    - black_arrow
    # actions.draoe+=/multishot,if=focus>cost+action.aimed_shot.cost&!max_prio_damage
    # max_prio_damage is a sim option defaulting TRUE, so !max_prio_damage is always 0 - line is dead.
    # - multishot,if=focus>action.multishot.cost+action.aimed_shot.cost
    # actions.draoe+=/steady_shot
    - steady_shot

  # ==========================================================================
  # Sentinel AOE (3+ targets)
  # ==========================================================================
  sentaoe:
    # actions.sentaoe+=/explosive_shot,target_if=min:dot.explosive_shot.remains,if=set_bonus.mid2_4pc&(!max_prio_damage|!fight_style.dungeonroute)&(!talent.tactical_reload|!buff.lock_and_load.up)
    # line is unreachable. Its (!max_prio_damage|!fight_style.dungeonroute) group is TRUE for us
    # (max_prio_damage=1, fight_style.*=0). The unconditional explosive_shot below covers it.
    # actions.sentaoe+=/explosive_shot,if=(!talent.tactical_reload|!buff.lock_and_load.up)&(!cooldown.rapid_fire.ready|buff.unstable_trigger.up|!fight_style.dungeonroute)
    - explosive_shot,if=!talent.tactical_reload|!buff.lock_and_load.up
    # actions.sentaoe+=/volley
    - volley
    # actions.sentaoe+=/trueshot,if=variable.trueshot_ready
    - trueshot,if=var.trueshot_ready
    # actions.sentaoe+=/moonlight_chakram,if=buff.moonlight_chakram.remains<gcd.max
    - moonlight_chakram,if=buff.moonlight_chakram.remains<gcd.max
    # actions.sentaoe+=/multishot,target_if=max:debuff.sentinels_mark.down,if=buff.precise_shots.up&!talent.aspect_of_the_hydra|buff.trick_shots.down
    - multishot,if=var.precise_shots_predicted&!talent.aspect_of_the_hydra|buff.trick_shots.down
    # actions.sentaoe+=/aimed_shot,target_if=max:debuff.sentinels_mark.up,if=debuff.sentinels_mark.react&buff.bulletstorm.up
    - aimed_shot,if=debuff.sentinels_mark.react&buff.bulletstorm.up
    # actions.sentaoe+=/rapid_fire,target_if=max:debuff.sentinels_mark.down,if=talent.unload,interrupt_if=talent.unload&ticks_remain<2&buff.precise_shots.up&!gcd.remains,interrupt_immediate=1,interrupt_global=1
    - rapid_fire,if=talent.unload
    # actions.sentaoe+=/rapid_fire,interrupt_if=talent.unload&ticks_remain<2&buff.precise_shots.up&!gcd.remains,interrupt_immediate=1,interrupt_global=1
    - rapid_fire
    # actions.sentaoe+=/aimed_shot,target_if=max:debuff.sentinels_mark.up,if=buff.trick_shots.remains>cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    # actions.sentaoe+=/moonlight_chakram
    - moonlight_chakram
    # actions.sentaoe+=/multishot,if=focus>cost+action.aimed_shot.cost&!max_prio_damage
    # max_prio_damage is a sim option defaulting TRUE, so !max_prio_damage is always 0 - line is dead.
    # - multishot,if=focus>action.multishot.cost+action.aimed_shot.cost
    # actions.sentaoe+=/steady_shot
    - steady_shot

  # ==========================================================================
  # Sentinel ST
  # ==========================================================================
  sentst:
    # actions.sentst+=/explosive_shot,target_if=min:dot.explosive_shot.remains,if=set_bonus.mid2_4pc&active_enemies>1&(!max_prio_damage|!fight_style.dungeonroute)&(!talent.tactical_reload|!buff.lock_and_load.up)
    # line is unreachable. Its (!max_prio_damage|!fight_style.dungeonroute) group is TRUE for us
    # (max_prio_damage=1, fight_style.*=0). The unconditional explosive_shot below covers it.
    # actions.sentst+=/explosive_shot,if=(!talent.tactical_reload|!buff.lock_and_load.up)&(!cooldown.rapid_fire.ready|buff.unstable_trigger.up|!fight_style.dungeonroute)
    - explosive_shot,if=!talent.tactical_reload|!buff.lock_and_load.up
    # actions.sentst+=/volley
    - volley
    # actions.sentst+=/trueshot,if=variable.trueshot_ready
    - trueshot,if=var.trueshot_ready
    # actions.sentst+=/moonlight_chakram,if=buff.moonlight_chakram.remains<5
    - moonlight_chakram,if=buff.moonlight_chakram.remains<5
    # actions.sentst+=/aimed_shot,if=debuff.sentinels_mark.react&buff.bulletstorm.up&active_enemies>1&fight_style.dungeonroute
    # Never fires: fight_style.* evaluates to 0 for us, so the whole condition is false.
    # - aimed_shot,if=debuff.sentinels_mark.react&enemies_around_target>1&buff.bulletstorm.up
    # actions.sentst+=/rapid_fire,target_if=max:debuff.sentinels_mark.down,if=!fight_style.dungeonroute
    # !fight_style.dungeonroute is TRUE for us, so the if= is dropped entirely
    - rapid_fire
    # actions.sentst+=/rapid_fire
    # Reduces to the same bare rapid_fire as the line above, which already covers it.
    # actions.sentst+=/kill_shot,target_if=max:debuff.sentinels_mark.down|max_prio_damage,if=buff.precise_shots.up
    - kill_shot,if=var.precise_shots_predicted
    # actions.sentst+=/multishot,target_if=max:debuff.sentinels_mark.down,if=buff.precise_shots.up&active_enemies>1&talent.aspect_of_the_hydra&(!fight_style.dungeonroute|!max_prio_damage|active_enemies>2)
    # (!fight_style.dungeonroute|!max_prio_damage|active_enemies>2) is TRUE for us (fight_style.*=0), so the group is dropped
    # and the gate is enemies>1 -- matching upstream's own note above the line: "Multi-Shot as a PS
    # spender on 2T with Hydra talented. In DRoute, do it on 3 or more targets."
    - multishot,if=var.precise_shots_predicted&enemies_around_target>1&talent.aspect_of_the_hydra
    # actions.sentst+=/arcane_shot,target_if=max:debuff.sentinels_mark.down|max_prio_damage,if=buff.precise_shots.up
    - arcane_shot,if=var.precise_shots_predicted
    # actions.sentst+=/aimed_shot,target_if=max:debuff.sentinels_mark.up
    - aimed_shot
    # actions.sentst+=/moonlight_chakram
    - moonlight_chakram
    # actions.sentst+=/steady_shot
    - steady_shot

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Summon Pet
    - call_pet_1,range_check=none,if=!pet.exists

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - counter_shot,if=interrupt.target.check
    - counter_shot.mouseover,if=interrupt.mouseover.check
    - counter_shot.focus,if=interrupt.focus.check
    # CC Interrupt (pet stun, fires when counter_shot is on CD)
    - intimidation,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Misdirection on tank at M+ pull start
    - misdirection,target=tank1,if=!player.inraid&combat.time<3

    # Target Check
    - return,if=auto_combat.target

    # retarget,target_if=max:target.health,line_cd=5,if=fight_style.dungeonroute
    # Not converted: retarget is sim-only (fight_style.dungeonroute).

    # auto_shot
    # Rule: auto-attack deleted.

    # Cooldowns
    - call_action_list,name=cds

    # Trinkets (actions.trinkets)
    # actions.trinkets=/use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_buff&this_trinket.cooldown.duration%%cooldown.trueshot.duration=0&(buff.trueshot.remains>14|this_trinket.is.algethar_puzzle_box&variable.trueshot_ready&cooldown.trueshot.remains<5)
    # actions.trinkets+=/use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_buff&other_trinket.has_use_buff&other_trinket.cooldown.duration%%cooldown.trueshot.duration=0&(buff.trueshot.remains>14&other_trinket.cooldown.remains|cooldown.trueshot.remains>20&other_trinket.cooldown.remains<=cooldown.trueshot.remains)
    # actions.trinkets+=/use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_buff&(buff.trueshot.remains>14|buff.trueshot.up&fight_remains<cooldown.trueshot.remains+15|fight_remains<21)
    # actions.trinkets+=/use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_damage&cooldown.trueshot.remains>20
    # this_trinket/other_trinket property math NOT supported; using generic sync
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # Dark Ranger AOE (3+ targets)
    # call_action_list,name=draoe,if=active_enemies>2&talent.trick_shots&hero_tree.dark_ranger
    - call_action_list,name=draoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.dark_ranger
    # Sentinel AOE (3+ targets)
    # call_action_list,name=sentaoe,if=active_enemies>2&talent.trick_shots&hero_tree.sentinel
    - call_action_list,name=sentaoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.sentinel
    # Dark Ranger ST
    # call_action_list,name=drst,if=hero_tree.dark_ranger
    - call_action_list,name=drst,if=hero_tree.dark_ranger
    # Sentinel ST
    # call_action_list,name=sentst,if=hero_tree.sentinel
    - call_action_list,name=sentst,if=hero_tree.sentinel
