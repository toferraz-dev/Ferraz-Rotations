# =============================================================================
# Hunter Marksmanship - Spec ID 254
# =============================================================================

version: 3
spec: 254
entry: main

config:
  exhilaration_hp_pct:
    section: "Defensive HP Percentage"
    label: "Exhilaration HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  survival_of_the_fittest_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival of the Fittest HP%"
    type: slider
    min: 0
    max: 100
    default: 50
  survival_of_the_fittest_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival of the Fittest (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # variable,name=trueshot_ready,value=!talent.bullseye|fight_remains>cooldown.trueshot.duration+10|buff.bullseye.stack=buff.bullseye.max_stack|fight_remains<25|time<10
  # buff.bullseye.max_stack NOT supported - hardcoded to 30; bare time -> combat.time
  trueshot_ready: "!talent.bullseye|fight_remains>cooldown.trueshot.duration+10|buff.bullseye.stack>=30|fight_remains<25|combat.time<10"
  # Predict precise_shots: already up, OR aimed_shot just cast and no arcane_shot sent since
  precise_shots_predicted: "buff.precise_shots.up|(lastcast.aimed_shot<0.5&lastcast.arcane_shot>lastcast.aimed_shot)"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - survival_of_the_fittest,range_check=none,if=incoming.pct>=config.survival_of_the_fittest_dmg_pct

    # --- HP Percentage: react when already low ---
    - exhilaration,range_check=none,if=health.pct<=config.exhilaration_hp_pct
    - survival_of_the_fittest,range_check=none,if=health.pct<=config.survival_of_the_fittest_hp_pct

  # ==========================================================================
  # Cooldowns
  # ==========================================================================
  cds:
    # Original: invoke_external_buff,name=power_infusion,if=buff.trueshot.remains>12|fight_remains<13
    # invoke_external_buff NOT supported

    # Original: berserking,if=buff.trueshot.up|fight_remains<13
    - berserking,if=buff.trueshot.up|fight_remains<13
    # Original: blood_fury,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - blood_fury,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    # Original: ancestral_call,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    - ancestral_call,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<16
    # Original: fireblood,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<9
    - fireblood,if=buff.trueshot.up|cooldown.trueshot.remains>30|fight_remains<9
    # Original: lights_judgment,if=buff.trueshot.down
    - lights_judgment,if=buff.trueshot.down
    # Original: potion,if=buff.trueshot.up&(buff.bloodlust.up|fight_remains<120-30*talent.calling_the_shots)|fight_remains<31
    # potion NOT supported

  # ==========================================================================
  # Dark Ranger AOE (3+ targets)
  # ==========================================================================
  draoe:
    # aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage,if=buff.trick_shots.remains>cast_time&full_recharge_time<gcd+cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time&cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    # black_arrow,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - black_arrow,if=var.precise_shots_predicted
    # multishot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    - multishot,if=var.precise_shots_predicted&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    # trueshot,if=!buff.double_tap.up&variable.trueshot_ready
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    # rapid_fire,if=buff.trick_shots.remains>execute_time&(buff.bulletstorm.remains<action.aimed_shot.execute_time|talent.unload)
    - rapid_fire,if=buff.trick_shots.remains>action.rapid_fire.execute_time&(buff.bulletstorm.remains<action.aimed_shot.execute_time|talent.unload)
    # wailing_arrow,if=!cooldown.black_arrow.ready
    - wailing_arrow,if=!cooldown.black_arrow.ready
    # volley,if=!buff.double_tap.up
    - volley,if=!buff.double_tap.up
    # aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage,if=buff.trick_shots.remains>cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    # multishot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - multishot,if=var.precise_shots_predicted
    # explosive_shot
    - explosive_shot
    # steady_shot
    - steady_shot

  # ==========================================================================
  # Dark Ranger ST
  # ==========================================================================
  drst:
    # black_arrow,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - black_arrow,if=var.precise_shots_predicted
    # aimed_shot,if=buff.trueshot.up&buff.precise_shots.down&cooldown.black_arrow.ready|full_recharge_time<gcd+cast_time
    - aimed_shot,if=buff.trueshot.up&buff.precise_shots.down&cooldown.black_arrow.ready|cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    # trueshot,if=!buff.double_tap.up&variable.trueshot_ready
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    # rapid_fire
    - rapid_fire
    # wailing_arrow,if=!cooldown.black_arrow.ready
    - wailing_arrow,if=!cooldown.black_arrow.ready
    # arcane_shot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up
    - arcane_shot,if=var.precise_shots_predicted
    # volley,if=!buff.double_tap.up
    - volley,if=!buff.double_tap.up
    # aimed_shot,target_if=max:debuff.spotters_mark.up|max_prio_damage
    - aimed_shot
    # explosive_shot
    - explosive_shot
    # steady_shot
    - steady_shot

  # ==========================================================================
  # Sentinel AOE (3+ targets)
  # ==========================================================================
  sentaoe:
    # multishot,target_if=max:debuff.sentinels_mark.down|action.aimed_shot.in_flight_to_target,if=buff.precise_shots.up&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    - multishot,if=var.precise_shots_predicted&!talent.aspect_of_the_hydra&!prev_gcd.1.multishot|buff.trick_shots.down
    # rapid_fire,if=(buff.bulletstorm.remains<action.aimed_shot.execute_time|buff.bulletstorm.stack<18|talent.unload&target.health.pct<20)
    - rapid_fire,if=buff.bulletstorm.remains<action.aimed_shot.execute_time|buff.bulletstorm.stack<18|talent.unload&target.health.pct<20
    # trueshot,if=!buff.double_tap.up&variable.trueshot_ready
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    # volley,if=!buff.double_tap.up
    - volley,if=!buff.double_tap.up
    # explosive_shot,if=talent.shrapnel_shot&buff.trueshot.down&buff.lock_and_load.down&cooldown.aimed_shot.charges_fractional<=1.1
    - explosive_shot,if=talent.shrapnel_shot&buff.trueshot.down&buff.lock_and_load.down&cooldown.aimed_shot.charges_fractional<=1.1
    # aimed_shot,target_if=max:debuff.sentinels_mark.up|max_prio_damage,if=buff.trick_shots.remains>cast_time
    - aimed_shot,if=buff.trick_shots.remains>action.aimed_shot.cast_time
    # moonlight_chakram
    - moonlight_chakram
    # rapid_fire,if=buff.trick_shots.remains>execute_time
    - rapid_fire,if=buff.trick_shots.remains>action.rapid_fire.execute_time
    # multishot,target_if=max:debuff.spotters_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up&talent.windrunner_quiver
    - multishot,if=var.precise_shots_predicted&talent.windrunner_quiver
    # explosive_shot
    - explosive_shot
    # steady_shot
    - steady_shot

  # ==========================================================================
  # Sentinel ST
  # ==========================================================================
  sentst:
    # volley,if=!buff.double_tap.up
    - volley,if=!buff.double_tap.up
    # trueshot,if=!buff.double_tap.up&variable.trueshot_ready
    - trueshot,if=!buff.double_tap.up&var.trueshot_ready
    # rapid_fire,if=buff.bulletstorm.stack<18
    - rapid_fire,if=buff.bulletstorm.stack<18
    # aimed_shot,target_if=max:debuff.sentinels_mark.up|max_prio_damage,if=full_recharge_time<gcd+cast_time
    - aimed_shot,if=cooldown.aimed_shot.full_recharge_time<gcd+action.aimed_shot.cast_time
    # arcane_shot,target_if=max:debuff.sentinels_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up&(buff.trueshot.up&prev_gcd.1.aimed_shot|!buff.trueshot.up)
    - arcane_shot,if=var.precise_shots_predicted&(buff.trueshot.up&prev_gcd.1.aimed_shot|!buff.trueshot.up)
    # rapid_fire,if=(buff.bulletstorm.remains<action.aimed_shot.execute_time|talent.unload&target.health.pct<20)
    - rapid_fire,if=buff.bulletstorm.remains<action.aimed_shot.execute_time|talent.unload&target.health.pct<20
    # kill_shot,target_if=max:debuff.sentinels_mark.down|action.aimed_shot.in_flight_to_target|max_prio_damage,if=buff.precise_shots.up&active_enemies=1
    - kill_shot,if=var.precise_shots_predicted&enemies_around_target=1
    # moonlight_chakram,if=buff.trueshot.remains<execute_time+gcd
    - moonlight_chakram,if=buff.trueshot.remains<action.moonlight_chakram.execute_time+gcd
    # aimed_shot,target_if=max:debuff.sentinels_mark.up|max_prio_damage
    - aimed_shot
    # moonlight_chakram
    - moonlight_chakram
    # rapid_fire
    - rapid_fire
    # explosive_shot
    - explosive_shot
    # steady_shot
    - steady_shot

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Summon Pet
    - call_pet_1,range_check=none,if=!pet.exists

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - counter_shot,if=interrupt.target.check
    - counter_shot.mouseover,if=interrupt.mouseover.check
    - counter_shot.focus,if=interrupt.focus.check
    # CC Interrupt (pet stun, fires when counter_shot is on CD)
    - intimidation,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Misdirection on tank at M+ pull start
    - misdirection,target=tank1,if=!player.inraid&combat.time<3

    # Target Check
    - return,if=auto_combat.target

    # Original: auto_shot → DELETED

    # Cooldowns
    - call_action_list,name=cds

    # Trinkets
    # Original: use_items,slots=trinket1:trinket2,if=(cooldown.trueshot.remains<2|!this_trinket.has_use_buff|buff.trueshot.up|cooldown.trueshot.remains>45)&!this_trinket.is.algethar_puzzle_box
    # this_trinket.has_use_buff, this_trinket.is NOT supported; using standard sync
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync
    # Original: use_item,name=algethar_puzzle_box,if=!buff.double_tap.up&variable.trueshot_ready&cooldown.trueshot.remains<5
    # Specific trinket item NOT supported; commented out

    # Dark Ranger AOE (3+ targets)
    # Original: call_action_list,name=draoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.dark_ranger
    - call_action_list,name=draoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.dark_ranger
    # Sentinel AOE (3+ targets)
    # Original: call_action_list,name=sentaoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.sentinel
    - call_action_list,name=sentaoe,if=enemies_around_target>2&talent.trick_shots&hero_tree.sentinel
    # Dark Ranger ST
    # Original: call_action_list,name=drst,if=hero_tree.dark_ranger
    - call_action_list,name=drst,if=hero_tree.dark_ranger
    # Sentinel ST
    # Original: call_action_list,name=sentst,if=hero_tree.sentinel
    - call_action_list,name=sentst,if=hero_tree.sentinel
