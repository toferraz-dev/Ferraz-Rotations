# =============================================================================
# Monk Mistweaver - Spec ID 270
# Supports:
#   - Raid: Yu'lon / Conduit of the Celestials build (standard)
#   - Raid: Chi-Ji build (Jadefire Teachings fistweave; Jade Empowerment/CJL cycle)
#   - M+:   Fistweave / Chi-Ji (Ancient Teachings passive healing)
#   - Master of Harmony hero tree (all contexts — Vitality accumulate → spend cycle)
#
# Build auto-detection (no config toggle needed):
#   Yu'lon raid       → talent.invoke_yulon_the_jade_serpent
#   Chi-Ji build      → talent.invoke_chiji_the_red_crane  (dungeon AND raid)
#   Master of Harmony → talent.aspect_of_harmony (hero_tree.master_of_harmony)
#   Sheilun's Gift    → talent.sheiluns_gift (Shado-Pan or MoH builds)
# =============================================================================
# 450521 Harmony Collect (Brewmaster and Mistweaver)
# 450769 Harmony Buff after using thunder focus tea (Mistweaver)
# 450711 Harmonny Buff (Brewmaster)

# ICON
# small: 5041801
# medium: 5041800
# large: 5041790

version: 3
spec: 270
entry: main

config:
  fortifying_brew_hp_pct:
    section: "Defensive HP Percentage"
    label: "Fortifying Brew HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  fortifying_brew_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Fortifying Brew (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  life_cocoon_hp_pct:
    label: "Life Cocoon HP%"
    type: slider
    min: 0
    max: 100
    default: 35

  life_cocoon_target:
    label: "Life Cocoon Target"
    type: dropdown
    options:
      - label: "Tank"
        value: 1
      - label: "Healer"
        value: 2
      - label: "Everyone"
        value: 3
    default: 2

  enveloping_mist_hp_pct:
    label: "Enveloping Mist HP%"
    type: slider
    min: 0
    max: 100
    default: 80

  vivify_hp_pct:
    label: "Vivify HP%"
    type: slider
    min: 0
    max: 100
    default: 85

  celestial_conduit_hp_pct:
    label: "Celestial Conduit HP%"
    type: slider
    min: 0
    max: 100
    default: 90

  celestial_conduit_members:
    label: "Celestial Conduit - Min Members"
    type: slider
    min: 1
    max: 5
    default: 2

  invoke_celestial_hp_pct:
    label: "Invoke Celestial HP%"
    type: slider
    min: 0
    max: 100
    default: 90

  invoke_celestial_members:
    label: "Invoke Celestial - Min Members"
    type: slider
    min: 1
    max: 5
    default: 2

  revival_hp_pct:
    label: "Revival HP%"
    type: slider
    min: 25
    max: 99
    default: 45

  revival_members:
    label: "Revival - Min Members"
    type: slider
    min: 1
    max: 5
    default: 2

  mana_tea_interrupt_hp_pct:
    label: "Mana Tea - Interrupt HP%"
    type: slider
    min: 50
    max: 100
    default: 90

  use_mouseover:
    label: "MO Healing (Emergency)"
    type: checkbox
    default: true

  mouseover_emergency_hp:
    label: "MO Emergency HP %"
    type: slider
    min: 10
    max: 99
    default: 65

  renewing_mist_spread:
    type: toggle
    label: "Renewing Mist Spread"
    spell: 119611
    description: "Spread Renewing Mist on all allies"

  dps_enabled:
    label: "DPS / Fistweave"
    type: checkbox
    default: true

variables:
  # Group size: <=5 = dungeon/M+, >5 = raid
  # player.inmythicplus is an explicit fallback to ensure M+ is always detected as dungeon
  # even if group count is unreliable (e.g. transition, loading)
  is_dungeon: "player.inmythicplus|(group.count(cycle.health.pct<=100)<=5)"
  # Group is healthy when fewer than 2 members are below 70% effective HP
  # Guide: "2 injured players — you may still get away with DPS depending on how intense the damage is"
  # 80% was too aggressive; chip damage at 75-85% is normal in M+ and Ancient Teachings handles it
  group_healthy: "group.count(cycle.health.effective.pct<70)<2"
  # Mouseover target is a valid friendly unit in range
  mo_friendly_valid: "mouseover.exists&mouseover.alive&mouseover.friendly"
  # Fistweaving allowed: DPS enabled and in combat.
  # NOTE: In M+ fistweaving IS the primary healing (Ancient Teachings + Gust of Mists),
  # so it must keep running even when the group is injured — gating it behind
  # group_healthy creates a death spiral (drops → stop fistweave → AT dies → group drops more).
  # The var.group_healthy gate is kept available via the `group_healthy` var for callers
  # that specifically want a "raid is topped" check.
  can_fistweave: "config.dps_enabled&player.combat"
  # Master of Harmony hero tree active
  is_moh: "talent.aspect_of_harmony"
  # Aspect of Harmony: currently in the Vitality spend phase (10-second window)
  moh_spending: "buff.450711.up"
  # Aspect of Harmony: TFT-empowered Harmony buff (next healing spell gets bonus interaction)
  # Spawned after Thunder Focus Tea is consumed in MoH builds
  moh_tft_buff: "buff.450769.up"

lists:
  # ==========================================================================
  # Defensives
  # ==========================================================================
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - fortifying_brew,range_check=none,if=incoming.pct>=config.fortifying_brew_dmg_pct

    # --- HP Percentage: react when already low ---
    - fortifying_brew,range_check=none,if=health.pct<=config.fortifying_brew_hp_pct
    - life_cocoon,use_off_gcd=0,cycle=tanks,if=config.life_cocoon_target=1&cycle.health.effective.pct<=config.life_cocoon_hp_pct
    - life_cocoon,use_off_gcd=0,cycle=healers,if=config.life_cocoon_target=2&cycle.health.effective.pct<=config.life_cocoon_hp_pct
    - life_cocoon,use_off_gcd=0,cycle=members,if=config.life_cocoon_target>=3&cycle.health.effective.pct<=config.life_cocoon_hp_pct

  # ==========================================================================
  # Major Cooldowns
  # ==========================================================================
  cooldowns:
    # Revival - emergency raid/group heal + mass dispel
    - revival,range_check=none,if=group.count(cycle.health.effective.pct<config.revival_hp_pct)>=config.revival_members

    # Thunder Focus Tea
    # Yu'lon / standard builds: use proactively whenever not active (guide priority #5)
    # Chi-Ji builds: hold for Chi-Ji pre-ramp
    #   >20s on Chi-Ji CD: spend TFT freely during downtime, regenerates before next window
    #   <5s on Chi-Ji CD: pre-ramp TFT so it's active when Chi-Ji is summoned
    # MoH M+ priority for TFT: EnvM > RSK > Expel Harm > RM > Vivify
    #   (TFT fires here; the healing list's ordering ensures EnvM fires while TFT is active)
    - thunder_focus_tea,range_check=none,if=!buff.thunder_focus_tea.up&(talent.invoke_yulon_the_jade_serpent|cooldown.invoke_chiji_the_red_crane.remains>20|cooldown.invoke_chiji_the_red_crane.remains<5)

    # Celestial Conduit - major throughput CD (Conduit/MoH builds)
    # Synergizes with MoH Vitality spend window for double burst
    - celestial_conduit,range_check=none,if=talent.celestial_conduit&group.count(cycle.health.effective.pct<config.celestial_conduit_hp_pct)>=config.celestial_conduit_members

    # Invoke Yu'lon the Jade Serpent - standard raid build
    - invoke_yulon_the_jade_serpent,range_check=none,if=talent.invoke_yulon_the_jade_serpent&group.count(cycle.health.effective.pct<config.invoke_celestial_hp_pct)>=config.invoke_celestial_members

    # Invoke Chi-Ji the Red Crane - dungeon: press on cooldown (top parsers: 13-25 invokes/run).
    # NO HP gate: in M+ Ancient Teachings keeps the group topped between pulls, so a
    # "somebody is hurt" guard drifts the cast off CD and often prevents it from ever firing.
    # Top parsers invoke Chi-Ji proactively at pull start, not reactively.
    - invoke_chiji_the_red_crane,range_check=none,if=talent.invoke_chiji_the_red_crane&var.is_dungeon
    # Invoke Chi-Ji the Red Crane - raid: pre-ramp with Teachings stacks for full burst value
    - invoke_chiji_the_red_crane,range_check=none,if=talent.invoke_chiji_the_red_crane&!var.is_dungeon&group.count(cycle.health.effective.pct<config.invoke_celestial_hp_pct)>=config.invoke_celestial_members&buff.teachings_of_the_monastery.stack>=4

  # ==========================================================================
  # MoH TFT-Harmony Consume — Aspect of Harmony TFT-empowered buff (450769)
  # Spawned after Thunder Focus Tea is consumed in MoH builds. The next healing
  # spell gets bonus Vitality interaction, so we want to fire one of the high-
  # value priority spells immediately to consume it for maximum value.
  # MoH M+ TFT priority: EnvM > RSK > Expel Harm > RM > Vivify
  # Fires only when var.is_moh and var.moh_tft_buff are both true; bypasses
  # normal HP thresholds since the goal is to consume the buff before it expires.
  # ==========================================================================
  moh_tft_consume:
    # Emergency — never let someone die just to consume a buff
    - vivify,cycle=members,if=cycle.health.effective.pct<30
    # EnvM — top TFT priority; prefer targets without an existing EnvM HoT
    - enveloping_mist,cycle=members,if=!pred.cycle.buff.enveloping_mist.up&!player.moving
    # RSK — second priority; off cooldown
    - rising_sun_kick,if=target.exists
    # Expel Harm — self heal that still benefits from the buff
    - expel_harm,if=health.pct<95
    # RM — fourth priority; prefer targets without an existing RM HoT
    - renewing_mist,cycle=members,if=!pred.cycle.buff.renewing_mist.up
    # Vivify — final fallback to guarantee the buff is consumed
    - vivify,cycle=members,if=!player.moving

  # ==========================================================================
  # MoH Spend Window — Aspect of Harmony Vitality Spend Phase (10 seconds)
  # During this phase healing spells release accumulated Vitality as bonus heals.
  # Goal: maximize healing throughput to spend the pool efficiently.
  # Fires in ALL contexts (dungeon and raid) when moh_spending is true.
  # Guide: Purified Spirit distributes leftover Vitality as HoT across raid.
  # ==========================================================================
  moh_spend_window:
    # Emergency — always prioritize critically low targets
    - vivify,cycle=members,if=cycle.health.effective.pct<30
    # TFT → EnvM: guide's top MoH M+ priority during spend window (instant heal + HoT)
    # TFT already fires from cooldowns; if active, EnvM here consumes it with full value
    - enveloping_mist,cycle=members,if=cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # RSK — Gust of Mists heals count toward Vitality spend; also second TFT priority
    - rising_sun_kick,if=target.exists
    # Chi Burst — uncapped AoE, reaches all 20 raid members; efficient Vitality dump in raid
    # Also excellent in M+ for group-wide heals during spend window
    - chi_burst,range_check=none,if=talent.chi_burst&group.count(cycle.health.effective.pct<95)>=2
    # Clarity of Purpose (MoH): at 10 stacks, Vivify fills Vitality pool at maximum rate
    # NOTE: verify buff name "clarity_of_purpose" in SpellDB if not triggering
    - vivify,cycle=members,if=talent.aspect_of_harmony&buff.clarity_of_purpose.stack>=10&!player.moving
    # Vivify spam — primary Vitality-spending vehicle; cast on anyone below threshold
    - vivify,cycle=members,if=cycle.health.effective.pct<config.vivify_hp_pct&!player.moving
    # Renewing Mist — dump extra charges to spread HoTs (each RM contributes to Vitality output)
    - renewing_mist,cycle=members,if=cooldown.renewing_mist.charges>=2&cycle.health.effective.pct<95

  # ==========================================================================
  # Healing — Raid Yu'lon / Conduit of the Celestials build (standard)
  # Guide priority: Emergency → RM cap → RM maint → RSK → TFT → EnvM (proc) → RM → Vivify → Tiger Palm
  # WCL: Vivify + Enveloping Mist + Renewing Mist heavy; 63 RSK casts per fight
  # ==========================================================================
  healing_raid:
    # EMERGENCY: Vivify on immediately-dying target (guide priority #1)
    - vivify,cycle=members,if=cycle.health.effective.pct<30
    # Renewing Mist spread toggle — keep RM rolling on all allies
    - renewing_mist,cycle=members,if=config.renewing_mist_spread&cycle.buff.renewing_mist.remains<2
    # Renewing Mist — charge cap prevention (guide: "3 charges, 2 without Pool of Mists")
    - renewing_mist,cycle=members,if=cooldown.renewing_mist.charges>=3&cycle.health.effective.pct<95
    # Renewing Mist maintenance — spread broadly for Vivify cleave and Rising Mist extension
    - renewing_mist,cycle=members,if=cycle.buff.renewing_mist.remains<2&cycle.health.effective.pct<95
    # Vivacious Vivification proc — instant free Vivify (always consume immediately)
    - vivify,cycle=members,if=buff.vivacious_vivification.up&cycle.health.effective.pct<config.vivify_hp_pct
    # Rising Sun Kick — highest priority; extends ReM/EnvM via Rising Mist; "press off cooldown"
    - rising_sun_kick,if=target.exists
    # Enveloping Mist with Strength of the Black Ox proc (instant cast; guide priority #6)
    # NOTE: verify buff name "strength_of_the_black_ox" matches in-game SpellDB
    - enveloping_mist,cycle=members,if=buff.strength_of_the_black_ox.up&!player.moving
    # Soothing Mist — pre-channel to enable instant EnvM on multiple injured targets
    - soothing_mist,cycle=members,if=!player.channeling&!player.moving&group.count(cycle.health.effective.pct<config.enveloping_mist_hp_pct&!pred.cycle.buff.enveloping_mist.up)>=2&cycle.health.effective.pct<config.enveloping_mist_hp_pct
    # Enveloping Mist on low HP target (guide: prioritize over Vivify during Yu'lon due to 4-set)
    - enveloping_mist,cycle=members,if=cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # Instant Vivify during Soothing Mist channel — no cast time cost; broaden threshold since it's free
    - vivify,cycle=members,casting_check=soothing_mist,if=cycle.health.effective.pct<config.vivify_hp_pct
    # Chi Burst — uncapped AoE; MoH: hits all 20 raid members for maximum AoH spreading
    # Skip if RSK is available ("don't cast it over a Rushing Wind Kick")
    - chi_burst,range_check=none,if=talent.chi_burst&!cooldown.rising_sun_kick.ready&group.count(cycle.health.effective.pct<95)>=3
    # Clarity of Purpose (MoH): 10 stacks → Vivify fills Vitality pool at maximum rate
    # Cast even when group is relatively healthy to fuel Aspect of Harmony
    - vivify,cycle=members,if=talent.aspect_of_harmony&buff.clarity_of_purpose.stack>=10&!player.moving
    # Expel Harm — significant self-heal + damage; fires while moving
    - expel_harm,if=health.pct<80
    # Vivify — main filler (cleaves to all RM targets); 4-set: prefer EnvM during Yu'lon
    - vivify,cycle=members,if=cycle.health.effective.pct<config.vivify_hp_pct&!player.moving
    # Sheilun's Gift — high stacks: proactive; low stacks: only when low HP
    # cooldown.sheiluns_gift.cast_count tracks Sheilun's Cloud stacks (GetSpellCastCount)
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cycle.health.effective.pct<config.vivify_hp_pct&cooldown.sheiluns_gift.cast_count>=4&!player.moving
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cycle.health.effective.pct<config.enveloping_mist_hp_pct&!player.moving

  # ==========================================================================
  # Healing — Raid Chi-Ji build (Jadefire Teachings fistweave)
  # Core healing cycle OUTSIDE Chi-Ji window: Jadefire Stomp → Jade Empowerment → CJL
  # Core healing cycle DURING Chi-Ji window: RSK → Blackout Kick (8-13/min)
  # TFT priority: RM (for haste buff during Chi-Ji) OR RSK outside window
  # EnvM: skip if mastery is high; only during damage lulls or with Enveloping Breath stacks
  # RM: avoid during Chi-Ji window (consumes a GCD that BOK/RSK should occupy)
  # NOTE: buff.jade_empowerment from Jadefire Stomp; buff.enveloping_breath from Chi-Ji
  #       Verify these buff names against in-game SpellDB if conditions don't fire
  # ==========================================================================
  healing_raid_chiji:
    # EMERGENCY: Vivify on immediately-dying target
    - vivify,cycle=members,if=cycle.health.effective.pct<30
    # Jadefire Stomp — cast frequently: maintains Awakened Jadefire buff, resets its own CD
    # Generates Jade Empowerment charges for Crackling Jade Lightning healing
    - jadefire_stomp,range_check=none,if=talent.jadefire_stomp
    # Crackling Jade Lightning — primary healing OUTSIDE Chi-Ji window (Jadefire Teachings)
    # Expends Jade Empowerment buff from Jadefire Stomp; avoid overcapping charges
    # Channel: stop_casting in main handles emergency breaks
    # NOTE: verify "jade_empowerment" buff name vs actual in-game name
    - crackling_jade_lightning,range_check=none,if=talent.jadefire_teachings&buff.jade_empowerment.up&!player.moving
    # Renewing Mist spread toggle — keep RM rolling on all allies
    - renewing_mist,cycle=members,if=config.renewing_mist_spread&cycle.buff.renewing_mist.remains<2
    # Renewing Mist maintenance — Chi-Ji visits RM targets for Enveloping Breath
    # Guide: avoid RM during Chi-Ji window; fires naturally when RSK/BOK are on CD
    - renewing_mist,cycle=members,if=cooldown.renewing_mist.charges>=3&cycle.health.effective.pct<95
    - renewing_mist,cycle=members,if=cycle.buff.renewing_mist.remains<2&cycle.health.effective.pct<95
    # Vivacious Vivification proc
    - vivify,cycle=members,if=buff.vivacious_vivification.up&cycle.health.effective.pct<config.vivify_hp_pct
    # Rising Sun Kick — very high priority; Gust of Mists amplified by Chi-Ji
    # TFT + RSK outside Chi-Ji window = secondary combo
    - rising_sun_kick,if=target.exists
    # Blackout Kick — dominant during Chi-Ji window (8-13 casts/min)
    # Generates 6+ Gust of Mists heals each via Chi-Ji; skip when raid health is topped
    - blackout_kick,if=group.count(cycle.health.effective.pct<95)>=1
    # Enveloping Mist — consume Enveloping Breath stacks from Chi-Ji (free/cheap casts)
    - enveloping_mist,cycle=members,if=buff.enveloping_breath.stack>=1&cycle.health.effective.pct<config.enveloping_mist_hp_pct&!player.moving
    # Enveloping Mist with Strength of the Black Ox proc (instant)
    - enveloping_mist,cycle=members,if=buff.strength_of_the_black_ox.up&!player.moving
    # Enveloping Mist on critically low targets (damage lulls only; guide deprioritizes in Chi-Ji)
    - enveloping_mist,cycle=members,if=cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # Instant Vivify during Soothing Mist channel — no cast time cost; broaden threshold since it's free
    - vivify,cycle=members,casting_check=soothing_mist,if=cycle.health.effective.pct<config.vivify_hp_pct
    # Soothing Mist + EnvM chain for multiple injured
    - soothing_mist,cycle=members,if=!player.channeling&!player.moving&group.count(cycle.health.effective.pct<config.enveloping_mist_hp_pct&!pred.cycle.buff.enveloping_mist.up)>=2&cycle.health.effective.pct<config.enveloping_mist_hp_pct
    # Chi Burst — free AoE filler; skip if RSK is available
    - chi_burst,range_check=none,if=talent.chi_burst&!cooldown.rising_sun_kick.ready&group.count(cycle.health.effective.pct<95)>=3
    # Expel Harm
    - expel_harm,if=health.pct<80
    # Vivify filler
    - vivify,cycle=members,if=cycle.health.effective.pct<config.vivify_hp_pct&!player.moving
    # Sheilun's Gift — high stacks: proactive; low stacks: only when low HP
    # cooldown.sheiluns_gift.cast_count tracks Sheilun's Cloud stacks (GetSpellCastCount)
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cycle.health.effective.pct<config.vivify_hp_pct&cooldown.sheiluns_gift.cast_count>=4&!player.moving
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cycle.health.effective.pct<config.enveloping_mist_hp_pct&!player.moving

  # ==========================================================================
  # Healing — Dungeon Fistweave / Chi-Ji
  # Philosophy: Ancient Teachings passive healing carries group health.
  # Active healing: Sheilun's Gift is the primary filler (replaces Vivify).
  # Vivify only fires when Sheilun's Gift talent is absent.
  # Top M+ parsers: SCK 335-527, RSK 238-360, SG 124-223 casts per run.
  # ==========================================================================
  healing_dungeon:
    # EMERGENCY: Vivify on immediately-dying target
    - vivify,cycle=members,if=cycle.health.effective.pct<30
    # Touch of Death — execute damage fuels Ancient Teachings heals; fires regardless of group state
    - touch_of_death
    # Rising Sun Kick — #1 M+ heal (Gust of Mists smart-heals injured ally).
    # MUST live in the healing list, not dps_dungeon, so it still fires when the group is injured.
    - rising_sun_kick,if=target.exists
    # Emergency — Enveloping Breath stacks from Chi-Ji (instant/free cast)
    - enveloping_mist,cycle=members,if=buff.enveloping_breath.stack>=1&cycle.health.effective.pct<config.enveloping_mist_hp_pct&!player.moving&pred.cycle.buff.enveloping_mist.remains<1
    # Instant EnvM via Strength of the Black Ox proc
    - enveloping_mist,cycle=members,if=buff.strength_of_the_black_ox.up&!player.moving&pred.cycle.buff.enveloping_mist.remains<1
    # Proactive EnvM ramp — guide: "2-3 Enveloping Mist on squishiest players before big damage"
    # Spread EnvM when 2+ targets are moderately low and unprotected
    - enveloping_mist,cycle=members,if=group.count(cycle.health.effective.pct<config.enveloping_mist_hp_pct)>=2&cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # Sheilun's Gift — primary healing filler; Sheilun's Cloud stacks build passively
    # Proactive at 4+ stacks when group has active damage; reactive when target is low
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cooldown.sheiluns_gift.cast_count>=4&group.count(cycle.health.effective.pct<config.vivify_hp_pct)>=1&!player.moving
    - sheiluns_gift,cycle=members,if=talent.sheiluns_gift&cycle.health.effective.pct<config.enveloping_mist_hp_pct&!player.moving
    # Enveloping Mist hard cast — target is low and has no EnvM HoT
    - enveloping_mist,cycle=members,if=cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # Renewing Mist spread toggle — keep RM rolling on all allies
    - renewing_mist,cycle=members,if=config.renewing_mist_spread&cycle.buff.renewing_mist.remains<2
    # Renewing Mist — maintenance: refresh expiring HoTs when 2+ charges available
    - renewing_mist,cycle=members,if=cooldown.renewing_mist.charges>=2&cycle.buff.renewing_mist.remains<2&cycle.health.effective.pct<90
    # Renewing Mist — charge-cap prevention (Chi-Ji visits RM targets)
    # Top parsers: ~32-65 casts per run
    - renewing_mist,cycle=members,if=cooldown.renewing_mist.charges>=3&cycle.health.effective.pct<95
    # Jadefire Stomp — Jadefire builds only
    - jadefire_stomp,range_check=none,if=talent.jadefire_stomp
    # Crackling Jade Lightning — Jadefire Teachings builds only
    - crackling_jade_lightning,range_check=none,if=talent.jadefire_teachings&buff.jade_empowerment.up&!player.moving
    # Expel Harm — significant self-heal + damage; fires while moving (guide defensive/utility)
    - expel_harm,if=health.pct<80
    # Tiger Palm / Blackout Kick — maintain Ancient Teachings stacks ONLY when not fistweaving.
    # When can_fistweave=true, dps_dungeon handles these in the correct priority order (after RSK/SCK).
    # When can_fistweave=false (group injured or DPS disabled), these fire here to keep AT stacks up
    # so Chi-Ji and Blackout Kick still produce passive healing even in full-healing mode.
    - tiger_palm,if=!var.can_fistweave&buff.teachings_of_the_monastery.stack<3
    - blackout_kick,if=!var.can_fistweave&buff.teachings_of_the_monastery.stack>=3
    # Vivify — only without Sheilun's Gift talent (SG replaces it as primary filler in M+)
    # VV (Vivacious Vivification) procs from RSK make next Vivify instant — consumed here on non-SG builds.
    # SG builds intentionally skip Vivify entirely; top parsers accept wasted VV procs as correct tradeoff.
    - vivify,cycle=members,if=!talent.sheiluns_gift&buff.vivacious_vivification.up&cycle.health.effective.pct<config.vivify_hp_pct
    - vivify,cycle=members,if=!talent.sheiluns_gift&cycle.health.effective.pct<config.vivify_hp_pct&!player.moving

  # ==========================================================================
  # DPS — Dungeon Fistweaving
  # Ancient Teachings: TP/BOK/RSK damage heals a nearby injured ally
  # Gust of Mists: RSK triggers smart heal on injured ally
  # Top M+ parsers: ToD top priority, RSK off CD, SCK ~335-527 (2+ enemies), BOK, TP filler
  # ==========================================================================
  dps_dungeon:
    # Touch of Death — execute; highest priority when available
    - touch_of_death
    - rising_sun_kick
    # 4+ enemies: SCK dominant over TP — Awakened Jadefire + Ancient Teachings AoE spread
    - spinning_crane_kick,if=enemies.8y>=4
    # Chi-Ji active window (full 25s duration): SCK priority on 2+ enemies for Gust of Mists
    - spinning_crane_kick,if=lastcast.invoke_chiji_the_red_crane<=25&enemies.8y>=2
    - tiger_palm,if=buff.teachings_of_the_monastery.stack<3
    - spinning_crane_kick,if=enemies.8y>=2
    - blackout_kick
    - tiger_palm

  # ==========================================================================
  # DPS — Raid (light DPS filler when group is healthy)
  # Ancient Teachings passive healing + Gust of Mists from RSK
  # Chi-Ji build: RSK and BOK are already in healing_raid_chiji; Tiger Palm builds stacks
  # MoH: Jadefire Stomp and SCK fill Vitality accumulator between healing windows
  # ==========================================================================
  dps_raid:
    # Touch of Death
    - touch_of_death
    # Rising Sun Kick — already fired in healing list; fires here when group is healthy
    - rising_sun_kick
    # Tiger Palm — builds Teachings of the Monastery stacks; guide filler #9
    - tiger_palm,if=buff.teachings_of_the_monastery.stack<3
    # Blackout Kick — consume stacks for Ancient Teachings healing
    - blackout_kick

  # ==========================================================================
  # Out of Combat Healing
  # ==========================================================================
  out_of_combat:
    # Renewing Mist spread toggle — keep RM rolling on all allies
    - renewing_mist,cycle=members,if=config.renewing_mist_spread&cycle.buff.renewing_mist.remains<2
    - vivify,cycle=members,if=buff.vivacious_vivification.up&cycle.health.effective.pct<config.vivify_hp_pct
    - vivify,cycle=members,if=cycle.health.effective.pct<config.vivify_hp_pct&!player.moving
    - enveloping_mist,cycle=members,if=cycle.health.effective.pct<config.enveloping_mist_hp_pct&pred.cycle.buff.enveloping_mist.remains<2&!player.moving
    # Regenerate mana when not in combat — only if mana <90% and nobody needs healing
    - mana_tea,range_check=none,if=mana.pct<90&group.count(cycle.health.effective.pct<config.mana_tea_interrupt_hp_pct)=0

  # ==========================================================================
  # Mouseover Emergency Healing (focus_mouseover targeting)
  # When hovering over a friendly unit below the configured HP threshold,
  # fire the biggest heals available directly on that target.
  # Uses .focus_mouseover: targets mouseover unit, falls back to focus.
  # ==========================================================================
  mouseover_healing_emergency:
    # Life Cocoon — instant massive absorb shield; only on critically low targets
    # - life_cocoon.focus_mouseover,interrupt=true,range_check=mouseover,if=config.use_mouseover&mouseover.health.effective.pct<=config.life_cocoon_hp_pct
    # Sheilun's Gift — big direct heal at high stacks
    - sheiluns_gift.focus_mouseover,interrupt=true,range_check=mouseover,if=config.use_mouseover&mouseover.health.effective.pct<=config.mouseover_emergency_hp&talent.sheiluns_gift&cooldown.sheiluns_gift.cast_count>=4
    # Enveloping Mist — big HoT + healing received bonus; refresh if expiring
    - enveloping_mist.focus_mouseover,interrupt=true,range_check=mouseover,if=config.use_mouseover&mouseover.health.effective.pct<=config.mouseover_emergency_hp&mouseover.buff.remains(enveloping_mist)<2
    # Vivify — direct heal + cleave to RM targets
    - vivify.focus_mouseover,interrupt=true,range_check=mouseover,if=config.use_mouseover&mouseover.health.effective.pct<=config.mouseover_emergency_hp
    # Renewing Mist — instant HoT if nothing else is castable (moving)
    - renewing_mist.focus_mouseover,interrupt=true,range_check=mouseover,if=config.use_mouseover&mouseover.health.effective.pct<=config.mouseover_emergency_hp&mouseover.buff.remains(renewing_mist)<2

  # ==========================================================================
  # Main
  # ==========================================================================
  main:
    # - enveloping_mist,cycle=members,if=pred.cycle.buff.enveloping_mist.remains<2
    # Keep Mana Tea channel only while everyone is above the configured interrupt threshold
    # player.channeling.SPELL_NAME is unsupported — use player.channeling&player.casting.spell_id=ID
    # Mana Tea=197908, Soothing Mist=115175, Crackling Jade Lightning=117952
    - return,interrupt=true,if=player.channeling&player.casting.spell_id=197908&group.count(cycle.health.effective.pct<config.mana_tea_interrupt_hp_pct)=0
    # Cancel Mana Tea if someone drops below threshold or mana is at 99%+
    - stop_casting,interrupt=true,if=player.channeling&player.casting.spell_id=197908&(group.count(cycle.health.effective.pct<config.mana_tea_interrupt_hp_pct)>=1|player.mana.pct>=99)
    # Cancel Soothing Mist immediately in M+ (never wanted in dungeon)
    - stop_casting,interrupt=true,if=player.channeling&player.casting.spell_id=115175&var.is_dungeon
    # Cancel Soothing Mist in raid when no more targets need instant EnvM or instant Vivify
    - stop_casting,interrupt=true,if=player.channeling&player.casting.spell_id=115175&!var.is_dungeon&group.count(cycle.health.effective.pct<config.enveloping_mist_hp_pct&!pred.cycle.buff.enveloping_mist.up)=0&group.count(cycle.health.effective.pct<config.vivify_hp_pct)=0

    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Out of combat healing
    - call_action_list,name=out_of_combat,if=!player.combat
    - return,if=!player.combat

    # Interrupts
    - spear_hand_strike,if=interrupt.target.check
    - spear_hand_strike.mouseover,if=interrupt.mouseover.check
    - spear_hand_strike.focus,if=interrupt.focus.check
    # CC Interrupt
    - paralysis,if=interrupt.cc.check
    # AoE Interrupt
    - leg_sweep,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Mouseover Emergency Healing — if hovering a friendly below threshold, blast heals on them
    - call_action_list,name=mouseover_healing_emergency,if=config.use_mouseover&var.mo_friendly_valid&mouseover.health.effective.pct<=config.mouseover_emergency_hp&!player.casting&!player.channeling

    # Trinkets
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # Cooldowns (Revival, TFT, Celestial Conduit, Yu'lon, Chi-Ji)
    - call_action_list,name=cooldowns

    # MoH Spend Window — fires in ALL contexts when Aspect of Harmony Vitality spend is active
    # Takes over healing priority for the ~10-second spend window
    - call_action_list,name=moh_spend_window,if=var.moh_spending

    # MoH TFT-Harmony Consume — fires when the TFT-empowered Harmony buff (450769) is up
    # Forces a high-value heal to consume the buff before it expires; runs in ALL contexts
    - call_action_list,name=moh_tft_consume,if=var.is_moh&var.moh_tft_buff

    # Healing — auto-branch by group size and celestial talent
    # Chi-Ji: Jadefire Stomp/CJL cycle + RSK/BOK fistweave; valid in dungeon AND raid
    - call_action_list,name=healing_raid_chiji,if=!var.is_dungeon&talent.invoke_chiji_the_red_crane
    # Yu'lon: standard Renewing Mist/Vivify/EnvM rotation
    - call_action_list,name=healing_raid,if=!var.is_dungeon&talent.invoke_yulon_the_jade_serpent
    # Dungeon: spot heals only; fistweave handles passive healing via Ancient Teachings
    - call_action_list,name=healing_dungeon,if=var.is_dungeon

    # Mana Tea — movement filler; guide: "use during movement toward mechanics, not active healing"
    - mana_tea,range_check=none,if=mana.pct<=70&player.moving&group.count(cycle.health.effective.pct<config.mana_tea_interrupt_hp_pct)=0

    # Target Check
    - return,if=auto_combat.target

    # DPS / Fistweaving
    # Dungeon: primary activity; Ancient Teachings + Gust of Mists heal passively
    - call_action_list,name=dps_dungeon,if=var.is_dungeon&var.can_fistweave
    # Raid: Tiger Palm stacks + BOK fillers; RSK already fires from healing list
    - call_action_list,name=dps_raid,if=!var.is_dungeon&config.dps_enabled

    # Mana Tea — only when truly idle (guide: not during active healing phases)
    - mana_tea,range_check=none,if=mana.pct<=70&group.count(cycle.health.effective.pct<config.mana_tea_interrupt_hp_pct)=0
