version: 1

# Spells that should be interrupted
# Format:
#   spell_id: "Name"                              - Simple interrupt
#   spell_id: { name: "X", channel_only: true }   - Only interrupt if channeling
#   spell_id: { name: "X", stun: true }           - Can be stunned (ignores notInterruptible)
#
# Expressions:
#   config.interrupt_target&(config.interrupt_all&target.casting.interruptible|interrupts.target.ready)       - Target casting interruptible spell
#   config.interrupt_target&interrupts.target.stun.ready  - Target casting stun-able spell (ignores notInterruptible)
#   interrupts.10y.ready          - Any enemy in 10y casting interruptible
#   interrupts.10y.stun.ready     - Any enemy in 10y casting stun-able
#   interrupts.10y.count          - Count of enemies in 10y casting interruptible
#   interrupts.10y.stun.count     - Count of enemies in 10y casting stun-able

