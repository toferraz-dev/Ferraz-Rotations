# =============================================================================
# Demon Hunter Vengeance - Spec ID 581
# =============================================================================
#
# IMPORTANT: Spell ID collisions — "Voidfall" resolves to 5+ rows in SpellName.csv,
# so name-based buff lookup is ambiguous. Annihilator buffs must use numeric IDs:
#   Voidfall Building:  1256301  → buff.1256301.stack
#   Voidfall Spending:  1256302  → buff.1256302.up / buff.1256302.stack

# Conversion notes - apply throughout this file:
#   soul_fragments → buff.soul_fragments.stack
#   Trinket properties not supported — using sync
#   soul_fragments.total → buff.soul_fragments.stack
#   action.sigil_of_spite.placed → lastcast.sigil_of_spite<2 (a sigil is "placed" until it activates)
#   fight_style.* = 0 → is_dungeon=0, dung_cd_ok / dung_meta_ok always true
#   apex.N → talent.untethered_rage.rank (Vengeance apex)

version: 3
spec: 581
entry: main

config:
  fiery_hp_pct:
    section: "Defensive HP Percentage"
    label: "Fiery Brand HP%"
    type: slider
    min: 0
    max: 100
    default: 95

  meta_hp_pct:
    section: "Defensive HP Percentage"
    label: "Metamorphosis HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  darkness_hp_pct:
    section: "Defensive HP Percentage"
    label: "Darkness HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  demon_spikes_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Demon Spikes (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  meta_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Metamorphosis (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  fiery_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Fiery Brand (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55

  sigil_melee_check:
    label: "Sigils Melee Check"
    type: checkbox
    default: true

  save_infernal_strike:
    label: "Conserve Infernal Strike"
    type: checkbox
    default: true

  felblade_range_check:
    label: "Felblade Range Check"
    type: checkbox
    default: true

variables:
  # Felblade range gate — when enabled, only cast when target is within Felblade's 20y range
  felblade_ok: "!config.felblade_range_check|target.range<=20"
  # Fel Devastation stationary gate — require standing still for >0.5s before channeling
  fel_dev_ok: "player.standing.time>0.5"

  # actions=/variable,name=aoe,value=spell_targets.spirit_bomb>=3
  aoe: "active_enemies>=3"
  # actions+=/variable,name=execute,value=fight_remains<20
  execute: "fight_remains<20"
  # actions+=/variable,name=is_dungeon,value=fight_style.dungeonroute|fight_style.dungeonslice
  # actions+=/cycling_variable,name=dung_pull_ttd,op=reset
  # actions+=/cycling_variable,name=dung_pull_ttd,op=max,value=target.time_to_die
  # actions+=/variable,name=dung_next_pull,value=variable.is_dungeon&raid_event.adds.exists&raid_event.pull.remains<12&(raid_event.adds.has_boss|raid_event.adds.count>=3)
  # actions+=/variable,name=dung_cd_ok,value=variable.execute|!variable.is_dungeon|(variable.dung_pull_ttd>12&!variable.dung_next_pull)
  # actions+=/variable,name=dung_meta_ok,value=variable.execute|!variable.is_dungeon|(variable.dung_pull_ttd>(15-5*hero_tree.annihilator)&!variable.dung_next_pull)
  # actions+=/variable,name=trinket_1_buffs,value=trinket.1.has_use_buff|(trinket.1.has_buff.agility|trinket.1.has_buff.mastery|trinket.1.has_buff.versatility|trinket.1.has_buff.haste|trinket.1.has_buff.crit|trinket.1.has_buff.attack_power)
  # actions+=/variable,name=trinket_2_buffs,value=trinket.2.has_use_buff|(trinket.2.has_buff.agility|trinket.2.has_buff.mastery|trinket.2.has_buff.versatility|trinket.2.has_buff.haste|trinket.2.has_buff.crit|trinket.2.has_buff.attack_power)
  # actions+=/variable,name=trinket_priority,op=setif,value=2,value_else=1,condition=!variable.trinket_1_buffs&variable.trinket_2_buffs|variable.trinket_2_buffs&((trinket.2.proc.any_dps.duration)*trinket.2.proc.any_dps.default_value)>((trinket.1.proc.any_dps.duration)*trinket.1.proc.any_dps.default_value)
  # actions+=/variable,name=damage_trinket_priority,op=setif,value=2,value_else=1,condition=!variable.trinket_1_buffs&!variable.trinket_2_buffs&trinket.2.ilvl>=trinket.1.ilvl
  # actions+=/variable,name=fiery_demise_active,value=talent.fiery_demise&dot.fiery_brand.ticking
  fiery_demise_active: "talent.fiery_demise&dot.fiery_brand.ticking"
  # actions+=/variable,name=fragment_target,op=setif,value=5+apex.2,value_else=variable.fiery_demise_active*3+!variable.fiery_demise_active*(5-buff.metamorphosis.up),condition=hero_tree.aldrachi_reaver
  fragment_target: "hero_tree.aldrachi_reaver*(5+(talent.untethered_rage.rank>=2))+!hero_tree.aldrachi_reaver*(var.fiery_demise_active*3+!var.fiery_demise_active*(5-buff.metamorphosis.up))"

  # Seconds left on the Reaver's Mark stacks applied by the last Fracture-second cycle
  # actions.aldrachi_reaver+=/variable,name=anchor_rem,value=(variable.anchor_at>0)*(20-(time-variable.anchor_at))
  # local addition: anchor_at<=combat.time — action-line variables survive between pulls, a stale anchor would read >20
  anchor_rem: "(var.anchor_at>0&var.anchor_at<=combat.time)*(20-(combat.time-var.anchor_at))"
  # Slash-second only while the Mark has time to spare; otherwise go Fracture-second to refresh it
  # actions.aldrachi_reaver+=/variable,name=prio_slashes,value=variable.aoe|variable.execute|variable.anchor_rem>11-3*(talent.soul_carver&cooldown.soul_carver.remains<6)-1.5*(talent.sigil_of_spite&cooldown.sigil_of_spite.remains<6)
  prio_slashes: "var.aoe|var.execute|var.anchor_rem>11-3*(talent.soul_carver&cooldown.soul_carver.remains<6)-1.5*(talent.sigil_of_spite&cooldown.sigil_of_spite.remains<6)"

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - demon_spikes,range_check=none,if=incoming.mitigated.pct>=config.demon_spikes_dmg_pct&buff.demon_spikes.down
    - metamorphosis.player,range_check=none,if=incoming.mitigated.pct>=config.meta_dmg_pct&buff.metamorphosis.down
    - fiery_brand,range_check=none,if=incoming.mitigated.pct>=config.fiery_dmg_pct&debuff.fiery_brand.down

    # --- HP Percentage: react when already low ---
    # Demon Spikes - In Metamorphosis, use if buff down and will have charge before meta expires
    - demon_spikes,if=buff.demon_spikes.down&active_enemies>=1&buff.metamorphosis.up&buff.metamorphosis.remains>cooldown.demon_spikes.full_recharge_time

    # Demon Spikes - Not in Meta, some targets don't have Fiery Brand
    - demon_spikes,if=buff.demon_spikes.down&active_enemies>=1&!buff.metamorphosis.up&nameplates.debuff.fiery_brand.count<active_enemies

    # Demon Spikes - Not in Meta, about to cap charges
    - demon_spikes,if=buff.demon_spikes.down&active_enemies>=1&!buff.metamorphosis.up&cooldown.demon_spikes.charges_fractional>1.8

    # Demon Spikes - No Meta, no Fiery Brand on any target, capped charges
    - demon_spikes,if=buff.demon_spikes.down&!buff.metamorphosis.up&nameplates.debuff.fiery_brand.count=0&cooldown.demon_spikes.charges_fractional>1.8

    # Metamorphosis - Defensive use when low HP
    - metamorphosis.player,if=health.pct<=config.meta_hp_pct&buff.metamorphosis.down

    # Fiery Brand - Defensive use when low HP or danger
    - fiery_brand,if=debuff.fiery_brand.down&health.pct<=config.fiery_hp_pct

    # Darkness - Defensive use when low HP
    - darkness,range_check=none,if=health.pct<=config.darkness_hp_pct

  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - disrupt,if=interrupt.target.check
    - disrupt.mouseover,if=interrupt.mouseover.check
    - disrupt.focus,if=interrupt.focus.check
    # CC Interrupt
    - imprison,if=interrupt.cc.check
    # AoE Interrupt
    - chaos_nova,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt — grab aggro when not tanking (dungeon/M+ only, never raid)
    - torment,name="Taunt",if=target.threat<2&target.combat&target.threat!=-1&target.targeting_party&!target.ignore_count&!target.bypass_combat&!player.inraid
    - torment.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.targeting_party&!mouseover.ignore_count&!mouseover.bypass_combat&mouseover.exists&!player.inraid

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # actions+=/auto_attack
    # actions+=/disrupt,if=target.debuff.casting.react
    # Handled by the interrupt block above.
    # actions+=/infernal_strike,use_off_gcd=1
    - infernal_strike.player,if=!config.save_infernal_strike|cooldown.infernal_strike.full_recharge_time<gcd.max
    # actions+=/demon_spikes,use_off_gcd=1,if=!buff.demon_spikes.up&in_combat
    - demon_spikes,if=!buff.demon_spikes.up&player.combat
    # actions+=/run_action_list,name=aldrachi_reaver,if=hero_tree.aldrachi_reaver
    - run_action_list,name=aldrachi_reaver,if=hero_tree.aldrachi_reaver
    # actions+=/run_action_list,name=annihilator,if=hero_tree.annihilator
    # hero_tree.annihilator aliases talent.untethered_rage, the Vengeance apex (both trees) — AR already returned above.
    - run_action_list,name=annihilator

  # ===========================================================================
  # Aldrachi Reaver
  # ===========================================================================
  aldrachi_reaver:
    # actions.aldrachi_reaver=/sigil_of_flame
    - sigil_of_flame.player
    # actions.aldrachi_reaver+=/immolation_aura,if=in_combat
    - immolation_aura,if=player.combat
    # actions.aldrachi_reaver+=/metamorphosis,use_off_gcd=1,if=buff.untethered_rage.up|(!buff.metamorphosis.up&variable.dung_meta_ok)
    - metamorphosis.player,if=buff.untethered_rage.up|!buff.metamorphosis.up
    # actions.aldrachi_reaver+=/soul_cleave,if=!variable.aoe&soul_fragments.total>=variable.fragment_target&!(buff.glaive_flurry.up&buff.rending_strike.up&variable.prio_slashes)
    - soul_cleave,if=!var.aoe&buff.soul_fragments.stack>=var.fragment_target&!(buff.glaive_flurry.up&buff.rending_strike.up&var.prio_slashes)
    # actions.aldrachi_reaver+=/call_action_list,name=trinkets
    - call_action_list,name=trinkets
    # actions.aldrachi_reaver+=/reavers_glaive,if=!buff.rending_strike.up&!buff.glaive_flurry.up&(variable.execute|variable.prio_slashes|variable.anchor_rem<=4*gcd.max|buff.art_of_the_glaive.stack+soul_fragments>=(18-buff.metamorphosis.up))
    - reavers_glaive,if=!buff.rending_strike.up&!buff.glaive_flurry.up&(var.execute|var.prio_slashes|var.anchor_rem<=4*gcd.max|buff.art_of_the_glaive.stack+buff.soul_fragments.stack>=(18-buff.metamorphosis.up))
    # actions.aldrachi_reaver+=/call_action_list,name=ar_glaive_cycle,if=buff.rending_strike.up|buff.glaive_flurry.up
    - call_action_list,name=ar_glaive_cycle,if=buff.rending_strike.up|buff.glaive_flurry.up
    # actions.aldrachi_reaver+=/fiery_brand,if=charges>=2|!variable.fiery_demise_active|variable.execute
    - fiery_brand,if=cooldown.fiery_brand.charges>=2|!var.fiery_demise_active|var.execute
    # actions.aldrachi_reaver+=/sigil_of_spite,if=variable.dung_cd_ok&!buff.reavers_glaive.up
    - sigil_of_spite.player,if=!buff.reavers_glaive.up
    # actions.aldrachi_reaver+=/call_action_list,name=ar_quick_consume,if=buff.art_of_the_glaive.stack+soul_fragments>=20|variable.aoe&soul_fragments>=6
    - call_action_list,name=ar_quick_consume,if=buff.art_of_the_glaive.stack+buff.soul_fragments.stack>=20|var.aoe&buff.soul_fragments.stack>=6
    # actions.aldrachi_reaver+=/fel_devastation,if=variable.dung_cd_ok&fury>85&(soul_fragments.inactive>1|variable.aoe)
    # soul_fragments.inactive not supported — the aoe half kept.
    - fel_devastation,if=fury>85&var.aoe&var.fel_dev_ok
    # actions.aldrachi_reaver+=/soul_carver,if=variable.dung_cd_ok&(variable.fiery_demise_active|variable.execute)
    - soul_carver,if=var.fiery_demise_active|var.execute
    # actions.aldrachi_reaver+=/call_action_list,name=ar_fillers
    - call_action_list,name=ar_fillers

  ar_quick_consume:
    # actions.ar_quick_consume=/spirit_bomb,if=variable.aoe
    - spirit_bomb,if=var.aoe
    # actions.ar_quick_consume+=/soul_cleave,if=!variable.aoe
    - soul_cleave,if=!var.aoe

  ar_fillers:
    # actions.ar_fillers=/fracture,if=buff.warblades_hunger.stack
    - fracture,if=buff.warblades_hunger.stack
    # actions.ar_fillers+=/soul_cleave,if=(!variable.aoe|fury>=2*action.soul_cleave.cost|cooldown.fracture.charges>=1|cooldown.fracture.remains<=gcd.max)&!(buff.glaive_flurry.up&buff.rending_strike.up&variable.prio_slashes)
    - soul_cleave,if=(!var.aoe|fury>=2*action.soul_cleave.cost|cooldown.fracture.charges>=1|cooldown.fracture.remains<=gcd.max)&!(buff.glaive_flurry.up&buff.rending_strike.up&var.prio_slashes)
    # actions.ar_fillers+=/fracture
    - fracture
    # actions.ar_fillers+=/felblade
    - felblade,if=var.felblade_ok
    # actions.ar_fillers+=/fel_devastation
    - fel_devastation,if=var.fel_dev_ok

  ar_glaive_cycle:
    # actions.ar_glaive_cycle=/potion,use_off_gcd=1
    # actions.ar_glaive_cycle+=/invoke_external_buff,name=power_infusion
    # actions.ar_glaive_cycle+=/variable,name=anchor_at,value=time,if=buff.rending_strike.up&!buff.glaive_flurry.up
    - variable,name=anchor_at,value=combat.time,if=buff.rending_strike.up&!buff.glaive_flurry.up
    # actions.ar_glaive_cycle+=/fracture,if=buff.rending_strike.up&(variable.prio_slashes|!buff.glaive_flurry.up)
    - fracture,if=buff.rending_strike.up&(var.prio_slashes|!buff.glaive_flurry.up)
    # actions.ar_glaive_cycle+=/soul_cleave,if=buff.glaive_flurry.up&(!variable.prio_slashes|!buff.rending_strike.up)
    - soul_cleave,if=buff.glaive_flurry.up&(!var.prio_slashes|!buff.rending_strike.up)
    # actions.ar_glaive_cycle+=/felblade
    - felblade,if=var.felblade_ok

  # ===========================================================================
  # Annihilator
  # ===========================================================================
  annihilator:
    # actions.annihilator=/invoke_external_buff,name=power_infusion,if=buff.voidfall_spending.stack=3|variable.execute
    # actions.annihilator+=/call_action_list,name=anni_voidfall_spending,if=buff.voidfall_spending.up
    - call_action_list,name=anni_voidfall_spending,if=buff.1256302.up
    # actions.annihilator+=/sigil_of_flame,if=soul_fragments<=2+talent.soul_sigils
    - sigil_of_flame.player,if=buff.soul_fragments.stack<=2+talent.soul_sigils
    # actions.annihilator+=/fracture,if=buff.voidfall_building.stack>=2&soul_fragments.total>=variable.fragment_target
    - fracture,if=buff.1256301.stack>=2&buff.soul_fragments.stack>=var.fragment_target
    # actions.annihilator+=/call_action_list,name=anni_generate_fury,if=buff.voidfall_building.stack>=2&cooldown.fracture.charges_fractional>=0.75
    - call_action_list,name=anni_generate_fury,if=buff.1256301.stack>=2&cooldown.fracture.charges_fractional>=0.75
    # actions.annihilator+=/call_action_list,name=anni_meta_entry,if=buff.untethered_rage.up|(variable.dung_meta_ok&cooldown.metamorphosis.remains<3*gcd.max)
    - call_action_list,name=anni_meta_entry,if=buff.untethered_rage.up|cooldown.metamorphosis.remains<3*gcd.max
    # actions.annihilator+=/call_action_list,name=anni_cooldowns,if=variable.dung_cd_ok&(!talent.fiery_demise|variable.fiery_demise_active|cooldown.fiery_brand.remains>20|variable.execute)
    - call_action_list,name=anni_cooldowns,if=!talent.fiery_demise|var.fiery_demise_active|cooldown.fiery_brand.remains>20|var.execute
    # actions.annihilator+=/fracture,if=full_recharge_time<gcd.max
    - fracture,if=cooldown.fracture.full_recharge_time<gcd.max
    # actions.annihilator+=/immolation_aura,if=(talent.fallout&variable.aoe)|(talent.charred_flesh&variable.fiery_demise_active)
    - immolation_aura,if=(talent.fallout&var.aoe)|(talent.charred_flesh&var.fiery_demise_active)
    # actions.annihilator+=/spirit_bomb,if=soul_fragments>=variable.fragment_target
    - spirit_bomb,if=buff.soul_fragments.stack>=var.fragment_target
    # actions.annihilator+=/immolation_aura
    - immolation_aura
    # actions.annihilator+=/sigil_of_flame
    - sigil_of_flame.player
    # actions.annihilator+=/fracture,if=soul_fragments.total<=4|fury<40
    - fracture,if=buff.soul_fragments.stack<=4|fury<40
    # actions.annihilator+=/soul_cleave,if=!(apex.3&!buff.untethered_rage.up&buff.seething_anger.stack>=10)&!cooldown.metamorphosis.up|(!talent.sigil_of_spite|!action.sigil_of_spite.placed)
    - soul_cleave,if=!((talent.untethered_rage.rank>=4)&!buff.untethered_rage.up&buff.seething_anger.stack>=10)&!cooldown.metamorphosis.up|(!talent.sigil_of_spite|!(lastcast.sigil_of_spite<2))
    # actions.annihilator+=/felblade
    - felblade,if=var.felblade_ok
    # actions.annihilator+=/throw_glaive
    - throw_glaive

  anni_cooldowns:
    # actions.anni_cooldowns=/spirit_bomb,if=soul_fragments>=variable.fragment_target
    - spirit_bomb,if=buff.soul_fragments.stack>=var.fragment_target
    # actions.anni_cooldowns+=/sigil_of_spite,if=soul_fragments<=2+talent.soul_sigils
    - sigil_of_spite.player,if=buff.soul_fragments.stack<=2+talent.soul_sigils
    # actions.anni_cooldowns+=/call_action_list,name=anni_generate_fury,if=cooldown.fel_devastation.up&fury<50
    - call_action_list,name=anni_generate_fury,if=cooldown.fel_devastation.up&fury<50

  anni_voidfall_spending:
    # Soul Cleave right after the 3-stack Spirit Bomb lands inside its window for a bonus meteor
    # actions.anni_voidfall_spending=/soul_cleave,if=prev_gcd.1.spirit_bomb&buff.voidfall_spending.stack=3
    - soul_cleave,if=prev_gcd.1.spirit_bomb&buff.1256302.stack=3
    # actions.anni_voidfall_spending+=/fiery_brand,if=charges>=2|!variable.fiery_demise_active
    - fiery_brand,if=cooldown.fiery_brand.charges>=2|!var.fiery_demise_active
    # actions.anni_voidfall_spending+=/fracture,if=buff.voidfall_spending.stack=buff.voidfall_spending.max_stack&cooldown.spirit_bomb.ready&soul_fragments.total>=variable.fragment_target&fury>=45&fury<75
    # max_stack not supported — 3.
    - fracture,if=buff.1256302.stack=3&cooldown.spirit_bomb.ready&buff.soul_fragments.stack>=var.fragment_target&fury>=45&fury<75
    # actions.anni_voidfall_spending+=/soul_cleave,if=cooldown.spirit_bomb.remains>gcd.max*4
    - soul_cleave,if=cooldown.spirit_bomb.remains>gcd.max*4
    # actions.anni_voidfall_spending+=/spirit_bomb,if=(soul_fragments.total>=variable.fragment_target|buff.voidfall_spending.stack=3)&(buff.voidfall_spending.stack<3|fury>=75)
    - spirit_bomb,if=(buff.soul_fragments.stack>=var.fragment_target|buff.1256302.stack=3)&(buff.1256302.stack<3|fury>=75)
    # actions.anni_voidfall_spending+=/felblade,if=(fury<40&cooldown.spirit_bomb.remains<=gcd.max)|(fury<25&cooldown.spirit_bomb.remains>gcd.max)
    - felblade,if=((fury<40&cooldown.spirit_bomb.remains<=gcd.max)|(fury<25&cooldown.spirit_bomb.remains>gcd.max))&var.felblade_ok
    # actions.anni_voidfall_spending+=/immolation_aura,if=(fury<40&cooldown.spirit_bomb.remains<=gcd.max)|(fury<25&cooldown.spirit_bomb.remains>gcd.max)
    - immolation_aura,if=(fury<40&cooldown.spirit_bomb.remains<=gcd.max)|(fury<25&cooldown.spirit_bomb.remains>gcd.max)
    # actions.anni_voidfall_spending+=/soul_carver,if=(cooldown.spirit_bomb.remains<=gcd.max)&soul_fragments.total<variable.fragment_target&(!talent.sigil_of_spite|!action.sigil_of_spite.placed)
    - soul_carver,if=cooldown.spirit_bomb.remains<=gcd.max&buff.soul_fragments.stack<var.fragment_target&(!talent.sigil_of_spite|!(lastcast.sigil_of_spite<2))
    # actions.anni_voidfall_spending+=/sigil_of_spite,if=(cooldown.spirit_bomb.remains<=gcd.max)&soul_fragments.total<variable.fragment_target
    - sigil_of_spite.player,if=cooldown.spirit_bomb.remains<=gcd.max&buff.soul_fragments.stack<var.fragment_target
