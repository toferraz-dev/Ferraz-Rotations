version: 3
spec: 73

# =============================================================================
# Protection Warrior - Spec ID 73
# =============================================================================

config:
  shield_wall_hp_pct:
    label: "Shield Wall"
    type: slider
    min: 0
    max: 100
    default: 30
  impending_victory_hp_pct:
    label: "Impending Victory"
    type: slider
    min: 0
    max: 100
    default: 85
  rallying_cry_hp_pct:
    label: "Rallying Cry"
    type: slider
    min: 0
    max: 100
    default: 50
  shield_charge_change:
    label: "Shield Chage Range"
    type: slider
    min: 5
    max: 25
    default: 5
  

variables:
  # Execute phase based on Massacre talent
  execute_phase: (talent.massacre.enabled&target.health.pct<35)|target.health.pct<20

lists:
  # ==========================================================================
  # TRINKETS
  # ==========================================================================
  trinkets:
    # use_item,name=algethar_puzzle_box
    - use_item,name=algethar_puzzle_box
    # use_item,name=tome_of_lights_devotion,if=buff.inner_resilience.up
    - use_item,name=tome_of_lights_devotion,if=buff.inner_resilience.up
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # ==========================================================================
  # COLOSSUS AOE (3+ targets - Colossus hero tree)
  # ==========================================================================
  colossus_aoe:
    # thunder_clap,if=dot.rend_dot.remains<=1
    - thunder_clap,if=dot.rend.remains<=1
    # shield_slam,if=buff.violent_outburst.up&buff.phalanx.up
    - shield_slam,if=buff.violent_outburst.up&buff.phalanx.up
    # thunder_clap,if=spell_targets.thunder_clap>6&buff.avatar.up
    - thunder_clap,if=active_enemies>6&buff.avatar.up
    # revenge,if=rage>=70&spell_targets.revenge>=3
    - revenge,if=rage>=70&active_enemies>=3
    # shield_slam,if=rage<=60|buff.violent_outburst.up
    - shield_slam,if=rage<=60|buff.violent_outburst.up
    # thunder_clap
    - thunder_clap
    # revenge,if=rage>=30|rage>=40&talent.barbaric_training.enabled
    - revenge,if=rage>=30|rage>=40&talent.barbaric_training.enabled
    # execute,if=spell_targets.execute>=2&(rage>=50|buff.sudden_death.up)&talent.heavy_handed.enabled
    - execute,if=active_enemies>=2&(rage>=50|buff.sudden_death.up)&talent.heavy_handed.enabled

  # ==========================================================================
  # THANE AOE (3+ targets - Mountain Thane hero tree)
  # ==========================================================================
  thane_aoe:
    # thunder_blast,if=dot.rend_dot.remains<=1
    - thunder_blast,if=dot.rend.remains<=1
    # thunder_clap,if=dot.rend_dot.remains<=1
    - thunder_clap,if=dot.rend.remains<=1
    # shield_slam,if=buff.violent_outburst.up&buff.phalanx.up
    - shield_slam,if=buff.violent_outburst.up&buff.phalanx.up
    # thunder_blast,if=spell_targets.thunder_clap>=2&buff.avatar.up
    - thunder_blast,if=active_enemies>=2&buff.avatar.up
    # shield_slam,if=buff.phalanx.up
    - shield_slam,if=buff.phalanx.up
    # thunder_clap,if=spell_targets.thunder_clap>=4&buff.avatar.up
    - thunder_clap,if=active_enemies>=4&buff.avatar.up
    # revenge,if=rage>=70&spell_targets.revenge>=3
    - revenge,if=rage>=70&active_enemies>=3
    # shield_slam,if=rage<=60|buff.violent_outburst.up
    - shield_slam,if=rage<=60|buff.violent_outburst.up
    # thunder_blast
    - thunder_blast
    # thunder_clap
    - thunder_clap
    # execute,if=spell_targets.execute>=2&(rage>=50|buff.sudden_death.up)&talent.heavy_handed.enabled
    - execute,if=active_enemies>=2&(rage>=50|buff.sudden_death.up)&talent.heavy_handed.enabled
    # revenge,if=rage>=30|rage>=40&talent.barbaric_training.enabled
    - revenge,if=rage>=30|rage>=40&talent.barbaric_training.enabled

  # ==========================================================================
  # COLOSSUS ST (Single Target - Colossus hero tree)
  # ==========================================================================
  colossus_st:
    # Original: shield_slam
    - shield_slam
    # Original: thunder_clap
    - thunder_clap
    # Original: revenge,if=buff.ravager.up
    - revenge,if=buff.ravager.up
    # Original: execute,if=buff.sudden_death.up&talent.deep_wounds|talent.deep_wounds&rage>=40
    - execute,if=buff.sudden_death.up&talent.deep_wounds|talent.deep_wounds&rage>=40
    # Original: thunder_clap,if=(spell_targets.thunder_clap>=1|cooldown.shield_slam.remains)&hero_tree.mountain_thane&rage<=80
    - thunder_clap,if=(active_enemies>=1|cooldown.shield_slam.remains)&hero_tree.mountain_thane&rage<=80
    # Original: revenge,if=rage>=80&!variable.execute_phase|buff.revenge.up&variable.execute_phase&rage<=18&cooldown.shield_slam.remains|buff.revenge.up&!variable.execute_phase
    - revenge,if=rage>=80&!variable.execute_phase|buff.revenge.up&variable.execute_phase&rage<=18&cooldown.shield_slam.remains|buff.revenge.up&!variable.execute_phase
    # Original: wrecking_throw,if=talent.javelineer.enabled
    - wrecking_throw,if=talent.javelineer.enabled
    # Original: shattering_throw,if=talent.javelineer.enabled
    - shattering_throw,if=talent.javelineer.enabled
    # Original: revenge
    - revenge
    # Original: devastate
    - devastate

  # ==========================================================================
  # THANE ST (Single Target - Mountain Thane hero tree)
  # ==========================================================================
  thane_st:
    # Original: thunder_blast
    - thunder_blast
    # Original: thunder_clap,if=buff.ravager.up
    - thunder_clap,if=buff.ravager.up
    # Original: shield_slam
    - shield_slam
    # Original: thunder_clap
    - thunder_clap
    # Original: thunder_blast,if=(spell_targets.thunder_clap>=1|cooldown.shield_slam.remains)
    - thunder_blast,if=(active_enemies>=1|cooldown.shield_slam.remains)
    # Original: execute,if=buff.sudden_death.up|rage>=40
    - execute,if=buff.sudden_death.up|rage>=40
    # Original: wrecking_throw,if=talent.javelineer.enabled
    - wrecking_throw,if=talent.javelineer.enabled
    # Original: shattering_throw,if=talent.javelineer.enabled
    - shattering_throw,if=talent.javelineer.enabled
    # Original: revenge,if=rage>=80&!variable.execute_phase|buff.revenge.up&variable.execute_phase&rage<=18&cooldown.shield_slam.remains|buff.revenge.up&!variable.execute_phase
    - revenge,if=rage>=80&!variable.execute_phase|buff.revenge.up&variable.execute_phase&rage<=18&cooldown.shield_slam.remains|buff.revenge.up&!variable.execute_phase
    # Original: revenge
    - revenge
    # Original: devastate
    - devastate

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # Shared lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Shattering Throw — deals up to 500% increased damage to absorb shields
    - shattering_throw,if=target.absorb>0
    - wrecking_throw,if=target.absorb>0

    - battle_shout,range_check=none,if=(!buff.battle_shout.up.any|buff.battle_shout.remains.any<60|action.battle_shout.overlayed)&lastcast.battle_shout>=10
    - defensive_stance,range_check=none,if=!buff.defensive_stance.up
    
    # Combat Check
    - return,if=auto_combat.player

    # Defensives  
    # shield_wall - using config slider
    - rallying_cry,range_check=none,if=health.pct<=config.rallying_cry_hp_pct
    - impending_victory,if=health.pct<=config.impending_victory_hp_pct

    - shield_wall,range_check=none,if=health.pct<=config.shield_wall_hp_pct

    # incoming_cast.player.reflectable.up = targeted reflectable spell aimed at player
    # incoming_cast.aoe.reflectable.up = AoE reflectable spell (no targeting requirement)
    - spell_reflection,range_check=none,if=incoming_cast.player.reflectable.up|incoming_cast.aoe.reflectable.up
    # Interrupts
    - pummel,if=interrupt.target.check
    - pummel.mouseover,if=interrupt.mouseover.check
    - pummel.focus,if=interrupt.focus.check
    # CC Interrupt
    - storm_bolt,if=interrupt.cc.check
    # AoE Interrupt
    - shockwave,if=interrupt.stun.aoe.check
    - intimidating_shout,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt — grab aggro when not tanking (dungeon/M+ only, never raid)
    - taunt,name="Taunt",if=target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - taunt.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

    - call_action_list,name=auto_heal

    # Ignore Pain - simplified from very complex conditions
    # Original uses off_gcd which we handle differently
    # Original: ignore_pain,if=target.health.pct>=20&(rage.deficit<=15&cooldown.shield_slam.ready|rage.deficit<=40&cooldown.shield_charge.ready|rage.deficit<=20&cooldown.shield_charge.ready|rage.deficit<=30&cooldown.demoralizing_shout.ready&talent.booming_voice.enabled|rage.deficit<=20&cooldown.avatar.ready|rage.deficit<=45&cooldown.demoralizing_shout.ready&talent.booming_voice.enabled&buff.last_stand.up&rage.deficit<=30&cooldown.avatar.ready&buff.last_stand.up&rage.deficit<=20|rage.deficit<=40&cooldown.shield_slam.ready&buff.violent_outburst.up&talent.heavy_repercussions.enabled&talent.impenetrable_wall.enabled|rage.deficit<=55&cooldown.shield_slam.ready&buff.violent_outburst.up&buff.last_stand.up&talent.heavy_repercussions.enabled&talent.impenetrable_wall.enabled|rage.deficit<=17&cooldown.shield_slam.ready&talent.heavy_repercussions.enabled|rage.deficit<=18&cooldown.shield_slam.ready&talent.impenetrable_wall.enabled)|(rage>=70|buff.seeing_red.stack=7&rage>=35)&cooldown.shield_slam.remains<=1&buff.shield_block.remains>=4,use_off_gcd=1
    - ignore_pain,if=target.health.pct>=20&(rage.deficit<=15&cooldown.shield_slam.ready|rage.deficit<=40&cooldown.shield_charge.ready|rage.deficit<=20&cooldown.shield_charge.ready|rage.deficit<=30&cooldown.demoralizing_shout.ready&talent.booming_voice.enabled|rage.deficit<=20&cooldown.avatar.ready|rage.deficit<=45&cooldown.demoralizing_shout.ready&talent.booming_voice.enabled&buff.last_stand.up|rage.deficit<=40&cooldown.shield_slam.ready&buff.violent_outburst.up&talent.heavy_repercussions.enabled&talent.impenetrable_wall.enabled|rage.deficit<=55&cooldown.shield_slam.ready&buff.violent_outburst.up&buff.last_stand.up&talent.heavy_repercussions.enabled&talent.impenetrable_wall.enabled|rage.deficit<=17&cooldown.shield_slam.ready&talent.heavy_repercussions.enabled|rage.deficit<=18&cooldown.shield_slam.ready&talent.impenetrable_wall.enabled)|(rage>=70|buff.seeing_red.stack=7&rage>=35)&cooldown.shield_slam.remains<=1&buff.shield_block.remains>=4
    # Second ignore_pain with champions_bulwark talent
    - ignore_pain,if=target.health.pct>=20&rage.deficit<=40&cooldown.shield_charge.ready&talent.champions_bulwark.enabled
    - ignore_pain,if=buff.ignore_pain.up&buff.ignore_pain.remains<3
    - ignore_pain,if=buff.ignore_pain.stack>0&buff.ignore_pain.stack<=85&rage.deficit<=25

    # Target Check
    - return,if=auto_combat.target

    # Charge at pull
    # Original: charge,if=time=0
    - charge,if=target.range>8&player.combat.time<=1.5

    # Trinkets
    - call_action_list,name=trinkets

    # Major Cooldowns
    # avatar,if=buff.thunder_blast.down|buff.thunder_blast.stack<=2
    - avatar,if=buff.thunder_blast.down|buff.thunder_blast.stack<=2

    # Racials
    - blood_fury
    - berserking
    - arcane_torrent
    - lights_judgment
    - fireblood
    - ancestral_call
    - bag_of_tricks

    # Potions (commented - requires user to enable)
    # Original: potion,if=buff.avatar.up|buff.avatar.up&target.health.pct<=20
    # - combat_potion,if=buff.avatar.up|buff.avatar.up&target.health.pct<=20

    - ignore_pain,if=target.health.pct>=20&(rage.deficit<=15&cooldown.shield_slam.ready|rage.deficit<=20&cooldown.shield_charge.ready|rage.deficit<=20&cooldown.demoralizing_shout.ready&talent.booming_voice.enabled|rage.deficit<=15|rage.deficit<=40&cooldown.shield_slam.ready&buff.violent_outburst.up&talent.heavy_repercussions.enabled&talent.practiced_strikes.enabled|rage.deficit<=17&cooldown.shield_slam.ready&talent.heavy_repercussions.enabled|rage.deficit<=18&cooldown.shield_slam.ready&talent.practiced_strikes.enabled)|(rage>=70|buff.seeing_red.stack=7&rage>=35)&cooldown.shield_slam.remains<=1&buff.shield_block.remains
    - revenge,if=buff.ignore_pain.up&buff.ignore_pain.remains>=4&rage.deficit<=25

    - ravager
    - demoralizing_shout,if=talent.booming_voice.enabled
    - champions_leap
    - champions_spear
    - thunder_blast,if=active_enemies>=2&buff.thunder_blast.stack=2
    - demolish,if=buff.colossal_might.stack>=3
    - shield_charge,if=target.range<=config.shield_charge_change
    # Reactive block: pop Shield Block when a tagged blockable hit is incoming and not already up
    - shield_block,range_check=none,if=target.incoming_cast.blockable.up&buff.shield_block.down&cooldown.shield_block.charges>0
    - shield_block,range_check=none,if=buff.shield_block.remains<=3&cooldown.shield_block.charges_fractional>=1.8
    # run_action_list,name=colossus_aoe,if=hero_tree.colossus&spell_targets.thunder_clap>=3
    - run_action_list,name=colossus_aoe,if=hero_tree.colossus&active_enemies>=3
    # run_action_list,name=thane_aoe,if=hero_tree.mountain_thane&spell_targets.thunder_clap>=3
    - run_action_list,name=thane_aoe,if=hero_tree.mountain_thane&active_enemies>=3
    # run_action_list,name=colossus_st,if=talent.demolish
    - run_action_list,name=colossus_st,if=!talent.lightning_strikes
    # run_action_list,name=thane_st,if=talent.lightning_strikes
    - run_action_list,name=thane_st,if=talent.lightning_strikes
