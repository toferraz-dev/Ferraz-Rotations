  # Survival Hunter. sc_hunter.cpp:7485 defines howl_summon.ready as exactly the OR of the
  # three Howl of the Pack Leader ready buffs. All three share the display name
  # "Howl of the Pack Leader", so they must be addressed by id.
  # ids 471878 / 472324 / 472325 (the three variants; .ready is the OR of all of them)
  howl_summon.ready: buff.472325.up|buff.472324.up|buff.471878.up
  # Infernal: GetTotemInfo spellid=111685 (NOT the cast spell 1122)
  # Must use numeric ID because SpellDB resolves "summon_infernal" to cast spell 1122,
  # but the totem entry uses spell ID 111685
  pet.infernal.active: totem.111685.up
  pet.infernal.remains: totem.111685.remains
  # Demonic Tyrant: GetTotemInfo spellid=265187 (matches cast spell Summon Demonic Tyrant)
  pet.demonic_tyrant.active: totem.summon_demonic_tyrant.up

  # ============================================================================
  # Paladin - Hammer of Light free cast detection
  # No in-game aura tracks the free state. The addon picks the hasRequiredAura=true
  # row from GetSpellPowerCost: 0 when the free proc is active, 5 otherwise.
  # .remains is bounded by the Hammer of Light ready buff (427441) lifetime,
  # since the free window can only exist while HoL is a castable finisher.
  # 427441 - buff hammer of light4
  # ============================================================================
  # SimC's hammer_of_light_free is Light's Deliverance's free-cast proc, id 433732.
  # NOT action.hammer_of_light.cost=0: sc_paladin.cpp zeroes the cost from TWO
  # independent places -- the free buff (:2136) and Divine Purpose (:2138) -- so
  # cost can never tell them apart. The bare name is also ambiguous (8 rows), which
  # is why these must be numeric.
  buff.hammer_of_light_free.up: buff.433732.up
  buff.hammer_of_light_free.remains: buff.433732.remains
  pet.demonic_tyrant.remains: totem.summon_demonic_tyrant.remains