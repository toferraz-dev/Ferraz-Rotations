# SimC Class-Specific Aliases
#
# The base SimC syntax (buff.X.up, cooldown.X.remains, etc.) is handled natively
# in simc_expr.cpp. This file contains only class-specific aliases and shortcuts.
#
# Format: alias → actual_expression

expressions:
  # ============================================================================
  # Target immunity — target has an immunity buff (e.g. Divine Shield phase)
  # Usage: !target.immune in DPS action conditions
  # ============================================================================
  target.immune: target.buff_list.immunity.up

  # ============================================================================
  # Instance type alias
  # ============================================================================
  player.ininstancedpve: (player.indungeon|player.inraid|player.inmythicplus)
  player.inopenworld: (!player.indungeon&!player.inraid&!player.inarena&!player.inpvp)

  # ============================================================================
  # Group composition — presence of a living healer (group.count iterates
  # GetSortedMembers which already filters out dead/invalid members).
  # group: at least one healer alive; solo: no healer alive.
  # ============================================================================
  player.group: group.count(cycle.healer)>=1
  player.solo: group.count(cycle.healer)=0

  # ============================================================================
  # Auto Combat return guards (open world only, never in instances)
  # True = should return. Usage: return,if=auto_combat.player
  # In instances: always return if not in combat (no override)
  # In open world: return unless an auto_combat override matches
  # ============================================================================
  auto_combat.player: (!player.combat&(!player.inopenworld|config.auto_combat.has(0)|!((config.auto_combat.has(1)&target.quest_mob&target.enemy)|(config.auto_combat.has(2)&target.combat&target.enemy)|(config.auto_combat.has(3)&player.auto_attacking&target.enemy))))
  auto_combat.target: ((!target.valid|target.dead|target.immune)&(!player.inopenworld|config.auto_combat.has(0)|!((config.auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(config.auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(config.auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))))

  # ============================================================================
  # Interrupt condition aliases
  #
  # Focus precedence: when the player has an enemy focus, target/mouseover
  # interrupts (and their stun variants) are suppressed — only the focus
  # interrupt fires. AoE stun is unaffected (positional, not unit-targeted).
  #
  # In dungeon/raid:
  #   Kick:  kickable-tagged spells only (stunnable-only casts cannot be kicked);
  #          channels kick immediately; important casts kick once interrupt_important_pct%
  #          of cast has elapsed; non-important casts kick once config.interrupt_pct% has
  #          elapsed (0 = always, 100 = never); never boss
  #
  #          Per-cast forced floors (override config.interrupt_pct upward, never downward):
  #            min50 tag -> require >=50% cast elapsed before kicking
  #          Effective threshold = max(config.interrupt_pct, tag floor). Implemented via
  #          (!tag.up | elapsed_meets_floor) — AND with existing gate yields the stricter.
  #   Stun:  stunnable OR kickable tagged; important; or 3+ kickable globally; never boss
  #   AoE:   3+ kickable or 2+ stunnable within 8y; respects config.interrupt_target
  # Outside:
  #   Kick:  any interruptible cast
  #   Stun:  any non-boss cast (mobs are safe to stun, bosses are never stunned)
  # ============================================================================
  # Spell Reflection guard: don't interrupt/stun a target that has reflect up — our cast would bounce back.
  interrupt.target.check: "!focus.enemy&config.interrupt_target&target.enemy&!target.buff_list.spell_reflect.up&(!player.ininstancedpve&target.casting.interruptible|player.ininstancedpve&!target.boss&(config.interrupt_all&target.casting.interruptible&(target.casting.remains<1|target.channeling)|target.incoming_cast.kickable.up&(target.channeling|target.casting.important&target.casting.elapsed*100>=config.interrupt_important_pct*(target.casting.remains+target.casting.elapsed)|!target.casting.important&target.casting.elapsed*100>=config.interrupt_pct*(target.casting.remains+target.casting.elapsed))))&target.casting.elapsed>=0.2&(!target.incoming_cast.kickable.min50.up|target.casting.elapsed*100>=50*(target.casting.remains+target.casting.elapsed))"
  interrupt.mouseover.check: "!focus.enemy&config.interrupt_mouseover&mouseover.enemy&!mouseover.buff_list.spell_reflect.up&(!player.ininstancedpve&mouseover.casting.interruptible|player.ininstancedpve&!mouseover.boss&(config.interrupt_all&mouseover.casting.interruptible&(mouseover.casting.remains<1|mouseover.channeling)|mouseover.incoming_cast.kickable.up&(mouseover.channeling|mouseover.casting.important&mouseover.casting.elapsed*100>=config.interrupt_important_pct*(mouseover.casting.remains+mouseover.casting.elapsed)|!mouseover.casting.important&mouseover.casting.elapsed*100>=config.interrupt_pct*(mouseover.casting.remains+mouseover.casting.elapsed))))&mouseover.casting.elapsed>=0.2&(!mouseover.incoming_cast.kickable.min50.up|mouseover.casting.elapsed*100>=50*(mouseover.casting.remains+mouseover.casting.elapsed))"
  interrupt.focus.check: "config.interrupt_focus&focus.enemy&!focus.buff_list.spell_reflect.up&(!player.ininstancedpve&focus.casting.interruptible|player.ininstancedpve&!focus.boss&(config.interrupt_all&focus.casting.interruptible&(focus.casting.remains<1|focus.channeling)|focus.incoming_cast.kickable.up&(focus.channeling|focus.casting.important&focus.casting.elapsed*100>=config.interrupt_important_pct*(focus.casting.remains+focus.casting.elapsed)|!focus.casting.important&focus.casting.elapsed*100>=config.interrupt_pct*(focus.casting.remains+focus.casting.elapsed))))&focus.casting.elapsed>=0.2&(!focus.incoming_cast.kickable.min50.up|focus.casting.elapsed*100>=50*(focus.casting.remains+focus.casting.elapsed))"
  # CC fallback stun (fires when kick is on CD — kick has priority in the action list):
  # In instance: stunnable-tagged spells only; never boss
  # Outside: any non-boss cast (classification<6); never boss
  interrupt.cc.check: "!focus.enemy&config.interrupt_target&target.enemy&!target.boss&!target.buff_list.spell_reflect.up&(!player.ininstancedpve&target.classification<6&(target.casting|target.channeling)|player.ininstancedpve&target.incoming_cast.stunnable.up)&target.casting.elapsed>=0.75"
  # Stun-based primary interrupts (e.g., Warlock Axe Toss):
  # In instance: stunnable-tagged spells only; never boss
  # Outside: any non-boss cast; never boss
  interrupt.stun.target.check: "!focus.enemy&config.interrupt_target&target.enemy&!target.boss&!target.buff_list.spell_reflect.up&(!player.ininstancedpve&target.classification<6&(target.casting|target.channeling)|player.ininstancedpve&target.incoming_cast.stunnable.up)&target.casting.elapsed>=0.75"
  interrupt.stun.mouseover.check: "!focus.enemy&config.interrupt_mouseover&mouseover.enemy&!mouseover.boss&!mouseover.buff_list.spell_reflect.up&(!player.ininstancedpve&mouseover.classification<6&(mouseover.casting|mouseover.channeling)|player.ininstancedpve&mouseover.incoming_cast.stunnable.up)&mouseover.casting.elapsed>=0.75"
  interrupt.stun.focus.check: "config.interrupt_focus&focus.enemy&!focus.boss&!focus.buff_list.spell_reflect.up&(!player.ininstancedpve&focus.classification<6&(focus.casting|focus.channeling)|player.ininstancedpve&focus.incoming_cast.stunnable.up)&focus.casting.elapsed>=0.75"
  # AoE stun: any stunnable-tagged cast within 8y; never boss; respects config.interrupt_target
  interrupt.stun.aoe.check: "config.interrupt_target&target.enemy&!target.boss&incoming_cast.8y.stunnable.count>=1"

  # ============================================================================
  # Death Knight - Hero Trees
  # ============================================================================
  hero_tree.deathbringer: talent.reapers_mark
  hero_tree.sanlayn: talent.vampiric_strike
  hero_tree.rider_of_the_apocalypse: talent.riders_champion
  # Death Knight - Specific buff aliases
  buff.lesser_ghoul_ready.stack: player.buff.stacks(1254252)
  # buff.lesser_ghoul.up tracks ANY lesser ghoul (buff 1242998 = lesser_ghoul_counter,
  # triggered on every lesser-ghoul spawn regardless of source: Army, Scourge Strike,
  # Doomed Bidding, Putrefy, etc.). Equivalent to SimC's custom `lesser_ghoul.count>0`.
  buff.lesser_ghoul.up: player.buff.remains(1242998)>0
  # pet.lesser_ghoul_army.active (SimC): at least one Army-of-the-Dead-spawned ghoul alive.
  # Army spawns 8 ghouls at 0.5s intervals (last at cast+3.5s). Each ghoul lives 15s
  # (spell 1282535). Commander of the Dead scales duration by 0.5 * mastery% (tooltip).
  pet.lesser_ghoul_army.active: "lastcast.army_of_the_dead<=3.5+15*(1+0.005*mastery*(talent.commander_of_the_dead.rank>=1))"
  buff.dark_transformation.up: pet.buff.dark_transformation.up
  buff.dark_transformation.remains: pet.buff.dark_transformation.remains
  # Death Knight - Specific debuff aliases
  drw.bp_ticking: target.debuff.remains(55078)>0

  # ============================================================================
  # Demon Hunter - Hero Trees
  # ============================================================================
  hero_tree.felscarred: talent.demonsurge
  hero_tree.aldrachi_reaver: talent.art_of_the_glaive
  hero_tree.annihilator: talent.untethered_rage
  hero_tree.devourer: talent.void_ray
  # Demon Hunter - Demonsurge buff (Felscarred hero tree, tracks surge charges)
  buff.demonsurge.up: player.buff.remains(452416)>0
  buff.demonsurge.stack: player.buff.stacks(452416)
  buff.demonsurge.remains: player.buff.remains(452416)

  # ============================================================================
  # Druid - Hero Trees
  # ============================================================================
  hero_tree.druid_of_the_claw: talent.ravage
  hero_tree.wildstalker: talent.bloodseeker_vines
  hero_tree.elunes_chosen: talent.boundless_moonlight
  hero_tree.keeper_of_the_grove: talent.dream_surge

  # ============================================================================
  # Rogue - Hero Trees
  # ============================================================================
  hero_tree.fatebound: talent.hand_of_fate
  hero_tree.trickster: talent.unseen_blade
  hero_tree.deathstalker: talent.deathstalkers_mark

  # ============================================================================
  # Warrior - Hero Trees
  # ============================================================================
  hero_tree.colossus: talent.demolish
  hero_tree.slayer: talent.slayers_dominance
  hero_tree.mountain_thane: talent.crashing_thunder

  # ============================================================================
  # Monk - Aspect of Harmony (Master of Harmony hero tree)
  # Same buff name "Aspect of Harmony" but three different spell IDs:
  #   Accumulator (450521) - "Harmony Collect"; up while a Vitality pool exists
  #   Spender     (450711) - 10s release window; bonus healing on next casts
  #   TFT         (450769) - empowered Harmony buff after Thunder Focus Tea
  # NOTE: Accumulator and Spender are NOT mutually exclusive — both can be up
  #       at the same time (you can keep storing while the spend window ticks).
  #       Do not use accumulator as a proxy for "not in spend phase".
  # ============================================================================
  buff.aspect_of_harmony_accumulator.up: player.buff.up(450521)
  buff.aspect_of_harmony_spender.up: player.buff.up(450711)
  buff.aspect_of_harmony_tft.up: player.buff.up(450769)

  # ============================================================================
  # Monk - Hero Trees
  # ============================================================================
  hero_tree.conduit_of_the_celestials: talent.celestial_conduit
  hero_tree.master_of_harmony: talent.aspect_of_harmony
  hero_tree.shado_pan: talent.flurry_strikes

  # ============================================================================
  # Evoker - Augmentation aliases
  # ============================================================================
  # allied_cds_up: count of group members with Ebon Might buff (361022) who are
  # casting a major cooldown. Approximated as group buff count of 361022.
  evoker.allied_cds_up: group.buff.361022.count

  # ============================================================================
  # Hunter - Hero Trees
  # ============================================================================
  hero_tree.dark_ranger: talent.black_arrow
  hero_tree.sentinel: talent.moonlight_chakram

  # ============================================================================
  # Warlock - Hero Trees
  # ============================================================================
  hero_tree.hellcaller: talent.wither
  hero_tree.soul_harvester: talent.demonic_soul
  hero_tree.diabolist: talent.diabolic_ritual
  # Warlock - Demonic Art (Diabolist hero tree: any art buff active)
  # Spell IDs: 428524 (Overlord), 432794 (Mother of Chaos), 432795 (Pit Lord)
  demonic_art: player.buff.remains(428524)>0|player.buff.remains(432794)>0|player.buff.remains(432795)>0
  # Warlock - Havoc active (any target has Havoc debuff)
  havoc_active: active_dot.havoc>0
  # ============================================================================
  # Priest - Guardian pet aliases (GetTotemInfo-based)
  # NOTE: Totem spell IDs may differ from cast spell IDs - verify in-game if not working
  # ============================================================================
  pet.mindbender.active: totem.mindbender.up
  pet.mindbender.remains: totem.mindbender.remains
  pet.voidwraith.active: totem.voidwraith.up
  pet.voidwraith.remains: totem.voidwraith.remains
  pet.shadowfiend.active: totem.shadowfiend.up
  pet.shadowfiend.remains: totem.shadowfiend.remains

  # Warlock - Pet aliases (GetTotemInfo-based)
  # Darkglare: GetTotemInfo spellid=205180 (matches cast spell Summon Darkglare)
  pet.darkglare.active: totem.summon_darkglare.up
  pet.darkglare.remains: totem.summon_darkglare.remains
  # Infernal: GetTotemInfo spellid=111685 (NOT the cast spell 1122)
  # Must use numeric ID because SpellDB resolves "summon_infernal" to cast spell 1122,
  # but the totem entry uses spell ID 111685
  pet.infernal.active: totem.111685.up
  pet.infernal.remains: totem.111685.remains
  # Demonic Tyrant: GetTotemInfo spellid=265187 (matches cast spell Summon Demonic Tyrant)
  pet.demonic_tyrant.active: totem.summon_demonic_tyrant.up

  # ============================================================================
  # Paladin - Hammer of Light free cast detection
  # No in-game aura tracks the free state. The addon picks the hasRequiredAura=true
  # row from GetSpellPowerCost: 0 when the free proc is active, 5 otherwise.
  # .remains is bounded by the Hammer of Light ready buff (427441) lifetime,
  # since the free window can only exist while HoL is a castable finisher.
  # 427441 - buff hammer of light4
  # ============================================================================
  buff.hammer_of_light_free.up: (action.hammer_of_light.cost=0&buff.hammer_of_light.up)
  buff.hammer_of_light_free.remains: ((action.hammer_of_light.cost=0&buff.hammer_of_light.up)*buff.hammer_of_light.remains)
  pet.demonic_tyrant.remains: totem.summon_demonic_tyrant.remains