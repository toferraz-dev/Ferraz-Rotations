  # ============================================================================
  # Monk - Aspect of Harmony (Master of Harmony hero tree)
  # Same buff name "Aspect of Harmony" but three different spell IDs:
  #   Accumulator (450521) - "Harmony Collect"; up while a Vitality pool exists
  #   Spender     (450711) - 10s release window; bonus healing on next casts
  #   TFT         (450769) - empowered Harmony buff after Thunder Focus Tea
  # NOTE: Accumulator and Spender are NOT mutually exclusive — both can be up
  #       at the same time (you can keep storing while the spend window ticks).
  #       Do not use accumulator as a proxy for "not in spend phase".
  # ============================================================================
  buff.aspect_of_harmony_accumulator.up: player.buff.up(450521)
  # SimC's buff.aspect_of_harmony_accumulator.value is the pooled amount, compared
  # against a fraction of max health. In-game that number lives in the aura's point
  # vector (AuraData+0x28), which we expose as player.buff.<id>.points.N.
  # POINT INDEX UNVERIFIED: needs one snapshot taken with the accumulator up. If it
  # is wrong the Master of Harmony celestial_brew lines simply do not fire (the same
  # as the buff.450521.icon hack this replaces) -- fix it HERE, not in the rotation.
  buff.aspect_of_harmony_accumulator.value: player.buff.450521.points.1
  buff.aspect_of_harmony_spender.up: player.buff.up(450711)
  buff.aspect_of_harmony_tft.up: player.buff.up(450769)

