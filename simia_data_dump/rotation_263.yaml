  main:
    # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - skyfury,range_check=none,if=(buff.skyfury.down.any|action.skyfury.overlayed)&lastcast.skyfury>=10
    - lightning_shield,range_check=none,if=buff.lightning_shield.down
    - windfury_weapon,range_check=none,if=mainhand.enchant.remains<600
    - flametongue_weapon,range_check=none,if=offhand.enchant.remains<600
    - thunderstrike_ward,range_check=none,if=buff.thunderstrike_ward.down

    - healing_surge,range_check=none,if=health.pct<=config.healing_surge_OOC_hp_pct&!player.combat

    # Auto Ghost Wolf - Out of Combat
    - ghost_wolf,range_check=none,if=(config.ghost_wolf_mode=1|config.ghost_wolf_mode=2)&!player.combat&player.moving.time>1&buff.ghost_wolf.down

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # bloodlust,line_cd=600
    # - bloodlust,line_cd=600

    # Interrupts
    - wind_shear,if=interrupt.target.check
    - wind_shear.mouseover,if=interrupt.mouseover.check
    - wind_shear.focus,if=interrupt.focus.check

    # AoE Interrupt
    - capacitor_totem.player,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # Auto Ghost Wolf - Far Target (in combat)
    - ghost_wolf,range_check=none,if=config.ghost_wolf_mode=2&target.range>10&player.moving.time>1&buff.ghost_wolf.down

    # use_item,name=algethar_puzzle_box,if=(talent.ascendance.enabled&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds.enabled&!talent.ascendance.enabled&(cooldown.doom_winds.remains<2*gcd.max))|(fight_remains%%120<=20)
    - use_item,name=algethar_puzzle_box,if=(talent.ascendance&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds&!talent.ascendance&(cooldown.doom_winds.remains<2*gcd.max))|(fight_remains%%120<=20)
    # use_item,name=unyielding_netherprism,if=(talent.ascendance.enabled&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds.enabled&!talent.ascendance.enabled&(cooldown.doom_winds.remains<2*gcd.max))|fight_remains<=20
    - use_item,name=unyielding_netherprism,if=(talent.ascendance&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds&!talent.ascendance&(cooldown.doom_winds.remains<2*gcd.max))|fight_remains<=20
    # use_item,name=font_of_venomous_rage,if=!buff.ascendance.up&((!trinket.1.has_use_buff&!trinket.2.has_use_buff)|time>=20)
    # trinket.N.has_use_buff is a trinket property (not supported, stripped) - only the time>=20 leg
    # is kept, so the trinket waits out the opening window instead of firing on pull.
    - use_item,name=font_of_venomous_rage,if=!buff.ascendance.up&combat.time>=20
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # Rotation
    # call_action_list,name=single_sb,if=active_enemies=1&!talent.surging_totem.enabled
    - call_action_list,name=single_sb,if=var.enemies_count=1&!talent.surging_totem.enabled
    # call_action_list,name=single_totemic,if=active_enemies=1&talent.surging_totem.enabled
    - call_action_list,name=single_totemic,if=var.enemies_count=1&talent.surging_totem.enabled
    # call_action_list,name=aoe,if=active_enemies>1
    - call_action_list,name=aoe,if=var.enemies_count>1
    - lightning_bolt,if=target.range>=8&var.enemies_count=1
    - chain_lightning,if=target.range>=8&var.enemies_count>1