# =============================================================================
# Shaman Enhancement - Spec ID 263
# =============================================================================
# Surging Totem is detectable by a totem.

# Conversion notes - apply throughout this file:
#   pet.surging_totem.active -> totem.surging_totem.up (alias in _common.yaml)

version: 3
spec: 263
entry: main

movement_allowed: buff.spiritwalkers_grace.up

config:
  astral_shift_hp_pct:
    section: "Defensive HP Percentage"
    label: "Astral Shift HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  astral_shift_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Astral Shift (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  healing_surge_OOC_hp_pct:
    label: "Healing Surge OOC HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  healing_surge_solo_hp_pct:
    label: "Healing Surge (Solo)"
    type: slider
    min: 0
    max: 100
    default: 90

  healing_surge_group_hp_pct:
    label: "Healing Surge (Group)"
    type: slider
    min: 0
    max: 100
    default: 25

  ghost_wolf_mode:
    label: "Auto Ghost Wolf"
    type: dropdown
    options:
      - "Off"
      - "Out of Combat"
      - "OOC + Far Target"
    default: 1

variables:
  enemies_count: "(target.melee_gap<=0)*active_enemies+(target.melee_gap>0)*enemies_around_target"
  ti_chain_lightning: lastcast.chain_lightning < lastcast.lightning_bolt|!talent.thorims_invocation.enabled
  ti_lightning_bolt: lastcast.lightning_bolt < lastcast.chain_lightning|!talent.thorims_invocation.enabled

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - astral_shift,range_check=none,if=incoming.mitigated.pct>=config.astral_shift_dmg_pct

    # --- HP Percentage: react when already low ---
    - astral_shift,range_check=none,if=health.pct<=config.astral_shift_hp_pct
    - healing_surge,range_check=none,if=health.pct<=config.healing_surge_solo_hp_pct&buff.overflowing_maelstrom.stack>=10&player.solo
    - healing_surge,range_check=none,if=health.pct<=config.healing_surge_group_hp_pct&buff.overflowing_maelstrom.stack>=10&player.group

  # Upstream renamed this list buffs -> cooldowns (2026-08-16).
  cooldowns:
    # actions.cooldowns=/use_item,name=algethar_puzzle_box,if=(talent.ascendance.enabled&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds.enabled&!talent.ascendance.enabled&(cooldown.doom_winds.remains<2*gcd.max))|(fight_remains%%120<=20)
    # actions.cooldowns+=/use_item,name=unyielding_netherprism,if=(talent.ascendance.enabled&(cooldown.ascendance.remains<2*gcd.max))|(talent.doom_winds.enabled&!talent.ascendance.enabled&(cooldown.doom_winds.remains<2*gcd.max))|fight_remains<=20
    # Both named trinkets, and the generic trinket_1/trinket_2 fallbacks, are hoisted into main.
    # actions.cooldowns+=/use_item,slot=trinket1,if=!variable.trinket1_is_weird&((buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains<=20)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))|!trinket.1.has_use_buff)
    # actions.cooldowns+=/use_item,slot=trinket2,if=!variable.trinket2_is_weird&((buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains<=20)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))|!trinket.2.has_use_buff)
    # actions.cooldowns+=/use_item,name=font_of_venomous_rage,if=!buff.ascendance.up&((!trinket.1.has_use_buff&!trinket.2.has_use_buff)|time>=20)
    # actions.cooldowns+=/potion,if=(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains%%300<=30)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    # blood_fury,if=(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains%%action.blood_fury.cooldown<=action.blood_fury.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    - blood_fury,if=(buff.ascendance.up|buff.doom_winds.up|totem.surging_totem.up|(fight_remains%%action.blood_fury.cooldown<=action.blood_fury.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    # berserking,if=(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains%%action.berserking.cooldown<=action.berserking.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    - berserking,if=(buff.ascendance.up|buff.doom_winds.up|totem.surging_totem.up|(fight_remains%%action.berserking.cooldown<=action.berserking.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    # fireblood,if=(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains%%action.fireblood.cooldown<=action.fireblood.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    - fireblood,if=(buff.ascendance.up|buff.doom_winds.up|totem.surging_totem.up|(fight_remains%%action.fireblood.cooldown<=action.fireblood.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    # ancestral_call,if=(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active|(fight_remains%%action.ancestral_call.cooldown<=action.ancestral_call.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    - ancestral_call,if=(buff.ascendance.up|buff.doom_winds.up|totem.surging_totem.up|(fight_remains%%action.ancestral_call.cooldown<=action.ancestral_call.duration)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled))
    # actions.cooldowns+=/invoke_external_buff,name=power_infusion,if=((talent.deeply_rooted_elements.enabled&buff.ascendance.remains>7.5)|(!talent.deeply_rooted_elements.enabled&(buff.ascendance.up|buff.doom_winds.up|pet.surging_totem.active))|(fight_remains%%120<=20)|(!talent.ascendance.enabled&!talent.doom_winds.enabled&!talent.surging_totem.enabled)|cooldown.ascendance.remains<gcd.max)

  aoe:
    # voltaic_blaze,if=talent.surging_totem.enabled&dot.flame_shock.remains=0
    - voltaic_blaze,if=talent.surging_totem.enabled&dot.flame_shock.remains=0
    # flame_shock,if=!ticking
