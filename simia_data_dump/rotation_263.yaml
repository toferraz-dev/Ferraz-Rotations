    - voltaic_blaze
    # sundering
    - sundering
    # lava_lash
    - lava_lash
    # lightning_bolt,if=buff.maelstrom_weapon.stack>=8
    - lightning_bolt,if=buff.maelstrom_weapon.stack>=8
    # crash_lightning
    - crash_lightning
    # lightning_bolt,if=buff.maelstrom_weapon.stack>=5
    - lightning_bolt,if=buff.maelstrom_weapon.stack>=5
    # flame_shock
