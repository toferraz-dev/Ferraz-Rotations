# =============================================================================
# Druid - Balance - 102
# Based on: SimC default APL (midnight branch) + assisted_combat
# =============================================================================

version: 3
spec: 102

config:
  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40
  renewal_hp_pct:
    section: "Defensive HP Percentage"
    label: "Renewal HP%"
    type: slider
    min: 0
    max: 100
    default: 50
  regrowth_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (OOC) HP%"
    type: slider
    min: 0
    max: 100
    default: 70
  travel_form_mode:
    label: "Auto Travel Form (OOC)"
    type: checkbox
    default: true

variables:
  # Convenience eclipse state
  eclipse_up: "buff.eclipse_solar.up|buff.eclipse_lunar.up"
  # variable,name=eclipse_down,value=!buff.eclipse_lunar.up&!buff.eclipse_solar.up
  eclipse_down: "buff.eclipse_solar.down&buff.eclipse_lunar.down"
  # variable,name=no_weaver_procs,value=!buff.touch_the_cosmos.react&!buff.starweavers_warp.react
  no_weaver_procs: "!buff.touch_the_cosmos.react&!buff.starweavers_warp.react"
  # variable,name=ca_soon,value=cooldown.ca_inc.remains<3|cooldown.ca_inc.charges_fractional>1
  ca_soon: "(cooldown.celestial_alignment.remains<3|cooldown.incarnation_chosen_of_elune.remains<3)|(cooldown.celestial_alignment.charges_fractional>1|cooldown.incarnation_chosen_of_elune.charges_fractional>1)"
  # variable,name=ec,op=set,value=1,if=talent.boundless_moonlight
  ec: "talent.boundless_moonlight"
  # variable,name=opener,op=set,value=1 (precombat), then set to 0 when buff.ca_inc.up
  # Approximated: true when CA/Inc CD is 0 (ready and not yet pressed). Re-triggers each CA window as pre-CA ramp, which is acceptable.
  opener: "(talent.celestial_alignment|talent.incarnation_chosen_of_elune)&cooldown.celestial_alignment.remains=0&cooldown.incarnation_chosen_of_elune.remains=0"
  # variable,name=cd_window,value=cooldown.force_of_nature.remains>15|cooldown.ca_inc.remains<44
  cd_window: "cooldown.force_of_nature.remains>15|(cooldown.celestial_alignment.remains<44&cooldown.incarnation_chosen_of_elune.remains<44)"
  # variable,name=cd_window_narrow,value=cooldown.force_of_nature.remains>30|cooldown.ca_inc.remains>10&cooldown.ca_inc.remains<20
  cd_window_narrow: "cooldown.force_of_nature.remains>30|((cooldown.celestial_alignment.remains>10|cooldown.incarnation_chosen_of_elune.remains>10)&(cooldown.celestial_alignment.remains<20&cooldown.incarnation_chosen_of_elune.remains<20))"
  # variable,name=inc_charge,op=set,value=1,if=cooldown.ca_inc.charges_fractional<1
  inc_charge: "cooldown.celestial_alignment.charges_fractional<1|cooldown.incarnation_chosen_of_elune.charges_fractional<1"
  # variable,name=on_use_trinket — depends on trinket.N.has_use_buff (unsupported), not used

spell_overrides:
  celestial_alignment: "buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down"
  incarnation_chosen_of_elune: "buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down"

lists:
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10

    # Auto Travel Form
    - travel_form,range_check=none,if=config.travel_form_mode&!player.combat&player.inopenworld&mount_usable&buff.travel_form.down&!target.quest_mob&!target.dummy

    # Moonkin Form (skip if Fluid Form handles it)
    - moonkin_form,range_check=none,if=buff.moonkin_form.down&!talent.fluid_form
    - wrath,if=talent.fluid_form&buff.moonkin_form.down&(target.attackable|target.quest_mob)
    - starfire,if=talent.fluid_form&buff.moonkin_form.down&(target.attackable|target.quest_mob)

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - solar_beam,if=interrupt.target.check
    - solar_beam.mouseover,if=interrupt.mouseover.check
    - solar_beam.focus,if=interrupt.focus.check

    - call_action_list,name=auto_heal

    # Combat check
    - return,if=auto_combat.player

    # Named trinkets
    # use_item,name=wraps_of_cosmic_madness,if=!buff.eclipse.up
    - use_item,name=wraps_of_cosmic_madness,if=var.eclipse_down

    # Generic fallback trinkets
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # Racials
    # berserking,if=buff.ca_inc.up&(buff.harmony_of_the_grove.up|!talent.dream_surge)|fight_remains<cooldown.ca_inc.remains
    - berserking,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&(buff.harmony_of_the_grove.up|!talent.dream_surge)|fight_remains<(cooldown.celestial_alignment.remains>?cooldown.incarnation_chosen_of_elune.remains)
    - blood_fury,if=buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up
    - fireblood,if=buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up
    - ancestral_call,if=buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up

    # Opener sequences (pre-CA ramp)
    # run_action_list,name=opener_aoe,if=variable.opener&spell_targets>2
    - run_action_list,name=opener_aoe,if=var.opener&enemies_around_target>2
    # run_action_list,name=opener_kotg,if=variable.opener&spell_targets=1&talent.dream_surge
    - run_action_list,name=opener_kotg,if=var.opener&enemies_around_target<=1&talent.dream_surge
    # run_action_list,name=opener_ec,if=variable.opener&spell_targets=1
    - run_action_list,name=opener_ec,if=var.opener&enemies_around_target<=1

    # Branch by hero tree and target count
    # run_action_list,name=ec_st,if=hero_tree.elunes_chosen&spell_targets=1
    - run_action_list,name=ec_st,if=hero_tree.elunes_chosen&enemies_around_target<=1
    # run_action_list,name=kotg_st,if=spell_targets=1
    - run_action_list,name=kotg_st,if=enemies_around_target<=1
    # run_action_list,name=aoe,if=spell_targets>1
    - run_action_list,name=aoe,if=enemies_around_target>1

  # --------------------------------------------------------------------------
  # DEFENSIVES
  # --------------------------------------------------------------------------
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - barkskin,range_check=none,if=incoming.pct>=config.barkskin_dmg_pct

    # --- HP Percentage: react when already low ---
    - barkskin,range_check=none,if=health.pct<=config.barkskin_hp_pct
    - renewal,range_check=none,if=health.pct<=config.renewal_hp_pct
    - regrowth,range_check=none,if=health.pct<=config.regrowth_hp_pct&!player.combat

  # --------------------------------------------------------------------------
  # Elune's Chosen - Single Target
  # --------------------------------------------------------------------------
  ec_st:
    # celestial_alignment,if=buff.ca_inc.down&buff.ascendant_stars.down&(cooldown.convoke_the_spirits.remains<5&talent.convoke_the_spirits|cooldown.solar_eclipse.charges_fractional<1.5&!talent.convoke_the_spirits|!talent.elunes_guidance&talent.convoke_the_spirits)
    - celestial_alignment,delay=500,range_check=none,if=buff.ascendant_stars.down&(cooldown.convoke_the_spirits.remains<5&talent.convoke_the_spirits|cooldown.solar_eclipse.charges_fractional<1.5&!talent.convoke_the_spirits|!talent.elunes_guidance&talent.convoke_the_spirits)
    - incarnation_chosen_of_elune,delay=500,range_check=none,if=buff.ascendant_stars.down&(cooldown.convoke_the_spirits.remains<5&talent.convoke_the_spirits|cooldown.solar_eclipse.charges_fractional<1.5&!talent.convoke_the_spirits|!talent.elunes_guidance&talent.convoke_the_spirits)

    # moonfire,target_if=remains<2|refreshable&variable.eclipse_down
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    # sunfire,target_if=remains<2|refreshable&variable.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # convoke_the_spirits,if=buff.ca_inc.up&astral_power<40|cooldown.ca_inc.remains>30&buff.ca_inc.down|fight_remains<cooldown.ca_inc.remains
    - convoke_the_spirits,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&astral_power<40|(cooldown.celestial_alignment.remains>30|cooldown.incarnation_chosen_of_elune.remains>30)&buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down|fight_remains<(cooldown.celestial_alignment.remains>?cooldown.incarnation_chosen_of_elune.remains)

    # lunar_eclipse
    - lunar_eclipse,if=var.eclipse_down

    # starfall,if=buff.starweavers_warp.react
    - starfall,if=buff.starweavers_warp.react
    # starfall,if=(talent.starweaver&(buff.ca_inc.down&talent.meteorites&talent.stellar_amplification&(talent.aetherial_kindling|!talent.power_of_goldrinn)|buff.eclipse.down&(talent.meteorites|talent.aetherial_kindling|talent.stellar_amplification&!talent.power_of_goldrinn))|buff.ca_inc.down&talent.incarnation_chosen_of_elune&talent.meteorites&talent.stellar_amplification&talent.aetherial_kindling&!talent.power_of_goldrinn|buff.eclipse.down&(talent.meteorites|talent.incarnation_chosen_of_elune&talent.aetherial_kindling))&buff.touch_the_cosmos.react&!buff.starweavers_weft.react
    - starfall,if=(talent.starweaver&((buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down)&talent.meteorites&talent.stellar_amplification&(talent.aetherial_kindling|!talent.power_of_goldrinn)|var.eclipse_down&(talent.meteorites|talent.aetherial_kindling|talent.stellar_amplification&!talent.power_of_goldrinn))|(buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down)&talent.incarnation_chosen_of_elune&talent.meteorites&talent.stellar_amplification&talent.aetherial_kindling&!talent.power_of_goldrinn|var.eclipse_down&(talent.meteorites|talent.incarnation_chosen_of_elune&talent.aetherial_kindling))&buff.touch_the_cosmos.react&!buff.starweavers_weft.react

    # starsurge,if=astral_power>80|buff.eclipse.up&action.starsurge.cost>1|buff.starweavers_weft.react|buff.touch_the_cosmos.react
    # action.starsurge.cost>1 not supported; buff.eclipse.up&cost>1 approximated as !var.eclipse_down (cost increases during eclipse)
    - starsurge,if=astral_power>80|!var.eclipse_down|buff.starweavers_weft.react|buff.touch_the_cosmos.react

    # fury_of_elune,if=!talent.sundered_firmament|debuff.atmospheric_exposure.remains<2&buff.eclipse.remains>5|!talent.convoke_the_spirits|fight_remains<20
    - fury_of_elune,if=!talent.sundered_firmament|debuff.atmospheric_exposure.remains<2&(buff.eclipse_solar.remains>5|buff.eclipse_lunar.remains>5)|!talent.convoke_the_spirits|fight_remains<20

    # force_of_nature
    - force_of_nature

    # new_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    # energize_amount not supported; hardcoded: New Moon=10 AP; execute_time expanded
    - new_moon,if=astral_power.deficit>10&debuff.atmospheric_exposure.remains<action.new_moon.execute_time+0.5
    # half_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    - half_moon,if=astral_power.deficit>20&debuff.atmospheric_exposure.remains<action.half_moon.execute_time+0.5
    # full_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    - full_moon,if=astral_power.deficit>40&debuff.atmospheric_exposure.remains<action.full_moon.execute_time+0.5
    # wild_mushroom,if=buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.ca_inc.remains
    - wild_mushroom,if=buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<(cooldown.celestial_alignment.remains>?cooldown.incarnation_chosen_of_elune.remains)

    # starfire,if=action.starfire.execute_time<buff.eclipse.remains
    - starfire,if=action.starfire.execute_time<buff.eclipse.remains
    # wrath
    - wrath

  # --------------------------------------------------------------------------
  # Keeper of the Grove - Single Target
  # --------------------------------------------------------------------------
  kotg_st:
    # celestial_alignment,if=prev_gcd.1.force_of_nature&buff.ca_inc.down|fight_remains<20
    - celestial_alignment,delay=500,range_check=none,if=prev_gcd.1.force_of_nature|fight_remains<20
    - incarnation_chosen_of_elune,delay=500,range_check=none,if=prev_gcd.1.force_of_nature|fight_remains<20

    # moonfire,target_if=buff.harmony_of_the_grove.down&(remains<2|refreshable&!buff.eclipse.up&!cooldown.force_of_nature.remains<dot.moonfire.remains)
    # target_if dropped; !cooldown.force_of_nature.remains<dot.moonfire.remains parsed as: if FoN ready (remains=0) then 1<moonfire.remains, if FoN on CD then 0<moonfire.remains (always true)
    # Approximated as: cooldown.force_of_nature.remains>=debuff.moonfire.remains (don't dot if FoN about to come off after moonfire expires)
    - moonfire,if=buff.harmony_of_the_grove.down&(debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down&cooldown.force_of_nature.remains>=debuff.moonfire.remains)
    # sunfire,target_if=remains<2|refreshable&!buff.eclipse.up
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # fury_of_elune,if=(buff.harmony_of_the_grove.up|cooldown.force_of_nature.remains<gcd.max|talent.radiant_moonlight&cooldown.force_of_nature.remains>20)
    - fury_of_elune,if=buff.harmony_of_the_grove.up|cooldown.force_of_nature.remains<gcd.max|talent.radiant_moonlight&cooldown.force_of_nature.remains>20

    # solar_eclipse,if=cooldown.solar_eclipse.charges_fractional>1.5&variable.cd_window|cooldown.solar_eclipse.ready&variable.cd_window_narrow|fight_remains<20+(20*cooldown.ca_inc.ready)
    - solar_eclipse,if=var.eclipse_down&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow|fight_remains<20+(20*(cooldown.celestial_alignment.ready|cooldown.incarnation_chosen_of_elune.ready)))

    # force_of_nature,if=((buff.eclipse.down&!talent.early_spring|talent.early_spring)&(cooldown.eclipse.remains<gcd.max|cooldown.ca_inc.ready&(!talent.convoke_the_spirits|cooldown.convoke_the_spirits.remains<gcd.max*5)))|fight_remains<21
    - force_of_nature,if=((var.eclipse_down&!talent.early_spring|talent.early_spring)&((cooldown.solar_eclipse.remains<gcd.max)|(cooldown.celestial_alignment.ready|cooldown.incarnation_chosen_of_elune.ready)&(!talent.convoke_the_spirits|cooldown.convoke_the_spirits.remains<gcd.max*5)))|fight_remains<21

    # convoke_the_spirits,if=buff.ca_inc.up&astral_power<40|cooldown.ca_inc.remains>50&buff.harmony_of_the_grove.up&buff.ca_inc.down&astral_power<50|fight_remains<action.convoke_the_spirits.execute_time+1
    - convoke_the_spirits,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&astral_power<40|(cooldown.celestial_alignment.remains>50|cooldown.incarnation_chosen_of_elune.remains>50)&buff.harmony_of_the_grove.up&buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down&astral_power<50|fight_remains<action.convoke_the_spirits.execute_time+1

    # wrath,if=!talent.convoke_the_spirits&buff.ascendant_stars.down&astral_power<80&variable.no_weaver_procs&cooldown.force_of_nature.remains<15
    - wrath,if=!talent.convoke_the_spirits&buff.ascendant_stars.down&astral_power<80&var.no_weaver_procs&cooldown.force_of_nature.remains<15

    # sunfire,target_if=dot.sunfire.remains<10&variable.ca_soon&cooldown.force_of_nature.remains<3,line_cd=10
    # target_if dropped; line_cd not supported
    - sunfire,if=debuff.sunfire.remains<10&var.ca_soon&cooldown.force_of_nature.remains<3

    # starfall,if=buff.starweavers_warp.react
    - starfall,if=buff.starweavers_warp.react
    # starfall,if=(talent.starweaver&(talent.meteorites&(talent.incarnation_chosen_of_elune&talent.meteor_storm&!talent.power_of_goldrinn|buff.ca_inc.down&(talent.incarnation_chosen_of_elune|talent.stellar_amplification|!talent.power_of_goldrinn))|buff.eclipse.down&(talent.meteorites|talent.aetherial_kindling|talent.stellar_amplification&!talent.power_of_goldrinn))|buff.ca_inc.down&talent.meteorites&talent.aetherial_kindling&talent.stellar_amplification&!talent.power_of_goldrinn|buff.eclipse.down&talent.meteorites&(talent.aetherial_kindling|talent.stellar_amplification|!talent.power_of_goldrinn))&buff.touch_the_cosmos.react&!buff.starweavers_weft.react
    - starfall,if=(talent.starweaver&(talent.meteorites&(talent.incarnation_chosen_of_elune&talent.meteor_storm&!talent.power_of_goldrinn|(buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down)&(talent.incarnation_chosen_of_elune|talent.stellar_amplification|!talent.power_of_goldrinn))|var.eclipse_down&(talent.meteorites|talent.aetherial_kindling|talent.stellar_amplification&!talent.power_of_goldrinn))|(buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down)&talent.meteorites&talent.aetherial_kindling&talent.stellar_amplification&!talent.power_of_goldrinn|var.eclipse_down&talent.meteorites&(talent.aetherial_kindling|talent.stellar_amplification|!talent.power_of_goldrinn))&buff.touch_the_cosmos.react&!buff.starweavers_weft.react

    # starsurge,if=buff.eclipse.down&astral_power.deficit<20|buff.eclipse.up&action.starsurge.cost>1&(astral_power.deficit<10|cooldown.force_of_nature.remains>20|buff.ascendant_stars.up)|buff.touch_the_cosmos.react|buff.starweavers_weft.react
    # action.starsurge.cost>1 not supported; approximated as !var.eclipse_down (cost increases during eclipse)
    - starsurge,if=var.eclipse_down&astral_power.deficit<20|!var.eclipse_down&(astral_power.deficit<10|cooldown.force_of_nature.remains>20|buff.ascendant_stars.up)|buff.touch_the_cosmos.react|buff.starweavers_weft.react

    # starfire,if=buff.ascendant_fires.up&buff.eclipse_lunar.up
    - starfire,if=buff.ascendant_fires.up&buff.eclipse_lunar.up

    # new_moon,if=astral_power.deficit>energize_amount
    - new_moon,if=astral_power.deficit>10
    # half_moon,if=astral_power.deficit>energize_amount
    - half_moon,if=astral_power.deficit>20
    # full_moon,if=astral_power.deficit>energize_amount
    - full_moon,if=astral_power.deficit>40
    # wild_mushroom,if=buff.eclipse.up|cooldown.wild_mushroom.full_recharge_time<cooldown.ca_inc.remains
    - wild_mushroom,if=buff.eclipse_solar.up|buff.eclipse_lunar.up|cooldown.wild_mushroom.full_recharge_time<(cooldown.celestial_alignment.remains>?cooldown.incarnation_chosen_of_elune.remains)

    # wrath
    - wrath

  # --------------------------------------------------------------------------
  # AoE (2+ targets)
  # --------------------------------------------------------------------------
  aoe:
    # celestial_alignment,if=prev_gcd.1.force_of_nature&!variable.ec|variable.ec&prev_gcd.1.fury_of_elune&buff.eclipse.down&(variable.on_use_trinket=0|trinket.1.cooldown.remains>60|...)|fight_remains<20
    # on_use_trinket and all trinket property conditions stripped (unsupported)
    - celestial_alignment,delay=500,range_check=none,if=prev_gcd.1.force_of_nature&!var.ec|var.ec&prev_gcd.1.fury_of_elune&var.eclipse_down|fight_remains<20
    - incarnation_chosen_of_elune,delay=500,range_check=none,if=prev_gcd.1.force_of_nature&!var.ec|var.ec&prev_gcd.1.fury_of_elune&var.eclipse_down|fight_remains<20

    # eclipse,if=cooldown.eclipse.full_recharge_time<gcd.max
    # bare `eclipse` expanded to both solar/lunar — dump whichever charge is about to overcap
    - solar_eclipse,if=cooldown.solar_eclipse.full_recharge_time<gcd.max
    - lunar_eclipse,if=cooldown.lunar_eclipse.full_recharge_time<gcd.max

    # moonfire,target_if=remains<2|refreshable&variable.eclipse_down
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    # sunfire,target_if=remains<2|refreshable&variable.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down

    # Enter correct eclipse (dream_surge mechanic)
    # wrath,if=eclipse.lunar&spell_targets<=2&talent.dream_surge&buff.eclipse.down
    # eclipse.lunar not supported (SimC state machine direction); approximated by target count intent (2 targets → build solar)
    - wrath,if=enemies_around_target<=2&talent.dream_surge&var.eclipse_down
    # starfire,if=eclipse.solar&spell_targets>2&talent.dream_surge&buff.eclipse.down
    # eclipse.solar not supported; approximated by target count intent (3+ targets → build lunar)
    - starfire,if=enemies_around_target>2&talent.dream_surge&var.eclipse_down

    # fury_of_elune,if=variable.ec|!variable.ec&(buff.harmony_of_the_grove.up|cooldown.force_of_nature.remains<gcd.max|talent.radiant_moonlight&cooldown.force_of_nature.remains>20)
    # Simplified: ec|(!ec&X) = ec|X
    - fury_of_elune,if=var.ec|buff.harmony_of_the_grove.up|cooldown.force_of_nature.remains<gcd.max|talent.radiant_moonlight&cooldown.force_of_nature.remains>20

    # force_of_nature,if=((buff.eclipse.down&!talent.early_spring|talent.early_spring)&(cooldown.eclipse.remains<gcd.max|cooldown.ca_inc.ready&(!talent.convoke_the_spirits|cooldown.convoke_the_spirits.remains<gcd.max*5)))|fight_remains<21
    - force_of_nature,if=((var.eclipse_down&!talent.early_spring|talent.early_spring)&((cooldown.solar_eclipse.remains<gcd.max)|(cooldown.celestial_alignment.ready|cooldown.incarnation_chosen_of_elune.ready)&(!talent.convoke_the_spirits|cooldown.convoke_the_spirits.remains<gcd.max*5)))|fight_remains<21

    # solar_eclipse,if=spell_targets<=2&(cooldown.solar_eclipse.charges_fractional>1.5&variable.cd_window|cooldown.solar_eclipse.ready&variable.cd_window_narrow)&target.time_to_die>5|fight_remains<15
    - solar_eclipse,if=enemies_around_target<=2&var.eclipse_down&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow)&target.time_to_die>5|fight_remains<15

    # lunar_eclipse,if=!variable.prio&spell_targets>2&!variable.ec&(cooldown.solar_eclipse.charges_fractional>1.5&variable.cd_window|cooldown.solar_eclipse.ready&variable.cd_window_narrow)|variable.ec&(cooldown.ca_inc.full_recharge_time>15)|fight_remains<15
    # prio=0 (constant), so !prio is always true; ca_inc expanded
    - lunar_eclipse,if=var.eclipse_down&(enemies_around_target>2&!var.ec&(cooldown.solar_eclipse.charges_fractional>1.5&var.cd_window|cooldown.solar_eclipse.ready&var.cd_window_narrow)|var.ec&(cooldown.celestial_alignment.full_recharge_time>15|cooldown.incarnation_chosen_of_elune.full_recharge_time>15)|fight_remains<15)

    # convoke_the_spirits,if=buff.ca_inc.up&astral_power<40|cooldown.ca_inc.remains>50&buff.harmony_of_the_grove.up&buff.ca_inc.down
    - convoke_the_spirits,if=(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)&astral_power<40|(cooldown.celestial_alignment.remains>50|cooldown.incarnation_chosen_of_elune.remains>50)&buff.harmony_of_the_grove.up&buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down

    # wrath,if=!talent.convoke_the_spirits&spell_targets<3&buff.ascendant_stars.down&astral_power<80&variable.no_weaver_procs&cooldown.force_of_nature.remains<15
    - wrath,if=!talent.convoke_the_spirits&enemies_around_target<3&buff.ascendant_stars.down&astral_power<80&var.no_weaver_procs&cooldown.force_of_nature.remains<15

    # sunfire,target_if=!talent.aetherial_kindling&dot.sunfire.remains<10&variable.ca_soon&cooldown.force_of_nature.remains<3,line_cd=10
    # target_if dropped; line_cd not supported
    - sunfire,if=!talent.aetherial_kindling&debuff.sunfire.remains<10&var.ca_soon&cooldown.force_of_nature.remains<3

    # starfall,if=(astral_power>80|buff.eclipse.up&action.starfall.cost>1|buff.touch_the_cosmos.react|!buff.starweavers_weft.react)&target.time_to_die>5
    # action.starfall.cost>1 not supported; buff.eclipse.up&cost>1 approximated as !var.eclipse_down
    - starfall,if=(astral_power>80|!var.eclipse_down|buff.touch_the_cosmos.react|!buff.starweavers_weft.react)&target.time_to_die>5
    # starsurge,if=buff.starweavers_weft.react
    - starsurge,if=buff.starweavers_weft.react

    # starfire,if=buff.ascendant_fires.up&buff.eclipse_lunar.up
    - starfire,if=buff.ascendant_fires.up&buff.eclipse_lunar.up

    # new_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    - new_moon,if=astral_power.deficit>10&debuff.atmospheric_exposure.remains<action.new_moon.execute_time+0.5
    # half_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    - half_moon,if=astral_power.deficit>20&debuff.atmospheric_exposure.remains<action.half_moon.execute_time+0.5
    # full_moon,if=astral_power.deficit>energize_amount&debuff.atmospheric_exposure.remains<execute_time+0.5
    - full_moon,if=astral_power.deficit>40&debuff.atmospheric_exposure.remains<action.full_moon.execute_time+0.5
    # wild_mushroom,if=buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<cooldown.ca_inc.remains
    - wild_mushroom,if=buff.eclipse_solar.up|cooldown.wild_mushroom.full_recharge_time<(cooldown.celestial_alignment.remains>?cooldown.incarnation_chosen_of_elune.remains)

    # starfire,if=variable.ec|variable.eclipse_down&spell_targets.starfire>2|buff.eclipse_lunar.up&(spell_targets.starfire>2&buff.ca_inc.up|!buff.ca_inc.up)
    - starfire,if=var.ec|var.eclipse_down&enemies_around_target>2|buff.eclipse_lunar.up&(enemies_around_target>2&(buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up)|buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down)
    # wrath
    - wrath

  # --------------------------------------------------------------------------
  # Opener AoE (3+ targets, before first CA press)
  # --------------------------------------------------------------------------
  opener_aoe:
    # moonfire,target_if=refreshable
    - moonfire,if=debuff.moonfire.refreshable
    # sunfire,target_if=refreshable
    - sunfire,if=debuff.sunfire.refreshable
    # potion (deleted — not supported)
    # eclipse,if=cooldown.eclipse.charges=2
    # bare `eclipse` expanded to both — dump if either has 2+ charges
    - solar_eclipse,if=cooldown.solar_eclipse.charges_fractional>=2
    - lunar_eclipse,if=cooldown.lunar_eclipse.charges_fractional>=2
    # starsurge,if=buff.starweavers_weft.react&buff.ascendant_stars.up&target.time_to_die>cooldown.ca_inc.duration+10
    - starsurge,if=buff.starweavers_weft.react&buff.ascendant_stars.up&target.time_to_die>(cooldown.celestial_alignment.duration>?cooldown.incarnation_chosen_of_elune.duration)+10
    # starfall,if=(action.starfall.cost>1|buff.touch_the_cosmos.react|buff.starweavers_warp.react)&buff.ascendant_stars.up&target.time_to_die>cooldown.ca_inc.duration+10
    # action.starfall.cost>1 not supported; approximated with var.eclipse_down (cost higher outside eclipse)
    - starfall,if=(var.eclipse_down|buff.touch_the_cosmos.react|buff.starweavers_warp.react)&buff.ascendant_stars.up&target.time_to_die>(cooldown.celestial_alignment.duration>?cooldown.incarnation_chosen_of_elune.duration)+10
    # starfire,if=(buff.ascendant_stars.up&astral_power.deficit>40-(20*talent.fury_of_elune+20*talent.force_of_nature))&buff.eclipse_lunar.up
    - starfire,if=(buff.ascendant_stars.up&astral_power.deficit>40-(20*talent.fury_of_elune+20*talent.force_of_nature))&buff.eclipse_lunar.up
    # wrath,if=buff.ascendant_stars.up&astral_power.deficit>40-(20*talent.fury_of_elune+20*talent.force_of_nature)
    - wrath,if=buff.ascendant_stars.up&astral_power.deficit>40-(20*talent.fury_of_elune+20*talent.force_of_nature)
    # sunfire,line_cd=10,target_if=!talent.aetherial_kindling|remains<5
    # target_if dropped; line_cd not supported
    - sunfire,if=!talent.aetherial_kindling|debuff.sunfire.remains<5
    # fury_of_elune
    - fury_of_elune
    # force_of_nature
    - force_of_nature
    # use_items,check_existing=0 — slot-based fallback (check_existing=0 not applicable, generic sync used)
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync
    # celestial_alignment,add_queue_lag=1
    # add_queue_lag not supported; delay=500 already applies a similar nudge
    - celestial_alignment,delay=500,range_check=none
    - incarnation_chosen_of_elune,delay=500,range_check=none

  # --------------------------------------------------------------------------
  # Opener EC (Elune's Chosen, 1 target, before first CA press)
  # --------------------------------------------------------------------------
  opener_ec:
    # moonfire,target_if=remains<2|refreshable&variable.eclipse_down
    - moonfire,if=debuff.moonfire.remains<2|debuff.moonfire.refreshable&var.eclipse_down
    # sunfire,target_if=remains<2|refreshable&variable.eclipse_down
    - sunfire,if=debuff.sunfire.remains<2|debuff.sunfire.refreshable&var.eclipse_down
    # eclipse (EC typically enters Lunar Eclipse first)
    - lunar_eclipse,if=var.eclipse_down
    - solar_eclipse,if=var.eclipse_down
    # starsurge,if=(action.starsurge.cost>1|buff.touch_the_cosmos.react)&talent.convoke_the_spirits
    # action.starsurge.cost>1 not supported; approximated with var.eclipse_down
    - starsurge,if=(var.eclipse_down|buff.touch_the_cosmos.react)&talent.convoke_the_spirits
    # starfire,if=astral_power<80&!talent.convoke_the_spirits
    - starfire,if=astral_power<80&!talent.convoke_the_spirits
    # fury_of_elune
    - fury_of_elune
    # celestial_alignment
    - celestial_alignment,delay=500,range_check=none
    - incarnation_chosen_of_elune,delay=500,range_check=none

  # --------------------------------------------------------------------------
  # Opener KotG (Keeper of the Grove, 1 target, talent.dream_surge, before first CA press)
  # --------------------------------------------------------------------------
  opener_kotg:
    # sunfire,target_if=refreshable
    - sunfire,if=debuff.sunfire.refreshable
    # moonfire,target_if=refreshable&!talent.natures_balance&!talent.convoke_the_spirits
    - moonfire,if=debuff.moonfire.refreshable&!talent.natures_balance&!talent.convoke_the_spirits
    # eclipse,if=!talent.natures_balance&!talent.convoke_the_spirits (KotG enters Solar Eclipse first)
    - solar_eclipse,if=!talent.natures_balance&!talent.convoke_the_spirits&var.eclipse_down
    - lunar_eclipse,if=!talent.natures_balance&!talent.convoke_the_spirits&var.eclipse_down
    # wrath,if=astral_power<100-20*talent.fury_of_elune&!talent.natures_balance&!talent.convoke_the_spirits
    - wrath,if=astral_power<100-20*talent.fury_of_elune&!talent.natures_balance&!talent.convoke_the_spirits
    # fury_of_elune
    - fury_of_elune
    # force_of_nature
    - force_of_nature
    # celestial_alignment
    - celestial_alignment,delay=500,range_check=none
    - incarnation_chosen_of_elune,delay=500,range_check=none
