# =============================================================================
# Druid - Balance - 102
# Based on: SimC default APL (midnight branch)
# =============================================================================

version: 3
spec: 102

config:
  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40
  renewal_hp_pct:
    section: "Defensive HP Percentage"
    label: "Renewal HP%"
    type: slider
    min: 0
    max: 100
    default: 50
  regrowth_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (OOC) HP%"
    type: slider
    min: 0
    max: 100
    default: 70
  travel_form_mode:
    label: "Auto Travel Form (OOC)"
    type: checkbox
    default: true

# Combat-start values of the action-line variables (SimC precombat).
# actions.precombat+=/variable,name=opener,value=1
variable:
  opener: 1

variables:
  # --- SimC aggregate aliases -------------------------------------------------
  # SimC's `eclipse` action / `buff.eclipse` / `cooldown.eclipse` cover both halves.
  # Solar and Lunar Eclipse are two castables on one shared cooldown with mutually
  # exclusive ready() (lunar_eclipse_override), so they stay two separate lines here.
  # `<?` is MAX, which ignores the 0 the unavailable half reports.
  eclipse_up: "buff.eclipse_solar.up|buff.eclipse_lunar.up"
  eclipse_down: "buff.eclipse_solar.down&buff.eclipse_lunar.down"
  eclipse_remains: "buff.eclipse_solar.remains<?buff.eclipse_lunar.remains"
  eclipse_duration: "buff.eclipse_solar.duration<?buff.eclipse_lunar.duration"
  eclipse_cd_remains: "cooldown.solar_eclipse.remains<?cooldown.lunar_eclipse.remains"
  eclipse_cd_duration: "cooldown.solar_eclipse.duration<?cooldown.lunar_eclipse.duration"
  eclipse_full_recharge_time: "cooldown.solar_eclipse.full_recharge_time<?cooldown.lunar_eclipse.full_recharge_time"
  eclipse_charges_fractional: "cooldown.solar_eclipse.charges_fractional<?cooldown.lunar_eclipse.charges_fractional"
  eclipse_ready: "var.eclipse_charges_fractional>=1"
  eclipse_last_used: "action.solar_eclipse.last_used<?action.lunar_eclipse.last_used"

  # SimC's `ca_inc` is whichever of Celestial Alignment / Incarnation is talented.
  # `<?` is MAX so the untalented one's 0 never wins. Buff duration and ready are
  # talent-selected: both report a value while untalented (15s vs 20s DBC).
  ca_inc_up: "buff.celestial_alignment.up|buff.incarnation_chosen_of_elune.up"
  ca_inc_down: "buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down"
  ca_inc_remains: "cooldown.celestial_alignment.remains<?cooldown.incarnation_chosen_of_elune.remains"
  ca_inc_full_recharge_time: "cooldown.celestial_alignment.full_recharge_time<?cooldown.incarnation_chosen_of_elune.full_recharge_time"
  ca_inc_cd_duration: "cooldown.celestial_alignment.duration<?cooldown.incarnation_chosen_of_elune.duration"
  ca_inc_base_duration: "cooldown.celestial_alignment.base_duration<?cooldown.incarnation_chosen_of_elune.base_duration"
  ca_inc_ready: "talent.incarnation_chosen_of_elune*cooldown.incarnation_chosen_of_elune.ready+!talent.incarnation_chosen_of_elune*cooldown.celestial_alignment.ready"
  ca_inc_buff_remains: "buff.celestial_alignment.remains<?buff.incarnation_chosen_of_elune.remains"
  ca_inc_buff_duration: "talent.incarnation_chosen_of_elune*buff.102560.duration+!talent.incarnation_chosen_of_elune*buff.194223.duration"

  # Potion is never cast here (CLAUDE.md 1.5), so its cooldown is always 0.
  potion_cd_remains: "0"

  # --- SimC precombat variables -------------------------------------------------
  # variable,name=no_cd_talent,value=!talent.celestial_alignment&!talent.incarnation_chosen_of_elune|druid.no_cds
  # Never read by any APL line upstream - not converted.
  # variable,name=anchor_cd,value=hero_tree.keeper_of_the_grove&talent.force_of_nature|hero_tree.elunes_chosen&talent.fury_of_elune&!talent.lunation
  anchor_cd: "hero_tree.keeper_of_the_grove&talent.force_of_nature|hero_tree.elunes_chosen&talent.fury_of_elune&!talent.lunation"
  # variable,name=on_use_trinket,value=0
  # variable,name=on_use_trinket,op=add,value=trinket.1.has_use_buff
  # variable,name=on_use_trinket,op=add,value=(trinket.2.has_use_buff)*2
  # trinket.N.has_use_buff is a trinket property (1.5) - always 0.
  on_use_trinket: "0"
  # variable,name=prio,value=0
  # Never read by any APL line upstream - not converted.

  # Base values the engine has no expression for (sc_spell_data.inc):
  # action.starsurge.base_cost 40, action.starfall.base_cost 50. energize_amount: Force of Nature 20,
  # Moonfire / Sunfire / Wrath 6 (0 base + 6 from 197911), Starfire 8, New / Half / Full Moon 10 / 20 / 40,
  # Wild Mushroom min(20, (targets+1)*5) (sc_druid.cpp WILD_MUSHROOM_AP_PER_HIT).
  # buff.starlord.at_max_stacks -> buff.starlord.stack>=3 (279709 CumulativeAura 3).
  # .duration on a down aura reads the resolved id's DBC value, so colliding names are pinned:
  # Fury of Elune 202770, Harmony of the Grove 428735, Berserking 26297, Starlord 279709, Fungal Growth 81281.

spell_overrides:
  celestial_alignment: "buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down"
  incarnation_chosen_of_elune: "buff.celestial_alignment.down&buff.incarnation_chosen_of_elune.down"
  # local addition: SimC's eclipse_base_t::ready() (sc_druid.cpp:7154) refuses the cast
  # when the eclipse it would apply is already up. Celestial Alignment / Incarnation
  # triggers BOTH eclipse buffs for their whole duration (celestial_alignment_buff_t::trigger,
  # :3142), so every eclipse line stays suggestible while the game refuses the cast and the
  # rotation stalls. Gated here rather than per line (2.9) - 12 call sites across 6 lists.
  solar_eclipse: "buff.eclipse_solar.down"
  lunar_eclipse: "buff.eclipse_lunar.down"

lists:
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Action-line variables sit above anything that can win the pick, so every
    # decision updates them (SimC runs them on every APL pass).
