    - variable,name=passive_asp,value=(2+2*set_bonus.mid1_2pc*var.eclipse_down)*(dot.moonfire.ticking+dot.sunfire.ticking+buff.solstice.up*((active_dot.moonfire>4)+(active_dot.moonfire>16)+(active_dot.sunfire>4)+(active_dot.sunfire>16)))%spell_haste+talent.natures_balance+buff.fury_of_elune.up*((floor(buff.fury_of_elune.remains%0.5)>?4)*2.5+talent.the_eternal_moon*(buff.fury_of_elune.remains<2)*6)+buff.sundered_firmament.up*((floor(buff.sundered_firmament.remains%0.5)>?4)*0.6+talent.the_eternal_moon*(buff.sundered_firmament.remains<2)*6)
