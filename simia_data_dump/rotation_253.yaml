
# =============================================================================
# Hunter - Beast Mastery - Spec ID 253
# =============================================================================

# Conversion notes - apply throughout this file:
#   at_max_stacks unsupported: Cobra Fang (1299389) caps at 4 stacks

version: 3
spec: 253

config:
  survival_of_the_fittest_hp_pct:
    label: "Survival of the Fittest"
    type: slider
    min: 0
    max: 100
    default: 50

  aspect_of_the_turtle_hp_pct:
    label: "Aspect of the Turtle"
    type: slider
    min: 0
    max: 100
    default: 30

  exhilaration_hp_pct:
    label: "Exhilaration"
    type: slider
    min: 0
    max: 100
    default: 50

  mend_pet_high_prio_hp_pct:
    section: "Pet Management"
    label: "Mend Pet High Priority"
    type: slider
    min: 0
    max: 100
    default: 40

  mend_pet_low_prio_hp_pct:
    section: "Pet Management"
    label: "Mend Pet Low Priority"
    type: slider
    min: 0
    max: 100
    default: 80

  call_pet_number:
    section: "Pet Management"
    label: "Call Pet Number"
    type: slider
    min: 1
    max: 5
    default: 1

variables:

lists:
  # ==========================================================================
  # TRINKETS
  # ==========================================================================
  trinkets:
    # use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_damage
    # use_items,check_existing=0,slots=trinket1:trinket2,if=this_trinket.has_use_buff
    # local retention: upstream DELETED all ten named use_item lines below on the 2026-08-20
    # refresh and now emits only the two generic use_items lines above (trinket property math,
    # unsupported here). The named lines are kept deliberately -- they express the same
    # Bestial-Wrath sync intent that the generic lines cannot. Expect these to keep showing up
    # in a reverse-parity (stale) sweep; that is correct, not drift.
    # use_item,name=light_company_guidon,if=cooldown.bestial_wrath.ready|fight_remains<21
    - use_item,name=light_company_guidon,if=cooldown.bestial_wrath.ready|fight_remains<21
    # use_item,name=void_execution_mandate,if=cooldown.bestial_wrath.ready|fight_remains<21
    - use_item,name=void_execution_mandate,if=cooldown.bestial_wrath.ready|fight_remains<21
    # use_item,name=algethar_puzzle_box,if=cooldown.bestial_wrath.remains<2|fight_remains<23
    - use_item,name=algethar_puzzle_box,if=cooldown.bestial_wrath.remains<2|fight_remains<23
    # use_item,name=emberwing_feather,if=cooldown.bestial_wrath.ready|fight_remains<16
    - use_item,name=emberwing_feather,if=cooldown.bestial_wrath.ready|fight_remains<16
    # use_item,name=freightrunners_flask,if=cooldown.bestial_wrath.ready|fight_remains<16
    - use_item,name=freightrunners_flask,if=cooldown.bestial_wrath.ready|fight_remains<16
    # use_item,name=sealed_chaos_urn,if=cooldown.bestial_wrath.ready|fight_remains<21
    - use_item,name=sealed_chaos_urn,if=cooldown.bestial_wrath.ready|fight_remains<21
    # use_item,name=evercollapsing_void_fissure,if=cooldown.bestial_wrath.ready|fight_remains<11
    - use_item,name=evercollapsing_void_fissure,if=cooldown.bestial_wrath.ready|fight_remains<11
    # use_item,name=rangercaptains_iridescent_insignia
    - use_item,name=rangercaptains_iridescent_insignia
    # use_item,name=void_stalkers_contract
    - use_item,name=void_stalkers_contract
    # use_item,name=latchs_crooked_hook
    - use_item,name=latchs_crooked_hook
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  # ==========================================================================
  # CDS
  # ==========================================================================
  cds:
    # invoke_external_buff,name=power_infusion,if=buff.bestial_wrath.up|cooldown.bestial_wrath.remains<30|fight_remains<16
    # External buffs not supported — removed

    # berserking,if=cooldown.bestial_wrath.ready|fight_remains<13
    - berserking,if=cooldown.bestial_wrath.ready|fight_remains<13
    # blood_fury,if=cooldown.bestial_wrath.ready|fight_remains<16
    - blood_fury,if=cooldown.bestial_wrath.ready|fight_remains<16
    # ancestral_call,if=cooldown.bestial_wrath.ready|fight_remains<16
    - ancestral_call,if=cooldown.bestial_wrath.ready|fight_remains<16
    # fireblood,if=cooldown.bestial_wrath.ready|fight_remains<9
    - fireblood,if=cooldown.bestial_wrath.ready|fight_remains<9

    # potion,if=cooldown.bestial_wrath.ready|fight_remains<31
    # Potions not supported — removed

  # ==========================================================================
  # ST (non-Dark Ranger)
  # ==========================================================================
  st:
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage,if=cooldown.bestial_wrath.remains<gcd|full_recharge_time<gcd
    - barbed_shot,if=cooldown.bestial_wrath.remains<gcd|cooldown.barbed_shot.full_recharge_time<gcd
    # bestial_wrath
    - bestial_wrath
    # wild_thrash,if=active_enemies>1
    - wild_thrash,if=enemies_around_target>1
    # kill_command,if=howl_summon.ready|(cooldown.bestial_wrath.remains>full_recharge_time+gcd&buff.natures_ally.react|!apex.3)&(buff.howl_of_the_pack_leader_cooldown.remains>4|cooldown.kill_command.charges_fractional>1.8)
    # howl_of_the_pack_leader_cooldown = 471877 (SimC-internal label, sc_hunter.cpp:7947)
    - kill_command,if=howl_summon.ready|(cooldown.bestial_wrath.remains>cooldown.kill_command.full_recharge_time+gcd&buff.natures_ally.react|talent.pack_leader.rank<4)&(buff.471877.remains>4|cooldown.kill_command.charges_fractional>1.8)
    # cobra_shot,if=buff.cobra_fang.at_max_stacks
    - cobra_shot,if=buff.cobra_fang.stack>=4
    # barbed_shot,if=(focus<75|full_recharge_time<gcd)&!talent.serpentine_strikes|talent.serpentine_strikes
    - barbed_shot,if=(focus<75|cooldown.barbed_shot.full_recharge_time<gcd)&!talent.serpentine_strikes|talent.serpentine_strikes
    # cobra_shot,if=cooldown.bestial_wrath.remains>gcd
    - cobra_shot,if=cooldown.bestial_wrath.remains>gcd

  # ==========================================================================
  # CLEAVE (non-Dark Ranger)
  # ==========================================================================
  cleave:
    # Bestial Wrath spawns an Apex Pet which casts Bestial Wrath 1.5s after, but it does not get the Beast Cleave that was active prior to Bestial Wrath. Therefore, to ensure this hit cleaves, Wild Thrash needs to follow up Bestial Wrath.
    # wild_thrash,if=talent.beast_cleave&(prev_gcd.1.bestial_wrath|!buff.beast_cleave.up)
    - wild_thrash,if=talent.beast_cleave&(prev_gcd.1.bestial_wrath|!buff.beast_cleave.up)
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage,if=full_recharge_time<gcd
    - barbed_shot,if=cooldown.barbed_shot.full_recharge_time<gcd
    # bestial_wrath,if=buff.beast_cleave.remains|!talent.beast_cleave|!talent.wild_thrash
    - bestial_wrath,if=buff.beast_cleave.remains|!talent.beast_cleave|!talent.wild_thrash
    # wild_thrash,if=talent.beast_cleave&cooldown.bestial_wrath.remains>buff.beast_cleave.remains|!talent.beast_cleave
    - wild_thrash,if=talent.beast_cleave&cooldown.bestial_wrath.remains>buff.beast_cleave.remains|!talent.beast_cleave
    # kill_command,if=buff.natures_ally.react|talent.master_handler&(active_enemies>3|howl_summon.ready)|!apex.3
    - kill_command,if=buff.natures_ally.react|talent.master_handler&(enemies_around_target>3|howl_summon.ready)|talent.pack_leader.rank<4
    # cobra_shot,if=buff.cobra_fang.up&buff.beast_cleave.remains
    - cobra_shot,if=buff.cobra_fang.up&buff.beast_cleave.remains
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage
    - barbed_shot
    # cobra_shot,if=talent.beast_cleave&cooldown.wild_thrash.remains>gcd|!talent.beast_cleave
    - cobra_shot,if=talent.beast_cleave&cooldown.wild_thrash.remains>gcd|!talent.beast_cleave

  # ==========================================================================
  # DRST (Dark Ranger ST)
  # ==========================================================================
  drst:
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage,if=(talent.bloody_frenzy&talent.snakeskin_quiver&talent.jagged_wounds)&cooldown.bestial_wrath.remains<2*gcd
    - barbed_shot,if=(talent.bloody_frenzy&talent.snakeskin_quiver&talent.jagged_wounds)&cooldown.bestial_wrath.remains<2*gcd
    # bestial_wrath
    - bestial_wrath
    # black_arrow,if=buff.withering_fire.up&cooldown.kill_command.full_recharge_time>gcd
    - black_arrow,if=buff.withering_fire.up&cooldown.kill_command.full_recharge_time>gcd
    # kill_command,if=cooldown.bestial_wrath.remains>full_recharge_time+gcd&buff.natures_ally.react|!apex.3
    - kill_command,if=cooldown.bestial_wrath.remains>cooldown.kill_command.full_recharge_time+gcd&buff.natures_ally.react|talent.pack_leader.rank<4
    # wailing_arrow,if=buff.withering_fire.remains<execute_time+2*gcd|time_to_die.remains<execute_time+gcd
    - wailing_arrow,if=buff.withering_fire.remains<action.wailing_arrow.execute_time+2*gcd|time_to_die<action.wailing_arrow.execute_time+gcd
    # cobra_shot,if=buff.cobra_fang.at_max_stacks
    - cobra_shot,if=buff.cobra_fang.stack>=4
    # cobra_shot,if=talent.killer_cobra&buff.bestial_wrath.up&cooldown.barbed_shot.charges_fractional<1.4
    - cobra_shot,if=talent.killer_cobra&buff.bestial_wrath.up&cooldown.barbed_shot.charges_fractional<1.4
    # black_arrow
    - black_arrow
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage
    - barbed_shot
    # cobra_shot,if=cooldown.bestial_wrath.remains>gcd
    - cobra_shot,if=cooldown.bestial_wrath.remains>gcd

  # ==========================================================================
  # DRCLEAVE (Dark Ranger Cleave)
  # ==========================================================================
  drcleave:
    # black_arrow,if=buff.beast_cleave.remains<gcd&cooldown.bestial_wrath.remains<gcd&active_enemies>2
    - black_arrow,if=buff.beast_cleave.remains<gcd&cooldown.bestial_wrath.remains<gcd&enemies_around_target>2
    # bestial_wrath,if=buff.beast_cleave.remains|!talent.beast_cleave
    - bestial_wrath,if=buff.beast_cleave.remains|!talent.beast_cleave
    # wild_thrash,if=talent.beast_cleave&(prev_gcd.1.bestial_wrath|!buff.beast_cleave.up|cooldown.bestial_wrath.remains>buff.beast_cleave.remains)|!talent.beast_cleave
    - wild_thrash,if=talent.beast_cleave&(prev_gcd.1.bestial_wrath|!buff.beast_cleave.up|cooldown.bestial_wrath.remains>buff.beast_cleave.remains)|!talent.beast_cleave
    # kill_command,if=cooldown.bestial_wrath.remains>full_recharge_time+gcd&buff.natures_ally.react|!apex.3
    - kill_command,if=cooldown.bestial_wrath.remains>cooldown.kill_command.full_recharge_time+gcd&buff.natures_ally.react|talent.pack_leader.rank<4
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage,if=full_recharge_time<1*gcd
    - barbed_shot,if=cooldown.barbed_shot.full_recharge_time<1*gcd
    # black_arrow,if=buff.withering_fire.up
    - black_arrow,if=buff.withering_fire.up
    # wailing_arrow,if=buff.withering_fire.remains<execute_time+gcd|time_to_die.remains<execute_time+gcd
    - wailing_arrow,if=buff.withering_fire.remains<action.wailing_arrow.execute_time+gcd|time_to_die<action.wailing_arrow.execute_time+gcd
    # barbed_shot,target_if=min:dot.barbed_shot.remains|max_prio_damage
    - barbed_shot
    # black_arrow
    - black_arrow
    # wailing_arrow
    - wailing_arrow
    # cobra_shot
    - cobra_shot

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # Shared lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target


    # Pet Management
    - revive_pet,range_check=none,if=!pet.alive&pet.exists

    - 883,range_check=none,if=!pet.exists&config.call_pet_number=1
    - 83242,range_check=none,if=!pet.exists&config.call_pet_number=2
    - 83243,range_check=none,if=!pet.exists&config.call_pet_number=3
    - 83244,range_check=none,if=!pet.exists&config.call_pet_number=4
    - 83245,range_check=none,if=!pet.exists&config.call_pet_number=5

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - survival_of_the_fittest,range_check=none,if=health.pct<=config.survival_of_the_fittest_hp_pct
    - aspect_of_the_turtle,if=health.pct<=config.aspect_of_the_turtle_hp_pct
    - mend_pet,if=pet.health.pct<=config.mend_pet_high_prio_hp_pct&pet.alive&pet.exists
    - exhilaration,range_check=none,if=health.pct<=config.exhilaration_hp_pct

    # Interrupts
    - counter_shot,if=interrupt.target.check
    - counter_shot.mouseover,if=interrupt.mouseover.check
    - counter_shot.focus,if=interrupt.focus.check
    # CC Interrupt
    - intimidation,if=interrupt.cc.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Misdirection on tank at M+ pull start
    - misdirection,target=tank1,if=!player.inraid&combat.time<3

    # Target Check
    - return,if=auto_combat.target

    # retarget,target_if=max:target.health,line_cd=5,if=fight_style.dungeonroute
    # Not converted: retarget is sim-only (fight_style.dungeonroute).

    # CDs & Trinkets
    - call_action_list,name=cds
    - call_action_list,name=trinkets

    # Hero tree / talent routing
    # auto_shot,if=... (deleted — auto-attack)
    # Dark Ranger ST
    # call_action_list,name=drst,if=talent.black_arrow&(active_enemies<2|!talent.beast_cleave&active_enemies<3)
    - call_action_list,name=drst,if=talent.black_arrow&(enemies_around_target<2|!talent.beast_cleave&enemies_around_target<3)
    # Dark Ranger Cleave
    # call_action_list,name=drcleave,if=talent.black_arrow&(active_enemies>2|talent.beast_cleave&active_enemies>1)
    - call_action_list,name=drcleave,if=talent.black_arrow&(enemies_around_target>2|talent.beast_cleave&enemies_around_target>1)
    # ST (non-Dark Ranger)
    # call_action_list,name=st,if=!talent.black_arrow&(active_enemies<2|!talent.beast_cleave&active_enemies<3)
    - call_action_list,name=st,if=!talent.black_arrow&(enemies_around_target<2|!talent.beast_cleave&enemies_around_target<3)
    # Cleave (non-Dark Ranger)
    # call_action_list,name=cleave,if=!talent.black_arrow&(active_enemies>2|talent.beast_cleave&active_enemies>1)
    - call_action_list,name=cleave,if=!talent.black_arrow&(enemies_around_target>2|talent.beast_cleave&enemies_around_target>1)

    # Low priority pet healing
    - mend_pet,if=pet.health.pct<=config.mend_pet_low_prio_hp_pct&pet.alive&pet.exists


# -- Specialization: Beast Mastery
