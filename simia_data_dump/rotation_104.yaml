# =============================================================================
# Druid - Guardian - 104
# =============================================================================
# Local conventions in this file:
# - `feline_potential_counter` is actually `ursine_potential` in WoW data.
# - Thrash (bear) = 77758, Swipe (bear) = 213764 — both names collide, so numeric.
# - Heart of the Wild = 1261867, and 1261868 when in cat form. Name-based lookup
#   is ambiguous, so cooldown/override references use 1261867.
# - Gory Fur = 1307881 (`gory_fur_maul`) and 201671 (`gory_fur_ironfur`) — three
#   spells share the display name, so both are numeric.
# - Gorestained Claws (MID2 2pc buff) = 1301286.
# - `maul` is a morph base (`_morphs.yaml: maul: ravage`) — the engine swaps to
#   Ravage on its own when the button morphs, so there are NO explicit `ravage`
#   lines here. Adding one would make `ravage` an APL action in its own right and
#   suppress every `maul` line for the duration of the buff.
# - `raze` and `incarnation_guardian_of_ursoc` are talent-gated parse-time
#   redirects in SimC (`create_action`: maul+talent.raze → raze_t,
#   berserk+talent.incarnation_bear → incarnation_bear_t). They are NOT in
#   `_morphs.yaml`, so each needs its own explicit line alongside the base.
# - `target.combat` is ANDed onto Moonfire so it never pulls.
# - `range_check=none` on form/utility casts, `range_check=mob_count_8y` on Thrash.

version: 3
spec: 104
entry: main

spell_overrides:
  # Don't re-press Incarnation while it is already up.
  incarnation_guardian_of_ursoc: "!buff.incarnation_guardian_of_ursoc.up"

  # local addition: Barkskin is held for tank busters off the encounter timeline
  # (see the set_tank_var list) instead of being pressed on cooldown.
  barkskin: "(!player.inmythicplus|fight_remains>=20|player.on_last_boss)&(variable.tank_buster_remains<=1|variable.tank_buster_casting|variable.tank_buster_remains>34)"

  # local addition: with Lunar Calling the Thrash button becomes Moonfire, so
  # Moonfire must not steal the button while Thrash itself is available.
  moonfire: "!talent.lunar_calling.enabled|cooldown.77758.down|enemies.8y=0"

  # local addition: Heart of the Wild (1261867 — 1261868 is the cat-form variant).
  1261867: "enemies.40y>=1&enemies.40y<=3&!buff.incarnation_guardian_of_ursoc.up"

  # local addition: Sundering Roar is saved for a 5-stack Thrash inside Incarnation,
  # or pressed to bank cooldown reduction when Incarnation is far out.
  sundering_roar: "(cooldown.77758.remains|cooldown.77758.duration>gcd)&(dot.thrash.stack>=5&buff.incarnation_guardian_of_ursoc.up)|(cooldown_bypass.incarnation_guardian_of_ursoc.remains>=50&lastcast.incarnation_guardian_of_ursoc>=5)"

config:
  rage_deficit_maul:
    label: "Rage Deficit (Maul)"
    type: slider
    min: 1
    max: 100
    default: 20
  survival_instincts_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  survival_instincts_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival Instincts (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55
  frenzied_regeneration_hp_pct:
    section: "Defensive HP Percentage"
    label: "Frenzied Regeneration HP%"
    type: slider
    min: 0
    max: 100
    default: 75
  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 50
  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40
  travel_form_mode:
    label: "Auto Travel Form"
    type: checkbox
    default: true
  lunar_beam_moving_check:
    label: "Lunar Beam (Moving Check)"
    type: checkbox
    default: true
  MO_moonfire:
    label: "Moonfire on MO"
    type: checkbox
    default: true
  allow_pull_with_mo:
    label: "Pull with MO"
    type: checkbox
    default: true

variables:

lists:
  set_tank_var:
    - variable,name=tank_buster_remains,value=999
    - variable,name=tank_buster_remains,value=encounter.void_slash.remains,if=encounter.void_slash.up&encounter.void_slash.remains<variable.tank_buster_remains
    - variable,name=tank_buster_remains,value=encounter.bone_hack.remains,if=encounter.bone_hack.up&encounter.bone_hack.remains<variable.tank_buster_remains
    - variable,name=tank_buster_remains,value=encounter.rampage.remains,if=encounter.rampage.up&encounter.rampage.remains<variable.tank_buster_remains
    - variable,name=tank_buster_casting,value=target.casting.void_slash|target.casting.bone_hack|target.casting.rampage

  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - barkskin,range_check=none,if=incoming.mitigated.pct>=config.barkskin_dmg_pct
    - survival_instincts,range_check=none,if=incoming.mitigated.pct>=config.survival_instincts_dmg_pct

    # --- HP Percentage: react when already low ---
    - survival_instincts,range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - frenzied_regeneration,range_check=none,if=health.pct<=config.frenzied_regeneration_hp_pct&buff.frenzied_regeneration.down
    - barkskin,range_check=none,if=health.pct<=config.barkskin_hp_pct

  # ==========================================================================
  # COOLDOWNS
  # ==========================================================================
  cooldowns:
    # blood_fury
    - blood_fury
    # berserking
    - berserking
    # fireblood
    - fireblood
    # ancestral_call
    - ancestral_call

    # bristling_fur,if=!target.cooldown.pause_action.remains&cooldown.mangle.remains&cooldown.thrash.remains&(rage<60&talent.killing_blow.enabled|rage<40&!talent.killing_blow.enabled)&!buff.ravage.up
    - bristling_fur,if=cooldown.mangle.remains&cooldown.77758.remains&(rage<60&talent.killing_blow.enabled|rage<40&!talent.killing_blow.enabled)&!buff.ravage.up

    # barkskin,if=buff.bear_form.up
    - barkskin,if=buff.bear_form.up

    # lunar_beam,if=(cooldown.incarnation_guardian_of_ursoc.up|cooldown.berserk.up)
    - lunar_beam,if=target.combat&(!config.lunar_beam_moving_check|player.moving.time<=1)&(cooldown.incarnation_guardian_of_ursoc.up|cooldown.berserk.up)

    # heart_of_the_wild,if=(active_enemies<=5&talent.moonkin_form.enabled&buff.cat_form.up|!talent.moonkin_form.enabled&buff.cat_form.up)|buff.moonkin_form.up&active_enemies>=6&talent.moonkin_form.enabled
    # local: disabled — Heart of the Wild is driven by the bear-list form swaps and
    # the 1261867 spell_override instead of an unconditional cooldowns press.
    # - heart_of_the_wild,if=(active_enemies<=5&talent.moonkin_form.enabled&buff.cat_form.up|!talent.moonkin_form.enabled&buff.cat_form.up)|buff.moonkin_form.up&active_enemies>=6&talent.moonkin_form.enabled

    # convoke_the_spirits,if=buff.bear_form.up
    - convoke_the_spirits,if=buff.bear_form.up

    # sundering_roar,if=(dot.thrash.stack>4&talent.flashing_claws.rank=2|dot.thrash.stack>3&talent.flashing_claws.rank=1|dot.thrash.stack>2&!talent.flashing_claws.enabled)&!cooldown.thrash.up
    - sundering_roar,if=(dot.thrash.stack>4&talent.flashing_claws.rank=2|dot.thrash.stack>3&talent.flashing_claws.rank=1|dot.thrash.stack>2&!talent.flashing_claws.enabled)&!cooldown.77758.up

    # berserk,if=(!cooldown.heart_of_the_wild.up&(talent.heart_of_the_wild.enabled)|!talent.ravage.enabled|!talent.heart_of_the_wild.enabled)&(!cooldown.thrash.up|(buff.cat_form.up&!talent.convoke_the_spirits.enabled))
    - berserk,if=(!cooldown.1261867.up&(talent.heart_of_the_wild.enabled)|!talent.ravage.enabled|!talent.heart_of_the_wild.enabled)&(!cooldown.77758.up|(buff.cat_form.up&!talent.convoke_the_spirits.enabled))
    # local: SimC's `berserk` is rewritten to Incarnation at parse time when
    # talent.incarnation_bear is taken (sc_druid.cpp:10119). No morph entry exists,
    # so the redirect needs its own line.
    - incarnation_guardian_of_ursoc,if=(!cooldown.1261867.up&(talent.heart_of_the_wild.enabled)|!talent.ravage.enabled|!talent.heart_of_the_wild.enabled)&(!cooldown.77758.up|(buff.cat_form.up&!talent.convoke_the_spirits.enabled))

    # wild_guardian,if=!buff.answered_calling.up&buff.lunar_beam.up
    - wild_guardian,if=!buff.1308647.up&buff.lunar_beam.up

  # ==========================================================================
  # BEAR
  # ==========================================================================
  bear:
    # bear_form,if=!buff.bear_form.up&!buff.feline_potential.up&!talent.fluid_form.enabled
    - bear_form,range_check=none,if=!buff.bear_form.up&!buff.feline_potential.up&!talent.fluid_form.enabled

    # mangle,if=buff.cat_form.up
    - mangle,if=buff.cat_form.up

    # ironfur,use_off_gcd=1,if=buff.gory_fur_ironfur.up
    - ironfur,use_off_gcd=1,if=buff.201671.up
    # ironfur,use_off_gcd=1,if=rage>=40&!talent.killing_blow.enabled&!buff.answered_calling.up
    - ironfur,use_off_gcd=1,if=rage>=40&!talent.killing_blow.enabled&!buff.1308647.up
    # ironfur,use_off_gcd=1,if=rage>=80&!talent.killing_blow.enabled&buff.answered_calling.up
    - ironfur,use_off_gcd=1,if=rage>=80&!talent.killing_blow.enabled&buff.1308647.up
    # ironfur,use_off_gcd=1,if=!buff.ironfur.up&!buff.answered_calling.up&talent.killing_blow.enabled&!buff.ravage.up
    - ironfur,use_off_gcd=1,if=!buff.ironfur.up&!buff.1308647.up&talent.killing_blow.enabled&!buff.ravage.up
    # ironfur,use_off_gcd=1,if=!buff.ironfur.up&rage>=80&buff.answered_calling.up&talent.killing_blow.enabled&!buff.ravage.up
    - ironfur,use_off_gcd=1,if=!buff.ironfur.up&rage>=80&buff.1308647.up&talent.killing_blow.enabled&!buff.ravage.up

    # thrash,target_if=refreshable|(dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)
    - 77758,range_check=mob_count_8y,if=dot.thrash.refreshable|(dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)

    # mangle,if=buff.answered_calling.up&(active_enemies=1|buff.berserk.up&active_enemies<=4)&talent.fount_of_strength.enabled
    - mangle,if=buff.1308647.up&(active_enemies=1|buff.berserk.up&active_enemies<=4)&talent.fount_of_strength.enabled

    # thrash,if=talent.lunar_calling.enabled|buff.answered_calling.up
    - 77758,range_check=mob_count_8y,if=talent.lunar_calling.enabled|buff.1308647.up
    # local addition: with Lunar Calling the Thrash button casts Moonfire, and there
    # is no thrash→moonfire entry in _morphs.yaml to express that.
    - moonfire,if=talent.lunar_calling.enabled&buff.bear_form.up&target.combat

    # maul,if=buff.dream_conduit.up&!talent.fount_of_strength.enabled&!buff.answered_calling.up
    - maul,if=buff.dream_conduit.up&!talent.fount_of_strength.enabled&!buff.1308647.up

    # maul,if=rage>=55&talent.killing_blow.enabled&!buff.answered_calling.up
    - maul,if=rage>=55&talent.killing_blow.enabled&!buff.1308647.up
    # maul,if=rage>=80&talent.killing_blow.enabled&buff.answered_calling.up
    - maul,if=rage>=80&talent.killing_blow.enabled&buff.1308647.up

    # maul,if=buff.gory_fur_maul.up&talent.raze.enabled
    - raze,if=buff.1307881.up&talent.raze.enabled
    # maul,if=buff.gory_fur_maul.up&!talent.raze.enabled&active_enemies<3
    - maul,if=buff.1307881.up&!talent.raze.enabled&active_enemies<3

    # thrash,if=active_enemies>=3&talent.fount_of_strength.enabled
    - 77758,range_check=mob_count_8y,if=active_enemies>=3&talent.fount_of_strength.enabled

    # mangle,if=dot.red_moon.ticking|(buff.gorestained_claws.up|buff.answered_calling.up)&talent.fount_of_strength.enabled
    - mangle,if=dot.red_moon.ticking|(buff.1301286.up|buff.1308647.up)&talent.fount_of_strength.enabled

    # rake,if=!buff.cat_form.up&talent.fluid_form.enabled&cooldown.heart_of_the_wild.up&talent.heart_of_the_wild.enabled&(active_enemies<=5&talent.moonkin_form.enabled|!talent.moonkin_form.enabled)
    - rake,if=!buff.cat_form.up&talent.fluid_form.enabled&cooldown.1261867.up&talent.heart_of_the_wild.enabled&(active_enemies<=5&talent.moonkin_form.enabled|!talent.moonkin_form.enabled)
    # cat_form,if=!buff.cat_form.up&!talent.fluid_form.enabled&cooldown.heart_of_the_wild.up&talent.heart_of_the_wild.enabled&(active_enemies<=5&talent.moonkin_form.enabled|!talent.moonkin_form.enabled)&(rage<30&!talent.fount_of_strength.enabled|talent.fount_of_strength.enabled)
    - cat_form,range_check=none,if=!buff.cat_form.up&!talent.fluid_form.enabled&cooldown.1261867.up&talent.heart_of_the_wild.enabled&(active_enemies<=5&talent.moonkin_form.enabled|!talent.moonkin_form.enabled)&(rage<30&!talent.fount_of_strength.enabled|talent.fount_of_strength.enabled)
    # moonkin_form,if=!buff.moonkin_form.up&cooldown.heart_of_the_wild.up&active_enemies>=6&talent.moonkin_form.enabled
    - moonkin_form,range_check=none,if=!buff.moonkin_form.up&cooldown.1261867.up&active_enemies>=6&talent.moonkin_form.enabled

    # thrash,target_if=refreshable|(dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)
    - 77758,range_check=mob_count_8y,if=dot.thrash.refreshable|(dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)

    # ferocious_bite,if=(buff.cat_form.up&buff.feline_potential.up&(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&!dot.rip.refreshable)
    - ferocious_bite,if=(buff.cat_form.up&buff.feline_potential.up&(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&!dot.rip.refreshable)

    # rake,if=!buff.cat_form.up&talent.fluid_form.enabled&buff.feline_potential_counter.stack=6&talent.wildpower_surge.enabled&active_enemies<=2
    - rake,if=!buff.cat_form.up&talent.fluid_form.enabled&buff.ursine_potential.stack=6&talent.wildpower_surge.enabled&active_enemies<=2

    # rip,if=(buff.cat_form.up&buff.feline_potential.up)&active_enemies<=2
    - rip,if=(buff.cat_form.up&buff.feline_potential.up)&active_enemies<=2

    # red_moon,if=cooldown.mangle.up&!dot.red_moon.ticking&(!talent.convoke_the_spirits.enabled|talent.convoke_the_spirits.enabled&cooldown.convoke_the_spirits.remains>=5)
    - red_moon,if=cooldown.mangle.up&!dot.red_moon.ticking&(!talent.convoke_the_spirits.enabled|talent.convoke_the_spirits.enabled&cooldown.convoke_the_spirits.remains>=5)

    # mangle,if=(((buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.feline_potential_counter.stack<6&talent.wildpower_surge.enabled))
    - mangle,if=((buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.ursine_potential.stack<6&talent.wildpower_surge.enabled)

    # shred,if=(buff.feline_potential_counter.stack=6&!buff.cat_form.up&!dot.rake.refreshable&talent.fluid_form.enabled)
    - shred,if=(buff.ursine_potential.stack=6&!buff.cat_form.up&!dot.rake.refreshable&talent.fluid_form.enabled)

    # rake,if=(buff.feline_potential_counter.stack=6&!buff.cat_form.up&talent.fluid_form.enabled)
    - rake,if=(buff.ursine_potential.stack=6&!buff.cat_form.up&talent.fluid_form.enabled)

    # maul,if=!buff.ravage.up&rage>=90&talent.fount_of_strength.enabled&!talent.raze.enabled
    - maul,if=!buff.ravage.up&rage>=90&talent.fount_of_strength.enabled&!talent.raze.enabled

    # mangle,if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)|talent.red_moon.enabled&(cooldown.red_moon.remains>3&(((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)))
    - mangle,if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)|talent.red_moon.enabled&(cooldown.red_moon.remains>3&(((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)))

    # mangle,if=!talent.red_moon.enabled&(((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled))
    - mangle,if=!talent.red_moon.enabled&(((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled))

    # thrash
    - 77758,range_check=mob_count_8y

    # swipe_bear,if=!talent.lunation.enabled|(talent.lunation.enabled&talent.red_moon.enabled)|talent.lunation.enabled&active_enemies>3
    - 213764,if=!talent.lunation.enabled|(talent.lunation.enabled&talent.red_moon.enabled)|talent.lunation.enabled&active_enemies>3

    # moonfire,if=(talent.lunation.enabled)&buff.bear_form.up&!talent.red_moon.enabled&active_enemies<3
    - moonfire,if=(talent.lunation.enabled)&buff.bear_form.up&!talent.red_moon.enabled&active_enemies<3&target.combat

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    - call_action_list,name=set_tank_var
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - travel_form,after=200,range_check=none,if=config.travel_form_mode&!player.combat&player.inopenworld&mount_usable&buff.travel_form.down&!target.quest_mob

    - bear_form,range_check=none,if=buff.bear_form.down&!talent.fluid_form&(target.attackable|enemies.40y)

    # heart of the wild (cat-form variant) out of combat
    - 1261868,if=!auto_combat.player&buff.cat_form.up

    - mangle,if=talent.fluid_form.enabled&buff.bear_form.down&(target.attackable|target.quest_mob)

    - moonfire.mouseover,if=config.MO_moonfire&config.allow_pull_with_mo&mouseover.enemy&mouseover.alive&mouseover.debuff.moonfire.down

    - return,if=auto_combat.player
    - call_action_list,name=defensives

    - skull_bash,if=interrupt.target.check
    - skull_bash.mouseover,if=interrupt.mouseover.check
    - skull_bash.focus,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt — grab aggro when not tanking (dungeon/M+ only, never raid)
    - growl,name="Taunt",if=target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - growl.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

    - call_action_list,name=auto_heal

    # use_items (cooldowns list) — generic slot fallbacks
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    - ironfur,delay=300,if=buff.ironfur.remains<2|rage>=80
    - moonfire,if=target.range>8&buff.bear_form.up&target.combat
    - moonfire.mouseover,if=config.MO_moonfire&mouseover.enemy&mouseover.alive&mouseover.debuff.moonfire.down&mouseover.combat

    - call_action_list,name=cooldowns
    - call_action_list,name=bear,if=buff.bear_form.up
