version: 1

# Player spell metadata - burst buff expressions from old _spelldata.yaml
#
# burst_buffs: checked by player.burst.active / player.burst.count
# Also used for trinket sync when sync: true
# Returns true if ANY of these expressions evaluate to true

burst_buffs:
  # Death Knight
  - lastcast.dancing_rune_weapon<=10
  - buff.dancing_rune_weapon.remains>=5
  - buff.pillar_of_frost.remains>=5
  - buff.breath_of_sindragosa.remains>=5
  - pet.buff.dark_transformation.remains>=5
  - player.buff.dark_transformation.remains>=5

  # Priest
  - buff.voidform.remains>=5
  - buff.power_infusion.remains>=5&cooldown.power_infusion.remains>60

  # Warrior
  - buff.avatar.remains>=5
  - debuff.colossus_smash.remains>=5
  - buff.recklessness.remains>=5

  # Demon Hunter
  - buff.metamorphosis.remains>=5
  - buff.1217607.remains>=5

  # Rogue
  - buff.adrenaline_rush.remains>=5
  - buff.shadow_blades.up&buff.shadow_dance.up

  # Hunter
  - buff.bestial_wrath.remains>=5
  - buff.trueshot.remains>=5
  - buff.aspect_of_the_eagle.remains>=5

  # Druid
  - buff.berserk.remains>=5
  - buff.incarnation_chosen_of_elune.remains>=5
  - buff.incarnation_guardian_of_ursoc.remains>=5
  - buff.incarnation_avatar_of_ashamane.remains>=5

  # Paladin
  - buff.avenging_wrath.remains>=5

  # Shaman
  - buff.ascendance.remains>=5
  - buff.doom_winds.remains>=5&!action.ascendance.known

  # Warlock
  - buff.summon_darkglare.remains>=5
  - buff.summon_demonic_tyrant.remains>=5

  # Monk
  - buff.storm_earth_and_fire.remains>=5
  - buff.serenity.remains>=5

  # Evoker
  - buff.dragonrage.remains>=5


spell_durations:
  # Druid
  celestial_alignment: 90              # Balance base; orbital_strike talent reduces further (DBC-driven)
  incarnation_chosen_of_elune: 180     # replaces celestial_alignment when talented
  berserk: 180                         # Feral base; heart_of_the_lion may reduce (verify)
  incarnation_avatar_of_ashamane: 180  # Feral base
  convoke_the_spirits: 120             # Feral base; ashamanes_guidance reduces (verify factor)

  # Death Knight
  soul_reaper: 6                       # Unholy

  # Hunter
  trueshot: 120                        # MM

  # Rogue
  secret_technique: 45                 # Subtlety

  # Warlock
  summon_infernal: 180                 # Destro

  # Demon Hunter
  # Fracture is charge-based — the charges path returns the per-charge recharge
  # at runtime. This literal only covers the edge case where the spell is at
  # max charges (and live ch.cooldownDuration = 0) before we've cached anything.
  fracture: 4.5

  # Racial / shared
  berserking: 180

# Composite dot-duration MULTIPLIERS for refreshable (pandemic) accuracy.
# -------------------------------------------------------------------------
# `dot.X.refreshable` / `debuff.X.refreshable` is true when remains <= 0.3 *
# duration. SimC uses composite_dot_duration = base * (resource/talent factors);
# we only have the static DBC base. For resource-scaled dots that makes the
# pandemic window far too small (e.g. Rupture base 4s -> window 1.2s instead of
# the real 7.2s at 5 combo points), so the rotation under-refreshes.
#
# Each entry is a MULTIPLIER expression applied to the DBC base:
#   composite_seconds = DBC_base_seconds * eval(expression)
# It can reference live state (combo_points, talents, buffs, etc.). When an
# entry is absent the engine falls back to the live APPLIED aura duration, which
# already bakes in modifiers for the currently-applied dot.
#
# Source of the formula: SimC class modules' composite_dot_duration overrides
# (engine/class_modules/sc_*.cpp, midnight). e.g. Rogue rupture_t:
#   duration = data().duration() * ( 1 + combo_points )   => multiplier "1 + combo_points"
dot_durations:
  # Rogue (Assassination) — base * (1 + combo_points)
  rupture: 1 + combo_points
  # Druid (Feral) — base * (1 + combo_points)  (4s + 4s/cp)
  rip: 1 + combo_points

  # Templates for the other resource-scaled finisher dots (verify per spec in
  # SimC before enabling; uncomment as needed):
  # internal_bleeding: 1 + combo_points   # Assassination
  # crimson_tempest:   1 + combo_points   # Assassination (AoE)
  # primal_wrath:      1 + combo_points   # Feral (AoE Rip)

# Spells/actions that are off-GCD. Steps using these names default to the
# off-GCD pick slot (parallel to main rotation). Override per-step with off_gcd=false.
#
# Source: SimC engine/dbc/generated/sc_spell_data.inc, extracted by
#   tools/extract_off_gcd_spells.py
# Filter: canonical player-class row for each normalized name must have
#   gcd_msec == 0 AND at least one of cooldown / cast_time / charges > 0.
#   Canonical = highest _spell_level (modern reworks bump the learning level
#   when an ability gets a new ID); lowest ID breaks ties. This keeps Bestial
#   Wrath (modern 186254, level 34, gcd=0) over the legacy 19574 (gcd=1500),
#   and keeps Obliterate / Death Coil / Frostbolt out (canonical rows have gcd>0).
#
# Apostrophe-s collapses without a separator: "Harrier's Cry" -> harriers_cry,
# matching SimC's normalization convention (NOT harrier_s_cry).
#
# health_potion / petattack are SimC action aliases not in the DBC; kept manually.
off_gcd_spells:
  - combat_potion
  - health_potion
  - petattack
