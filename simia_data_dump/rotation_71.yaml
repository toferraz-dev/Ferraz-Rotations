    # - invoke_external_buff,name=power_infusion,if=debuff.colossus_smash.up&fight_remains>=135|var.execute_phase&buff.avatar.up|fight_remains<=25
    # actions+=/run_action_list,name=colossus_aoe,if=talent.demolish&active_enemies>2
    - run_action_list,name=colossus_aoe,if=talent.demolish&active_enemies>2
    # actions+=/run_action_list,name=colossus_execute,target_if=min:target.health.pct,if=talent.demolish&variable.execute_phase
    # target_if=min:target.health.pct dropped
