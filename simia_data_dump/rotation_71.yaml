# Custom
# rend_dot does not exist, is only rend.

version: 3
spec: 71

config:
  impending_victory_hp_pct:
    label: "Impending Victory"
    type: slider
    min: 0
    max: 100
    default: 65
  die_by_the_sword_hp_pct:
    label: "Die by the Sword"
    type: slider
    min: 0
    max: 100
    default: 30
  rallying_cry_hp_pct:
    label: "Rallying Cry"
    type: slider
    min: 0
    max: 100
    default: 50

variables:
  # variable,name=st_planning,value=active_enemies=1&(raid_event.adds.in>15|!raid_event.adds.exists)
  # raid_event stripped
  st_planning: active_enemies=1
  # variable,name=adds_remain,value=active_enemies>=2&(!raid_event.adds.exists|raid_event.adds.exists&raid_event.adds.remains>5)
  # raid_event stripped
  adds_remain: active_enemies>=2
  # variable,name=execute_phase,value=(talent.massacre.enabled&target.health.pct<35)|target.health.pct<20
  execute_phase: (talent.massacre&target.health.pct<35)|target.health.pct<20

lists:
