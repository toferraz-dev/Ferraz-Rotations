  main:
      # Shared
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    # Shattering Throw — deals up to 500% increased damage to absorb shields
    - shattering_throw,if=target.absorb>0
    - wrecking_throw,if=target.absorb>0

    - battle_shout,range_check=none,if=(!buff.battle_shout.up.any|buff.battle_shout.remains.any<60|action.battle_shout.overlayed)&lastcast.battle_shout>=10
    - battle_stance,range_check=none,if=!buff.battle_stance.up

    # Defensives
    - die_by_the_sword,range_check=none,if=health.pct<=config.die_by_the_sword_hp_pct
    - rallying_cry,range_check=none,if=health.pct<=config.rallying_cry_hp_pct
    - impending_victory,if=health.effective.pct<=config.impending_victory_hp_pct
    - spell_reflection,range_check=none,if=incoming_cast.player.reflectable.up|incoming_cast.aoe.reflectable.up

    # Combat Check
    - return,if=auto_combat.player

    - call_action_list,name=auto_heal

    # Interrupts
    - pummel,if=interrupt.target.check
    - pummel.mouseover,if=interrupt.mouseover.check
    - pummel.focus,if=interrupt.focus.check

    # CC Interrupt
    - storm_bolt,if=interrupt.cc.check

    # AoE Interrupt
    - shockwave,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Target Check
    - return,if=auto_combat.target

    # actions=charge,if=time<=0.5|movement.distance>5
    - charge,if=target.range>8&player.combat.time<=0.5

    # Trinkets
