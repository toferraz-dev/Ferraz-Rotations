    - rend,if=!dot.rend.remains
    # sweeping_strikes,if=cooldown.colossus_smash.remains>10&buff.sweeping_strikes.down|!talent.broad_strokes
    - sweeping_strikes,if=cooldown.colossus_smash.remains>10&buff.sweeping_strikes.down|!talent.broad_strokes
    # ravager,if=cooldown.colossus_smash.remains<2
    - ravager,if=cooldown.colossus_smash.remains<2
    # avatar
    - avatar
    # colossus_smash
    - colossus_smash
    # champions_spear
    - champions_spear
    # cleave,if=buff.collateral_damage.stack>=2
    - cleave,if=buff.collateral_damage.stack>=2
    # demolish,if=buff.colossal_might.stack=10&(debuff.colossus_smash.remains>2|cooldown.colossus_smash.remains>10)
