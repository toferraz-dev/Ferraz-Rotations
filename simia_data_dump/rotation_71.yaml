    # target_if=min:target.health.pct dropped
    - run_action_list,name=slayer_execute,if=talent.slayers_dominance&var.execute_phase
    # actions+=/run_action_list,name=slayer_st,if=talent.slayers_dominance
    - run_action_list,name=slayer_st,if=talent.slayers_dominance



