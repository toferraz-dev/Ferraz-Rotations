# =============================================================================
# Evoker Devastation - Spec ID 1467
# =============================================================================

version: 3
spec: 1467
entry: main

# Allow casting empowered spells while moving with Hover (Slipstream)
movement_allowed: buff.hover.up

config:
  obsidian_scales_hp_pct:
    section: "Defensive HP Percentage"
    label: "Obsidian Scales HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  obsidian_scales_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Obsidian Scales (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 45

  emerald_blossom_hp_pct:
    section: "Defensive HP Percentage"
    label: "Emerald Blossom HP%"
    type: slider
    min: 0
    max: 100
    default: 65

  living_flame_hp_pct:
    section: "Defensive HP Percentage"
    label: "Living Flame HP%"
    type: slider
    min: 0
    max: 100
    default: 30

variables:
  # variable,name=dr_prep_time,default=6,op=reset
  dr_prep_time: 6
  # variable,name=dr_prep_time_aoe,default=4,op=reset
  dr_prep_time_aoe: 4
  # variable,name=can_use_empower,value=1,default=1,if=!talent.animosity|!talent.dragonrage
  # variable,name=can_use_empower,op=set,value=cooldown.dragonrage.remains>=gcd.max*variable.dr_prep_time,if=talent.animosity&talent.dragonrage
  can_use_empower: (!talent.animosity|!talent.dragonrage)|(cooldown.dragonrage.remains>=gcd.max*6)
  # variable,name=next_dragonrage,value=cooldown.dragonrage.remains<?((cooldown.eternity_surge.remains-8)>?(cooldown.fire_breath.remains-8))
  # next_dragonrage: cooldown.dragonrage.remains<?((cooldown.eternity_surge.remains-8)>?(cooldown.fire_breath.remains-8))

  # variable,name=use_pyre,op=set,value=(active_enemies>=4|active_enemies>=3&(talent.volatility.rank=2|talent.feed_the_flames))
  use_pyre: (enemies_around_target>=4|enemies_around_target>=3&(talent.volatility.rank=2|talent.feed_the_flames))

  # variable,name=r1_cast_time,value=1.0*spell_haste
  # spell_haste not supported — not used in rotation conditions, omitting

  # variable,name=has_external_pi,value=cooldown.invoke_power_infusion_0.duration>0
  # cooldown.invoke_power_infusion_0 not supported — omitting

  # --- Trinket variables (not supported, commented out) ---
  # variable,name=trinket_1_buffs,...
  # variable,name=trinket_2_buffs,...
  # (all trinket variables omitted)

lists:
  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - obsidian_scales,range_check=none,if=incoming.pct>=config.obsidian_scales_dmg_pct

    # --- HP Percentage: react when already low ---
    - obsidian_scales,range_check=none,if=health.pct<=config.obsidian_scales_hp_pct
    - emerald_blossom.player,range_check=none,if=health.pct<=config.emerald_blossom_hp_pct
    - living_flame,range_check=none,if=health.pct<=config.living_flame_hp_pct

  main:
      # _shared.yaml lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged

    - blessing_of_the_bronze,range_check=none,if=buff.blessing_of_the_bronze.down

    # Combat Check
    - return,if=auto_combat.player

    # Defensives
    - call_action_list,name=defensives

    # Interrupts
    - quell,if=interrupt.target.check
    - quell.mouseover,if=interrupt.mouseover.check
    - quell.focus,if=interrupt.focus.check
    # AoE Interrupt
    - tail_swipe,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check

    - call_action_list,name=auto_heal

    # Target Check
    - return,if=auto_combat.target

    # potion,if=(!talent.dragonrage|buff.dragonrage.up)|fight_remains<35
    # potion not supported — deleted

    # invoke_external_buff,name=power_infusion,if=...
    # invoke_external_buff not supported — deleted

    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

    # call_action_list,name=trinkets
    # Trinket list not supported — all trinket logic commented out

    # Precombat empowers (release if already channeling from pull)
    - fire_breath,ignore_usable=true,ignore_cooldown=true,casting_check=fire_breath,if=player.empower_stage>=1
    - eternity_surge,ignore_usable=true,ignore_cooldown=true,casting_check=eternity_surge,if=player.empower_stage>=1

    # Route to correct sub-list based on talent and enemy count
    # run_action_list,name=sc,if=talent.mass_disintegrate
    - run_action_list,name=sc,if=talent.mass_disintegrate
    # run_action_list,name=aoe_fs,if=active_enemies>=3
    - run_action_list,name=aoe_fs,if=enemies_around_target>=3
    # run_action_list,name=st_fs
    - run_action_list,name=st_fs

  # ===========================================================================
  # Eternity Surge - empower level selection
  # ===========================================================================
  es:
    # eternity_surge,empower_to=1,target_if=max:target.health.pct,if=enemies_around_target<=1+talent.eternitys_span|enemies_around_target>4+4*talent.eternitys_span|talent.mass_disintegrate|buff.dragonrage.up
    - eternity_surge,empower_to=1,if=enemies_around_target<=1+talent.eternitys_span|enemies_around_target>4+4*talent.eternitys_span|talent.mass_disintegrate|buff.dragonrage.up
    # eternity_surge,empower_to=2,target_if=max:target.health.pct,if=enemies_around_target<=2+2*talent.eternitys_span
    - eternity_surge,empower_to=2,if=enemies_around_target<=2+2*talent.eternitys_span
    # eternity_surge,empower_to=3,target_if=max:target.health.pct,if=enemies_around_target<=3+3*talent.eternitys_span
    - eternity_surge,empower_to=3,if=enemies_around_target<=3+3*talent.eternitys_span
    # eternity_surge,empower_to=4,target_if=max:target.health.pct,if=enemies_around_target<=4+4*talent.eternitys_span
    - eternity_surge,empower_to=4

  # ===========================================================================
  # Green - Ancient Flame maintenance
  # ===========================================================================
  green:
    # emerald_blossom
    - emerald_blossom
    # verdant_embrace
    - verdant_embrace

  # ===========================================================================
  # Flameshaper 1/2 Target List (st_fs)
  # ===========================================================================
  st_fs:
    # dragonrage,if=target.time_to_die>=30&raid_event.adds.in>=60|!raid_event.adds.exists|raid_event.adds.in=0
    - dragonrage,if=target.time_to_die>=30

    # hover,use_off_gcd=1,if=raid_event.movement.in<6&!buff.hover.up&gcd.remains>=0.5|talent.slipstream&gcd.remains>=0.5
    - hover,if=talent.slipstream&gcd.remains>=0.5

    # tip_the_scales,use_off_gcd=1,if=buff.dragonrage.up&action.eternity_surge.usable_in<=action.fire_breath.usable_in
    - tip_the_scales,if=buff.dragonrage.up

    # call_action_list,name=es,if=buff.tip_the_scales.up (custom — not in SimC st_fs, but needed for tip logic)
    - call_action_list,name=es,if=buff.tip_the_scales.up

    # eternity_surge,target_if=max:target.health.pct,empower_to=2,if=enemies_around_target=2&!talent.eternitys_span&variable.can_use_empower
    - eternity_surge,empower_to=2,if=enemies_around_target=2&!talent.eternitys_span&var.can_use_empower

    # eternity_surge,target_if=max:target.health.pct,empower_to=1,if=variable.can_use_empower|set_bonus.mid1_2pc&talent.azure_sweep
    - eternity_surge,empower_to=1,if=var.can_use_empower|set_bonus.mid1_2pc&talent.azure_sweep

    # fire_breath,target_if=max:target.health.pct,empower_to=1,if=variable.can_use_empower&!buff.tip_the_scales.up&dot.fire_breath.refreshable&(cooldown.dragonrage.remains>full_recharge_time|buff.dragonrage.up|full_recharge_time<gcd.max*5)
    - fire_breath,empower_to=1,if=var.can_use_empower&!buff.tip_the_scales.up&dot.fire_breath.refreshable&(cooldown.dragonrage.remains>cooldown.fire_breath.full_recharge_time|buff.dragonrage.up|cooldown.fire_breath.full_recharge_time<gcd.max*5)

    # pyre,target_if=min:dot.fire_breath.remains-100*dot.fire_breath.ticking,if=enemies_around_target>1&dot.fire_breath.remains<=8&talent.feed_the_flames&talent.volatility
    - pyre,if=enemies_around_target>1&dot.fire_breath.remains<=8&talent.feed_the_flames&talent.volatility

    # disintegrate,target_if=max:dot.fire_breath.remains,chain=1,if=(raid_event.movement.in>2|buff.hover.up),early_chain_if=ticks_remain<=1,interrupt_if=ticks_remain<=1
    - disintegrate

    # azure_sweep
    - azure_sweep

    # living_flame,if=buff.burnout.up|(buff.leaping_flames.up|buff.ancient_flame.up)&raid_event.movement.in>execute_time
    - living_flame,if=buff.burnout.up|(buff.leaping_flames.up|buff.ancient_flame.up)

    # azure_strike,if=enemies_around_target>1
    - azure_strike,if=enemies_around_target>1

    # living_flame,if=raid_event.movement.in>execute_time
    - living_flame

    # call_action_list,name=green,if=talent.ancient_flame&!buff.ancient_flame.up&talent.scarlet_adaptation&!buff.dragonrage.up
    - call_action_list,name=green,if=talent.ancient_flame&!buff.ancient_flame.up&talent.scarlet_adaptation&!buff.dragonrage.up

    # azure_strike
    - azure_strike

  # ===========================================================================
  # Scalemander (SC) — unified ST + AoE list (Mass Disintegrate talent)
  # ===========================================================================
  sc:
    # deep_breath,if=buff.strafing_run.remains<=gcd.max*2,cancel_if=gcd.remains=0
    - deep_breath,if=buff.strafing_run.remains<=gcd.max*2

    # dragonrage,if=target.time_to_die>=30&raid_event.adds.in>=60|!raid_event.adds.exists|raid_event.adds.in=0
    - dragonrage,if=target.time_to_die>=30

    # hover,use_off_gcd=1,if=raid_event.movement.in<6&!buff.hover.up&gcd.remains>=0.5|talent.slipstream&gcd.remains>=0.5
    - hover,if=talent.slipstream&gcd.remains>=0.5

    # azure_sweep,if=(buff.essence_burst.down|!buff.essence_burst.at_max_stacks)&set_bonus.mid1_2pc&cooldown.eternity_surge.remains<=6
    # at_max_stacks not supported — use stack<2 (Essence Burst max = 2)
    - azure_sweep,if=(buff.essence_burst.down|buff.essence_burst.stack<2)&set_bonus.mid1_2pc&cooldown.eternity_surge.remains<=6

    # eternity_surge,empower_to=1
    - eternity_surge,empower_to=1

    # tip_the_scales,use_off_gcd=1,if=action.fire_breath.ready
    - tip_the_scales,if=action.fire_breath.ready

    # fire_breath,empower_to=1
    - fire_breath,empower_to=1

    # deep_breath,if=variable.use_pyre&talent.imminent_destruction,cancel_if=gcd.remains=0
    - deep_breath,if=var.use_pyre&talent.imminent_destruction

    # disintegrate,target_if=min:debuff.bombardments.remains,early_chain_if=ticks_remain<=1&buff.mass_disintegrate.up,if=(raid_event.movement.in>2|buff.hover.up)&buff.mass_disintegrate.up&talent.mass_disintegrate,interrupt_if=talent.volatility&active_enemies>=8
    - disintegrate,if=buff.mass_disintegrate.up&talent.mass_disintegrate

    # pyre,target_if=max:target.health.pct,if=!buff.mass_disintegrate.up&variable.use_pyre
    - pyre,if=!buff.mass_disintegrate.up&var.use_pyre

    # disintegrate,target_if=max:dot.fire_breath_damage.remains,if=(raid_event.movement.in>2|buff.hover.up),early_chain_if=ticks_remain<=1
    - disintegrate

    # azure_sweep
    - azure_sweep

    # living_flame,if=buff.burnout.up|(buff.leaping_flames.up|buff.ancient_flame.up|talent.engulfing_blaze)&raid_event.movement.in>execute_time
    - living_flame,if=buff.burnout.up|(buff.leaping_flames.up|buff.ancient_flame.up|talent.engulfing_blaze)

    # call_action_list,name=green,if=talent.ancient_flame&!buff.ancient_flame.up&talent.scarlet_adaptation&!buff.dragonrage.up
    - call_action_list,name=green,if=talent.ancient_flame&!buff.ancient_flame.up&talent.scarlet_adaptation&!buff.dragonrage.up

    # azure_strike
    - azure_strike

  # ===========================================================================
  # Flameshaper 3+ Target List (aoe_fs)
  # ===========================================================================
  aoe_fs:
    # hover,use_off_gcd=1,if=raid_event.movement.in<6&!buff.hover.up&gcd.remains>=0.5&enemies_around_target<=4
    # raid_event not supported — deleted

    # fire_breath,target_if=max:target.health.pct,empower_to=1,if=cooldown.dragonrage.remains<gcd.max*2&active_dot.fire_breath=0&(target.time_to_die>=15|!raid_event.adds.exists)
    - fire_breath,empower_to=1,if=cooldown.dragonrage.remains<gcd.max*2&active_dot.fire_breath=0&target.time_to_die>=15

    # tip_the_scales,use_off_gcd=1,if=buff.dragonrage.up&cooldown.eternity_surge.remains<=action.fire_breath.usable_in
    - tip_the_scales,if=buff.dragonrage.up

    # call_action_list,name=es,if=buff.tip_the_scales.up
    - call_action_list,name=es,if=buff.tip_the_scales.up

    # fire_breath,target_if=max:target.health.pct,empower_to=1,if=talent.consume_flame&variable.can_use_empower&dot.fire_breath.refreshable
    - fire_breath,empower_to=1,if=talent.consume_flame&var.can_use_empower&dot.fire_breath.refreshable

    # dragonrage,target_if=max:target.time_to_die,if=target.time_to_die>=15|!raid_event.adds.exists
    - dragonrage,if=target.time_to_die>=15

    # call_action_list,name=es,if=(buff.dragonrage.up|cooldown.dragonrage.remains>variable.dr_prep_time_aoe)&(buff.dragonrage.up|talent.azure_sweep&!buff.azure_sweep.up)&(active_dot.fire_breath=0|enemies_around_target<=3)
    - call_action_list,name=es,if=(buff.dragonrage.up|cooldown.dragonrage.remains>var.dr_prep_time_aoe)&(buff.dragonrage.up|talent.azure_sweep&!buff.azure_sweep.up)&(active_dot.fire_breath=0|enemies_around_target<=3)

    # pyre,target_if=max:target.health.pct,if=(cooldown.dragonrage.remains>gcd.max*4)&(buff.charged_blast.stack>=12|active_enemies>=4|active_enemies>=3&(talent.feed_the_flames|talent.volatility))
    - pyre,if=(cooldown.dragonrage.remains>gcd.max*4)&(buff.charged_blast.stack>=12|enemies_around_target>=4|enemies_around_target>=3&(talent.feed_the_flames|talent.volatility))
    # pyre,target_if=max:target.health.pct,if=active_enemies=3&!talent.feed_the_flames&!talent.volatility
    - pyre,if=enemies_around_target=3&!talent.feed_the_flames&!talent.volatility

    # deep_breath,if=talent.imminent_destruction&active_dot.fire_breath=0,cancel_if=gcd.remains=0,interrupt_if=gcd.remains=0
    - deep_breath,if=talent.imminent_destruction&active_dot.fire_breath=0

    # azure_sweep,target_if=max:target.health.pct
    - azure_sweep

    # living_flame,target_if=max:target.health.pct,if=buff.leaping_flames.up&(!talent.burnout|buff.burnout.up|active_dot.fire_breath=0|buff.scarlet_adaptation.up|buff.ancient_flame.up)&(!buff.essence_burst.up&essence.deficit>1|cooldown.fire_breath.remains<=gcd.max*3&buff.essence_burst.stack<buff.essence_burst.max_stack)
    - living_flame,if=buff.leaping_flames.up&(!talent.burnout|buff.burnout.up|active_dot.fire_breath=0|buff.scarlet_adaptation.up|buff.ancient_flame.up)&(!buff.essence_burst.up&essence.deficit>1|cooldown.fire_breath.remains<=gcd.max*3&buff.essence_burst.stack<2)

    # call_action_list,name=es,if=(buff.dragonrage.up|cooldown.dragonrage.remains>variable.dr_prep_time_aoe)&(talent.azure_sweep&!buff.azure_sweep.up)
    - call_action_list,name=es,if=(buff.dragonrage.up|cooldown.dragonrage.remains>var.dr_prep_time_aoe)&(talent.azure_sweep&!buff.azure_sweep.up)

    # living_flame,target_if=max:target.health.pct,if=talent.engulfing_blaze&(buff.leaping_flames.up|buff.burnout.up|buff.scarlet_adaptation.up|buff.ancient_flame.up)
    - living_flame,if=talent.engulfing_blaze&(buff.leaping_flames.up|buff.burnout.up|buff.scarlet_adaptation.up|buff.ancient_flame.up)

    # azure_strike,target_if=max:target.health.pct
    - azure_strike

