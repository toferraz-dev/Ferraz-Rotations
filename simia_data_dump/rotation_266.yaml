# =============================================================================
# Warlock Demonology - Spec ID 266
# =============================================================================
#
# Grimoire cooldown-filler buttons (WoW client behavior, NOT modeled by SimC):
# While a Grimoire summon is on its 2-min cooldown, WoW swaps its action button
# to a filler utility spell and applies a tracking buff. The game still reports
# the Grimoire as usable=YES / cd=0, so gate it on the filler buff via
# spell_overrides. Buff names collide with the cast spells — use numeric IDs.
#   1276610 = Devour Magic buff -> Grimoire: Fel Ravager is on cooldown
#   1276623 = Singe Magic buff  -> Grimoire: Imp Lord is on cooldown
# =============================================================================

version: 3
spec: 266
entry: main

spell_overrides:
  # Never cast a Grimoire while its cooldown-filler buff is up (= on cooldown).
  grimoire_fel_ravager: "buff.1276610.down"
  grimoire_imp_lord: "buff.1276623.down"

config:
  unending_resolve_hp_pct:
    section: "Defensive HP Percentage"
    label: "Unending Resolve HP (%)"
    type: slider
    min: 0
    max: 100
    default: 75

  drain_life_hp_pct:
    section: "Defensive HP Percentage"
    label: "Drain Life HP (%)"
    type: slider
    min: 0
    max: 100
    default: 50

  unending_resolve_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Unending Resolve (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 50

  summon_demon_type:
    label: "Summon Demon Type"
    type: dropdown
    options:
      - "Felguard"
      - "Sayaad/Succubus"
      - "Felhunter"
      - "Voidwalker"
      - "Imp"
    default: 0

variables:
  tyrant_active: pet.demonic_tyrant.active
  summon_cast_time: action.summon_imp.cast_time+0.5
  healthstone_cast_time: action.create_healthstone.cast_time+10
  # variable,name=in_opener,op=set,value=1  (set to 1 in precombat only - we just use combat.time<5 instead)
  # trinket_1_buffs / trinket_2_buffs / trinket_1_sync / trinket_2_sync / damage_trinket_priority / trinket_priority NOT supported - dropped (uses trinket property math)

lists:
  pets:
    # SimC: summon_pet (precombat) — choose demon based on config
    - summon_felguard,range_check=none,if=config.summon_demon_type=0&pet.npcid!=17252
    - summon_sayaad,range_check=none,if=config.summon_demon_type=1&pet.npcid!=1863
    - summon_felhunter,range_check=none,if=config.summon_demon_type=2&pet.npcid!=417
    - summon_voidwalker,range_check=none,if=config.summon_demon_type=3&pet.npcid!=1860
    - summon_imp,range_check=none,if=config.summon_demon_type=4&pet.npcid!=416

  racials:
    # berserking,use_off_gcd=1
    - berserking,if=var.tyrant_active
    # blood_fury
    - blood_fury,if=var.tyrant_active
    # fireblood
    - fireblood,if=var.tyrant_active
    # ancestral_call
    - ancestral_call,if=var.tyrant_active

  trinkets:
    # Items list (SimC complex sync math NOT supported — uses trinket properties; replaced with generic sync)
    # use_item,use_off_gcd=1,slot=trinket1,if=variable.trinket_1_buffs&...
    # use_item,use_off_gcd=1,slot=trinket2,if=variable.trinket_2_buffs&...
    # use_item,use_off_gcd=1,slot=trinket1,if=!variable.trinket_1_buffs&...
    # use_item,use_off_gcd=1,slot=trinket2,if=!variable.trinket_2_buffs&...
    # use_item,slot=trinket1,if=!variable.trinket_1_buffs&...
    # use_item,slot=trinket2,if=!variable.trinket_2_buffs&...
    # use_item,use_off_gcd=1,slot=main_hand
    - trinket_1,if=trinket_1.sync
    - trinket_2,if=trinket_2.sync

  defensives:
    # --- Prediction Damage: pre-fire on a predicted incoming hit (% of effective HP) ---
    - unending_resolve,range_check=none,if=incoming.pct>=config.unending_resolve_dmg_pct

    # --- HP Percentage: react when already low ---
    - drain_life,if=health.pct<=config.drain_life_hp_pct&!player.inpvecontent
    - unending_resolve,range_check=none,if=health.pct<=config.unending_resolve_hp_pct

  # ==========================================================================
  # DIABOLIST (talent.diabolic_ritual)
  # ==========================================================================
  diabolist:
    # power_siphon,if=buff.demonic_core.stack<=1|fight_remains<10
    - power_siphon,if=buff.demonic_core.stack<=1|fight_remains<10
    # hand_of_guldan,if=buff.dominion_of_argus.up
    - hand_of_guldan,if=buff.dominion_of_argus.up
    # grimoire_imp_lord
    - grimoire_imp_lord
    # grimoire_fel_ravager
    - grimoire_fel_ravager
    # summon_doomguard
    - summon_doomguard
    # call_dreadstalkers,if=talent.reign_of_tyranny&(cooldown.summon_demonic_tyrant.remains>=20+gcd.max|cooldown.summon_demonic_tyrant.remains<=12-gcd.max)
    - call_dreadstalkers,if=talent.reign_of_tyranny&(cooldown.summon_demonic_tyrant.remains>=20+gcd.max|cooldown.summon_demonic_tyrant.remains<=12-gcd.max)
    # call_dreadstalkers,if=!talent.reign_of_tyranny
    - call_dreadstalkers,if=!talent.reign_of_tyranny
    # summon_demonic_tyrant,if=soul_shard=5
    - summon_demonic_tyrant,if=soul_shards=5
    # implosion,if=buff.wild_imps.stack>=6&(active_enemies>2|talent.to_hell_and_back.enabled)
    # buff.wild_imps → buff.wild_imp; talent.X.enabled → talent.X
    - implosion,range_check=demonbolt,if=buff.wild_imp.stack>=6&(enemies_around_target>2|talent.to_hell_and_back)
    # ruination
    - ruination
    # hand_of_guldan,if=soul_shard>=3&cooldown.summon_demonic_tyrant.remains>5|soul_shard=5
    - hand_of_guldan,if=soul_shards>=3&cooldown.summon_demonic_tyrant.remains>5|soul_shards=5
    # infernal_bolt,if=soul_shard<3
    - infernal_bolt,if=soul_shards<3
    # demonbolt,target_if=(!debuff.doom.up),if=soul_shard<4&buff.demonic_core.react&talent.doom
    # target_if dropped; gate moved to if= with &debuff.doom.down; buff.X.react → buff.X.up
    - demonbolt,if=soul_shards<4&buff.demonic_core.up&talent.doom&debuff.doom.down
    # demonbolt,if=soul_shard<4&buff.demonic_core.react
    - demonbolt,if=soul_shards<4&buff.demonic_core.up
    # shadow_bolt
    - shadow_bolt
    # infernal_bolt
    - infernal_bolt

  # ==========================================================================
  # SOUL HARVESTER (talent.demonic_soul)
  # ==========================================================================
  soulharvest:
    # power_siphon,if=buff.demonic_core.stack<=1|fight_remains<10
    - power_siphon,if=buff.demonic_core.stack<=1|fight_remains<10
    # hand_of_guldan,if=buff.dominion_of_argus.up
    - hand_of_guldan,if=buff.dominion_of_argus.up
    # grimoire_imp_lord
    - grimoire_imp_lord
    # grimoire_fel_ravager
    - grimoire_fel_ravager
    # summon_doomguard
    - summon_doomguard
    # call_dreadstalkers
    - call_dreadstalkers
    # summon_demonic_tyrant
    - summon_demonic_tyrant
    # implosion,if=buff.wild_imps.stack>=6&(active_enemies>2|talent.to_hell_and_back.enabled)
    # buff.wild_imps → buff.wild_imp; talent.X.enabled → talent.X
    - implosion,range_check=demonbolt,if=buff.wild_imp.stack>=6&(enemies_around_target>2|talent.to_hell_and_back)
    # hand_of_guldan
    - hand_of_guldan
    # infernal_bolt,if=soul_shard<3
    - infernal_bolt,if=soul_shards<3
    # demonbolt,target_if=(!debuff.doom.up),if=soul_shard<4&buff.demonic_core.stack>=1&talent.doom
    # target_if dropped; gate moved to if= with &debuff.doom.down
    - demonbolt,if=soul_shards<4&buff.demonic_core.stack>=1&talent.doom&debuff.doom.down
    # demonbolt,if=soul_shard<4&buff.demonic_core.stack>=2&!talent.doom
    - demonbolt,if=soul_shards<4&buff.demonic_core.stack>=2&!talent.doom
    # demonbolt,if=soul_shard<4&buff.demonic_core.react
    - demonbolt,if=soul_shards<4&buff.demonic_core.up
    # shadow_bolt
    - shadow_bolt

  # ==========================================================================
  # MAIN
  # ==========================================================================
  main:
    # Shared lists
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged

    # Create healthstone out of combat (idle)
    - create_healthstone,range_check=none,if=healthstone.cd=60000&lastcast.create_healthstone>=3&!player.combat

    # Summon Pet
    - call_action_list,name=pets

    # Combat Check
    - return,if=auto_combat.player

    - call_action_list,name=auto_heal

    # Interrupts (Warlock kick via Felhunter Spell Lock; Felguard stun via Axe Toss)
    - spell_lock,if=interrupt.target.check
    - spell_lock.mouseover,if=interrupt.mouseover.check
    - spell_lock.focus,if=interrupt.focus.check
    # Stun Interrupt
    - axe_toss,if=interrupt.stun.target.check
    - axe_toss.mouseover,if=interrupt.stun.mouseover.check
    - axe_toss.focus,if=interrupt.stun.focus.check
    # AoE Interrupt
    - shadowfury,if=interrupt.stun.aoe.check
    # Racial Interrupts
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Target Check
    - return,if=target.dead
    - return,if=auto_combat.target

    # Defensives
    - call_action_list,name=defensives

    # Trinkets
    - call_action_list,name=trinkets

    # Racials (potion + invoke_external_buff dropped)
    # potion,if=pet.demonic_tyrant.active|fight_remains<=30
    # invoke_external_buff,name=power_infusion,if=pet.demonic_tyrant.active
    # call_action_list,name=racials,if=pet.demonic_tyrant.active|fight_remains<22,use_off_gcd=1
    - call_action_list,name=racials,if=var.tyrant_active|fight_remains<22

    # Hero tree dispatch
    # call_action_list,name=diabolist,if=talent.diabolic_ritual
    - call_action_list,name=diabolist,if=talent.diabolic_ritual
    # call_action_list,name=soulharvest,if=talent.demonic_soul
    - call_action_list,name=soulharvest,if=talent.demonic_soul
