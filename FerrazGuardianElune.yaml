version: 4.0
author: Ferraz
patch: "12.0.5"
spec: 104
name: Ferraz Guardian Druid M+ (Elunes)
description: |
  Ferraz Guardian Druid M+ (Elunes)
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text        # aliases: copy, copytext, copy-text
    label: "Recommended Talent String"
    text: "CgGA8cL7tpvige+kkmGM9zUPWDAAAAAAAAAAAgZmZmFzMjZWmZx4BmZZZgZzwoJyMzyMzMzsMmBAAAAAAjNzALbzMYMLDgpmZZWmZmBAwmxMDwixwAzilNAzMzsBA"

  # -- Defensives --
  survival_instincts_threshold:
    label: "Survival Instincts %"
    section: "Defensives"
    type: slider
    min: 10
    max: 70
    default: 50

  frenzied_regen_threshold:
    label: "Frenzied Regeneration %"
    section: "Defensives"
    type: slider
    min: 30
    max: 80
    default: 70

  # -- Movement --
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # -- Utility --
  use_growl:
    label: "Auto Growl (Taunt)"
    section: "Utility"
    type: checkbox
    default: true


  # -- Trinkets --
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  auto_incarn_st:
    label: "Incarnation on Single Target"
    section: "Cooldowns"
    type: checkbox
    default: false


  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # Stampeding Roar conditions based on config
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Mark of the Wild out of combat
  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10

  # Defensive priority: Dream of Cenarius Regrowth > SI > Frenzied Regen > Barkskin (on CD)
  defensives:
    - survival_instincts,name="Survival Instincts",if=incoming.pct<config.survival_instincts_threshold&!buff.survival_instincts.up
    - frenzied_regeneration,name="Frenzied Regeneration",if=incoming.pct<config.frenzied_regen_threshold&buff.frenzied_regeneration.down
    - barkskin,name="Barkskin",if=!buff.lunar_beam.up&((!buff.survival_instincts.up&fight_remains>=20)|player.on_last_boss)

  # Racial damage CDs (unconditional)
  racials:
    - blood_fury,name="Blood Fury",if=debuff.thrash.stack>=2
    - berserking,name="Berserking",if=debuff.thrash.stack>=2
    - fireblood,name="Fireblood",if=debuff.thrash.stack>=2
    - ancestral_call,name="Ancestral Call",if=debuff.thrash.stack>=2
    - thorn_bloom,name="Thorn Bloom",if=debuff.thrash.stack>=2

  # Auto-swap to enraged target; Skull Bash on target/MO/focus; AoE CC; Soothe
  interrupts:
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Taunt: grab loose mobs (same pattern as Monk Provoke)
  taunt:
    - growl,name="Growl",if=config.use_growl&target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - growl.mouseover,name="Growl (MO)",if=config.use_growl&mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

  # Innervate healer + Stampeding Roar
  utility:
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  # Trinkets > Potion > Lunar Beam > Sundering Roar > Incarnation/Berserk > Wild Guardian
  cooldowns:
    # Trinkets and Potion: sync with Incarnation burst window
    - trinket_1,name="Trinket 1",if=config.use_trinket_1&trinket_1.sync&buff.incarnation_guardian_of_ursoc.up
    - trinket_2,name="Trinket 2",if=config.use_trinket_2&trinket_2.sync&buff.incarnation_guardian_of_ursoc.up
    - combat_potion,name="Combat Potion",if=combat_potion.ready&config.use_potion&buff.incarnation_guardian_of_ursoc.up
    # Incarnation/Berserk: require min enemies or boss target; never overlap (ref log spaces ~110s apart)
    - incarnation_guardian_of_ursoc,name="Incarnation",if=debuff.thrash.stack>=2&(active_enemies>=2|config.auto_incarn_st)
    # Sundering Roar: use for snap aggro on multiple targets or at 5 stacks
    - sundering_roar,name="Sundering Roar",if=active_enemies>=2|debuff.thrash.stack>=5
    # Lunar Beam: Use when stop moving
    - lunar_beam,name="Lunar Beam",if=player.standing.time>=1

  # Elune's Chosen rotation
  # Focuses on high Moonfire/Thrash uptime. Raze and Swipe are removed from this build.
  rotation_elunes:
    # Thrash: Core
    - thrash,name="Thrash"
    # Ironfur
    - ironfur,name="Ironfur",use_off_gcd=1,if=rage>=45
    # Mangle: Only on pure single-target
    - mangle,name="Mangle",if=active_enemies=1
    # Filler: Moonfire (Replaces Swipe entirely)
    - moonfire,name="Moonfire",delay=400

  # Heart of the Wild - Shift to Cat Form
  hotw:
    - rake,name="Cat Form",delay=400,if=!buff.cat_form.up&cooldown.heart_of_the_wild.ready
    - heart_of_the_wild,delay=400,name="Feral Frenzy",if=buff.cat_form.up

  # Main — entry point
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player

    # Heart of the Wild - Shift to Cat Form (auto when Lunar Beam is active for +25% Mastery damage boost)
    - call_action_list,name=hotw,if=buff.lunar_beam.up&target.range<=8

    # Ensure Bear Form; skip rotation if shifting failed
    - mangle,name="Bear Form",if=!buff.bear_form.up
    - return,if=!buff.bear_form.up

    # Combat priority: Interrupts > Defensives > Taunt > Utility > Racials > (valid target check) > CDs > Rotation
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=taunt
    - call_action_list,name=utility
    - call_action_list,name=racials

    - return,if=!target.exists|target.dead|!target.enemy
    - call_action_list,name=cooldowns
    - call_action_list,name=rotation_elunes
