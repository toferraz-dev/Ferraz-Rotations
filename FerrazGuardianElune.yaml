# =============================================================================
# Guardian Druid Ferraz M+ - spec 104 - patch 12.1.
# =============================================================================
#
# Lists (entry point: main):
#   engine                  set_tank_var            defensives              cooldowns
#   bear                    st                      aoe                     main
#
# REFERENCE BUILD 1.10.0: drops Raze, nothing else moved. Heart of the Wild,
# Soul of the Forest, Lunar Calling, Lunation and Flashing Claws rank 2 all
# stay, so the HotW weave and both Thrash lines are unaffected. The two Raze
# lines in `bear` are now dead weight; the two Maul lines beside them are live.
#
# WHY ANY OF IT IS THE WAY IT IS: .agents/rationale/GuardianElune.md
# That file carries every measurement, every rejected alternative and every
# bug this file has already been through. Read it before changing a line -
# most of what looks improvable here was tried and reverted.
# =============================================================================

version: "1.18.0"
patch: "12.1"
spec: 104
name: Guardian Druid Ferraz M+
author: Ferraz
description: |
  Guardian Druid 104 engine for 12.1, tuned for Mythic+.
  Elune's Chosen: Lunar Calling turns Thrash into Moonfire, while Lunation
  plus Galactic Guardian add further Moonfire slots. Rage splits between
  Ironfur, Raze, Maul on predicted incoming damage. Heart of the Wild weaves
  through Cat Form. ST/AoE split at 2 enemies within 8 yards.
entry: main

# SPELL OVERRIDES — AND-ed into every occurrence of that spell in the file.
spell_overrides:
  # Maul and Mangle deliberately NOT overridden globally: the old override cut
  # them from ~78 to ~15 casts a fight.

  # Blocks re-suggesting Incarnation while its own buff is up.
  incarnation_guardian_of_ursoc: "!buff.incarnation_guardian_of_ursoc.up"

  # Lunar Calling makes Thrash cast Moonfire — only allow raw Moonfire when
  # untalented, Thrash is on CD, or nothing is in Thrash range.
  moonfire: "!talent.lunar_calling.enabled|cooldown.77758.down|enemies.combat.8y=0"

  # Barkskin held for a predicted tank buster (Encounter Timeline, see
  # set_tank_var) unless the fight is short/final enough that holding is pointless.
  barkskin: "(!player.inmythicplus|fight_remains>=20|player.on_last_boss)&(variable.tank_buster_remains<=1|variable.tank_buster_casting|variable.tank_buster_remains>34)"

# CONFIG — defensive defaults are unvalidated by simulation.
config:
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-09-04 | Patch: 12.1 | Version: 1.18.0"

  # Exact string every number here was measured against (sim/Tassiana_guardian.simc).
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CgGADBD3hSPCL9Y9gz68WcKvMAAAAAAAAAAAAgZmxsYmZMziZxMmZZZgZzwoJamZWmZmZmlxMAAAAAAMzsZAbbzMYMLDgpAAAAbYmHAYxYYALWAYmBwA"

  # === DEFENSIVE HP THRESHOLDS === (reactive: fire once HP already dropped)
  survival_instincts_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 40
  frenzied_regeneration_hp_pct:
    section: "Defensive HP Percentage"
    label: "Frenzied Regeneration HP%"
    type: slider
    min: 0
    max: 100
    default: 75
    description: "Read against EFFECTIVE health (raw health, minus heal absorbs, plus heals already flying at you) - the only slider in this set that is. Every other druid rotation reads Frenzied Regeneration against raw health; a tank is being actively healed, so waiting on an inbound heal is worth more than reacting to the raw bar."
  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  # Proactive.
  survival_instincts_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival Instincts (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55
  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40
  # Drives var.heavy_incoming: above this, rage goes to Ironfur not Raze/Maul.
  ironfur_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Ironfur over Maul (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 20

  # === RAGE SPENDING === (100 cap on this build — default 20 fires at 80+ rage)
  rage_deficit_maul:
    label: "Rage Deficit (Maul)"
    type: slider
    min: 1
    max: 100
    default: 20
    description: "Maul fires once rage is within this much of the cap. Lower = more aggressive."

  cds_require_melee:
    section: "Cooldowns"
    label: "Cooldowns require a mob in melee"
    type: checkbox
    default: true
    description: "Hold the trinkets, the combat potion and Berserk/Incarnation until at least one enemy in combat is within 8 yards. Without it all three fire on cooldown while you are running between packs, and the window is spent on empty air. Turn OFF to go back to firing them the moment they are ready."

  # HotW weave is the single most valuable thing in the file.
  auto_hotw:
    section: "Cooldowns"
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true
    description: "Weave Cat Form -> Heart of the Wild -> Bear Form automatically when HotW is ready."
  hotw_delay:
    section: "Cooldowns"
    label: "Heart of the Wild (delay after pull)"
    type: slider
    min: 0
    max: 30
    default: 8
    description: "Seconds of combat required before leaving Bear Form for the HotW weave."
  hotw_hp_pct:
    section: "Cooldowns"
    label: "Heart of the Wild (minimum HP%)"
    type: slider
    min: 0
    max: 100
    default: 80
    description: "Stay in Bear Form below this health. Leaving Bear drops bear armor and stamina."
  hotw_min_standing_time:
    section: "Cooldowns"
    label: "Heart of the Wild (min standing still)"
    type: slider
    min: 0
    max: 10
    default: 2
    description: "Seconds standing still before the weave may fire. The morph is Feral Frenzy, a 5 yard melee hit that channels five ticks over roughly a second - start it while still repositioning and you either leave range mid-channel or spend the window walking. Standing still also means the pull is parked and the pack is on you. 0 disables the check."
  # The two below hold the weave when the NEXT few seconds look bad, not just
  # the current HP. Set either to 0 to disable that check.
  #
  # An Ironfur-remaining gate lived here until 1.16.0, requiring 4s left before
  # the weave. It was sized for a weave that cost "3-4 GCDs" - it does not.
  # Shapeshift is off-GCD and only one of HotW/morph resolves per form, so the
  # window is ONE GCD: measured at 1.10-1.20s across six weaves in a world-class
  # Guardian log. Holding 4s of armour for a 1.15s trip was a 3x margin.
  hotw_buster_window:
    section: "Cooldowns"
    label: "Heart of the Wild (tank buster window)"
    type: slider
    min: 0
    max: 20
    default: 6
    description: "Skip the weave when the Encounter Timeline predicts a tank buster within this many seconds. Same prediction the Barkskin hold uses."
  hotw_min_ttd:
    section: "Cooldowns"
    label: "Heart of the Wild (minimum target TTD)"
    type: slider
    min: 0
    max: 60
    default: 10
    description: "Skip the weave when the target dies sooner than this. Heart of the Wild is a 120s cooldown that fires an off-role ability for the current form - Feral Frenzy in Cat - so spending it on a pack that is about to die throws the cooldown away."
  # === TRINKETS === the Incarnation window is the whole gate. No TTD slider:
  # Incarnation carries no TTD check either, so a second one on the trinkets
  # only desynced the pair on short pulls - the trinket sat out a window the
  # burst had already opened. Still not trinket_X.sync, which AND-s in Simia's
  # own burst check on top, invisible to this file.

  trinket_sync_burst:
    section: "Cooldowns"
    label: "Trinkets: sync with Incarnation"
    type: checkbox
    default: true
    description: "Hold the trinkets for the Incarnation/Berserk window. Turn OFF to fire them on cooldown under the TTD gate alone, which is what this file did before 1.14.0. Read the note on potion_sync_burst below before deciding - the same hold measured WORSE for the potion, because the burst itself is held for the Heart of the Wild weave."

  # Combat potion. The file carried NO potion line at all before 1.1, which is
  # why every variant below beats the old baseline by so much.
  use_potion:
    section: "Cooldowns"
    label: "Auto Combat Potion"
    type: checkbox
    default: true
    description: "Fire the combat potion automatically. Measured +3.45% DungeonSlice synced to the burst."

  # Measured on DungeonSlice against this file's own baseline.
  potion_sync_burst:
    section: "Cooldowns"
    label: "Potion: sync with Incarnation"
    type: checkbox
    default: true
    description: "Hold the potion for the Incarnation/Berserk window. Turn OFF to fire it the moment it is ready, which measured 1.89% more — the burst is held for the Heart of the Wild weave, so syncing makes the potion wait too."

  # Lunar Beam plants a ground effect; casting it while running wastes it.
  lunar_beam_moving_check:
    label: "Lunar Beam (Moving Check)"
    type: checkbox
    default: true

  # === MOUSEOVER CONFIGURATIONS ===
  MO_moonfire:
    label: "Moonfire on MO"
    type: checkbox
    default: true
  allow_pull_with_mo:
    label: "Pull with MO"
    type: checkbox
    default: true

  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  # Travel Form. Every suggestion the rotation makes shifts you out of it, so
  # pausing keeps the form until you drop it yourself.
  engine_pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

  engine_auto_target:
    label: "Auto Target (Melee)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  engine_healthstone:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  engine_auto_brez:
    label: "Rebirth on Mouseover"
    section: "Engine"
    type: checkbox
    default: true
    description: "Battle rez a dead ally while hovering their unit frame. Pools rage first if you are in Bear Form."

  engine_auto_rez:
    label: "Revive on Mouseover (OOC)"
    section: "Engine"
    type: checkbox
    default: true

  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Engine"
    type: checkbox
    default: true

  auto_dispel_self:
    label: "Dispel Self (Poison/Curse)"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Only fires when you actually have a dispelable debuff."

  auto_dispel_party:
    label: "Dispel Party"
    section: "Dispels"
    type: checkbox
    default: false

  auto_purge_enrage:
    label: "Soothe Enrage"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe the current target when it has an enrage effect. ON by default — this is what Simia's shared list did before this file inlined its own plumbing, and it had no switch at all. Turn OFF on a key where the enrage is not worth the global."

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

variables:
  # 2+ enemies (threshold: 2 measured +0.70%, 4 measured -0.79% vs 3), and the
  # user's AoE toggle.
  aoe_mode: enemies.combat.8y>=2&state.aoe

  # Big hit predicted -> routes rage to Ironfur over Raze/Maul.
  # SimC has no equivalent prediction, treats this as permanently false.
  heavy_incoming: incoming.mitigated.pct>=config.ironfur_dmg_pct

  # The burst window itself. Berserk and Incarnation are mutually exclusive
  # talents, so this covers whichever one the build has.
  burst_active: buff.incarnation_guardian_of_ursoc.up|buff.berserk.up

  # Is there anything actually in melee to spend a cooldown on. Gates the
  # trinkets, the potion and Berserk/Incarnation - all three used to fire on
  # cooldown while running between packs, burning a window on empty air.
  # enemies.combat.8y, the same count var.aoe_mode and the engine's auto-target
  # use, so "melee range" means one thing across the file. Combat-filtered on
  # purpose: these are combat cooldowns and must not arm on an unpulled pack.
  melee_engaged: "!config.cds_require_melee|enemies.combat.8y>=1"

  # Gate for the HotW weave. target.in_melee matters: without it the weave
  # fired while running to the pack and burned the cooldown out of range -
  # the morph is Feral Frenzy, which has a 5 yard range.
  # Health alone is not enough: the last three checks look at the next few
  # seconds (incoming damage, predicted buster, target TTD) instead.
  hotw_weave: config.auto_hotw&talent.heart_of_the_wild&cooldown_bypass.heart_of_the_wild.ready&target.valid&target.attackable&target.in_melee&player.combat&combat.time>=config.hotw_delay&player.standing.time>=config.hotw_min_standing_time&health.pct>=config.hotw_hp_pct&!var.heavy_incoming&variable.tank_buster_remains>config.hotw_buster_window&target.time_to_die>=config.hotw_min_ttd&!buff.incarnation_guardian_of_ursoc.up&!buff.berserk.up

lists:
  # spell_queue, sanity_checks and auto_target, inlined.
  engine:
    # `&`, not `|` - with `|` this is true on almost every pass.
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.engine_pause_travel_form&buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5
    # Melee-only, and this file IS melee: keeps auto-attack running.
    - attack_target,off_gcd=true,delay=100,if=player.combat&target.exists&target.attackable&target.alive&target.in_melee&!player.auto_attacking

    - remove_corruption.player,delay=500,name="Remove Corruption (Self)",if=config.auto_dispel_self&player.dispelable.list
    - remove_corruption,delay=500,cycle=party,name="Remove Corruption (Party)",if=config.auto_dispel_party&cycle.dispelable.list
    - remove_corruption,delay=500,cycle=party,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.engine_affix_devour&cycle.debuff.440313.up.any
    # Hovering is the only way to Soothe a mob you are not targeting — see
    # the soothe_mouseover config for why a search line is impossible.
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe (Enrage)",if=config.auto_purge_enrage&target.purgeable.enrage

    - pool_resource,resource=rage,for_next=1,if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&buff.bear_form.up&cooldown.rebirth.ready
    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revive.mouseover,name="Revive (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    # Melee auto target: 8y, matching the shared melee list.
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=25&enemies.combat.8y>=1

    # Temple of Sethraliss: Storm Blessed is a hard damage immunity, so swap off
    # its holder. 1289229 is the AURA, not the cast id.
    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  # Tank-buster prediction feeding the barkskin override.
  set_tank_var:
    - variable,name=tank_buster_remains,value=999
    - variable,name=tank_buster_remains,value=encounter.next_tank.remains,if=encounter.next_tank.up&encounter.next_tank.severity>=1&encounter.next_tank.remains<variable.tank_buster_remains
    - variable,name=tank_buster_casting,value=encounter.next_tank.up&encounter.next_tank.remains<=1

  # Predicted damage first, reactive HP second. Unvalidated by simulation.
  defensives:
    - barkskin,name="Barkskin (Predicted Damage)",range_check=none,if=incoming.mitigated.pct>=config.barkskin_dmg_pct
    - survival_instincts,name="Survival Instincts (Predicted Damage)",range_check=none,if=incoming.mitigated.pct>=config.survival_instincts_dmg_pct
    - survival_instincts,name="Survival Instincts (HP)",range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    # Effective health here, raw everywhere else in the set: a tank has a healer
    # actively topping them, and effective counts heals already in flight, so
    # the charge is not spent on a bar that is about to refill on its own.
    - frenzied_regeneration,range_check=none,if=health.effective.pct<=config.frenzied_regeneration_hp_pct&buff.frenzied_regeneration.down
    - barkskin,name="Barkskin (HP)",range_check=none,if=health.pct<=config.barkskin_hp_pct

  cooldowns:
    - barkskin,if=buff.bear_form.up
    # Deliberately unsynced from Incarnation/Berserk — forcing sync measured
    # +0.17% (noise). Moving check: it's a ground effect, running out wastes it.
    - lunar_beam,if=target.valid&(!config.lunar_beam_moving_check|player.moving.time<=1)

    # Berserk/Incarnation are mutually exclusive talents, both listed so the
    # file works either way. Both carry var.melee_engaged: a burst opened while
    # running between packs is a burst spent on nothing.
    - berserk,if=target.valid&var.melee_engaged&(!config.auto_hotw|!talent.heart_of_the_wild|!cooldown_bypass.heart_of_the_wild.ready)
    - incarnation_guardian_of_ursoc,if=target.valid&var.melee_engaged&(!config.auto_hotw|!talent.heart_of_the_wild|!cooldown_bypass.heart_of_the_wild.ready)

    # Combat potion.
    - combat_potion,name="Combat Potion",if=config.use_potion&combat_potion.ready&player.combat&var.melee_engaged&(!config.potion_sync_burst|var.burst_active|fight_remains<=30)

    - wild_guardian,if=buff.lunar_beam.up

    # Racials, unconditional — dead on a Harronir character, kept for race changes.
    - blood_fury
    - berserking
    - fireblood
    - ancestral_call

  # Form + rage spending, shared by st/aoe. Called BEFORE them in main, so
  # anything here outranks the whole damage priority.
  bear:
    - bear_form,range_check=none,if=!buff.bear_form.up&!buff.cat_form.up

    # --- Ironfur, off the global cooldown (use_off_gcd=1, neutral for damage
    # but correct for M+ — not losing a GCD to armour) ---
    - ironfur,use_off_gcd=1,name="Ironfur (uptime)",if=buff.ironfur.remains<2&player.combat
    - ironfur,use_off_gcd=1,name="Ironfur (predicted dmg)",if=var.heavy_incoming
    - ironfur,use_off_gcd=1,name="Ironfur (overcap)",if=rage>=80
    # Dumping at 40 like SimC's raid APL measured -2.86% DungeonSlice
    # (+9.41% Patchwerk) — a raid-only gain. Do not "fix" this to match SimC.

    # Rage spenders, split on talent.raze. Raze is NOT on the 1.10.0 build, so
    # the Maul lines are the live pair.
    - maul,name="Maul (Gory Fur)",if=buff.1307881.up&!talent.raze.enabled&enemies.combat.8y<3&buff.ironfur.up&!var.heavy_incoming
    - raze,name="Raze (Gory Fur)",if=buff.1307881.up&talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming
    - maul,name="Maul",if=!talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming&rage.deficit<=config.rage_deficit_maul
    - raze,name="Raze",if=talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming&rage.deficit<=config.rage_deficit_maul

  # ST — damage priority below the AoE threshold.
  st:
    - moonfire,name="Moonfire (maintain)",if=target.valid&dot.moonfire.refreshable
    - 77758,name="Thrash (Lunar Calling)",range_check=mob_count_8y,if=cooldown.77758.ready&talent.lunar_calling.enabled

    # Must stay a real if=: target_if is a SimC modifier that does NOT exist
    # in Simia (absent from all stepModifiers).
    - 77758,name="Thrash (stacks)",range_check=mob_count_8y,if=cooldown.77758.ready&(dot.thrash.refreshable|dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)

    # Dead while Wildpower Surge is untalented (removing measured -0.04%, nothing).
    - mangle,name="Mangle (burst)",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.ursine_potential.stack<6&talent.wildpower_surge.enabled

    # Free in burst, else gated on rage headroom. Four numbers cover Fount of
    # Strength/SotF combos; live branch on this build (no Fount, yes SotF) is rage<83.
    - mangle,name="Mangle",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)|((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)

    # Placed after Mangle, not at the top of `bear` — proc lives long enough
    # to wait a GCD; jumping the queue cost 2.95%.
    - moonfire,name="Moonfire (GG proc)",if=buff.galactic_guardian.up&target.valid
    - 77758,name="Thrash (CD)",range_check=mob_count_8y,if=cooldown.77758.ready
    - moonfire,name="Moonfire (Lunation)",if=talent.lunation.enabled&buff.bear_form.up&target.valid
    # Numeric id: "swipe" also matches the Cat version.
    - 213764,name="Swipe (filler)"

  # Same as `st` with both Thrash lines promoted above Moonfire, no Lunation
  # slot — Swipe beats single-target Moonfire at several targets.
  aoe:
    - 77758,name="Thrash (Lunar Calling)",range_check=mob_count_8y,if=cooldown.77758.ready&talent.lunar_calling.enabled
    - 77758,name="Thrash (stacks)",range_check=mob_count_8y,if=cooldown.77758.ready&(dot.thrash.refreshable|dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)
    - moonfire,name="Moonfire (maintain)",if=target.valid&dot.moonfire.refreshable
    - mangle,name="Mangle (burst)",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.ursine_potential.stack<6&talent.wildpower_surge.enabled
    - mangle,name="Mangle",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)|((rage<88)&!talent.fount_of_strength.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)
    - moonfire,name="Moonfire (GG proc)",if=buff.galactic_guardian.up&target.valid
    - 77758,name="Thrash (CD)",range_check=mob_count_8y,if=cooldown.77758.ready
    - 213764,name="Swipe (filler)"

  # Entry point: first matching line wins the GCD.
  main:
    # Convoke is a channel and nothing here ever wants to break it.
    - return,if=player.channeling

    - call_action_list,name=set_tank_var
    - call_action_list,name=engine

    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    # !cat_form yields to the weave below so they don't fight each other.
    # enemies.40y is BARE on purpose - not enemies.combat.40y. This runs before
    # the pull, where the combat-filtered count is 0 by definition and the line
    # would be dead. Do not "standardise" it.
    - bear_form,range_check=none,if=buff.bear_form.down&!buff.cat_form.up&(target.attackable|enemies.40y)

    # --- Heart of the Wild weave — biggest block in the file: -15%
    # DungeonSlice if removed.
    - cat_form,name="Cat Form (HotW)",range_check=none,if=var.hotw_weave&buff.cat_form.down
    - heart_of_the_wild,name="Heart of the Wild",range_check=none,ignore_cds_toggle=true,if=buff.cat_form.up&cooldown_bypass.heart_of_the_wild.ready&target.valid&target.attackable&target.in_melee
    - 1261868,name="Heart of the Wild (cat morph)",range_check=none,ignore_cds_toggle=true,if=buff.cat_form.up&cooldown_bypass.heart_of_the_wild.ready&target.valid&target.attackable&target.in_melee
    # Escape hatches back to Bear if the cast is blocked, HP drops, or the
    # target dies or walks out of melee mid-weave.
    - bear_form,name="Bear Form (post-HotW)",range_check=none,if=buff.cat_form.up&(!cooldown_bypass.heart_of_the_wild.ready|health.pct<config.hotw_hp_pct|!target.valid|!target.attackable|!target.in_melee)

    - moonfire.mouseover,name="Moonfire (Pull)",if=config.MO_moonfire&config.allow_pull_with_mo&mouseover.enemy&mouseover.alive&mouseover.debuff.moonfire.down
    # COMBAT WALL - nothing below runs out of combat. player.combat, NOT
    # player.auto_combat, which is a config check and not combat state.
    - return,if=!player.combat



    - call_action_list,name=defensives

    - skull_bash,if=interrupt.target.check
    - skull_bash.mouseover,if=interrupt.mouseover.check
    - skull_bash.focus,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check
    # Racial/profession stuns — only one exists per character, rest never resolve.
    - quaking_palm,if=interrupt.cc.check
    - haymaker,if=interrupt.cc.check
    - war_stomp,if=interrupt.stun.aoe.check
    - bull_rush,if=interrupt.stun.aoe.check
    - tail_swipe,if=interrupt.stun.aoe.check

    # Taunt (dungeon/M+ only). !player.inraid stops it ripping a boss off the other tank.
    - growl,name="Taunt",if=target.threat<2&target.valid&target.threat!=-1&!player.inraid
    - growl.mouseover,name="Taunt MO",if=mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid


    # player.combat is redundant with the combat wall above and stated anyway:
    # these lines are the ones most likely to be moved, and the guard should
    # travel with them.
    - trinket_1,name="Trinket 1",if=trinket_1.ready&player.combat&var.melee_engaged&(!config.trinket_sync_burst|var.burst_active)
    - trinket_2,name="Trinket 2",if=trinket_2.ready&player.combat&var.melee_engaged&(!config.trinket_sync_burst|var.burst_active)

    # Second Ironfur trigger outside `bear`, so armour tops up on GCDs the
    # damage lists own. Overlaps the bear-list lines on purpose.
    - ironfur,use_off_gcd=1,delay=300,if=buff.ironfur.remains<2|rage>=80
    - moonfire,if=!target.in_melee&buff.bear_form.up&target.valid
    - moonfire.mouseover,name="Moonfire (In Combat)",if=config.MO_moonfire&mouseover.enemy&mouseover.alive&mouseover.debuff.moonfire.down&mouseover.combat

    # --- Damage priority ---
    - call_action_list,name=cooldowns
    - call_action_list,name=bear,if=buff.bear_form.up
    - call_action_list,name=aoe,if=buff.bear_form.up&var.aoe_mode
    - call_action_list,name=st,if=buff.bear_form.up&!var.aoe_mode
