
version: "6.0.0"
patch: "12.1"
spec: 104
name: Guardian Druid Ferraz M+
author: Ferraz
description: |
  Guardian Druid 104 engine for 12.1, tuned for Mythic+.
  Elunes Chosen: Lunar Calling turns Thrash into Moonfire, while Lunation
  plus Galactic Guardian add further Moonfire slots. Rage goes into Ironfur
  from 40; Maul is spent on Dream Conduit procs, which awaken a guardian spirit.
  Heart of the Wild weaves through Cat Form. ST/AoE split at 2 enemies within 8 yards.
entry: main

spell_overrides:

  incarnation_guardian_of_ursoc: "!buff.incarnation_guardian_of_ursoc.up"

  moonfire: "!talent.lunar_calling.enabled|cooldown.77758.down|enemies.combat.8y=0"

  barkskin: "(!player.inmythicplus|fight_remains>=20|player.on_last_boss)&(variable.tank_buster_remains<=1|variable.tank_buster_casting|variable.tank_buster_remains>34)"

config:
  # ---- Info --------------------------------------------------------
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-10-29 | Patch: 12.1 | Version: 6.0.0"

  hp_legend:
    section: "Info"
    type: note
    label: "HP % (effective) vs (real HP)"
    text: "effective = real HP + incoming heals - heal absorbs. Good for 'does this still need healing'. real HP = actual health only, used for emergencies, defensives and consumables."

  # ---- Talents -----------------------------------------------------
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CgGADBD3hSPCL9Y9gz68WcKvMAAAAAAAAAAAAgZmxsYmZMziZxMmZZZgZzwoJamZWmZmZmlxMAAAAAAMjNDYbbmBjZbAMFAAAYDzMALGDDYxCAzMAG"

  # ---- Defensives --------------------------------------------------
  survival_instincts_dmg_pct:
    section: "Defensives"
    label: "Survival Instincts - Predicted HP % Remaining (effective)"
    type: slider
    min: 10
    max: 100
    default: 40
    description: "Use Survival Instincts when your effective health minus the biggest predicted incoming hit, after active defensives, would put you at or below this HP %."

  survival_instincts_hp_pct:
    section: "Defensives"
    label: "Survival Instincts HP % (real HP)"
    type: slider
    min: 0
    max: 100
    default: 40
    description: "Survival Instincts below this real health."

  barkskin_dmg_pct:
    section: "Defensives"
    label: "Barkskin - Predicted HP % Remaining (effective)"
    type: slider
    min: 10
    max: 100
    default: 40
    description: "Use Barkskin when your effective health minus the biggest predicted incoming hit, after active defensives, would put you at or below this HP %. Like every Barkskin line, it is held while a predicted tank buster is 1-34 s away, and in M+ while the fight is estimated to end in under 20 s, except on the last boss."

  barkskin_hp_pct:
    section: "Defensives"
    label: "Barkskin HP % (real HP)"
    type: slider
    min: 0
    max: 100
    default: 50
    description: "Barkskin below this real health. Like every Barkskin line, it is held while a predicted tank buster is 1-34 s away, and in M+ while the fight is estimated to end in under 20 s, except on the last boss."

  frenzied_regeneration_hp_pct:
    section: "Defensives"
    label: "Frenzied Regeneration HP % (effective)"
    type: slider
    min: 0
    max: 100
    default: 85
    description: "Frenzied Regeneration below this effective health: real HP minus heal absorbs plus heals already flying at you. In 12.1 it costs only 10 rage with a 1 s cooldown, so it is a cheap heal rather than an emergency button; the world's top Guardian presses it more than twice as often as this used to, at the same overheal."

  engine_healthstone:
    label: "Healthstone HP % (real HP)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 40
    description: "Healthstone below this real health."

  engine_health_potion:
    label: "Health Potion HP % (real HP)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 25
    description: "Health potion below this real health."

  root_cleanse:
    label: "Break Roots by Shapeshifting"
    section: "Defensives"
    type: checkbox
    default: true
    description: "Shift to Cat and back to break a root or snare. Only with 3+ Ironfur stacks, above 90% HP and Barkskin or Survival Instincts up; otherwise you stay in Bear and accept the root. At most one attempt every 8 s."

  # ---- Rage --------------------------------------------------------
  ironfur_dmg_pct:
    section: "Rage"
    label: "Ironfur over Maul - Incoming Damage %"
    type: slider
    min: 0
    max: 100
    default: 20
    description: "When the biggest predicted incoming hit, after active defensives, is at least this % of your health, rage goes to Ironfur right away, even while it would otherwise be pooled (a guardian spirit out, or a Dream Conduit Maul waiting), and Maul waits. The same check also blocks the HotW weave."

  rage_deficit_maul:
    section: "Rage"
    label: "Maul - Rage Deficit"
    type: slider
    min: 1
    max: 100
    default: 20
    description: "Maul once rage is within this much of the cap, while Ironfur is up and no heavy hit is predicted. Since rage now goes into Ironfur from 40, this rarely triggers; Dream Conduit procs are Mauled on their own line regardless of this slider."

  # ---- Cooldowns ---------------------------------------------------
  auto_hotw:
    section: "Cooldowns"
    label: "Auto Heart of the Wild"
    type: checkbox
    default: true
    description: "Weave Cat Form, Heart of the Wild, then back to Bear Form automatically when HotW is ready."

  hotw_delay:
    section: "Cooldowns"
    label: "Heart of the Wild - Delay After Pull"
    type: slider
    min: 0
    max: 30
    default: 8
    description: "Seconds of combat required before leaving Bear Form for the HotW weave."

  hotw_max_hold:
    section: "Cooldowns"
    label: "Incarnation - Max Wait for Heart of the Wild"
    type: slider
    min: 0
    max: 20
    default: 4
    description: "Incarnation/Berserk wait for the HotW weave through the HotW delay at the pull plus this many seconds. After that, if the weave is blocked (moving, low HP, heavy damage predicted, tank buster soon, target dying), Incarnation goes and HotW waits for it to end. 0 = wait only the HotW delay."

  hotw_hp_pct:
    section: "Cooldowns"
    label: "Heart of the Wild - Minimum HP % (real HP)"
    type: slider
    min: 0
    max: 100
    default: 80
    description: "Stay in Bear Form below this health. Leaving Bear drops bear armor and stamina."

  hotw_min_standing_time:
    section: "Cooldowns"
    label: "Heart of the Wild - Min Standing Still"
    type: slider
    min: 0
    max: 10
    default: 2
    description: "Seconds standing still before the weave may fire. The morph is Feral Frenzy, a 5 yard melee hit that channels five ticks over roughly a second - start it while still repositioning and you either leave range mid-channel or spend the window walking. Standing still also means the pull is parked and the pack is on you. 0 disables the check."

  hotw_buster_window:
    section: "Cooldowns"
    label: "Heart of the Wild - Tank Buster Window"
    type: slider
    min: 0
    max: 20
    default: 6
    description: "Skip the weave when the Encounter Timeline predicts a tank buster within this many seconds. Same prediction the Barkskin hold uses."

  hotw_min_ttd:
    section: "Cooldowns"
    label: "Heart of the Wild - Minimum Target TTD"
    type: slider
    min: 0
    max: 60
    default: 10
    description: "Skip the weave when the target dies sooner than this. Heart of the Wild is a 120s cooldown that fires an off-role ability for the current form - Feral Frenzy in Cat - so spending it on a pack that is about to die throws the cooldown away."

  lunar_beam_moving_check:
    section: "Cooldowns"
    label: "Lunar Beam - Only When Standing"
    type: checkbox
    default: true
    description: "Hold Lunar Beam once you have been moving for more than 1 s. It is a ground effect, so running out of it wastes it."

  trinket_sync_burst:
    section: "Cooldowns"
    label: "Trinkets - Sync with Incarnation"
    type: checkbox
    default: true
    description: "Hold on-use trinkets for the Incarnation/Berserk window. OFF fires them on cooldown."

  use_potion:
    section: "Cooldowns"
    label: "Auto Combat Potion"
    type: checkbox
    default: true
    description: "Use the combat potion during Incarnation/Berserk, or in the last 30 s of the fight."

  # ---- Damage ------------------------------------------------------
  MO_moonfire:
    section: "Damage"
    label: "Moonfire on Mouseover"
    type: checkbox
    default: true
    description: "In combat, Moonfire the enemy under your mouse when it is in combat and missing Moonfire."

  allow_pull_with_mo:
    section: "Damage"
    label: "Pull with Mouseover Moonfire"
    type: checkbox
    default: false
    description: "Out of combat, Moonfire the enemy under your mouse to pull it. OFF by default: with it on, hovering any enemy nameplate pulls. Needs Moonfire on Mouseover."

  # ---- Utility -----------------------------------------------------
  use_growl:
    section: "Utility"
    label: "Auto Taunt (Growl)"
    type: checkbox
    default: true
    description: "Growl your target and your mouseover when they are not on you. Never fires in a raid, where it would rip a boss off the other tank."

  # ---- Dispels -----------------------------------------------------
  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Remove Corruption on Devouring Rift (440313), you first."

  auto_purge_enrage:
    label: "Soothe Enrage (Target)"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe the current target when it is enraged. Turn OFF on keys where the enrage is not worth the global."

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

  # ---- Engine ------------------------------------------------------
  engine_auto_target:
    label: "Auto Target (Melee)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]
    description: "In combat, target the nearest enemy within 8 yd when you have none, it died, or it is 25+ yd away."

  engine_auto_brez:
    label: "Rebirth on Mouseover (in combat)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Battle rez a dead ally while hovering their unit frame. Pools rage first if you are in Bear Form."

  engine_auto_rez:
    label: "Revive on Mouseover (out of combat)"
    section: "Engine"
    type: checkbox
    default: true
    description: "Revive the dead ally under your mouse out of combat."

  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true
    description: "Loot corpses in reach."

  engine_pause_travel_form:
    label: "Pause in Travel Form"
    section: "Engine"
    type: checkbox
    default: false
    description: "Stop the whole rotation while you are in Travel Form. OFF by default: the rotation keeps running, and the first thing it suggests will shift you out. Turn ON if you use Travel Form to move between packs and want it left alone — nothing at all is suggested until you leave the form."

variables:
  aoe_mode: enemies.combat.8y>=2&state.aoe

  heavy_incoming: incoming.mitigated.pct>=config.ironfur_dmg_pct

  druid_shapeshift_root: debuff_list.freedom.up
  druid_shapeshift_safe: buff.ironfur.stacks>=3&health.pct>90&(buff.barkskin.up|buff.survival_instincts.up)

  burst_active: buff.incarnation_guardian_of_ursoc.up|buff.berserk.up

  melee_engaged: enemies.combat.8y>=1

  hotw_weave: config.auto_hotw&talent.heart_of_the_wild&cooldown_bypass.heart_of_the_wild.ready&target.valid&target.attackable&target.in_melee&player.combat&combat.time>=config.hotw_delay&player.standing.time>=config.hotw_min_standing_time&health.pct>=config.hotw_hp_pct&!var.heavy_incoming&variable.tank_buster_remains>config.hotw_buster_window&target.time_to_die>=config.hotw_min_ttd&!buff.incarnation_guardian_of_ursoc.up&!buff.berserk.up

  # Berserk/Incarnation wait for the HotW weave only while it can still happen: through the
  # HotW delay at the pull plus hotw_max_hold seconds. Past that, a blocked weave stops holding them.
  burst_unblocked: "!config.auto_hotw|!talent.heart_of_the_wild|!cooldown_bypass.heart_of_the_wild.ready|(!var.hotw_weave&combat.time>=config.hotw_delay+config.hotw_max_hold)"

lists:
  engine:
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=config.engine_pause_travel_form&buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5
    - attack_target,off_gcd=true,delay=100,if=player.combat&target.exists&target.attackable&target.alive&target.in_melee&!player.auto_attacking

    # Heartstop Poison (Murder Row, 1216590) stacks and reduces max health. The shared dispel list holds it until 4 stacks;
    # here it goes at 2. Written as its own lines (any source, hence .any) so the shared list stays untouched for everyone else.
    # The self line covers the tank being the target: cycle=party may not include you.
    - remove_corruption,delay=500,cycle=members,name="Remove Corruption (Heartstop Poison, Self)",if=cycle.is_player&cycle.debuff.1216590.stacks.any>=2
    - remove_corruption,delay=500,cycle=party,name="Remove Corruption (Heartstop Poison)",if=cycle.debuff.1216590.stacks.any>=2
    - remove_corruption,delay=500,cycle=party,name="Remove Corruption",if=cycle.dispelable.list
    - remove_corruption,delay=500,cycle=party,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.engine_affix_devour&cycle.debuff.440313.up.any
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe (Enrage)",if=config.auto_purge_enrage&target.purgeable.enrage

    - pool_resource,resource=rage,for_next=1,if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&buff.bear_form.up&cooldown.rebirth.ready
    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revive.mouseover,name="Revive (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    - healthstone,name="Healthstone",delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,name="Health Potion",delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=25&enemies.combat.8y>=1

    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  set_tank_var:
    - variable,name=tank_buster_remains,value=999
    - variable,name=tank_buster_remains,value=encounter.next_tank.remains,if=encounter.next_tank.up&encounter.next_tank.severity>=1&encounter.next_tank.remains<variable.tank_buster_remains
    - variable,name=tank_buster_casting,value=encounter.next_tank.up&encounter.next_tank.remains<=1

  defensives:
    - barkskin,name="Barkskin (Predicted Damage)",range_check=none,if=(health.effective.pct-incoming.mitigated.pct)<=config.barkskin_dmg_pct
    - survival_instincts,name="Survival Instincts (Predicted Damage)",range_check=none,if=(health.effective.pct-incoming.mitigated.pct)<=config.survival_instincts_dmg_pct
    - survival_instincts,name="Survival Instincts (HP)",range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - frenzied_regeneration,name="Frenzied Regeneration",range_check=none,if=health.effective.pct<=config.frenzied_regeneration_hp_pct&buff.frenzied_regeneration.down
    - barkskin,name="Barkskin (HP)",range_check=none,if=health.pct<=config.barkskin_hp_pct

  cooldowns:
    - trinket_1,name="Trinket 1 (Burst Forced)",off_gcd=true,ignore_queue=true,if=trinket_1.ready&player.combat&var.burst_active
    - trinket_2,name="Trinket 2 (Burst Forced)",off_gcd=true,ignore_queue=true,if=trinket_2.ready&player.combat&var.burst_active
    - combat_potion,name="Combat Potion (Burst Forced)",off_gcd=true,ignore_queue=true,if=config.use_potion&combat_potion.ready&player.combat&var.burst_active

    - barkskin,name="Barkskin (on CD)",if=buff.bear_form.up
    - lunar_beam,name="Lunar Beam",if=target.valid&(!config.lunar_beam_moving_check|player.moving.time<=1)

    - berserk,name="Berserk",if=target.valid&var.melee_engaged&var.burst_unblocked
    - incarnation_guardian_of_ursoc,name="Incarnation",if=target.valid&var.melee_engaged&var.burst_unblocked

    - combat_potion,name="Combat Potion",off_gcd=true,ignore_queue=true,if=config.use_potion&combat_potion.ready&player.combat&var.melee_engaged&(var.burst_active|fight_remains<=30)

    # Wild Guardian only goes out inside Incarnation. Waiting for Lunar Beam (SimC default) left it 0-26 s
    # into the 35 s window; the world #1 Guardian presses it right after Incarnation, so the reset
    # Thrash/Mangle and their +30% cover the whole window.
    - wild_guardian,name="Wild Guardian",if=var.burst_active&!buff.1308647.up

    - blood_fury,name="Blood Fury"
    - berserking,name="Berserking"
    - fireblood,name="Fireblood"
    - ancestral_call,name="Ancestral Call"

  bear:
    - bear_form,name="Bear Form (rage lists)",range_check=none,if=!buff.bear_form.up&!buff.cat_form.up

    - ironfur,use_off_gcd=1,name="Ironfur (uptime)",if=buff.ironfur.remains<2&player.combat
    - ironfur,use_off_gcd=1,name="Ironfur (Gory Fur)",if=buff.201671.up&player.combat
    - ironfur,use_off_gcd=1,name="Ironfur (predicted dmg)",if=var.heavy_incoming
    # Rage goes to Ironfur from 40 (SimC default APL). Spending only past 80 left rage at the cap (10% of
    # all rage wasted in a key, against 0.6% for the world #1 Guardian), lowered the average stacks (3.0
    # vs 3.9) and kept Mangle behind its own rage gate (rage<83 with Soul of the Forest). With a spirit
    # out (Answered Calling, 1308647) it pools to 80, as SimC does; with Dream Conduit (1308176) up it
    # waits, so the rage is there for the Maul that awakens the spirit.
    - ironfur,use_off_gcd=1,name="Ironfur (rage)",if=player.combat&rage>=40&!buff.1308647.up&!buff.1308176.up
    - ironfur,use_off_gcd=1,name="Ironfur (rage, spirit out)",if=player.combat&rage>=80&buff.1308647.up
    - ironfur,use_off_gcd=1,name="Ironfur (overcap)",if=rage>=80

    - maul,name="Maul (Gory Fur)",if=buff.1307881.up&!talent.raze.enabled&enemies.combat.8y<3&buff.ironfur.up&!var.heavy_incoming
    - raze,name="Raze (Gory Fur)",if=buff.1307881.up&talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming
    - maul,name="Maul",if=!talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming&rage.deficit<=config.rage_deficit_maul
    - raze,name="Raze",if=talent.raze.enabled&buff.ironfur.up&!var.heavy_incoming&rage.deficit<=config.rage_deficit_maul

  st:
    - moonfire,name="Moonfire (maintain)",if=target.valid&dot.moonfire.refreshable
    - 77758,name="Thrash (Lunar Calling)",range_check=mob_count_8y,if=cooldown.77758.ready&talent.lunar_calling.enabled

    - 77758,name="Thrash (stacks)",range_check=mob_count_8y,if=cooldown.77758.ready&(dot.thrash.refreshable|dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)
    # Dream Conduit (1308176, 60 s): the next Maul/Raze awakens a guardian spirit, which resets Thrash and
    # Mangle, gives them +30% and generates rage. The rotation never spent it: 11 of 14 expired in a key,
    # while the world #1 Guardian Mauled all of his. After Thrash, as in SimC; not while a spirit is out.
    - maul,name="Maul (Dream Conduit)",if=buff.1308176.up&!buff.1308647.up&!talent.raze.enabled
    - raze,name="Raze (Dream Conduit)",if=buff.1308176.up&!buff.1308647.up&talent.raze.enabled

    - mangle,name="Mangle (burst)",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.ursine_potential.stack<6&talent.wildpower_surge.enabled

    - mangle,name="Mangle",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)|((rage<88)&!talent.fount_of_strength.enabled&!talent.soul_of_the_forest.enabled)|((rage<83)&!talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)|((rage<108)&talent.fount_of_strength.enabled&!talent.soul_of_the_forest.enabled)|((rage<103)&talent.fount_of_strength.enabled&talent.soul_of_the_forest.enabled)

    - moonfire,name="Moonfire (GG proc)",if=buff.213708.up&target.valid
    - 77758,name="Thrash (CD)",range_check=mob_count_8y,if=cooldown.77758.ready
    - moonfire,name="Moonfire (Lunation)",if=talent.lunation.enabled&buff.bear_form.up&target.valid
    - 213764,name="Swipe (filler)"

  aoe:
    - 77758,name="Thrash (Lunar Calling)",range_check=mob_count_8y,if=cooldown.77758.ready&talent.lunar_calling.enabled
    - 77758,name="Thrash (stacks)",range_check=mob_count_8y,if=cooldown.77758.ready&(dot.thrash.refreshable|dot.thrash.stack<5&talent.flashing_claws.rank=2|dot.thrash.stack<4&talent.flashing_claws.rank=1|dot.thrash.stack<3&!talent.flashing_claws.enabled)
    # Dream Conduit (1308176, 60 s): the next Maul/Raze awakens a guardian spirit, which resets Thrash and
    # Mangle, gives them +30% and generates rage. The rotation never spent it: 11 of 14 expired in a key,
    # while the world #1 Guardian Mauled all of his. After Thrash, as in SimC; not while a spirit is out.
    - maul,name="Maul (Dream Conduit)",if=buff.1308176.up&!buff.1308647.up&!talent.raze.enabled
    - raze,name="Raze (Dream Conduit)",if=buff.1308176.up&!buff.1308647.up&talent.raze.enabled
    - moonfire,name="Moonfire (maintain)",if=target.valid&dot.moonfire.refreshable
    - mangle,name="Mangle (burst)",if=(buff.incarnation_guardian_of_ursoc.up|buff.berserk.up)&buff.ursine_potential.stack<6&talent.wildpower_surge.enabled
