version: 3.2
author: Ferraz
patch: "12.0.1"
spec: 104
name: Guardian Master
description: |
  Master Guardian Druid Rotation for Mythic+.
  Supports both Elunes Chosen / Druid of the Claw hero talents.
  Includes Wowhead (Aggressive DPS) - Alternative / Method.gg (Balanced) rotation styles.

entry: main

config:

  # HERO TALENT TREE
  hero_tree:
    label: "Hero Talent Tree"
    type: dropdown
    options:
      - label: "Elune's Chosen"
        value: 1
      - label: "Druid of the Claw"
        value: 2
    default: 1

  # ROTATION STYLE
  rotation_source:
    label: "Rotation Style"
    type: dropdown
    options:
      - label: "Wowhead (Aggressive DPS)"
        value: 1
      - label: "Alternative / Method (Balanced)"
        value: 2
    default: 2

  # CONFIG
  use_racials:
    label: "Auto Racials"
    type: checkbox
    default: true
  allow_pull_with_mo:
    label: "Pull with Moonfire"
    type: checkbox
    default: true
  survival_instincts_threshold:
    label: Survival Instincts %
    type: slider
    min: 10
    max: 70
    default: 50
  frenzied_regen_threshold:
    label: Frenzied Regeneration %
    type: slider
    min: 30
    max: 80
    default: 65
  barkskin_threshold:
    label: Barkskin %
    type: slider
    min: 30
    max: 90
    default: 65
  ironfur_stacks_min:
    label: "Min Ironfur Stacks to maintain"
    type: slider
    min: 1
    max: 7
    default: 1
  ironfur_stacks_max:
    label: "Max Ironfur Stacks (heavy damage)"
    type: slider
    min: 2
    max: 10
    default: 3
  ironfur_rage_threshold:
    label: "Min Rage for Ironfur"
    type: slider
    min: 30
    max: 80
    default: 40
  rage_cap_threshold:
    label: "Rage Cap Threshold (dump)"
    type: slider
    min: 60
    max: 100
    default: 80

  # MAJOR COOLDOWNS
  incarnation_enemies:
    label: "Min enemies for Incarnation"
    type: slider
    min: 1
    max: 10
    default: 3
  rage_of_sleeper_threshold:
    label: "HP% for Rage of the Sleeper (Elune)"
    type: slider
    min: 30
    max: 90
    default: 70
  use_heart_of_the_wild:
    label: "Use Heart of the Wild"
    type: checkbox
    default: true

  # ROTATION
  thrash_stacks_target:
    label: "Thrash Stacks to maintain"
    type: slider
    min: 1
    max: 5
    default: 3
  raze_targets:
    label: "Min targets for Raze (instead of Maul - Elune)"
    type: slider
    min: 2
    max: 5
    default: 2

  # INTERRUPTS
  use_skull_bash:
    label: "Auto Interrupt"
    type: checkbox
    default: true
  skull_bash_delay:
    label: "Interrupt Delay (ms)"
    type: slider
    min: 0
    max: 2000
    default: 250

  # MOVEMENT
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2
  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    type: slider
    min: 0
    max: 4
    default: 2

  # TRINKETS
  use_trinkets:
    label: "Auto Trinkets"
    type: checkbox
    default: true

variables:
  # FORM AND RESOURCES
  in_bear_form: buff.bear_form.up
  rage: player.rage
  rage_deficit: player.rage.max-player.rage
  rage_overcap: var.rage>=config.rage_cap_threshold
  rage_for_harnessed: var.rage>=80

  # DEFENSIVE BUFFS
  ironfur_stacks: buff.ironfur.stack
  need_ironfur: var.ironfur_stacks<config.ironfur_stacks_min&var.rage>=config.ironfur_rage_threshold
  heavy_damage: health.pct<70&var.ironfur_stacks<config.ironfur_stacks_max
  dangerous_situation: health.pct<50&!buff.survival_instincts.up
  emergency_situation: health.pct<30
  barkskin_up: buff.barkskin.up
  survival_up: buff.survival_instincts.up
  any_major_defensive: var.barkskin_up|var.survival_up|buff.rage_of_the_sleeper.up
  after_avenger_up: buff.after_avenger.up|buff.after_the_wildfire.up

  # OFFENSIVE PROCS
  galactic_guardian_up: buff.galactic_guardian.up
  tooth_and_claw_up: buff.tooth_and_claw.up
  gore_up: buff.gore.up
  harnessed_rage: talent.harnessed_rage
  mangle_charges: cooldown.mangle.charges

  # DOT TRACKING
  thrash_stacks: debuff.thrash.stack
  thrash_target_stacks: config.rotation_source=1?5:config.thrash_stacks_target
  thrash_needs_refresh: debuff.thrash.remains<4.5|debuff.thrash.stack<var.thrash_target_stacks
  moonfire_needs_refresh: debuff.moonfire.remains<4.8

  # COOLDOWN STATES
  lunar_beam_active: buff.lunar_beam.up
  lunar_beam_soon: cooldown.lunar_beam.remains<15
  lunar_beam_ready: cooldown.lunar_beam.ready
  incarnation_active: buff.incarnation_guardian_of_ursoc.up|buff.berserk.up
  combat_start: player.combat&player.combat.time<3
  
  # ELUNE'S CHOSEN SYNERGY
  use_lunar_beam: var.lunar_beam_ready&(active_enemies>=2|health.pct<70|target.boss)

  # TARGETING
  use_raze: config.hero_tree=1&active_enemies>=config.raze_targets
  can_interrupt: target.casting&!target.casting.interruptible=false

  # MOVEMENT
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:

  spell_queue:
    - queue_spell,name="Spell Queue"

  buff_mark_of_the_wild:
    - mark_of_the_wild,name="Mark of the Wild",if=group.count(cycle.buff.mark_of_the_wild.down.any)>0

  sanity_checks:
    - return,if=player.dead
    - return,if=mounted
    - return,if=!state.rotation
    - return,if=state.blocked_inputs
    - return,if=player.cc
    - return,if=player.loot_nearby

  racials:
    - blood_fury,name="Blood Fury",if=var.incarnation_active
    - berserking,name="Berserking",if=var.incarnation_active
    - fireblood,name="Fireblood",if=var.incarnation_active
    - ancestral_call,name="Ancestral Call",if=var.incarnation_active

  defensives:
    - survival_instincts,name="Survival Instincts (Panic)",if=var.emergency_situation&!var.survival_up
    - rage_of_the_sleeper,name="Rage Sleeper (Panic)",if=config.hero_tree=1&var.emergency_situation&!var.survival_up
    - frenzied_regeneration,name="Frenzied Regen (Panic)",if=var.emergency_situation&var.rage>=10
    - barkskin,name="Barkskin (Panic)",if=var.emergency_situation&!var.survival_up
    - survival_instincts,name="Survival Instincts",if=var.dangerous_situation&!var.barkskin_up
    - frenzied_regeneration,name="Frenzied Regen",if=var.dangerous_situation&var.rage>=20
    - ironfur,name="Ironfur (Defensive)",if=var.dangerous_situation&var.rage>=40
    - survival_instincts,name="Survival Instincts (Low HP)",if=health.pct<config.survival_instincts_threshold&cooldown.frenzied_regeneration.remains>2&!var.any_major_defensive
    - frenzied_regeneration,name="Frenzied Regen (Low HP)",if=health.pct<config.frenzied_regen_threshold
    - barkskin,name="Barkskin",if=health.pct<config.barkskin_threshold&!var.survival_up
    - ironfur,name="Ironfur (Avenger)",if=var.after_avenger_up&var.ironfur_stacks<config.ironfur_stacks_max
    - ironfur,name="Ironfur (Heavy)",if=var.heavy_damage&var.rage>=40
    - ironfur,name="Ironfur (Incarnation)",if=var.incarnation_active&var.ironfur_stacks<config.ironfur_stacks_max&var.rage>=45
      
  cooldowns:
    - wild_guardian,name="Wild Guardian (Apex)",if=var.incarnation_active
    - heart_of_the_wild,name="Heart of the Wild",if=config.use_heart_of_the_wild&var.in_bear_form&(cooldown.incarnation_guardian_of_ursoc.ready|var.incarnation_active|active_enemies>=3|target.boss)
    - lunar_beam,name="Lunar Beam",if=config.hero_tree=1&var.use_lunar_beam&target.range<=10
    - incarnation_guardian_of_ursoc,name="Incarnation",if=active_enemies>=config.incarnation_enemies|(target.boss&target.time_to_die>20)
    - berserk_ravage,name="Berserk Ravage",if=talent.berserk_ravage&(active_enemies>=3|target.boss)
    - berserk_ravage,name="Berserk (Elune)",if=config.hero_tree=1&talent.berserk&(active_enemies>=3|target.boss)
    - rage_of_the_sleeper,name="Rage of the Sleeper",if=health.pct<config.rage_of_sleeper_threshold|active_enemies>=3|var.incarnation_active
  
  interrupts:
    # Auto Swap
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    
    # Interrupts
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check
    
    # Utility
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - mighty_bash,name="Mighty Bash",if=interrupt.cc.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  taunt:
    - growl,name="Growl (MO)",target=mouseover,if=target.threat<3&target.alive&target.enemy
    - growl,name="Growl ST",if=target.threat<3
  
  rage_management:
    - ironfur,name="Ironfur (Resource Dump)",if=var.ironfur_stacks<config.ironfur_stacks_max&var.rage>=85&buff.ironfur.remains<2
    - ravage,name="Ravage (Proc)",if=config.hero_tree=2&buff.ravage.up
    - maul,name="Maul (Tooth/Claw)",if=var.tooth_and_claw_up&var.rage>=40&!var.use_raze
    - raze,name="Raze (Dump)",if=var.use_raze&var.rage_for_harnessed
    - raze,name="Raze (Overcap)",if=var.use_raze&var.rage_overcap
    - maul,name="Maul (Incarnation)",if=var.incarnation_active&var.rage>=50&!var.use_raze
    - maul,name="Maul (Overcap)",if=!var.use_raze&var.rage_overcap
    - ironfur,name="Ironfur (Maintenance)",if=var.need_ironfur
  
  moonfire_spread:
    - moonfire,name="Moonfire Start",if=var.combat_start&debuff.moonfire.down&range<=40
    - moonfire,name="Moonfire Incarnation",if=var.incarnation_active&debuff.moonfire.down&range<=40
    - moonfire,name="Moonfire (Galactic)",if=var.galactic_guardian_up
    - moonfire,name="Moonfire (Beam Sync)",if=config.hero_tree=1&var.lunar_beam_soon&var.moonfire_needs_refresh
    - moonfire,name="Moonfire Apply",if=debuff.moonfire.down
    - moonfire,name="Moonfire Refresh",if=var.moonfire_needs_refresh
    - moonfire,name="Moonfire (MO)",target=mouseover,if=debuff.moonfire.down&range<=40&target.alive&target.enemy

  # ----------------------------------------------------------
  #  ELUNE'S CHOSEN ROTATIONS
  # ----------------------------------------------------------
  
  rotation_st_elune_wowhead:
    - moonfire,name="Moonfire GG ST (W)",if=var.galactic_guardian_up
    - maul,name="Maul (Harnessed)",if=var.rage>=80&config.rotation_source=1
    - mangle,name="Mangle ST (W)",if=var.gore_up|cooldown.mangle.ready
    - thrash,name="Thrash Build ST (W)",if=debuff.thrash.stack<3
    - moonfire,name="Moonfire Refresh ST (W)",if=var.moonfire_needs_refresh
    - maul,name="Maul Dump ST (W)",if=var.rage>=40
    - thrash,name="Thrash Filler ST (W)"
    - swipe,name="Swipe Filler ST (W)"

  rotation_st_elune_alt:
    - moonfire,name="Moonfire (Guardian Proc)",if=var.galactic_guardian_up
    - mangle,name="Mangle (Proc)",if=var.gore_up
    - mangle,name="Mangle (Charges)",if=var.harnessed_rage&cooldown.mangle.charges_fractional>=1.8
    - mangle,name="Mangle Filler"
    - thrash,name="Thrash Maintenance",if=debuff.thrash.stack<3
    - moonfire,name="Moonfire (Refresh)",if=var.moonfire_needs_refresh
    - raze,name="Raze (Dump)",if=active_enemies=1&var.rage>=90
    - maul,name="Maul (Dump)",if=var.rage>=config.rage_cap_threshold
    - swipe,name="Swipe Filler"
  
  rotation_aoe_elune_wowhead:
    - moonfire,name="Moonfire GG AoE (W)",if=var.galactic_guardian_up
    - raze,name="Raze (Harnessed)",if=var.rage>=80&config.rotation_source=1
    - raze,name="Raze (Beam Sync)",if=var.lunar_beam_active&var.rage>=30
    - thrash,name="Thrash Build AoE (W)",if=debuff.thrash.stack<3
    - mangle,name="Mangle AoE (W)",if=var.gore_up
    - raze,name="Raze Dump AoE (W)",if=var.rage>=40
    - thrash,name="Thrash AoE (W)"
    - moonfire,name="Moonfire AoE (W)",if=var.moonfire_needs_refresh
    - swipe,name="Swipe filler AoE (W)"

  rotation_aoe_elune_alt:
    - moonfire,name="Moonfire (Guardian Proc)",if=var.galactic_guardian_up
    - thrash,name="Thrash Refresh AoE",if=var.thrash_needs_refresh
    - raze,name="Raze (Beam Sync)",if=var.lunar_beam_active&var.rage>=30
    - call_action_list,name=moonfire_spread,if=var.moonfire_needs_refresh|active_enemies>1&debuff.moonfire.down
    - mangle,name="Mangle Proc AoE",if=var.gore_up
    - mangle,name="Mangle Charges AoE",if=var.harnessed_rage&var.mangle_charges>=2
    - thrash,name="Thrash AoE"
    - mangle,name="Mangle AoE"
    - raze,name="Raze (Harnessed)",if=var.rage_for_harnessed
    - raze,name="Raze (Overcap)",if=var.rage>=config.rage_cap_threshold
    - maul,name="Maul (Tooth/Claw AoE)",if=var.tooth_and_claw_up&var.rage>=60
    - raze,name="Raze Dump AoE",if=var.rage>=40
    - swipe,name="Swipe AoE Filler"

  # ----------------------------------------------------------
  #  DRUID OF THE CLAW ROTATIONS
  # ----------------------------------------------------------

  rotation_st_claw_wowhead:
    - ravage,name="Ravage ST (W)",if=buff.ravage.up
    - moonfire,name="Moonfire GG ST (W)",if=buff.galactic_guardian.up
    - mangle,name="Mangle Proc ST (W)",if=buff.gore.up
    - mangle,name="Mangle ST (W)"
    - thrash,name="Thrash Build ST (W)",if=debuff.thrash.stack<3
    - maul,name="Maul T/C ST (W)",if=player.rage>=40&buff.tooth_and_claw.up
    - maul,name="Maul Dump ST (W)",if=player.rage>=40
    - moonfire,name="Moonfire Refresh ST (W)",if=debuff.moonfire.remains<4.8
    - thrash,name="Thrash ST (W)"
    - swipe,name="Swipe ST (W)"

  rotation_aoe_claw_wowhead:
    - ravage,name="Ravage AoE (W)",if=buff.ravage.up
    - moonfire,name="Moonfire GG AoE (W)",if=buff.galactic_guardian.up
    - thrash,name="Thrash Build AoE (W)",if=debuff.thrash.stack<3
    - maul,name="Maul Cleave AoE (W)",if=player.rage>=40
    - mangle,name="Mangle Proc AoE (W)",if=buff.gore.up
    - mangle,name="Mangle AoE (W)"
    - moonfire,name="Moonfire Refresh AoE (W)",if=debuff.moonfire.remains<4.8
    - thrash,name="Thrash AoE (W)"
    - swipe,name="Swipe AoE (W)"

  rotation_st_claw_method:
    - ravage,name="Ravage ST (M)",if=buff.ravage.up
    - mangle,name="Mangle Proc ST (M)",if=buff.gore.up
    - mangle,name="Mangle Filler ST (M)"
    - moonfire,name="Moonfire GG ST (M)",if=buff.galactic_guardian.up
    - thrash,name="Thrash Build ST (M)",if=debuff.thrash.stack<3
    - maul,name="Maul T/C ST (M)",if=player.rage>=40&buff.tooth_and_claw.up
    - maul,name="Maul Dump ST (M)",if=player.rage>=50
    - moonfire,name="Moonfire Refresh ST (M)",if=debuff.moonfire.remains<4.8
    - thrash,name="Thrash ST (M)"
    - swipe,name="Swipe filler ST (M)"

  rotation_aoe_claw_method:
    - ravage,name="Ravage AoE (M)",if=buff.ravage.up
    - thrash,name="Thrash Build AoE (M)",if=debuff.thrash.stack<3
    - mangle,name="Mangle Proc AoE (M)",if=buff.gore.up
    - mangle,name="Mangle AoE (M)"
    - moonfire,name="Moonfire GG AoE (M)",if=buff.galactic_guardian.up
    - maul,name="Maul T/C AoE (M)",if=player.rage>=40&buff.tooth_and_claw.up
    - maul,name="Maul Cleave AoE (M)",if=player.rage>=40
    - moonfire,name="Moonfire Refresh AoE (M)",if=debuff.moonfire.remains<4.8
    - thrash,name="Thrash AoE (M)"
    - swipe,name="Swipe AoE (M)"

  # ----------------------------------------------------------
  #  SHARED / MISC
  # ----------------------------------------------------------

  trinkets:
    - trinket_1,name="Trinket 1",if=config.use_trinkets&trinket_1.ready&(var.incarnation_active|health.pct<70)
    - trinket_2,name="Trinket 2",if=config.use_trinkets&trinket_2.ready&(var.incarnation_active|health.pct<70)

  movement:
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0
  
  # ----------------------------------------------------------
  #  MAIN ENTRY POINT
  # ----------------------------------------------------------
  
  main:
    - call_action_list,name=sanity_checks
    - call_action_list,name=spell_queue
    - call_action_list,name=buff_mark_of_the_wild
    - bear_form,name="Manual Bear Form",if=!var.in_bear_form&player.combat&!mounted.flying&!mounted.ground
    - moonfire,name="Pull Moonfire",if=config.allow_pull_with_mo&!player.combat&target.enemy&target.alive&debuff.moonfire.down
    - return,if=!player.combat&active_enemies=0
    - return,if=player.channeling
    
    # Targeting & utility
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - call_action_list,name=taunt
    - call_action_list,name=interrupts
    
    # Survival & cooldowns
    - call_action_list,name=defensives,if=var.in_bear_form
    - call_action_list,name=cooldowns,if=var.in_bear_form
    - call_action_list,name=racials,if=config.use_racials&var.in_bear_form
    
    # Elune's Chosen Rotations (Damage Priority)
    - call_action_list,name=rotation_aoe_elune_wowhead,if=config.hero_tree=1&config.rotation_source=1&active_enemies>=2&var.in_bear_form
    - call_action_list,name=rotation_st_elune_wowhead,if=config.hero_tree=1&config.rotation_source=1&var.in_bear_form
    - call_action_list,name=rotation_aoe_elune_alt,if=config.hero_tree=1&config.rotation_source=2&active_enemies>=2&var.in_bear_form
    - call_action_list,name=rotation_st_elune_alt,if=config.hero_tree=1&config.rotation_source=2&var.in_bear_form

    # Druid of the Claw Rotations (Damage Priority)
    - call_action_list,name=rotation_aoe_claw_wowhead,if=config.hero_tree=2&config.rotation_source=1&active_enemies>=3&var.in_bear_form
    - call_action_list,name=rotation_st_claw_wowhead,if=config.hero_tree=2&config.rotation_source=1&var.in_bear_form
    - call_action_list,name=rotation_aoe_claw_method,if=config.hero_tree=2&config.rotation_source=2&active_enemies>=3&var.in_bear_form
    - call_action_list,name=rotation_st_claw_method,if=config.hero_tree=2&config.rotation_source=2&var.in_bear_form

    # Rage Dumps & Defensive Ironfur
    - call_action_list,name=rage_management,if=var.in_bear_form

    # Movement & Utils
    - call_action_list,name=movement,if=player.moving
    - call_action_list,name=trinkets