version: 4.2
author: Ferraz
patch: "12.0.5"
spec: 104
name: Ferraz Guardian Druid M+ (Claw)
description: |
  Ferraz Guardian Druid M+ (Claw)
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CgGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgZmxsMmZMziZZGmZZZgZzwoJamZWGzMzsMm5BGAAAAAghNDAAAAamlZZmZGAALYmHAYxMYwYxmBAzsBD"

  # === ROTATION CONFIGURATIONS ===
  min_aoe_enemies:
    label: "Min enemies for AOE"
    section: "Rotation"
    type: slider
    min: 1
    max: 10
    default: 1

  incarnation_enemies:
    label: "Min enemies for Incarnation"
    section: "Rotation"
    type: slider
    min: 1
    max: 10
    default: 3

  # === DEFENSIVE CONFIGURATIONS ===
  survival_instincts_threshold:
    label: Survival Instincts %
    section: "Defensives"
    type: slider
    min: 10
    max: 70
    default: 45

  frenzied_regen_threshold:
    label: Frenzied Regeneration %
    section: "Defensives"
    type: slider
    min: 30
    max: 80
    default: 65

  use_barkskin_on_cd:
    label: "Barkskin on Cooldown"
    section: "Defensives"
    type: checkbox
    default: true

  manual_barkskin:
    label: "Manual Barkskin"
    section: "Defensives"
    type: checkbox
    default: false
    description: "Disable automatic Barkskin usage."

  ironfur_stacks_min:
    label: "Min Ironfur Stacks"
    section: "Defensives"
    type: slider
    min: 1
    max: 5
    default: 3

  ironfur_stacks_max:
    label: "Max Ironfur Stacks"
    section: "Defensives"
    type: slider
    min: 3
    max: 10
    default: 7

  # === MOVEMENT CONFIGURATIONS ===
  stampeding_roar_usage:
    label: "Stampeding Roar Usage"
    section: "Movement"
    type: dropdown
    options:
      - label: "Disabled"
        value: 0
      - label: "Only in combat"
        value: 1
      - label: "Only out of combat"
        value: 2
      - label: "Always when moving"
        value: 3
    default: 2

  stampeding_roar_movement_time:
    label: "Roar after moving (seconds)"
    section: "Movement"
    type: slider
    min: 0
    max: 4
    default: 2

  # === UTILITY CONFIGURATIONS ===
  use_growl:
    label: "Auto Growl (Taunt)"
    section: "Utility"
    type: checkbox
    default: true

  use_mark_of_the_wild:
    label: "Auto Mark of the Wild"
    section: "Utility"
    type: checkbox
    default: true

  # === TRINKET & CONSUMABLE CONFIGURATIONS ===
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Trinkets"
    type: checkbox
    default: false

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Trinkets"
    type: checkbox
    default: false

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: false

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # Player form state and buffs
  in_bear_form: buff.bear_form.up
  incarnation_active: buff.incarnation_guardian_of_ursoc.up|buff.berserk.up
  # Talent checks to refresh debuffs/DoTs
  thrash_refresh: target.debuff.remains(thrash)<4.5|target.debuff.stacks(thrash)<5
  moonfire_refresh: target.debuff.moonfire.remains<4.8
  # Stampeding Roar conditions based on interface settings
  use_stampeding_roar: moving.time>=config.stampeding_roar_movement_time&buff.stampeding_roar.down&((config.stampeding_roar_usage=1&player.combat)|(config.stampeding_roar_usage=2&!player.combat)|(config.stampeding_roar_usage=3))

lists:
  # Out of combat: Ensures Mark of the Wild is active
  out_of_combat:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10

  # Defensive priority sequence: Regrowth (Dream of Cenarius) -> Survival Instincts -> Frenzied Regeneration -> Barkskin
  defensives:
    - regrowth,name="Regrowth (Guardian)",if=talent.dream_of_cenarius&buff.dream_of_cenarius.up&health.effective.pct<85
    - survival_instincts,name="Survival Instincts",if=incoming.pct<config.survival_instincts_threshold&!buff.survival_instincts.up
    - frenzied_regeneration,name="Frenzied Regeneration",if=incoming.pct<config.frenzied_regen_threshold
    - barkskin,name="Barkskin",if=!config.manual_barkskin&config.use_barkskin_on_cd&!buff.survival_instincts.up
    - barkskin,name="Barkskin (Low HP)",if=!config.manual_barkskin&!config.use_barkskin_on_cd&incoming.pct<60&!buff.survival_instincts.up

  # Offensive racial abilities triggered automatically in combat
  racials:
    - blood_fury,name="Blood Fury"
    - berserking,name="Berserking"
    - fireblood,name="Fireblood"
    - ancestral_call,name="Ancestral Call"

  # Interrupts and Dispel: Auto-search for enraged target to Soothe; Skull Bash on target, mouseover, or focus; Incapacitating Roar for AoE CC
  interrupts:
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage

  # Automatic Taunt: Growl on target or mouseover if threat is low outside raids
  taunt:
    - growl,name="Growl",if=config.use_growl&target.threat<2&target.combat&target.threat!=-1&!player.inraid
    - growl.mouseover,name="Growl (MO)",if=config.use_growl&mouseover.threat<2&mouseover.combat&mouseover.threat!=-1&mouseover.exists&!player.inraid

  # Utility and movement abilities
  utility:
    - stampeding_roar,name="Stampeding Roar",if=var.use_stampeding_roar&config.stampeding_roar_usage!=0

  # Offensive Damage Cooldowns
  cooldowns:
    # Synchronize trinkets and potion with Incarnation burst window activation
    - trinket_1,name="Trinket 1",if=config.use_trinket_1&trinket_1.sync&var.incarnation_active
    - trinket_2,name="Trinket 2",if=config.use_trinket_2&trinket_2.sync&var.incarnation_active
    - combat_potion,name="Combat Potion",if=combat_potion.ready&config.use_potion&var.incarnation_active
    # Lunar Beam: Used aggressively whenever there is 1 or more enemies
    - lunar_beam,name="Lunar Beam",if=active_enemies>=1
    - sundering_roar,name="Sundering Roar",if=talent.sundering_roar&debuff.thrash.stack<3
    # Incarnation / Berserk: Cast under a minimum number of enemies or against boss, ensuring no overlap
    - incarnation_guardian_of_ursoc,name="Incarnation",if=!var.incarnation_active&(active_enemies>=config.incarnation_enemies|target.boss)
    - berserk,name="Berserk",if=!var.incarnation_active&!talent.incarnation_guardian_of_ursoc&(active_enemies>=config.incarnation_enemies|target.boss)
    - wild_guardian,name="Wild Guardian",if=(buff.ravage.up&talent.ravage)|!talent.ravage

  # Druid of the Claw Rotation — Focus on maintaining Ironfur -> Consuming Ravage -> Galactic Guardian Moonfire procs -> Mangle and Thrash -> Fillers
  rotation_claw:
    # Ironfur: Proactive maintenance and stacking based on Rage and effective health
    - ironfur,name="Ironfur (Maintain)",if=buff.ironfur.remains<3|buff.ironfur.stack<config.ironfur_stacks_min
    - ironfur,name="Ironfur (Stack)",if=rage>=60&buff.ironfur.stack<config.ironfur_stacks_max
    - ironfur,name="Ironfur (Heavy Damage)",if=health.effective.pct<50&buff.ironfur.stack<config.ironfur_stacks_max

    # Ravage: Spend the proc with absolute priority
    - ravage,name="Ravage",if=buff.ravage.up

    # Moonfire with Galactic Guardian: High priority to not waste active procs
    - moonfire,name="Moonfire (GG)",if=buff.galactic_guardian.up&var.in_bear_form

    # Thrash: Refresh to maintain bleeds on target
    - thrash,name="Thrash (Refresh)",target_if=var.thrash_refresh

    # Raze: Used to dump excess rage under multiple enemies
    - raze,name="Raze (Overflow)",if=active_enemies>=config.min_aoe_enemies&rage>=80

    # Mangle: Primary rage generator
    - mangle,name="Mangle"

    # Thrash: Standard AoE ability
    - thrash,name="Thrash"

    # Filler abilities: Moonfire (for refresh) -> Swipe
    - moonfire,name="Moonfire (Refresh)",if=var.moonfire_refresh&var.in_bear_form
    - swipe,name="Swipe"

  # Main Rotation (Entry Point)
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player

    # Ensures Bear Form; aborts rotation if shape shift fails
    - bear_form,name="Bear Form",if=!var.in_bear_form&!buff.feline_potential.up
    - return,if=!var.in_bear_form

    # Combat Priority: Interrupts -> Defensives -> Taunt -> Utility -> Racials -> Cooldowns -> Claw Rotation
    - call_action_list,name=interrupts
    - call_action_list,name=defensives
    - call_action_list,name=taunt
    - call_action_list,name=utility
    - call_action_list,name=racials

    - return,if=!target.exists|target.dead|!target.enemy

    - call_action_list,name=cooldowns
    - call_action_list,name=rotation_claw
