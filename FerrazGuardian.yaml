version: 3.5
author: Ferraz
patch: "12.0.1.6"
spec: 104
name: Guardian of the Claw Simia
description: |
  Optimized Guardian Druid (Claw) based on SimulationCraft.
  Supports Killing Blow and Fount of Strength builds.

entry: main

# ==========================================
#  CONFIGURATION
# ==========================================
config:
  min_aoe_enemies:
    label: "Min enemies for AOE"
    section: "Rotation"
    type: slider
    min: 1
    max: 10
    default: 1

  incarnation_enemies:
    label: "Min enemies for Incarnation"
    section: "Rotation"
    type: slider
    min: 1
    max: 10
    default: 3

  survival_instincts_threshold:
    label: Survival Instincts %
    section: "Defensives"
    type: slider
    min: 10
    max: 70
    default: 45

  frenzied_regen_threshold:
    label: Frenzied Regeneration %
    section: "Defensives"
    type: slider
    min: 30
    max: 80
    default: 65

  barkskin_threshold:
    label: Barkskin %
    section: "Defensives"
    type: slider
    min: 30
    max: 90
    default: 70

  ironfur_stacks_min:
    label: "Min Ironfur Stacks"
    section: "Defensives"
    type: slider
    min: 1
    max: 5
    default: 2

  ironfur_stacks_max:
    label: "Max Ironfur Stacks"
    section: "Defensives"
    type: slider
    min: 3
    max: 10
    default: 5

  trinket_usage:
    label: "Trinket Usage"
    section: "Utility"
    type: dropdown
    options:
      - label: "On Cooldown"
        value: 1
      - label: "With CD/Burst"
        value: 2
      - label: "Manual"
        value: 0
    default: 1

# ==========================================
#  VARIABLES
# ==========================================
variables:
  in_bear_form: buff.bear_form.up
  incarnation_active: buff.incarnation_guardian_of_ursoc.up|buff.berserk.up
  kb_enabled: talent.killing_blow
  fount_enabled: talent.fount_of_strength
  red_moon_ticking: debuff.red_moon.up
  thrash_refresh: debuff.thrash.remains<4.5|debuff.thrash.stack<3
  moonfire_refresh: debuff.moonfire.remains<4.8

# ==========================================
#  ACTION LISTS
# ==========================================
lists:
  out_of_combat:
    - mark_of_the_wild,name="Mark of the Wild",range_check=none,if=buff.mark_of_the_wild.down.any

  defensives:
    - survival_instincts,name="Survival Instincts",if=health.effective.pct<config.survival_instincts_threshold&!buff.survival_instincts.up
    - frenzied_regeneration,name="Frenzied Regeneration",if=health.effective.pct<config.frenzied_regen_threshold
    - barkskin,name="Barkskin",if=health.effective.pct<config.barkskin_threshold&!buff.survival_instincts.up
    - ironfur,name="Ironfur (Min Stacks)",if=buff.ironfur.stack<config.ironfur_stacks_min
    - ironfur,name="Ironfur (Refresh)",if=buff.ironfur.remains<2&buff.ironfur.stack<config.ironfur_stacks_max
    - ironfur,name="Ironfur (Heavy Damage)",if=health.effective.pct<50&buff.ironfur.stack<config.ironfur_stacks_max

  racials:
    - blood_fury,name="Blood Fury"
    - berserking,name="Berserking"
    - fireblood,name="Fireblood"
    - ancestral_call,name="Ancestral Call"

  interrupts:
    # Auto Swap Search
    - target_enemy,delay=100,name="Search Soothe",if=!target.purgeable.enrage&enemies.combat.any(cycle.purgeable.enrage)
    - target_enemy,delay=100,name="Search Interrupt",if=!interrupt.target.check&interrupt.5y.any
    
    # Single Interrupt
    - skull_bash,name="Skull Bash",if=interrupt.target.check
    - skull_bash.mouseover,name="Skull Bash (MO)",if=interrupt.mouseover.check
    - skull_bash.focus,name="Skull Bash (Focus)",if=interrupt.focus.check

    # AoE Interrupt
    - incapacitating_roar,name="Roar (AoE CC)",if=interrupt.stun.aoe.check
    - soothe,name="Soothe Enrage",if=target.purgeable.enrage      

  cooldowns:
    - lunar_beam,name="Lunar Beam",if=var.incarnation_active|((cooldown.incarnation_guardian_of_ursoc.remains>60|cooldown.berserk.remains>60)&!talent.lunation|(cooldown.incarnation_guardian_of_ursoc.remains>30|cooldown.berserk.remains>30)&talent.lunation)
    - sundering_roar,name="Sundering Roar",if=debuff.thrash.stack<3
    - incarnation_guardian_of_ursoc,name="Incarnation",if=active_enemies>=config.incarnation_enemies|target.boss
    - berserk,name="Berserk",if=!talent.incarnation_guardian_of_ursoc&(active_enemies>=config.incarnation_enemies|target.boss)
    - wild_guardian,name="Wild Guardian",if=(buff.ravage.up&talent.ravage)|!talent.ravage

  rotation_claw:
    # Ravage / Assolar (Empowered Maul/Raze)
    - ravage,name="Ravage (ST Proc)",if=buff.ravage.up&active_enemies<config.min_aoe_enemies&((!var.kb_enabled&rage>=40)|(var.kb_enabled&rage>=60))
    - ravage,name="Ravage (AOE Proc)",if=buff.ravage.up&active_enemies>=config.min_aoe_enemies&((!var.kb_enabled&rage>=40)|(var.kb_enabled&rage>=60))

    # Rage Spenders (Raze AOE / Maul ST)
    - raze,name="Raze (High Rage)",if=active_enemies>=config.min_aoe_enemies&((!var.fount_enabled&rage>=50)|(var.fount_enabled&rage>=85))
    - raze,name="Raze (Tooth and Claw)",if=active_enemies>=config.min_aoe_enemies&buff.tooth_and_claw.up&rage>=40
    - maul,name="Maul (High Rage)",if=active_enemies<config.min_aoe_enemies&((!var.fount_enabled&rage>=50)|(var.fount_enabled&rage>=85))
    - maul,name="Maul (Tooth and Claw)",if=active_enemies<config.min_aoe_enemies&buff.tooth_and_claw.up&rage>=40

    # Mangle / Thrash Core
    - mangle,name="Mangle (Red Moon)",if=var.red_moon_ticking
    - thrash,name="Thrash (Refresh)",target_if=var.thrash_refresh

    # Red Moon & Wildpower Surge
    - red_moon,name="Red Moon",if=cooldown.mangle.ready&!var.red_moon_ticking
    - mangle,name="Mangle (Surge)",if=var.incarnation_active&talent.wildpower_surge

    # Secondary Rage Dump
    - raze,name="Raze (AOE)",if=active_enemies>=config.min_aoe_enemies&rage>=50
    - maul,name="Maul (ST)",if=active_enemies<config.min_aoe_enemies&rage>=50

    # Core Fillers
    - mangle,name="Mangle",if=var.incarnation_active|rage<85
    - thrash,name="Thrash"
    - moonfire,name="Moonfire (GG)",if=buff.galactic_guardian.up&var.in_bear_form
    - moonfire,name="Moonfire (Refresh)",if=var.moonfire_refresh&var.in_bear_form
    - swipe,name="Swipe"

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=out_of_combat
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal
    - return,if=auto_combat.player

    # Bear Form Management
    - bear_form,name="Bear Form",if=!var.in_bear_form&!buff.feline_potential.up
    - return,if=!var.in_bear_form

    # Priority
    - call_action_list,name=interrupts
    - call_action_list,name=defensives
    - call_action_list,name=racials
    - call_action_list,name=cooldowns
    - call_action_list,name=rotation_claw
