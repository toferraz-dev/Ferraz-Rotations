# =============================================================================
# Feral Druid — spec 103 — patch 12.1 (Midnight) — Druid of the Claw, RAID.
# =============================================================================
#
# Measured with SimC 1210-01, fight_style=Patchwerk (the raid proxy, unlike
# the M+ file which uses DungeonSlice), against the recommended string.
# Harness: sim/ab_test_feral_raid.py, profile sim/Ferraz_feral_raid.simc
# (gear: SimC's own MID1 Feral preset). Baseline for comparison is SimC's own
# default APL for this build, sourced from dreamgrove.
#
# THIS IS NOT THE M+ FILE WITH A DIFFERENT STRING. The raid build drops
# Frantic Frenzy, Primal Wrath, Apex Predator's Craving, Rampant Ferocity,
# Double-Clawed Rake, Infected Wounds, Rip and Tear and Heart of the Wild,
# and picks up Ashamane's Guidance, Merciless Claws, Panther's Guile, Saber
# Jaws, Focused Frenzy, Coiled to Spring and Tireless Energy. Three priority
# changes follow from that, all measured against the ported M+ priority:
#
#   Convoke outside Berserk (Ashamane's Guidance)   +5.19%
#   Ferocious Bite pooled to full energy            +2.87%
#   Shred on a Sudden Ambush proc                   +2.35%
#   all three together                             +10.17%
#
# Dropping the cooldown block entirely measures -21.47%, so the same
# missing-cooldowns bug the M+ file had would cost even more here.
#
# TESTED AND REJECTED: simplifying the Rip condition (removing its two
# Tiger's Fury re-snapshot clauses) appeared to be worth +23.7%, but that was
# an artifact of the harness pinning var.rip_tf to 0 — with it pinned to 1,
# the way the game actually behaves once Rip is applied under Tiger's Fury,
# the current condition and the simplified one land within the error bar of
# each other. The clauses stay.
#
# NOT validated (SimC models none of it): every defensive, Regrowth healing,
# and the Predatory Swiftness lines.
# =============================================================================

version: 1.0
author: Ferraz
patch: "12.1"
spec: 103
name: Feral Druid Ferraz Raid
description: |
  Feral Druid Ferraz Raid
entry: main

config:
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CcGAAAAAAAAAAAAAAAAAAAAAAAAAAAAwghxYmZmxsxDsMz2MzMmZGAAAAWCmNYMzomxswMzMGzMDAAAAAAgBAAAQzsMLzMzACsAmZAWMzwAAAYmNMA"

  survival_instincts_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  regrowth_ooc_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth OOC HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  # Raid default is lower than the M+ file's: in a raid you are rarely the one
  # who has to top yourself, and a Regrowth is a lost finisher.
  predatory_swiftness_heal_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (Predatory Swiftness) HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  survival_instincts_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival Instincts (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55

  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  # === COOLDOWN CONFIGURATIONS ===
  # Defaults ON: dropping the whole cooldown block measures -21.47% here.
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Combat Potion"
    section: "Cooldowns"
    type: checkbox
    default: true

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  bs_inc: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  bs_inc_remains: buff.berserk.remains+buff.incarnation_avatar_of_ashamane.remains
  bs_inc_cd_remains: cooldown.berserk.remains>?cooldown.incarnation_avatar_of_ashamane.remains
  bs_inc_cd_duration: cooldown.berserk.duration>?cooldown.incarnation_avatar_of_ashamane.duration
  regrowth: 0
  dotc_rake_threshold: 99-94*(talent.wild_slashes&talent.merciless_claws)-91*(talent.wild_slashes&!talent.merciless_claws)
  bs_inc_cd: var.bs_inc_cd_remains+10
  convoke_cd: cooldown.convoke_the_spirits.remains+10
  convokeCountRemaining: floor(((fight_remains-var.convoke_cd)%cooldown.convoke_the_spirits.duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  zerkCountRemaining: floor(((fight_remains-var.bs_inc_cd)%var.bs_inc_cd_duration)+(fight_remains>var.bs_inc_cd_remains))
  firstHoldBerserkCondition: var.zerkCountRemaining=1&var.convokeCountRemaining=1&cooldown.convoke_the_spirits.remains>10
  secondHoldBerserkCondition: cooldown.convoke_the_spirits.remains>20&var.convokeCountRemaining=var.zerkCountRemaining&var.zerkCountRemaining=floor(((fight_remains-var.convoke_cd)%var.bs_inc_cd_duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  holdBerserk: var.firstHoldBerserkCondition|var.secondHoldBerserkCondition
  rake_tf: debuff.rake.visual_id=491160
  rip_tf: debuff.rip.visual_id=491158
  moonfire_tf: debuff.moonfire.visual_id=500891

lists:
  defensives:
    - barkskin,off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.barkskin_dmg_pct
    - survival_instincts,off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.survival_instincts_dmg_pct&incoming.mitigated.pct>=config.survival_instincts_dmg_pct
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - survival_instincts,off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - barkskin,off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.barkskin_hp_pct

  cooldown:
    - trinket_1,if=config.use_trinket_1&trinket_1.ready
    - trinket_2,if=config.use_trinket_2&trinket_2.ready
    - berserking,if=var.bs_inc
    - blood_fury,if=var.bs_inc
    - fireblood,if=var.bs_inc
    - ancestral_call,if=var.bs_inc
    - combat_potion,if=config.use_potion&combat_potion.ready&(var.bs_inc|fight_remains<32)
    - berserk,if=buff.tigers_fury.up&!var.holdBerserk
    # Frantic Frenzy is NOT on the raid string, so the first line is the live
    # one here and the second is inert. Both kept so the file survives a
    # respec either way.
    - feral_frenzy,if=!talent.frantic_frenzy&combo_points<=2+(2*var.bs_inc)
    - frantic_frenzy,if=buff.tigers_fury.up|combo_points<=2+(2*var.bs_inc)
    # RAID-SPECIFIC (+5.19%): with Ashamane's Guidance — which only the raid
    # build carries — Convoke is worth firing OUTSIDE the Berserk window when
    # Berserk is far away, instead of always waiting for it. The M+ file has
    # no such clause because it does not talent Ashamane's Guidance.
    - convoke_the_spirits,if=(var.bs_inc|talent.ashamanes_guidance&(var.bs_inc_cd_remains>45|var.holdBerserk))&buff.tigers_fury.up&(prev_gcd.1.rip|prev_gcd.1.ferocious_bite|prev_gcd.1.primal_wrath|buff.tigers_fury.remains<=1+action.convoke_the_spirits.execute_time)

  finisher:
    - rip,if=combo_points>=5&(dot.rip.refreshable&(buff.tigers_fury.up|dot.rip.remains<cooldown.tigers_fury.remains)|buff.tigers_fury.up&!var.rip_tf&dot.rip.up|buff.tigers_fury.up&buff.tigers_fury.remains<2&dot.rip.up)
    # RAID-SPECIFIC (+2.87%): Ferocious Bite spends up to 25 extra energy for
    # up to 100% extra damage, and Saber Jaws (raid-only) raises that payoff
    # further — so it is pooled to the full 50-energy cost instead of being
    # fired at the 25-energy floor. This `return` is the pooling gate.
    - return,if=combo_points>=5&energy<50
    - ferocious_bite,if=combo_points>=5
    - ravage,if=combo_points>=5

  aoe_finisher:
    # Primal Wrath and Rampant Ferocity are NOT on the raid string, so the
    # lines gated on them are inert and the Rip/Bite fallbacks are the live
    # path. Kept so the list still works on an AoE respec.
    - primal_wrath,if=combo_points>=5&active_enemies>1&(dot.rip.remains<6.5&!var.bs_inc|dot.rip.refreshable)
    - ravage,if=combo_points>=5&!talent.primal_wrath&active_enemies>=2+(3*!talent.rampant_ferocity)
    - rip,if=combo_points>=5&!talent.primal_wrath&(dot.rip.down|dot.rip.refreshable&(buff.tigers_fury.up|!var.rip_tf))
    - ferocious_bite,if=combo_points>=5&(talent.rampant_ferocity|buff.ravage.up&active_enemies<8|dot.bloodseeker_vines.ticking&active_enemies<5)
    - ravage,if=combo_points>=5&(talent.rampant_ferocity|active_enemies<8|dot.bloodseeker_vines.ticking&active_enemies<5)
    - primal_wrath,if=combo_points>=5
    - ferocious_bite,if=combo_points>=5
    - ravage,if=combo_points>=5
    - thorn_bloom

  builder:
    - prowl,if=!player.combat&!buff.shadowmeld.up&(!var.rake_tf|dot.rake.refreshable)
    # RAID-SPECIFIC (+2.35%): dreamgrove keeps a Druid-of-the-Claw-only Shred
    # on a Sudden Ambush proc, ahead of the Rake refresh.
    - shred,name="Shred (Sudden Ambush)",if=buff.sudden_ambush.up&hero_tree.druid_of_the_claw
    - rake,if=(buff.tigers_fury.up|dot.rake.remains<cooldown.tigers_fury.remains)&(dot.rake.refreshable&(buff.tigers_fury.up|!var.rake_tf)|dot.rake.remains<2|buff.tigers_fury.up&!var.rake_tf)
    - moonfire,if=talent.lunar_inspiration&(buff.tigers_fury.up|dot.moonfire.remains<cooldown.tigers_fury.remains)&(dot.moonfire.refreshable&(buff.tigers_fury.up|!var.moonfire_tf)|dot.moonfire.remains<2|buff.tigers_fury.up&!var.moonfire_tf)
    - shred

  aoe_builder:
    - rake,if=dot.rake.refreshable&((talent.doubleclawed_rake&(!talent.lunar_inspiration|!talent.panthers_guile|active_dot.rake<5))|hero_tree.wildstalker&(active_dot.rake<2+!talent.panthers_guile+talent.lunar_inspiration))
    - moonfire,if=talent.lunar_inspiration&dot.moonfire.refreshable
    - 106785,if=hero_tree.druid_of_the_claw&var.bs_inc|buff.clearcasting.react&active_enemies>2&(hero_tree.druid_of_the_claw|active_enemies<7)
    - 106785,if=buff.sudden_ambush.up&active_enemies>=5+(2*hero_tree.wildstalker)
    - rake,if=dot.rake.refreshable&(hero_tree.wildstalker|active_enemies<=var.dotc_rake_threshold)
    - rake,if=buff.tigers_fury.up&!var.rake_tf&active_enemies=2
    # Panther's Guile IS on the raid string, so this line is live here.
    - shred,if=combo_points<=1&active_enemies=2&talent.panthers_guile
    - 106785,if=combo_points>1|active_enemies>2|!talent.panthers_guile

  # Mark of the Wild, OOC Regrowth top-off.
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - regrowth,range_check=none,if=health.pct<=config.regrowth_ooc_hp_pct&!player.combat

  # Emergency Bear Form, Fluid Form auto-shift, manual Cat Form entry, and
  # the pre-pull Prowl opener. Heart of the Wild is NOT on the raid string,
  # so that line is inert here.
  form:
    - bear_form,range_check=none,if=health.pct<=25&!buff.bear_form.up&player.combat
    - heart_of_the_wild,range_check=none,if=buff.bear_form.up&player.combat

    - shred,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - rake,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - cat_form,range_check=none,if=buff.cat_form.down&(target.attackable|enemies.40y)

    # Prowl cannot be cast in combat — pre-pull opener only. See the M+ file
    # for the full note on why this needs an explicit !player.combat.
    - prowl,range_check=none,if=!player.combat&!var.bs_inc&buff.prowl.down&buff.shadowmeld.down&(target.attackable|enemies.40y)

  interrupts:
    - skull_bash,off_gcd=true,ignore_queue=true,if=interrupt.target.check
    - skull_bash.mouseover,off_gcd=true,ignore_queue=true,if=interrupt.mouseover.check
    - skull_bash.focus,off_gcd=true,ignore_queue=true,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check

  # Regrowth off a Predatory Swiftness proc. Called after `defensives` so a
  # real defensive cooldown outranks a proc heal.
  predatory_swiftness:
    - regrowth,delay=500,range_check=none,if=buff.predatory_swiftness.up&health.pct<=config.predatory_swiftness_heal_hp_pct&lastcast.regrowth>=2

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target

    - call_action_list,name=heal_support
    - call_action_list,name=form
    - call_action_list,name=interrupts

    - call_action_list,name=auto_heal

    # NOTE: do NOT add a `return,if=player.auto_combat` here. It is a
    # config-based auto-combat-driver check, not combat state, and it aborts
    # the whole rotation before defensives and damage. See the M+ file.

    - call_action_list,name=defensives
    - call_action_list,name=predatory_swiftness

    - return,if=!target.valid|target.dead|!target.attackable

    - rake,range_check=none,if=buff.prowl.up&target.in_melee
    - return,if=buff.prowl.up

    - tigers_fury,off_gcd=true,ignore_queue=true,if=(var.bs_inc_cd_remains<=1|var.bs_inc_cd_remains>10|var.holdBerserk)&(cooldown.frantic_frenzy.remains<buff.tigers_fury.duration-1.5|cooldown.frantic_frenzy.remains>22|!talent.frantic_frenzy|active_enemies=1)

    - chomp,if=buff.chomp_enabler.up

    - call_action_list,name=cooldown

    # Apex Predator's Craving is NOT on the raid string — these two are inert
    # here, kept so a respec back to the M+ build still works.
    - ferocious_bite,if=buff.apex_predators_craving.up
    - ravage,if=buff.apex_predators_craving.up

    - call_action_list,name=finisher,if=active_enemies=1
    - call_action_list,name=aoe_finisher,if=active_enemies>=2
    - call_action_list,name=builder,if=active_enemies=1&combo_points<=4
    - call_action_list,name=aoe_builder,if=active_enemies>1&combo_points<=4
    - regrowth,range_check=none,if=buff.predatory_swiftness.up&var.regrowth
    - tigers_fury,off_gcd=true,ignore_queue=true
