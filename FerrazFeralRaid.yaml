# =============================================================================
# Feral Druid Ferraz Raid - spec 103 - patch 12.1.
# =============================================================================
#
# Lists (entry point: main):
#   engine                  defensives              cooldown                finisher
#   aoe_finisher            builder                 aoe_builder             heal_support
#   form                    interrupts              predatory_swiftness     main
#
# WHY ANY OF IT IS THE WAY IT IS: .agents/rationale/FeralRaid.md
# That file carries every measurement, every rejected alternative and every
# bug this file has already been through. Read it before changing a line -
# most of what looks improvable here was tried and reverted.
# =============================================================================

version: "1.8.1"
author: Ferraz
patch: "12.1"
spec: 103
name: Feral Druid Ferraz Raid
description: |
  Feral Druid Ferraz Raid
entry: main

config:
  # Display-only build stamp — keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-27 | Patch: 12.1 | Version: 1.8.1"

  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CcGADBD3hSPCL9Y9gz68WcKvMAAAAAAwYMjxYmZMmtFWGbzMzYmZAAAAYJY2gxMjaGziZmZGjZegBAAAAAAwAAAAIAYWmZrZbmlNYmZAWMDGAAzMAYA"

  # The panic Bear Form shift had a literal 25 an.
  panic_bear_hp_pct:
    label: "Panic Bear Form HP %"
    section: "Defensive HP Percentage"
    type: slider
    min: 1
    max: 99
    default: 25
    description: "Shift to Bear Form for the armour and health when you drop below this. Bear is a big survival gain but costs you the Cat rotation, so it is deliberately the lowest threshold on this panel."

  survival_instincts_hp_pct:
    section: "Defensive HP Percentage"
    label: "Survival Instincts HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  barkskin_hp_pct:
    section: "Defensive HP Percentage"
    label: "Barkskin HP%"
    type: slider
    min: 0
    max: 100
    default: 50

  regrowth_ooc_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth OOC HP%"
    type: slider
    min: 0
    max: 100
    default: 60

  # Raid default is lower than the M+ file's: in a raid you are rarely the one
  # who has to top yourself, and a Regrowth is a lost finisher.
  predatory_swiftness_heal_hp_pct:
    section: "Defensive HP Percentage"
    label: "Regrowth (Predatory Swiftness) HP%"
    type: slider
    min: 0
    max: 100
    default: 40

  survival_instincts_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Survival Instincts (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 55

  barkskin_dmg_pct:
    section: "Defensives Prediction Damage"
    label: "Barkskin (Incoming Dmg%)"
    type: slider
    min: 0
    max: 100
    default: 40

  # === COOLDOWN CONFIGURATIONS ===
  # Defaults ON: dropping the whole cooldown block measures -21.47% here.
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Combat Potion"
    section: "Cooldowns"
    type: checkbox
    default: true

  # Inlined from Simia's _shared.yaml instead of .
  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  engine_auto_target:
    label: "Auto Target (Melee)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]

  engine_healthstone:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  engine_auto_brez:
    label: "Rebirth on Mouseover"
    section: "Engine"
    type: checkbox
    default: true
    description: "Battle rez a dead ally while hovering their unit frame. Pools rage first if you are in Bear Form."

  engine_auto_rez:
    label: "Revive on Mouseover (OOC)"
    section: "Engine"
    type: checkbox
    default: true

  engine_affix_devour:
    label: "Dispel Devouring Rift (Affix)"
    section: "Engine"
    type: checkbox
    default: true

  auto_dispel_self:
    label: "Dispel Self (Poison/Curse)"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Only fires when you actually have a dispelable debuff."

  auto_dispel_party:
    label: "Dispel Party"
    section: "Dispels"
    type: checkbox
    default: false

  auto_purge_enrage:
    label: "Soothe Enrage"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe the current target when it has an enrage effect. ON by default — this is what Simia's shared list did before this file inlined its own plumbing, and it had no switch at all. Turn OFF on a key where the enrage is not worth the global."

  soothe_mouseover:
    label: "Soothe Mouseover"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Soothe whatever you are hovering, checked just before the current-target Soothe below. Simia cannot pick an enraged enemy by criteria — target_enemy is 'nearest enemy' with no filter and there is no .any(EXPR) for enemies — so hovering is the only way to Soothe a mob you are not targeting. This is an independent switch: turning Soothe Enrage off does not disable it. Guarded on mouseover.combat, so hovering an unpulled mob never pulls it."

  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # The channelled ids this spec can actually pro.
  protected_channel: player.casting.spell_id=323764|player.casting.spell_id=391528
  bs_inc: buff.berserk.up|buff.incarnation_avatar_of_ashamane.up
  bs_inc_cd_remains: cooldown.berserk.remains>?cooldown.incarnation_avatar_of_ashamane.remains
  bs_inc_cd_duration: cooldown.berserk.duration>?cooldown.incarnation_avatar_of_ashamane.duration
  regrowth: 0
  dotc_rake_threshold: 99-94*(talent.wild_slashes&talent.merciless_claws)-91*(talent.wild_slashes&!talent.merciless_claws)
  bs_inc_cd: var.bs_inc_cd_remains+10
  convoke_cd: cooldown.convoke_the_spirits.remains+10
  convokeCountRemaining: floor(((fight_remains-var.convoke_cd)%cooldown.convoke_the_spirits.duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  zerkCountRemaining: floor(((fight_remains-var.bs_inc_cd)%var.bs_inc_cd_duration)+(fight_remains>var.bs_inc_cd_remains))
  firstHoldBerserkCondition: var.zerkCountRemaining=1&var.convokeCountRemaining=1&cooldown.convoke_the_spirits.remains>10
  secondHoldBerserkCondition: cooldown.convoke_the_spirits.remains>20&var.convokeCountRemaining=var.zerkCountRemaining&var.zerkCountRemaining=floor(((fight_remains-var.convoke_cd)%var.bs_inc_cd_duration)+(fight_remains>cooldown.convoke_the_spirits.remains))
  holdBerserk: var.firstHoldBerserkCondition|var.secondHoldBerserkCondition
  rake_tf: debuff.rake.visual_id=491160
  rip_tf: debuff.rip.visual_id=491158
  moonfire_tf: debuff.moonfire.visual_id=500891

lists:
  # Everything spell_queue / sanity_checks / auto.
  engine:
    # `&`, not `|`. With `|` the condition is true .
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5
    # Melee-only, and this file IS melee: keeps aut.
    - attack_target,off_gcd=true,delay=100,if=player.combat&target.exists&target.attackable&target.alive&target.in_melee&!player.auto_attacking

    - remove_corruption.player,delay=500,name="Remove Corruption (Self)",if=config.auto_dispel_self&player.dispelable.list
    - remove_corruption,delay=500,cycle=party,name="Remove Corruption (Party)",if=config.auto_dispel_party&cycle.dispelable.list
    - remove_corruption,delay=500,cycle=party,cycle_order=player_first,name="Devouring Rift (Affix)",if=config.engine_affix_devour&cycle.debuff.440313.up.any
    # Hovering is the only way to Soothe a mob you are not targeting — see
    # the soothe_mouseover config for why a search line is impossible.
    - soothe.mouseover,name="Soothe Enrage (Mouseover)",range_check=mouseover,if=config.soothe_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat&mouseover.purgeable.enrage
    - soothe,name="Soothe (Enrage)",if=config.auto_purge_enrage&target.purgeable.enrage

    - pool_resource,resource=rage,for_next=1,if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&buff.bear_form.up&cooldown.rebirth.ready
    - rebirth.mouseover,name="Rebirth (Mouseover)",if=config.engine_auto_brez&mouseover.dead&mouseover.friendly&mouseover.unitframe&player.combat
    - revive.mouseover,name="Revive (Mouseover)",if=config.engine_auto_rez&mouseover.dead&mouseover.friendly&mouseover.unitframe&!player.combat

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    # Melee auto target: 8y, matching the shared melee list.
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=25&enemies.combat.8y>=1

    # --- Temple of Sethraliss, Adderis and Aspix .
    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  defensives:
    - barkskin,name="Barkskin (Predicted Damage)",off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.barkskin_dmg_pct
    - survival_instincts,name="Survival Instincts (Predicted Damage)",off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.survival_instincts_dmg_pct&incoming.mitigated.pct>=config.survival_instincts_dmg_pct
    - bear_form,name="Shapeshift Clear",if=debuff_list.freedom.up&!buff.bear_form.up
    - survival_instincts,name="Survival Instincts (HP)",off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.survival_instincts_hp_pct
    - barkskin,name="Barkskin (HP)",off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.barkskin_hp_pct

  cooldown:
    - trinket_1,if=config.use_trinket_1&trinket_1.ready
    - trinket_2,if=config.use_trinket_2&trinket_2.ready
    - berserking,if=var.bs_inc
    - blood_fury,if=var.bs_inc
    - fireblood,if=var.bs_inc
    - ancestral_call,if=var.bs_inc
    - combat_potion,if=config.use_potion&combat_potion.ready&(var.bs_inc|fight_remains<32)
    - berserk,if=buff.tigers_fury.up&!var.holdBerserk
    # Frantic Frenzy is NOT on the raid string, so .
    - feral_frenzy,if=!talent.frantic_frenzy&combo_points<=2+(2*var.bs_inc)
    - frantic_frenzy,if=buff.tigers_fury.up|combo_points<=2+(2*var.bs_inc)
    # The talent.ashamanes_guidance clause fires Co.
    - convoke_the_spirits,if=(var.bs_inc|talent.ashamanes_guidance&(var.bs_inc_cd_remains>45|var.holdBerserk))&buff.tigers_fury.up&(prev_gcd.1.rip|prev_gcd.1.ferocious_bite|prev_gcd.1.primal_wrath|buff.tigers_fury.remains<=1+action.convoke_the_spirits.execute_time)

  finisher:
    - rip,if=combo_points>=5&(dot.rip.refreshable&(buff.tigers_fury.up|dot.rip.remains<cooldown.tigers_fury.remains)|buff.tigers_fury.up&!var.rip_tf&dot.rip.up|buff.tigers_fury.up&buff.tigers_fury.remains<2&dot.rip.up)
    # RAID-SPECIFIC (+2.50% on the Wildstalker stri.
    - return,if=combo_points>=5&energy<50
    - ferocious_bite,name="Ferocious Bite (Fallback)",if=combo_points>=5
    - ravage,name="Ravage (Fallback)",if=combo_points>=5

  aoe_finisher:
    # Primal Wrath and Rampant Ferocity are NOT on .
    - primal_wrath,name="Primal Wrath (Refresh)",if=combo_points>=5&enemies.combat.8y>1&(dot.rip.remains<6.5&!var.bs_inc|dot.rip.refreshable)
    - ravage,name="Ravage (No Primal Wrath)",if=combo_points>=5&!talent.primal_wrath&enemies.combat.8y>=2+(3*!talent.rampant_ferocity)
    - rip,if=combo_points>=5&!talent.primal_wrath&(dot.rip.down|dot.rip.refreshable&(buff.tigers_fury.up|!var.rip_tf))
    - ferocious_bite,name="Ferocious Bite (Rampant/Vines)",if=combo_points>=5&(talent.rampant_ferocity|buff.ravage.up&enemies.combat.8y<8|dot.bloodseeker_vines.ticking&enemies.combat.8y<5)
    - ravage,name="Ravage (Rampant/Vines)",if=combo_points>=5&(talent.rampant_ferocity|enemies.combat.8y<8|dot.bloodseeker_vines.ticking&enemies.combat.8y<5)
    - primal_wrath,name="Primal Wrath (Fallback)",if=combo_points>=5
    - ferocious_bite,if=combo_points>=5
    - ravage,if=combo_points>=5
    - thorn_bloom

  builder:
    - prowl,if=!player.combat&!buff.shadowmeld.up&(!var.rake_tf|dot.rake.refreshable)
    # dreamgrove keeps a Druid-of-the-Claw-only Shr.
    - shred,name="Shred (Sudden Ambush)",if=buff.sudden_ambush.up&hero_tree.druid_of_the_claw
    - rake,if=(buff.tigers_fury.up|dot.rake.remains<cooldown.tigers_fury.remains)&(dot.rake.refreshable&(buff.tigers_fury.up|!var.rake_tf)|dot.rake.remains<2|buff.tigers_fury.up&!var.rake_tf)
    # Lunar Inspiration, live for the first time on.
    - moonfire,if=talent.lunar_inspiration&(buff.tigers_fury.up|dot.moonfire.remains<cooldown.tigers_fury.remains)&(dot.moonfire.refreshable&(buff.tigers_fury.up|!var.moonfire_tf)|dot.moonfire.remains<2|buff.tigers_fury.up&!var.moonfire_tf)
    - shred

  aoe_builder:
    - rake,name="Rake (Doubleclawed)",if=dot.rake.refreshable&((talent.doubleclawed_rake&(!talent.lunar_inspiration|!talent.panthers_guile|active_dot.rake<5))|hero_tree.wildstalker&(active_dot.rake<2+!talent.panthers_guile+talent.lunar_inspiration))
    - moonfire,if=talent.lunar_inspiration&dot.moonfire.refreshable
    - 106785,name="Swipe (Proc)",if=hero_tree.druid_of_the_claw&var.bs_inc|buff.clearcasting.react&enemies.combat.8y>2&(hero_tree.druid_of_the_claw|enemies.combat.8y<7)
    - 106785,name="Swipe (Sudden Ambush)",if=buff.sudden_ambush.up&enemies.combat.8y>=5+(2*hero_tree.wildstalker)
    - rake,name="Rake (Wildstalker)",if=dot.rake.refreshable&(hero_tree.wildstalker|enemies.combat.8y<=var.dotc_rake_threshold)
    - rake,name="Rake (Tigers Fury)",if=buff.tigers_fury.up&!var.rake_tf&enemies.combat.8y=2
    # Panther's Guile IS on the raid string, so this line is live here.
    - shred,if=combo_points<=1&enemies.combat.8y=2&talent.panthers_guile
    - 106785,name="Swipe (Filler)",if=combo_points>1|enemies.combat.8y>2|!talent.panthers_guile

  # Mark of the Wild, OOC Regrowth top-off.
  heal_support:
    - mark_of_the_wild,range_check=none,if=(buff.mark_of_the_wild.down.any|action.mark_of_the_wild.overlayed)&lastcast.mark_of_the_wild>=10
    - regrowth,range_check=none,if=health.pct<=config.regrowth_ooc_hp_pct&!player.combat

  # Emergency Bear Form, Fluid Form auto-shift, m.
  form:
    # Bear costs the whole Cat rotation, so it has to buy something. Here the
    # only payoff is Heart of the Wild on the next line.
    - bear_form,name="Panic Bear Form",range_check=none,if=health.pct<=config.panic_bear_hp_pct&!buff.bear_form.up&player.combat&(cooldown.heart_of_the_wild.ready|buff.heart_of_the_wild.up)
    - heart_of_the_wild,range_check=none,if=buff.bear_form.up&player.combat

    - shred,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - rake,if=player.combat&target.attackable&target.in_melee&buff.cat_form.down&talent.fluid_form.enabled
    - cat_form,range_check=none,if=buff.cat_form.down&(target.attackable|enemies.40y)

    # Prowl cannot be cast in combat — pre-pull opener only. See the M+ file
    # for the full note on why this needs an explicit !player.combat.
    - prowl,range_check=none,if=!player.combat&!var.bs_inc&buff.prowl.down&buff.shadowmeld.down&(target.attackable|enemies.40y)

  interrupts:
    - skull_bash,off_gcd=true,ignore_queue=true,if=interrupt.target.check
    - skull_bash.mouseover,off_gcd=true,ignore_queue=true,if=interrupt.mouseover.check
    - skull_bash.focus,off_gcd=true,ignore_queue=true,if=interrupt.focus.check
    - mighty_bash,if=interrupt.cc.check
    - incapacitating_roar,if=interrupt.stun.aoe.check

  # Regrowth off a Predatory Swiftness proc. Called after `defensives` so a
  # real defensive cooldown outranks a proc heal.
  predatory_swiftness:
    - regrowth,delay=500,range_check=none,if=buff.predatory_swiftness.up&health.pct<=config.predatory_swiftness_heal_hp_pct&lastcast.regrowth>=2

  main:
    # Convoke is a channel and nothing here ever wa.
    - return,if=player.channeling|player.casting|var.protected_channel

    - call_action_list,name=engine

    - call_action_list,name=heal_support
    - call_action_list,name=form

    # COMBAT WALL - nothing below runs out of combat. player.combat, NOT
    # player.auto_combat, which is a config check and not combat state.
    - return,if=!player.combat
    - call_action_list,name=interrupts


    # NOTE: do NOT add a `return,if=player.auto_com.

    - call_action_list,name=defensives
    - call_action_list,name=predatory_swiftness

    - return,if=!target.valid|target.dead|!target.attackable

    - rake,range_check=none,if=buff.prowl.up&target.in_melee
    - return,if=buff.prowl.up

    - tigers_fury,name="Tigers Fury (Refresh)",off_gcd=true,ignore_queue=true,if=(var.bs_inc_cd_remains<=1|var.bs_inc_cd_remains>10|var.holdBerserk)&(cooldown.frantic_frenzy.remains<buff.tigers_fury.duration-1.5|cooldown.frantic_frenzy.remains>22|!talent.frantic_frenzy|enemies.combat.8y=1)

    - chomp,if=buff.chomp_enabler.up

    - call_action_list,name=cooldown

    # Apex Predator's Craving is NOT on the raid string — these two are inert
    # here, kept so a respec back to the M+ build still works.
    - ferocious_bite,if=buff.apex_predators_craving.up
    - ravage,if=buff.apex_predators_craving.up

    - call_action_list,name=finisher,if=enemies.combat.8y=1
    - call_action_list,name=aoe_finisher,if=enemies.combat.8y>=2
    - call_action_list,name=builder,if=enemies.combat.8y=1&combo_points<=4
    - call_action_list,name=aoe_builder,if=enemies.combat.8y>1&combo_points<=4
    - regrowth,range_check=none,if=buff.predatory_swiftness.up&var.regrowth
    - tigers_fury,name="Tigers Fury (Fallback)",off_gcd=true,ignore_queue=true
