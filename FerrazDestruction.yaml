# =============================================================================
# Destruction Warlock Ferraz M+ - spec 267 - patch 12.1.
# =============================================================================
#
# Lists (entry point: main):
#   engine                  pet_support             interrupts              dispels
#   defensives              trinkets                racials                 st
#   aoe                     moving_st               moving_aoe              main
#
# WHY ANY OF IT IS THE WAY IT IS: .agents/rationale/Destruction.md
# That file carries every measurement, every rejected alternative and every
# bug this file has already been through. Read it before changing a line -
# most of what looks improvable here was tried and reverted.
# =============================================================================

version: "1.0.1"
author: Ferraz
patch: "12.1"
spec: 267
name: Destruction Warlock Ferraz M+
description: |
  Destruction Warlock Ferraz M+ (Diabolist)
entry: main

config:
  # BUILD STAMP — display only. Keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-08-27 | Patch: 12.1 | Version: 1.0.1"

  # RECOMMENDED BUILD — the string this priority .
  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CsQAAAAAAAAAAAAAAAAAAAAAAwMmZGNLMzmZmZWmFzMzsYMWMDAAmZGzMzCYMjhFyAbDL0YhBAAGDM2AwMDwYGzYDAAwMzMAAMGG"

  # PET — the single biggest utility decision thi.
  pet_choice:
    label: "Pet"
    section: "Pet"
    type: dropdown
    options:
      - label: "Felhunter (Spell Lock — interrupt)"
        value: 1
      - label: "Imp (Singe Magic — magic dispel)"
        value: 2
    default: 1

  auto_summon_pet:
    label: "Summon Pet Automatically"
    section: "Pet"
    type: checkbox
    default: true
    description: "Re-summon the chosen pet out of combat when it is missing. Never fires in combat — a summon there costs you the pull."

  # COOLDOWNS — Summon Infernal is the burst wind.
  auto_burst:
    label: "Auto Burst (no toggle needed)"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Fires Summon Infernal, trinkets and potion by itself. The TTD sliders still hold them back on trash that is about to die. Turn OFF to drive the burst with the toggle below."

  burst_toggle:
    label: "Burst (Infernal + Trinkets + Pot)"
    spell: 1122
    section: "Cooldowns"
    type: toggle
    description: "Manual burst window. Only needed when Auto Burst is OFF."

  # Same reasoning as inc_min_standing_time in Fe.
  infernal_min_standing_time:
    label: "Infernal - Min Standing Still (s)"
    section: "Cooldowns"
    type: slider
    min: 0
    max: 10
    default: 2
    description: "Seconds standing still before Summon Infernal may fire. 0 disables the check."

  # TRINKETS & CONSUMABLES — all three ride the I.
  use_trinket_1:
    label: "Auto Trinket 1 (with Infernal)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2 (with Infernal)"
    section: "Trinkets"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Offensive Potion"
    section: "Trinkets"
    type: checkbox
    default: true

  # TIME TO DIE — stop a long cooldown being spen.
  ttd_infernal:
    label: "Summon Infernal TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15

  ttd_trinkets:
    label: "Trinkets TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 10

  ttd_potion:
    label: "Potion TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15

  # Immolate is a DoT with a ramp. Refreshing it on a mob that dies first is
  # a wasted global AND a wasted shard trickle.
  ttd_immolate:
    label: "Immolate TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 3
    max: 20
    default: 8
    description: "Minimum time to die before Immolate is worth applying or refreshing. SimC's own list uses 8 for the single-target case and 18 for spreading in AoE."

  # AOE — where the AoE list opens and when Rain .
  aoe_threshold:
    label: "AoE - Min Enemies"
    section: "AoE"
    type: slider
    min: 2
    max: 6
    default: 2
    description: "Enemies around your target before the AoE priority takes over. Counted with enemies.around_target, so it measures the pack around the mob you are actually casting at."

  # Rain of Fire is a shard spender and a channel. SimC gates it at 3 enemies
  # and scales the shard floor by how many Immolates are already out.
  rof_min_enemies:
    label: "Rain of Fire - Min Enemies"
    section: "AoE"
    type: slider
    min: 2
    max: 8
    default: 3

  # DEFENSIVES — UNVALIDATED: SimC has no M+ dama.
  unending_resolve_dmg_pct:
    label: "Unending Resolve (Incoming Dmg%)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 40

  unending_resolve_hp_pct:
    label: "Unending Resolve HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 45

  # Dark Pact spends health, so its HP floor is HIGHER than Unending Resolve's
  # on purpose — at 20% there is nothing left to spend.
  dark_pact_dmg_pct:
    label: "Dark Pact (Incoming Dmg%)"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 35

  dark_pact_hp_pct:
    label: "Dark Pact HP%"
    section: "Defensives"
    type: slider
    min: 0
    max: 100
    default: 65

  # DISPELS — Singe Magic only, and only with an .
  auto_dispel_self:
    label: "Singe Magic - Self"
    section: "Dispels"
    type: checkbox
    default: true
    description: "Needs an Imp. Inert with a Felhunter out."

  auto_dispel_party:
    label: "Singe Magic - Party"
    section: "Dispels"
    type: checkbox
    default: false
    description: "OFF by default: each dispel is a pet global and in M+ the healer usually covers it."

  # ENGINE — the plumbing FerrazBalance.yaml inli.
  engine_loot_nearby:
    label: "Loot Nearby Corpses"
    section: "Engine"
    type: checkbox
    default: true

  # Defined locally rather than inherited, for th.
  engine_auto_combat:
    label: "Auto Combat"
    section: "Engine"
    type: multi_select
    options:
      - label: "Off"
        value: 0
      - label: "Quest Mob"
        value: 1
      - label: "Target in combat"
        value: 2
      - label: "Targeting party"
        value: 3
    default: [1, 2]

  engine_auto_target:
    label: "Auto Target (Ranged)"
    section: "Engine"
    type: multi_select
    options:
      - label: "No target"
        value: 0
      - label: "Target is dead"
        value: 1
      - label: "Target too far"
        value: 2
    default: [0, 1]
    description: "When to pick a new enemy automatically, within 40y."

  engine_healthstone:
    label: "Healthstone HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 40

  engine_health_potion:
    label: "Health Potion HP%"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 25

  # HELP.
  discord_button:
    section: "Help"
    type: button
    label: "Discord - Ferraz"
    text: "Join Discord - Ferraz"
    url: "https://discord.com/channels/857767821093634068/1467268534420766854"

variables:
  # Verbatim from Simia's rotation_267. The secon.
  infernal_active: pet.infernal.active|(cooldown.summon_infernal.duration-cooldown.summon_infernal.remains)<20

  # Diabolic Ritual builds toward Demonic Art. On.
  ritual_length: buff.diabolic_ritual_mother_of_chaos.remains+buff.diabolic_ritual_overlord.remains+buff.diabolic_ritual_pit_lord.remains

  # Burst allowed: auto or manual toggle.
  burst_ok: config.auto_burst|config.burst_toggle

  # The pull is actually parked. Same shape as Fe.
  pull_engaged: player.combat&player.standing.time>=config.infernal_min_standing_time&debuff.immolate.up

  # === TIME TO DIE === (target.boss always ignores TTD)
  infernal_ttd_ok: (target.boss|target.time_to_die>=config.ttd_infernal|fight_remains>=config.ttd_infernal)
  trinkets_ttd_ok: (target.boss|target.time_to_die>=config.ttd_trinkets|fight_remains>=config.ttd_trinkets)
  potion_ttd_ok: (target.boss|target.time_to_die>=config.ttd_potion|fight_remains>=config.ttd_potion)
  immolate_ttd_ok: (target.boss|target.time_to_die>=config.ttd_immolate|fight_remains>=config.ttd_immolate)

lists:
  # Everything spell_queue / sanity_checks / auto_target_ranged used to do,
  # inlined so every piece has a toggle.
  engine:
    # `&`, not `|`. With `|` the condition is true .
    - queue_spell,if=!player.casting&!player.channeling

    # --- The five guards, verbatim. Dropping any lets the rotation fire while
    # dead or mounted.
    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted
    - return,if=buff.travel_form.up

    - interact_target,delay=350,if=config.engine_loot_nearby&target.lootable&target.range<=5
    - interact_target,delay=350,if=config.engine_loot_nearby&loot_nearby
    - interact_mouseover,delay=350,if=config.engine_loot_nearby&mouseover.lootable&mouseover.range<=5

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.40y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=40&enemies.combat.40y>=1

    # --- Temple of Sethraliss, Adderis and Aspix .
    - target_enemy,name="Swap Off Storm Blessed",delay=500,off_gcd=true,if=target.buff.1289229.up&enemies.combat.40y>=2

  # Out of combat only. A summon in combat costs you the pull, and the
  # rotation's combat wall keeps this list on the idle side of the line.
  pet_support:
    - summon_felhunter,name="Summon Felhunter",range_check=none,if=config.auto_summon_pet&config.pet_choice=1&!pet.exists
    - summon_imp,name="Summon Imp",range_check=none,if=config.auto_summon_pet&config.pet_choice=2&!pet.exists

  # Destruction has NO interrupt of its own — Spe.
  interrupts:
    - spell_lock,name="Spell Lock",if=interrupt.target.check
    - spell_lock.mouseover,name="Spell Lock (MO)",if=interrupt.mouseover.check
    - spell_lock.focus,name="Spell Lock (Focus)",if=interrupt.focus.check
    - shadowfury,name="Shadowfury (AoE Stun)",if=interrupt.stun.aoe.check

  # Singe Magic is a PET ability and belongs to the Imp. With the default
  # Felhunter this list is inert. UNVALIDATED: no dispel model in SimC.
  dispels:
    - singe_magic.player,delay=500,name="Singe Magic (Self)",if=config.auto_dispel_self&config.pet_choice=2&player.dispelable.list
    - singe_magic,delay=500,cycle=party,name="Singe Magic (Party)",if=config.auto_dispel_party&config.pet_choice=2&cycle.dispelable.list

  # Ahead of interrupts, so survival outranks uti.
  defensives:
    - unending_resolve,name="Unending Resolve (predicted)",range_check=none,if=incoming.mitigated.pct>=config.unending_resolve_dmg_pct
    - dark_pact,name="Dark Pact (predicted)",range_check=none,if=incoming.mitigated.pct>=config.dark_pact_dmg_pct
    # Higher HP floor than Unending Resolve on purpose.
    - dark_pact,name="Dark Pact (HP)",range_check=none,if=health.effective.pct<=config.dark_pact_hp_pct
    - unending_resolve,name="Unending Resolve (HP)",range_check=none,if=health.effective.pct<=config.unending_resolve_hp_pct

  # Ride the Infernal window. Same shape as FerrazBalance's trinkets list.
  trinkets:
    - trinket_1,delay=150,name="Trinket 1",if=var.burst_ok&config.use_trinket_1&trinket_1.ready&player.combat&var.trinkets_ttd_ok&var.infernal_active
    - trinket_2,delay=150,name="Trinket 2",if=var.burst_ok&config.use_trinket_2&trinket_2.ready&player.combat&var.trinkets_ttd_ok&var.infernal_active
    # fight_remains<=30 lets a potion that would ot.
    - combat_potion,delay=150,name="Combat Potion",if=var.burst_ok&config.use_potion&combat_potion.ready&player.combat&(var.potion_ttd_ok&var.infernal_active|fight_remains<=30)

  # Racials ride the same window, exactly as SimC's ogcd list does.
  racials:
    - berserking,name="Berserking",if=var.infernal_active
    - blood_fury,name="Blood Fury",if=var.infernal_active
    - fireblood,name="Fireblood",if=var.infernal_active
    - ancestral_call,name="Ancestral Call",if=var.infernal_active

  # SINGLE TARGET — SimC's actions.default, with .
  st:
    # Soul Fire on cooldown while it will not overcap. It is a shard generator
    # with a cast time, so it goes before the shard spenders.
    - soul_fire,name="Soul Fire",if=soul_shard<=4

    # Do not sit on two Conflagrate charges — the second is pure waste.
    - conflagrate,name="Conflagrate (2 charges)",if=cooldown.conflagrate.charges>=2

    # SPEND DEMONIC ART. The health.pct>20 clause hands the execute window to
    # Shadowburn instead, which is what the line below it is for.
    - chaos_bolt,name="Chaos Bolt (Demonic Art)",if=talent.diabolic_ritual&(demonic_art|var.ritual_length<action.chaos_bolt.execute_time)&target.health.pct>20

    - conflagrate,name="Conflagrate (Backdraft)",if=soul_shard<=4.2&buff.backdraft.stack<1

    # The burst window. var.pull_engaged is the M+ .
    - summon_infernal,name="Summon Infernal",if=var.burst_ok&var.infernal_ttd_ok&var.pull_engaged

    # Execute, or a filler when the ritual has time left and no Art to spend.
    - shadowburn,name="Shadowburn",if=((!demonic_art&var.ritual_length>2)|target.health.pct<=20)&(buff.fiendish_cruelty.up|talent.conflagration_of_chaos)

    # DoT. Pandemic-aware, and TTD-gated so it is n.
    - immolate,name="Immolate",if=(debuff.immolate.remains<debuff.immolate.duration*0.3|debuff.immolate.refreshable)&(!talent.soul_fire|cooldown.soul_fire.remains+action.soul_fire.cast_time>debuff.immolate.remains)&var.immolate_ttd_ok

    - conflagrate,name="Conflagrate (Filler)",if=soul_shard<=4.4&buff.backdraft.stack<1
    - ruination,name="Ruination"

    # Ordinary shard dump, well below the Demonic Art one.
    - chaos_bolt,name="Chaos Bolt (Shard Dump)",if=talent.diabolic_ritual&var.ritual_length>4

    # Infernal Bolt replaces Incinerate while the ritual is running and gives
    # a bigger shard chunk, so it goes first.
    - infernal_bolt,name="Infernal Bolt",if=soul_shard<=3
    - incinerate,name="Incinerate"

  # AOE — SimC's actions.aoe_dia. Havoc and Catac.
  aoe:
    - summon_infernal,name="Summon Infernal (AoE)",if=var.burst_ok&var.infernal_ttd_ok&var.pull_engaged

    # Spend Demonic Art. The upper bound scales with Destructive Rapidity
    # exactly as SimC writes it.
    - chaos_bolt,name="Chaos Bolt (Demonic Art)",if=talent.diabolic_ritual&(demonic_art|var.ritual_length<action.chaos_bolt.execute_time)&enemies.around_target<=(10-2*talent.destructive_rapidity)

    # The shard floor drops as more Immolates tick, because each one feeds
    # shards back. 3.5 minus 0.1 per active Immolate, straight from SimC.
    - rain_of_fire,name="Rain of Fire",if=(soul_shard>=(3.5-0.1*active_dot.immolate)|buff.alythesss_ire.up)&enemies.around_target>=config.rof_min_enemies

    - conflagrate,name="Conflagrate (Spread Immolate)",if=dot_refreshable_count.immolate>0&!debuff.immolate.refreshable

    # Target-count cap widens with Fiendish Cruelty up, as SimC has it.
    - shadowburn,name="Shadowburn (AoE)",if=enemies.around_target<=(4-talent.destructive_rapidity+2*buff.fiendish_cruelty.up)|(talent.conflagration_of_chaos&enemies.around_target<=(6+2*buff.fiendish_cruelty.up))

    - ruination,name="Ruination (AoE)"
    - infernal_bolt,name="Infernal Bolt (AoE)",if=soul_shard<3
    - chaos_bolt,name="Chaos Bolt (Low Count)",if=enemies.around_target<=2&var.ritual_length>4

    # Avatar of Destruction widens the Soul Fire cap from 5 to 10.
    - soul_fire,name="Soul Fire (AoE)",if=soul_shard<4&(talent.avatar_of_destruction&enemies.around_target<=10|enemies.around_target<=5)

    # active_dot.immolate<=5 is SimC's cap on how w.
    - immolate,name="Immolate (Spread)",if=debuff.immolate.refreshable&active_dot.immolate<=5&(target.boss|target.time_to_die>18|fight_remains>18)

    - conflagrate,name="Conflagrate (AoE Filler)",if=buff.backdraft.stack<2|!talent.backdraft
    - incinerate,name="Incinerate (AoE)"

  # MOVING — instant casts only.
  moving_st:
    - conflagrate,name="Conflagrate (Moving)",if=cooldown.conflagrate.charges>=1
    - shadowburn,name="Shadowburn (Moving)"
    - ruination,name="Ruination (Moving)"

  moving_aoe:
    - conflagrate,name="Conflagrate (Moving AoE)",if=cooldown.conflagrate.charges>=1
    - shadowburn,name="Shadowburn (Moving AoE)"
    - ruination,name="Ruination (Moving AoE)"

  # Entry point: first matching line wins the GCD, everything above the damage
  # lists outranks damage.
  main:
    - return,if=player.channeling|player.casting

    # --- Engine plumbing. Must stay at the top. ---
    - call_action_list,name=engine

    # COMBAT WALL - nothing below runs out of combat. player.combat, NOT
    # player.auto_combat, which is a config check and not combat state.
    - call_action_list,name=pet_support,if=!player.combat
    - return,if=!player.combat

    # --- Target guards ---
    - return,if=!target.valid&!((config.engine_auto_combat.has(1)&target.quest_mob&target.enemy&!target.dead)|(config.engine_auto_combat.has(2)&target.combat&target.enemy&!target.dead)|(config.engine_auto_combat.has(3)&target.targeting_party&target.enemy&!target.dead))
    - return,if=!target.valid&config.engine_auto_combat.has(0)
    - return,if=!target.valid|target.dead|!target.attackable

    # --- Survival, then utility, then the burst window ---
    - call_action_list,name=defensives
    - call_action_list,name=interrupts
    - call_action_list,name=dispels
    - call_action_list,name=trinkets
    - call_action_list,name=racials

    # --- Damage priority: moving first (instant-only), then stationary. ---
    - call_action_list,name=moving_aoe,if=player.moving&enemies.around_target>=config.aoe_threshold
    - call_action_list,name=moving_st,if=player.moving&enemies.around_target<config.aoe_threshold
    - call_action_list,name=aoe,if=enemies.around_target>=config.aoe_threshold
    - call_action_list,name=st,if=enemies.around_target<config.aoe_threshold
