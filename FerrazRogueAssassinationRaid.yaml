# =============================================================================
# Assassination Rogue Ferraz Raid - spec 259 - patch 12.1.
# =============================================================================
#
# Lists (entry point: main):
#   engine        defensives    poisons       interrupts    cds
#   items         core_dot      multidot      generate      spend
#   vanish        main
#
# Built for the Fatebound build supplied on 2026-09-10, cross-checked against
# SimulationCraft 1210-01 c1935b9 and Lassitude's Nek'zali log
# (WarcraftLogs/Rogue/Assassination/Nekzali the Soulcoiler/).
#
# Why each line is the way it is: .agents/rationale/RogueAssassination.md
# =============================================================================

version: "1.0.0"
author: Ferraz
patch: "12.1"
spec: 259
name: Assassination Rogue Ferraz Raid
description: |
  Assassination Rogue Ferraz Raid
entry: main

config:
  # Display-only build stamp - keep in sync with version:/patch: above.
  about:
    section: "Info"
    type: note
    label: "Rotation Info"
    text: "Last update: 2026-09-10 | Patch: 12.1 | Version: 1.0.0"

  recommended_talents:
    section: "Talents"
    type: copy_text
    label: "Recommended Talent String"
    text: "CMQAAAAAAAAAAAAAAAAAAAAAAYmlxsYwAAAAAAzygtZAAAAAAZbmZmZmZMWmZmZbmlZmZGjZGjxMzYMAGYBmxoxsBYbAbGAMzMGD"

  # --- Rotation ---
  aoe_threshold:
    label: "AoE Target Count"
    section: "Rotation"
    type: slider
    min: 2
    max: 6
    default: 2
    description: "Target count at which the AoE builders take over. Assassination switches early: Fan of Knives beats Mutilate from 2 targets on a dagger build."

  finisher_cp:
    label: "Finisher Combo Points"
    section: "Rotation"
    type: slider
    min: 4
    max: 7
    default: 5
    description: "Combo points before Envenom and Rupture are allowed. Deeper Stratagem and Sanguine Stratagem raise the cap to 7, but SimC's maintained list still spends at 5 - holding for 6 or 7 costs more energy throughput than the bigger finisher returns. Raise it only if you know why."

  multidot_mouseover:
    label: "Mouseover Multi-DoT"
    section: "Rotation"
    type: checkbox
    default: true
    description: "Apply Garrote and Rupture to whatever enemy you are hovering, instead of only to your current target. Simia cannot cycle enemy targets, so hovering IS the target picker - the lines do nothing until you hover something."

  use_shiv:
    label: "Shiv In Burst"
    section: "Rotation"
    type: checkbox
    default: true
    description: "Throw Shiv inside a Deathmark or Kingsbane window. SimC's list only casts Shiv on a Darkest Night build, but the top reference log casts it 14 times in 10 minutes without that talent, so it goes in gated to the window rather than on cooldown."

  # --- Cooldowns ---
  use_trinket_1:
    label: "Auto Trinket 1"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_trinket_2:
    label: "Auto Trinket 2"
    section: "Cooldowns"
    type: checkbox
    default: true

  use_potion:
    label: "Auto Combat Potion"
    section: "Cooldowns"
    type: checkbox
    default: true

  vanish_enabled:
    label: "Auto Vanish (Improved Garrote)"
    section: "Cooldowns"
    type: checkbox
    default: true
    description: "Vanish to re-apply Garrote inside an Improved Garrote window. This is a damage cooldown for this build, not an escape. Turn it off if you need Vanish saved for a mechanic."

  # --- Time To Die ---
  # A long cooldown spent on something about to die is a cooldown thrown away.
  # A boss always ignores these.
  ttd_deathmark:
    label: "Deathmark TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 15

  ttd_kingsbane:
    label: "Kingsbane TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 5
    max: 30
    default: 12

  ttd_dots:
    label: "Garrote / Rupture TTD (seconds)"
    section: "Time To Die"
    type: slider
    min: 4
    max: 20
    default: 12
    description: "A DoT refresh is only worth a global if the target lives long enough to tick it out. Garrote and Rupture together are 29% of this build's damage and all of it is ticks."

  # --- Defensives ---
  crimson_vial_hp_pct:
    label: "Crimson Vial HP %"
    section: "Defensive HP Percentage"
    type: slider
    min: 0
    max: 100
    default: 70

  evasion_hp_pct:
    label: "Evasion HP %"
    section: "Defensive HP Percentage"
    type: slider
    min: 0
    max: 100
    default: 35

  cloak_hp_pct:
    label: "Cloak of Shadows HP %"
    section: "Defensive HP Percentage"
    type: slider
    min: 0
    max: 100
    default: 25

  feint_dmg_pct:
    label: "Feint (Incoming Dmg %)"
    section: "Defensive HP Percentage"
    type: slider
    min: 0
    max: 100
    default: 35
    description: "Feint on predicted incoming damage rather than on health already lost. It is a 6s window on a 20s cooldown, so it wants to be up BEFORE the hit."

  # --- Utility ---
  auto_poisons:
    label: "Auto Apply Poisons"
    section: "Utility"
    type: checkbox
    default: true
    description: "Re-apply poisons out of combat when they are under 2 minutes. This build runs two lethal poisons through Dragon-Tempered Blades, so both Deadly and Amplifying go on."

  auto_tricks:
    label: "Tricks of the Trade on Focus"
    section: "Utility"
    type: checkbox
    default: false
    description: "Cast Tricks of the Trade on your focus target whenever it is off cooldown. Set your focus to the tank first - with no focus the line does nothing."

  # --- Engine ---
  engine_auto_target:
    label: "Auto Target"
    section: "Engine"
    type: multi_select
    options:
      - label: "No Target"
        value: 0
      - label: "Target Dead"
        value: 1
      - label: "Target Out Of Range"
        value: 2
    default: [0, 1]

  engine_healthstone:
    label: "Healthstone HP %"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 35

  engine_health_potion:
    label: "Health Potion HP %"
    section: "Engine"
    type: slider
    min: 0
    max: 100
    default: 30

variables:
  # Single target drives most of the SimC list. Fan of Knives is the target
  # counter Blizzard exposes for this spec, so it is what the list counts with.
  single_target: spell_targets.fan_of_knives<config.aoe_threshold

  # TTD gates. A boss always ignores them.
  deathmark_ttd_ok: (target.boss|target.time_to_die>=config.ttd_deathmark|fight_remains>=config.ttd_deathmark)
  kingsbane_ttd_ok: (target.boss|target.time_to_die>=config.ttd_kingsbane|fight_remains>=config.ttd_kingsbane)
  dots_ttd_ok: (target.boss|target.time_to_die>=config.ttd_dots|fight_remains>=config.ttd_dots)

  # The burst window. Everything that can be aligned is aligned on Deathmark,
  # because Deathmark is the only real multiplier in the kit and Kingsbane is
  # deliberately cast inside it.
  burst_now: debuff.deathmark.up|dot.kingsbane.ticking

  # Deathmark wants Garrote and Rupture already ticking, so the window opens on
  # a fully dressed target instead of spending its first seconds building one.
  dots_ready: dot.garrote.ticking&dot.rupture.ticking

  # A hovered enemy worth spending a global on. Hovering a friendly unit, a
  # dead mob or the target you are already hitting must not divert the list.
  mo_enemy_valid: config.multidot_mouseover&mouseover.exists&mouseover.enemy&mouseover.attackable&!mouseover.dead&mouseover.combat

lists:
  engine:
    # `&`, not `|`: with `|` this is true on almost every pass.
    - queue_spell,if=!player.casting&!player.channeling

    - return,if=!state.rotation
    - return,if=player.dead
    - return,if=state.blocked_inputs
    - return,if=mounted

    # Melee-only, and this file IS melee: keeps auto-attack running.
    - attack_target,off_gcd=true,delay=100,if=player.combat&target.exists&target.attackable&target.alive&target.in_melee&!player.auto_attacking

    - healthstone,delay=250,if=healthstone.ready&health.pct<=config.engine_healthstone
    - health_potion,delay=250,if=health_potion.ready&health.pct<=config.engine_health_potion

    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(0)&!target.exists&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(1)&target.dead&enemies.combat.8y>=1
    - target_enemy,delay=200,off_gcd=true,if=config.engine_auto_target.has(2)&target.range>=25&enemies.combat.8y>=1

  defensives:
    # Feint is predictive on purpose: 6s of window on a 20s cooldown is no use
    # applied after the hit has already landed.
    - feint,name="Feint (Predicted Damage)",off_gcd=true,ignore_queue=true,range_check=none,if=incoming.pct>=config.feint_dmg_pct
    - cloak_of_shadows,name="Cloak of Shadows",off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.cloak_hp_pct
    - evasion,name="Evasion",off_gcd=true,ignore_queue=true,range_check=none,if=health.pct<=config.evasion_hp_pct
    - crimson_vial,name="Crimson Vial",range_check=none,if=health.pct<=config.crimson_vial_hp_pct

  # Out of combat only. Applying a poison in combat costs a global and drops
  # the one already running.
  poisons:
    - deadly_poison,range_check=none,name="Deadly Poison",if=config.auto_poisons&!player.combat&pred.buff.deadly_poison.remains<120
    # Dragon-Tempered Blades is what allows a SECOND lethal poison. Without it
    # this line would overwrite Deadly Poison every time it ran.
    - amplifying_poison,range_check=none,name="Amplifying Poison",if=config.auto_poisons&talent.dragontempered_blades&!player.combat&pred.buff.amplifying_poison.remains<120
    - atrophic_poison,range_check=none,name="Atrophic Poison",if=config.auto_poisons&talent.atrophic_poison&!player.combat&pred.buff.atrophic_poison.remains<120

  interrupts:
    - kick,off_gcd=true,ignore_queue=true,if=interrupt.target.check
    - kick.mouseover,off_gcd=true,ignore_queue=true,if=interrupt.mouseover.check
    - kick.focus,off_gcd=true,ignore_queue=true,if=interrupt.focus.check
    - kidney_shot,if=interrupt.cc.check
    - cheap_shot,if=interrupt.cc.check

  cds:
    # Deathmark is the window. It wants both bleeds ticking, Envenom already
    # up, and Kingsbane about to follow it in - the two are cast as a pair.
    - deathmark,name="Deathmark",if=var.dots_ready&cooldown.kingsbane.remains<=2&buff.envenom.remains>2&var.deathmark_ttd_ok

    - call_action_list,name=items
    - call_action_list,name=vanish,if=config.vanish_enabled&!buff.stealth.up

    # Kingsbane goes inside Deathmark, or waits out most of Deathmark's
    # cooldown so the next pairing is not broken. 52 is SimC's number: what is
    # left of Deathmark once Kingsbane's own cooldown has run.
    - kingsbane,name="Kingsbane",if=var.dots_ready&(dot.deathmark.ticking|cooldown.deathmark.remains>52)&buff.envenom.up&var.kingsbane_ttd_ok

    - combat_potion,name="Combat Potion",if=config.use_potion&combat_potion.ready&dot.rupture.ticking&(var.burst_now|buff.bloodlust.up|fight_remains<30)

    # Racials on the same window as everything else.
    - blood_fury,name="Blood Fury",if=var.burst_now
    - berserking,name="Berserking",if=var.burst_now
    - fireblood,name="Fireblood",if=var.burst_now
    - ancestral_call,name="Ancestral Call",if=var.burst_now

    - thistle_tea,name="Thistle Tea",off_gcd=true,ignore_queue=true,if=energy.pct<30|fight_remains<10

  # Burst window only. Deathmark and Kingsbane are both roughly 2 minutes, so
  # a 2-minute trinket locks to them and never needs an off-window escape. The
  # only exception is the end of a fight, where holding it wastes it outright.
  items:
    - trinket_1,name="Trinket 1 (Burst Window)",if=config.use_trinket_1&trinket_1.ready&(var.burst_now|fight_remains<=20)
    - trinket_2,name="Trinket 2 (Burst Window)",if=config.use_trinket_2&trinket_2.ready&(var.burst_now|fight_remains<=20)

  # Garrote and Rupture are 29% of this build's damage in the reference log and
  # every point of it is ticks, which is why they outrank everything else.
  core_dot:
    # Improved Garrote window: re-apply at the buffed multiplier before it ends.
    - garrote,name="Garrote (Improved Window)",if=buff.improved_garrote.up&(dot.garrote.refreshable|dot.garrote.remains<=14+6*talent.razor_wire+4*!var.single_target)
    - garrote,name="Garrote",if=combo_points.deficit>=1&dot.garrote.refreshable&target.time_to_die-dot.garrote.remains>config.ttd_dots
    - rupture,name="Rupture",if=combo_points>=config.finisher_cp&dot.rupture.refreshable&target.time_to_die-dot.rupture.remains>config.ttd_dots

  # Simia cannot cycle enemy targets - the documentation is explicit about it -
  # so multi-dotting is driven by what you hover. The reference AoE log has
  # Garrote and Rupture on NINE distinct enemies, which is most of the gap
  # between it and a single-target parse.
  multidot:
    - garrote.mouseover,name="Garrote (Mouseover)",range_check=mouseover,if=var.mo_enemy_valid&combo_points.deficit>=1&mouseover.debuff.garrote.refreshable&mouseover.time_to_die>config.ttd_dots
    - rupture.mouseover,name="Rupture (Mouseover)",range_check=mouseover,if=var.mo_enemy_valid&combo_points>=config.finisher_cp&mouseover.debuff.rupture.refreshable&mouseover.time_to_die>config.ttd_dots

  generate:
    - crimson_tempest,name="Crimson Tempest (AoE)",if=talent.crimson_tempest&!var.single_target&(active_dot.garrote<spell_targets.fan_of_knives|active_dot.rupture<spell_targets.fan_of_knives)&(dot.rupture.remains>5|energy.regen>40)
    - shiv,name="Shiv (Toxic Stiletto)",if=var.single_target&talent.toxic_stiletto&talent.darkest_night
    # Not a SimC line. See the rationale: the reference AoE log casts Shiv
    # without Darkest Night, at roughly one per 40s, so it is gated to the
    # window rather than put on cooldown where it would displace a builder.
    - shiv,name="Shiv (Burst Window)",if=config.use_shiv&var.burst_now&energy.pct>40
    - fan_of_knives,name="Fan of Knives (Darkest Night)",if=buff.darkest_night.up&combo_points.deficit=1&var.single_target
    - fan_of_knives,name="Fan of Knives (AoE)",if=!var.single_target
    - ambush,name="Ambush (Blindside)",if=talent.blindside&buff.blindside.up
    - mutilate,name="Mutilate"
    # Terminal fallback for a non-dagger weapon pairing, where Mutilate is not
    # castable at all and the list above would dead-end.
    - fan_of_knives,name="Fan of Knives (Fallback)"

  spend:
    # Envenom is the single biggest damage source in the log at 16.3%, and it
    # is what keeps Slice and Dice alive on this build - there is no Slice and
    # Dice maintenance line anywhere below, because Envenom refreshes it.
    - envenom,name="Envenom (Refresh Buff)",if=buff.envenom.remains<=1|debuff.deathmark.up
    - envenom,name="Envenom (Energy Dump)",if=energy.pct>70|fight_remains<15
    - envenom,name="Envenom (Dying Target / AoE)",if=energy.pct>30&(target.time_to_die<12|spell_targets.fan_of_knives>=4)

  vanish:
    # Vanish is a damage cooldown here, not an escape: it opens an Improved
    # Garrote window so Garrote can be re-applied at the buffed multiplier.
    # Held for Deathmark unless Deathmark will not come back before the target
    # dies anyway.
    - vanish,name="Vanish (Improved Garrote)",if=talent.improved_garrote&(dot.deathmark.ticking|cooldown.deathmark.remains>target.time_to_die-10)

  main:
    - call_action_list,name=engine

    - call_action_list,name=poisons

    # Slice and Dice is maintained by Envenom on this build, so it only ever
    # needs casting once - when it is genuinely down.
    - slice_and_dice,name="Slice and Dice (Open)",if=buff.slice_and_dice.down&combo_points>=1

    # COMBAT WALL.
    - return,if=!player.combat

    - call_action_list,name=interrupts
    - call_action_list,name=defensives

    - tricks_of_the_trade.focus,name="Tricks of the Trade (Focus)",range_check=none,if=config.auto_tricks&focus.exists&focus.friendly&cooldown.tricks_of_the_trade.ready

    - return,if=!target.valid|target.dead|!target.attackable

    - call_action_list,name=cds,if=state.cds

    - call_action_list,name=core_dot
    # After core_dot: the target you are actually hitting keeps its bleeds
    # first, and only then does a hovered add get one.
    - call_action_list,name=multidot,if=config.multidot_mouseover
    - call_action_list,name=generate,if=combo_points<config.finisher_cp
    - call_action_list,name=spend,if=combo_points>=config.finisher_cp
